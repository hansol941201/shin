name: Windows EXE 빌드 및 배포

on:
  push:
    branches:
      - "claude/resident-ppt-auto-generator-08t86b"
    paths:
      - "app/**"
      - "run_app.py"
      - "requirements.txt"
      - "assets/**"
      - "templates/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 버전(커밋 해시) 정적 기록
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $content = "# -*- coding: utf-8 -*-`n# CI가 빌드 시점에 자동 생성함(저장소에는 커밋되지 않음). GUI의 `"빌드 버전`" 표시에 사용.`nCOMMIT = `"$sha`"`n"
          Set-Content -Path "app/_build_version.py" -Value $content -Encoding UTF8
          Get-Content "app/_build_version.py"
          echo "SHA7=$sha" >> $env:GITHUB_ENV

      - name: PyInstaller로 EXE 빌드
        run: |
          pyinstaller run_app.py `
            --name "AutoMaterialCollector" `
            --noconsole `
            --onedir `
            --clean `
            --add-data "assets;assets" `
            --add-data "templates;templates" `
            --hidden-import "PIL._tkinter_finder" `
            --hidden-import "app._build_version" `
            --collect-all "customtkinter"

      - name: 배포 폴더 구성
        run: |
          $dist = "dist/AutoMaterialCollector"
          Copy-Item "README.md" "$dist/README.md"
          Copy-Item "USER_GUIDE.md" "$dist/USER_GUIDE.md"
          Copy-Item "assets/templates/실행방법.txt" "$dist/실행방법.txt"
          New-Item -ItemType Directory -Force -Path "$dist/output" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/logs" | Out-Null

      - name: 배포용 ZIP 생성(파일명에 커밋 해시를 넣어 이전 릴리스와 구분)
        run: |
          $zipName = "AutoMaterialCollector_${{ env.SHA7 }}_Windows.zip"
          Compress-Archive -Path "dist/AutoMaterialCollector/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: PowerPoint 템플릿 ZIP 생성(디자인 검토용, 프로그램에는 이미 포함되어 있음)
        run: |
          Compress-Archive -Path "templates/*" -DestinationPath "PowerPoint_Templates.zip" -Force

      - name: 빌드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: AutoMaterialCollector-Windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 90

      - name: GitHub Release 게시(업데이트)
        uses: ncipollo/release-action@v1
        with:
          tag: windows-build
          name: "자동화 자료취합 - Windows 실행 파일"
          body: |
            더블클릭만으로 실행되는 Windows용 프로그램입니다.
            `${{ env.ZIP_NAME }}` 을 내려받아 압축 해제 후
            `AutoMaterialCollector.exe` 를 실행하세요. (Python/Git 설치 불필요)
            templates 폴더를 포함한 실행에 필요한 모든 파일이 ZIP 안에 이미
            들어 있습니다 - 별도로 받을 파일이 없습니다.

            `PowerPoint_Templates.zip` 은 프로그램이 사용하는 재도장 공종
            PowerPoint 템플릿 23개(디자인 검토/PowerPoint에서 직접 열람용)를
            따로 담은 파일입니다. 프로그램 실행 자체에는 필요 없습니다.

            커밋: ${{ github.sha }}
          artifacts: "${{ env.ZIP_NAME }},PowerPoint_Templates.zip"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
