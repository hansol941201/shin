name: Windows EXE 빌드 및 배포

on:
  push:
    branches:
      - "claude/resident-ppt-auto-generator-08t86b"
    paths:
      - "app/**"
      - "run_app.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller로 EXE 빌드
        run: |
          pyinstaller run_app.py `
            --name "AutoMaterialCollector" `
            --noconsole `
            --onedir `
            --clean `
            --add-data "assets;assets" `
            --hidden-import "PIL._tkinter_finder" `
            --collect-all "customtkinter"

      - name: 배포 폴더 구성
        run: |
          $dist = "dist/AutoMaterialCollector"
          Copy-Item "README.md" "$dist/README.md"
          Copy-Item "USER_GUIDE.md" "$dist/USER_GUIDE.md"
          Copy-Item "assets/templates/실행방법.txt" "$dist/실행방법.txt"
          New-Item -ItemType Directory -Force -Path "$dist/output" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/logs" | Out-Null

      - name: 배포용 ZIP 생성
        run: |
          Compress-Archive -Path "dist/AutoMaterialCollector/*" -DestinationPath "AutoMaterialCollector_Windows.zip" -Force

      - name: 빌드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: AutoMaterialCollector-Windows
          path: AutoMaterialCollector_Windows.zip
          retention-days: 90

      - name: GitHub Release 게시(업데이트)
        uses: ncipollo/release-action@v1
        with:
          tag: windows-build
          name: "자동화 자료취합 - Windows 실행 파일"
          body: |
            더블클릭만으로 실행되는 Windows용 프로그램입니다.
            `AutoMaterialCollector_Windows.zip` 을 내려받아 압축 해제 후
            `AutoMaterialCollector.exe` 를 실행하세요. (Python/Git 설치 불필요)

            커밋: ${{ github.sha }}
          artifacts: "AutoMaterialCollector_Windows.zip"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
