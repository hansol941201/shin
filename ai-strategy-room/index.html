<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 전략회의실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a44'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'%3EAI%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-title">AI 전략회의실</span>
      <span class="demo-badge" id="demoBadge" hidden>예시</span>
    </div>
    <div class="conn-status" id="connStatus">
      <span class="conn-dot" id="connDot"></span>
      <span class="conn-text" id="connText">확인 중...</span>
    </div>
  </div>
</header>

<main class="content">

  <!-- ============ 1. 입력 화면 ============ -->
  <section class="view" id="viewInput">
    <div class="hero">
      <h1>AI 전략회의실</h1>
      <p>주제 하나를 입력하면 내부 전문가 회의 후 실행 가능한 보고서를 만듭니다.</p>
    </div>

    <div class="card">
      <label class="field-label" for="topicInput">주제</label>
      <textarea id="topicInput" class="topic-textarea" rows="6"
        placeholder="예) 신입사원 온라인 교육 완주율이 낮습니다.&#10;실제로 완주율을 높일 현실적인 방법을 검토해주세요.&#10;(업무 자동화, 영업/매출 개선, 고객사 관리, 홍보, 비용 절감 등 어떤 업무 주제든 가능합니다)"></textarea>

      <label class="field-label" style="margin-top:20px;">참고자료</label>
      <div class="attach-row">
        <label class="attach-btn" for="fileInput">파일 추가</label>
        <input type="file" id="fileInput" multiple accept=".txt,.csv,.xlsx,.pdf,.docx" hidden />
        <span class="attach-hint">선택사항 — 자료 없이도 회의가 가능합니다. (TXT·CSV는 실제 분석, XLSX·PDF·DOCX는 준비 중)</span>
      </div>
      <div class="attach-list" id="attachList"></div>

      <div class="start-row">
        <button class="btn-primary btn-lg" id="startBtn">전략회의 시작</button>
        <button class="btn-ghost" id="exampleBtn" type="button">예시 보기</button>
      </div>
      <p class="conn-hint" id="connHint" hidden></p>
    </div>
  </section>

  <!-- ============ 2. 진행 화면 ============ -->
  <section class="view" id="viewProgress" hidden>
    <div class="progress-card">
      <h2>전략회의 진행 중</h2>
      <p class="progress-sub" id="progressModeLabel">전략회의 모드로 진행합니다.</p>
      <ul class="step-list" id="stepList"></ul>
    </div>
  </section>

  <!-- ============ 3. 결과 화면 ============ -->
  <section class="view" id="viewResult" hidden>
    <div class="result-toolbar">
      <div class="result-toolbar-left">
        <button class="btn-ghost btn-sm" id="copyBtn">복사</button>
        <button class="btn-ghost btn-sm" id="saveTxtBtn">TXT 저장</button>
        <button class="btn-ghost btn-sm" id="retryBtn">다시 회의</button>
        <button class="btn-ghost btn-sm" id="newTopicBtn">새 주제</button>
      </div>
      <button class="btn-ghost btn-sm" id="logToggleBtn">내부 회의 보기</button>
    </div>

    <div class="warning-banner" id="warningBanner" hidden></div>

    <div class="report-card" id="reportCard"></div>
  </section>

</main>

<!-- 내부 회의 로그 모달 (기본적으로 숨김) -->
<div class="modal-overlay" id="logModalOverlay">
  <div class="modal log-modal">
    <div class="modal-head">
      <h2>내부 회의 로그</h2>
      <button class="icon-btn" id="logModalClose">✕</button>
    </div>
    <p class="modal-desc">전문가들이 실제로 주고받은 반박·검증 과정입니다. 최종 보고서에는 이 중 살아남은 내용만 반영됩니다.</p>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/file-parser.js"></script>
<script src="js/data-analyzer.js"></script>
<script src="js/experts.js"></script>
<script src="js/ai-provider.js"></script>
<script src="js/report-builder.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/meeting-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
