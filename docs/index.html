<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POUR 공사실적 관리</title>
<style>
body{background:#F4F6F8;margin:0;}
/* POUR 공고 입력 · 실적표 스타일 — 기존 사이트 색상에 맞추려면 아래 변수만 바꾸면 된다. */
.pour-scope{
  --pour-accent:#1f9d55;          /* 선택된 탭 강조색 (기존 사이트 강조색으로 교체 가능) */
  --pour-accent-soft:#e7f7ee;
  --pour-border:#c9d2dc;
  --pour-head-bg:#eef2f7;
  --pour-text:#1f2937;
  --pour-muted:#6b7280;
  --pour-danger:#d92d20;
  --pour-r1:4px;                  /* 배지·작은 버튼 */
  --pour-r2:6px;                  /* 버튼·입력칸 */
  --pour-r3:8px;                  /* 카드·표 */
  color:var(--pour-text);
}

/* ------------------------------------------------------- 자동완성 */
.pour-field{position:relative;}
/* 드롭다운이 표·카드 뒤로 숨지 않도록 충분히 높은 z-index 를 준다.
   부모에 overflow:hidden 이 걸려 있으면 잘리므로 .pour-field 는 overflow 를 풀어둔다. */
.pour-field{overflow:visible;}
.pour-suggest{
  position:absolute; z-index:1000; left:0; right:0; top:100%;
  margin-top:4px; max-height:280px; overflow-y:auto;
  background:#fff; border:1px solid var(--pour-border); border-radius:var(--pour-r3);
  box-shadow:0 12px 32px rgba(15,23,42,.16); display:none; overflow-x:hidden;
}
.pour-suggest.is-open{display:block;}
.pour-suggest-item{
  padding:9px 12px; cursor:pointer; font-size:14px; line-height:1.4;
  border-bottom:1px solid #f1f4f8;
}
.pour-suggest-item:last-child{border-bottom:0;}
.pour-suggest-item:hover,
.pour-suggest-item.is-active{background:var(--pour-accent-soft);}
.pour-suggest-item .pour-sub{color:var(--pour-muted); font-size:12.5px;}
.pour-suggest-empty{padding:10px 12px; color:var(--pour-danger); font-size:13px;}

/* 선택된 특허 칩 */
.pour-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.pour-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--pour-accent-soft); border:1px solid var(--pour-accent);
  color:#14532d; border-radius:999px; padding:4px 8px 4px 11px; font-size:13px;
}
.pour-chip button{
  border:0; background:transparent; cursor:pointer; color:#14532d;
  font-size:14px; line-height:1; padding:2px 3px;
}
.pour-notice{margin-top:6px; font-size:13px; color:var(--pour-danger);}

/* ------------------------------------------------------- 실적표 */
.pour-table-wrap{
  overflow:auto;                      /* 넓으면 좌우, 길면 세로 스크롤 */
  max-height:65vh;
  border:1px solid var(--pour-border);
  border-radius:var(--pour-r3);
  -webkit-overflow-scrolling:touch;   /* 모바일에서 손가락 스크롤 */
}
.pour-table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13px; background:#fff;}
.pour-table th,
.pour-table td{
  border-right:1px solid var(--pour-border);
  border-bottom:1px solid var(--pour-border);
  padding:7px 10px; vertical-align:middle;
}
.pour-table th:last-child,
.pour-table td:last-child{border-right:0;}
.pour-table th{
  position:sticky; top:0; z-index:2;              /* 세로 스크롤 시 열 제목 고정 */
  background:var(--pour-head-bg);
  font-weight:700; text-align:center; white-space:nowrap;
  cursor:pointer; user-select:none;
}
.pour-table th .pour-sort{color:var(--pour-muted); font-size:11px; margin-left:3px;}
.pour-table td{white-space:nowrap;}
/* 공종·특허번호·공사명은 셀 안에서 줄바꿈 */
.pour-table td.pour-wrap{white-space:pre-line; min-width:150px; max-width:340px;}
.pour-table td.pour-num{text-align:right; font-variant-numeric:tabular-nums;}
.pour-table td.pour-seq{text-align:center; color:var(--pour-muted);}
.pour-table tbody tr:nth-child(even){background:#fbfcfe;}
.pour-table tbody tr:hover{background:var(--pour-accent-soft);}
.pour-empty{padding:26px; text-align:center; color:var(--pour-muted); font-size:14px;}

.pour-status{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700;}
.pour-status[data-status="낙찰"]{background:#e4f4ea; color:#12693a;}
.pour-status[data-status="유찰"]{background:#fdf0df; color:#92400e;}
.pour-status[data-status="타공법 낙찰"]{background:#f1ece4; color:#6b5233;}

/* --------------------------------------------------- 특허 탭 */
.pour-tabbar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
.pour-tabbar-scroll{
  display:flex; gap:4px; overflow-x:auto; scroll-behavior:smooth;
  flex:1; padding-bottom:4px; -webkit-overflow-scrolling:touch;
}
.pour-tab{
  flex:0 0 auto; padding:6px 13px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  background:#fff; border:1px solid var(--pour-border);
  border-radius:999px; color:var(--pour-muted);
}
.pour-tab:hover{background:var(--pour-head-bg); color:var(--pour-text);}
.pour-tab.is-active{background:var(--pour-accent); border-color:var(--pour-accent); color:#fff; font-weight:700;}
.pour-tab-nav{
  flex:0 0 auto; width:30px; height:30px; border:1px solid var(--pour-border);
  background:#fff; border-radius:var(--pour-r2); cursor:pointer; font-size:14px; line-height:1;
}
.pour-tab-search{
  flex:0 0 auto; width:150px; padding:6px 9px; font-size:13px;
  border:1px solid var(--pour-border); border-radius:6px;
}
.pour-summary{
  padding:12px 16px; margin-bottom:10px; font-size:13.5px;
  background:#fff; border:1px solid var(--pour-border); border-left:3px solid var(--pour-accent);
  border-radius:var(--pour-r3); line-height:1.6;
}
.pour-summary strong{font-size:15px;}
.pour-filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center;}
.pour-filters select,
.pour-filters input{padding:6px 9px; font-size:13px; border:1px solid var(--pour-border); border-radius:6px;}

@media (max-width:640px){
  .pour-tab-search{width:110px;}
  .pour-table-wrap{max-height:60vh;}
}

/* ------------------------------------------ POUR / 타사 특허 입력기 */
.pour-patent-editor{border:1px solid var(--pour-border); border-radius:var(--pour-r3); padding:10px 12px; background:#fff;}
.pour-kind-tabs{display:flex; gap:4px; margin-bottom:10px;}
.pour-kind-tab{
  flex:1; padding:7px 10px; font-size:13px; cursor:pointer; font-weight:600;
  background:#fff; border:1px solid var(--pour-border);
  border-radius:var(--pour-r2); color:var(--pour-muted);
}
.pour-kind-tab:hover{background:var(--pour-head-bg); color:var(--pour-text);}
.pour-kind-tab.is-active{background:var(--pour-accent); border-color:var(--pour-accent); color:#fff;}
.pour-third-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px;}
.pour-third-form label{display:block; font-size:12px; font-weight:600; margin-bottom:3px;}
.pour-add-btn{
  margin-top:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-weight:600;
  background:#fff; border:1px solid var(--pour-border); color:var(--pour-accent);
  border-radius:var(--pour-r2);
}
.pour-add-btn:hover{background:var(--pour-head-bg);}
.pour-item-list{margin-top:10px; display:flex; flex-direction:column; gap:4px;}
.pour-item-row{
  display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:13px;
  background:#fbfcfe; border:1px solid var(--pour-border); border-radius:var(--pour-r2);
}
.pour-item-no{
  flex:0 0 20px; height:20px; line-height:20px; text-align:center; font-size:11px;
  background:var(--pour-accent); color:#fff; border-radius:50%;
}
.pour-item-text{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pour-item-btn{
  flex:0 0 auto; width:24px; height:24px; font-size:11px; cursor:pointer;
  background:#fff; border:1px solid var(--pour-border); border-radius:var(--pour-r1);
}
.pour-item-btn:hover:not(:disabled){background:var(--pour-head-bg);}
.pour-item-btn:disabled{opacity:.35; cursor:not-allowed;}
.pour-item-del{color:var(--pour-danger); border-color:#f3b1a8;}
.pour-item-empty{padding:10px; text-align:center; color:var(--pour-muted); font-size:13px;}
.pour-multi-check{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:10px; font-size:13px; font-weight:400; cursor:pointer;
}
.pour-multi-check input{width:auto; flex:0 0 auto; margin:0;}
.pour-multi-badge{
  display:inline-block; margin-top:8px; padding:3px 10px; font-size:12.5px;
  font-weight:700; border-radius:999px;
}
/* 배지 색상: POUR만 파랑 · 혼합 보라 · 타사만 회색 · 번호 미확인 주황 */
.pour-multi-badge[data-badge="pour"]{background:#e6eefc; color:#1d4ed8;}
.pour-multi-badge[data-badge="mixed"]{background:#f1e7fd; color:#7e22ce;}
.pour-multi-badge[data-badge="third"]{background:#eeeff2; color:#52525b;}
.pour-multi-badge[data-badge="unknown"]{background:#fdf0df; color:#92400e;}

/* ------------------------------------------------- 공고 등록 카드 배치 */
.pour-card-title{
  display:flex; align-items:center; gap:14px;   /* 제목 바로 옆에 재공고 체크박스 */
  flex-wrap:wrap;
}
.pour-renotice{
  display:inline-flex; align-items:center; gap:5px;
  font-size:13px; font-weight:400; cursor:pointer;
  padding:6px 8px;                               /* 작게 보이되 누를 곳은 넉넉하게 */
  margin:-6px 0;
}
.pour-renotice input{width:auto; margin:0; cursor:pointer;}
.pour-required{color:var(--pour-danger);}

.pour-row{display:grid; gap:8px 10px; margin-bottom:8px;}
.pour-row-1{grid-template-columns:minmax(0,1fr);}
.pour-row-3{grid-template-columns:repeat(3, minmax(0, 1fr));}
/* 항목 수가 열 수로 나누어떨어지지 않아 빈 칸이 생기는 것을 막는다 */
.pour-row-fill{grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));}
.pour-row .span-2{grid-column:span 2;}
.pour-row .span-all{grid-column:1 / -1;}
.pour-row-4{grid-template-columns:repeat(4, minmax(0, 1fr));}
.pour-row > div{min-width:0;}                    /* 입력칸이 칸 너비를 넘지 않도록 */
.pour-row input, .pour-row select, .pour-row textarea{width:100%;}

.pour-bidtype{display:flex; gap:6px;}
.pour-bidtype-btn{
  flex:1; min-width:0; padding:7px 6px; font-size:13px; cursor:pointer;
  background:#fff; border:1px solid var(--pour-border); border-radius:5px; color:var(--pour-muted);
}
.pour-bidtype-btn.is-active{
  background:var(--pour-accent); border-color:var(--pour-accent); color:#fff; font-weight:600;
}

.pour-more{margin-bottom:12px;}
.pour-more > summary{
  cursor:pointer; font-size:13.5px; font-weight:600; color:var(--pour-accent);
  padding:9px 12px; background:var(--pour-accent-soft);
  border:1px solid var(--pour-accent); border-radius:6px; list-style:none;
}
.pour-more > summary::-webkit-details-marker{display:none;}
.pour-more > summary::before{content:"▸ "; }
.pour-more[open] > summary::before{content:"▾ "; }

.pour-actions-right{justify-content:flex-end;}

/* 태블릿: 2열 */
@media (max-width:1024px){
  .pour-row-3, .pour-row-4{grid-template-columns:repeat(2, minmax(0, 1fr));}
}
/* 모바일: 1열 */
@media (max-width:640px){
  .pour-row-3, .pour-row-4{grid-template-columns:minmax(0, 1fr);}
  .pour-card-title{gap:6px;}
  .pour-renotice{width:100%;}                    /* 제목 아래로 자연스럽게 내려간다 */
}

.pour-filter-label{
  display:inline-flex; align-items:center; gap:5px;
  font-size:12.5px; font-weight:600; color:var(--pour-muted);
}
.pour-filter-label select{font-weight:400; color:var(--pour-text);}

/* 선택된 입찰종류는 진한 네이비 */
.pour-bidtype-btn.is-active{background:#1b3a5c; border-color:#1b3a5c; color:#fff; font-weight:600;}
.pour-rebid-panel{
  padding:12px; margin-bottom:12px;
  background:#fff7e6; border:1px solid #f0a92e; border-radius:6px;
}

/* 구획 제목 — 모든 항목을 한 화면에 펼쳐 두었을 때 위치를 알려 준다 */
.pour-sub-head{
  font-size:13px; font-weight:700; color:var(--pour-text);
  margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--pour-border);
}
.pour-sub-head:first-child{margin-top:0;}

/* ==========================================================================
   POUR 공사실적 관리 — 업무용 데이터 관리 화면

   설계 원칙
     · 색은 네이비 하나로 강조하고 나머지는 회색 단계로만 구분한다
     · 간격·모서리·글자 크기는 아래 토큰만 쓴다 (그때그때 정하지 않는다)
     · 테두리는 얇게, 그림자는 떠 있어야 하는 것에만 쓴다
     · 강조 버튼은 화면당 하나 (＋ 새 공고 / 저장)
   ========================================================================== */
:root{
  /* 브랜드 */
  --navy:#17213B;         /* 진한 네이비 — 헤더·강조 버튼 */
  --navy-mid:#33415F;     /* 중간 네이비 */
  --navy-soft:#EEF1F7;    /* 네이비 계열 옅은 바탕 */

  /* 회색 단계 */
  --bg:#F4F6F8;           /* 화면 바탕 */
  --white:#FFFFFF;        /* 카드·표 바탕 */
  --head:#F1F4F8;         /* 표 머리글·구획 바탕 */
  --line:#DFE4EC;         /* 기본 경계선 */
  --line-strong:#C6CDD9;  /* 표 머리글 아래처럼 힘을 줄 경계선 */
  --text:#1B2333;
  --muted:#616D85;
  --faint:#8A94A8;

  /* 상태 */
  --ok:#137A44;
  --warn:#B45309;
  --danger:#C22B21;

  /* 간격 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;

  /* 모서리 */
  --r1:4px;   /* 입력칸·배지 */
  --r2:6px;   /* 버튼 */
  --r3:8px;   /* 카드·표 */

  /* 그림자 — 떠 있는 것에만 */
  --shadow-1:0 1px 2px rgba(23,33,59,.06);
  --shadow-2:0 12px 32px rgba(15,23,42,.18);

  /* 초점 표시 */
  --ring:0 0 0 3px rgba(23,33,59,.18);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit; font-size:14px; color:var(--text);}
:focus-visible{outline:none; box-shadow:var(--ring); border-radius:var(--r1);}

/* ------------------------------------------------------------- 상단 헤더 */
.app-header{
  display:flex; align-items:stretch;
  background:var(--navy); color:#fff;
  position:sticky; top:0; z-index:60;
}
.brand{
  display:flex; flex-direction:column; justify-content:center;
  padding:10px var(--s5) 10px var(--s4); flex:0 0 auto;
  border-right:1px solid rgba(255,255,255,.10);
}
.brand-name{font-size:14px; font-weight:800; letter-spacing:.14em;}
.brand-sub{font-size:11.5px; color:#9CA9C4; letter-spacing:.01em;}

.app-nav{display:flex; align-items:stretch; flex:1; min-width:0; overflow-x:auto;}
.app-nav::-webkit-scrollbar{height:0;}
.nav-item{
  position:relative; flex:0 0 auto; padding:0 18px;
  background:transparent; border:0; cursor:pointer;
  color:#AEB9D1; font-size:13.5px; font-weight:600; white-space:nowrap;
  transition:color .12s;
}
.nav-item::after{                       /* 밑줄 표시 — 배경색을 바꾸지 않는다 */
  content:""; position:absolute; left:14px; right:14px; bottom:0; height:2px;
  background:transparent; border-radius:2px 2px 0 0;
}
.nav-item:hover{color:#fff;}
.nav-item.is-active{color:#fff;}
.nav-item.is-active::after{background:#7FA6FF;}

.header-right{display:flex; align-items:center; gap:var(--s2); padding:0 var(--s4); flex:0 0 auto;}
.header-search{
  width:220px; padding:6px 11px; border:1px solid rgba(255,255,255,.16); border-radius:var(--r2);
  background:rgba(255,255,255,.08); color:#fff; transition:background .12s, border-color .12s;
}
.header-search::placeholder{color:#8E9AB4;}
.header-search:focus{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.34); outline:none; box-shadow:none;}
.user-chip{
  display:flex; align-items:center; gap:6px; padding:6px 11px; font-size:13px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r2); color:#fff; cursor:pointer;
}
.user-chip:hover{background:rgba(255,255,255,.18);}
.hamburger{display:none; padding:0 var(--s4); background:transparent; border:0; color:#fff; font-size:20px; cursor:pointer;}

/* ------------------------------------------------------------- 본문 */
.app-main{padding:var(--s4) var(--s4) var(--s5); max-width:1920px; margin:0 auto;}
.view{display:none;}
.view.is-active{display:block;}
.view-title{font-size:19px; font-weight:700; margin:0 0 var(--s3); letter-spacing:-.01em;}

/* 알림 — 눈에 띄되 소리치지 않게 */
.alert-bar{display:flex; flex-wrap:wrap; gap:var(--s2); margin-bottom:var(--s3);}
.alert-bar:empty{display:none;}
.alert-chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--white); border:1px solid #EBC98A; color:#8A5A11;
  border-radius:999px; box-shadow:var(--shadow-1);
  transition:background .12s, border-color .12s;
}
.alert-chip::before{content:""; width:6px; height:6px; border-radius:50%; background:#E0932A; flex:0 0 auto;}
.alert-chip:hover{background:#FFFBF3; border-color:#DDB166;}

/* 업무 확인 카드 — 그냥 넘길 알림이 아니라 손을 대야 하는 항목이다.
   빨강으로 오류창처럼 만들지 않고, 왼쪽 굵은 띠와 큰 숫자로 구분한다. */
.alert-card{
  display:inline-flex; align-items:center; gap:var(--s3);
  padding:8px 14px 8px 12px; cursor:pointer; text-align:left;
  background:var(--white); border:1px solid #E4C99A; border-left:4px solid #C8891F;
  border-radius:var(--r2); box-shadow:var(--shadow-1);
  transition:background .12s, border-color .12s;
}
.alert-card:hover{background:#FFFCF6; border-color:#D6B677; border-left-color:#A8710F;}
.alert-card-tag{
  flex:0 0 auto; padding:2px 8px; font-size:10.5px; font-weight:700; letter-spacing:.02em;
  background:#FBF1DF; color:#8A5A11; border-radius:999px; white-space:nowrap;
}
.alert-card-body{display:flex; flex-direction:column; gap:1px; min-width:0;}
.alert-card-name{font-size:13px; font-weight:700; color:var(--text); white-space:nowrap;}
.alert-card-note{font-size:11px; color:#8A5A11;}
.alert-card-count{
  flex:0 0 auto; margin-left:var(--s2);
  font-size:22px; font-weight:800; line-height:1; color:var(--navy);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.alert-card-unit{margin-left:2px; font-size:11.5px; font-weight:600; color:var(--muted);}

/* 작업 버튼 */
.toolbar{display:flex; flex-wrap:wrap; gap:var(--s2); margin-bottom:var(--s3); align-items:center;}
.tb-btn{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--navy); color:#fff; border:1px solid var(--navy); border-radius:var(--r2);
  box-shadow:var(--shadow-1); transition:background .12s, border-color .12s, color .12s;
}
.tb-btn:hover{background:var(--navy-mid); border-color:var(--navy-mid);}
.tb-btn.ghost{background:var(--white); color:var(--text); border-color:var(--line);}
.tb-btn.ghost:hover{background:var(--head); border-color:var(--line-strong);}
.tb-btn:disabled{opacity:.42; cursor:not-allowed; box-shadow:none;}
.tb-btn:disabled:hover{background:var(--navy); border-color:var(--navy);}
.tb-btn.ghost:disabled:hover{background:var(--white); border-color:var(--line);}
.toolbar .spacer{flex:1;}

/* 상태 탭 — 분절형 버튼 묶음 */
.status-tabs{
  display:inline-flex; flex-wrap:wrap; gap:2px; margin-bottom:var(--s3);
  padding:3px; background:var(--head); border:1px solid var(--line); border-radius:var(--r3);
}
.status-tab{
  padding:6px 15px; font-size:13px; font-weight:600; cursor:pointer;
  background:transparent; border:0; border-radius:var(--r2); color:var(--muted);
  transition:background .12s, color .12s;
}
.status-tab:hover{background:rgba(23,33,59,.06); color:var(--text);}
.status-tab.is-active{background:var(--white); color:var(--navy); box-shadow:var(--shadow-1);}
.status-tab .cnt{font-weight:700; margin-left:2px;}

/* ------------------------------------------------- 표 카드 (도구 + 표) */
.grid-tools{
  display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center;
  padding:var(--s2) var(--s3); background:var(--white);
  border:1px solid var(--line); border-bottom:0;
  border-radius:var(--r3) var(--r3) 0 0;
}
.grid-tools .spacer{flex:1;}
.grid-tools .tb-btn{box-shadow:none;}
.grid-search{
  width:300px; max-width:100%; padding:7px 11px;
  border:1px solid var(--line); border-radius:var(--r2); background:var(--white);
}
.grid-search:focus{border-color:var(--navy-mid); outline:none; box-shadow:var(--ring);}
.grid-count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.grid-tools select{
  min-width:130px; padding:7px 10px;
  border:1px solid var(--line); border-radius:var(--r2); background:var(--white);
}

/* ------------------------------------------------------------- 엑셀형 표 */
.grid-wrap{
  overflow:auto; max-height:calc(100vh - 300px); min-height:220px;
  border:1px solid var(--line); background:var(--white);
  border-radius:var(--r3);
  -webkit-overflow-scrolling:touch;
}
/* 도구 막대와 표를 한 장의 카드로 잇는다 */
.grid-tools + .grid-wrap,
.grid-tools + .pour-table-wrap{border-top:0; border-radius:0 0 var(--r3) var(--r3);}
.grid-tools + .pour-table-wrap{border-color:var(--line);}
.grid{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13px;}
.grid th,.grid td{
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:6px 10px; vertical-align:middle; background:var(--white);
}
.grid th:last-child,.grid td:last-child{border-right:0;}
.grid tbody tr:last-child td{border-bottom:0;}
.grid thead th{
  position:sticky; top:0; z-index:3;
  background:var(--head); font-weight:700; text-align:center; white-space:nowrap;
  color:var(--muted); letter-spacing:.01em;
  border-bottom:1px solid var(--line-strong);
  user-select:none; padding-right:16px;
}
.grid .grid-filter-row th{
  top:31px; z-index:3; padding:3px 5px; background:#FAFBFD;
  border-bottom:1px solid var(--line);
}
.grid .grid-filter-row input{
  width:100%; min-width:60px; padding:4px 6px; font-size:12px;
  border:1px solid var(--line); border-radius:var(--r1); background:var(--white);
}
/* 주요 식별 열 고정 */
.grid th.is-pinned,.grid td.is-pinned{position:sticky; z-index:2;}
.grid th.is-pinned{z-index:4;}
.grid th:nth-child(1),.grid td:nth-child(1){left:0;}
.grid th:nth-child(2),.grid td:nth-child(2){left:52px;}
.grid td.is-pinned{background:#FCFDFE;}
.grid tbody tr:nth-child(even) td{background:#FAFBFC;}
.grid tbody tr:nth-child(even) td.is-pinned{background:#F6F8FA;}
.grid tbody tr:hover td{background:var(--navy-soft);}
.grid tbody tr.is-selected td{background:#E4EAF6; box-shadow:inset 0 0 0 2px var(--navy);}
.grid td{white-space:nowrap; color:var(--text);}
.grid td.cell-wrap{white-space:normal; min-width:140px; max-width:320px;}
/* 여러 줄 값은 세 줄까지만 보여 준다. 전체 내용은 셀에 마우스를 올리면 나온다 */
.grid td.cell-wrap .cell-lines{white-space:pre-line; display:block;}
.grid td.cell-wrap .cell-lines.is-clamped{
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; position:relative;
}
.grid td.cell-wrap .cell-lines.is-clamped::after{
  content:"…"; position:absolute; right:0; bottom:0;
  padding-left:10px; background:inherit; color:var(--faint);
}
.grid td.cell-num{text-align:right; font-variant-numeric:tabular-nums;}
.grid td.cell-seq{text-align:center; color:var(--faint); font-variant-numeric:tabular-nums;}
.grid-th-label{cursor:pointer;}
.grid-sort{margin-left:3px; font-size:10px; color:var(--navy);}
.grid-filtered{margin-left:3px; font-size:10px; color:var(--warn);}
.grid-resize{
  position:absolute; top:0; right:0; width:7px; height:100%;
  cursor:col-resize; background:transparent;
}
.grid th{position:relative;}   /* 너비 조절 손잡이를 붙이기 위한 기준 */
.grid-empty{padding:40px var(--s4); text-align:center; color:var(--faint); font-size:13.5px;}

/* 상태 배지 — 테두리 없이 옅은 바탕과 진한 글자로만 */
.status-badge{
  display:inline-block; padding:2px 9px; font-size:12px; font-weight:700;
  border-radius:999px; white-space:nowrap;
}
.status-badge[data-status="낙찰"]{background:#E4F4EA; color:#12693A;}
.status-badge[data-status="공고"]{background:#E6EEFC; color:#1D4ED8;}
.status-badge[data-status="재공고"]{background:#F1E7FD; color:#7E22CE;}
.status-badge[data-status="유찰"]{background:#FDF0DF; color:#92400E;}
.status-badge[data-status="공고취소"]{background:#EEEFF2; color:#52525B;}
.status-badge[data-status="타공법 낙찰"]{background:#F1ECE4; color:#6B5233;}

.multi-badge{
  display:inline-block; margin-left:5px; padding:2px 8px; font-size:11.5px; font-weight:700;
  border-radius:999px; white-space:nowrap;
}
.multi-badge[data-badge="pour"]{background:#E6EEFC; color:#1D4ED8;}
.multi-badge[data-badge="mixed"]{background:#F1E7FD; color:#7E22CE;}
.multi-badge[data-badge="third"]{background:#EEEFF2; color:#52525B;}
.multi-badge[data-badge="unknown"]{background:#FDF0DF; color:#92400E;}

/* ------------------------------------------------- 오른쪽 슬라이드 패널 */
.panel-back{
  position:fixed; inset:0; background:rgba(15,23,42,.38); z-index:80;
  display:none;
}
.panel-back.is-open{display:block;}
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(920px, 100%);
  background:var(--white); box-shadow:var(--shadow-2);
  z-index:81; display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .18s ease-out;
}
.panel.is-open{transform:translateX(0);}
.panel-head{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s3) var(--s4); background:var(--white); border-bottom:1px solid var(--line);
}
.panel-title{font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;}
.panel-head .spacer{flex:1;}
.panel-close{
  width:30px; height:30px; font-size:14px; cursor:pointer; color:var(--muted);
  background:var(--white); border:1px solid var(--line); border-radius:var(--r2);
}
.panel-close:hover{background:var(--head); color:var(--text);}
.panel-body{flex:1; overflow-y:auto; padding:var(--s3) var(--s4) var(--s5);}
.panel-foot{
  display:flex; justify-content:flex-end; gap:var(--s2);
  padding:var(--s3) var(--s4); background:var(--white); border-top:1px solid var(--line);
}
.rebid-check{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
  padding:5px 10px; background:var(--head); border:1px solid var(--line); border-radius:var(--r2);
  cursor:pointer;
}
.rebid-check input{width:auto; cursor:pointer;}

/* 입력 폼 */
.form-row{display:grid; gap:var(--s2) var(--s3); margin-bottom:var(--s2);}
.form-row-1{grid-template-columns:minmax(0,1fr);}
.form-row-3{grid-template-columns:repeat(3, minmax(0, 1fr));}
/* 항목 수가 열 수로 나누어떨어지지 않아 빈 칸이 생기는 것을 막는다 */
.form-row-fill{grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));}
.form-row .span-2{grid-column:span 2;}
.form-row .span-all{grid-column:1 / -1;}
.form-row-4{grid-template-columns:repeat(4, minmax(0, 1fr));}
.form-row > div{min-width:0;}
.form-row label{
  display:block; font-size:12px; font-weight:600; margin-bottom:3px;
  line-height:1.3; color:var(--muted);
}
.form-row .opt{font-weight:400; color:var(--faint);}
.form-row .req{color:var(--danger);}
.form-row input,.form-row select,.form-row textarea{
  width:100%; padding:6px 9px; font-size:13.5px; line-height:1.4;
  border:1px solid var(--line); border-radius:var(--r2); background:var(--white);
  transition:border-color .12s, box-shadow .12s;
}
/* 체크박스는 칸 전체 너비를 먹으면 안 된다 (글자 옆에 붙어야 한다) */
.form-row input[type="checkbox"],.form-row input[type="radio"]{width:auto; margin:0;}
.form-row input:hover,.form-row select:hover,.form-row textarea:hover{border-color:var(--line-strong);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{
  border-color:var(--navy-mid); outline:none; box-shadow:var(--ring);
}
/* 날짜 칸이 다른 칸보다 커지지 않게 높이를 맞춘다 */
.form-row input[type="date"]{min-height:0; height:31px;}
.form-row textarea{min-height:48px; resize:vertical;}
.field-error{display:block; margin-top:3px; font-size:11.5px; color:var(--danger);}
.form-msg{font-size:13px; white-space:pre-line; margin-top:var(--s2);}
.form-msg.error{color:var(--danger);}
.form-msg.ok{color:var(--ok);}

.bid-group{display:flex; gap:var(--s1);}
.bid-btn{
  flex:1; min-width:0; padding:6px; cursor:pointer; font-size:13px;
  background:var(--white); border:1px solid var(--line); border-radius:var(--r2); color:var(--muted);
  transition:background .12s, border-color .12s, color .12s;
}
.bid-btn:hover{border-color:var(--line-strong); color:var(--text);}
.bid-btn.is-active{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;}

/* ------------------------------------------------- 공종 선택 */
/* 대분류 탭 + 세부 공종 체크 배지. 좁은 화면에서는 자연스럽게 다음 줄로 넘어간다. */
.cat-picker{
  --cat-line:#CBD2DC;                 /* 고르지 않은 탭·배지 테두리 */
  border:1px solid var(--cat-line); border-radius:var(--r3);
  padding:var(--s3) var(--s4) var(--s4); background:var(--white);
}
.cat-title{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--s2);
  font-size:13px; font-weight:700; color:var(--text);
  margin-bottom:var(--s3); padding-bottom:var(--s2);
  border-bottom:1px solid var(--line);
}
.cat-title-hint{font-size:12px; font-weight:400; color:var(--faint);}

/* 1. 대분류 탭 */
.cat-groups{display:flex; flex-wrap:wrap; gap:var(--s1); margin-bottom:var(--s3);}
.cat-group{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--white); border:1px solid var(--cat-line); border-radius:var(--r2);
  color:var(--text);
  transition:background .12s, border-color .12s, color .12s;
}
.cat-group:hover{background:var(--head);}
.cat-group.is-open{background:var(--navy); border-color:var(--navy); color:#fff;}
.cat-group-count{
  min-width:18px; padding:0 5px; font-size:11px; font-weight:700; text-align:center;
  background:var(--navy-soft); color:var(--navy); border-radius:999px;
}
.cat-group.is-open .cat-group-count{background:rgba(255,255,255,.24); color:#fff;}

/* 2. 세부 공종 체크 배지 */
.cat-items{display:flex; flex-wrap:wrap; gap:var(--s1) 6px; min-height:32px;}
.cat-item{
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 13px; font-size:13px; cursor:pointer;
  background:var(--white); border:1px solid var(--cat-line); border-radius:999px;
  color:var(--text);
  transition:background .12s, border-color .12s, color .12s;
}
.cat-item:hover{background:var(--head);}
.cat-item.is-on{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;}
.cat-item-check{
  display:inline-block; width:0; overflow:hidden; font-size:11px; line-height:1;
  transition:width .12s;
}
.cat-item.is-on .cat-item-check{width:10px;}
.cat-item-auto{
  padding:1px 7px; font-size:10.5px; font-weight:700; border-radius:999px;
  background:var(--navy-soft); color:var(--navy);
}
.cat-item.is-on .cat-item-auto{background:rgba(255,255,255,.24); color:#fff;}
.cat-hint{font-size:12.5px; color:var(--faint); align-self:center;}

/* 3. 기타 — 직접 입력 */
.cat-custom{display:flex; gap:var(--s2); margin-top:var(--s2);}
.cat-custom-input{
  flex:1; min-width:0; padding:6px 10px; font-size:13px;
  border:1px solid var(--cat-line); border-radius:var(--r2); background:var(--white);
}
.cat-custom-btn{
  flex:0 0 auto; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--white); border:1px solid var(--cat-line); border-radius:var(--r2);
  color:var(--navy);
}
.cat-custom-btn:hover{background:var(--head);}

/* 4. 선택 요약 */
.cat-summary{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--s1) var(--s3);
  margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line);
  font-size:12.5px;
}
.cat-summary-label{font-weight:700; color:var(--muted);}
.cat-summary-label::after{content:":";}
.cat-summary-part{display:inline-flex; align-items:baseline; gap:5px;}
.cat-summary-group{color:var(--navy); font-weight:700;}
.cat-summary-dot{color:var(--faint);}
.cat-summary-names{color:var(--text);}
.cat-summary-empty{color:var(--faint);}

.rebid-box{
  padding:var(--s3); margin-bottom:var(--s3);
  background:#FFFBF3; border:1px solid #EBC98A; border-radius:var(--r3);
}

/* 구획 이름 — 패널이 길어도 스크롤 중에 위치를 알 수 있게 */
.sub-head{
  font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--faint);
  margin:var(--s4) 0 var(--s2); padding:var(--s1) 0;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:5; background:var(--white);
}
.sub-head:first-child{margin-top:0;}

/* 새 공고 등록에서는 감추고 상세 수정에서만 보이는 항목.
   (상태는 자동으로 "공고", 시공사·시공사 전화번호는 낙찰 전환 패널에서 입력한다)
   자료와 목록 열은 그대로 두고 입력 화면에서만 감춘다. */
#noticePanel:not(.is-edit) .edit-only{display:none;}

/* 수정 이력 */
.pour-history,#editHistory{font-size:12.5px; color:var(--muted);}

/* ------------------------------------------------------------- 카드 묶음 */
/* 가져오기·내보내기, 설정처럼 표가 없는 화면의 구획 */
.view:not(#view-records):not(#view-patents) .form-row{max-width:1100px;}

/* 가져오기 미리보기 */
.preview-stats{
  display:flex; flex-wrap:wrap; gap:var(--s5); margin:var(--s3) 0; font-size:13px;
  padding:var(--s3) var(--s4); background:var(--white);
  border:1px solid var(--line); border-radius:var(--r3);
  color:var(--muted);
}
.preview-stats b{display:block; font-size:20px; color:var(--text); font-variant-numeric:tabular-nums;}
.preview-errors{
  margin:var(--s2) 0 0; padding:var(--s2) var(--s3) var(--s2) var(--s5);
  font-size:12.5px; color:var(--danger); max-height:160px; overflow-y:auto;
  background:#FDF3F2; border:1px solid #F2C9C5; border-radius:var(--r3);
}

/* ------------------------------------------------------------ 특허별 실적 */
.sheet-tabs{display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s3);}
.sheet-scroll{display:flex; gap:var(--s1); overflow-x:auto; flex:1; padding-bottom:2px;}
.sheet-scroll::-webkit-scrollbar{height:6px;}
.sheet-scroll::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:3px;}
.sheet-tab{
  flex:0 0 auto; padding:6px 13px; font-size:12.5px; white-space:nowrap; cursor:pointer;
  background:var(--white); border:1px solid var(--line); border-radius:999px; color:var(--muted);
  transition:background .12s, border-color .12s, color .12s;
}
.sheet-tab:hover{border-color:var(--line-strong); color:var(--text);}
.sheet-tab.is-active{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700;}
.sheet-nav{
  flex:0 0 auto; width:30px; height:30px; color:var(--muted);
  background:var(--white); border:1px solid var(--line); border-radius:var(--r2); cursor:pointer;
}
.sheet-nav:hover{background:var(--head);}
.sheet-search{flex:0 0 auto; width:160px; padding:6px 10px; border:1px solid var(--line); border-radius:var(--r2);}
.summary-bar{
  padding:var(--s3) var(--s4); margin-bottom:var(--s3); font-size:13px; color:var(--muted);
  background:var(--white); border:1px solid var(--line); border-left:3px solid var(--navy);
  border-radius:var(--r3);
}
.summary-bar strong{font-size:15px; color:var(--text);}

/* ------------------------------------------------- 특허 입력기 밀도 */
.pour-patent-editor{padding:var(--s3); border-radius:var(--r3);}
.pour-kind-tabs{margin-bottom:var(--s2);}
.pour-kind-tab{padding:6px 12px; font-size:12.5px;}
.pour-third-form{gap:var(--s2);}
.pour-third-form label{font-size:11.5px; margin-bottom:3px;}
.pour-add-btn{margin-top:var(--s2); padding:5px 11px; font-size:12.5px;}
.pour-item-list{margin-top:var(--s2); gap:var(--s1);}
.pour-item-row{padding:5px 9px; font-size:12.5px; border-radius:var(--r2);}
.pour-item-btn{width:22px; height:22px;}
.pour-multi-check{margin-top:var(--s2); font-size:12.5px;}
.pour-multi-badge{margin-top:var(--s2); padding:2px 10px; font-size:12px;}
.pour-suggest-item{padding:7px 11px; font-size:13px;}

/* 공용 모듈(특허 입력기·자동완성)의 강조색을 이 화면의 네이비로 맞춘다 */
.pour-scope{
  --pour-accent:#17213B;
  --pour-accent-soft:#EEF1F7;
  --pour-border:#DFE4EC;
  --pour-head-bg:#F1F4F8;
  --pour-text:#1B2333;
  --pour-muted:#616D85;
}

/* 자동완성 드롭다운 — 표·카드 뒤로 숨지 않도록 충분히 높게 */
.pour-field{position:relative; overflow:visible;}
.pour-suggest{z-index:2000;}

/* ------------------------------------------------------------- 반응형 */
@media (max-width:1024px){
  .form-row-3,.form-row-4{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .header-search{width:150px;}
  .toolbar{overflow-x:auto;}
  .grid-search{width:220px;}
}
@media (max-width:640px){
  .hamburger{display:block;}
  .app-nav{
    display:none; position:absolute; top:100%; left:0; right:0;
    flex-direction:column; background:var(--navy-mid); box-shadow:var(--shadow-2);
  }
  .app-nav.is-open{display:flex;}
  .nav-item{padding:13px 18px; border-bottom:1px solid rgba(255,255,255,.10); text-align:left;}
  .nav-item::after{display:none;}
  .app-header{position:relative; flex-wrap:wrap;}
  .brand{border-right:0;}
  .header-right{padding:var(--s2) var(--s3);}
  .header-search{width:120px;}
  .app-main{padding:var(--s3) var(--s3) var(--s5);}
  .form-row-3,.form-row-4{grid-template-columns:minmax(0, 1fr);}
  .toolbar{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tb-btn{flex:0 0 auto;}
  .grid-wrap{max-height:calc(100vh - 330px);}
  .panel{width:100%;}
  .status-tabs{display:flex; width:100%; overflow-x:auto;}
  /* 공종 선택 — 탭과 배지가 자연스럽게 다음 줄로 넘어간다 */
  .cat-picker{padding:var(--s3);}
  .cat-group{flex:1 1 auto; justify-content:center; padding:7px 10px;}
  .cat-custom{flex-wrap:wrap;}
  .cat-custom-input{flex:1 1 100%;}
  .cat-summary{flex-direction:column; gap:var(--s1);}
}

</style>
</head>
<body>
<div class="pour-scope">

<header class="app-header">
  <div class="brand">
    <span class="brand-name">NETFORM</span>
    <span class="brand-sub">POUR 공사실적 관리</span>
  </div>
  <button type="button" class="hamburger" id="navToggle" title="메뉴">☰</button>
  <nav class="app-nav" id="appNav">
    <button type="button" class="nav-item is-active" data-view="records">공고·실적</button>
    <button type="button" class="nav-item" data-view="patents">특허별 실적</button>
    <button type="button" class="nav-item" data-view="io">가져오기·내보내기</button>
    <button type="button" class="nav-item" data-view="settings">설정</button>
  </nav>
  <div class="header-right">
    <input type="search" class="header-search" id="globalSearch" placeholder="전체 검색" />
    <button type="button" class="user-chip" id="userChip">업무 관리</button>
  </div>
</header>

<div style="padding:8px 16px 0">
  <div class="alert-chip" style="cursor:default;background:#EEF3FB;border-color:#33415F;color:#17213B">
    미리보기입니다 — 자료가 들어 있고, 입력한 자료는 이 브라우저에만 남습니다.
    엑셀 내려받기는 미리보기에서 동작하지 않습니다.
  </div>
</div>
<main class="app-main">

  <!-- ========================================================= 공고·실적 -->
  <section class="view is-active" id="view-records">
    <div class="alert-bar" id="alertBar"></div>

    <!-- 강조 버튼은 하나만 둔다. 나머지는 조용한 보조 버튼. -->
    <div class="toolbar">
      <button type="button" class="tb-btn" id="btnNewNotice">＋ 새 공고</button>
      <button type="button" class="tb-btn ghost" id="btnImport">엑셀 가져오기</button>
      <button type="button" class="tb-btn ghost" id="btnExport">엑셀 내보내기</button>
      <button type="button" class="tb-btn ghost" id="btnReport">보고서 만들기</button>
      <button type="button" class="tb-btn ghost" id="btnPatentData">특허자료 관리</button>
      <span class="spacer"></span>
      <button type="button" class="tb-btn ghost" id="btnRefresh" title="새로고침">↻ 새로고침</button>
    </div>

    <div class="status-tabs" id="statusTabs"></div>

    <div class="grid-tools">
      <input type="search" class="grid-search" id="gridSearch"
             placeholder="아파트명·공사명·지역·시공사·특허번호 검색" />
      <button type="button" class="tb-btn ghost" id="btnFilterRow">필터</button>
      <button type="button" class="tb-btn ghost" id="btnClearFilter">필터 해제</button>
      <button type="button" class="tb-btn ghost" id="btnSortReset">정렬 초기화</button>
      <span class="spacer"></span>
      <span class="grid-count" id="gridCount"></span>
      <button type="button" class="tb-btn ghost" id="btnDetail" disabled>상세·수정</button>
      <button type="button" class="tb-btn" id="btnToAward" disabled>낙찰로 변경</button>
    </div>
    <div id="recordsGrid"></div>
  </section>

  <!-- ===================================================== 특허별 실적 -->
  <section class="view" id="view-patents">
    <h2 class="view-title">특허별 실적</h2>
    <div class="status-tabs" id="patentViewTabs">
      <button type="button" class="status-tab is-active" data-pview="pour">POUR 특허별 실적</button>
      <button type="button" class="status-tab" data-pview="third">타사 특허별 현황</button>
      <button type="button" class="status-tab" data-pview="multi">다특허 현황</button>
    </div>
    <div id="sheetTabs" class="sheet-tabs"></div>
    <div class="summary-bar" id="patentSummary"></div>
    <div class="grid-tools">
      <select id="patentStatusFilter"></select>
      <select id="patentRegionFilter"><option>전체</option></select>
      <input type="search" class="grid-search" id="patentKeyword" placeholder="발주처·공사명 검색" />
      <span class="spacer"></span>
      <button type="button" class="tb-btn" id="btnPatentExcel">특허별 실적 엑셀</button>
    </div>
    <div id="patentGrid"></div>
    <div id="thirdGrid" style="display:none"></div>
    <div id="multiGrid" style="display:none"></div>
  </section>

  <!-- ================================================ 가져오기·내보내기 -->
  <section class="view" id="view-io">
    <h2 class="view-title">가져오기·내보내기</h2>

    <div class="sub-head">엑셀 가져오기</div>
    <div class="form-row form-row-3">
      <div>
        <label for="importKind">어떤 자료인가요?</label>
        <select id="importKind">
          <option value="patents">POUR 특허 관리 자료</option>
          <option value="records">공고·실적 자료</option>
        </select>
      </div>
      <div>
        <label for="importFile">파일 선택 <span class="opt">(.xlsx · .csv)</span></label>
        <input type="file" id="importFile" accept=".xlsx,.csv" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button type="button" class="tb-btn ghost" id="btnSampleImport">예시 자료로 미리보기</button>
      </div>
    </div>
    <div id="importPreview"></div>

    <div class="sub-head">엑셀 내보내기</div>
    <div class="toolbar">
      <button type="button" class="tb-btn" data-export="전체">전체 실적</button>
      <button type="button" class="tb-btn" data-export="현재필터">현재 필터 결과</button>
      <button type="button" class="tb-btn" data-export="선택">선택한 행</button>
      <button type="button" class="tb-btn" data-export="낙찰">낙찰 실적</button>
      <button type="button" class="tb-btn" data-export="공고">공고 실적</button>
      <button type="button" class="tb-btn" data-export="재공고(유찰)">재공고·유찰</button>
      <button type="button" class="tb-btn" data-export="특허별">특허별 실적</button>
    </div>
    <div class="form-msg" id="exportMsg"></div>
  </section>

  <!-- =========================================================== 설정 -->
  <section class="view" id="view-settings">
    <h2 class="view-title">설정</h2>
    <div class="sub-head">등록된 POUR 특허</div>
    <div class="form-row form-row-3">
      <div>
        <label for="patentListSearch">특허 검색</label>
        <input type="search" id="patentListSearch" placeholder="특허번호 · 특허명 · 공종" />
      </div>
    </div>
    <div id="patentListGrid"></div>
  </section>

</main>

<!-- ================================================ 새 공고 / 수정 패널 -->
<div class="panel-back" id="panelBack"></div>
<aside class="panel" id="noticePanel" aria-hidden="true">
  <div class="panel-head">
    <h3 class="panel-title" id="panelTitle">새 공고 등록</h3>
    <label class="rebid-check"><input type="checkbox" id="isRebid" /> 재공고 건</label>
    <span class="spacer"></span>
    <button type="button" class="panel-close" id="panelClose" title="닫기">✕</button>
  </div>

  <div class="panel-body">
    <div class="rebid-box" id="rebidBox" style="display:none">
      <div class="form-row form-row-4">
        <div class="pour-field">
          <label for="rebidSearch">기존 공고 검색</label>
          <input type="text" id="rebidSearch" placeholder="단지명·공사명·도시" autocomplete="off" />
        </div>
        <div><label for="rebidTarget">기존 공고 선택</label><select id="rebidTarget"></select></div>
        <div><label for="rebidRound">재공고 차수 <span class="opt">(자동)</span></label><input type="text" id="rebidRound" readonly /></div>
        <div><label for="previousFailDate">이전 유찰일</label><input type="date" id="previousFailDate" /></div>
      </div>
      <div class="form-row form-row-1">
        <div><label for="rebidReason">재공고 사유</label><input type="text" id="rebidReason" placeholder="예: 응찰 없음" /></div>
      </div>
    </div>

    <div class="sub-head">기본 정보</div>
    <div class="form-row form-row-3" id="rowBasic">
      <div><label for="fClient">아파트·단지명</label><input type="text" id="fClient" /></div>
      <div class="span-2"><label for="fProjects">공사명 <span class="opt">(여러 건은 줄바꿈)</span></label><textarea id="fProjects" rows="2"></textarea></div>
    </div>

    <div class="form-row form-row-1" id="rowCategories">
      <div><div id="categoryPicker"></div></div>
    </div>

    <div class="sub-head">지역·연락처</div>
    <div class="form-row form-row-4" id="rowRegion">
      <div><label for="fRegion">지역 <span class="opt">(도시 입력 시 자동)</span></label><select id="fRegion"><option value="">—</option></select></div>
      <div class="pour-field"><label for="fCity">도시</label><input type="text" id="fCity" placeholder="예: 하남, 금산, 평택" autocomplete="off" /></div>
      <div><label for="fPhone">전화번호 <span class="opt">(선택)</span></label><input type="text" id="fPhone" /></div>
      <div><label for="fHouseholds">세대수 <span class="opt">(선택)</span></label><input type="text" id="fHouseholds" /></div>
    </div>

    <div class="sub-head">일정·입찰</div>
    <div class="form-row form-row-4" id="rowSchedule">
      <div><label for="fNoticeDate">공고일 <span class="req">*</span></label><input type="date" id="fNoticeDate" /></div>
      <div><label for="fDueDate">서류 마감일 <span class="opt">(선택)</span></label><input type="date" id="fDueDate" /></div>
      <div><label for="fBidDate">개찰일 <span class="opt">(선택)</span></label><input type="date" id="fBidDate" /></div>
      <div>
        <label>입찰종류</label>
        <div class="bid-group" id="bidGroup">
          <button type="button" class="bid-btn" data-bid="서류접수">서류접수</button>
          <button type="button" class="bid-btn" data-bid="전자입찰">전자입찰</button>
        </div>
      </div>
    </div>

    <div class="sub-head">적용 특허</div>
    <div class="form-row form-row-1">
      <div>
        <label>POUR 특허와 타사 특허를 나누어 입력합니다</label>
        <div id="patentEditor"></div>
      </div>
    </div>

    <div class="edit-only" id="patentAgreementBox">
      <div class="sub-head">특허·협약 정보</div>
      <div class="form-row form-row-fill">
        <div class="span-2"><label for="fNoticePatent">공고문 특허·공법 원문</label><input type="text" id="fNoticePatent" placeholder="공고문에 적힌 특허번호·특허명·공법명" /></div>
        <div><label for="fAgreement">협약서 발행번호</label><input type="text" id="fAgreement" /></div>
      </div>
    </div>

    <div class="sub-head">공사 내용</div>
    <div class="form-row form-row-fill">
      <div class="span-2"><label for="fScopes">공사범위 <span class="opt">(여러 건은 줄바꿈)</span></label><textarea id="fScopes" rows="2"></textarea></div>
      <div class="span-2"><label for="fAddress">나머지 주소</label><input type="text" id="fAddress" /></div>
      <div class="edit-only"><label for="fQuality">공사 품질</label><input type="text" id="fQuality" list="qualityList" /><datalist id="qualityList"></datalist></div>
      <div class="edit-only"><label for="fStatus">상태</label><select id="fStatus"></select></div>
      <div class="edit-only"><label for="fContractor">시공사 <span class="opt">(낙찰 전환에서 입력)</span></label><input type="text" id="fContractor" /></div>
      <div class="edit-only span-2"><label for="fRemark">비고</label><input type="text" id="fRemark" /></div>
    </div>

    <div id="editHistory" class="form-msg"></div>
    <div class="form-msg" id="panelMsg"></div>
  </div>

  <div class="panel-foot">
    <button type="button" class="tb-btn ghost" id="panelCancel">취소</button>
    <button type="button" class="tb-btn" id="panelSave">공고 등록</button>
  </div>
</aside>

<!-- ============================================== 낙찰 상세정보 입력 -->
<div class="panel-back" id="awardBack"></div>
<aside class="panel" id="awardPanel" aria-hidden="true">
  <div class="panel-head">
    <h3 class="panel-title">낙찰 상세정보 입력</h3>
    <span class="spacer"></span>
    <button type="button" class="panel-close" id="awardClose" title="닫기">✕</button>
  </div>
  <div class="panel-body">
    <div class="summary-bar" id="awardSummary"></div>
    <div class="sub-head">시공사 정보</div>
    <div class="form-row form-row-fill" id="awardContractorFields"></div>
    <div class="sub-head">낙찰 정보</div>
    <div class="form-row form-row-fill" id="awardInfoFields"></div>
    <div class="sub-head">적용 특허</div>
    <div id="awardPatentEditor"></div>
    <div class="form-msg" id="awardMsg"></div>
  </div>
  <div class="panel-foot">
    <button type="button" class="tb-btn ghost" id="awardCancel">취소</button>
    <button type="button" class="tb-btn" id="awardSave">낙찰로 저장</button>
  </div>
</aside>

  function normalizePatentItem(input, kind) {

   * (기존 자료를 지우지 않고 새 구조로 옮기기 위한 경로)
   */
  function buildPatentItems(r) {
    var out = [], seen = {};

    function push(item) {
      if (!item) return;
      var key = item.kind + ":" + item.number;
      if (seen[key]) return;            // 같은 구분 안에서 같은 번호는 한 번만
      seen[key] = true;
      out.push(item);
    }

    if (Array.isArray(r.patentItems)) {

      toList(r.patentNumbers).forEach(function (n, i) {
        push(normalizePatentItem({ number: n, name: names[i] || "" }, POUR));
      });
      toList(r.thirdPatentNumbers).forEach(function (n) {
        push(normalizePatentItem({ number: n }, THIRD));
      });
    }
    return out;
  }
