    agreementNo: "협약서 발행번호", scope: "공사 범위", address: "주소",
    remark: "비고", patentConfirmed: "특허번호 직접 확인",
    contractorPhone: "시공사 전화번호", contractorContactName: "시공사 담당자명",
    contractorMobile: "담당자 휴대전화", contractorAddress: "시공사 주소",
    contractorBusinessNo: "사업자등록번호", contractorNote: "시공사 비고",
    thirdPatentNumbers: "타사 특허번호", noticeMultiFlag: "공고문 다특허 기재"
  };

  var idSeq = 0;
  function createId() {
    idSeq++;
    return "rec-" + Date.now().toString(36) + "-" + idSeq.toString(36);
  }

  // 특허 확인 상태를 계산할 때 참고할 특허 자료 저장소 (Node 테스트에서 갈아끼울 수 있게 둔다)
  var patentStorageRef = null;
  function usePatentStorage(storage) { patentStorageRef = storage || null; }

  function itemsOfKind(record, kind) {
    return ((record && record.patentItems) || []).filter(function (it) { return it.kind === kind; });
  }

  /** 화면 표시용 문자열. 여러 값은 줄바꿈으로 잇는다 (쉼표로 길게 붙이지 않는다). */
  function displayValue(record, column, index) {
    var stats;
    switch (column.type) {
      case "thirdNumbers":
        return itemsOfKind(record, THIRD).map(function (it) { return it.display; }).join("\n");
      case "thirdNames":
        return itemsOfKind(record, THIRD)
          .map(function (it) { return it.name || it.method; }).filter(Boolean).join("\n");
      case "thirdCompanies":
        return itemsOfKind(record, THIRD)
          .map(function (it) { return it.company; }).filter(Boolean).join("\n");
      case "patentKind": {
        var pour = itemsOfKind(record, POUR).length, third = itemsOfKind(record, THIRD).length;
        if (pour && third) return "POUR·타사";
        if (pour) return "POUR";
        if (third) return "타사";
        return "";
      }
      case "statNumber":
        stats = patentStats(record, patentStorageRef);
        return String(column.key === "__pourCount" ? stats.pourCount
          : column.key === "__thirdCount" ? stats.thirdCount : stats.totalCount);
      case "multiLabel":
        stats = patentStats(record, patentStorageRef);
        return stats.label ? stats.label + (stats.isMulti ? " (" + stats.detail + ")" : "") : "";
      case "patentStatus":
        return patentStats(record, patentStorageRef).status;
      case "categoryPairs":
        return PourCategories.labelsOf(record.categoryItems).join("\n");
      case "agreementStage":
        return agreementStage(record);
    }
    switch (column.type) {
      case "seq":    return String((index || 0) + 1);
      case "patent": return (record.patentNumbers || []).map(PourPatents.formatNumber).join("\n");
      case "list":   return (record[column.key] || []).join("\n");
      case "number": return record[column.key] === "" || record[column.key] == null
                       ? "" : Number(record[column.key]).toLocaleString("ko-KR");
      case "money":  return record[column.key] === "" || record[column.key] == null
                       ? "" : Number(record[column.key]).toLocaleString("ko-KR");
      case "phone":  return String(record[column.key] == null ? "" : record[column.key]);
      default:       return String(record[column.key] == null ? "" : record[column.key]);
    }
  }

  /** 엑셀 내보내기용 값. 세대수·금액은 숫자로, 전화번호는 문자열로 넘긴다. */
  function exportValue(record, column, index) {
    switch (column.type) {
      case "seq":    return (index || 0) + 1;
      case "number":
      case "money":  return record[column.key] === "" || record[column.key] == null
                       ? null : Number(record[column.key]);
      case "statNumber": return Number(displayValue(record, column, index));
      case "phone":  return String(record[column.key] == null ? "" : record[column.key]);
      default:       return displayValue(record, column, index);
    }
  }

  /* --------------------------------------------------------- 저장소 */

  function store(storage) {
    return storage || (typeof localStorage !== "undefined" ? localStorage : null);
  }

  function list(storage) {
    var s = store(storage);
    if (!s) return [];
    try {
      var raw = s.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalize) : [];
    } catch (e) { return []; }
  }

  function writeAll(records, storage) {
    var s = store(storage);
    if (!s) return records;
    try { s.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (e) {}
    return records;
  }

  /** 새 공고를 등록하거나 기존 현장을 갱신한다. id가 같으면 언제나 같은 행을 고친다. */
  function save(input, storage) {
    var record = normalize(input);
    var all = list(storage);
    var at = -1;
    for (var i = 0; i < all.length; i++) { if (all[i].id === record.id) { at = i; break; } }
    if (at >= 0) all[at] = record; else all.push(record);
    writeAll(all, storage);
    return record;
  }

  /**
   * 여러 건을 한 번에 넣는다. (엑셀에서 옮겨 올 때 씀)
   * id 가 같으면 그 행을 갱신하고, 없으면 뒤에 붙인다. 기존 행은 지우지 않는다.
   * 저장은 마지막에 한 번만 하므로 수천 건이어도 빠르다.
   */
  function saveMany(inputs, storage) {
    var all = list(storage);
    var at = {};
    all.forEach(function (r, i) { at[r.id] = i; });
    var saved = [];
    (inputs || []).forEach(function (input) {
      var record = normalize(input);
      if (at[record.id] != null) all[at[record.id]] = record;
      else { at[record.id] = all.length; all.push(record); }
      saved.push(record);
    });
    writeAll(all, storage);
    return saved;
  }

  /**
   * 공고를 낙찰로 바꾼다. 새 행을 만들지 않고 같은 행을 갱신한다.
   * 시공사는 낙찰 처리 시 반드시 있어야 한다.
   */
  function award(id, payload, storage) {
    var all = list(storage);
    var at = -1;
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) { at = i; break; } }
    if (at < 0) return { ok: false, message: "해당 현장을 찾지 못했습니다." };

    var data = payload || {};
    var target = all[at];

    // 낙찰 필수 항목: 낙찰일 · 시공사 · 낙찰금액 · 최종 공종
    var missing = [];
    var contractor = String(data.contractor != null ? data.contractor : target.contractor).trim();
    var awardDate = String(data.awardDate != null ? data.awardDate : target.awardDate).trim();
    var awardAmount = data.awardAmount != null && data.awardAmount !== ""
      ? toNumber(data.awardAmount) : target.awardAmount;
    // 최종 공종: 항목(대분류+세부)을 넘겼으면 거기서 이름을 뽑고,
    // 이름만 넘겼으면 그 이름을 쓴다. 둘 다 없으면 원래 값을 그대로 둔다.
    var categories = data.categoryItems != null ? PourCategories.namesOf(data.categoryItems)
      : data.categories != null ? toList(data.categories)
      : target.categories;

    var contractorPhone = String(
      data.contractorPhone != null ? data.contractorPhone : target.contractorPhone).trim();
    var agreementNo = String(
      data.agreementNo != null ? data.agreementNo : target.agreementNo).trim();

    // 협약서 발행번호가 있으면 그것만으로 낙찰 정리를 시작할 수 있다.
    // 나머지 낙찰 정보는 나중에 채우고, 그동안 "추가 입력 필요" 알림에 남는다.
    var fields = {};
    if (!agreementNo) {
      if (!contractor) { missing.push("시공사명"); fields.contractor = "시공사명을 입력해 주세요."; }
      if (!contractorPhone) {
        missing.push("시공사 전화번호");
        fields.contractorPhone = "시공사 전화번호를 입력해 주세요.";
      }
      if (!awardDate) { missing.push("낙찰일"); fields.awardDate = "낙찰일을 입력해 주세요."; }
      if (awardAmount === "" || awardAmount == null) {
        missing.push("낙찰금액");
        fields.awardAmount = "낙찰금액을 입력해 주세요.";
      }
      if (!categories.length) {
        missing.push("최종 공종");
        fields.categories = "최종 공종을 입력해 주세요.";
      }
      if (missing.length) {
        return {
          ok: false, fields: fields,
          message: "협약서 발행번호를 넣으면 나머지는 나중에 채울 수 있습니다.\n" +
            "번호가 아직 없다면 시공사명, 시공사 전화번호, 낙찰일, 낙찰금액, 최종 공종을 입력해 주세요."
        };
      }
    }

    // POUR 적용 특허번호는 없어도 저장을 막지 않는다. 확인만 받는다.
    // 특허 항목을 함께 넘겼다면 그쪽이 최신이므로 거기서 POUR 번호를 다시 뽑는다.
    var patentNumbers;
    if (data.patentItems != null) {
      patentNumbers = data.patentItems
        .filter(function (it) { return it && it.kind !== THIRD; })
        .map(function (it) { return PourPatents.normalizeNumber(it.number); })
        .filter(Boolean);
    } else if (data.patentNumbers != null) {
      patentNumbers = toList(data.patentNumbers).map(PourPatents.normalizeNumber).filter(Boolean);
    } else {
      patentNumbers = target.patentNumbers;
    }
    if (!patentNumbers.length && !data.confirmedWithoutPatent) {
      return {
        ok: false,
        needsConfirm: true,
        reason: "missingPatent",
        message: "POUR 적용 특허번호가 아직 확인되지 않았습니다. 미기재 상태로 낙찰 저장할까요?"
      };
    }

    var merged = target;
    merged.status = data.status && STATUSES.indexOf(data.status) >= 0 ? data.status : "낙찰";
    merged.awardDate = awardDate;
    merged.contractor = contractor;
    merged.contractorPhone = contractorPhone;
    ["contractorContactName", "contractorMobile", "contractorAddress",
     "contractorBusinessNo", "contractorNote", "scope", "agreementNo"].forEach(function (key) {
      if (data[key] != null) merged[key] = String(data[key]).trim();
    });
    if (data.thirdPatentNumbers != null || data.patentItems != null) {
      merged.patentItems = data.patentItems != null ? data.patentItems : merged.patentItems;
      if (data.thirdPatentNumbers != null) merged.thirdPatentNumbers = data.thirdPatentNumbers;
    }
    merged.resultEnteredAt = nowStamp();       // 결과 입력일
    merged.updatedAt = nowStamp();             // 최종 수정일
    merged.awardAmount = awardAmount;
    // 공종: 항목(대분류+세부)을 함께 넘겼으면 그쪽을 쓰고,
    // 이름만 넘겼으면 그 이름으로 항목을 다시 만든다 (확실하지 않은 것은 기타로 간다)
    merged.categories = categories;
    if (data.categoryItems != null) merged.categoryItems = data.categoryItems;
    else if (data.categories != null) delete merged.categoryItems;
    merged.patentNumbers = patentNumbers;
    if (data.patentItems != null) merged.patentItems = data.patentItems;
    else if (data.patentNumbers != null || data.thirdPatentNumbers != null) {
      delete merged.patentItems;                 // 번호로 다시 구성한다
      merged.patentNumbers = patentNumbers;
      if (data.thirdPatentNumbers != null) merged.thirdPatentNumbers = data.thirdPatentNumbers;
    }
    if (data.noticeMultiFlag != null) merged.noticeMultiFlag = data.noticeMultiFlag;
    if (data.patentNames != null) merged.patentNames = toList(data.patentNames);
    if (data.quality != null) merged.quality = String(data.quality).trim();
    if (data.remark != null) merged.remark = String(data.remark).trim();
    merged.agreementNo = agreementNo;      // 협약서 발행번호 (핵심 처리 기준)

    var before = JSON.parse(JSON.stringify(target));
    var after = normalize(merged);
    after.history = before.history.concat(buildHistory(before, after, "낙찰 처리"));
    all[at] = after;
    writeAll(all, storage);
    return { ok: true, record: after };
  }

  /* ------------------------------------------------- 수정 · 이력 */

  function sameValue(a, b) {
    if (Array.isArray(a) || Array.isArray(b)) {
      return (a || []).join("|") === (b || []).join("|");
    }
    return String(a == null ? "" : a) === String(b == null ? "" : b);
  }

  function displayFor(value) {
    if (Array.isArray(value)) return value.join(", ");
    if (value === true) return "예";
    if (value === false) return "아니오";
    return String(value == null ? "" : value);
  }

  /** 수정 전후를 비교해 이력 항목을 만든다. */
  function buildHistory(before, after, action) {
    var changes = [];
    Object.keys(FIELD_LABELS).forEach(function (field) {
      if (sameValue(before[field], after[field])) return;
      changes.push({
        field: field,
        label: FIELD_LABELS[field],
        before: displayFor(before[field]),
        after: displayFor(after[field])
      });
    });
    if (!changes.length) return [];

    var addedPatent = changes.some(function (c) {
      return c.field === "patentNumbers" && !before.patentNumbers.length && after.patentNumbers.length;
    });

    return [{
      at: nowStamp(),
      action: addedPatent ? "POUR 적용 특허번호 추가" : (action || "자료 수정"),
      statusBefore: before.status,
      statusAfter: after.status,
      changes: changes
    }];
  }

  /**
   * 어느 화면에서 고치든 같은 고유 ID의 자료를 갱신한다. 새 행을 만들지 않는다.
   * 최초 등록일과 기존 이력은 지우지 않는다.
   */
  function update(id, changes, storage) {
    var all = list(storage);
    var at = -1;
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) { at = i; break; } }
    if (at < 0) return { ok: false, message: "해당 자료를 찾지 못했습니다." };

    var before = all[at];
    var draft = {};
    Object.keys(before).forEach(function (k) { draft[k] = before[k]; });
    var incoming = changes || {};
    Object.keys(incoming).forEach(function (k) {
      if (k === "id" || k === "createdAt" || k === "history") return;   // 보존 항목
      draft[k] = incoming[k];
    });

    // 특허 항목 없이 번호만 넘겼다면 그 번호로 항목을 다시 만든다
    if (incoming.patentItems == null &&
        (incoming.patentNumbers != null || incoming.thirdPatentNumbers != null)) {
      delete draft.patentItems;
    }

    // 공종도 마찬가지. 대분류 없이 이름만 넘겼다면 그 이름으로 항목을 다시 만든다
    // (확실하지 않은 것은 임의로 옮기지 않고 기타로 간다)
    if (incoming.categoryItems == null && incoming.categories != null) {
      delete draft.categoryItems;
    }

    /* ---- 협약서 발행번호 ---- */
    if (incoming.agreementNo != null) {
      var hadNo = hasAgreement(before);
      var hasNo = String(incoming.agreementNo).trim() !== "";

      // 번호가 새로 들어오면 그 행을 낙찰로 바꾼다 (새 행을 만들지 않는다)
      if (!hadNo && hasNo && AGREEMENT_PROMOTES.indexOf(draft.status) >= 0) {
        draft.status = "낙찰";
        draft.resultEnteredAt = nowStamp();
      }

      // 번호를 지웠을 때는 과거 번호를 되살리지 않는다.
      // 상태를 공고로 되돌릴지는 쓰는 사람에게 물어본다.
      if (hadNo && !hasNo && before.status === "낙찰") {
        if (incoming.agreementCleared == null) {
          return {
            ok: false,
            needsConfirm: true,
            reason: "agreementCleared",
            message: AGREEMENT_CLEARED_MESSAGE
          };
        }
        if (incoming.agreementCleared === "notice") draft.status = "공고";
      }
    }
    delete draft.agreementCleared;

    var after = normalize(draft);
    after.id = before.id;
    after.createdAt = before.createdAt;
    after.updatedAt = nowStamp();
    after.history = before.history.concat(buildHistory(before, after, "자료 수정"));

    all[at] = after;
    writeAll(all, storage);
    return { ok: true, record: after };
  }

  /* --------------------------------------- 특허번호 미기재 알림 */

  /**
   * POUR 적용 특허번호가 확정된 자료인지 판단한다.
   * 업로드된 특허 자료와 일치하거나, 관리자가 직접 확인 완료로 저장한 경우만 인정한다.
   */
  function isPatentResolved(record, patentStorage) {
    if (!record || !record.patentNumbers || !record.patentNumbers.length) return false;
    if (record.patentConfirmed) return true;
    return record.patentNumbers.every(function (n) {
      return !!PourPatents.find(n, patentStorage);
    });
  }

  /**
   * 상단 알림 대상: 상태가 "낙찰" 이면서 POUR 적용 특허번호가 비어 있는 자료.
   * 공고·유찰·공고취소·재공고·타공법 낙찰은 대상이 아니다.
   */
  function missingPatentRecords(records, patentStorage) {
    return (records || []).filter(function (rec) {
      if (rec.status !== "낙찰") return false;
      return !isPatentResolved(rec, patentStorage);
    });
  }

  /* ------------------------------------------- 다특허 · 특허 구분 */

  var BADGE_COLORS = {
    pour: "파란색",       // POUR 특허만 여러 개
    mixed: "보라색",      // POUR와 타사 혼합
    third: "회색",        // 타사 특허만 여러 개
    unknown: "주황색"     // 번호 미확인 다특허
  };

  /**
   * 한 현장의 특허 구성을 계산한다. 다특허 여부는 개수로 자동 판단한다.
   * (사용자가 매번 직접 입력하지 않는다)
   */
  function patentStats(record, patentStorage) {
    var items = (record && record.patentItems) || [];
    var pour = items.filter(function (it) { return it.kind === POUR; });
    var third = items.filter(function (it) { return it.kind === THIRD; });
    var total = pour.length + third.length;
    var noticeMulti = !!(record && record.noticeMultiFlag);
    var isMulti = total >= 2;

    var badge = "unknown";
    if (isMulti) {
      if (pour.length && third.length) badge = "mixed";
      else if (pour.length) badge = "pour";
      else badge = "third";
    } else if (noticeMulti) badge = "unknown";

    // 확인 상태
    var status;
    var unverified = pour.filter(function (it) { return !PourPatents.find(it.number, patentStorage); });
    if (noticeMulti && total < 2) status = "다특허 번호 확인 필요";
    else if (!pour.length) status = "POUR 특허번호 미기재";
    else if (unverified.length && !(record && record.patentConfirmed)) status = "POUR 특허 검토 필요";
    else status = "확정";

    var label;
    if (isMulti) label = "다특허 · 총 " + total + "개";
    else if (noticeMulti) label = "다특허 번호 확인 필요";
    else if (total === 1) label = "단일특허";
    else label = "";

    return {
      pourCount: pour.length,
      thirdCount: third.length,
      totalCount: total,
      isMulti: isMulti,
      noticeMultiFlag: noticeMulti,
      badge: badge,
      badgeColor: BADGE_COLORS[badge],
      label: label,
      detail: "POUR " + pour.length + "개 · 타사 " + third.length + "개",
      status: status,
      unverified: unverified.map(function (it) { return it.number; })
    };
  }

  /** POUR 특허와 타사 특허에 같은 번호가 들어갔는지 확인한다. */
  function conflictingPatents(record) {
    var items = (record && record.patentItems) || [];
    var pour = {}, clash = [];
    items.forEach(function (it) { if (it.kind === POUR) pour[it.number] = true; });
    items.forEach(function (it) {
      if (it.kind === THIRD && pour[it.number]) clash.push(it.number);
    });
    return clash;
  }

  var CONFLICT_MESSAGE =
    "동일한 특허번호가 POUR 특허와 타사 특허에 모두 등록되어 있습니다. 특허 구분을 확인해 주세요.";

  /* --------------------------------------------- 알림 묶음 */

  /**
   * 상단 알림 묶음. 타사 특허만 입력했다고 POUR 미기재 알림이 풀리지 않는다.
   * (POUR 항목만 보고 판단하기 때문)
   */
  function alerts(records, patentStorage) {
    var missing = [], multiUnknown = [], needsCheck = [];
    var needsMore = [], noAgreement = [];

    (records || []).forEach(function (rec) {
      var stats = patentStats(rec, patentStorage);
      if (rec.status === "낙찰" && !isPatentResolved(rec, patentStorage)) missing.push(rec);
      if (stats.noticeMultiFlag && stats.totalCount < 2) multiUnknown.push(rec);
      if (conflictingPatents(rec).length ||
          (stats.status === "POUR 특허 검토 필요")) needsCheck.push(rec);

      // 협약서 발행번호를 기준으로 본 처리 단계.
      // 엑셀에서 옮겨 온 행은 애초에 번호가 없으므로 미입력 알림에서 뺀다.
      var stage = agreementStage(rec);
      if (stage === "추가 입력 필요") needsMore.push(rec);
      if (stage === "협약서번호 미입력" && !isImported(rec)) noAgreement.push(rec);
    });

    var out = [];
    if (needsMore.length) {
      out.push({ key: "awardIncomplete",
                 label: "낙찰 정보 추가 입력 필요 " + needsMore.length + "건",
                 count: needsMore.length, records: needsMore });
    }
    if (noAgreement.length) {
      out.push({ key: "noAgreement",
                 label: "협약서번호 미입력 " + noAgreement.length + "건",
                 count: noAgreement.length, records: noAgreement });
    }
    if (missing.length) {
      out.push({ key: "missingPour", label: "POUR 특허번호 미기재 낙찰 " + missing.length + "건",
                 count: missing.length, records: missing });
    }
    if (multiUnknown.length) {
      out.push({ key: "multiUnknown", label: "다특허 번호 확인 필요 " + multiUnknown.length + "건",
                 count: multiUnknown.length, records: multiUnknown });
    }
    if (needsCheck.length) {
      out.push({ key: "kindCheck", label: "POUR·타사 특허 구분 확인 필요 " + needsCheck.length + "건",
                 count: needsCheck.length, records: needsCheck });
    }
    return out;
  }

  /* ------------------------------------------------ 자료 이전 */

  var MIGRATION_KEY = "pour.records.migration.v1";

  /**
   * 기존 자료를 새 특허 구조로 옮긴다. 원본을 지우지 않고 스냅샷을 남겨 되돌릴 수 있다.
   * 업로드된 POUR 특허 자료와 맞지 않는 번호는 자동 확정하지 않고 검토 대상으로 표시한다.
   */
  function migratePatentItems(storage, patentStorage) {
    var s = store(storage);
    var all = list(storage);
    var snapshot = [], moved = 0, review = [];

    all.forEach(function (rec) {
      snapshot.push({ id: rec.id, patentNumbers: rec.patentNumbers.slice(), patentNames: rec.patentNames.slice() });
      if (!rec.patentItems.length) return;
      moved += rec.patentItems.filter(function (it) { return it.kind === POUR; }).length;
      rec.patentItems.forEach(function (it) {
        if (it.kind !== POUR) return;
        if (!PourPatents.find(it.number, patentStorage)) {
          review.push({ id: rec.id, client: rec.client, number: it.number });
        }
      });
    });

    writeAll(all, storage);
    if (s) {
      try { s.setItem(MIGRATION_KEY, JSON.stringify({ at: nowStamp(), snapshot: snapshot })); } catch (e) {}
    }
    return { records: all.length, movedPourPatents: moved, needsReview: review, reversible: !!s };
  }

  /** 이전 직전 상태로 되돌린다. */
  function rollbackMigration(storage) {
    var s = store(storage);
    if (!s) return { ok: false, message: "저장소를 사용할 수 없습니다." };
    var raw = s.getItem(MIGRATION_KEY);
    if (!raw) return { ok: false, message: "되돌릴 이전 기록이 없습니다." };
    var saved = JSON.parse(raw);
    var all = list(storage);
    var byId = {};
    saved.snapshot.forEach(function (row) { byId[row.id] = row; });
    all.forEach(function (rec, i) {
      var row = byId[rec.id];
      if (!row) return;
      // 특허 항목을 지우고 원래 번호로 되돌린다 (빈 배열이 아니라 키 자체를 없앤다)
      var restored = Object.assign({}, rec, {
        patentNumbers: row.patentNumbers, patentNames: row.patentNames
      });
      delete restored.patentItems;
      all[i] = normalize(restored);
    });
    writeAll(all, storage);
    return { ok: true, restored: saved.snapshot.length, at: saved.at };
  }

  function missingPatentMessage(count) {
    return "⚠ 특허번호 미기재 " + count + "건 — 확인이 필요한 낙찰 현장이 있습니다.";
  }

  /* --------------------------------------------------------- 재공고 */

  /**
   * 재공고를 만든다. 원본 공고는 지우지 않고 유찰로 두고, 재공고는 별도 행으로 만들어 연결한다.
   * 차수는 같은 원본에 딸린 재공고 수로 자동 계산한다.
   */
  function createRebid(originalId, changes, storage) {
    var all = list(storage);
    var origin = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === originalId) { origin = all[i]; break; } }
    if (!origin) return { ok: false, message: "원본 공고를 찾지 못했습니다." };

    // 원본을 따라 올라가 최초 공고를 찾는다 (재공고의 재공고도 같은 원본에 묶인다)
    var rootId = origin.originalProjectId || origin.id;
    var round = 1;
    all.forEach(function (rec) {
      if (rec.originalProjectId === rootId && rec.rebidRound) {
        round = Math.max(round, Number(rec.rebidRound) + 1);
      }
    });

    var draft = {};
    // 단지명·공사명·공종·지역·도시·전화번호·세대수·특허·공사범위를 가져온다 (수정 가능)
    ["client", "projectNames", "categories", "region", "city", "phone", "households",
     "patentItems", "noticeMultiFlag", "noticePatentText", "scopes", "address",
     "agreementNo", "quality"].forEach(function (key) { draft[key] = origin[key]; });

    Object.keys(changes || {}).forEach(function (key) { draft[key] = changes[key]; });

    draft.id = createId();
    draft.status = "재공고";
    draft.isRebid = true;
    draft.rebidRound = round;
    draft.originalProjectId = rootId;
    draft.previousProjectId = origin.id;
    draft.previousFailDate = String((changes || {}).previousFailDate || origin.bidDate || "").trim();
    draft.contractor = "";
    draft.contractorPhone = "";
    draft.awardDate = "";
    draft.awardAmount = "";

    var rebid = normalize(draft);
    all.push(rebid);

    // 원본은 유찰로 남긴다 (이미 다른 상태면 건드리지 않는다)
    for (var j = 0; j < all.length; j++) {
      if (all[j].id !== origin.id) continue;
      if (all[j].status === "공고" || all[j].status === "재공고") {
        var before = JSON.parse(JSON.stringify(all[j]));
        all[j].status = "유찰";
        all[j].history = before.history.concat(buildHistory(before, all[j], "재공고 등록으로 유찰 처리"));
      }
    }

    writeAll(all, storage);
    return { ok: true, record: rebid, round: round, originalId: rootId };
  }

  /** 상태 필터 탭에 표시할 건수. */
  function statusCounts(records) {
    var all = records || [];
    var count = function (fn) { return all.filter(fn).length; };
    return {
      "전체": all.length,
      "낙찰": count(function (r) { return r.status === "낙찰"; }),
      "공고": count(function (r) { return r.status === "공고"; }),
      "재공고(유찰)": count(function (r) { return r.status === "재공고" || r.status === "유찰"; })
    };
  }

  function matchesStatusTab(record, tab) {
    if (!tab || tab === "전체") return true;
    if (tab === "재공고(유찰)") return record.status === "재공고" || record.status === "유찰";
    return record.status === tab;
  }


  /* ----------------------------------------------------- 특허별 실적 */

  /**
   * 특허 탭 목록. 등록된 특허와 실제 공사 자료에 쓰인 특허를 합쳐 자동 생성한다.
   * 비활성 특허라도 공사 자료와 연결돼 있으면 탭을 남긴다.
   */
  function patentTabs(patentList, records) {
    var tabs = [], seen = {};
    var used = {};
    (records || []).forEach(function (rec) {
      (rec.patentNumbers || []).forEach(function (n) { used[n] = true; });
    });

    (patentList || []).forEach(function (p) {
      if (p.active === false && !used[p.number]) return;   // 비활성이고 쓰인 적 없으면 숨김
      if (seen[p.number]) return;
      seen[p.number] = true;
      tabs.push({
        number: p.number,
        label: PourPatents.tabLabel(p),
        name: p.name || "",
        category: p.category || "",
        active: p.active !== false,
        linked: !!used[p.number]
      });
    });

    // 특허 자료에는 없지만 공사 자료에 쓰인 번호도 탭으로 남긴다.
    Object.keys(used).forEach(function (n) {
      if (seen[n]) return;
      seen[n] = true;
      tabs.push({
        number: n, label: PourPatents.tabLabel({ number: n }),
        name: "", category: "", active: true, linked: true, unregistered: true
      });
    });

    return tabs;
  }

  /** 해당 특허가 적용된 현장만 고른다. 같은 현장이 두 번 나오지 않도록 id로 걸러낸다. */
  function recordsForPatent(number, records, options) {
    var target = PourPatents.normalizeNumber(number);
    var opts = options || {};
    var seen = {}, out = [];
    (records || []).forEach(function (rec) {
      if ((rec.patentNumbers || []).indexOf(target) < 0) return;
      if (seen[rec.id]) return;                                  // 중복 표시 방지
      if (opts.status && opts.status !== "전체" && rec.status !== opts.status) return;
      seen[rec.id] = true;
      out.push(rec);
    });
    return out;
  }

  /**
   * 특허 탭 상단 요약. "타공법 낙찰"은 POUR 실적이 아니므로 낙찰 집계에서 뺀다.
   */
  function summarize(records) {
    var total = 0, awarded = 0, failed = 0, otherMethod = 0;
    var households = 0, amount = 0, regions = {};
    (records || []).forEach(function (rec) {
      total++;
      if (rec.status === "낙찰") {
        awarded++;
        if (rec.awardAmount !== "" && rec.awardAmount != null) amount += Number(rec.awardAmount);
      } else if (rec.status === "유찰") failed++;
      else if (rec.status === "타공법 낙찰") otherMethod++;
      if (rec.households !== "" && rec.households != null) households += Number(rec.households);
      if (rec.region) regions[rec.region] = true;
    });
    return {
      total: total, awarded: awarded, failed: failed, otherMethod: otherMethod,
      households: households, amount: amount, regions: Object.keys(regions).length
    };
  }

  /**
   * 숫자만 입력했을 때 보기 좋게 하이픈을 넣어 준다. 저장된 원문은 바꾸지 않는다.
   * 02-1234-5678 / 031-123-4567 / 010-1234-5678 / 1588-0000 형태를 지원한다.
   */
  function formatPhone(value) {
    var raw = String(value == null ? "" : value).trim();
    if (!raw || /[^0-9]/.test(raw)) return raw;      // 이미 하이픈 등이 있으면 그대로 둔다
    var d = raw;
    if (/^02/.test(d)) {
      if (d.length === 9) return d.slice(0, 2) + "-" + d.slice(2, 5) + "-" + d.slice(5);
      if (d.length === 10) return d.slice(0, 2) + "-" + d.slice(2, 6) + "-" + d.slice(6);
    }
    if (/^1[5-9]\d{2}/.test(d) && d.length === 8) return d.slice(0, 4) + "-" + d.slice(4);
    if (d.length === 10) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
    if (d.length === 11) return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
    return raw;
  }

  /** "320억원" 처럼 읽기 쉬운 금액 표기. */
  function formatAmountShort(amount) {
    var n = Number(amount || 0);
    if (!n) return "0원";
    if (n >= 100000000) {
      var eok = n / 100000000;
      return (eok >= 100 ? Math.round(eok) : Math.round(eok * 10) / 10).toLocaleString("ko-KR") + "억원";
    }
    if (n >= 10000) return Math.round(n / 10000).toLocaleString("ko-KR") + "만원";
    return n.toLocaleString("ko-KR") + "원";
  }

  function summaryText(tabLabel, summary) {
    return tabLabel + "  전체 " + summary.total + "건 · 낙찰 " + summary.awarded + "건 · 총 " +
      summary.households.toLocaleString("ko-KR") + "세대 · 낙찰금액 " + formatAmountShort(summary.amount);
  }

  /* --------------------------------------------------- 필터 · 정렬 */

  function applyFilters(records, filters) {
    var f = filters || {};
    return (records || []).filter(function (rec) {
      if (f.status && f.status !== "전체" && rec.status !== f.status) return false;
      if (f.region && f.region !== "전체" && rec.region !== f.region) return false;
      if (f.city && f.city !== "전체" && rec.city !== f.city) return false;
      if (f.year && f.year !== "전체") {
        var y = rec.year || String(rec.noticeDate || rec.awardDate || "").slice(0, 4);
        if (y !== String(f.year)) return false;
      }
      if (f.keyword) {
        var hay = [rec.client, rec.city, rec.region, rec.contractor, rec.remark]
          .concat(rec.projectNames || [], rec.categories || [], rec.patentNames || [],
                  (rec.patentNumbers || []).map(PourPatents.formatNumber))
          .join(" ").toUpperCase();
        if (hay.indexOf(String(f.keyword).toUpperCase()) < 0) return false;
      }
      return true;
    });
  }

  function sortRecords(records, columnKey, direction) {
    var dir = direction === "desc" ? -1 : 1;
    var column = null;
    COLUMNS.concat(PATENT_TAB_COLUMNS).forEach(function (c) { if (c.key === columnKey) column = column || c; });
    if (!column) return (records || []).slice();

    return (records || []).slice().sort(function (a, b) {
      var va, vb;
      if (column.type === "number" || column.type === "money") {
        va = a[columnKey] === "" || a[columnKey] == null ? -Infinity : Number(a[columnKey]);
        vb = b[columnKey] === "" || b[columnKey] == null ? -Infinity : Number(b[columnKey]);
        return (va - vb) * dir;
      }
      va = displayValue(a, column, 0);
      vb = displayValue(b, column, 0);
      return va.localeCompare(vb, "ko") * dir;
    });
  }

  return {
    STORAGE_KEY: STORAGE_KEY,
    STATUSES: STATUSES,
    BID_TYPES: BID_TYPES,
    BID_TYPE_UNKNOWN: BID_TYPE_UNKNOWN,
    normalizeBidType: normalizeBidType,
    validateDates: validateDates,
    QUALITY_OPTIONS: QUALITY_OPTIONS,
    AGREEMENT_PROMOTES: AGREEMENT_PROMOTES,
    AWARD_REQUIRED: AWARD_REQUIRED,
    IMPORT_SOURCE: IMPORT_SOURCE,
    isImported: isImported,
    hasAgreement: hasAgreement,
    missingAwardFields: missingAwardFields,
    agreementStage: agreementStage,
    AGREEMENT_CLEARED_MESSAGE: AGREEMENT_CLEARED_MESSAGE,
    COLUMNS: COLUMNS,
    MAIN_COLUMNS: MAIN_COLUMNS,
    PATENT_TAB_COLUMNS: PATENT_TAB_COLUMNS,
    normalize: normalize,
    createId: createId,
    displayValue: displayValue,
    exportValue: exportValue,
    usePatentStorage: usePatentStorage,
    list: list,
    save: save,
    saveMany: saveMany,
    award: award,
    patentTabs: patentTabs,
    createRebid: createRebid,
    statusCounts: statusCounts,
    matchesStatusTab: matchesStatusTab,
    recordsForPatent: recordsForPatent,
    summarize: summarize,
    summaryText: summaryText,
    formatAmountShort: formatAmountShort,
    formatPhone: formatPhone,
    applyFilters: applyFilters,
    sortRecords: sortRecords,
    update: update,
    buildHistory: buildHistory,
    isPatentResolved: isPatentResolved,
    missingPatentRecords: missingPatentRecords,
    missingPatentMessage: missingPatentMessage,
    POUR: POUR,
    THIRD_PARTY: THIRD,
    normalizePatentItem: normalizePatentItem,
    patentStats: patentStats,
    conflictingPatents: conflictingPatents,
    CONFLICT_MESSAGE: CONFLICT_MESSAGE,
    alerts: alerts,
    migratePatentItems: migratePatentItems,
    rollbackMigration: rollbackMigration,
    FIELD_LABELS: FIELD_LABELS,
    clear: function (storage) { writeAll([], storage); }
  };
});

/* ===== pour-export.js ===== */
/**
 * 실적 내려받기 (CSV · 엑셀)
 *
 * 화면 표와 내려받는 파일이 반드시 같은 열 순서를 쓰도록 pour-records.js 의
 * 열 정의를 그대로 사용한다.
 *
 * 엑셀(.xlsx)은 ExcelJS 가 있을 때만 만든다. 없으면 CSV 로 안내한다.
 *   브라우저: <script src=".../exceljs.min.js"><\/script> 로 window.ExcelJS 준비
 *   Node    : require("exceljs")
 */
(function (root, factory) {
  var isNode = typeof require === "function" && typeof module === "object";
  var records = isNode ? require("./pour-records.js") : root.PourRecords;
  var patents = isNode ? require("./pour-patents.js") : root.PourPatents;
  var api = factory(records, patents, isNode);
  if (isNode) module.exports = api;
  else root.PourExport = api;
})(typeof self !== "undefined" ? self : this, function (PourRecords, PourPatents, isNode) {
  "use strict";

  function getExcelJS() {
    if (!isNode && typeof self !== "undefined" && self.ExcelJS) return self.ExcelJS;
    if (isNode) { try { return require("exceljs"); } catch (e) { return null; } }
    return null;
  }

  /* ------------------------------------------------------------- CSV */

  function csvCell(value) {
    var s = value == null ? "" : String(value);
    // 줄바꿈·쉼표·따옴표가 들어간 셀은 따옴표로 감싼다 (여러 줄 공사명 유지)
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /** 화면 표와 동일한 열 순서의 CSV 문자열. 엑셀에서 한글이 깨지지 않도록 BOM을 붙인다. */
  function toCsv(records, columns) {
    var cols = columns || PourRecords.COLUMNS;
    var lines = [cols.map(function (c) { return csvCell(c.title); }).join(",")];
    (records || []).forEach(function (rec, i) {
      lines.push(cols.map(function (c) {
        return csvCell(PourRecords.displayValue(rec, c, i));
      }).join(","));
    });
    return "﻿" + lines.join("\r\n");
  }

  /* ------------------------------------------------- 워크시트 이름 */

  // 엑셀 시트 이름 제한: 31자, : \ / ? * [ ] 금지, 중복 불가
  function sheetName(label, used) {
    var name = String(label || "시트").replace(/[:\\/?*[\]]/g, "-").trim().slice(0, 31) || "시트";
    if (!used) return name;
    var base = name, n = 2;
    while (used[name]) {
      var suffix = "(" + n + ")";
      name = base.slice(0, 31 - suffix.length) + suffix;
      n++;
    }
    used[name] = true;
    return name;
  }

  /* ----------------------------------------------------------- 엑셀 */

  function styleSheet(sheet, cols) {
    sheet.columns = cols.map(function (c) {
      return { header: c.title, key: c.key, width: c.width || 14 };
    });

    var header = sheet.getRow(1);
    header.font = { bold: true };
    header.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
    header.height = 22;

    sheet.views = [{ state: "frozen", ySplit: 1 }];               // 첫 행 고정
    sheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  }

  function writeRows(sheet, cols, records) {
    (records || []).forEach(function (rec, i) {
      var values = {};
      cols.forEach(function (c) { values[c.key] = PourRecords.exportValue(rec, c, i); });
      var row = sheet.addRow(values);

      cols.forEach(function (c, ci) {
        var cell = row.getCell(ci + 1);
        cell.alignment = {
          vertical: "middle",
          wrapText: true,                                          // 여러 줄 공사명 줄바꿈 유지
          horizontal: c.type === "number" || c.type === "money" || c.type === "seq" ? "right" : "left"
        };
        if (c.type === "number" || c.type === "money") cell.numFmt = "#,##0";
        if (c.type === "phone") cell.numFmt = "@";                 // 전화번호 앞자리 0 유지
      });
    });

    // 모든 셀에 경계선
    sheet.eachRow(function (row) {
      row.eachCell(function (cell) {
        cell.border = {
          top: { style: "thin", color: { argb: "FFBFBFBF" } },

        if (!message) return close();
        list.appendChild(el("div", "pour-suggest-empty", message));
        list.classList.add("is-open");
        return;
      }
      items.forEach(function (item, i) {
        var row = el("div", "pour-suggest-item" + (i === active ? " is-active" : ""));
        row.appendChild(el("span", null, item.title));
        if (item.sub) {
          row.appendChild(document.createTextNode(" "));
          row.appendChild(el("span", "pour-sub", item.sub));

      active = items.length ? 0 : -1;
      render();

    input.addEventListener("focus", refresh);   // 빈 칸을 눌러도 목록을 연다

      else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + items.length) % items.length; render(); }

(function (root) {

    var text = SEARCH_KEYS.map(function (k) { return rec[k]; })
      .concat(rec.projectNames || [], rec.categories || [], rec.patentNames || [],
              (rec.patentNumbers || []).map(PourPatents.formatNumber),
              (rec.thirdPatentNumbers || []).map(PourPatents.formatNumber),
              (rec.patentItems || []).map(function (i) { return i.name + " " + i.company; }))
      .join(" ").toUpperCase();
    return text.indexOf(query.toUpperCase()) >= 0;
  }

  var alertFilterIds = null;   // 알림을 눌렀을 때 그 자료만 보여주기 위한 목록

  function currentRecords() {
    return PourRecords.list(storage).filter(function (rec) {
      if (alertFilterIds && alertFilterIds.indexOf(rec.id) < 0) return false;
      return PourRecords.matchesStatusTab(rec, state.statusTab) && matchesSearch(rec, state.search);
    });
  }

  var grid = PourGrid.create($("recordsGrid"), {

    var canAward = !!rec && (
      rec.status === "공고" || rec.status === "재공고" || rec.status === "유찰" ||

    $("btnToAward").disabled = !canAward;

  function renderStatusTabs() {
    var counts = PourRecords.statusCounts(PourRecords.list(storage));

  function renderAlerts() {
    var groups = PourRecords.alerts(PourRecords.list(storage), storage);
    var bar = $("alertBar");
    bar.innerHTML = "";
    groups.forEach(function (g) {
      // 표시만 바꾼다. 건수 계산과 누르는 동작은 그대로다.
      // 이름은 알림 문구에서 뒤에 붙은 건수만 떼어 쓴다.
      var name = String(g.label).replace(/\s*[\d,]+건$/, "");

      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "alert-card";
      chip.id = "alert-" + g.key;
      chip.title = g.label;

      var tag = document.createElement("span");
      tag.className = "alert-card-tag";
      tag.textContent = "중요 확인";

      var body = document.createElement("span");
      body.className = "alert-card-body";
      var nameEl = document.createElement("span");
      nameEl.className = "alert-card-name";
      nameEl.textContent = name;
      var note = document.createElement("span");
      note.className = "alert-card-note";
      note.textContent = "확인 필요";
      body.appendChild(nameEl);
      body.appendChild(note);

      var count = document.createElement("span");
      count.className = "alert-card-count";
      count.textContent = Number(g.count).toLocaleString("ko-KR");
      var unit = document.createElement("span");
      unit.className = "alert-card-unit";
      unit.textContent = "건";
      count.appendChild(unit);

      chip.appendChild(tag);
      chip.appendChild(body);
      chip.appendChild(count);

      chip.addEventListener("click", function () {

  function setRegionOptions(regions, selected) {
    var select = $("fRegion");
    select.innerHTML = "";
    if (!regions.length) { select.appendChild(new Option("—", "")); return; }
    regions.forEach(function (r) { select.appendChild(new Option(r, r)); });
    select.value = selected && regions.indexOf(selected) >= 0 ? selected : regions[0];
  }

  regionField = PourUI.attachRegionInput($("fCity"), {
    onChange: function (value) {
      if (value) setRegionOptions([value.region], value.region);
      else if (!$("fCity").value.trim()) setRegionOptions([]);
    },
    onAmbiguous: function (candidates) {
      var regions = [];
      candidates.forEach(function (c) { if (regions.indexOf(c.region) < 0) regions.push(c.region); });
      setRegionOptions(regions, $("fRegion").value);
    }
  });

    ["fClient", "fProjects", "fCity", "fPhone", "fHouseholds", "fNoticeDate",
     "fDueDate", "fBidDate", "fNoticePatent", "fAgreement", "fQuality", "fScopes",
     "fAddress", "fRemark", "fContractor", "rebidSearch", "rebidRound", "rebidReason",
     "previousFailDate"].forEach(function (id) { $(id).value = ""; });
    $("fStatus").value = "공고";
    if (categoryPicker) categoryPicker.clear();
    $("isRebid").checked = false;
    $("rebidBox").style.display = "none";
    rebidSource = null;
    bidType = "";
    Array.prototype.forEach.call(document.querySelectorAll("#bidGroup .bid-btn"), function (b) {
      b.classList.remove("is-active");
    });
    setRegionOptions([]);
    regionField.clear();
    patentEditor.clear();
    $("editHistory").innerHTML = "";
    $("panelMsg").textContent = "";
  }

  function openNotice(id) {
    clearNoticeForm();
    state.editingId = id || null;

    // 새 공고에서는 상태·시공사·공사 품질·비고·특허·협약 정보를 감춘다.
    // (자료와 목록 열은 그대로 두고 입력 화면에서만 감추는 것이다)
    $("noticePanel").classList.toggle("is-edit", !!id);

    if (!id) {
      $("panelTitle").textContent = "새 공고 등록";
      $("panelSave").textContent = "공고 등록";
      $("isRebid").parentNode.style.display = "";
      $("fStatus").value = "공고";              // 화면에서 고르지 않고 언제나 공고로 저장
    } else {
      var rec = PourRecords.list(storage).filter(function (r) { return r.id === id; })[0];
      if (!rec) return;
      $("panelTitle").textContent = "자료 수정 — " + (rec.client || "이름 없음");
      $("panelSave").textContent = "수정 저장";
      $("isRebid").parentNode.style.display = "none";

      $("fClient").value = rec.client;
      $("fProjects").value = rec.projectNames.join("\n");
      categoryPicker.setValue(rec);
      $("fCity").value = rec.city;
      setRegionOptions([rec.region].filter(Boolean), rec.region);
      regionField.setValue(rec.region, rec.city);
      $("fPhone").value = rec.phone;
      $("fHouseholds").value = rec.households === "" ? "" : String(rec.households);
      $("fNoticeDate").value = rec.noticeDate;
      $("fDueDate").value = rec.documentDueDate;
      $("fBidDate").value = rec.bidDate;
      $("fNoticePatent").value = rec.noticePatentText;
      $("fAgreement").value = rec.agreementNo;
      $("fQuality").value = rec.quality;
      $("fScopes").value = (rec.scopes || []).join("\n");
      $("fAddress").value = rec.address;
      $("fRemark").value = rec.remark;
      $("fContractor").value = rec.contractor;
      $("fStatus").value = rec.status;
      bidType = rec.bidType;
      Array.prototype.forEach.call(document.querySelectorAll("#bidGroup .bid-btn"), function (b) {
        b.classList.toggle("is-active", b.getAttribute("data-bid") === bidType);
      });
      patentEditor.setValue(rec);

      $("editHistory").innerHTML = rec.history.length
        ? "<b>수정 이력</b>" + rec.history.map(function (h) {
            return "<div>" + h.at + " · " + h.action + " (" + h.statusBefore + " → " + h.statusAfter + ")</div>";
          }).join("")
        : "";
    }
    openPanel("noticePanel", "panelBack");
  }

  $("btnNewNotice").addEventListener("click", function () { openNotice(null); });
  $("panelClose").addEventListener("click", function () { closePanel("noticePanel", "panelBack"); });
  $("panelCancel").addEventListener("click", function () { closePanel("noticePanel", "panelBack"); });
  $("panelBack").addEventListener("click", function () { closePanel("noticePanel", "panelBack"); });

  $("isRebid").addEventListener("change", function () {
    $("rebidBox").style.display = this.checked ? "" : "none";
    if (this.checked) refreshRebidOptions();
    else { rebidSource = null; $("rebidRound").value = ""; }

  function refreshRebidOptions() {
    var q = $("rebidSearch").value.trim().toUpperCase();
    var select = $("rebidTarget");
    select.innerHTML = "";
    select.appendChild(new Option("— 선택 —", ""));
    PourRecords.list(storage).filter(function (r) {
      if (["공고", "재공고", "유찰"].indexOf(r.status) < 0) return false;
      if (!q) return true;
      return [r.client, r.city, r.region].concat(r.projectNames || [])
        .join(" ").toUpperCase().indexOf(q) >= 0;
    }).forEach(function (r) {
      select.appendChild(new Option(
        (r.client || "이름 없음") + " / " + PourRegion.format(r.region, r.city) + " / " + r.status, r.id));
    });
  }

  $("rebidTarget").addEventListener("change", function () {
    rebidSource = this.value || null;
    if (!rebidSource) { $("rebidRound").value = ""; return; }
    var origin = PourRecords.list(storage).filter(function (r) { return r.id === rebidSource; })[0];
    if (!origin) return;
    $("fClient").value = origin.client;
    $("fProjects").value = origin.projectNames.join("\n");
    categoryPicker.setValue(origin);
    $("fCity").value = origin.city;
    setRegionOptions([origin.region].filter(Boolean), origin.region);
    regionField.setValue(origin.region, origin.city);
    $("fPhone").value = origin.phone;
    $("fHouseholds").value = origin.households === "" ? "" : String(origin.households);
    $("fScopes").value = (origin.scopes || []).join("\n");
    $("fNoticePatent").value = origin.noticePatentText;
    $("previousFailDate").value = origin.bidDate || "";
    patentEditor.setValue(origin);

    var rootId = origin.originalProjectId || origin.id;
    var round = 1;
    PourRecords.list(storage).forEach(function (r) {
      if (r.originalProjectId === rootId && r.rebidRound) round = Math.max(round, Number(r.rebidRound) + 1);
    });
    $("rebidRound").value = round + "차";

      // 공종은 대분류와 짝지어 저장한다. 기존 공종 열(categories)은 모델이 함께 채운다.
      categoryItems: categoryPicker.getValue(),

      noticeDate: $("fNoticeDate").value,
      documentDueDate: $("fDueDate").value,
      bidDate: $("fBidDate").value,

      address: $("fAddress").value.trim(),

    };

  $("panelSave").addEventListener("click", function () {
    var data = readNoticeForm();
    var msg = $("panelMsg");
    msg.className = "form-msg error";

    // 새로 등록할 때만 도시·공고일을 요구한다.
    // 엑셀에서 옮겨 온 자료에는 공고일이 없다(원본에 날짜가 없어 지어내지 않았다).
    // 여기서 막으면 그 자료는 협약서 발행번호조차 넣을 수 없게 된다.
    if (!state.editingId) {
      if (!data.city) { msg.textContent = "도시를 입력해 주세요."; return; }
      if (!data.noticeDate) { msg.textContent = "공고일을 입력해 주세요."; return; }
    }
    var dates = PourRecords.validateDates(data);
    if (!dates.ok) {
      msg.textContent = dates.errors.map(function (e) { return e.message; }).join("\n");
      return;
    }

    if (state.editingId) {
      var updated = PourRecords.update(state.editingId, data, storage);
      // 협약서 발행번호를 지웠다면 상태를 되돌릴지 물어본다 (과거 번호는 되살리지 않는다)
      if (!updated.ok && updated.reason === "agreementCleared") {
        data.agreementCleared = window.confirm(updated.message) ? "notice" : "keep";
        updated = PourRecords.update(state.editingId, data, storage);
      }
      if (!updated.ok) { msg.textContent = updated.message; return; }
    } else if ($("isRebid").checked) {
      if (!rebidSource) { msg.textContent = "재공고할 기존 공고를 선택해 주세요."; return; }
      data.rebidReason = $("rebidReason").value.trim();
      data.previousFailDate = $("previousFailDate").value;
      var rebid = PourRecords.createRebid(rebidSource, data, storage);
      if (!rebid.ok) { msg.textContent = rebid.message; return; }
    } else {
      PourRecords.save(data, storage);
    }

    closePanel("noticePanel", "panelBack");
    alertFilterIds = null;
    refresh();
  });

  var awardPatentEditor = null;

  function buildAwardFields(container, fields, record) {
    container.innerHTML = "";
    fields.forEach(function (f) {
      var wrap = document.createElement("div");
      var label = document.createElement("label");
      label.textContent = f.label;
      if (f.required) {
        var star = document.createElement("span");
        star.className = "req";
        star.textContent = " *";
        label.appendChild(star);
      }
      wrap.appendChild(label);

      var input;
      if (f.type === "select") {
        input = document.createElement("select");
        f.options.forEach(function (o) { input.appendChild(new Option(o, o)); });
      } else {
        input = document.createElement("input");
        input.type = f.type || "text";
        if (f.datalist) input.setAttribute("list", f.datalist);
      }
      input.id = "aw-" + f.key;
      var value = record[f.key];
      if (Array.isArray(value)) value = value.join(", ");
      input.value = f.key === "status" ? "낙찰" : (value == null ? "" : value);

      if (f.phone) {
        input.addEventListener("blur", function () { input.value = PourRecords.formatPhone(input.value); });
      }
      if (f.money) {
        input.addEventListener("blur", function () {
          var n = Number(String(input.value).replace(/[^0-9.-]/g, ""));
          if (isFinite(n) && input.value.trim()) input.value = n.toLocaleString("ko-KR");
        });
      }
      wrap.appendChild(input);
      var err = document.createElement("span");
      err.className = "field-error";
      err.id = "aw-error-" + f.key;
      err.style.display = "none";
      wrap.appendChild(err);
      container.appendChild(wrap);
    });
  }

  function openAward(id) {
    var rec = PourRecords.list(storage).filter(function (r) { return r.id === id; })[0];
    if (!rec) return;
    state.awardingId = id;

    $("awardSummary").innerHTML =
      "<strong>" + (rec.client || "이름 없음") + "</strong><br>" +
      "공사명: " + (rec.projectNames.join(" / ") || "—") + "<br>" +
      "지역·도시: " + (PourRegion.format(rec.region, rec.city) || "—") + "<br>" +
      "공고일 " + (rec.noticeDate || "—") + " · 서류 마감일 " + (rec.documentDueDate || "—") +
      " · 개찰일 " + (rec.bidDate || "—") + "<br>" +
      "공고문 특허·공법: " + (rec.noticePatentText || "—") + "<br>" +
      "현재 상태: " + rec.status + (rec.rebidRound ? " (재공고 " + rec.rebidRound + "차)" : "") +
      " · 처리 단계: " + PourRecords.agreementStage(rec);

    buildAwardFields($("awardContractorFields"), AWARD_CONTRACTOR_FIELDS, rec);
    buildAwardFields($("awardInfoFields"), AWARD_INFO_FIELDS, rec);

    $("awardPatentEditor").innerHTML = "";
    awardPatentEditor = PourPatentEditor.create($("awardPatentEditor"), {
      storage: storage, categoryInput: $("aw-categories")
    });
    awardPatentEditor.setValue(rec);
    if (rec.categories.length) $("aw-categories").value = rec.categories.join(", ");

    // 협약서 발행번호만 먼저 넣어도 낙찰로 정리된다는 것을 알려 준다
    var stage = PourRecords.agreementStage(rec);
    var left = PourRecords.missingAwardFields(rec);
    $("awardMsg").className = "form-msg";
    $("awardMsg").textContent = stage === "추가 입력 필요" && left.length
      ? "아직 비어 있는 항목: " + left.join(", ")
      : "협약서 발행번호만 먼저 넣어도 낙찰로 정리됩니다. 나머지는 나중에 채울 수 있습니다.";
    $("awardSave").disabled = false;
    openPanel("awardPanel", "awardBack");
  }

  function closeAward() {
    closePanel("awardPanel", "awardBack");
    state.awardingId = null;
  }
  $("awardClose").addEventListener("click", closeAward);
  $("awardCancel").addEventListener("click", closeAward);
  $("awardBack").addEventListener("click", closeAward);

  $("awardSave").addEventListener("click", function () {
    if (!state.awardingId) return;
    AWARD_CONTRACTOR_FIELDS.concat(AWARD_INFO_FIELDS).forEach(function (f) {
      var box = $("aw-error-" + f.key);
      if (box) { box.textContent = ""; box.style.display = "none"; }
    });

    var payload = { confirmedWithoutPatent: false };
    AWARD_CONTRACTOR_FIELDS.concat(AWARD_INFO_FIELDS).forEach(function (f) {
      payload[f.key] = $("aw-" + f.key).value;
    });
    var patents = awardPatentEditor.getValue();
    payload.patentItems = patents.patentItems;
    payload.noticeMultiFlag = patents.noticeMultiFlag;

    $("awardSave").disabled = true;
    var result = PourRecords.award(state.awardingId, payload, storage);

    if (!result.ok && result.needsConfirm) {
      if (window.confirm(result.message)) {
        payload.confirmedWithoutPatent = true;
        result = PourRecords.award(state.awardingId, payload, storage);
      } else {
        $("awardMsg").textContent = "낙찰 저장을 취소했습니다.";
        $("awardMsg").className = "form-msg";
        $("awardSave").disabled = false;
        return;
      }
    }
    if (!result.ok) {
      Object.keys(result.fields || {}).forEach(function (key) {
        var box = $("aw-error-" + key);
        if (box) { box.textContent = result.fields[key]; box.style.display = ""; }
      });
      $("awardMsg").textContent = result.message;
      $("awardMsg").className = "form-msg error";
      $("awardSave").disabled = false;
      return;
    }
    closeAward();
    alertFilterIds = null;
    refresh();
  });

  /* ------------------------------------------------ 가져오기 미리보기 */

  function rowsFromCsv(text) {
    var rows = [], row = [], cell = "", quoted = false;
    text = String(text).replace(/^﻿/, "");
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') quoted = false;
        else cell += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function rowsFromWorkbook(buffer) {
    if (!window.ExcelJS) return Promise.reject(new Error("엑셀 라이브러리를 불러오지 못했습니다. CSV로 올려주세요."));
    var wb = new ExcelJS.Workbook();
    return wb.xlsx.load(buffer).then(function () {
      var sheet = wb.worksheets[0], rows = [];
      sheet.eachRow(function (row) {
        var values = [];
        row.eachCell({ includeEmpty: true }, function (cell) {
          var v = cell.value;
          if (v && typeof v === "object") v = v.text != null ? v.text : (v.result != null ? v.result : "");
          values.push(v == null ? "" : String(v));
        });
        rows.push(values);
      });
      return rows;
    });
  }

  function showPreview(rows) {
    var box = $("importPreview");
    var parsed = PourPatents.parseRows(rows);
    if (!parsed.ok) {
      box.innerHTML = '<div class="form-msg error">' + parsed.message.replace(/\n/g, "<br>") + "</div>";
      return;
    }
    var existing = {};
    PourPatents.list(storage).forEach(function (r) { existing[r.number] = true; });
    var fresh = parsed.records.filter(function (r) { return !existing[r.number]; }).length;
    var update = parsed.records.length - fresh;

    box.innerHTML =
      '<div class="preview-stats">' +
        "<div><b>" + fresh + "건</b>새로 등록될 행</div>" +
        "<div><b>" + update + "건</b>갱신될 행</div>" +
        "<div><b>" + parsed.duplicated + "건</b>중복 행</div>" +
        "<div><b>" + parsed.errors.length + "건</b>오류 행</div>" +
      "</div>" +
      (parsed.errors.length
        ? '<ul class="preview-errors">' + parsed.errors.map(function (e) {
            return "<li>" + e.row + "행 — " + e.reason + "</li>";
          }).join("") + "</ul>"
        : "") +
      '<div class="toolbar" style="margin-top:10px">' +
        '<button type="button" class="tb-btn" id="btnConfirmImport">이대로 등록하기</button>' +
      "</div>";

    $("btnConfirmImport").addEventListener("click", function () {
      var result = PourPatents.load(rows, storage);
      box.innerHTML = '<div class="form-msg ok">등록 ' + result.inserted + "건 · 갱신 " + result.updated +
        "건 · 중복 " + result.duplicated + "건 · 오류 " + result.errors.length +
        "건. 현재 등록된 POUR 특허 " + result.total + "건입니다.</div>";
      refresh();
    });
  }

  $("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    if (/\.csv$/i.test(file.name)) {
      reader.onload = function () { showPreview(rowsFromCsv(reader.result)); };
      reader.readAsText(file, "utf-8");
    } else {
      reader.onload = function () {
        rowsFromWorkbook(reader.result).then(showPreview).catch(function (err) {
          $("importPreview").innerHTML = '<div class="form-msg error">' + err.message + "</div>";
        });
      };
      reader.readAsArrayBuffer(file);
    }
  });

  $("btnSampleImport").addEventListener("click", function () {
    showPreview([
      ["공종", "특허번호", "특허명", "특허권자", "비고"],
      ["균열보수", "제 10-1935719호", "콘크리트 구조물의 크랙 보수를 위한 보수층", "㈜넷폼알앤디", ""],
      ["", "제 10-2784426호", "콘크리트 구조물의 벽체를 위한 재도장층", "㈜넷폼알앤디", ""],
      ["에폭시", "제 10-2425081호", "표면강화층을 포함하는 유기계 방수층", "㈜넷폼알앤디", ""],
      ["엠보라이닝", "제 10-2425081호", "표면강화층을 포함하는 유기계 방수층", "㈜넷폼알앤디", ""],
      ["아스콘 균열보수", "잘못된값", "번호 없는 행", "", ""]
    ]);
  });

  /* ------------------------------------------------------- 내보내기 */

  Array.prototype.forEach.call(document.querySelectorAll("[data-export]"), function (btn) {
    btn.addEventListener("click", function () {
      var kind = btn.getAttribute("data-export");
      var msg = $("exportMsg");
      msg.className = "form-msg ok";

      if (kind === "특허별") {
        var records = PourRecords.list(storage);
        var tabs = PourRecords.patentTabs(PourPatents.list(storage), records);
        var wb = PourExport.buildPatentWorkbook(tabs, records);
        if (!wb) { msg.textContent = "엑셀 라이브러리를 불러오지 못했습니다."; msg.className = "form-msg error"; return; }
        PourExport.downloadWorkbook(wb, "특허별-실적.xlsx");
        msg.textContent = "특허 " + tabs.length + "건을 각각 워크시트로 내보냈습니다.";
        return;
      }

      var rows;
      if (kind === "현재필터") rows = grid.getVisible();
      else if (kind === "선택") {
        var one = grid.getSelected();
        rows = one ? [one] : [];
      } else {
        rows = PourRecords.list(storage).filter(function (r) {
          return PourRecords.matchesStatusTab(r, kind);
        });
      }
      if (!rows.length) { msg.textContent = "내보낼 자료가 없습니다."; msg.className = "form-msg error"; return; }

      var book = PourExport.buildWorkbook(rows, PourRecords.MAIN_COLUMNS);
      if (!book) { msg.textContent = "엑셀 라이브러리를 불러오지 못했습니다."; msg.className = "form-msg error"; return; }
      PourExport.downloadWorkbook(book, "공사실적-" + kind + ".xlsx");
      msg.textContent = kind + " " + rows.length + "건을 내보냈습니다.";
    });
  });

  /* ---------------------------------------------------- 특허별 실적 */

  var patentView = "pour", activeSheet = null;

  Array.prototype.forEach.call(document.querySelectorAll("#patentViewTabs [data-pview]"), function (tab) {
    tab.addEventListener("click", function () {
      patentView = tab.getAttribute("data-pview");
      Array.prototype.forEach.call(document.querySelectorAll("#patentViewTabs [data-pview]"), function (t) {
        t.classList.toggle("is-active", t === tab);
      });
      renderPatentView();
    });
  });
  ["patentStatusFilter", "patentRegionFilter"].forEach(function (id) {
    $(id).addEventListener("change", renderPatentView);
  });
  $("patentKeyword").addEventListener("input", renderPatentView);

  $("btnPatentExcel").addEventListener("click", function () {
    var records = PourRecords.list(storage);
    var tabs = PourRecords.patentTabs(PourPatents.list(storage), records);
    var wb = PourExport.buildPatentWorkbook(tabs, records);
    if (!wb) return alert("엑셀 라이브러리를 불러오지 못했습니다.");
    PourExport.downloadWorkbook(wb, "특허별-실적.xlsx");
  });

  var THIRD_COLUMNS = [
    { key: "region", title: "지역", type: "text" },
    { key: "city", title: "도시", type: "text" },
    { key: "client", title: "발주처(아파트명)", type: "text" },
    { key: "projectNames", title: "공사명", type: "list" },
    { key: "status", title: "상태", type: "text" },
    { key: "thirdPatentNumbers", title: "타사 특허번호", type: "thirdNumbers" },
    { key: "__thirdNames", title: "타사 특허명·공법명", type: "thirdNames" },
    { key: "__thirdCompanies", title: "보유 회사", type: "thirdCompanies" },
    { key: "patentNumbers", title: "POUR 특허번호", type: "patent" }
  ];
  var MULTI_COLUMNS = [
    { key: "region", title: "지역", type: "text" },
    { key: "city", title: "도시", type: "text" },
    { key: "client", title: "발주처(아파트명)", type: "text" },
    { key: "projectNames", title: "공사명", type: "list" },
    { key: "status", title: "상태", type: "text" },
    { key: "__pourCount", title: "POUR 특허 개수", type: "statNumber" },
    { key: "__thirdCount", title: "타사 특허 개수", type: "statNumber" },
    { key: "__totalCount", title: "전체 특허 개수", type: "statNumber" },
    { key: "patentNumbers", title: "POUR 특허번호", type: "patent" },
    { key: "thirdPatentNumbers", title: "타사 특허번호", type: "thirdNumbers" },
    { key: "__patentStatus", title: "특허 확인 상태", type: "patentStatus" }
  ];

  var patentGrid = PourGrid.create($("patentGrid"), {
    columns: PourRecords.PATENT_TAB_COLUMNS,
    getRecords: function () { return patentRows(); },
    emptyText: "이 특허가 적용된 현장이 없습니다.",
    onOpen: function (rec) { openNotice(rec.id); }
  });
  var thirdGrid = PourGrid.create($("thirdGrid"), {
    columns: THIRD_COLUMNS,
    getRecords: function () {
      return PourRecords.list(storage).filter(function (r) { return r.thirdPatentNumbers.length; });
    },
    emptyText: "타사 특허가 입력된 현장이 없습니다.",
    onOpen: function (rec) { openNotice(rec.id); }
  });
  var multiGrid = PourGrid.create($("multiGrid"), {
    columns: MULTI_COLUMNS,
    getRecords: function () {
      return PourRecords.list(storage).filter(function (r) {
        return PourRecords.patentStats(r, storage).isMulti;
      });
    },
    emptyText: "다특허 현장이 없습니다.",
    onOpen: function (rec) { openNotice(rec.id); }
  });

  function patentRows() {
    if (!activeSheet) return [];
    var rows = PourRecords.recordsForPatent(activeSheet, PourRecords.list(storage));
    return PourRecords.applyFilters(rows, {
      status: $("patentStatusFilter").value,
      region: $("patentRegionFilter").value,
      keyword: $("patentKeyword").value.trim()
    });
  }

  function renderPatentView() {
    var isPour = patentView === "pour";
    $("sheetTabs").style.display = isPour ? "" : "none";
    $("patentSummary").style.display = isPour ? "" : "none";
    $("patentGrid").style.display = isPour ? "" : "none";
    $("thirdGrid").style.display = patentView === "third" ? "" : "none";
    $("multiGrid").style.display = patentView === "multi" ? "" : "none";

    if (patentView === "third") return thirdGrid.render();
    if (patentView === "multi") return multiGrid.render();

    var records = PourRecords.list(storage);
    var tabs = PourRecords.patentTabs(PourPatents.list(storage), records);
    if (!tabs.length) {
      $("sheetTabs").innerHTML = "";
      $("patentSummary").textContent = "등록된 특허가 없습니다. 「가져오기·내보내기」에서 POUR 특허 엑셀을 올려주세요.";
      $("patentGrid").innerHTML = "";
      return;
    }
    if (!activeSheet || !tabs.some(function (t) { return t.number === activeSheet; })) {
      activeSheet = (storage.getItem("pour.activePatentTab") &&
        tabs.some(function (t) { return t.number === storage.getItem("pour.activePatentTab"); }))
        ? storage.getItem("pour.activePatentTab") : tabs[0].number;
    }
    renderSheetTabs(tabs);

    var rows = patentRows();
    var regions = [];
    PourRecords.recordsForPatent(activeSheet, records).forEach(function (r) {
      if (r.region && regions.indexOf(r.region) < 0) regions.push(r.region);
    });
    var regionSelect = $("patentRegionFilter"), previous = regionSelect.value;
    regionSelect.innerHTML = "";
    ["전체"].concat(regions).forEach(function (r) { regionSelect.appendChild(new Option(r, r)); });
    regionSelect.value = regions.indexOf(previous) >= 0 ? previous : "전체";

    var tab = tabs.filter(function (t) { return t.number === activeSheet; })[0];
    var summary = PourRecords.summarize(rows);
    $("patentSummary").innerHTML = "<strong>" + tab.label + "</strong>" +
      (tab.name ? " · " + tab.name : "") + "<br>전체 " + summary.total + "건 · 낙찰 " + summary.awarded +
      "건 · 유찰 " + summary.failed + "건 · 총 " + summary.households.toLocaleString("ko-KR") +
      "세대 · 낙찰금액 " + PourRecords.formatAmountShort(summary.amount) +
      " · 적용 지역 " + summary.regions + "곳";

    patentGrid.render();
  }

  function renderSheetTabs(tabs) {
    var box = $("sheetTabs");
    box.innerHTML = "";
    var prev = document.createElement("button");
    prev.type = "button"; prev.className = "sheet-nav"; prev.textContent = "‹"; prev.title = "이전 탭";
    var next = document.createElement("button");
    next.type = "button"; next.className = "sheet-nav"; next.textContent = "›"; next.title = "다음 탭";
    var scroll = document.createElement("div");
    scroll.className = "sheet-scroll";
    var search = document.createElement("input");
    search.type = "search"; search.className = "sheet-search"; search.placeholder = "특허번호 검색";
    search.id = "sheetSearch";

    var visible = tabs.slice();
    function paint() {
      scroll.innerHTML = "";
      visible.forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "sheet-tab" + (t.number === activeSheet ? " is-active" : "");
        b.textContent = t.label;
        b.title = t.label + (t.name ? " — " + t.name : "");
        b.setAttribute("data-number", t.number);
        b.addEventListener("click", function () {
          activeSheet = t.number;
          try { storage.setItem("pour.activePatentTab", t.number); } catch (e) {}
          renderPatentView();
        });
        scroll.appendChild(b);
      });
    }
    function move(step) {
      var i = visible.findIndex(function (t) { return t.number === activeSheet; });
      var at = Math.min(Math.max(i + step, 0), visible.length - 1);
      if (visible[at]) {
        activeSheet = visible[at].number;
        try { storage.setItem("pour.activePatentTab", activeSheet); } catch (e) {}
        renderPatentView();
      }
    }
    prev.addEventListener("click", function () { move(-1); });
    next.addEventListener("click", function () { move(1); });
    search.addEventListener("input", function () {
      var q = search.value.replace(/[^0-9]/g, "");
      visible = q ? tabs.filter(function (t) { return t.number.indexOf(q) >= 0; }) : tabs.slice();
      paint();
    });

    box.appendChild(prev);
    box.appendChild(scroll);
    box.appendChild(next);
    box.appendChild(search);
    paint();
  }

  /* --------------------------------------------------- 특허 목록(설정) */

  function renderPatentList() {
    var q = $("patentListSearch").value.trim();
    var rows = q
      ? PourPatents.search(q, 200, storage).map(function (h) { return PourPatents.find(h.number, storage); })
      : PourPatents.list(storage);
    var box = $("patentListGrid");
    if (!rows.length) {
      box.innerHTML = '<div class="grid-empty">등록된 특허가 없습니다.</div>';
      return;
    }
    box.innerHTML = '<div class="grid-wrap"><table class="grid"><thead><tr>' +
      "<th>특허번호</th><th>특허명·공법명</th><th>공종</th><th>특허권자</th></tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr><td>" + PourPatents.formatNumber(r.number) + "</td><td>" + (r.name || "") +
          '</td><td class="cell-wrap">' + (r.categories || []).join("\n") + "</td><td>" +
          (r.company || "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  $("patentListSearch").addEventListener("input", renderPatentList);

  /* -------------------------------------------------------- 갱신 */

  function refresh() {
    renderAlerts();
    renderStatusTabs();
    grid.render();
    updateCount();
    syncRowButtons(grid.getSelected());
    if (state.view === "patents") renderPatentView();
    if (state.view === "settings") renderPatentList();
  }

  function showStorageError(err) {
    var bar = $("alertBar");
    var chip = document.createElement("div");
    chip.className = "alert-chip";
    chip.style.cursor = "default";
    chip.textContent = "서버 저장에 실패했습니다. 자료는 화면에 남아 있으며 다시 시도합니다. (" +
      (err && err.message ? err.message : "원인 미상") + ")";
    bar.insertBefore(chip, bar.firstChild);
  }

  window.PourApp = {
    refresh: refresh, showView: showView, openNotice: openNotice, openAward: openAward,
    grid: grid, state: state, storage: storage, usingApi: usingApi
  };

  if (usingApi) {
    storage.on(function (event) { if (event.type === "error") showStorageError(event.error); });
    // 서버에서 자료를 받아온 뒤 화면을 그린다
    storage.load().then(refresh).catch(function (err) {
      refresh();
      showStorageError(err);
    });
    // 저장이 끝나기 전에 창을 닫으면 알려 준다
    window.addEventListener("beforeunload", function (e) {
      if (!storage.hasPending()) return;
      e.preventDefault();
      e.returnValue = "";
    });
  } else {
    refresh();
  }
})();

</script>
