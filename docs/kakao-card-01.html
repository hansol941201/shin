<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1080px;height:1080px;overflow:hidden;
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo",sans-serif;
  word-break:keep-all;-webkit-font-smoothing:antialiased;}

.card{width:1080px;height:1080px;background:#0B2340;
  display:flex;flex-direction:column;padding:78px;}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:15px;color:#fff;}
.brand svg{width:40px;height:40px;}
.brand .wm{font-size:31px;font-weight:700;letter-spacing:.15em;line-height:1;}
.brand .sub{font-size:19px;color:rgba(255,255,255,.55);line-height:1;
  padding-left:15px;border-left:1px solid rgba(255,255,255,.2);}
.page{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:500;
  color:rgba(255,255,255,.38);letter-spacing:.1em;}

/* 본문 */
.body{flex:1;display:flex;flex-direction:column;justify-content:center;}

.label{display:flex;align-items:center;gap:18px;
  font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;
  letter-spacing:.1em;color:#7FC0EE;}
.label::before{content:"";width:40px;height:2px;background:#7FC0EE;display:block;}

h1{margin-top:44px;font-size:116px;font-weight:700;line-height:1.14;
  letter-spacing:-.05em;color:#fff;}
h1 em{font-style:normal;color:#7FC0EE;}

.lede{margin-top:52px;font-size:35px;font-weight:500;line-height:1.55;
  letter-spacing:-.025em;color:rgba(255,255,255,.72);}
.lede b{font-weight:600;color:#fff;}

/* 하단 */
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding-top:34px;border-top:1px solid rgba(255,255,255,.16);}
.foot .d{font-size:38px;font-weight:700;color:#fff;letter-spacing:-.035em;line-height:1.2;}
.foot .d span{font-weight:500;color:rgba(255,255,255,.72);}
.foot .corp{font-size:21px;color:rgba(255,255,255,.42);white-space:nowrap;line-height:2.2;}
</style>
</head>
<body>
<div class="card">

  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
        <path d="M12 7.5c1.9 2.2 3 3.8 3 5.2a3 3 0 0 1-6 0c0-1.4 1.1-3 3-5.2Z"/>
      </svg>
      <span class="wm">POUR</span>
      <span class="sub">기술지원</span>
    </div>
    <span class="page">01 / 05</span>
  </div>

  <div class="body">
    <span class="label">앱 전환 안내</span>

    <h1>기존 그대로,<br><em>더 편리하게</em></h1>

    <p class="lede">
      <b>현장 · 아이디 · 담당자는 그대로 유지</b>되고,<br>
      자료를 확인하고 요청하는 방식만 달라집니다.
    </p>
  </div>

  <div class="foot">
    <div class="d">10월 5일<span>부터 앱에서 접수 시작</span></div>
    <span class="corp">넷폼알앤디</span>
  </div>

</div>
</body>
</html>
