<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1080px;height:1080px;overflow:hidden;
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo",sans-serif;
  word-break:keep-all;-webkit-font-smoothing:antialiased;}
.card{width:1080px;height:1080px;}
.card{background:#FFFFFF;display:flex;flex-direction:column;padding:78px;}

.top{display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:14px;color:#0B2340;}
.mk{width:46px;height:46px;border-radius:11px;background:#0B2340;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mk svg{width:26px;height:26px;}
.brand .wm{font-size:31px;font-weight:700;letter-spacing:.15em;line-height:1;}
.brand .unit{font-size:19px;color:#8695A5;line-height:1;
  padding-left:15px;border-left:1px solid #DBE4ED;}
.page{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:500;
  color:#A8B6C4;letter-spacing:.1em;}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;}
.label{display:flex;align-items:center;gap:18px;
  font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;
  letter-spacing:.1em;color:#2E86C8;}
.label::before{content:"";width:40px;height:2px;background:#2E86C8;display:block;}
.card h2{margin:44px 0 0;font-size:116px;font-weight:700;line-height:1.14;
  letter-spacing:-.05em;color:#0B2340;}
.card h2 em{font-style:normal;color:#2E86C8;}
.lede{margin:52px 0 0;font-size:35px;font-weight:500;line-height:1.55;
  letter-spacing:-.025em;color:#5A6B7D;}
.lede b{font-weight:600;color:#0B2340;}

.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding-top:34px;border-top:1px solid #DBE4ED;}
.foot .d{font-size:38px;font-weight:700;color:#0B2340;letter-spacing:-.035em;line-height:1.2;}
.foot .d span{font-weight:500;color:#5A6B7D;}
.foot .corp{font-size:21px;color:#A8B6C4;white-space:nowrap;line-height:2.2;}

</style>
</head>
<body>
  <div class="card">
      <div class="top">
        <div class="brand">
          <span class="mk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4.6c3.1 3.6 4.9 6.2 4.9 8.5a4.9 4.9 0 0 1-9.8 0c0-2.3 1.8-4.9 4.9-8.5Z"/>
            </svg>
          </span>
          <span class="wm">POUR</span>
          <span class="unit">기술지원</span>
        </div>
        <span class="page">01 / 05</span>
      </div>

      <div class="body">
        <span class="label">앱 전환 안내</span>
        <h2>기존 그대로,<br><em>더 편리하게</em></h2>
        <p class="lede">
          <b>현장 · 아이디 · 담당자는 그대로 유지</b>되고,<br>
          자료를 확인하고 요청하는 방식만 달라집니다.
        </p>
      </div>

      <div class="foot">
        <div class="d">10월 5일<span>부터 앱에서 접수 시작</span></div>
        <span class="corp">넷폼알앤디</span>
      </div>
  </div>
</body>
</html>
