<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>POUR</title>
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Regular.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format('woff2');font-weight:800;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format('woff2');font-weight:900;font-display:block}

/* ===== 디자인 토큰 — 네이비 / 블루 / 화이트 단일 계열 ===== */
:root{
  --navy-900:#061223; --navy-800:#0A1B33; --navy-700:#102A4C; --navy-600:#16375F;
  --blue-600:#1E5FBF; --blue-500:#2F7BE8; --blue-400:#5AA0FF; --blue-100:#D6E6FB;
  --paper:#F4F7FB; --white:#FFFFFF;
  --ink-1:#FFFFFF; --ink-2:rgba(255,255,255,.74); --ink-3:rgba(255,255,255,.50);
  --hair:rgba(255,255,255,.14); --hair-2:rgba(255,255,255,.22);
  --shadow-1:0 12px 32px rgba(2,10,22,.34);
  --shadow-2:0 24px 64px rgba(2,10,22,.48);
  /* 레이아웃: 안전 여백 120px(6.25%), 8px 베이스라인 */
  --m:120px; --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:P,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--navy-800)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;inset:0}
.v-navy{background:linear-gradient(90deg,rgba(6,18,35,.95) 0%,rgba(6,18,35,.82) 44%,rgba(6,18,35,.46) 100%)}
.v-deep{background:linear-gradient(180deg,rgba(10,27,51,.90) 0%,rgba(6,18,35,.94) 100%)}
.v-soft{background:linear-gradient(180deg,rgba(6,18,35,.34) 0%,rgba(6,18,35,.88) 100%)}
.el{position:absolute;opacity:0;will-change:transform,opacity}

/* ===== 타이포 스케일 — 위계를 4단계로 고정 =====
   Display 104 / Title 72 / Section 56 / Sub 44 / Body 34 / Label 22        */
.t-display{font-size:104px;font-weight:900;line-height:1.06;letter-spacing:-.045em;color:var(--ink-1)}
.t-title  {font-size:72px; font-weight:800;line-height:1.10;letter-spacing:-.04em; color:var(--ink-1)}
.t-section{font-size:56px; font-weight:800;line-height:1.14;letter-spacing:-.035em;color:var(--ink-1)}
.t-sub    {font-size:44px; font-weight:700;line-height:1.24;letter-spacing:-.03em; color:var(--ink-1)}
.t-body   {font-size:34px; font-weight:600;line-height:1.40;letter-spacing:-.025em;color:var(--ink-2)}
.t-small  {font-size:26px; font-weight:600;line-height:1.44;letter-spacing:-.02em; color:var(--ink-2)}
.kicker   {font-size:22px; font-weight:700;letter-spacing:.22em;color:var(--blue-400)}
.eyebrow  {font-size:20px; font-weight:700;letter-spacing:.16em;color:var(--blue-400)}
.h1{font-size:72px;font-weight:800;color:var(--ink-1);line-height:1.10;letter-spacing:-.04em}
.h2{font-size:56px;font-weight:800;color:var(--ink-1);line-height:1.14;letter-spacing:-.035em}
.h3{font-size:44px;font-weight:700;color:var(--ink-1);letter-spacing:-.03em}
.lbl{font-size:26px;font-weight:600;color:var(--ink-2)}
.num{font-weight:900;color:var(--ink-1);font-variant-numeric:tabular-nums;letter-spacing:-.045em}

/* ===== 컴포넌트 — 모서리/테두리/그림자/간격 통일 ===== */
.chip{display:flex;align-items:center;gap:20px}
.chip .bar{width:6px;background:var(--blue-500);border-radius:3px}
.chip .tx{font-size:56px;font-weight:800;color:var(--ink-1);letter-spacing:-.035em}
.card{position:absolute;border-radius:var(--r);overflow:hidden;background:var(--navy-700);
  box-shadow:var(--shadow-2);border:1px solid var(--hair)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 22px 18px;
  font-size:22px;font-weight:600;color:var(--ink-1);letter-spacing:-.02em;
  background:linear-gradient(180deg,rgba(6,18,35,0),rgba(6,18,35,.90))}
.pedestal{position:absolute;border-radius:var(--r);background:var(--white);
  box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.box{position:absolute;border-radius:var(--r);background:rgba(255,255,255,.05);
  border:1px solid var(--hair);overflow:hidden}
.box .hd{display:flex;align-items:center;gap:14px;padding:24px 24px 16px}
.box .hd .dot{width:10px;height:10px;border-radius:50%;background:var(--blue-500);flex:none}
.box .hd .t{font-size:32px;font-weight:800;color:var(--ink-1);letter-spacing:-.03em}
.box .media{position:relative;margin:0 24px 24px;border-radius:8px;overflow:hidden;background:var(--navy-700)}
.box .media img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.row{display:flex;align-items:center;gap:18px}
.row .k{width:12px;height:12px;border:3px solid var(--blue-500);border-radius:50%;flex:none}
.row .t{font-size:40px;font-weight:700;color:var(--ink-1);letter-spacing:-.03em}

/* ===== 밝은 섹션 =====
   전 장면이 네이비면 단조롭다. 토큰만 뒤집어 같은 컴포넌트를 화이트로 쓴다. */
.v-light{background:linear-gradient(180deg,#FFFFFF 0%,#F2F6FC 56%,#E6EDF7 100%)}
.light{
  --ink-1:#08182E; --ink-2:rgba(8,24,46,.70); --ink-3:rgba(8,24,46,.46);
  --hair:rgba(8,24,46,.13); --hair-2:rgba(8,24,46,.22);
  --blue-400:#1E5FBF;
  --shadow-1:0 10px 26px rgba(8,24,46,.10);
  --shadow-2:0 22px 52px rgba(8,24,46,.16);
}
.light .card{background:#FFFFFF;border-color:rgba(8,24,46,.10)}
.light .card .cap{color:#08182E;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.94))}
.light .box{background:#FFFFFF;border-color:rgba(8,24,46,.10);box-shadow:var(--shadow-1)}
.light .box .media{background:#E8EEF6}
.light .row .k{border-color:var(--blue-500)}
.light .chip .bar{background:var(--blue-500)}

/* 원본 미투입 슬롯 — AI로 대체하지 않고 무엇이 필요한지 표기 */
.ph{position:absolute;inset:0;background:
   repeating-linear-gradient(135deg,rgba(47,123,232,.13) 0 14px,rgba(47,123,232,.04) 14px 28px),var(--navy-700);
   border:2px dashed rgba(90,160,255,.48);border-radius:8px;
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.ph .t{font-size:22px;font-weight:700;color:var(--blue-400);letter-spacing:-.02em;line-height:1.3}
.ph .s{font-size:16px;font-weight:600;color:rgba(90,160,255,.60);letter-spacing:.06em}
.pedestal .ph,.light .ph{background:repeating-linear-gradient(135deg,rgba(30,95,191,.10) 0 14px,rgba(255,255,255,0) 14px 28px),#EAF0F8;
  border-color:rgba(30,95,191,.34)}
.pedestal .ph .t,.light .ph .t{color:#1E5FBF}
.pedestal .ph .s,.light .ph .s{color:rgba(30,95,191,.60)}

/* ===== 고정 워드마크 — 모든 장면에서 같은 위치·크기 ===== */
#mark{position:absolute;left:120px;top:64px;display:flex;align-items:center;gap:14px;opacity:0;z-index:50}
#mark .m{font-size:28px;font-weight:900;color:var(--ink-1);letter-spacing:.30em;line-height:1}
#mark .r{width:52px;height:2px;background:var(--blue-500)}

/* ===== 자막 — 안전 여백 확보, 모바일 가독성 ===== */
#sub{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
  max-width:1440px;padding:18px 36px;border-radius:8px;
  background:rgba(6,18,35,.82);border:1px solid rgba(255,255,255,.12);
  font-size:36px;font-weight:600;color:var(--white);text-align:center;
  letter-spacing:-.025em;line-height:1.34;opacity:0;white-space:pre-wrap;
  text-shadow:0 2px 8px rgba(0,0,0,.45)}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--blue-500);opacity:.85}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head>
<body><div id="stage"></div><div id="mark"><div class="m">POUR</div><div class="r"></div></div>
<div id="sub"></div><div id="prog"></div>
<script src="film.js"></script></body></html>
