<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>POUR</title>
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Regular.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format('woff2');font-weight:800;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format('woff2');font-weight:900;font-display:block}
:root{
  --navy:#0A1B33; --navy2:#0F2647; --navy3:#16385F;
  --accent:#2F7BE8; --accent2:#5AA0FF;
  --line:rgba(255,255,255,.16); --ink:#0A1B33; --paper:#FFFFFF; --mist:#EDF1F6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:P,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;inset:0}
.v-navy{background:linear-gradient(90deg,rgba(10,27,51,.94) 0%,rgba(10,27,51,.80) 42%,rgba(10,27,51,.42) 100%)}
.v-deep{background:linear-gradient(180deg,rgba(10,27,51,.86) 0%,rgba(10,27,51,.92) 100%)}
.v-soft{background:linear-gradient(180deg,rgba(10,27,51,.30) 0%,rgba(10,27,51,.86) 100%)}
.el{position:absolute;opacity:0;will-change:transform,opacity}

/* typography */
.kicker{font-size:22px;font-weight:700;letter-spacing:.22em;color:var(--accent2)}
.h1{font-size:96px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-.035em}
.h2{font-size:64px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.035em}
.h3{font-size:44px;font-weight:700;color:#fff;letter-spacing:-.03em}
.lbl{font-size:26px;font-weight:600;color:rgba(255,255,255,.72)}
.num{font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.045em}

/* chips / cards */
.chip{display:flex;align-items:center;gap:22px}
.chip .bar{width:8px;height:52px;background:var(--accent);border-radius:2px}
.chip .tx{font-size:60px;font-weight:800;color:#fff;letter-spacing:-.035em}
.card{position:absolute;border-radius:14px;overflow:hidden;background:#0d2242;
  box-shadow:0 26px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.10)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:22px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,rgba(10,27,51,0),rgba(10,27,51,.92))}
.pedestal{position:absolute;border-radius:16px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.pedestal img{max-width:82%;max-height:74%;object-fit:contain}

/* placeholder */
.ph{position:absolute;inset:0;background:
   repeating-linear-gradient(135deg,rgba(47,123,232,.14) 0 14px,rgba(47,123,232,.04) 14px 28px),#10243f;
   border:2px dashed rgba(90,160,255,.55);border-radius:12px;
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.ph .t{font-size:22px;font-weight:700;color:#9FC4FF;letter-spacing:-.02em;line-height:1.3}
.ph .s{font-size:16px;font-weight:600;color:rgba(159,196,255,.62);letter-spacing:.06em}
.pedestal .ph{background:repeating-linear-gradient(135deg,rgba(47,123,232,.10) 0 14px,rgba(255,255,255,0) 14px 28px),#F2F6FC;border-color:rgba(47,123,232,.45)}
.pedestal .ph .t{color:#2F7BE8}.pedestal .ph .s{color:rgba(47,123,232,.6)}

/* step boxes */
.box{position:absolute;border-radius:16px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.16);overflow:hidden;backdrop-filter:blur(2px)}
.box .hd{display:flex;align-items:center;gap:14px;padding:22px 26px 16px}
.box .hd .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.box .hd .t{font-size:32px;font-weight:800;color:#fff;letter-spacing:-.03em}
.box .media{position:relative;margin:0 26px 26px;border-radius:10px;overflow:hidden;background:#0d2242}
.box .media img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}

/* list rows */
.row{display:flex;align-items:center;gap:18px}
.row .k{width:14px;height:14px;border:3px solid var(--accent);border-radius:50%}
.row .t{font-size:40px;font-weight:700;color:#fff;letter-spacing:-.03em}

/* subtitle */
#sub{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);max-width:1480px;
  padding:16px 34px;border-radius:10px;background:rgba(6,16,31,.72);
  font-size:34px;font-weight:600;color:#fff;text-align:center;letter-spacing:-.025em;line-height:1.35;
  border:1px solid rgba(255,255,255,.10);opacity:0;white-space:pre-wrap}
#prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.wm{position:absolute;left:84px;top:66px;display:flex;align-items:center;gap:16px}
.wm .m{font-size:30px;font-weight:900;color:#fff;letter-spacing:.30em}
.wm .r{width:64px;height:2px;background:var(--accent)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head>
<body><div id="stage"></div><div id="sub"></div><div id="prog"></div>
<script src="film.js"></script></body></html>
