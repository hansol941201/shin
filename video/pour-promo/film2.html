<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>POUR</title>
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Regular.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format('woff2');font-weight:800;font-display:block}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format('woff2');font-weight:900;font-display:block}

/* ===== 디자인 토큰 v2 =====
   딥블루는 오프닝/핵심 수치/사진 섹션/클라이맥스/엔딩에만.
   본문 대부분은 오프화이트~쿨그레이 위에 딥블루 텍스트. */
:root{
  /* 딥블루 — 기존 남색보다 맑고 채도가 살아 있는 계열 */
  --deep-900:#071B33; --deep-800:#0C2C52; --deep-700:#14406F; --deep-600:#1D5490;
  /* 밝은 면 */
  --paper:#FFFFFF; --off:#F7F9FC; --cool:#EDF1F6; --mist:#E3EAF3;
  /* 포인트 — 밝은 블루 + 청록빛 블루 */
  --blue-600:#1557B8; --blue-500:#1E6FE0; --blue-400:#4A93F5; --blue-200:#B9D5FA;
  --teal-500:#0FA0C4; --teal-400:#37BBD9;
  /* 기본(밝은 면 기준) */
  --ink-1:#0C2C52; --ink-2:#46586F; --ink-3:#7C8CA3;
  --hair:rgba(12,44,82,.13); --hair-2:rgba(12,44,82,.22);
  --surface:var(--paper);
  --shadow-1:0 10px 26px rgba(7,27,51,.09);
  --shadow-2:0 22px 52px rgba(7,27,51,.14);
  --m:120px; --r:12px;
}
/* 딥블루 섹션 — 토큰만 뒤집는다 */
.deep{
  --ink-1:#FFFFFF; --ink-2:rgba(255,255,255,.76); --ink-3:rgba(255,255,255,.50);
  --hair:rgba(255,255,255,.14); --hair-2:rgba(255,255,255,.24);
  --surface:var(--deep-700);
  --blue-400:#7DB4FF; --blue-500:#4A93F5;
  --shadow-1:0 12px 30px rgba(2,10,22,.34);
  --shadow-2:0 24px 60px rgba(2,10,22,.48);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:P,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--off)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;inset:0}
/* 밝은 면 */
.v-off  {background:linear-gradient(180deg,#FFFFFF 0%,#F7F9FC 52%,#EDF1F6 100%)}
.v-cool {background:linear-gradient(160deg,#F9FBFD 0%,#EDF1F6 55%,#E3EAF3 100%)}
/* 사진 위 밝은 워시 — 사진이 옅게 비치는 오프화이트 */
.v-wash {background:linear-gradient(90deg,#F7F9FC 0%,rgba(247,249,252,.95) 30%,rgba(247,249,252,.62) 54%,rgba(247,249,252,.12) 82%,rgba(247,249,252,.02) 100%)}
.v-wash-r{background:linear-gradient(270deg,#F7F9FC 0%,rgba(247,249,252,.95) 30%,rgba(247,249,252,.62) 54%,rgba(247,249,252,.12) 82%,rgba(247,249,252,.02) 100%)}
/* 딥블루 면 */
.v-deep {background:linear-gradient(180deg,rgba(12,44,82,.93) 0%,rgba(7,27,51,.96) 100%)}
.v-deepL{background:linear-gradient(90deg,rgba(7,27,51,.95) 0%,rgba(7,27,51,.82) 46%,rgba(7,27,51,.42) 100%)}
.v-hero {background:radial-gradient(120% 92% at 50% 40%,#14406F 0%,#0C2C52 58%,#071B33 100%)}
.el{position:absolute;opacity:0;will-change:transform,opacity}

.t-display{font-size:104px;font-weight:900;line-height:1.12;letter-spacing:-.045em;color:var(--ink-1)}
.t-title  {font-size:72px; font-weight:800;line-height:1.14;letter-spacing:-.04em; color:var(--ink-1)}
.t-section{font-size:56px; font-weight:800;line-height:1.18;letter-spacing:-.035em;color:var(--ink-1)}
.t-sub    {font-size:44px; font-weight:700;line-height:1.28;letter-spacing:-.03em; color:var(--ink-1)}
.t-body   {font-size:34px; font-weight:600;line-height:1.44;letter-spacing:-.025em;color:var(--ink-2)}
.t-small  {font-size:26px; font-weight:600;line-height:1.48;letter-spacing:-.02em; color:var(--ink-2)}
.kicker   {font-size:22px; font-weight:700;letter-spacing:.22em;color:var(--blue-500)}
.deep .kicker{color:var(--blue-400)}
.eyebrow  {font-size:20px; font-weight:700;letter-spacing:.16em;color:var(--teal-500)}
.h1{font-size:72px;font-weight:800;color:var(--ink-1);line-height:1.14;letter-spacing:-.04em}
.h2{font-size:56px;font-weight:800;color:var(--ink-1);line-height:1.18;letter-spacing:-.035em}
.h3{font-size:44px;font-weight:700;color:var(--ink-1);letter-spacing:-.03em}
.lbl{font-size:26px;font-weight:600;color:var(--ink-2)}
.num{font-weight:900;color:var(--ink-1);font-variant-numeric:tabular-nums;letter-spacing:-.045em}

.chip{display:flex;align-items:center;gap:20px}
.chip .bar{width:6px;background:var(--blue-500);border-radius:3px}
.chip .tx{font-size:56px;font-weight:800;color:var(--ink-1);letter-spacing:-.035em}
.card{position:absolute;border-radius:var(--r);overflow:hidden;background:var(--surface);
  box-shadow:var(--shadow-2);border:1px solid var(--hair)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 22px 18px;
  font-size:22px;font-weight:600;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(180deg,rgba(7,27,51,0),rgba(7,27,51,.90))}
/* 사진 위 반투명 정보 카드 */
.glass{position:absolute;border-radius:var(--r);background:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow-2);backdrop-filter:blur(6px)}
.glass-b{position:absolute;border-radius:var(--r);background:rgba(7,27,51,.76);
  border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow-2);backdrop-filter:blur(6px)}
.pedestal{position:absolute;border-radius:var(--r);background:var(--paper);
  box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.box{position:absolute;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--hair);overflow:hidden;box-shadow:var(--shadow-1)}
.box .hd{display:flex;align-items:center;gap:14px;padding:24px 24px 16px}
.box .hd .dot{width:10px;height:10px;border-radius:50%;background:var(--blue-500);flex:none}
.box .hd .t{font-size:32px;font-weight:800;color:var(--ink-1);letter-spacing:-.03em}
.box .media{position:relative;margin:0 24px 24px;border-radius:8px;overflow:hidden;background:var(--cool)}
.deep .box .media{background:var(--deep-800)}
.box .media img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.row{display:flex;align-items:center;gap:18px}
.row .k{width:12px;height:12px;border:3px solid var(--blue-500);border-radius:50%;flex:none}
.row .t{font-size:40px;font-weight:700;color:var(--ink-1);letter-spacing:-.03em}

.ph{position:absolute;inset:0;background:
   repeating-linear-gradient(135deg,rgba(30,111,224,.10) 0 14px,rgba(255,255,255,0) 14px 28px),var(--cool);
   border:2px dashed rgba(30,111,224,.34);border-radius:8px;
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.ph .t{font-size:22px;font-weight:700;color:var(--blue-600);letter-spacing:-.02em;line-height:1.3}
.ph .s{font-size:16px;font-weight:600;color:rgba(21,87,184,.62);letter-spacing:.06em}
.deep .ph{background:repeating-linear-gradient(135deg,rgba(122,178,255,.13) 0 14px,rgba(255,255,255,0) 14px 28px),var(--deep-700);
  border-color:rgba(122,178,255,.42)}
.deep .ph .t{color:#9BC4FF}.deep .ph .s{color:rgba(155,196,255,.62)}

/* ===== 고정 워드마크 — 모든 장면에서 같은 위치·크기 ===== */
#mark{position:absolute;left:120px;top:64px;display:flex;align-items:center;gap:14px;opacity:0;z-index:50}
#mark .m{font-size:28px;font-weight:900;color:var(--ink-1);letter-spacing:.30em;line-height:1}
#mark .r{width:52px;height:2px;background:var(--teal-500)}

/* ===== 자막 — 안전 여백 확보, 모바일 가독성 ===== */
/* left:50% 만 주면 절대배치 박스의 가용 폭이 1920-960=960px 로 잘려
   max-width 가 무시된다. left/right 0 + auto 마진으로 중앙 정렬한다. */
#sub{position:absolute;left:0;right:0;bottom:116px;
  margin-left:auto;margin-right:auto;width:fit-content;max-width:1560px;padding:22px 44px;border-radius:12px;
  background:rgba(16,42,67,.90);
  font-size:42px;font-weight:700;color:#FFFFFF;text-align:center;
  letter-spacing:-.02em;line-height:1.35;opacity:0;
  word-break:keep-all;overflow-wrap:break-word;   /* 한국어는 어절 단위로만 줄바꿈 */
  text-shadow:none;backdrop-filter:none}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--teal-500);opacity:.9}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head>
<body><div id="stage"></div><div id="mark"><div class="m">POUR</div><div class="r"></div></div>
<div id="sub"></div><div id="prog"></div>
<script src="film2.js"></script></body></html>
