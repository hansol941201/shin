<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공고 등록 — POUR 공사실적 모듈 시연</title>
<link rel="stylesheet" href="pour-integration.css" />
<style>
  body{margin:0;padding:20px;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#1f2937;}
  h1{font-size:19px;margin:0 0 4px;}
  .lead{color:#6b7280;font-size:13px;margin:0 0 18px;}
  section{background:#fff;border:1px solid #d7dee7;border-radius:8px;padding:16px 18px;margin-bottom:16px;}
  h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #eef1f5;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px;}
  .hint{font-weight:400;color:#6b7280;font-size:11.5px;}
  input,select,textarea{width:100%;padding:7px 9px;font-size:13.5px;border:1px solid #c9d2dc;border-radius:5px;font-family:inherit;}
  .btn{padding:8px 15px;font-size:13.5px;border-radius:5px;border:1px solid #1f9d55;background:#1f9d55;color:#fff;cursor:pointer;font-weight:600;}
  .btn.secondary{background:#fff;color:#1f9d55;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:10px 0;}
  .stats b{font-size:16px;display:block;}
  .errors{font-size:12.5px;color:#d92d20;margin:8px 0 0;padding-left:18px;}
  .msg{font-size:13px;margin-top:8px;white-space:pre-line;}
  .msg.error{color:#d92d20;}
  .msg.ok{color:#15803d;}
  .pour-alert{
    background:#fff7e6;border:1px solid #f0a92e;color:#92400e;border-radius:8px;
    padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .pour-alert:hover{background:#fdf0d5;}
  .pour-modal-back{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;
  }
  .pour-modal{background:#fff;border-radius:10px;padding:20px 22px;max-width:900px;width:100%;}
  .pour-modal h3{margin:0 0 14px;font-size:16px;}
  .pour-history{margin-top:14px;font-size:12.5px;color:#6b7280;max-height:170px;overflow-y:auto;}
  .pour-history div{padding:4px 0;border-bottom:1px solid #f1f4f8;}
  .pour-sub{font-size:13.5px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid #eef1f5;}
  .pour-fielderror{display:block;margin-top:3px;font-size:12px;color:#d92d20;}
  .pour-rowbtn{padding:3px 9px;font-size:12px;border:1px solid #1f9d55;background:#fff;color:#1f9d55;border-radius:4px;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body class="pour-scope">

<h1>공고 등록</h1>
<p class="lead">「한솔 공사실적 통합관리」에 붙일 모듈의 동작 확인용 화면입니다. 자료는 브라우저에 저장되어 새로고침해도 유지됩니다.</p>

<div id="alertArea"></div>

<section id="missingSection" style="display:none">
  <h2>⚠ 특허번호 미기재 낙찰 목록 <button class="btn secondary" type="button" id="missingClose" style="float:right;padding:4px 10px">닫기</button></h2>
  <div id="missingTable"></div>
</section>

<section>
  <h2>① 특허 자료 관리 (관리자)</h2>
  <div class="grid">
    <div>
      <label>특허 관리 엑셀 업로드 <span class="hint">.xlsx · .xls · .csv</span></label>
      <input type="file" id="patentFile" accept=".xlsx,.xls,.csv" />
    </div>
    <div>
      <label>등록된 특허 검색</label>
      <input type="text" id="patentListSearch" placeholder="특허번호 · 특허명 · 공종" />
    </div>
  </div>
  <div class="actions">
    <button class="btn secondary" type="button" id="loadSampleBtn">예시 엑셀 자료 넣기</button>
  </div>
  <div class="stats" id="uploadStats"></div>
  <ul class="errors" id="uploadErrors"></ul>
  <div class="msg" id="uploadMsg"></div>
  <div id="patentListWrap" style="margin-top:10px"></div>
</section>

<section>
  <h2 class="pour-card-title">
    <span>② 새 공고 등록</span>
    <label class="pour-renotice"><input type="checkbox" id="isRenotice" /> 재공고 건</label>
  </h2>

  <div class="pour-rebid-panel" id="rebidPanel" style="display:none">
    <div class="pour-row pour-row-4">
      <div class="pour-field">
        <label for="rebidSearch">기존 공고 검색</label>
        <input type="text" id="rebidSearch" placeholder="단지명·공사명·도시" autocomplete="off" />
      </div>
      <div><label for="rebidTarget">기존 공고 선택</label><select id="rebidTarget"></select></div>
      <div><label for="rebidRound">재공고 차수 <span class="hint">자동</span></label><input type="text" id="rebidRound" readonly /></div>
      <div><label for="previousFailDate">이전 유찰일</label><input type="date" id="previousFailDate" /></div>
    </div>
    <div class="pour-row pour-row-1">
      <div><label for="rebidReason">재공고 사유</label><input type="text" id="rebidReason" placeholder="예: 응찰 없음, 예정가격 미달" /></div>
    </div>
  </div>

  <!-- 첫 줄: 아파트·단지명 | 공사명 | 공종 -->
  <div class="pour-row pour-row-3" id="rowBasic">
    <div>
      <label for="clientInput">아파트·단지명</label>
      <input type="text" id="clientInput" />
    </div>
    <div>
      <label for="projectNames">공사명 <span class="hint">여러 건은 줄바꿈</span></label>
      <textarea id="projectNames" rows="1"></textarea>
    </div>
    <div>
      <label for="categoryInput">공종 <span class="hint">특허 선택 시 자동 입력</span></label>
      <input type="text" id="categoryInput" placeholder="예: 재도장, 옥상 방수" />
    </div>
  </div>

  <!-- 둘째 줄: 지역 | 도시 | 전화번호(선택) | 세대수(선택) -->
  <div class="pour-row pour-row-4" id="rowRegion">
    <div>
      <label for="regionSelect">지역 <span class="hint">도시 입력 시 자동</span></label>
      <select id="regionSelect"><option value="">—</option></select>
    </div>
    <div class="pour-field">
      <label for="cityInput">도시</label>
      <input type="text" id="cityInput" placeholder="예: 하남, 금산, 평택" autocomplete="off" />
    </div>
    <div>
      <label for="phoneInput">전화번호 <span class="hint">(선택)</span></label>
      <input type="text" id="phoneInput" placeholder="031-647-3158" />
    </div>
    <div>
      <label for="householdsInput">세대수 <span class="hint">(선택)</span></label>
      <input type="text" id="householdsInput" />
    </div>
  </div>

  <!-- 셋째 줄: 공고일* | 서류 마감일(선택) | 개찰일(선택) | 입찰종류 -->
  <div class="pour-row pour-row-4" id="rowSchedule">
    <div>
      <label for="noticeDate">공고일 <span class="pour-required">*</span></label>
      <input type="date" id="noticeDate" />
    </div>
    <div>
      <label for="documentDueDate">서류 마감일 <span class="hint">(선택)</span></label>
      <input type="date" id="documentDueDate" />
    </div>
    <div>
      <label for="bidDate">개찰일 <span class="hint">(선택)</span></label>
      <input type="date" id="bidDate" />
    </div>
    <div>
      <label>입찰종류</label>
      <div class="pour-bidtype" id="bidTypeGroup">
        <button type="button" class="pour-bidtype-btn" data-bid="서류접수">서류접수</button>
        <button type="button" class="pour-bidtype-btn" data-bid="전자입찰">전자입찰</button>
      </div>
    </div>
  </div>

  <!-- 넷째 줄: 접어둔 추가 항목 -->
  <details class="pour-more" id="moreDetails">
    <summary>특허 · 공사범위 · 추가정보 펼치기</summary>
    <div class="pour-row pour-row-1" style="margin-top:12px">
      <div>
        <label>적용 특허 <span class="hint">POUR 특허와 타사 특허를 나누어 입력</span></label>
        <div id="patentEditor"></div>
      </div>
    </div>
    <div class="pour-row pour-row-fill">
      <div>
        <label for="noticePatentText">특허번호 또는 특허명 <span class="hint">공고문 원문</span></label>
        <input type="text" id="noticePatentText" placeholder="공고문에 적힌 특허번호, 특허명 또는 공법명" />
      </div>
      <div><label for="agreementNo">협약서 발행번호</label><input type="text" id="agreementNo" /></div>
      <div><label for="scopeInput">공사 범위 <span class="hint">여러 건은 줄바꿈</span></label><textarea id="scopeInput" rows="2"></textarea></div>
      <div><label for="addressInput">주소</label><input type="text" id="addressInput" /></div>
      <div>
        <label for="qualityInput">공사 품질</label>
        <input type="text" id="qualityInput" list="qualityOptions" placeholder="비워두면 빈칸으로 저장" />
        <datalist id="qualityOptions"></datalist>
      </div>
      <div><label for="statusInput">상태</label><select id="statusInput"></select></div>
      <div><label for="contractorInput">시공사 <span class="hint">공고 단계에서는 비워둠</span></label><input type="text" id="contractorInput" /></div>
      <div><label for="remarkInput">비고</label><input type="text" id="remarkInput" /></div>
    </div>
  </details>

  <div class="actions pour-actions-right">
    <button class="btn secondary" type="button" id="resetFormBtn">입력 초기화</button>
    <button class="btn" type="button" id="saveBtn">공고 등록하기</button>
  </div>
  <div class="msg" id="saveMsg"></div>
</section>



<section>
  <h2>③ 전체 공고·실적 목록</h2>
  <div class="pour-kind-tabs" id="statusTabs" style="max-width:640px"></div>
  <div class="actions" style="margin:0 0 12px">
    <button class="btn secondary" type="button" id="csvBtn">CSV 내려받기</button>
    <button class="btn secondary" type="button" data-export="전체">전체 실적 엑셀</button>
    <button class="btn secondary" type="button" data-export="낙찰">낙찰 실적 엑셀</button>
    <button class="btn secondary" type="button" data-export="공고">공고 실적 엑셀</button>
    <button class="btn secondary" type="button" data-export="재공고(유찰)">재공고·유찰 엑셀</button>
  </div>
  <div id="allTable"></div>
</section>

<section>
  <h2>④ 특허별 실적</h2>
  <div class="pour-kind-tabs" id="viewTabs" style="max-width:520px">
    <button type="button" class="pour-kind-tab is-active" data-view="pour">POUR 특허별 실적</button>
    <button type="button" class="pour-kind-tab" data-view="third">타사 특허별 현황</button>
    <button type="button" class="pour-kind-tab" data-view="multi">다특허 현황</button>
  </div>
  <div id="patentTabs"></div>
  <div class="pour-summary" id="patentSummary"></div>
  <div class="pour-filters">
    <label class="pour-filter-label">상태 <select id="filterStatus"></select></label>
    <label class="pour-filter-label">지역 <select id="filterRegion"><option>전체</option></select></label>
    <label class="pour-filter-label">연도 <select id="filterYear"><option>전체</option></select></label>
    <input type="search" id="filterKeyword" placeholder="발주처·공사명 검색" />
    <button class="btn secondary" type="button" id="patentXlsxBtn">특허별 실적 엑셀 내려받기</button>
  </div>
  <div id="patentTable"></div>
  <div id="thirdView" style="display:none"></div>
  <div id="multiView" style="display:none"></div>
</section>

<div class="pour-modal-back" id="awardBack" style="display:none">
  <div class="pour-modal">
    <h3>낙찰 상세정보 입력</h3>
    <div class="pour-summary" id="awardSummary"></div>

    <h4 class="pour-sub">시공사 정보</h4>
    <div class="pour-row pour-row-fill" id="awardContractorFields"></div>

    <h4 class="pour-sub">낙찰 정보</h4>
    <div class="pour-row pour-row-fill" id="awardInfoFields"></div>

    <div style="margin-top:12px">
      <label>적용 특허 <span class="hint">아직 몰라도 저장할 수 있습니다</span></label>
      <div id="awardPatentEditor"></div>
    </div>

    <div class="actions pour-actions-right">
      <button class="btn secondary" type="button" id="awardCancel">취소</button>
      <button class="btn" type="button" id="awardSave">낙찰로 저장</button>
    </div>
    <div class="msg" id="awardMsg"></div>
  </div>
</div>

<div class="pour-modal-back" id="editBack" style="display:none">
  <div class="pour-modal">
    <h3 id="editTitle">자료 수정</h3>
    <div class="grid" id="editFields"></div>
    <div style="margin-top:12px">
      <label>적용 특허 <span class="hint">POUR 특허와 타사 특허를 나누어 입력</span></label>
      <div id="editPatentEditor"></div>
      <label style="margin-top:8px;font-weight:400">
        <input type="checkbox" id="editConfirmed" style="width:auto" /> 직접 확인 완료 (엑셀에 없는 번호도 확정 처리)
      </label>
    </div>
    <div id="editHistory" class="pour-history"></div>
    <div class="actions">
      <button class="btn" type="button" id="editSave">저장</button>
      <button class="btn secondary" type="button" id="editCancel">취소</button>
    </div>
    <div class="msg" id="editMsg"></div>
  </div>
</div>

<script src="vendor/exceljs.min.js"></script>
<script src="regions.data.js"></script>
<script src="pour-region.js"></script>
<script src="pour-patents.js"></script>
<script src="pour-records.js"></script>
<script src="pour-export.js"></script>
<script src="pour-ui.js"></script>
<script src="pour-patent-editor.js"></script>
<script src="demo.js"></script>
</body>
</html>
