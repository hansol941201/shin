    for(var i = 0; i < tokens.length; i++){
      var tm = tokens[i].match(CONTACT_TITLE_RE);
      if(tm && tm.index === 0 && i > 0 && CONTACT_NAME_ONLY_RE.test(tokens[i-1])){
        return { contactName: tokens[i-1], position: tm[1] };
      }
    }
    return { contactName:'', position:'' };
  }
  function extractPhoneHint(text){
    var m = String(text || '').match(PHONE_RE);
    return m ? m[0] : '';
  }

  // §신규: "미등록 시공사 기록" 규칙 기반 업체명/특이사항 추정(AI 미사용, API KEY 불필요).
  // parseCallMemoLocally()의 "업체 접미어(OO건설 등)"/"토큰 단위" 휴리스틱을 이 모듈 안에서
  // 그대로 다시 사용한다. 판단이 애매하면 원문 전체를 특이사항에 넣는다(억지로 쪼개지 않음).
  var UNMATCHED_SUFFIXES = ['건설','산업','개발','기업','상사','이엔지','E&C','EnC','주식회사'];
  var UNMATCHED_NOTE_START_WORDS = ['협력사','견적','문의','요청','자료','리스트','시방서','샘플','미팅','방문','공사','시공','담당자','전화','연락','제안서'];
  // §신규 라운드: confidence('high'|'low')를 함께 돌려준다(요구사항 5) — "OO건설"류처럼
  // 업체 접미어가 뚜렷한 1번 규칙만 high로 취급하고, 2번(문장 앞부분을 통째로 업체명으로
  // 추정)/3번(첫 토큰만 업체명 후보) 규칙은 애매한 추정이므로 항상 low로 남긴다. 자동 업체
  // 등록은 오직 high일 때만 호출부(빠른 고객기록 UI)가 시도한다.
  function guessUnmatched(rawText){
    var text = String(rawText || '').trim();
    if(!text) return { companyName:'', note:'', confidence:'low' };

    // 1) "OO건설"류 업체 접미어가 있으면 그 토막을 업체명 후보로, 나머지를 특이사항으로.
    var sufAlt = UNMATCHED_SUFFIXES.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    var sufRe = new RegExp('^([가-힣A-Za-z0-9]{1,10}(?:' + sufAlt + '))');
    var sufM = text.match(sufRe);
    if(sufM){
      var name1 = sufM[1].trim();
      var rest1 = text.slice(sufM[0].length).replace(/^[\s,:\-]+/, '').trim();
      return { companyName: name1, note: rest1 || text, confidence:'high' };
    }

    // 2) 첫 토큰들 뒤에 "특이사항이 시작되는 흔한 단어"가 나오면 그 앞까지를 업체명으로.
    var tokens = text.split(/\s+/).filter(Boolean);
    for(var i = 1; i < tokens.length; i++){
      if(UNMATCHED_NOTE_START_WORDS.indexOf(tokens[i]) !== -1){
        var name2 = tokens.slice(0, i).join(' ');
        var note2 = tokens.slice(i).join(' ');
        return { companyName: name2, note: note2 || text, confidence:'low' };
      }
    }

    // 3) 판단이 어려우면 첫 토큰만 업체명 후보로 삼고, 원문 전체를 그대로 특이사항에 둔다.
    return { companyName: tokens[0] || '', note: text, confidence:'low' };
  }

  // §신규: 미등록 기록 생성 — companyId는 절대 자동 생성하지 않고 null로 둔다(자동 생성 금지
  // 원칙 최우선 준수). originalText는 사용자가 입력창에 타이핑한 원문 그대로, 절대 가공하지
  // 않는다(자동분리 로직이 손대는 값은 companyName/note뿐).
  function addUnmatchedActivity(companyName, note, originalText){
    var now = new Date().toISOString();
    var rec = {
      id: genId(), companyId: null, companyName: companyName || '', note: note || '',
      originalText: originalText, matchStatus: 'unmatched', createdAt: now, updatedAt: now
    };
    var all = loadActivities();
    all.push(rec);
    saveActivities(all);
    return rec;
  }

  // §신규: 미등록 기록의 companyName/note만 인라인 수정. originalText는 이 함수가 절대 건드리지
  // 않는다(항상 최초 입력 그대로 유지).
  function updateUnmatchedActivity(id, fields){
    var all = loadActivities();
    var rec = all.find(function(a){ return a.id === id; });
    if(!rec) return null;
    if(fields.companyName !== undefined) rec.companyName = fields.companyName;
    if(fields.note !== undefined) rec.note = fields.note;
    rec.updatedAt = new Date().toISOString();
    saveActivities(all);
    return rec;
  }

  // §신규: "[업체 연결]" — 사용자가 명시적으로 기존 업체를 골랐을 때만 호출된다. 같은 레코드를
  // 그 자리에서 갱신할 뿐, 새 레코드를 만들거나 지우지 않는다(자동 병합은 어디서도 일어나지 않음).
  function linkActivityToCompany(id, companyId){
    if(!companyId) return null;
    var all = loadActivities();
    var rec = all.find(function(a){ return a.id === id; });
    if(!rec) return null;
    rec.companyId = companyId;
    rec.matchStatus = 'matched';
    rec.updatedAt = new Date().toISOString();
    saveActivities(all);
    return rec;
  }

  window.SHIN2_ACTIVITIES = {
    loadCompanies: loadCompanies, loadAll: loadActivities, matchCompany: matchCompany,
    classify: classifyActivity, add: addActivity, forCompany: forCompany,
    update: updateActivity, remove: deleteActivity, stripDesignationPrefix: stripDesignationPrefix,
    statusOf: statusOf, guessUnmatched: guessUnmatched, addUnmatched: addUnmatchedActivity,
    updateUnmatched: updateUnmatchedActivity, linkToCompany: linkActivityToCompany,
    // §신규 라운드(요구사항 2/3/5/6):
    pendingStatusOf: pendingStatusOf, complete: completeActivity, pendingList: pendingList,
    normCompanyKey: normCompanyKey, findExistingCompanyByName: findExistingCompanyByName,
    extractContactHint: extractContactHint, extractPhoneHint: extractPhoneHint,
    // §업무 입력 연동 라운드:
    uncomplete: uncompleteActivity, setTaskMemo: setTaskMemo, summarizeRequest: summarizeRequest
  };
})();
</script>

<script>
/* ==========================================================================
   빠른 고객기록 UI(§5~10) — 홈 화면의 입력 한 줄. 드롭다운/모달 없이 입력→Enter→기록완료.
   ========================================================================== */
(function(){
  'use strict';
  var input = document.getElementById('qrInput');
  var resultEl = document.getElementById('qrResult');
  var pendingWrap = document.getElementById('qrPendingWrap');
  if(!input || !resultEl) return;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function localDateStr(ts){ var d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function fmtTime(ts){ var d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function fmtShort(ts){
    var d = new Date(ts);
    return (localDateStr(ts) === todayStr()) ? fmtTime(ts)
      : (pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()));
  }

  function clearResult(){ resultEl.innerHTML = ''; }

  // §신규 라운드: 시공사 전화기록 저장 시 업체 메모에도 같은 내용을 한 줄 남긴다(요구사항 7).
  // 기존 SHIN2_MEMO(targetType:'company')를 그대로 재사용 — 새 메모 저장소를 만들지 않고,
  // addFor()는 항상 append만 한다(기존 메모를 지우거나 덮어쓰지 않음).
  function appendCompanyMemo(companyId, activityText, originalText){
    if(!companyId || !window.SHIN2_MEMO) return;
    var body = (activityText && activityText.trim()) ? activityText.trim() : (originalText || '').trim();
    if(!body) return;
    window.SHIN2_MEMO.addFor('company', companyId, fmtTime(Date.now()) + ' ' + body);
  }

  function showMatched(companyName){
    resultEl.innerHTML = '<div class="qr-inline-ok">' + escapeHtml(companyName) + '에 기록했습니다.</div>';
    input.value = '';
    setTimeout(function(){ if(resultEl.firstChild) clearResult(); }, 3000);
    renderPending();
    // 새로 저장된 customerActivities 레코드가 홈 "고객 업무" 섹션에도 즉시 보이도록 갱신한다.
    if(window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
  }

  function showAmbiguous(m){
    var html = '<div class="qr-candidates"><div class="qr-candidates-text">여러 업체가 후보로 보입니다. 하나를 선택하세요.</div>';
    m.candidates.forEach(function(c){
      html += '<button type="button" class="qr-candidate-btn" data-co="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + '</button>';
    });
    html += '<button type="button" class="co-text-action" data-cancel="1">취소</button></div>';
    resultEl.innerHTML = html;
    resultEl.querySelectorAll('[data-co]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var co = m.candidates.find(function(c){ return c.id === btn.getAttribute('data-co'); });
        if(!co) return;
        var strip = window.SHIN2_ACTIVITIES.stripDesignationPrefix;
        var normText = strip(m.originalText);
        var normName = strip(co.name);
        var rest = normText.indexOf(normName) === 0
          ? m.originalText.slice(m.originalText.length - normText.length + normName.length).replace(/^[\s,:\-]+/, '').trim()
          : m.originalText;
        window.SHIN2_ACTIVITIES.add(co.id, m.originalText, rest);
        appendCompanyMemo(co.id, rest, m.originalText);
        showMatched(co.name);
      });
    });
    resultEl.querySelector('[data-cancel]').addEventListener('click', clearResult);
  }

  // §신규: "미등록 시공사 기록" — 매칭되는 업체가 없어도 저장을 막지 않는다. 규칙 기반으로
  // 업체명/특이사항을 추정해 미리 채워두고, 사용자가 확인·수정한 뒤 저장하면 companyId:null,
  // matchStatus:'unmatched' 레코드로 customerActivities에 그대로 기록된다(새 업체/새 저장소를
  // 자동으로 만들지 않는다). §신규 라운드: 이 인라인 폼은 오직 "확신 낮은" 업체명 추정일
  // 때만 뜬다(요구사항 5/11) — 팝업이 아닌 입력창 바로 아래 인라인 패널 그대로 유지한다.
  function showUnmatchedConfirm(originalText){
    var guess = window.SHIN2_ACTIVITIES.guessUnmatched(originalText);
    var html = '<div class="qr-unmatched">' +
      '<div class="qr-unmatched-text">등록된 업체를 찾지 못했습니다. 아래 내용을 확인하고 저장하세요.</div>' +
      '<div class="qr-unmatched-field"><label>업체명</label><input type="text" id="qrUnmatchedName" value="' + escapeHtml(guess.companyName) + '" /></div>' +
      '<div class="qr-unmatched-field"><label>특이사항</label><textarea id="qrUnmatchedNote">' + escapeHtml(guess.note) + '</textarea></div>' +
      '<div class="qr-action-row"><button type="button" id="qrUnmatchedSaveBtn" class="ai-run-btn">저장</button>' +
      '<button type="button" class="co-text-action" data-unmatched-cancel="1">취소</button></div>' +
    '</div>';
    resultEl.innerHTML = html;
    resultEl.querySelector('#qrUnmatchedSaveBtn').addEventListener('click', function(){
      var nameVal = resultEl.querySelector('#qrUnmatchedName').value.trim();
      var noteVal = resultEl.querySelector('#qrUnmatchedNote').value.trim();
      window.SHIN2_ACTIVITIES.addUnmatched(nameVal, noteVal, originalText);
      showMatched(nameVal || '미등록 업체');
    });
    resultEl.querySelector('[data-unmatched-cancel]').addEventListener('click', clearResult);
    // §9: 입력했던 원문은 그대로 유지한다(지우지 않음) — 취소해도 textarea 값은 남는다.
  }

  // §신규 라운드(요구사항 5/6): 확신 높은 미등록 업체명을 만나면, 팝업/수동입력 없이 즉시
  // 최소 정보(업체명 + 뽑히면 담당자/직책/전화)로 새 업체를 만들고 그 업체로 기록을 붙인다.
  // 자동 생성 직전에도 정규화 키로 한 번 더 기존 업체와 겹치는지 확인한다(요구사항 6,
  // matchCompany가 이미 대부분 걸러내지만 이중 방어).
  function tryAutoRegister(originalText, guess){
    var ACT = window.SHIN2_ACTIVITIES;
    var existing = ACT.findExistingCompanyByName(guess.companyName);
    if(existing){
      // 이미 있는 업체였다 — 새로 만들지 않고 그대로 그 업체에 붙인다(중복 생성 방지).
      ACT.add(existing.id, originalText, guess.note);
      appendCompanyMemo(existing.id, guess.note, originalText);
      showMatched(existing.name);
      return;
    }
    if(!window.SHIN2_COMPANIES || !window.SHIN2_COMPANIES.autoCreate){
      showUnmatchedConfirm(originalText);
      return;
    }
    var contact = ACT.extractContactHint(guess.note);
    var phone = ACT.extractPhoneHint(originalText);
    var newCo = window.SHIN2_COMPANIES.autoCreate({
      name: guess.companyName, contactName: contact.contactName, position: contact.position, phone: phone
    });
    if(!newCo){ showUnmatchedConfirm(originalText); return; }
    ACT.add(newCo.id, originalText, guess.note);
    appendCompanyMemo(newCo.id, guess.note, originalText);
    showMatched(newCo.name);
  }

  function handleEnter(){
    var text = input.value;
    if(!text || !text.trim()) return;
    var m = window.SHIN2_ACTIVITIES.matchCompany(text);
    if(m.status === 'matched'){
      window.SHIN2_ACTIVITIES.add(m.company.id, m.originalText, m.activityText);
      appendCompanyMemo(m.company.id, m.activityText, m.originalText);
      showMatched(m.company.name);
    } else if(m.status === 'ambiguous'){
      showAmbiguous(m);
    } else if(m.status === 'none'){
      var guess = window.SHIN2_ACTIVITIES.guessUnmatched(m.originalText);
      if(guess.confidence === 'high' && guess.companyName){
        tryAutoRegister(m.originalText, guess);
      } else {
        showUnmatchedConfirm(m.originalText);
      }
    }
  }

  input.addEventListener('keydown', function(e){
    // textarea로 바뀌면서 Shift+Enter는 줄바꿈으로 남겨두고(기본 동작 그대로 허용),
    // 순수 Enter만 저장을 트리거한다(기존 동작과 동일).
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleEnter(); }
  });

  // [저장] 버튼(§신규) — Enter와 완전히 동일한 저장 경로(handleEnter)를 그대로
  // 호출한다. 별도의 저장 로직을 새로 만들지 않는다(중복 기록 방지).
  var saveBtn = document.getElementById('qrSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', function(){ handleEnter(); });

  // ==========================================================================
  // §신규 라운드: 인라인 미처리 목록(요구사항 1/2/3/4/10) — 저장 직후 확인을 팝업("전체
  // 보기")이 아니라 이 목록이 담당한다. 데이터는 여전히 SHIN2_ACTIVITIES(customerActivities)
  // 하나뿐이고, 여기서는 pendingList()/complete()/update()만 호출한다(새 저장소 없음).
  // ==========================================================================
  var pState = { expanded: false, editingId: null, memoOpenId: null };
  var PENDING_CAP = 5;
  // §업무 입력 연동 라운드: [처리완료] 직후 그 자리에 "처리완료 · 실행취소" 한 줄만 남기고
  // 실제 목록에서는 즉시 빼는 낙관적 UI. undoState는 딱 1건만 기억한다(연속 처리완료 시
  // 이전 건은 그냥 확정). 새 레코드를 만들지 않고 기존 uncomplete()를 호출할 뿐이다.
  var undoState = null; // { id, name, label, timer }
  var UNDO_MS = 5000;

  function pendingSummary(r){
    var src = (r.activityText && r.activityText.trim()) ? r.activityText.trim() : (r.originalText || '').trim();
    return window.SHIN2_ACTIVITIES.summarizeRequest(src, 40);
  }

  function clearUndoTimer(){
    if(undoState && undoState.timer){ clearTimeout(undoState.timer); }
  }

  function renderPending(){
    if(!pendingWrap || !window.SHIN2_ACTIVITIES) return;
    var ACT = window.SHIN2_ACTIVITIES;
    var companies = ACT.loadCompanies();
    function findCo(id){ return companies.find(function(c){ return c && c.id === id; }); }
    var all = ACT.pendingList();
    if(!all.length && !undoState){
      pendingWrap.innerHTML = '';
      return;
    }
    var visible = pState.expanded ? all : all.slice(0, PENDING_CAP);
    var html = '<div class="qr-pending-head"><span class="qr-pending-title">최근 접수 / 처리할 업무' + (all.length ? ' ' + all.length + '건' : '') + '</span></div>';
    if(undoState){
      html += '<div class="qr-undo-row" data-id="' + escapeHtml(undoState.id) + '">' +
        '<span>' + escapeHtml(undoState.name) + ' · ' + escapeHtml(undoState.label) + ' — 처리완료</span>' +
        '<button type="button" data-pending-undo="' + escapeHtml(undoState.id) + '">실행취소</button>' +
      '</div>';
    }
    html += visible.map(function(r){
      var co = findCo(r.companyId);
      var name = co ? co.name : '(삭제된 업체)';
      var contact = co && co.contactName ? (co.contactName + (co.position ? ' ' + co.position : '')) : '';
      if(pState.editingId === r.id){
        return '<div class="qr-pending-row" data-id="' + escapeHtml(r.id) + '" style="flex-direction:column;align-items:stretch;">' +
          '<div class="qr-pending-main"><span class="qr-pending-co">' + escapeHtml(name) + '</span>' +
            (contact ? '<span class="qr-pending-contact">' + escapeHtml(contact) + '</span>' : '') + '</div>' +
          '<div class="qr-pending-edit"><textarea id="qrPendingEditText" class="qr-unmatched-field" style="width:100%;min-height:52px;box-sizing:border-box;padding:7px 9px;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;">' + escapeHtml(r.activityText || '') + '</textarea></div>' +
          '<div class="qr-action-row" style="margin-top:6px;"><button type="button" class="ai-run-btn" data-pending-save-edit="' + escapeHtml(r.id) + '">저장</button>' +
          '<button type="button" class="co-text-action" data-pending-cancel-edit="1">취소</button></div>' +
        '</div>';
      }
      var memoOpen = pState.memoOpenId === r.id;
      var memoBtnLabel = r.taskMemo ? '메모 있음' : '메모';
      var row = '<div class="qr-pending-row" data-id="' + escapeHtml(r.id) + '" style="flex-direction:column;align-items:stretch;">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="qr-pending-main">' +
          '<span class="qr-pending-co">' + escapeHtml(name) + '</span>' +
          (contact ? '<span class="qr-pending-contact">' + escapeHtml(contact) + '</span>' : '') +
          '<div class="qr-pending-summary">' + escapeHtml(pendingSummary(r)) + '</div>' +
        '</div>' +
        '<span class="qr-pending-meta">' + escapeHtml(fmtShort(r.createdAt)) + '</span>' +
        '<div class="qr-pending-actions">' +
          '<button type="button" class="co-text-action" data-pending-edit="' + escapeHtml(r.id) + '">수정</button>' +
          '<button type="button" class="co-text-action" data-pending-memo-toggle="' + escapeHtml(r.id) + '">' + memoBtnLabel + '</button>' +
          '<button type="button" class="ai-run-btn" data-pending-confirm="' + escapeHtml(r.id) + '">처리완료</button>' +
        '</div>' +
        '</div>';
      if(memoOpen){
        row += '<div class="qr-task-memo">' +
          '<textarea id="qrTaskMemoText" placeholder="업무 처리 중 기억할 내용을 적어주세요.">' + escapeHtml(r.taskMemo || '') + '</textarea>' +
          '<div class="qr-task-memo-actions">' +
            '<button type="button" class="ai-run-btn" data-memo-save="' + escapeHtml(r.id) + '">저장</button>' +
            '<button type="button" class="co-text-action" data-memo-cancel="1">취소</button>' +
          '</div>' +
        '</div>';
      } else if(r.taskMemo){
        row += '<div class="qr-task-memo-preview">' + escapeHtml(r.taskMemo) + '</div>';
      }
      row += '</div>';
      return row;
    }).join('');
    if(!pState.expanded && all.length > PENDING_CAP){
      html += '<button type="button" class="qr-pending-more-btn" data-pending-more="1">더 보기 (' + (all.length - PENDING_CAP) + '건 더)</button>';
    } else if(pState.expanded && all.length > PENDING_CAP){
      html += '<button type="button" class="qr-pending-more-btn" data-pending-more="1">접기</button>';
    }
    pendingWrap.innerHTML = html;
    wirePending();
  }

  function wirePending(){
    pendingWrap.querySelectorAll('[data-pending-confirm]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pending-confirm');
        var ACT = window.SHIN2_ACTIVITIES;
        var rec = ACT.pendingList().find(function(x){ return x.id === id; });
        if(!rec) return;
        var co = ACT.loadCompanies().find(function(c){ return c && c.id === rec.companyId; });
        clearUndoTimer();
        ACT.complete(id);
        undoState = { id: id, name: co ? co.name : '(삭제된 업체)', label: pendingSummary(rec), timer: null };
        undoState.timer = setTimeout(function(){ undoState = null; renderPending(); }, UNDO_MS);
        renderPending();
        // 홈 "고객 업무" 섹션도 같은 customerActivities 레코드를 보여주므로 즉시 갱신한다.
        if(window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
      });
    });
    pendingWrap.querySelectorAll('[data-pending-undo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pending-undo');
        clearUndoTimer();
        window.SHIN2_ACTIVITIES.uncomplete(id);
        undoState = null;
        renderPending();
        if(window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
      });
    });
    pendingWrap.querySelectorAll('[data-pending-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        pState.editingId = btn.getAttribute('data-pending-edit');
        pState.memoOpenId = null;
        renderPending();
      });
    });
    pendingWrap.querySelectorAll('[data-pending-cancel-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        pState.editingId = null;
        renderPending();
      });
    });
    pendingWrap.querySelectorAll('[data-pending-save-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pending-save-edit');
        var ta = document.getElementById('qrPendingEditText');
        // originalText는 이 저장 경로에서 절대 건드리지 않는다(update가 activityText만 갱신).
        window.SHIN2_ACTIVITIES.update(id, { activityText: ta ? ta.value.trim() : '' });
        pState.editingId = null;
        renderPending();
      });
    });
    pendingWrap.querySelectorAll('[data-pending-memo-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pending-memo-toggle');
        pState.editingId = null;
        pState.memoOpenId = (pState.memoOpenId === id) ? null : id;
        renderPending();
      });
    });
    pendingWrap.querySelectorAll('[data-memo-save]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-memo-save');
        var ta = document.getElementById('qrTaskMemoText');
        window.SHIN2_ACTIVITIES.setTaskMemo(id, ta ? ta.value : '');
        pState.memoOpenId = null;
        renderPending();
        if(window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
      });
    });
    pendingWrap.querySelectorAll('[data-memo-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        pState.memoOpenId = null;
        renderPending();
      });
    });
    var moreBtn = pendingWrap.querySelector('[data-pending-more]');
    if(moreBtn){
      moreBtn.addEventListener('click', function(){
        pState.expanded = !pState.expanded;
        renderPending();
      });
    }
  }

  renderPending();

  // 다른 탭(같은 origin의 CRM 등)에서 customerActivities/companies가 바뀌면 이 목록도
  // 즉시 반영한다(§ localRev 가드가 걸린 클라우드 동기화 경로와 동일하게, 여기서는 읽기만
  // 다시 한다 — 별도 쓰기 경로를 추가하지 않는다).
  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail && (e.detail.key === 'customerActivities' || e.detail.key === 'companies')) renderPending();
  });
  window.addEventListener('storage', function(e){
    if(e.key === 'shin2-customer-activities-v1' || e.key === 'shin2-companies-staging') renderPending();
  });
})();
</script>

<script>
/* ==========================================================================
   홈 "고객 업무" 섹션(§신규 라운드 — 역할 분리) — "내 할 일"(shin2-todos, 개인
   체크리스트)과 명확히 구분되는 "업체별로 처리할 업무"를 홈에서 한 곳에 모아 보여준다.

   새 저장소를 만들지 않는다. 이미 있는 두 소스를 그대로 읽기만 한다:
     1) customerActivities(=SHIN2_ACTIVITIES, shin2-customer-activities-v1) 중
        companyId가 있고 status가 'pending'인 것 — SHIN2_ACTIVITIES.pendingList()가
        이미 정확히 이 조건으로 반환한다(위 인라인 미처리 목록과 동일 소스).
     2) shin2-tasks-v1(SHIN2_TASKS) 중 companyId가 있고 done이 아닌 것.
   이 두 소스는 CRM(crm/index.html)의 "다음 액션"이 읽는 D.pendingActivitiesForCompany/
   D.tasksForCompany와 정확히 같은 필터 조건이다 — v2와 crm은 서로 다른 HTML 문서라
   함수를 직접 공유할 수는 없지만, 같은 localStorage 키를 같은 조건으로 읽으므로 실제
   데이터는 완전히 하나다. 여기서 [완료]를 누르면 그 원본 레코드의 status/done 필드만
   바뀌고(레코드 삭제 없음), CRM 쪽도 같은 레코드를 다시 읽으므로 그대로 반영된다.
   ========================================================================== */
(function(){
  'use strict';
  var slotEl = null;
  var CAP = 5;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function summarize(text, max){
    var t = String(text || '').trim();
    if(t.length > max) t = t.slice(0, max) + '…';
    return t;
  }

  // 두 소스를 합쳐 {kind, id, companyId, title, sub, ts} 모양으로 통일한다 — 렌더링만
  // 공통화할 뿐, 원본 레코드(customerActivities/shin2-tasks-v1)는 전혀 바꾸지 않는다.
  function loadItems(){
    var items = [];
    if(window.SHIN2_ACTIVITIES){
      window.SHIN2_ACTIVITIES.pendingList().forEach(function(a){
        items.push({
          kind: 'act', id: a.id, companyId: a.companyId,
          title: summarize(a.activityText || a.originalText, 40),
          sub: '', ts: new Date(a.createdAt).getTime() || 0
        });
      });
    }
    if(window.SHIN2_TASKS){
      window.SHIN2_TASKS.getAll().filter(function(t){ return t.companyId && !t.done; }).forEach(function(t){
        items.push({
          kind: 'task', id: t.id, companyId: t.companyId,
          title: summarize(t.title, 40), sub: t.content ? summarize(t.content, 60) : '',
          ts: t.updatedAt || t.createdAt || 0
        });
      });
    }
    items.sort(function(a,b){ return b.ts - a.ts; });
    return items;
  }

  function companyName(companyId){
    if(!window.SHIN2_ACTIVITIES) return '';
    var co = window.SHIN2_ACTIVITIES.loadCompanies().find(function(c){ return c && c.id === companyId; });
    return co ? co.name : '(삭제된 업체)';
  }

  function render(){
    if(!slotEl) return;
    var all = loadItems();
    if(!all.length){ slotEl.innerHTML = ''; return; }
    var items = all.slice(0, CAP);
    var html = '<div class="home-task-block">' +
      '<div class="home-task-head"><div class="home-task-title">고객 업무 ' + all.length + '건</div></div>' +
      '<div class="home-task-list">' + items.map(function(it){
        return '<div class="home-task-row">' +
          '<div class="home-task-row-main">' +
            '<div class="home-task-row-top">' +
              '<span class="home-task-row-title">' + escapeHtml(companyName(it.companyId)) + ' · ' + escapeHtml(it.title) + '</span>' +
            '</div>' +
            (it.sub ? '<div class="home-task-row-sub">' + escapeHtml(it.sub) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="co-text-action" data-cust-task-done="' + it.kind + ':' + escapeHtml(it.id) + '">완료</button>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>';
    slotEl.innerHTML = html;
    slotEl.querySelectorAll('[data-cust-task-done]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var raw = btn.getAttribute('data-cust-task-done');
        var sep = raw.indexOf(':');
        var kind = raw.slice(0, sep), id = raw.slice(sep + 1);
        // §하드룰: 레코드를 지우지 않고 상태만 바꾼다 — customerActivities는 complete()가
        // status:'completed'로, shin2-tasks-v1은 setDone(id,true)가 done:true로 바꿀 뿐이다.
        // 둘 다 CRM 고객카드 "다음 액션"이 읽는 바로 그 필드라 반대편도 같은 레코드로 반영된다.
        if(kind === 'act' && window.SHIN2_ACTIVITIES) window.SHIN2_ACTIVITIES.complete(id);
        else if(kind === 'task' && window.SHIN2_TASKS) window.SHIN2_TASKS.setDone(id, true);
        render();
      });
    });
  }

  slotEl = document.getElementById('homeCustomerTaskSlot');
  render();

  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail && (e.detail.key === 'customerActivities' || e.detail.key === 'tasks' || e.detail.key === 'companies')) render();
  });
  window.addEventListener('storage', function(e){
    if(e.key === 'shin2-customer-activities-v1' || e.key === 'shin2-tasks-v1' || e.key === 'shin2-companies-staging') render();
  });

  window.SHIN2_CUSTOMER_TASKS_HOME = { render: render };
})();
</script>

<script>
/* ==========================================================================
   시공사 전화기록 전체보기 팝업(§신규) — 우측 "아파트 문의·전화기록"의 전체보기
   팝업(callPopupOverlay)과 같은 구조(acct-popup-overlay/acct-popup/task-pop-row 등)를
   그대로 재사용한다. 데이터는 새 저장소를 만들지 않고 SHIN2_ACTIVITIES(=
   shin2-customer-activities-v1)와 shin2-companies-staging을 그대로 읽기만 한다 —
   여기서는 어떤 localStorage.setItem/getItem도 새로 호출하지 않는다.
   ========================================================================== */
(function(){
  'use strict';
  var overlay = document.getElementById('actPopupOverlay');
  var body = document.getElementById('actPopupBody');
  var closeBtn = document.getElementById('actPopupCloseBtn');
  var viewAllBtn = document.getElementById('qrViewAllBtn');
  if(!overlay || !body || !viewAllBtn) return;

  // filter: 'all' | 'matched' | 'unmatched'. editingId/linkingId/linkQuery는 미등록 기록의
  // 인라인 수정/업체연결 UI 상태 — 둘 다 한 번에 하나의 레코드에만 열린다.
  var aState = { search:'', filter:'all', editingId:null, linkingId:null, linkQuery:'' };

  function pad2(n){ return String(n).padStart(2,'0'); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function localDateStr(ts){ var d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function fmtShort(ts){
    var d = new Date(ts);
    return pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function openActPopup(){
    aState.search = '';
    aState.filter = 'all';
    aState.editingId = null;
    aState.linkingId = null;
    aState.linkQuery = '';
    overlay.classList.add('open');
    renderActBrowse();
  }
  function closeActPopup(){ overlay.classList.remove('open'); }
  closeBtn.addEventListener('click', closeActPopup);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeActPopup(); });
  viewAllBtn.addEventListener('click', openActPopup);

  var FILTER_TABS = [ ['all','전체'], ['matched','등록업체'], ['unmatched','미등록업체'] ];

  function renderActBrowse(){
    if(!window.SHIN2_ACTIVITIES) return;
    var ACT = window.SHIN2_ACTIVITIES;
    // 업체명은 절대 별도로 저장하지 않고 매번 companyId → shin2-companies-staging에서
    // 실시간으로 조회한다(§ 라이브 조회, 중복저장 금지). 미등록 기록의 companyName만 예외적으로
    // 레코드 자체에 저장된 문자열을 그대로 쓴다(연결된 업체가 아직 없으므로 조회할 대상이 없음).
    var companies = ACT.loadCompanies();
    function findCo(id){ return companies.find(function(c){ return c && c.id === id; }); }

    var all = ACT.loadAll().slice().sort(function(a,b){
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    var ql = (aState.search||'').trim().toLowerCase();
    var items = all.filter(function(r){
      var status = ACT.statusOf(r);
      if(aState.filter !== 'all' && status !== aState.filter) return false;
      if(!ql) return true;
      var co = findCo(r.companyId);
      var hay = [
        co ? co.name : '', co ? co.contactName : '', r.originalText, r.activityText, r.category,
        r.companyName || '', r.note || ''
      ].join(' ').toLowerCase();
      return hay.indexOf(ql) !== -1;
    });

    var html = '<div class="search-box acct-search-box"><input type="text" id="actSearchInput" placeholder="업체명 / 담당자 / 전화내용 / 특이사항 검색" value="' + escapeAttr(aState.search) + '" /></div>';
    html += '<div class="task-tabs act-filter-row">' + FILTER_TABS.map(function(f){
      return '<button type="button" class="task-tab act-filter-btn' + (aState.filter === f[0] ? ' active' : '') + '" data-act-filter="' + f[0] + '">' + f[1] + '</button>';
    }).join('') + '</div>';

    if(!items.length){
      html += '<div class="acct-empty">해당하는 전화 기록이 없습니다.</div>';
    } else {
      var lastDateKey = null;
      html += items.map(function(r){
        var status = ACT.statusOf(r);
        var dateKey = localDateStr(r.createdAt);
        var groupHeaderHtml = '';
        if(dateKey !== lastDateKey){
          lastDateKey = dateKey;
          groupHeaderHtml = '<div class="task-pop-date-head">' + escapeHtml(dateKey === todayStr() ? '오늘' : dateKey) + '</div>';
        }
        return groupHeaderHtml + (status === 'unmatched' ? renderUnmatchedRow(r) : renderMatchedRow(r, findCo(r.companyId)));
      }).join('');
    }
    body.innerHTML = html;
    wireActBrowse(all);
  }

  function renderMatchedRow(r, co){
    var name = co ? co.name : (r.companyId ? '(삭제된 업체)' : '(업체 미연결)');
    var content = r.originalText || r.activityText || '';
    return '<div class="task-pop-row" data-id="' + escapeAttr(r.id) + '" data-status="matched">' +
      '<span class="task-pop-row-title">' + escapeHtml(name) + (content ? ' · ' + escapeHtml(content) : '') + '</span>' +
      '<span class="task-pop-row-meta">' + escapeHtml(fmtShort(r.createdAt)) + '</span>' +
    '</div>';
  }

  function renderUnmatchedRow(r){
    var id = r.id;
    if(aState.linkingId === id){
      var companiesAll = window.SHIN2_ACTIVITIES.loadCompanies();
      var lq = (aState.linkQuery || '').trim().toLowerCase();
      var candidates = companiesAll.filter(function(c){
        return c && c.name && (!lq || c.name.toLowerCase().indexOf(lq) !== -1);
      }).slice(0, 30);
      return '<div class="task-pop-row act-unmatched-row" data-id="' + escapeAttr(id) + '">' +
        '<input type="text" class="act-link-search" id="actLinkSearch" placeholder="연결할 업체명 검색" value="' + escapeAttr(aState.linkQuery) + '" />' +
        '<div class="act-link-list">' + (candidates.length
          ? candidates.map(function(c){ return '<button type="button" class="qr-candidate-btn" data-act-link-pick="' + escapeAttr(c.id) + '">' + escapeHtml(c.name) + '</button>'; }).join('')
          : '<div class="acct-empty">일치하는 업체가 없습니다.</div>') + '</div>' +
        '<div class="qr-action-row"><button type="button" class="co-text-action" data-act-link-cancel="1">취소</button></div>' +
      '</div>';
    }
    if(aState.editingId === id){
      return '<div class="task-pop-row act-unmatched-row" data-id="' + escapeAttr(id) + '">' +
        '<div class="act-edit-fields">' +
          '<input type="text" id="actEditName" value="' + escapeAttr(r.companyName || '') + '" placeholder="업체명" />' +
          '<input type="text" id="actEditNote" value="' + escapeAttr(r.note || '') + '" placeholder="특이사항" />' +
        '</div>' +
        '<div class="qr-action-row"><button type="button" class="ai-run-btn" data-act-save-edit="1">저장</button>' +
        '<button type="button" class="co-text-action" data-act-cancel-edit="1">취소</button></div>' +
      '</div>';
    }
    var nameLabel = r.companyName || '(업체명 없음)';
    var noteLabel = r.note || '';
    return '<div class="task-pop-row act-unmatched-row" data-id="' + escapeAttr(id) + '" data-status="unmatched">' +
      '<div class="act-unmatched-main">' +
        '<span class="act-unmatched-tag">[미등록]</span>' +
        '<span class="task-pop-row-title">' + escapeHtml(nameLabel) + (noteLabel ? ' · ' + escapeHtml(noteLabel) : '') + '</span>' +
        '<span class="task-pop-row-meta">' + escapeHtml(fmtShort(r.createdAt)) + '</span>' +
      '</div>' +
      '<div class="act-unmatched-actions">' +
        '<button type="button" class="co-text-action" data-act-edit="1">수정</button>' +
        '<button type="button" class="co-text-action" data-act-link="1">업체 연결</button>' +
        '<button type="button" class="co-text-action" data-act-register="1">업체 등록</button>' +
      '</div>' +
    '</div>';
  }

  function wireActBrowse(all){
    var searchInput = document.getElementById('actSearchInput');
    searchInput.addEventListener('input', function(){ aState.search = searchInput.value; renderActBrowse(); });
    body.querySelectorAll('[data-act-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        aState.filter = btn.getAttribute('data-act-filter');
        renderActBrowse();
      });
    });

    body.querySelectorAll('.task-pop-row[data-status="matched"]').forEach(function(rowEl){
      rowEl.addEventListener('click', function(){
        var rec = all.find(function(r){ return r.id === rowEl.getAttribute('data-id'); });
        if(!rec || !rec.companyId) return;
        // 업체 상세(CRM 카드) 오픈은 기존 "전화 온 내용" 상세의 업체 보기 버튼과 동일한
        // 방식(SHIN2_NAV.showView + SHIN2_COMPANIES.openDetail)을 그대로 재사용한다 —
        // 새 업체 ID를 만들지 않는다.
        closeActPopup();
        if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
        if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(rec.companyId);
      });
    });

    // ---- 미등록 기록: 인라인 수정 ----
    body.querySelectorAll('[data-act-edit]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        aState.editingId = btn.closest('.task-pop-row').getAttribute('data-id');
        aState.linkingId = null;
        renderActBrowse();
      });
    });
    body.querySelectorAll('[data-act-save-edit]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var rowEl = btn.closest('.task-pop-row');
        var id = rowEl.getAttribute('data-id');
        var nameVal = document.getElementById('actEditName').value.trim();
        var noteVal = document.getElementById('actEditNote').value.trim();
        // originalText는 이 저장 경로에서 절대 건드리지 않는다(updateUnmatched가 companyName/note만 갱신).
        window.SHIN2_ACTIVITIES.updateUnmatched(id, { companyName: nameVal, note: noteVal });
        aState.editingId = null;
        renderActBrowse();
      });
    });
    body.querySelectorAll('[data-act-cancel-edit]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        aState.editingId = null;
        renderActBrowse();
      });
    });

    // ---- 미등록 기록: [업체 연결] ----
    body.querySelectorAll('[data-act-link]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        aState.linkingId = btn.closest('.task-pop-row').getAttribute('data-id');
        aState.editingId = null;
        aState.linkQuery = '';
        renderActBrowse();
      });
    });
    var linkSearchInput = document.getElementById('actLinkSearch');
    if(linkSearchInput){
      linkSearchInput.addEventListener('input', function(){ aState.linkQuery = linkSearchInput.value; renderActBrowse(); });
    }
    body.querySelectorAll('[data-act-link-pick]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var rowEl = btn.closest('.task-pop-row');
        var id = rowEl.getAttribute('data-id');
        var companyId = btn.getAttribute('data-act-link-pick');
        // 같은 레코드를 그 자리에서 갱신할 뿐, 새 레코드를 만들거나 지우지 않는다(자동 병합 금지).
        window.SHIN2_ACTIVITIES.linkToCompany(id, companyId);
        aState.linkingId = null;
        aState.linkQuery = '';
        renderActBrowse();
      });
    });
    body.querySelectorAll('[data-act-link-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        aState.linkingId = null;
        aState.linkQuery = '';
        renderActBrowse();
      });
    });

    // ---- 미등록 기록: [업체 등록] — 기존 업체관리 "신규 등록" 폼을 업체명만 미리 채워서 연다.
    // 폼 제출 전까지는 업체가 생성되지 않고, 제출돼도 이 레코드에 자동으로 다시 연결하지
    // 않는다(연결하려면 사용자가 [업체 연결]을 별도로 눌러야 함 — 자동 병합 금지).
    body.querySelectorAll('[data-act-register]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var rowEl = btn.closest('.task-pop-row');
        var id = rowEl.getAttribute('data-id');
        var rec = all.find(function(r){ return r.id === id; });
        var guessName = rec ? (rec.companyName || '') : '';
        closeActPopup();
        if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
        if(window.SHIN2_COMPANIES && window.SHIN2_COMPANIES.openAddPrefilled){
          window.SHIN2_COMPANIES.openAddPrefilled({ name: guessName }, function(){});
        }
      });
    });
  }
})();
</script>

<script>
/* ==========================================================================
   SHIN2_CALENDAR — 일정관리 (신규 기능)
   화면 우하단 고정 아이콘 → 클릭 시 아이콘 위로 열리는 팝오버(전체화면 모달 아님).
   저장: localStorage 'shin2-calendar-events-v1' =
     [{id, title, date, time, companyId, memo, isImportant, status, createdAt, updatedAt}]
   기존 SHIN2_TASKS(shin2-tasks-v1)와 완전히 분리된 새 저장소 — 기존 키를 절대
   건드리지 않는다(grep으로 사전 확인: 신규 키, 충돌 없음).

   isImportant는 오직 사용자가 폼의 "중요 일정" 체크박스를 직접 체크했을 때만 true가
   된다(아래 handleSave의 calFImportant.checked 한 줄이 유일한 대입 경로). 키워드 매칭이나
   AI 기반의 자동 중요도 판정은 이 파일 어디에도 없다.

   status는 'active'/'completed' 두 값만 쓰며, 완료는 레코드를 지우지 않고 status만
   바꾼다(§ SHIN2_TASKS의 done 필드, 전화 온 내용의 status 필드와 동일한 "상태 vs 존재
   분리" 원칙). 삭제는 별도의 명시적 삭제 액션에서만 일어난다.
   ========================================================================== */
(function(){
  'use strict';
  // §다중 사용자 라운드: '내 일정'은 개인 데이터(팀장 일정은 별도의 공용
  // team-schedule-app:events:v1 키를 그대로 쓰므로 영향 없음).
  var STORAGE_KEY = window.SHIN2_USER ? window.SHIN2_USER.nsKey('shin2-calendar-events-v1') : 'shin2-calendar-events-v1';
  var COMPANY_STORAGE_KEY = 'shin2-companies-staging';
  // 팀장 일정(team-schedule 앱, https://hansol941201.github.io/shin/team-schedule/)이
  // 실제로 쓰는 localStorage 키를 그대로 읽기 전용으로 읽는다(team-schedule/assets의
  // 번들 JS를 직접 확인: yd = "team-schedule-app:events:v1", 이벤트 형태는
  // {id,title,start,end,location,memo,requester,manager,status,googleCalendarEventId,
  // createdAt,updatedAt,source} — ISO start/end만 있고 date/time 필드가 따로 없음).
  // v2와 team-schedule은 둘 다 https://hansol941201.github.io/shin/... 아래에서
  // 서빙되므로 origin이 같아 localStorage를 그대로 공유한다(§9b58b31과 동일한 근거).
  // 이 키는 절대 쓰지 않는다(setItem/removeItem 호출 없음) — team-schedule의 유일한
  // 쓰기 경로(그 앱 자신의 리듀서)를 그대로 존중한다. 복제본도 새로 만들지 않는다 —
  // 렌더링마다 이 함수로 원본을 그대로 다시 읽는다.
  var TEAM_STORAGE_KEY = 'team-schedule-app:events:v1';
  var TEAM_SCHEDULE_URL = 'https://hansol941201.github.io/shin/team-schedule/';

  function loadTeamEvents(){
    try{
      var raw = localStorage.getItem(TEAM_STORAGE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(list)) return [];
      // cancelled/rejected는 더 이상 유효하지 않은 일정이라 표시하지 않는다(원본 데이터를
      // 바꾸는 게 아니라 이 렌더링 레이어에서만 걸러낸다).
      return list.filter(function(ev){
        return ev && ev.status !== 'cancelled' && ev.status !== 'rejected';
      }).map(function(ev){
        var sd = ev.start ? new Date(ev.start) : null;
        var ed = ev.end ? new Date(ev.end) : null;
        return {
          id: ev.id,
          title: ev.title || '',
          date: (sd && !isNaN(sd.getTime())) ? (sd.getFullYear() + '-' + pad2(sd.getMonth()+1) + '-' + pad2(sd.getDate())) : '',
          startTime: (sd && !isNaN(sd.getTime())) ? (pad2(sd.getHours()) + ':' + pad2(sd.getMinutes())) : '',
          endTime: (ed && !isNaN(ed.getTime())) ? (pad2(ed.getHours()) + ':' + pad2(ed.getMinutes())) : '',
          memo: ev.memo || '',
          source: 'teamLead'
        };
      });
    }catch(e){ return []; }
  }

  // 팀장 일정(team-schedule)의 "승인대기" 건수 — team-schedule 번들 JS를 직접 확인한 결과
  // status는 pending/confirmed/reschedule_requested/rejected/cancelled 다섯 값만 쓰고,
  // team-schedule 자신의 UI도 pending을 "승인대기"라고 표시한다(na/$m 라벨 매핑, 요약
  // 카드 "내 등록/승인대기" 문구 모두 동일). requester/manager는 항상 고정값("한솔"/"팀장")
  // 이라 v2에서 "내 요청"과 "팀장 큐"를 구분할 수 있는 사용자 축이 데이터에 없다 — 그래서
  // "승인요청"/"승인대기" 두 개의 숫자를 따로 만들지 않고, 실제로 존재하는 단일 상태
  // (status==='pending')만 세서 팀장 일정 자체가 쓰는 것과 동일한 라벨("승인대기")로
  // 보여준다. reschedule_requested(시간변경 제안)는 라벨이 다르고 별도 성격이라 이 집계에
  // 포함하지 않는다(원본 상태값을 재해석/왜곡하지 않기 위함).
  function loadTeamApprovalCount(){
    try{
      var raw = localStorage.getItem(TEAM_STORAGE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(list)) return 0;
      var n = 0;
      for(var i=0;i<list.length;i++){ if(list[i] && list[i].status === 'pending') n++; }
      return n;
    }catch(e){ return 0; }
  }

  var fabBtn = document.getElementById('calFabBtn');
  var fabBadge = document.getElementById('calFabBadge');
  var approvalPill = document.getElementById('calApprovalPill');
  var popover = document.getElementById('calPopover');
  var popBody = document.getElementById('calPopBody');
  var popCloseBtn = document.getElementById('calPopCloseBtn');
  var teamLinkBtn = document.getElementById('calTeamLinkBtn');
  if(!fabBtn || !popover || !popBody) return;

  if(teamLinkBtn){
    // 현재 v2 탭은 그대로 두고 새 탭에서만 team-schedule을 연다(window.open + '_blank').
    teamLinkBtn.addEventListener('click', function(e){
      e.stopPropagation();
      window.open(TEAM_SCHEDULE_URL, '_blank');
    });
  }

  // mode: 'grid'(월간 그리드, 기본) | 'list'(오늘/주간 목록) | 'form'(추가/수정)
  // gridRef: 그리드에 현재 표시 중인 달(month)의 기준일. selectedDate: 그리드에서 클릭해
  // 선택한 날짜(YYYY-MM-DD) — 그 날짜의 일정 목록을 그리드 아래에 그대로 이어서 보여준다.
  // srcFilter: 'mine'/'team' — 내 일정/팀장 일정 필터(그리드 점 + 날짜별 상세
  // 양쪽에 동일하게 적용, 기본값은 '내 일정'). 기존 filter('all'/'important')는 목록
  // 화면(오늘/주간)의 중요도 필터로 그대로 남겨두고, srcFilter는 별도의 새 상태다.
  var state = { viewMode:'month', filter:'all', srcFilter:'mine', mode:'grid', editingId:null, formDeleteConfirmId:null,
    gridRef: new Date(), selectedDate: null, formReturn: 'grid' };

  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function uid(){ return 'cal_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function loadAll(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); var list = raw ? JSON.parse(raw) : []; return Array.isArray(list) ? list : []; }
    catch(e){ return []; }
  }
  function saveAll(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
    if(window.__shin2CloudSync) window.__shin2CloudSync.push('calendar', list);
    renderBadge();
  }
  function getCompanies(){
    try{ var raw = localStorage.getItem(COMPANY_STORAGE_KEY); var list = raw ? JSON.parse(raw) : []; return Array.isArray(list) ? list : []; }
    catch(e){ return []; }
  }
  function findCompany(id){ return id ? getCompanies().find(function(c){ return c.id === id; }) : null; }

  function add(fields){
    var now = Date.now();
    var rec = {
      id: uid(),
      title: (fields.title || '').trim(),
      date: fields.date || '',
      time: fields.time || '',
      companyId: fields.companyId || '',
      memo: (fields.memo || '').trim(),
      isImportant: !!fields.isImportant,
      status: 'active',
      createdAt: now,
      updatedAt: now
    };
    var all = loadAll();
    all.push(rec);
    saveAll(all);
    return rec;
  }
  function update(id, fields){
    var all = loadAll();
    var rec = all.find(function(x){ return x.id === id; });
    if(!rec) return null;
    if(fields.title !== undefined) rec.title = fields.title.trim();
    if(fields.date !== undefined) rec.date = fields.date;
    if(fields.time !== undefined) rec.time = fields.time;
    if(fields.companyId !== undefined) rec.companyId = fields.companyId;
    if(fields.memo !== undefined) rec.memo = fields.memo.trim();
    if(fields.isImportant !== undefined) rec.isImportant = !!fields.isImportant;
    rec.updatedAt = Date.now();
    saveAll(all);
    return rec;
  }
  function setStatus(id, status){
    var all = loadAll();
    var rec = all.find(function(x){ return x.id === id; });
    if(!rec) return null;
    rec.status = status === 'completed' ? 'completed' : 'active';
    rec.updatedAt = Date.now();
    saveAll(all);
    return rec;
  }
  function remove(id){ saveAll(loadAll().filter(function(x){ return x.id !== id; })); }

  // ---------- 날짜 범위 계산 ----------
  function parseYmd(s){
    if(!s) return null;
    var p = s.split('-');
    if(p.length !== 3) return null;
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return isNaN(d.getTime()) ? null : d;
  }
  function inWeek(dateStr, ref){
    var d = parseYmd(dateStr);
    if(!d) return false;
    var day = ref.getDay(); // 0=일
    var start = new Date(ref); start.setDate(ref.getDate() - day);
    var end = new Date(start); end.setDate(start.getDate() + 6);
    start.setHours(0,0,0,0); end.setHours(23,59,59,999);
    return d >= start && d <= end;
  }
  function inMonth(dateStr, ref){
    var d = parseYmd(dateStr);
    if(!d) return false;
    return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
  }

  function filteredList(){
    var all = loadAll();
    var ref = new Date();
    var t = todayStr();
    all = all.filter(function(ev){
      if(state.viewMode === 'today') return ev.date === t;
      if(state.viewMode === 'week') return inWeek(ev.date, ref);
      if(state.viewMode === 'month') return inMonth(ev.date, ref);
      return true;
    });
    if(state.filter === 'important') all = all.filter(function(ev){ return ev.isImportant; });
    all.sort(function(a,b){
      if(a.date !== b.date) return (a.date||'').localeCompare(b.date||'');
      return (a.time||'').localeCompare(b.time||'');
    });
    return all;
  }

  function todayImportantCount(){
    var t = todayStr();
    return loadAll().filter(function(ev){ return ev.date === t && ev.isImportant; }).length;
  }

  function renderBadge(){
    var n = todayImportantCount();
    if(n > 0){
      fabBadge.textContent = n > 99 ? '99+' : String(n);
      fabBadge.style.display = '';
    } else {
      fabBadge.style.display = 'none';
    }
  }

  // 승인대기 필 렌더링 — 매번 loadTeamApprovalCount()로 원본을 새로 읽는다(복제/캐시 없음).
  // 0건이면 "승인대기 0"처럼 눈에 띄게 보여주지 않고 아예 숨긴다.
  function renderApprovalPill(){
    if(!approvalPill) return;
    var n = loadTeamApprovalCount();
    if(n > 0){
      approvalPill.innerHTML = '승인대기<b>' + (n > 99 ? '99+' : n) + '</b>';
      approvalPill.style.display = '';
    } else {
      approvalPill.style.display = 'none';
    }
  }
  if(approvalPill){
    // §일정 바로가기 라운드: "일정" 항목과 동일하게 팀장 일정(team-schedule-app)으로 이동한다.
    approvalPill.addEventListener('click', function(e){
      e.stopPropagation();
      window.open('https://hansol941201.github.io/shin/team-schedule/', '_blank', 'noopener');
    });
  }

  // ---------- 팝오버 열기/닫기 ----------
  function openPopover(){
    popover.style.display = 'flex';
    fabBtn.classList.add('active');
    // 아이콘을 클릭할 때마다 항상 이번 달 월간 그리드로 먼저 연다(요구사항: 목록이 먼저
    // 뜨는 일은 없어야 한다). 이전에 선택돼 있던 날짜/이동해 놨던 달도 초기화한다.
    state.mode = 'grid';
    state.viewMode = 'month';
    state.gridRef = new Date();
    state.selectedDate = null;
    state.srcFilter = 'mine';
    render();
  }
  function closePopover(){
    popover.style.display = 'none';
    fabBtn.classList.remove('active');
  }
  function isOpen(){ return popover.style.display !== 'none'; }

  // §일정 바로가기 라운드: 팝오버를 열지 않고 팀장 일정(team-schedule-app)으로 바로 이동한다.
  // 팝오버 자체(openPopover/closePopover)와 데이터는 그대로 남겨둔다 — 이 버튼의 클릭 대상만
  // 바꿨다(향후 되돌릴 수 있게 로직 삭제 없음).
  fabBtn.addEventListener('click', function(){ window.open('https://hansol941201.github.io/shin/team-schedule/', '_blank', 'noopener'); });
  popCloseBtn.addEventListener('click', closePopover);
  document.addEventListener('click', function(e){
    if(!isOpen()) return;
    // 내부 버튼 클릭이 popBody.innerHTML을 즉시 다시 그리는 경우(예: [일정 추가]),
    // 이벤트가 document까지 버블링될 때는 e.target이 이미 DOM에서 제거된 옛 노드라
    // popover.contains(e.target)이 false가 되어 "바깥 클릭"으로 오판할 수 있다.
    // composedPath()는 dispatch 시점의 실제 조상 체인을 그대로 담고 있어 이 문제가 없다.
    var path = typeof e.composedPath === 'function' ? e.composedPath() : [e.target];
    if(path.indexOf(popover) !== -1 || path.indexOf(fabBtn) !== -1) return;
    closePopover();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && isOpen()) closePopover();
  });

  // ---------- 렌더링 ----------
  var VIEW_LABEL = { today:'오늘', week:'주간', month:'월간' };

  function render(){
    if(state.mode === 'form') return renderForm();
    if(state.mode === 'grid') return renderGrid();
    renderList();
  }

  // 상단 [오늘][주간][월간] 탭 — 월간이 기본/주(main) 탭이며 이 아이콘을 열 때마다 항상
  // 월간 그리드로 먼저 뜬다(openPopover). 오늘/주간은 기존 목록 화면 그대로 남겨둔다.
  function tabsRowHtml(){
    return '<div class="cal-tabs-row">' +
      ['today','week','month'].map(function(v){
        var active = (v === 'month') ? (state.mode === 'grid') : (state.mode === 'list' && state.viewMode === v);
        return '<button type="button" class="cal-tab-btn' + (active?' active':'') + '" data-view="' + v + '">' + VIEW_LABEL[v] + '</button>';
      }).join('') +
    '</div>';
  }
  function bindTabsRow(){
    popBody.querySelectorAll('[data-view]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var v = btn.dataset.view;
        if(v === 'month'){ state.mode = 'grid'; state.viewMode = 'month'; }
        else { state.mode = 'list'; state.viewMode = v; }
        render();
      });
    });
  }

  // 일정 한 줄(목록/날짜별 하위목록 공용) — 수정/완료/완료취소/삭제 액션 포함.
  function eventRowHtml(ev){
    var company = findCompany(ev.companyId);
    var titleHtml = ev.isImportant
      ? '<mark class="kb-hl cal-event-title' + (ev.status==='completed'?' done':'') + '">' + escapeHtml(ev.title) + '</mark>'
      : '<span class="cal-event-title' + (ev.status==='completed'?' done':'') + '">' + escapeHtml(ev.title) + '</span>';
    var metaParts = [];
    if(company) metaParts.push(escapeHtml(company.name));
    if(ev.memo) metaParts.push(escapeHtml(ev.memo));
    return '' +
      '<div class="cal-event-row" data-id="' + ev.id + '">' +
        '<div class="cal-event-top"><span class="cal-event-date">' + escapeHtml([ev.date, ev.time].filter(Boolean).join(' ')) + '</span>' + titleHtml + '</div>' +
        (metaParts.length ? '<div class="cal-event-meta">' + metaParts.join(' · ') + '</div>' : '') +
        '<div class="cal-event-actions" id="calActions_' + ev.id + '">' +
          '<button type="button" class="acct-text-action" data-act="edit" data-id="' + ev.id + '">수정</button>' +
          (ev.status === 'completed'
            ? '<button type="button" class="acct-text-action" data-act="undo" data-id="' + ev.id + '">완료 취소</button>'
            : '<button type="button" class="acct-text-action" data-act="complete" data-id="' + ev.id + '">완료</button>') +
          '<button type="button" class="acct-text-action danger" data-act="del" data-id="' + ev.id + '">삭제</button>' +
        '</div>' +
      '</div>';
  }
  // renderList/renderGrid가 공통으로 그려 넣는 [수정/완료/완료취소/삭제] 버튼들의 동작을
  // 한 곳에서 바인딩한다(중복 방지). 삭제는 인라인 확인 후에만 실행된다.
  function bindEventActions(afterChangeRender){
    popBody.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.id;
        var act = btn.dataset.act;
        if(act === 'edit') openForm(id);
        else if(act === 'complete'){ setStatus(id, 'completed'); afterChangeRender(); }
        else if(act === 'undo'){ setStatus(id, 'active'); afterChangeRender(); }
        else if(act === 'del'){
          var row = document.getElementById('calActions_' + id);
          if(!row) return;
          row.innerHTML = '<div class="co-confirm-row"><span>이 일정을 삭제하시겠습니까?</span>' +
            '<button type="button" class="acct-text-action" data-act="del-cancel" data-id="' + id + '">취소</button>' +
            '<button type="button" class="acct-text-action danger" data-act="del-confirm" data-id="' + id + '">삭제</button></div>';
          row.querySelector('[data-act="del-cancel"]').addEventListener('click', function(){ afterChangeRender(); });
          row.querySelector('[data-act="del-confirm"]').addEventListener('click', function(){ remove(id); afterChangeRender(); });
        }
      });
    });
  }

  function renderList(){
    var items = filteredList();
    var listHtml = !items.length
      ? '<div class="cal-empty-hint">' + VIEW_LABEL[state.viewMode] + ' 일정이 없습니다</div>'
      : '<div class="cal-list">' + items.map(eventRowHtml).join('') + '</div>';

    popBody.innerHTML = '' +
      tabsRowHtml() +
      '<div class="cal-tabs-row">' +
        ['all','important'].map(function(f){
          return '<button type="button" class="cal-tab-btn' + (state.filter===f?' active':'') + '" data-filter="' + f + '">' + (f==='all'?'전체':'중요') + '</button>';
        }).join('') +
      '</div>' +
      '<div class="cal-add-toggle-row"><button type="button" class="acct-add-btn" id="calAddBtn">+ 일정 추가</button></div>' +
      listHtml;

    bindTabsRow();
    popBody.querySelectorAll('[data-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.filter = btn.dataset.filter; render(); });
    });
    var addBtn = document.getElementById('calAddBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ openForm(null); });

    bindEventActions(render);
  }

  // ---------- 월간 그리드 뷰(팝오버 기본 화면) ----------
  function ymd(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
  // 월요일 시작 주 배치를 위한 요일 인덱스 변환(일=0..토=6 → 월=0..일=6).
  function mondayIndex(jsDay){ return (jsDay + 6) % 7; }

  // srcFilter를 반영해 "내 일정"/"팀장 일정" 각각을 그릴지 여부만 결정한다(둘 다 원본을
  // 그대로 읽으며, 어느 쪽도 새로 복제하지 않는다).
  function includeMine(){ return state.srcFilter !== 'team'; }
  function includeTeam(){ return state.srcFilter !== 'mine'; }

  function eventsByDateMap(){
    var map = {};
    if(includeMine()){
      loadAll().forEach(function(ev){
        if(!ev.date) return;
        if(!map[ev.date]) map[ev.date] = { hasImportant:false, hasNormal:false, hasTeam:false };
        if(ev.isImportant) map[ev.date].hasImportant = true;
        else map[ev.date].hasNormal = true;
      });
    }
    if(includeTeam()){
      loadTeamEvents().forEach(function(ev){
        if(!ev.date) return;
        if(!map[ev.date]) map[ev.date] = { hasImportant:false, hasNormal:false, hasTeam:false };
        map[ev.date].hasTeam = true;
      });
    }
    return map;
  }

  // 전체/내 일정/팀장 일정 필터 탭 — 활성 탭은 연한 네이비 배경만 쓰고(과도한 색상 금지),
  // 그리드 점과 날짜별 상세 양쪽에 동일하게 적용된다.
  var SRC_FILTER_LABEL = { mine:'내 일정', team:'팀장 일정' };
  function sourceTabsRowHtml(){
    return '<div class="cal-src-tabs-row">' +
      ['mine','team'].map(function(f){
        return '<button type="button" class="cal-src-tab-btn' + (state.srcFilter===f?' active':'') + '" data-src-filter="' + f + '">' + SRC_FILTER_LABEL[f] + '</button>';
      }).join('') +
    '</div>';
  }
  function bindSourceTabsRow(){
    popBody.querySelectorAll('[data-src-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.srcFilter = btn.dataset.srcFilter;
        render();
      });
    });
  }

  // 팀장 일정 한 줄 — 읽기전용: 수정/완료/삭제 버튼을 단 하나도 넣지 않는다.
  function teamEventRowHtml(ev){
    var timeLabel = [ev.startTime, ev.endTime].filter(Boolean).join('~');
    return '' +
      '<div class="cal-team-row" data-team-id="' + escapeAttr(ev.id) + '">' +
        '<div class="cal-team-row-top">' +
          (timeLabel ? '<span class="cal-team-row-time">' + escapeHtml(timeLabel) + '</span>' : '') +
          '<span class="cal-team-row-title">' + escapeHtml(ev.title) + '</span>' +
          '<span class="cal-team-readonly-tag">읽기전용</span>' +
        '</div>' +
        (ev.memo ? '<div class="cal-team-row-meta">' + escapeHtml(ev.memo) + '</div>' : '') +
      '</div>';
  }

  function renderGrid(){
    var ref = state.gridRef;
    var y = ref.getFullYear(), m = ref.getMonth();
    var firstOfMonth = new Date(y, m, 1);
    var startOffset = mondayIndex(firstOfMonth.getDay());
    var gridStart = new Date(y, m, 1 - startOffset);
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    var evMap = eventsByDateMap();
    var t = todayStr();

    var cellsHtml = '';
    for(var i = 0; i < totalCells; i++){
      var cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      var dateStr = ymd(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
      var inMonthCell = cellDate.getMonth() === m;
      var info = evMap[dateStr];
      var dotHtml = '';
      if(info && info.hasImportant) dotHtml += '<span class="kb-hl cal-grid-hl-mark"></span>';
      else if(info && info.hasNormal) dotHtml += '<span class="cal-grid-dot"></span>';
      if(info && info.hasTeam) dotHtml += '<span class="cal-grid-team-dot"></span>';
      var cls = 'cal-grid-cell' +
        (inMonthCell ? '' : ' out') +
        (dateStr === t ? ' today' : '') +
        (dateStr === state.selectedDate ? ' selected' : '');
      cellsHtml += '' +
        '<button type="button" class="' + cls + '" data-date="' + dateStr + '">' +
          '<span class="cal-grid-daynum">' + cellDate.getDate() + '</span>' +
          '<span class="cal-grid-dot-row">' + dotHtml + '</span>' +
        '</button>';
    }

    var weekdayHtml = ['월','화','수','목','금','토','일'].map(function(w){ return '<span>' + w + '</span>'; }).join('');

    var dateEventsHtml = '';
    if(state.selectedDate){
      var d = parseYmd(state.selectedDate);
      var headLabel = d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일 일정' : state.selectedDate + ' 일정';
      var mineHtml = '';
      if(includeMine()){
        var dayItems = loadAll().filter(function(ev){ return ev.date === state.selectedDate; })
          .sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
        mineHtml = '' +
          (dayItems.length
            ? '<div class="cal-list">' + dayItems.map(eventRowHtml).join('') + '</div>'
            : '<div class="cal-empty-hint">등록된 일정이 없습니다.</div>') +
          '<div class="cal-add-toggle-row" style="margin-top:8px;"><button type="button" class="acct-add-btn" id="calGridAddBtn">+ 일정 추가</button></div>';
      }
      var teamHtml = '';
      if(includeTeam()){
        var teamItems = loadTeamEvents().filter(function(ev){ return ev.date === state.selectedDate; })
          .sort(function(a,b){ return (a.startTime||'').localeCompare(b.startTime||''); });
        teamHtml = '' +
          '<div class="cal-team-section">' +
            '<div class="cal-team-section-head">팀장 일정</div>' +
            (teamItems.length
              ? teamItems.map(teamEventRowHtml).join('')
              : '<div class="cal-empty-hint">팀장 일정이 없습니다.</div>') +
          '</div>';
      }
      dateEventsHtml = '<div class="cal-date-events">' +
        '<div class="cal-date-events-head">' + escapeHtml(headLabel) + '</div>' +
        mineHtml + teamHtml +
      '</div>';
    }

    popBody.innerHTML = '' +
      sourceTabsRowHtml() +
      '<div class="cal-grid-head">' +
        '<div class="cal-grid-nav">' +
          '<button type="button" class="cal-grid-nav-btn" id="calGridPrev" aria-label="이전 달">&lsaquo;</button>' +
          '<span class="cal-grid-title">' + y + '년 ' + (m+1) + '월</span>' +
          '<button type="button" class="cal-grid-nav-btn" id="calGridNext" aria-label="다음 달">&rsaquo;</button>' +
        '</div>' +
        '<button type="button" class="cal-grid-today-btn" id="calGridToday">오늘</button>' +
      '</div>' +
      '<div class="cal-grid-weekdays">' + weekdayHtml + '</div>' +
      '<div class="cal-grid">' + cellsHtml + '</div>' +
      dateEventsHtml;

    bindSourceTabsRow();
    document.getElementById('calGridPrev').addEventListener('click', function(){
      state.gridRef = new Date(y, m - 1, 1);
      render();
    });
    document.getElementById('calGridNext').addEventListener('click', function(){
      state.gridRef = new Date(y, m + 1, 1);
      render();
    });
    document.getElementById('calGridToday').addEventListener('click', function(){
      state.gridRef = new Date();
      render();
    });
    popBody.querySelectorAll('[data-date]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var ds = btn.dataset.date;
        state.selectedDate = (state.selectedDate === ds) ? null : ds;
        render();
      });
    });
    var gridAddBtn = document.getElementById('calGridAddBtn');
    if(gridAddBtn) gridAddBtn.addEventListener('click', function(){ openForm(null, state.selectedDate); });

    bindEventActions(render);
  }

  // prefillDate: 그리드에서 날짜를 선택한 뒤 [+ 일정 추가]를 눌렀을 때 그 날짜를
  // 기존 생성 폼의 날짜 입력값으로 미리 채워 넣기 위한 값(신규 등록일 때만 사용).
  function openForm(id, prefillDate){
    // 폼을 닫을 때(취소/저장) 어느 화면으로 돌아갈지 기억해 둔다 — 그리드에서 들어왔으면
    // 그리드로, 오늘/주간 목록에서 들어왔으면 그 목록으로 돌아간다.
    state.formReturn = state.mode === 'grid' ? 'grid' : 'list';
    state.mode = 'form';
    state.editingId = id;
    if(id){
      var rec = loadAll().find(function(x){ return x.id === id; });
      state.formValues = rec ? Object.assign({}, rec) : { title:'', date:todayStr(), time:'', companyId:'', memo:'', isImportant:false };
    } else {
      state.formValues = { title:'', date: prefillDate || todayStr(), time:'', companyId:'', memo:'', isImportant:false };
    }
    render();
  }

  function renderForm(){
    var vals = state.formValues;
    var isNew = !state.editingId;
    var companies = getCompanies().slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    var companyOptionsHtml = '<option value="">(선택 안 함)</option>' + companies.map(function(c){
      return '<option value="' + escapeAttr(c.id) + '"' + (vals.companyId===c.id?' selected':'') + '>' + escapeHtml(c.name) + '</option>';
    }).join('');

    popBody.innerHTML = '' +
      '<div class="cal-pop-title" style="margin-bottom:10px;">' + (isNew ? '일정 추가' : '일정 수정') + '</div>' +
      '<div class="task-form-field"><label>제목 (필수)</label><input type="text" id="calFTitle" value="' + escapeAttr(vals.title) + '" placeholder="예: 신광건설 견적 회신" /></div>' +
      '<div id="calFTitleErr" class="acct-form-error" style="display:none;">제목을 입력하세요.</div>' +
      '<div class="task-form-row">' +
        '<div class="task-form-field"><label>날짜 (필수)</label><input type="date" id="calFDate" value="' + escapeAttr(vals.date) + '" /></div>' +
        '<div class="task-form-field"><label>시간</label><input type="time" id="calFTime" value="' + escapeAttr(vals.time) + '" /></div>' +
      '</div>' +
      '<div id="calFDateErr" class="acct-form-error" style="display:none;">날짜를 입력하세요.</div>' +
      '<div class="task-form-field"><label>관련업체</label><select id="calFCompany">' + companyOptionsHtml + '</select></div>' +
      '<div class="task-form-field"><label>메모</label><textarea id="calFMemo">' + escapeHtml(vals.memo) + '</textarea></div>' +
      '<div class="task-form-field"><label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);">' +
        '<input type="checkbox" id="calFImportant"' + (vals.isImportant ? ' checked' : '') + ' /> 중요 일정' +
      '</label></div>' +
      '<div class="acct-form-actions">' +
        '<button type="button" class="acct-text-action" id="calFormCancel">취소</button>' +
        '<button type="button" class="ai-run-btn" id="calFormSave">저장</button>' +
      '</div>';

    document.getElementById('calFormCancel').addEventListener('click', function(){ state.mode = state.formReturn; render(); });
    document.getElementById('calFormSave').addEventListener('click', function(){
      var titleEl = document.getElementById('calFTitle');
      var dateEl = document.getElementById('calFDate');
      var title = titleEl.value.trim();
      var date = dateEl.value;
      var ok = true;
      if(!title){ document.getElementById('calFTitleErr').style.display = 'block'; ok = false; } else { document.getElementById('calFTitleErr').style.display = 'none'; }
      if(!date){ document.getElementById('calFDateErr').style.display = 'block'; ok = false; } else { document.getElementById('calFDateErr').style.display = 'none'; }
      if(!ok) return;
      // isImportant는 오직 이 체크박스 값에서만 온다 — 다른 어떤 자동 판정도 거치지 않는다.
      var fields = {
        title: title,
        date: date,
        time: document.getElementById('calFTime').value,
        companyId: document.getElementById('calFCompany').value,
        memo: document.getElementById('calFMemo').value,
        isImportant: document.getElementById('calFImportant').checked
      };
      if(isNew) add(fields);
      else update(state.editingId, fields);
      state.mode = state.formReturn;
      render();
    });
  }

  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail.key !== 'calendar') return;
    renderBadge();
    if(isOpen() && (state.mode === 'list' || state.mode === 'grid')) render();
  });

  // 팀장 일정(team-schedule) 실시간 반영 — team-schedule 탭이 같은 origin에서 자신의
  // localStorage 키(team-schedule-app:events:v1)를 바꾸면 브라우저가 이 탭에 'storage'
  // 이벤트를 보내준다(§9b58b31과 동일한 근거: 같은 origin이면 다른 탭의 localStorage 변경이
  // storage 이벤트로 전달됨 — 단, 이 이벤트를 발생시킨 탭 자신에게는 오지 않고 "다른" 탭에만
  // 온다). 팝오버가 열려 있고 그리드 화면일 때만 다시 그린다 — 데이터를 복제하지 않고 매번
  // loadTeamEvents()로 원본을 새로 읽는다.
  window.addEventListener('storage', function(e){
    if(e.key !== TEAM_STORAGE_KEY) return;
    if(isOpen() && state.mode === 'grid') render();
    renderApprovalPill();
  });

  window.SHIN2_CALENDAR = { getAll: loadAll, add: add, update: update, setStatus: setStatus, remove: remove };

  renderBadge();
  renderApprovalPill();
})();
</script>

<script>
/* ==========================================================================
   자료실(SHIN2_LIBRARY) — 회사 공용 자료 저장소 (신규).
   업체별 서류함(CRM, users/{uid}/customers/{companyId}/documents/...)과는 완전히 분리된
   users/{uid}/library/{fileId}/{originalFileName} 대상 기능이다. 업체관리/지식/할일 등
   기존 모듈의 저장소·로직은 이 블록이 전혀 건드리지 않는다(§15, 완전 추가형).

   ---- 저장 구조 ----
   메타데이터: localStorage['shin2-library-documents-v1'] = [{id, title, originalFileName,
     category, method, workType, year, tags[], description, storagePath, mimeType, size,
     favorite, fileStored, createdAt, updatedAt}]  — 민감 필드 없음(§11 확인).
   파일 바이트: localStorage['shin2-library-blobs-v1'] = { [id]: dataURL } — 로컬 전용,
     SHIN2_SYNC_KEYS에 절대 추가하지 않는다(클라우드로 전혀 나가지 않음).

   ---- Storage 연결 여부(§Storage 연결 라운드, 갱신) ----
   코드 자체는 이제 실제 Firebase Storage 업로드(uploadBytesResumable, window.SHIN2_STORAGE —
   위쪽 Auth/Firestore 초기화 블록에서 함께 정의)를 로그인 상태에서 자동으로 시도한다. 다만
   이 샌드박스에는 실제 도달 가능한 Storage 버킷/네트워크가 없어(BLOCKED — 아웃바운드 요청이
   프록시에서 403으로 막힘) 실제 업로드 성공은 이 환경에서 검증할 수 없었다 — 코드 경로/구문만
   검증했다. saveLibraryFile()은 로그인 상태면 클라우드 업로드를 먼저 시도하고, 실패(또는
   미로그인)하면 사용자가 [다시 시도]/[이 기기에만 저장] 중 하나를 명시적으로 선택해야 다음
   단계로 진행한다 — 실패를 조용히 로컬로 대체하지 않는다. 로컬 폴백에만 여전히
   LIB_MAX_LOCAL_BYTES(2MB) 상한이 있다(클라우드 업로드에는 이 상한이 없음 — resumable upload).

   ---- 클라우드 동기화 여부(§Storage 연결 라운드, 갱신) ----
   자료실 메타데이터 키(library → shin2-library-documents-v1)를 SHIN2_SYNC_KEYS에 추가했다.
   업로드(또는 로컬저장)가 실제로 성공한 뒤에만 메타데이터를 쓰고, saveDocs()가 기존 다른
   모듈과 동일한 패턴으로 window.__shin2CloudSync.push('library', list)를 호출한다 — 로그인
   전/[클라우드 동기화 시작] 버튼을 아직 누르지 않았으면 noopPush라 아무 일도 하지 않고, 빈
   값은 pushToCloud 내부 isEmptyVal 가드가 막는다(§15). 새 동기화 메커니즘을 만들지 않았다.
   ========================================================================== */
(function(){
  'use strict';
  const LIB_KEY = 'shin2-library-documents-v1';
  const LIB_BLOB_KEY = 'shin2-library-blobs-v1'; // 로컬 전용 — SHIN2_SYNC_KEYS에 절대 추가하지 않는다
  const LIB_MAX_LOCAL_BYTES = 2 * 1024 * 1024; // 2MB — 로컬 폴백 한도(§ 대용량 base64 금지 원칙)
  const LOCAL_ONLY_NOTICE = '이 자료 파일은 현재 이 기기에만 저장되어 있습니다(다른 기기에서는 목록만 보이고 파일은 없을 수 있습니다).';
  // 로그인(클라우드 동기화) 상태면 파일을 자동으로 Storage 업로드를 시도한다 — 이 문구는
  // 로그인이 안 되어 있거나 업로드가 실패했을 때만 보이는 안내다. 로그인 상태에서는
  // openAddForm() 쪽에서 별도로 "클라우드에 업로드됩니다" 안내로 바뀐다.
  const BLOCKED_NOTICE = '클라우드 로그인이 안 되어 있어 지금은 파일 1개당 2MB 이하만 이 기기에 임시로 저장할 수 있습니다. 사이트 잠금을 해제해 로그인하면 자동으로 클라우드 업로드가 시도됩니다.';

  // 기본 분류 — 하드코딩된 enum이 아니라 그냥 문자열 배열이라 나중에 얼마든지 추가할 수 있다(§1).
  const LIB_CATEGORIES = ['시방서','단가표','실적자료','공법소개서','회사소개서','카탈로그','협약자료','공고문양식','교육자료','기타'];
  const LIB_ACCEPT = '.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.jpg,.jpeg,.png,.webp,.zip';

  // categorizeLibError: 실제로 던져진 에러(err.code/err.message)를 사람이 읽을 수 있는
  // 카테고리+구체적 사유 문구로 정직하게 매핑한다. 추측이 아니라 위 saveLibraryFile/addDoc/
  // replaceFile/uploadToStorage가 실제로 던지는 code 값만 기준으로 분기한다 — 없는 code를
  // 지어내지 않고, 매칭되지 않으면 "기타"로 원본 메시지를 그대로 보여준다.
  function categorizeLibError(err){
    const code = (err && err.code) || '';
    const msg = (err && err.message) || String(err || '');
    if(code === 'SIZE_LIMIT'){
      return { category:'파일 크기 제한', reason:'이 기기 임시 저장 한도(2MB)를 초과했습니다. 클라우드 로그인 후 다시 시도하면 용량 제한 없이 업로드됩니다.' };
    }
    if(code === 'LOCAL_STORAGE_QUOTA_EXCEEDED'){
      return { category:'기타', reason:'이 브라우저의 저장 공간이 가득 차 파일을 저장하지 못했습니다(다른 자료를 정리하거나 클라우드 로그인 후 다시 시도해주세요).' };
    }
    if(code === 'NOT_AUTHENTICATED'){
      return { category:'인증 오류', reason:'클라우드 로그인이 확인되지 않았습니다. 사이트 잠금을 해제해 로그인한 뒤 다시 시도해주세요.' };
    }
    if(code === 'READ_FAILED'){
      return { category:'기타', reason:'파일을 읽는 중 오류가 발생했습니다(' + (msg || '알 수 없는 오류') + ').' };
    }
    if(code === 'NOT_FOUND'){
      return { category:'기타', reason:'대상 자료를 찾을 수 없습니다(이미 삭제되었을 수 있습니다).' };
    }
    if(/^storage\//.test(code)){
      if(/network|timeout|unavailable/i.test(code)){
        return { category:'네트워크 오류', reason:'Firebase Storage 네트워크 오류: ' + code };
      }
      if(/unauthorized|unauthenticated/i.test(code)){
        return { category:'인증 오류', reason:'Firebase Storage 인증 오류: ' + code };
      }
      return { category:'Storage 오류', reason:'Firebase Storage 업로드 오류: ' + code };
    }
    if(/network|fetch|Failed to fetch|ERR_/i.test(msg) || /network/i.test(code)){
      return { category:'네트워크 오류', reason:'네트워크 오류로 업로드하지 못했습니다: ' + (msg || code) };
    }
    return { category:'기타', reason:(msg || code || '알 수 없는 오류') };
  }

  function readArr(key){ try{ const raw = localStorage.getItem(key); const a = raw?JSON.parse(raw):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  // [버그 수정 — 폴더 일괄등록 "일부만 등록됨" 라운드] writeArr/writeObj는 localStorage 용량
  // 초과(QuotaExceededError) 시 예외를 그냥 console.error로만 삼키고 성공한 것처럼 undefined를
  // 반환했다 — 그 결과 addDoc()/replaceFile()이 "저장 성공"으로 착각하고 fileStored:true 메타
  // 데이터를 그대로 기록해, 실제로는 파일 바이트가 하나도 저장되지 않은 "가짜 성공" 레코드가
  // 생겼다(성공 카운트에는 포함되지만 나중에 다운로드하면 CASE C로 떨어지는 유령 레코드). 이제
  // 실제 저장 성공 여부를 boolean으로 반환해 호출부가 진짜로 실패를 알 수 있게 한다.
  function writeArr(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr)); return true; }catch(e){ console.error('[자료실] 저장 실패', key, e); return false; } }
  function readObj(key){ try{ const raw = localStorage.getItem(key); const o = raw?JSON.parse(raw):{}; return (o && typeof o==='object')?o:{}; }catch(e){ return {}; } }
  function writeObj(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }catch(e){ console.error('[자료실] 저장 실패(용량 초과 가능)', key, e); return false; } }
  function genId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return (s == null ? '' : String(s)).trim().toLowerCase(); }

  function loadDocs(){ return readArr(LIB_KEY); }
  // saveDocs: 이제 실제 localStorage 저장 성공 여부를 boolean으로 반환한다(위 writeArr 수정과
  // 짝) — 호출부(addDoc/replaceFile)가 이 값을 반드시 확인해 실패 시 메타데이터를 "성공"으로
  // 취급하지 않도록 한다.
  function saveDocs(list){
    const ok = writeArr(LIB_KEY, list);
    // [Storage 연결 라운드에서 추가] 다른 기존 모듈(companies/tasks/memos 등)과 완전히 동일한
    // 패턴 — 새 동기화 메커니즘을 만들지 않고, 이미 있는 push 함수를 그대로 호출한다. 로그인
    // 전/[클라우드 동기화 시작] 버튼을 아직 누르지 않은 상태에서는 noopPush라 아무 일도 하지
    // 않고, 값이 비어있으면 pushToCloud 내부의 isEmptyVal 가드가 막는다(§15). 로컬 저장 자체가
    // 실패했으면(ok===false) 클라우드로도 절대 밀어보내지 않는다 — 로컬에 없는 상태를 클라우드에
    // 전파하지 않기 위함.
    if(ok && window.__shin2CloudSync) window.__shin2CloudSync.push('library', list);
    return ok;
  }
  function findDoc(id){ return loadDocs().find(d=> d.id === id) || null; }
  function getBlob(id){ const blobs = readObj(LIB_BLOB_KEY); return blobs[id] || ''; }
  // writeBlob: 실제 저장 성공 여부를 boolean으로 반환한다(§ 위 버그 수정과 짝).
  function writeBlob(id, dataUrl){ const blobs = readObj(LIB_BLOB_KEY); blobs[id] = dataUrl; return writeObj(LIB_BLOB_KEY, blobs); }
  function removeBlob(id){ const blobs = readObj(LIB_BLOB_KEY); delete blobs[id]; writeObj(LIB_BLOB_KEY, blobs); }

  // saveLibraryFile: 실제 파일 바이트를 저장하는 유일한 진입점.
  // opts.forceLocal === true면 Storage를 아예 시도하지 않고 곧장 "이 기기에만 저장" 경로로
  // 간다(사용자가 업로드 실패 후 명시적으로 "이 기기에만 저장"을 눌렀을 때만 이렇게 호출됨 —
  // 실패를 조용히 로컬로 대체하는 코드가 아니라, 항상 사용자의 명시적 선택을 거친다).
  // 그 외에는(Storage 로그인이 되어 있으면) 클라우드 업로드를 먼저 시도하고, 실패하면 그대로
  // reject해 호출부가 "업로드 실패 + [다시 시도]/[이 기기에만 저장]" UI를 띄우게 한다 —
  // 여기서 실패를 삼키고 로컬로 자동 전환하지 않는다(§ 안전 규칙).
  // onProgress(pct)는 실제 진행률(클라우드: bytesTransferred/totalBytes, 로컬: FileReader
  // loaded/total)을 그대로 전달한다 — 가짜 100%를 만들지 않는다.
  // 반환: { localOnly, storagePath, dataUrl } — dataUrl은 localOnly일 때만 채워진다.
  // §shin/v2 전체 공용 동기화 라운드: crm/index.html의 saveDocumentFile에서 발견/수정했던
  // 것과 같은 레이스 컨디션이 여기도 그대로 있었다 — Firebase 로그인이 비동기로 아직 진행
  // 중인 순간(예: 사이트 잠금을 막 풀고 곧바로 자료실에 파일을 올린 경우)에는
  // window.SHIN2_STORAGE가 아직 없어 useCloud가 false로 판정되어, 잠시 뒤 로그인이 성공했을
  // 상황에도 곧장 2MB 로컬 폴백으로 새버렸다. crm과 동일한 waitForCloudReady(최대 4초 대기)로
  // 고쳤다 — 새 메커니즘이 아니라 이미 검증된 패턴을 그대로 재사용.
  function waitForCloudReady(timeoutMs){
    return new Promise((resolve)=>{
      const start = Date.now();
      (function check(){
        const ST = window.SHIN2_STORAGE;
        if(ST && ST.isSignedIn && ST.isSignedIn()){ resolve(true); return; }
        if(Date.now() - start >= timeoutMs){ resolve(false); return; }
        setTimeout(check, 150);
      })();
    });
  }
  function saveLibraryFile(id, file, onProgress, opts){
    opts = opts || {};
    function attempt(useCloud){
      const ST = window.SHIN2_STORAGE;
      if(useCloud && ST){
        // 클라우드 업로드 경로 — 2MB 로컬 폴백 상한은 여기 적용하지 않는다(resumable upload라
        // 대용량 파일도 처리 가능). 실패하면 그대로 reject(로컬로 자동 대체하지 않음).
        const path = `users/${ST.getUid()}/library/${id}/${file.name}`;
        return ST.uploadFile(file, path, onProgress).then(res=> ({ localOnly:false, storagePath: res.storagePath, dataUrl:null }));
      }
      // 로컬 전용 폴백 — Storage 미로그인이거나 사용자가 명시적으로 "이 기기에만 저장"을 선택한
      // 경우에만 여기로 온다. localStorage 용량 한계 때문에 이 분기에만 2MB 상한이 있다.
      return new Promise((resolve, reject)=>{
        if(file.size > LIB_MAX_LOCAL_BYTES){
          reject(Object.assign(new Error('SIZE_LIMIT'), { code:'SIZE_LIMIT' }));
          return;
        }
        const reader = new FileReader();
        reader.onprogress = (e)=>{ if(onProgress && e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
        reader.onload = ()=>{ if(onProgress) onProgress(100); resolve({ localOnly:true, storagePath: 'local:' + id, dataUrl: reader.result }); };
        reader.onerror = ()=> reject(reader.error || Object.assign(new Error('READ_FAILED'), { code:'READ_FAILED' }));
        reader.readAsDataURL(file);
      });
    }
    if(opts.forceLocal) return attempt(false);
    const ST0 = window.SHIN2_STORAGE;
    if(ST0 && ST0.isSignedIn && ST0.isSignedIn()) return attempt(true);
    return waitForCloudReady(4000).then(ready=> attempt(ready));
  }

  function addDoc(file, meta, onProgress, opts){
    const id = genId('lib');
    return saveLibraryFile(id, file, onProgress, opts).then(result=>{
      // [버그 수정] result.dataUrl이 있을 때(로컬 폴백) writeBlob()의 실제 성공 여부를 반드시
      // 확인한다 — localStorage 용량 초과로 파일 바이트 저장이 실패했는데도 메타데이터만
      // "성공"으로 기록하면, 목록에는 보이지만 실제로는 파일이 어디에도 없는 유령 레코드가
      // 생긴다(§ 고아 메타데이터 금지 위반). 이 경우 메타데이터를 아예 쓰지 않고 명확한 에러로
      // reject한다 — 호출부(폴더 일괄등록 결과 화면 등)가 "실패"로 정직하게 표시하도록.
      if(result.dataUrl){
        const blobOk = writeBlob(id, result.dataUrl);
        if(!blobOk){
          throw Object.assign(new Error('LOCAL_STORAGE_QUOTA_EXCEEDED'), { code:'LOCAL_STORAGE_QUOTA_EXCEEDED' });
        }
      }
      const now = nowIso();
      const rec = {
        id,
        title: (meta.title || file.name || '').trim() || file.name,
        originalFileName: file.name, // 업로드 이후 절대 바꾸지 않는다(파일 교체 시에만 갱신).
        category: meta.category || '',
        method: meta.method || '',
        workType: meta.workType || '',
        year: meta.year || '',
        tags: meta.tags || [],
        description: meta.description || '',
        storagePath: result.storagePath,
        mimeType: file.type || '',
        size: file.size || 0,
        favorite: false,
        fileStored: true,
        localOnly: result.localOnly, // true면 이 기기에만 파일 바이트가 있음, false면 Storage 업로드 완료
        createdAt: now, updatedAt: now
      };
      // 업로드(또는 로컬 저장)가 "성공"한 뒤에만 메타데이터를 쓴다 — 실패한 파일의 메타데이터는
      // 절대 만들지 않는다(§ 고아 메타데이터 금지, 위 saveLibraryFile의 reject가 여기 도달을 막음).
      const list = loadDocs(); list.push(rec);
      const metaOk = saveDocs(list);
      if(!metaOk){
        // [버그 수정] 메타데이터 배열 저장도 localStorage 용량 초과로 실패할 수 있다 — 이때는
        // 방금 쓴 blob(있다면)을 롤백해 "파일은 있는데 메타데이터는 없는" 고아 blob도 남기지
        // 않는다. 메타데이터가 없으면 목록에 아예 나타나지 않으므로 이 blob은 어차피 죽은
        // 데이터라 정리한다.
        if(result.dataUrl) removeBlob(id);
