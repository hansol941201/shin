    var file = restoreFile.files && restoreFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result));
        if(!parsed || typeof parsed !== 'object' || !parsed.data){
          setStatus('올바른 백업 파일이 아닙니다.');
          return;
        }
        var merge = window.SHIN2_SYNC_MERGE;
        var keys = window.SHIN2_SYNC_KEYS || {};
        var touched = [];
        Object.keys(keys).forEach(function(key){
          if(!(key in parsed.data)) return; // 백업에 이 키가 아예 없으면 손대지 않는다
          var incoming = parsed.data[key];
          var storageKey = keys[key];
          var current = null;
          try{ var raw = localStorage.getItem(storageKey); current = raw ? JSON.parse(raw) : null; }catch(e){}
          var merged;
          if(merge.isEmptyVal(key, current)){
            merged = incoming; // 로컬이 비어있으면 백업 내용을 그대로 채택(잃을 로컬 데이터가 없음)
          } else if(merge.isEmptyVal(key, incoming)){
            merged = current; // 백업 쪽이 비어있으면 로컬을 그대로 둔다(빈 값으로 덮어쓰지 않음)
          } else {
            merged = merge.mergeValues(key, current, incoming); // 둘 다 있으면 삭제 없이 병합
          }
          try{ localStorage.setItem(storageKey, JSON.stringify(merged)); }catch(e){}
          if(window.__shin2CloudSync && typeof window.__shin2CloudSync.push === 'function'){
            window.__shin2CloudSync.push(key, merged);
          }
          touched.push(key);
        });
        // 계정함(비밀번호)은 기기마다 다른 salt로 암호화되어 있어 자동 병합 시 복호화 실패
        // 위험이 있으므로, 복원 대상에서 의도적으로 제외한다(§8 보고 대상 — 안전을 위한 결정).
        setStatus('복원 완료(' + touched.length + '개 항목 병합, 계정함 제외) — 잠시 후 새로고침됩니다.');
        setTimeout(function(){ location.reload(); }, 1200);
      }catch(e){
        console.error('[한솔2] 복원 실패', e);
        setStatus('백업 파일을 읽는 중 오류가 발생했습니다. 로컬 데이터는 변경되지 않았습니다.');
      }
    };
    reader.readAsText(file);
  });

  // 클라우드 동기화 버튼 — firebaseConfig.js가 있고 로그인에 성공했을 때만 노출된다.
  // 'shin2-firebase-ready' 이벤트는 로그인 성공 시 위 module script에서 디스패치하지만,
  // 그 이벤트 리스너 자체는 아무 Firestore 읽기/쓰기도 하지 않는다 — 오직 버튼을 보여줄 뿐이다.
  // 실제 CASE A/B/C 판단은 아래 click 리스너 안에서, 사용자가 버튼을 누른 그 순간에만 실행된다.
  window.addEventListener('shin2-firebase-ready', function(){
    if(cloudBtn) cloudBtn.style.display = '';
  });

  // §기존 데이터 실제 마이그레이션 라운드: 버튼을 누르면 곧바로 동기화를 실행하지 않고,
  // 먼저 이 브라우저에서 실제로 발견된 데이터 건수를 보여주는 확인 모달을 연다(읽기 전용).
  // 사용자가 [클라우드로 이전]을 눌러야만 실제 startInitialSync()가 실행된다 — §12(자동
  // 마이그레이션 금지) 원칙은 그대로 유지.
  cloudBtn && cloudBtn.addEventListener('click', function(){
    if(!window.__shin2CloudSync || typeof window.__shin2CloudSync.startInitialSync !== 'function'){
      setStatus('Firebase 연결 준비 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    openMigrationDiscoverModal();
  });
})();
</script>

<script>
(function(){
  // ---------- 업무 지식 (검색창 + 지식 관리 페이지) ----------
  // 저장 위치: localStorage['shin2-knowledge-v1'] = { items:[...], contacts:[...] }
  // 이 기능에는 AI 개입이 없다. 사용자가 직접 추가/수정/삭제하는 순수 입력 데이터다.
  const KB_STORAGE_KEY = 'shin2-knowledge-v1';
  const KB_HINT_SEEN_KEY = 'shin2-kb-hint-seen';
  const CAT_LABEL = { response:'응대', task:'업무', method:'공법', unclassified:'미분류' };

  // items/contacts는 기존 그대로. importBatches는 "빠른 지식 추가"가 쓰는 신규 배열로, 같은
  // 저장소(KB_STORAGE_KEY)에 얹는다(§ 구현노트: 별도 localStorage 키를 새로 만들지 않는다).
  const kbState = { items: [], contacts: [], importBatches: [], filter: 'all', search: '' };

  function kbNormalize(s){ return (s == null ? '' : String(s)).trim().toLowerCase(); }
  function kbEscapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function kbEscapeAttr(str){ return kbEscapeHtml(str); }
  function genKbId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  function loadKbRaw(){
    try{
      const raw = localStorage.getItem(KB_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  // [버그 수정 — "지식 추가에서 저장을 눌러도 아무 반응이 없다"] 이 setItem은 이 파일에서
  // 거의 유일하게 try/catch 없이 노출돼 있던 저장 호출이었다. 이 origin(github.io 전체가 한
  // origin — /shin, /shin/v2, /shin/crm이 같은 localStorage를 공유한다)의 용량이 가득 찬
  // 기기에서는 QuotaExceededError가, localStorage가 차단된 브라우저에서는 SecurityError가
  // 그대로 밖으로 던져졌다. 그러면 호출부(handleSave)의 closeOverlay()/renderKbList()까지
  // 통째로 중단되면서 "저장도 안 되고, 모달도 안 닫히고, 목록도 그대로"인 무반응 증상이 됐다.
  // 자료실 writeArr/writeObj(§ 폴더 일괄등록 라운드)와 동일한 패턴으로 성공 여부를 반환한다.
  // 저장 키/데이터 구조는 전혀 바뀌지 않는다 — 예외를 밖으로 흘리지 않고 결과만 알려줄 뿐이다.
  function saveKb(){
    const kbSnapshot = { items: kbState.items, contacts: kbState.contacts, importBatches: kbState.importBatches };
    let ok = true;
    try{
      localStorage.setItem(KB_STORAGE_KEY, JSON.stringify(kbSnapshot));
    }catch(e){
      ok = false;
      console.error('[지식] 로컬 저장 실패(저장 공간 초과 가능)', e);
    }
    // 로컬 저장이 실패해도 클라우드 push는 그대로 시도한다 — 로그인된 기기라면 여기서 데이터가
    // 살아남는다(기존 동작과 동일한 경로/키를 그대로 사용).
    // push 호출 자체도 감싼다: 이 줄은 로컬 저장이 성공한 뒤에 실행되는데, 여기서 예외가 나면
    // (동기화 객체는 있는데 push가 아직 함수가 아닌 타이밍, push 내부 예외 등) 로컬에는 이미
    // 저장이 끝났는데도 호출부의 모달 닫기/목록 갱신이 통째로 중단돼 "저장이 안 된 것처럼"
    // 보였다. typeof 검사는 이 파일의 다른 호출부(§클라우드 동기화 시작, §자료실)가 이미
    // 쓰고 있는 방식과 동일하다.
    try{
      if(window.__shin2CloudSync && typeof window.__shin2CloudSync.push === 'function'){
        window.__shin2CloudSync.push('knowledge', kbSnapshot);
      }
    }catch(e){
      console.error('[지식] 클라우드 동기화 전달 실패(로컬 저장 결과에는 영향 없음)', e);
    }
    return ok;
  }

  function seedIfEmpty(){
    const existing = loadKbRaw();
    if(existing){
      kbState.items = Array.isArray(existing.items) ? existing.items : [];
      kbState.contacts = Array.isArray(existing.contacts) ? existing.contacts : [];
      kbState.importBatches = Array.isArray(existing.importBatches) ? existing.importBatches : [];
      return;
    }
    const c1 = { id:genKbId('ct'), name:'심혜진', role:'연구원', dept:'', phone:'010-9954-7653', area:'공법/자재 기술관련 · 시방서 기술문의', keywords:['기술문의','시방서','시방서 기술문의','공법기술','심혜진'], memo:'' };
    const c2 = { id:genKbId('ct'), name:'한준엽', role:'과장', dept:'', phone:'010-3355-3458', area:'공사일정', keywords:['공사일정','일정','한준엽'], memo:'' };
    const c3 = { id:genKbId('ct'), name:'정정훈', role:'과장', dept:'', phone:'010-8003-6900', area:'하자보수', keywords:['하자보수','하자','정정훈'], memo:'' };
    const c4 = { id:genKbId('ct'), name:'이란', role:'매니저', dept:'', phone:'1800-8203', area:'스토어', keywords:['스토어','이란'], memo:'' };
    const c5 = { id:genKbId('ct'), name:'', role:'', dept:'용인공장', phone:'010-2737-3394', area:'폐기물 처리과정/신청', keywords:['폐기물','폐기물 처리','용인공장'], memo:'' };
    const c6 = { id:genKbId('ct'), name:'', role:'', dept:'', phone:'010-9291-3892', area:'미팅일정/시공사', keywords:['미팅일정','시공사'], memo:'' };
    const c7 = { id:genKbId('ct'), name:'', role:'', dept:'', phone:'010-8678-9398', area:'아파트 문의', keywords:['아파트 문의','아파트'], memo:'' };
    kbState.contacts = [c1,c2,c3,c4,c5,c6,c7];

    const i1 = {
      id: genKbId('kb'), category:'response', title:'견적문의',
      keywords:['견적','견적문의','견적요청','견적궁금','공사견적','견적질문'],
      scriptLines:['어느 아파트에서 전화주셨을까요?','정확한 현장 확인을 위해 도로명 주소도 부탁드립니다.','어떤 공종을 검토하고 계실까요?'],
      steps:['아파트명','주소','공종','견적요청 내용','유입경로'],
      afterCall:'POUR공법 문의 및 응대 토픽방 등록',
      extraNote:'',
      contactLinks:[{ contactId:c6.id, role:'시공사 문의' }]
    };
    const i2 = {
      id: genKbId('kb'), category:'method', title:'특허번호 차이',
      keywords:['특허','특허번호','공법특허'],
      content:'특허번호마다 차이는 없습니다. 같은 공종이며 연구개발을 통해 갱신·등록하고 있습니다. 어떤 특허를 사용해도 동일합니다.'
    };
    const i3 = {
      id: genKbId('kb'), category:'task', title:'자재발주',
      keywords:['자재','자재발주'],
      content:'필요 자재 소요량을 확인한 뒤 발주 요청서를 작성하여 담당 부서에 전달합니다. 발주 후 입고 예정일을 확인하고 현장과 공유합니다. (세부 절차는 필요에 따라 직접 수정해서 사용하세요.)'
    };
    kbState.items = [i1,i2,i3];
    saveKb();
  }
  seedIfEmpty();

  // ---------- 통합검색 우선순위: 1)제목/이름 정확 2)제목/이름 부분 3)keyword 정확 4)keyword 부분
  // 5)본문/원문(originalText) 6)담당자/연락처 등 연관정보 ----------
  // originalText는 향후 "한솔1 데이터 가져오기"/"AI 자동분류 빠른메모" 기능이 채우기 시작할 필드다.
  // 이 인덱스는 원본 데이터를 읽기만 할 뿐 어떤 필드도 수정하지 않는다(파생 데이터, 캐시 아님).
  function kbScoreItem(item, q){
    if(!q) return 0;
    const title = kbNormalize(item.title);
    if(title === q) return 100;
    if(title.includes(q)) return 90;
    const kws = (item.keywords || []).map(kbNormalize).filter(Boolean);
    if(kws.includes(q)) return 80;
    if(kws.some(k => k.includes(q) || q.includes(k))) return 60;
    const parts = [];
    if(item.category === 'response'){
      parts.push(...(item.scriptLines||[]), ...(item.steps||[]), item.afterCall||'', item.extraNote||'');
    } else {
      parts.push(item.content||'');
    }
    // originalText 필드가 존재하는 항목이 있다면(현재 시드 데이터에는 없을 수 있음) 방어적으로 포함한다.
    if(item.originalText) parts.push(item.originalText);
    const text = kbNormalize(parts.join(' '));
    if(text.includes(q)) return 40;
    return 0;
  }
  function kbScoreContact(c, q){
    if(!q) return 0;
    const name = kbNormalize(c.name);
    if(name && name === q) return 100;
    if(name && name.includes(q)) return 90;
    const kws = (c.keywords || []).map(kbNormalize).filter(Boolean);
    if(kws.includes(q)) return 80;
    if(kws.some(k => k.includes(q) || q.includes(k))) return 60;
    const text = kbNormalize([c.dept,c.role,c.area,c.memo,c.originalText||''].join(' '));
    if(text.includes(q)) return 40;
    // 전화번호도 검색어로 매치는 가능하되(연관정보 수준의 낮은 우선순위), 결과 카드 표시는 기존 방식 그대로.
    if(c.phone && kbNormalize(c.phone).includes(q)) return 30;
    return 0;
  }
  // 계정함 항목: 사이트명/아이디까지만 검색 대상. 비밀번호/URL/메모는 절대 채점 대상에 포함하지 않는다
  // (rec.cipher/rec.iv를 이 함수는 아예 참조하지 않으므로 복호화 자체가 일어나지 않는다).
  function kbScoreAccount(acc, q){
    if(!q) return 0;
    const site = kbNormalize(acc.site);
    if(site && site === q) return 100;
    if(site && site.includes(q)) return 90;
    const user = kbNormalize(acc.username);
    if(user && (user === q || user.includes(q))) return 20;
    return 0;
  }
  // 자료실(신규, §11) — 메타데이터 필드(제목/원본파일명/분류/공법/공종/연도/태그/설명)까지만
  // 채점 대상에 포함한다. 파일 바이너리는 애초에 이 레코드에 들어있지 않으므로 검색되지 않는다.
  // 민감 필드는 이 스키마에 존재하지 않는다(§11 확인 사항).
  function kbScoreLibrary(doc, q){
    if(!q) return 0;
    const title = kbNormalize(doc.title);
    if(title && title === q) return 100;
    if(title && title.includes(q)) return 90;
    const fname = kbNormalize(doc.originalFileName);
    if(fname && fname.includes(q)) return 70;
    if(doc.category && kbNormalize(doc.category).includes(q)) return 60;
    const tags = (doc.tags || []).map(kbNormalize);
    if(tags.some(t=> t.includes(q) || q.includes(t))) return 60;
    if(doc.method && kbNormalize(doc.method).includes(q)) return 50;
    if(doc.workType && kbNormalize(doc.workType).includes(q)) return 50;
    if(doc.year && kbNormalize(String(doc.year)).includes(q)) return 45;
    if(doc.description && kbNormalize(doc.description).includes(q)) return 40;
    return 0;
  }
  function kbRenderLibraryCard(doc, isTop, q){
    const lines = [];
    if(doc.category) lines.push(`분류: ${kbEscapeHtml(doc.category)}`);
    if(doc.method) lines.push(`공법: ${kbHighlight(doc.method, q)}`);
    if(doc.workType) lines.push(`공종: ${kbHighlight(doc.workType, q)}`);
    if(doc.originalFileName) lines.push(`파일: ${kbHighlight(doc.originalFileName, q)}`);
    return `<div class="kb-result-card${isTop?' top':''}" data-lib-id="${kbEscapeAttr(doc.id)}">
      <div class="kb-result-cat">자료</div>
      <div class="kb-result-title">${kbHighlight(doc.title, q)}</div>
      <div class="kb-plain-content">${lines.join('<br>')}</div>
    </div>`;
  }

  // ---------- 통합검색 인덱스 빌더 (확장 포인트) ----------
  // 새 데이터 소스(예: 향후 업체관리)를 검색에 포함시키려면 이 배열에 { type, getRecords, score, render }
  // 항목 하나만 추가하면 된다. 각 소스는 자신의 원본 데이터를 참조만 하며 복사/캐시하지 않는다.
  const SHIN2_SEARCH_SOURCES = [
    { type:'item', getRecords: ()=> kbState.items, score: kbScoreItem, render: kbRenderItemCard },
    { type:'contact', getRecords: ()=> kbState.contacts, score: kbScoreContact, render: kbRenderContactCard },
    {
      type:'account',
      getRecords: ()=> (window.SHIN2_ACCOUNTS && window.SHIN2_ACCOUNTS.getSearchable) ? window.SHIN2_ACCOUNTS.getSearchable() : [],
      score: kbScoreAccount,
      render: kbRenderAccountCard
    },
    // 업체관리(shin2-companies-staging) — 실제 업체관리 화면이 읽고 쓰는 저장소와 동일한 키.
    { type:'company', getRecords: getCompanyStaging, score: kbScoreCompany, render: kbRenderCompanyCard },
    // 아파트(§1/§16, 신규) — shin2-companies-staging과 완전히 분리된 별도 엔티티. 저장소는
    // shin2-call-entries-v1 그대로이며, window.SHIN2_CALLS.getApartmentGroups()가 정규화 키
    // 기준으로 그룹핑한 결과만 조회한다(업체 목록에는 절대 등록되지 않는다).
    {
      type:'apartment',
      getRecords: ()=> (window.SHIN2_CALLS && window.SHIN2_CALLS.getApartmentGroups) ? window.SHIN2_CALLS.getApartmentGroups() : [],
      score: kbScoreApartment,
      render: kbRenderApartmentCard
    },
    // 처리할 업무(shin2-tasks-v1)
    {
      type:'task',
      getRecords: ()=> (window.SHIN2_TASKS ? window.SHIN2_TASKS.getAll() : []),
      score: kbScoreTask,
      render: kbRenderTaskCard
    },
    // 전화메모 접수(shin2-call-entries-v1)
    {
      type:'call',
      getRecords: ()=> (window.SHIN2_CALLS ? window.SHIN2_CALLS.getAll() : []),
      score: kbScoreCall,
      render: kbRenderCallCard
    },
    // 공통 메모(shin2-memos-v1) — 어느 화면에 붙은 메모인지(§14)와 함께 보여준다.
    {
      type:'memo',
      getRecords: ()=> (window.SHIN2_MEMO ? window.SHIN2_MEMO.loadAll() : []),
      score: kbScoreMemo,
      render: kbRenderMemoCard
    },
    // 자료실(shin2-library-documents-v1, 신규 §11) — 메타데이터만 조회한다(getSearchable이
    // 파일 바이너리/blob 저장소는 아예 참조하지 않는다).
    {
      type:'library',
      getRecords: ()=> (window.SHIN2_LIBRARY ? window.SHIN2_LIBRARY.getSearchable() : []),
      score: kbScoreLibrary,
      render: kbRenderLibraryCard
    }
  ];

  function kbSearchAll(query){
    const q = kbNormalize(query);
    if(!q) return [];
    const results = [];
    SHIN2_SEARCH_SOURCES.forEach(src=>{
      src.getRecords().forEach(record=>{
        const s = src.score(record, q);
        if(s > 0) results.push({ type: src.type, record, score: s });
      });
    });
    results.sort((a,b)=> b.score - a.score);
    return results;
  }

  function kbContactDisplayName(c){
    if(!c) return '(삭제된 연락처)';
    if(c.name) return c.name + (c.role ? ' ' + c.role : '');
    return c.dept || c.area || '담당자 미지정';
  }

  function kbCopy(text, btn){
    if(!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.nextElementSibling && btn.nextElementSibling.classList.contains('kb-copied-tag') ? btn.nextElementSibling : null;
      if(old) old.remove();
      const span = document.createElement('span');
      span.className = 'kb-copied-tag';
      span.textContent = '복사됨';
      btn.insertAdjacentElement('afterend', span);
      setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
    }).catch(()=>{});
  }

  // ---------- 홈 검색창: 라이브 검색 결과 ----------
  const mainSearchInput = document.getElementById('mainSearchInput');
  const mainSearchHint = document.getElementById('mainSearchHint');
  const mainSearchResults = document.getElementById('mainSearchResults');

  // 검색어와 일치하는 부분을 기존 .kb-hl 스타일로 감싼다(새 스타일을 만들지 않고 그대로 재사용).
  function kbHighlight(text, q){
    const raw = String(text == null ? '' : text);
    const nq = kbNormalize(q);
    if(!nq) return kbEscapeHtml(raw);
    const lower = raw.toLowerCase();
    let idx = lower.indexOf(nq);
    if(idx === -1) return kbEscapeHtml(raw);
    let out = '';
    let cursor = 0;
    while(idx !== -1){
      out += kbEscapeHtml(raw.slice(cursor, idx));
      out += '<mark class="kb-hl">' + kbEscapeHtml(raw.slice(idx, idx + nq.length)) + '</mark>';
      cursor = idx + nq.length;
      idx = lower.indexOf(nq, cursor);
    }
    out += kbEscapeHtml(raw.slice(cursor));
    return out;
  }
  // 원문/본문에서 검색어 근처를 발췌한다(있는 경우). 일치 지점이 없으면 앞부분만 잘라 보여준다.
  function kbSnippet(text, q, radius){
    const raw = String(text == null ? '' : text);
    if(!raw) return '';
    radius = radius || 50;
    const nq = kbNormalize(q);
    const lower = raw.toLowerCase();
    const idx = nq ? lower.indexOf(nq) : -1;
    if(idx === -1){
      return raw.length > radius * 2 ? raw.slice(0, radius * 2) + '…' : raw;
    }
    const start = Math.max(0, idx - radius);
    const end = Math.min(raw.length, idx + nq.length + radius);
    let snippet = raw.slice(start, end);
    if(start > 0) snippet = '…' + snippet;
    if(end < raw.length) snippet = snippet + '…';
    return snippet;
  }

  function kbRenderScriptLine(line){
    return `<div class="kb-script-line"><mark class="kb-hl">"${kbEscapeHtml(line)}"</mark></div>`;
  }
  function kbRenderContactLink(link){
    const c = kbState.contacts.find(x=> x.id === link.contactId);
    const name = kbContactDisplayName(c);
    const phone = c && c.phone ? c.phone : '';
    const roleLabel = link.role ? kbEscapeHtml(link.role) + ' · ' : '';
    return `<div class="kb-contact-line">
      <span>${roleLabel}<span class="kb-contact-name">${kbEscapeHtml(name)}</span>${phone ? ' / ' + kbEscapeHtml(phone) : ''}</span>
      ${phone ? `<button type="button" class="kb-copy-btn" data-copy-text="${kbEscapeAttr(phone)}">복사</button>` : ''}
    </div>`;
  }
  function kbRenderItemCard(item, isTop, q){
    const catLabel = CAT_LABEL[item.category] || item.category;
    let body;
    if(item.category === 'response'){
      const scriptHtml = (item.scriptLines||[]).map(kbRenderScriptLine).join('');
      const stepsHtml = (item.steps||[]).length ? `<div class="kb-steps-label">확인 순서</div><div class="kb-steps-text">${kbEscapeHtml((item.steps||[]).join(' → '))}</div>` : '';
      const linksHtml = (item.contactLinks||[]).length ? `<div class="kb-contact-label">담당</div>${(item.contactLinks||[]).map(kbRenderContactLink).join('')}` : '';
      const afterHtml = item.afterCall ? `<div class="kb-aftercall-label">통화 후</div><div class="kb-aftercall-text">${item.afterCall.split('\n').filter(line=>line.trim()).map(line=>`<div class="kb-aftercall-line"><span class="kb-aftercall-check">✓</span>${kbEscapeHtml(line.trim())}</div>`).join('')}</div>` : '';
      const extraHtml = item.extraNote ? `<div class="kb-extra-label">추가 참고</div><div class="kb-extra-text">${kbEscapeHtml(item.extraNote)}</div>` : '';
      body = scriptHtml + stepsHtml + linksHtml + afterHtml + extraHtml;
    } else {
      body = `<div class="kb-plain-content">${kbHighlight(item.content||'', q)}</div>`;
    }
    // originalText 필드는 있을 때만 발췌+강조해서 보여준다(향후 데이터 이전/빠른메모 기능 대비).
    const originalHtml = item.originalText
      ? `<div class="kb-extra-label">원문</div><div class="kb-plain-content">${kbHighlight(kbSnippet(item.originalText, q), q)}</div>`
      : '';
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">${catLabel}</div>
      <div class="kb-result-title">${kbHighlight(item.title, q)}</div>
      ${body}
      ${originalHtml}
    </div>`;
  }
  function kbRenderContactCard(c, isTop, q){
    const name = kbContactDisplayName(c);
    const areaLine = c.area ? `<div class="kb-contact-result-line">${kbHighlight(c.area, q)}</div>` : '';
    const phoneLine = c.phone
      ? `<div class="kb-contact-line"><span class="kb-contact-name">${kbEscapeHtml(name)}</span> / ${kbEscapeHtml(c.phone)} <button type="button" class="kb-copy-btn" data-copy-text="${kbEscapeAttr(c.phone)}">복사</button></div>`
      : '';
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">연락처</div>
      <div class="kb-result-title">${kbHighlight(name, q)}</div>
      ${areaLine}
      ${phoneLine}
    </div>`;
  }
  // 계정함 결과: 사이트명/아이디까지만 표시한다. rec.cipher/rec.iv(비밀번호)는 이 함수에 애초에
  // 전달되지 않으므로(window.SHIN2_ACCOUNTS.getSearchable가 site/username만 노출) 비밀번호 텍스트가
  // 결과 DOM 어디에도 나타날 수 없다.
  function kbRenderAccountCard(acc, isTop, q){
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">계정</div>
      <div class="kb-result-title">${kbHighlight(acc.site, q)}</div>
      <div class="kb-plain-content">아이디: ${acc.username ? kbHighlight(acc.username, q) : '-'}</div>
    </div>`;
  }
  // ---------- 업체 대기 저장소(shin2-companies-staging) 검색 연동 ----------
  // 한솔2에는 아직 업체관리 화면이 없으므로 이 저장소는 화면을 만들지 않고 검색에만 연결한다(§6/§24).
  // 원본 데이터를 읽기만 하고 이 파일은 절대 그 값을 고치지 않는다.
  const COMPANIES_STAGING_KEY = 'shin2-companies-staging';
  function getCompanyStaging(){
    try{
      const raw = localStorage.getItem(COMPANIES_STAGING_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function kbScoreCompany(co, q){
    if(!q) return 0;
    const name = kbNormalize(co.name);
    if(name && name === q) return 100;
    if(name && name.includes(q)) return 90;
    const rep = kbNormalize(co.repName);
    if(rep && rep.includes(q)) return 70;
    const contact = kbNormalize(co.contactName);
    if(contact && contact.includes(q)) return 65;
    if(co.phone && kbNormalize(co.phone).includes(q)) return 60;
    const text = kbNormalize([co.address, co.memo, co.bizRegNo, co.email].filter(Boolean).join(' '));
    if(text.includes(q)) return 40;
    return 0;
  }
  // §11/§12: 시공사 검색 결과 = 업체정보 카드 + 최근 전화기록(요약, 원문 전체 나열 금지) +
  // [전체 전화기록 보기]. 최근 전화기록은 window.SHIN2_CALLS.getForCompany(회사id)를 그대로
  // 조회만 할 뿐 여기서 데이터를 복사 저장하지 않는다(§22).
  // 서류 체크현황(§업체 서류, 신규) — 업체관리 화면의 coDocStatus()와 동일한 기본값 규칙(문서
  // 없음 → 전부 미보유)을 이 검색 카드 쪽에서도 그대로 따른다. 검색 결과가 복잡해지지 않도록
  // 딱 한 줄만 추가한다(§14).
  const KB_DOC_FIELD_DEFS = [
    { key:'logo', label:'로고' },
    { key:'businessCard', label:'명함' },
    { key:'businessRegistration', label:'사업자등록증' },
    { key:'questionnaireReply', label:'질문서 회신' }
  ];
  function kbDocLine(co){
    const ds = co && co.documentsStatus;
    const s = {
      logo: !!(ds && ds.logo), businessCard: !!(ds && ds.businessCard),
      businessRegistration: !!(ds && ds.businessRegistration), questionnaireReply: !!(ds && ds.questionnaireReply)
    };
    const count = KB_DOC_FIELD_DEFS.reduce((n,f)=> n + (s[f.key] ? 1 : 0), 0);
    if(count === 4) return '서류 4/4 완료';
    const missing = KB_DOC_FIELD_DEFS.filter(f=> !s[f.key]).map(f=> f.label);
    return `서류 ${count}/4 · 미보유: ${missing.join(' · ')}`;
  }
  // 협력사 여부 표시(§파트너 대시보드 연동 준비, 신규) — 업체관리 화면(coPartnerGlyphHtml)과
  // 동일한 규칙: partner→파란 ○ / nonPartner→빨간 × / unknown(필드 없음 포함)→표시 없음.
  // 이 검색 카드 모듈은 업체관리 IIFE와 별개라 같은 규칙을 여기서도 그대로 재구현만 한다(값은
  // co.partnerStatus를 그대로 읽기만 하고 절대 쓰지 않는다).
  function kbPartnerGlyphHtml(co){
    const st = co && co.partnerStatus;
    if(st === 'partner') return '<span class="co-partner-glyph is-partner" title="협력사">○</span>';
    if(st === 'nonPartner') return '<span class="co-partner-glyph is-nonpartner" title="비협력사">×</span>';
    return '';
  }
  function kbRenderCompanyCard(co, isTop, q){
    const lines = [];
    if(co.repName) lines.push(`대표: ${kbEscapeHtml(co.repName)}`);
    if(co.contactName) lines.push(`담당: ${kbEscapeHtml(co.contactName)}`);
    if(co.phone) lines.push(`전화: ${kbEscapeHtml(co.phone)}`);
    if(co.address) lines.push(`주소: ${kbEscapeHtml(co.address)}`);
    lines.push(kbEscapeHtml(kbDocLine(co)));
    if(co.memo) lines.push(`메모: ${kbHighlight(co.memo, q)}`);
    const calls = window.SHIN2_CALLS ? window.SHIN2_CALLS.getForCompany(co.id) : [];
    let callsHtml = '';
    if(calls.length){
      const recent = calls.slice(0, 3).map(r=>{
        const d = new Date(r.createdAt);
        const dateLabel = `${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getDate().toString().padStart(2,'0')}`;
        const summary = r.requestText || (r.originalText||'').slice(0, 40);
        return `<div class="shin2-memo-item" data-call-id="${kbEscapeAttr(r.id)}" style="cursor:pointer;">
          <div class="shin2-memo-meta">${kbEscapeHtml(dateLabel)}</div>
          <div class="shin2-memo-text">${kbHighlight((r.siteName ? r.siteName + ' — ' : '') + summary, q)}</div>
        </div>`;
      }).join('');
      callsHtml = `<div class="shin2-memo-block" style="margin-top:10px;padding-top:10px;">
        <div class="shin2-memo-title" style="margin-bottom:4px;">최근 전화기록 (총 ${calls.length}건)</div>
        <div class="shin2-memo-list">${recent}</div>
        <button type="button" class="task-company-link" data-co-calls-id="${kbEscapeAttr(co.id)}" style="margin-top:6px;">전체 전화기록 보기</button>
      </div>`;
    }
    return `<div class="kb-result-card${isTop?' top':''}" data-co-id="${kbEscapeAttr(co.id)}">
      <div class="kb-result-cat">업체</div>
      <div class="kb-result-title">${kbPartnerGlyphHtml(co)}${kbHighlight(co.name, q)}</div>
      <div class="kb-plain-content">${lines.join('<br>')}</div>
      ${callsHtml}
    </div>`;
  }

  const TASK_STATUS_LABEL = { urgent:'긴급', progress:'진행', confirm:'확인', material:'자료', reply:'회신', normal:'일반' };
  function kbScoreTask(t, q){
    if(!q || t.done) return 0; // 완료된 업무는 통합검색 대상에서 제외(전체보기의 완료 탭에서만 조회)
    const title = kbNormalize(t.title);
    if(title && title === q) return 100;
    if(title && title.includes(q)) return 85;
    const company = getCompanyStaging().find(c=> c.id === t.companyId);
    if(company && kbNormalize(company.name).includes(q)) return 55;
    const content = kbNormalize(t.content);
    if(content.includes(q)) return 45;
    return 0;
  }
  function kbRenderTaskCard(t, isTop, q){
    const company = getCompanyStaging().find(c=> c.id === t.companyId);
    return `<div class="kb-result-card${isTop?' top':''}" data-task-id="${kbEscapeAttr(t.id)}">
      <div class="kb-result-cat">업무 ${TASK_STATUS_LABEL[t.status] || ''}</div>
      <div class="kb-result-title">${kbHighlight(t.title, q)}${company ? ' · ' + kbEscapeHtml(company.name) : ''}</div>
      ${t.content ? `<div class="kb-plain-content">${kbHighlight(t.content, q)}</div>` : ''}
    </div>`;
  }

  // 아파트 검색(§6/§7/§8/§10/§11, 신규) — window.SHIN2_CALLS.getApartmentGroups()가 이미
  // normalizeApartmentName() 기준으로 그룹핑해둔 결과를 그대로 조회만 한다(§14: 여기서는
  // 데이터를 복사 저장하지 않는다). 검색 카드 구조는 kbRenderCompanyCard와 동일한 클래스
  // (kb-result-card/shin2-memo-block/shin2-memo-list/shin2-memo-item)를 그대로 재사용해
  // "업체" vs "아파트"는 라벨/필드만 다르게 렌더링한다(§8 구조 통일).
  function kbScoreApartment(group, q){
    if(!q) return 0;
    var nameN = kbNormalize(group.name);
    if(nameN && nameN === q) return 95;
    if(nameN && nameN.includes(q)) return 90; // §7: "덕천" → "덕천주공1단지" 부분검색
    // 공백 차이만 있는 검색어도 매칭되도록 정규화 키(공백 제거) 기준으로도 한번 더 대조한다.
    var qKey = q.replace(/\s+/g,'');
    if(group.key && qKey && group.key.indexOf(qKey) !== -1) return 88;
    if(group.address && kbNormalize(group.address).includes(q)) return 50;
    return 0;
  }
  function kbRenderApartmentCard(group, isTop, q){
    var lines = [];
    if(group.recentContact) lines.push(`최근 전화자: ${kbEscapeHtml(group.recentContact)}`);
    if(group.phone) lines.push(`대표 연락처: ${kbEscapeHtml(group.phone)}`);
    if(group.address) lines.push(`주소: ${kbEscapeHtml(group.address)}`);
    const recent = group.records.slice(0, 3).map(r=>{
      const d = new Date(r.createdAt);
      const dateLabel = `${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getDate().toString().padStart(2,'0')}`;
      const who = r.contactName ? (r.contactName + (r.position ? ' ' + r.position : '')) : '';
      const summary = r.requestText || (r.originalText||'').slice(0, 40);
      return `<div class="shin2-memo-item" data-call-id="${kbEscapeAttr(r.id)}" style="cursor:pointer;">
        <div class="shin2-memo-meta">${kbEscapeHtml(dateLabel)}</div>
        <div class="shin2-memo-text">${kbHighlight((who ? who + ' — ' : '') + summary, q)}</div>
      </div>`;
    }).join('');
    const callsHtml = `<div class="shin2-memo-block" style="margin-top:10px;padding-top:10px;">
      <div class="shin2-memo-title" style="margin-bottom:4px;">최근 전화기록 (총 ${group.records.length}건)</div>
      <div class="shin2-memo-list">${recent}</div>
      <button type="button" class="task-company-link" data-apt-calls-key="${kbEscapeAttr(group.key)}" style="margin-top:6px;">전체 전화기록 보기</button>
    </div>`;
    return `<div class="kb-result-card${isTop?' top':''}" data-apt-key="${kbEscapeAttr(group.key)}">
      <div class="kb-result-cat">아파트</div>
      <div class="kb-result-title">${kbHighlight(group.name, q)}</div>
      <div class="kb-plain-content">${lines.join('<br>')}</div>
      ${callsHtml}
    </div>`;
  }

  // "전화 온 내용"(shin2-call-entries-v1) 검색(§17) — 시공사명/아파트명/전화자 이름/직책/
  // 전화번호/현장명/문의유형/공종/요청내용/원문까지 전부 검색 대상에 포함한다. "완료" 개념이
  // 없으므로(§23) 모든 기록이 항상 통합검색 대상이다.
  function kbScoreCall(call, q){
    if(!q) return 0;
    // 시공사와 이미 연결된 전화기록은 업체 카드 안에 "최근 전화기록"으로 이미 함께 나오므로
    // (§11) 통합검색 결과에 중복으로 따로 뜨지 않게 한다. 아파트는 kbScoreApartment가 그룹
    // 카드로 대신 노출하므로(§6) 여기서 개별 카드로 중복 노출하지 않는다. 미연결/기타/확인
    // 필요는 업체·아파트 카드가 없으므로 그대로 자기 카드로 노출된다.
    if(call.companyId) return 0;
    if(call.callerType === '아파트') return 0;
    const company = getCompanyStaging().find(c=> c.id === call.companyId);
    const nameN = kbNormalize(call.callerType === '아파트' ? call.apartmentName : (company ? company.name : call.companyCandidateName));
    if(nameN && nameN === q) return 95;
    if(nameN && nameN.includes(q)) return 85;
    if(call.contactName && kbNormalize(call.contactName).includes(q)) return 70;
    if(call.position && kbNormalize(call.position).includes(q)) return 68;
    if(call.phone && kbNormalize(call.phone).includes(q)) return 65;
    if(call.siteName && kbNormalize(call.siteName).includes(q)) return 60;
    if(call.address && kbNormalize(call.address).includes(q)) return 58;
    if(call.inquiryType && kbNormalize(call.inquiryType).includes(q)) return 55;
    const hay = kbNormalize([call.workType, call.requestText, call.followUp, call.originalText].filter(Boolean).join(' '));
    if(hay.includes(q)) return 40;
    return 0;
  }
  function kbRenderCallCard(call, isTop, q){
    const company = getCompanyStaging().find(c=> c.id === call.companyId);
    const nameLabel = call.callerType === '아파트' ? call.apartmentName : (company ? company.name : call.companyCandidateName);
    const title = `[${call.callerType}] ` + (nameLabel || '전화 온 내용');
    const lines = [];
    if(call.contactName) lines.push(`전화자: ${kbEscapeHtml(call.contactName)}${call.position ? ' ' + kbEscapeHtml(call.position) : ''}`);
    if(call.callerType === '시공사' && call.siteName) lines.push(`현장: ${kbHighlight(call.siteName, q)}`);
    if(call.callerType === '아파트' && call.address) lines.push(`주소: ${kbHighlight(call.address, q)}`);
    if(call.requestText) lines.push(`요청: ${kbHighlight(call.requestText, q)}`);
    return `<div class="kb-result-card${isTop?' top':''}" data-call-id="${kbEscapeAttr(call.id)}">
      <div class="kb-result-cat">전화 온 내용</div>
      <div class="kb-result-title">${kbHighlight(title, q)}</div>
      <div class="kb-plain-content">${lines.join('<br>')}</div>
    </div>`;
  }

  // 메모가 어디에 붙어 있는지(대상) 표시용 라벨을 구한다 — "메모만 덩그러니" 보여주지 않기 위함(§14).
  function kbMemoTargetLabel(m){
    if(m.targetType === 'home') return '홈';
    if(m.targetType === 'company'){
      const c = getCompanyStaging().find(x=> x.id === m.targetId);
      return '업체 · ' + (c ? c.name : '삭제된 업체');
    }
    if(m.targetType === 'task'){
      const t = (window.SHIN2_TASKS ? window.SHIN2_TASKS.getAll() : []).find(x=> x.id === m.targetId);
      return '업무 · ' + (t ? t.title : '삭제된 업무');
    }
    if(m.targetType === 'account'){
      const acc = (window.SHIN2_ACCOUNTS && window.SHIN2_ACCOUNTS.getSearchable) ? window.SHIN2_ACCOUNTS.getSearchable().find(x=> x.id === m.targetId) : null;
      return '계정 · ' + (acc ? acc.site : '삭제된 계정');
    }
    return m.targetType;
  }
  function kbScoreMemo(m, q){
    if(!q) return 0;
    const text = kbNormalize(m.text);
    if(text.includes(q)) return 80;
    return 0;
  }
  function kbRenderMemoCard(m, isTop, q){
    const d = new Date(m.createdAt);
    const dateLabel = (d.getMonth()+1).toString().padStart(2,'0') + '.' + d.getDate().toString().padStart(2,'0') + ' ' +
      d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    return `<div class="kb-result-card${isTop?' top':''}" data-memo-target-type="${kbEscapeAttr(m.targetType)}" data-memo-target-id="${kbEscapeAttr(m.targetId)}">
      <div class="kb-result-cat">${kbEscapeHtml(kbMemoTargetLabel(m))}</div>
      <div class="kb-result-title">메모</div>
      <div class="kb-plain-content">${kbHighlight(m.text, q)}</div>
      <div class="kb-memo-result-date">${kbEscapeHtml(dateLabel)}</div>
    </div>`;
  }

  function kbRenderResultEntry(entry, isTop, q){
    const src = SHIN2_SEARCH_SOURCES.find(s=> s.type === entry.type);
    return src ? src.render(entry.record, isTop, q) : '';
  }

  function renderMainResults(query){
    const q = (query || '').trim();
    if(!q){
      mainSearchResults.innerHTML = '';
      mainSearchHint.style.display = 'block';
      return;
    }
    mainSearchHint.style.display = 'none';
    const results = kbSearchAll(q);
    if(results.length === 0){
      mainSearchResults.innerHTML = `<div class="kb-no-result">검색 결과가 없습니다.</div>`;
      return;
    }
    let hintHtml = '';
    if(!localStorage.getItem(KB_HINT_SEEN_KEY)){
      hintHtml = `<div class="kb-hint-once">노란 표시 = 통화 중 읽을 문장</div>`;
      localStorage.setItem(KB_HINT_SEEN_KEY, '1');
    }
    const top = results[0];
    const rest = results.slice(1);
    let html = hintHtml + `<div class="kb-result-group-label">가장 관련 있는 결과</div>` + kbRenderResultEntry(top, true, q);
    if(rest.length){
      html += `<div class="kb-result-group-label">관련 결과</div>` + rest.map(e=> kbRenderResultEntry(e, false, q)).join('');
    }
    mainSearchResults.innerHTML = html;
  }

  let kbSearchDebounce = null;
  mainSearchInput.addEventListener('input', ()=>{
    clearTimeout(kbSearchDebounce);
    const val = mainSearchInput.value;
    kbSearchDebounce = setTimeout(()=> renderMainResults(val), 150);
  });
  mainSearchResults.addEventListener('click', (e)=>{
    // 업체 카드 안에 얹힌 "최근 전화기록" 항목 클릭(§11/§12) — 바깥 업체 카드 클릭보다
    // 먼저 검사해야 한다(안쪽 요소이므로 closest('[data-co-id]')도 함께 걸리기 때문).
    const callCard = e.target.closest('[data-call-id]');
    if(callCard){
      if(window.SHIN2_CALLS) window.SHIN2_CALLS.openPopup('detail', callCard.getAttribute('data-call-id'));
      return;
    }
    // 업체 카드의 "전체 전화기록 보기" 버튼(§11) — 업체 상세로 이동하면 전체 전화/업무
    // 기록이 이어서 보인다(SHIN2_COMPANIES 상세의 mountCompanySection).
    const coCallsBtn = e.target.closest('[data-co-calls-id]');
    if(coCallsBtn){
      const coId = coCallsBtn.getAttribute('data-co-calls-id');
      if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
      if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(coId);
      return;
    }
    // 아파트 카드의 "전체 전화기록 보기" 버튼(§6/§8, 신규) — 업체와 동일한 UX: 팝업 안에서
    // 아파트 히스토리 뷰로 이어진다(업체처럼 별도 화면으로 이동하지 않음 — §5: 완전히 새로운
    // "아파트 관리 페이지"까지는 만들지 않는다).
    const aptCallsBtn = e.target.closest('[data-apt-calls-key]');
    if(aptCallsBtn){
      if(window.SHIN2_CALLS) window.SHIN2_CALLS.openApartmentPopupByKey(aptCallsBtn.getAttribute('data-apt-calls-key'));
      return;
    }
    // 아파트 검색 결과 카드 클릭(§8): 업체 카드 클릭과 동일한 위치/역할 — 아파트 히스토리
    // 뷰를 바로 연다.
    const aptCard = e.target.closest('[data-apt-key]');
    if(aptCard){
      if(window.SHIN2_CALLS) window.SHIN2_CALLS.openApartmentPopupByKey(aptCard.getAttribute('data-apt-key'));
      return;
    }
    // 업체 검색 결과 카드 클릭(§13): 업체 화면으로 전환 후 해당 업체를 선택 상태로 연다.
    const coCard = e.target.closest('[data-co-id]');
    if(coCard){
      const coId = coCard.getAttribute('data-co-id');
      if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
      if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(coId);
      return;
    }
    // 자료실 검색 결과 카드 클릭(§11, 신규): 자료실 화면으로 전환 후 해당 자료의 수정 팝업을 연다.
    const libCard = e.target.closest('[data-lib-id]');
    if(libCard){
      if(window.SHIN2_NAV) window.SHIN2_NAV.showView('library');
      if(window.SHIN2_LIBRARY){
        window.SHIN2_LIBRARY.onEnter();
        window.SHIN2_LIBRARY.openDetail(libCard.getAttribute('data-lib-id'));
      }
      return;
    }
    // 업무 검색 결과 카드 클릭: 업무 상세 팝업을 바로 연다.
    const taskCard = e.target.closest('[data-task-id]');
    if(taskCard){
      if(window.SHIN2_TASKS) window.SHIN2_TASKS.openPopup('detail', taskCard.getAttribute('data-task-id'));
      return;
    }
    // 메모 검색 결과 카드 클릭: 대상(홈/업체/업무/계정) 화면을 열어 메모가 실제로 붙은 곳을 보여준다.
    const memoCard = e.target.closest('[data-memo-target-type]');
    if(memoCard){
      const targetType = memoCard.getAttribute('data-memo-target-type');
      const targetId = memoCard.getAttribute('data-memo-target-id');
      if(targetType === 'company'){
        if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
        if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(targetId);
      } else if(targetType === 'task'){
        if(window.SHIN2_TASKS) window.SHIN2_TASKS.openPopup('detail', targetId);
      } else if(targetType === 'account'){
        if(window.SHIN2_ACCOUNTS && window.SHIN2_ACCOUNTS.openDetail) window.SHIN2_ACCOUNTS.openDetail(targetId);
      }
      // targetType === 'home'이면 이미 홈이므로 이동할 곳이 없다 — 검색결과만 닫히고 그대로 홈에 남는다.
      return;
    }
    const btn = e.target.closest('[data-copy-text]');
    if(!btn) return;
    kbCopy(btn.getAttribute('data-copy-text'), btn);
  });

  // ---------- 지식 관리 페이지 ----------
  const kbTabs = document.getElementById('kbTabs');
  const kbSearchInput = document.getElementById('kbSearchInput');
  const kbAddBtn = document.getElementById('kbAddBtn');
  const kbListEl = document.getElementById('kbList');

  function kbFilteredList(){
    const q = kbNormalize(kbState.search);
    let entries = [];
    kbState.items.forEach(it=> entries.push({ type:'item', record:it }));
    kbState.contacts.forEach(c=> entries.push({ type:'contact', record:c }));
    if(kbState.filter !== 'all'){
      entries = entries.filter(e=> (e.type === 'contact' ? 'contact' : e.record.category) === kbState.filter);
    }
    if(q){
      entries = entries.filter(e=> e.type === 'item' ? kbScoreItem(e.record, q) > 0 : kbScoreContact(e.record, q) > 0);
    }
    return entries;
  }

  function renderKbList(){
    const entries = kbFilteredList();
    if(entries.length === 0){
      kbListEl.innerHTML = `<div class="kb-no-result">등록된 지식이 없습니다. + 추가로 등록하세요.</div>`;
      return;
    }
    kbListEl.innerHTML = entries.map(e=>{
      if(e.type === 'item'){
        const cat = CAT_LABEL[e.record.category] || e.record.category;
        const sub = e.record.category === 'response' ? (e.record.steps||[]).join(' → ') : (e.record.content||'');
        return `<div class="kb-row" data-type="item" data-id="${kbEscapeAttr(e.record.id)}">
          <div class="kb-row-cat">${cat}</div>
          <div class="kb-row-title">${kbEscapeHtml(e.record.title)}</div>
          <div class="kb-row-sub">${kbEscapeHtml(sub)}</div>
        </div>`;
      }
      const c = e.record;
      const display = kbContactDisplayName(c);
      return `<div class="kb-row" data-type="contact" data-id="${kbEscapeAttr(c.id)}">
        <div class="kb-row-cat">연락처</div>
        <div class="kb-row-title">${kbEscapeHtml(display)}</div>
        <div class="kb-row-sub">${kbEscapeHtml(c.phone || '')}</div>
      </div>`;
    }).join('');
    kbListEl.querySelectorAll('.kb-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const id = row.getAttribute('data-id');
        const type = row.getAttribute('data-type');
        if(type === 'item') openItemForm(kbState.items.find(x=> x.id === id));
        else openContactForm(kbState.contacts.find(x=> x.id === id));
      });
    });
  }

  kbTabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('.kb-tab');
    if(!btn) return;
    kbState.filter = btn.getAttribute('data-filter');
    kbTabs.querySelectorAll('.kb-tab').forEach(b=> b.classList.toggle('active', b === btn));
    renderKbList();
  });
  kbSearchInput.addEventListener('input', ()=>{
    kbState.search = kbSearchInput.value;
    renderKbList();
  });
  kbAddBtn.addEventListener('click', ()=>{
    if(kbState.filter === 'contact') openContactForm(null);
    else openItemForm(null, kbState.filter);
  });

  // ---------- 지식(응대/업무/공법) 추가·수정 폼 ----------
  function kbRenderLinesEditor(containerEl, values, placeholder){
    containerEl.innerHTML = '';
    const list = (values && values.length) ? values : [''];
    list.forEach(v=> kbAddLineRow(containerEl, v, placeholder));
  }
  function kbAddLineRow(containerEl, value, placeholder){
    const row = document.createElement('div');
    row.className = 'kb-line-row';
    row.innerHTML = `<input type="text" value="${kbEscapeAttr(value||'')}" placeholder="${kbEscapeAttr(placeholder||'')}" /><button type="button" class="kb-line-remove">&times;</button>`;
    row.querySelector('.kb-line-remove').addEventListener('click', ()=> row.remove());
    containerEl.appendChild(row);
  }
  function kbGetLinesValues(containerEl){
    return Array.from(containerEl.querySelectorAll('input')).map(i=> i.value.trim()).filter(Boolean);
  }

  function openItemForm(record, defaultCategory){
    const isNew = !record;
    const category = record ? record.category : ((defaultCategory && defaultCategory !== 'contact' && defaultCategory !== 'all') ? defaultCategory : 'task');
    let formLinks = record && record.contactLinks ? record.contactLinks.map(l=> Object.assign({}, l)) : [];

    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = `
      <div class="kb-modal">
        <div class="kb-modal-title">${isNew ? '지식 추가' : '지식 수정'}</div>
        ${(!isNew && record && record.originalText) ? `
        <button type="button" class="kb-text-action" id="kbViewOriginalBtn">원문 보기</button>
        <div id="kbOriginalBox" class="kb-form-field" style="display:none;">
          <div class="kb-extra-label">원문</div>
          <div class="kb-plain-content">${kbEscapeHtml(record.originalText)}</div>
        </div>` : ''}
        <div class="kb-form-field">
          <label>제목</label>
          <input type="text" id="kbFTitle" value="${isNew ? '' : kbEscapeAttr(record.title)}" />
        </div>
        <div id="kbFTitleErr" class="kb-form-error" style="display:none;">제목을 입력하세요.</div>
        <div class="kb-form-field">
          <label>분류</label>
          <select id="kbFCategory">
            <option value="response">응대</option>
            <option value="task">업무</option>
            <option value="method">공법</option>
            <option value="unclassified">미분류</option>
          </select>
        </div>
        <div class="kb-form-field">
          <label>검색 키워드 (쉼표로 구분)</label>
          <input type="text" id="kbFKeywords" value="${isNew ? '' : kbEscapeAttr((record.keywords||[]).join(', '))}" placeholder="예: 견적, 견적문의, 견적요청" />
        </div>

        <div id="kbResponseFields">
          <div class="kb-form-field">
            <label>전화 멘트 (실제로 읽는 문장, 줄마다 하나)</label>
            <div class="kb-lines-wrap" id="kbScriptLines"></div>
            <button type="button" class="kb-line-add" id="kbScriptAdd">+ 문장 추가</button>
          </div>
          <div class="kb-form-field">
            <label>확인 순서 (단계마다 하나)</label>
            <div class="kb-lines-wrap" id="kbStepLines"></div>
            <button type="button" class="kb-line-add" id="kbStepAdd">+ 단계 추가</button>
          </div>
          <div class="kb-form-field">
            <label>통화 후 처리</label>
            <textarea id="kbFAfterCall">${isNew ? '' : kbEscapeHtml(record.afterCall||'')}</textarea>
          </div>
          <div class="kb-form-field">
            <label>추가 참고 (선택)</label>
            <textarea id="kbFExtra">${isNew ? '' : kbEscapeHtml(record.extraNote||'')}</textarea>
          </div>
        </div>

        <div id="kbContentField" class="kb-form-field">
          <label>내용</label>
          <textarea id="kbFContent">${isNew ? '' : kbEscapeHtml(record.content||'')}</textarea>
        </div>

        <div id="kbLinksSection" class="kb-form-field">
          <label>관련 담당자</label>
          <div class="kb-contact-chips" id="kbChips"></div>
          <div class="kb-contact-picker" id="kbPickerWrap" style="display:none;">
            <input type="text" class="kb-role-input" id="kbRoleInput" placeholder="역할/조건 라벨 (예: 시공사 문의)" />
            <input type="text" id="kbContactSearch" placeholder="연락처 이름/부서/업무영역 검색 (기존 연락처만 선택 가능)" />
            <div class="kb-contact-picker-dropdown" id="kbPickerDropdown" style="display:none;"></div>
          </div>
          <button type="button" class="kb-add-link-btn" id="kbAddLinkBtn">+ 담당자 연결</button>
        </div>

        <div class="kb-form-actions">
          <div id="kbActionsLeft">${!isNew ? '<button type="button" class="kb-text-action danger" id="kbDeleteBtn">삭제</button>' : ''}</div>
          <div class="kb-form-actions-right">
            <button type="button" class="kb-text-action" id="kbFormCancel">취소</button>
            <button type="button" class="ai-run-btn" id="kbFormSave">저장</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const viewOrigBtn = overlay.querySelector('#kbViewOriginalBtn');
    if(viewOrigBtn){
      viewOrigBtn.addEventListener('click', ()=>{
        const box = overlay.querySelector('#kbOriginalBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
      });
    }

    const catSelect = overlay.querySelector('#kbFCategory');
    catSelect.value = category;
    const responseFieldsEl = overlay.querySelector('#kbResponseFields');
    const contentFieldEl = overlay.querySelector('#kbContentField');
    const linksSectionEl = overlay.querySelector('#kbLinksSection');
    function applyCategoryVisibility(){
      const cat = catSelect.value;
      responseFieldsEl.style.display = cat === 'response' ? 'block' : 'none';
      contentFieldEl.style.display = cat === 'response' ? 'none' : 'block';
      linksSectionEl.style.display = (cat === 'response' || cat === 'task') ? 'block' : 'none';
    }
    catSelect.addEventListener('change', applyCategoryVisibility);
    applyCategoryVisibility();

    const scriptWrap = overlay.querySelector('#kbScriptLines');
    const stepWrap = overlay.querySelector('#kbStepLines');
    kbRenderLinesEditor(scriptWrap, record ? record.scriptLines : [], '예: 어느 아파트에서 전화주셨을까요?');
    kbRenderLinesEditor(stepWrap, record ? record.steps : [], '예: 아파트명');
    overlay.querySelector('#kbScriptAdd').addEventListener('click', ()=> kbAddLineRow(scriptWrap, '', '예: 어느 아파트에서 전화주셨을까요?'));
    overlay.querySelector('#kbStepAdd').addEventListener('click', ()=> kbAddLineRow(stepWrap, '', '예: 아파트명'));

    const chipsEl = overlay.querySelector('#kbChips');
    function renderChips(){
      chipsEl.innerHTML = formLinks.map((l, idx)=>{
        const c = kbState.contacts.find(x=> x.id === l.contactId);
        const name = kbContactDisplayName(c);
        const label = l.role ? l.role + ' · ' : '';
        return `<span class="kb-chip">${kbEscapeHtml(label + name)} <button type="button" class="kb-chip-x" data-idx="${idx}">&times;</button></span>`;
      }).join('');
      chipsEl.querySelectorAll('.kb-chip-x').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          formLinks.splice(parseInt(btn.getAttribute('data-idx'), 10), 1);
          renderChips();
        });

  // 한솔1 이전(migration) 전용 API: sourceSystem/sourceId 기준으로 이미 있는 항목은 건너뛴다(중복 생성 금지).
  // originalText 등 넘어온 원문 필드는 그대로 저장할 뿐 이 함수가 가공/수정하지 않는다.
  function kbHasSource(list, sourceSystem, sourceId){
    // sourceSystem이 없는(네이티브) 항목끼리는 절대 "같은 출처"로 취급하지 않는다 — 둘 다 undefined이면
    // 서로 다른 네이티브 레코드인데도 중복으로 오판해 건너뛰는 버그를 막기 위한 가드.
    if(!sourceSystem) return false;
    return list.some(x => x.sourceSystem === sourceSystem && x.sourceId === sourceId);
  }
  function kbAddItems(newItems){
    let added = 0, skipped = 0;
    (newItems||[]).forEach(it=>{
      if(kbHasSource(kbState.items, it.sourceSystem, it.sourceId)){ skipped++; return; }
      kbState.items.push(it); added++;
    });
    if(added) saveKb();
    return { added, skipped };
  }
  function kbAddContacts(newContacts){
    let added = 0, skipped = 0;
    (newContacts||[]).forEach(c=>{
      if(kbHasSource(kbState.contacts, c.sourceSystem, c.sourceId)){ skipped++; return; }
      kbState.contacts.push(c); added++;
    });
    if(added) saveKb();
    return { added, skipped };
  }

  const QA_CAT_LABEL = { response:'응대', task:'업무', method:'공법', contact:'연락처', unclassified:'미분류' };

절대 규칙:

  function qaParseResponse(raw){
    let text = String(raw||'').trim();
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if(fence) text = fence[1].trim();
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed) || parsed.length === 0) throw new Error('AI 응답이 빈 배열이거나 배열이 아님');
    const validCats = ['response','task','method','contact','unclassified'];
    return parsed.map(p=>({
      category: validCats.indexOf(p && p.category) !== -1 ? p.category : 'unclassified',
      title: String((p && p.title) || '').trim() || '(제목 없음)',
      keywords: Array.isArray(p && p.keywords) ? p.keywords.map(k=>String(k).trim()).filter(Boolean) : [],
      sourceExcerpt: String((p && p.sourceExcerpt) || '').trim(),
      scriptLines: Array.isArray(p && p.scriptLines) ? p.scriptLines.map(s=>String(s).trim()).filter(Boolean) : [],
      steps: Array.isArray(p && p.steps) ? p.steps.map(s=>String(s).trim()).filter(Boolean) : [],
      afterCall: String((p && p.afterCall) || '').trim(),
      extraNote: String((p && p.extraNote) || '').trim(),
      content: String((p && p.content) || '').trim(),
      name: String((p && p.name) || '').trim(),
      dept: String((p && p.dept) || '').trim(),
      role: String((p && p.role) || '').trim(),
      phone: String((p && p.phone) || '').trim(),
      area: String((p && p.area) || '').trim()
    }));
  }

  // 중복 지식 알림(§17): 정교한 유사도 알고리즘 없이 제목/키워드가 겹치면 "비슷한 내용" 취급.
  function qaFindDuplicateItem(p){
    const titleN = kbNormalize(p.title);
    const kws = (p.keywords||[]).map(kbNormalize).filter(Boolean);
    return kbState.items.find(it=>{
      if(it.category !== p.category) return false;
      const itTitleN = kbNormalize(it.title);
      if(titleN && itTitleN && (itTitleN === titleN || itTitleN.includes(titleN) || titleN.includes(itTitleN))) return true;
      const itKws = (it.keywords||[]).map(kbNormalize);
      return kws.some(k=> k && itKws.indexOf(k) !== -1);
    }) || null;
  }
  function qaFindMatchingContact(p){
    const phone = (p.phone||'').replace(/[^0-9]/g,'');
    if(phone){
      const m = kbState.contacts.find(c=> c.phone && c.phone.replace(/[^0-9]/g,'') === phone);
      if(m) return m;
    }
    const nameN = kbNormalize(p.name);
    if(nameN){
      const m = kbState.contacts.find(c=> c.name && kbNormalize(c.name) === nameN);
      if(m) return m;
    }
    return null;
  }
  // 담당자 자동 연결(§16): 원문 발췌 안에 기존 연락처의 전화번호가 그대로 등장하면 연결한다.
  // 기존 연락처 데이터 자체는 절대 수정하지 않는다(읽기만 한다).
  function qaFindContactMentionedIn(text){
    if(!text) return null;
    return kbState.contacts.find(c=> c.phone && text.indexOf(c.phone) !== -1) || null;
  }
  function qaResolveDuplicatesAndLinks(proposals){
    proposals.forEach(p=>{
      if(p.category === 'contact'){
        const match = qaFindMatchingContact(p);
        if(match) p.duplicate = { type:'contact', existingId: match.id, existingLabel: kbContactDisplayName(match) };
      } else {
        const dupItem = qaFindDuplicateItem(p);
        if(dupItem) p.duplicate = { type:'item', existingId: dupItem.id, existingLabel: dupItem.title };
        const hay = [p.sourceExcerpt, p.content, (p.scriptLines||[]).join(' '), p.afterCall].filter(Boolean).join(' ');
        const contactMatch = qaFindContactMentionedIn(hay);
        if(contactMatch){
          p.autoLinkedContactId = contactMatch.id;
          p.autoLinkedContactLabel = kbContactDisplayName(contactMatch);
        }
      }
    });
  }

  function qaRenderItemCard(p, idx){
    const catOptions = ['response','task','method','contact','unclassified'].map(c=>
      `<option value="${c}"${p.category===c?' selected':''}>${QA_CAT_LABEL[c]}</option>`
    ).join('');
    let bodyHtml;
    if(p.category === 'contact'){
      const parts = [];
      if(p.name) parts.push(kbEscapeHtml(p.name));
      if(p.role) parts.push(kbEscapeHtml(p.role));
      if(p.area) parts.push(kbEscapeHtml(p.area));
      if(p.phone) parts.push(kbEscapeHtml(p.phone));
      bodyHtml = `<div class="kb-plain-content">${parts.join(' · ') || '(정보 없음)'}</div>`;
    } else if(p.category === 'response'){
      const scriptHtml = (p.scriptLines||[]).map(kbRenderScriptLine).join('');
      const stepsHtml = (p.steps||[]).length ? `<div class="kb-steps-label">확인 순서</div><div class="kb-steps-text">${kbEscapeHtml((p.steps||[]).join(' → '))}</div>` : '';
      const afterHtml = p.afterCall ? `<div class="kb-aftercall-label">통화 후</div><div class="kb-aftercall-text">${p.afterCall.split('\n').filter(l=>l.trim()).map(l=>`<div class="kb-aftercall-line"><span class="kb-aftercall-check">✓</span>${kbEscapeHtml(l.trim())}</div>`).join('')}</div>` : '';
      const extraHtml = p.extraNote ? `<div class="kb-extra-label">추가 참고</div><div class="kb-extra-text">${kbEscapeHtml(p.extraNote)}</div>` : '';
      bodyHtml = scriptHtml + stepsHtml + afterHtml + extraHtml;
    } else {
      bodyHtml = `<div class="kb-plain-content">${kbEscapeHtml(p.content||'')}</div>`;
    }
    const dupHtml = p.duplicate ? `
      <div class="qa-dup-note">비슷한 내용이 있습니다: ${kbEscapeHtml(p.duplicate.existingLabel)}</div>
      <div class="qa-dup-actions">
        <button type="button" class="kb-text-action" data-qa-viewdup="${idx}">기존 내용 보기</button>
        <button type="button" class="kb-text-action" data-qa-dismissdup="${idx}">새로 저장</button>
      </div>` : '';
    const linkHtml = p.autoLinkedContactId ? `<div class="qa-link-note">담당자 자동 연결: ${kbEscapeHtml(p.autoLinkedContactLabel)}</div>` : '';
    return `<div class="qa-item-card" data-qa-idx="${idx}">
      <div class="qa-item-head">
        <select data-qa-field="category">${catOptions}</select>
        <input type="text" data-qa-field="title" value="${kbEscapeAttr(p.title)}" />
      </div>
      <div class="kb-form-field">
        <label>검색 키워드 (쉼표로 구분)</label>
        <input type="text" data-qa-field="keywords" value="${kbEscapeAttr((p.keywords||[]).join(', '))}" />
      </div>
      <div class="qa-item-body">${bodyHtml}</div>
      ${dupHtml}
      ${linkHtml}
      <div class="qa-original-box" style="display:none;">
        <div class="kb-extra-label">원문 발췌</div>
        <div class="kb-plain-content">${kbEscapeHtml(p.sourceExcerpt || '(발췌 없음)')}</div>
      </div>
      <button type="button" class="kb-text-action" data-qa-toggleorig="${idx}">원문 보기</button>
    </div>`;
  }

  function qaSaveBatch(batchText, proposals){
    const batchId = genKbId('batch');
    const itemIds = [];
    proposals.forEach((p, i)=>{
      const sourceId = batchId + ':' + i;
      if(p.category === 'contact'){
        const rec = {
          id: genKbId('ct'), name: p.name||'', dept: p.dept||'', role: p.role||'',
          phone: p.phone||'', area: p.area||'', keywords: p.keywords||[], memo:'',
          originalText: p.sourceExcerpt||'',
          sourceSystem: 'quick-add', sourceId: sourceId, sourceBatchId: batchId
        };
        kbState.contacts.push(rec);
        itemIds.push(rec.id);
      } else {
        const rec = {
          id: genKbId('kb'), category: p.category, title: p.title, keywords: p.keywords||[],
          originalText: p.sourceExcerpt||'', sourceExcerpt: p.sourceExcerpt||'',
          sourceSystem: 'quick-add', sourceId: sourceId, sourceBatchId: batchId
        };
        if(p.category === 'response'){
          rec.scriptLines = p.scriptLines||[];
          rec.steps = p.steps||[];
          rec.afterCall = p.afterCall||'';
          rec.extraNote = p.extraNote||'';
          rec.contactLinks = p.autoLinkedContactId ? [{ contactId: p.autoLinkedContactId, role:'' }] : [];
        } else {
          rec.content = p.content||'';
          if(p.autoLinkedContactId) rec.contactLinks = [{ contactId: p.autoLinkedContactId, role:'' }];
        }
        kbState.items.push(rec);
        itemIds.push(rec.id);
      }
    });
    kbState.importBatches.push({ id: batchId, originalText: batchText, createdAt: Date.now(), itemIds: itemIds });
    saveKb();
    renderKbList();
  }

  function qaOpenPreview(batchText, proposals, aiFailed){
    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    const qaState = { proposals: proposals.map(p=> Object.assign({}, p)) };

    function render(){
      const failBanner = aiFailed ? `<div class="qa-fail-banner">자동분류에 실패했습니다. 원문은 임시 저장되었습니다.</div>` : '';
      overlay.innerHTML = `
        <div class="kb-modal wide">
          <div class="kb-modal-title">이렇게 정리할까요?</div>
          ${failBanner}
          <div class="qa-summary">${qaState.proposals.length}개의 지식으로 정리됩니다.</div>
          <div id="qaList">${qaState.proposals.map((p,i)=> qaRenderItemCard(p,i)).join('')}</div>
          <button type="button" class="kb-text-action" id="qaViewOriginalBtn">원문 보기</button>
          <div id="qaOriginalFull" class="qa-original-box" style="display:none;">
            <div class="kb-extra-label">붙여넣은 원문 전체</div>
            <div class="kb-plain-content">${kbEscapeHtml(batchText)}</div>
          </div>
          <div class="kb-form-actions" style="margin-top:14px;">
            <div></div>
            <div class="kb-form-actions-right">
              <button type="button" class="kb-text-action" id="qaCancelBtn">취소</button>
              <button type="button" class="kb-text-action" id="qaReanalyzeBtn">다시 분석</button>
              <button type="button" class="ai-run-btn" id="qaSaveBtn">저장</button>
            </div>
          </div>
        </div>
      `;
      bind();
    }

    function bind(){
      overlay.querySelector('#qaCancelBtn').addEventListener('click', ()=> overlay.remove());
      overlay.querySelector('#qaViewOriginalBtn').addEventListener('click', ()=>{
        const box = overlay.querySelector('#qaOriginalFull');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
      });
      overlay.querySelector('#qaReanalyzeBtn').addEventListener('click', ()=>{
        overlay.remove();
        qaRunAnalyze(batchText);
      });
      overlay.querySelector('#qaSaveBtn').addEventListener('click', ()=>{
        overlay.querySelectorAll('.qa-item-card').forEach(card=>{
          const idx = parseInt(card.getAttribute('data-qa-idx'), 10);
          const p = qaState.proposals[idx];
          const catSel = card.querySelector('[data-qa-field="category"]');
          const titleInp = card.querySelector('[data-qa-field="title"]');
          const kwInp = card.querySelector('[data-qa-field="keywords"]');
          if(catSel) p.category = catSel.value;
          if(titleInp) p.title = titleInp.value.trim() || '(제목 없음)';
          if(kwInp) p.keywords = kwInp.value.split(',').map(s=>s.trim()).filter(Boolean);
        });
        qaSaveBatch(batchText, qaState.proposals);
        overlay.remove();
      });
      overlay.querySelectorAll('[data-qa-toggleorig]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = btn.getAttribute('data-qa-toggleorig');
          const card = overlay.querySelector('.qa-item-card[data-qa-idx="'+idx+'"]');
          const box = card.querySelector('.qa-original-box');
          box.style.display = box.style.display === 'none' ? 'block' : 'none';
        });
      });
      overlay.querySelectorAll('[data-qa-field="category"]').forEach(sel=>{
        sel.addEventListener('change', ()=>{
          const card = sel.closest('.qa-item-card');
          const idx = parseInt(card.getAttribute('data-qa-idx'),10);
          const titleInp = card.querySelector('[data-qa-field="title"]');
          const kwInp = card.querySelector('[data-qa-field="keywords"]');
          qaState.proposals[idx].title = titleInp.value;
          qaState.proposals[idx].keywords = kwInp.value.split(',').map(s=>s.trim()).filter(Boolean);
          qaState.proposals[idx].category = sel.value;
          render();
        });
      });
      overlay.querySelectorAll('[data-qa-dismissdup]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.getAttribute('data-qa-dismissdup'),10);
          delete qaState.proposals[idx].duplicate;
          render();
        });
      });
      overlay.querySelectorAll('[data-qa-viewdup]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.getAttribute('data-qa-viewdup'),10);
          const dup = qaState.proposals[idx].duplicate;
          if(!dup) return;
          alert('기존 지식: ' + dup.existingLabel);
        });
      });
    }

    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    render();
  }

  async function qaDoAnalyze(apiKey, pastedText){
    const prompt = qaBuildPrompt(pastedText);
    try{
      const raw = await window.SHIN2_AI.callOpenAI(apiKey, prompt);
      const proposals = qaParseResponse(raw);
      qaResolveDuplicatesAndLinks(proposals);
      qaOpenPreview(pastedText, proposals, false);
    }catch(err){
      // AI 실패(네트워크/HTTP/빈 응답/JSON 파싱 실패 전부 포함) — 원문을 잃지 않도록 미분류 1건으로 폴백.
      console.error('[SHIN2/QuickAdd] AI 분석 실패:', err);
      const fallback = [{
        category:'unclassified', title:'(자동분류 실패 — 원문 그대로 저장)', keywords:[],
        content: pastedText, sourceExcerpt: pastedText,
        scriptLines:[], steps:[], afterCall:'', extraNote:'', name:'', dept:'', role:'', phone:'', area:''
      }];
      qaOpenPreview(pastedText, fallback, true);
    }
  }
  function qaRunAnalyze(pastedText){
    if(!window.SHIN2_AI){ return; }
    const apiKey = window.SHIN2_AI.getApiKey();
    if(!apiKey){
      window.SHIN2_AI.promptForApiKey((key)=> qaDoAnalyze(key, pastedText));
      return;
    }
    qaDoAnalyze(apiKey, pastedText);
  }

  function qaOpenPasteModal(){
    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = `
      <div class="kb-modal">
        <div class="kb-modal-title">빠른 지식 추가</div>
        <div class="kb-form-field">
          <textarea id="qaPasteInput" class="ai-textarea" placeholder="여기에 내용을 그대로 붙여넣으세요" style="min-height:200px;"></textarea>
        </div>
        <div id="qaPasteErr" class="kb-form-error" style="display:none;">붙여넣을 내용을 입력하세요.</div>
        <div class="kb-form-actions">
          <div></div>
          <div class="kb-form-actions-right">
            <button type="button" class="kb-text-action" id="qaPasteCancel">취소</button>
            <button type="button" class="ai-run-btn" id="qaPasteRun">AI로 정리해서 저장</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    overlay.querySelector('#qaPasteCancel').addEventListener('click', ()=> overlay.remove());
    overlay.querySelector('#qaPasteRun').addEventListener('click', ()=>{
      const val = overlay.querySelector('#qaPasteInput').value;
      if(!val.trim()){
        overlay.querySelector('#qaPasteErr').style.display = 'block';
        return;
      }
      overlay.remove();
      qaRunAnalyze(val);
    });
  }

  const kbQuickAddBtn = document.getElementById('kbQuickAddBtn');
  if(kbQuickAddBtn) kbQuickAddBtn.addEventListener('click', qaOpenPasteModal);

  window.SHIN2_KB = { renderKbList, addItems: kbAddItems, addContacts: kbAddContacts };
})();
</script>

<script>
(function(){
  // ---------- 내 할 일 (한솔2 전용 신규 기능 — 한솔1 "오늘 할 일"과는 별개) ----------
  // 저장 위치: localStorage['shin2-todos']. 민감정보가 아니므로 평문 저장으로 충분하다
  // (사이트 잠금 게이트 뒤에서만 화면 자체가 보이므로 별도 암호화는 하지 않는다).
  // UI는 사이드바 상단 아이콘 → 우측 슬라이드 패널로 노출한다(홈 화면 큰 블록은 제거됨).
  // 인터랙션: 체크 = 완료 = 목록에서 즉시 제거(완료 탭/휴지통 없음). 되돌리기 토스트만 제공.
  // §다중 사용자 라운드: '내 할 일'은 개인 데이터.
  const TODO_KEY = window.SHIN2_USER ? window.SHIN2_USER.nsKey('shin2-todos') : 'shin2-todos';
  let todos = [];

  function loadTodos(){
    try{
      const raw = localStorage.getItem(TODO_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveTodos(){
    localStorage.setItem(TODO_KEY, JSON.stringify(todos));
    if(window.__shin2CloudSync) window.__shin2CloudSync.push('todos', todos);
  }
  function genTodoId(){
    return 'todo_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }
  function escapeHtmlT(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  todos = loadTodos();
  // §고객 진행단계 연동 라운드: "완료 = 배열에서 삭제"였던 예전 모델을 "완료 = done:true로
  // 남기고 목록에서만 숨김"으로 바꿨다(처리완료 이력 보존 요구사항 때문에 더 이상 삭제할 수
  // 없음) — 그래서 예전에 있던 "done:true 항목을 페이지 열 때마다 지우는" 1회성 정리 코드를
  // 제거했다. 이 정리는 그보다 더 예전 UI("체크 시 취소선")의 잔재를 치우기 위한 것이었고,
  // 지금은 done:true가 정상적인 영구 상태라 계속 돌리면 방금 완료 처리한 항목(수동+자동
  // 고객관리 항목 전부)이 새로고침마다 사라져버린다.

  const listEl = document.getElementById('todoList');
  const addToggleBtn = document.getElementById('todoAddToggleBtn');
  const addRow = document.getElementById('todoAddRow');
  const addInput = document.getElementById('todoAddInput');
  const addSaveBtn = document.getElementById('todoAddSaveBtn');
  const iconBtn = document.getElementById('todoIconBtn');
  const iconBadge = document.getElementById('todoIconBadge');
  const panelEl = document.getElementById('todoPanel');
  const overlayEl = document.getElementById('todoPanelOverlay');
  const panelCloseBtn = document.getElementById('todoPanelCloseBtn');
  const doneToggleBtn = document.getElementById('todoDoneToggleBtn');
  // §고객 진행단계 연동 라운드: 기본은 미완료만 보여주고(showDone=false), [처리완료]를
  // 누르면 완료된 항목(수동+자동 고객관리 항목 전부)만 보여준다. 완료 이력은 배열에서
  // 지우지 않으므로 새로고침해도 계속 볼 수 있다.
  let showDone = false;

  let toastEl = null, toastTimer = null;
  function dismissToast(){
    if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
    if(toastEl){ toastEl.remove(); toastEl = null; }
  }
  function showUndoToast(item){
    dismissToast();
    toastEl = document.createElement('div');
    toastEl.className = 'todo-toast';
    toastEl.innerHTML = `<span>완료했습니다.</span><button type="button" class="todo-toast-undo">되돌리기</button>`;
    panelEl.appendChild(toastEl);
    toastEl.querySelector('.todo-toast-undo').addEventListener('click', ()=>{
      item.done = false;
      item.completedAt = null;
      saveTodos();
      dismissToast();
      renderTodos();
    });
    toastTimer = setTimeout(()=>{ dismissToast(); }, 4000);
  }

  function updateBadge(){
    // §고객 진행단계 연동 라운드: 배지는 미완료 건수만 센다(자동 생성된 고객관리 항목도
    // 일반 할 일과 동일하게 포함, §7) — 완료된 항목은 배열에 남아있어도 세지 않는다.
    const activeCount = todos.filter(t=> !t.done).length;
    if(activeCount > 0){
      iconBadge.textContent = activeCount > 99 ? '99+' : String(activeCount);
      iconBadge.style.display = 'inline-block';
    } else {
      iconBadge.style.display = 'none';
    }
  }

  function fmtTodoDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    const p = n=> String(n).padStart(2,'0');
    return p(d.getMonth()+1) + '.' + p(d.getDate());
  }

  function renderTodos(){
    dismissToast();
    updateBadge();
    doneToggleBtn.textContent = showDone ? '미완료 보기' : '처리완료';
    doneToggleBtn.classList.toggle('active', showDone);
    const visible = todos.filter(t=> !!t.done === showDone);
    if(visible.length === 0){
      listEl.innerHTML = `<div class="todo-empty">${showDone ? '처리완료된 항목이 없습니다.' : '등록된 할 일이 없습니다.'}</div>`;
      return;
    }
    listEl.innerHTML = visible.map((t)=> `
      <div class="todo-row${t.done ? ' todo-row-done' : ''}" data-id="${escapeHtmlT(t.id)}">
        <input type="checkbox" class="todo-checkbox" ${t.done ? 'checked' : ''} />
        <div class="todo-main">
          ${t.source === 'customer-stage' ? `<span class="todo-tag">고객관리</span>` : ''}
          ${t.companyId ? `<span class="todo-company-link" data-open-company="${escapeHtmlT(t.companyId)}">${escapeHtmlT(t.companyName || '')}</span>` : ''}
          <span class="todo-text" contenteditable="false" spellcheck="false">${escapeHtmlT(t.companyName ? t.text.replace(t.companyName + ' — ', '') : t.text)}</span>
          ${t.done ? `<span class="todo-done-date">${fmtTodoDate(t.completedAt)} 완료</span>` : ''}
        </div>
        ${!t.done ? `
        <div class="todo-move-btns">
          <button type="button" class="todo-move-btn" data-move="up">&uarr;</button>
          <button type="button" class="todo-move-btn" data-move="down">&darr;</button>
        </div>` : ''}
        <button type="button" class="todo-del-btn" data-del="1">&times;</button>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-open-company]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        window.open('../crm/?company=' + encodeURIComponent(el.getAttribute('data-open-company')), '_blank', 'noopener');
      });
    });

    listEl.querySelectorAll('.todo-row').forEach(row=>{
      const id = row.getAttribute('data-id');
      const t = todos.find(x=> x.id === id);
      if(!t) return;

      // §고객 진행단계 연동 라운드: 체크 = 삭제가 아니라 done:true로 남긴다(완료 이력 보존,
      // §3/§9/§10/§12). 목록에서만 사라지고(위 filter), [처리완료]에서 계속 볼 수 있다.
      row.querySelector('.todo-checkbox').addEventListener('change', (e)=>{
        const checked = e.currentTarget.checked;
        t.done = checked;
        t.completedAt = checked ? Date.now() : null;
        saveTodos();
        renderTodos();
        if(checked && !showDone) showUndoToast(t);
      });

      const textEl = row.querySelector('.todo-text');
      textEl.addEventListener('click', ()=>{
        if(textEl.getAttribute('contenteditable') === 'true') return;
        textEl.setAttribute('contenteditable', 'true');
        textEl.focus();
        try{
          const range = document.createRange();
          range.selectNodeContents(textEl);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }catch(e){}
      });
      function commitEdit(){
        textEl.setAttribute('contenteditable', 'false');
        const val = textEl.textContent.trim();
        if(val){ t.text = val; }
        saveTodos();
        renderTodos();
      }
      textEl.addEventListener('blur', commitEdit);
      textEl.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); textEl.blur(); }
      });

      row.querySelectorAll('[data-move]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          // §고객 진행단계 연동 라운드: 완료된 항목이 배열 중간에 섞여 있을 수 있으므로,
          // "미완료 항목끼리의 순서"만 기준으로 이웃을 찾아 바꾼다(완료 항목 위치는 그대로).
          const dir = btn.getAttribute('data-move');
          const activeIds = todos.filter(x=> !x.done).map(x=> x.id);
          const pos = activeIds.indexOf(id);
          let swapWithId = null;
          if(dir === 'up' && pos > 0) swapWithId = activeIds[pos - 1];
          else if(dir === 'down' && pos < activeIds.length - 1) swapWithId = activeIds[pos + 1];
          if(!swapWithId) return;
          const i = todos.findIndex(x=> x.id === id);
          const j = todos.findIndex(x=> x.id === swapWithId);
          const tmp = todos[i]; todos[i] = todos[j]; todos[j] = tmp;
          saveTodos();
          renderTodos();
        });
      });

      row.querySelector('[data-del]').addEventListener('click', ()=>{
        todos = todos.filter(x=> x.id !== id);
        saveTodos();
        renderTodos();
      });
    });
  }

  function openAddRow(){
    addRow.style.display = 'flex';
    addInput.value = '';
    addInput.focus();
  }
  function closeAddRow(){
    addRow.style.display = 'none';
  }
  addToggleBtn.addEventListener('click', ()=>{
    if(addRow.style.display === 'flex'){ closeAddRow(); } else { openAddRow(); }
  });
  function commitAdd(){
    const val = addInput.value.trim();
    if(!val) return;
    todos.push({ id: genTodoId(), text: val });
    saveTodos();
    addInput.value = '';
    renderTodos();
    addInput.focus();
  }
  addSaveBtn.addEventListener('click', commitAdd);
  addInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); commitAdd(); }
  });

  function openPanel(){
    panelEl.classList.add('open');
    overlayEl.classList.add('open');
    iconBtn.classList.add('active');
  }
  function closePanel(){
    panelEl.classList.remove('open');
    overlayEl.classList.remove('open');
    iconBtn.classList.remove('active');
    closeAddRow();
    dismissToast();
  }
  iconBtn.addEventListener('click', ()=>{
    if(panelEl.classList.contains('open')){ closePanel(); } else { openPanel(); }
  });
  panelCloseBtn.addEventListener('click', closePanel);
  overlayEl.addEventListener('click', closePanel);
  doneToggleBtn.addEventListener('click', ()=>{ showDone = !showDone; renderTodos(); });

  // §고객 진행단계 연동 라운드: 고객관리카드(crm/index.html, 다른 탭/페이지)가 진행단계에
  // 따라 이 사용자의 todos 키에 직접 쓰거나 완료 처리를 할 수 있다 — 같은 origin의 다른
  // 탭에서 localStorage가 바뀌면 네이티브 storage 이벤트가 이 탭에도 온다(이 탭 자신이 쓴
  // 변경에는 발생하지 않음). 새 저장 경로를 만들지 않고 기존 loadTodos/renderTodos만 다시
  // 호출한다.
  window.addEventListener('storage', function(e){
    if(e.key !== TODO_KEY) return;
    todos = loadTodos();
    renderTodos();
  });

  // [버그 수정] 클라우드에서 이 데이터가 갱신되면(다른 기기 동기화) 인메모리 todos를
  // localStorage와 다시 맞춘다. 이게 없으면 이 탭이 들고 있던 오래된 인메모리 배열이
  // 다음 로컬 편집(추가/삭제 등) 때 그대로 저장되면서 방금 클라우드에서 받은 최신 상태를
  // (그 안의 삭제 내용까지) 덮어써버릴 수 있다 — 다른 키(companies 등)는 이미 이렇게
  // 처리하고 있었는데 todos에만 빠져 있었다.
  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail.key !== 'todos') return;
    todos = loadTodos();
    renderTodos();
  });

  // [버그 수정 — 체크 완료 후 새로고침하면 되살아남] 한솔1에서 이전(import)된 할 일을 체크
  // 완료(=목록에서 완전 제거, 위 saveTodos/checkbox 핸들러는 정상 동작함)하면 todos 배열에서
  // 그 항목이 사라진다. 그런데 이 마이그레이션은 매 새로고침(shin2-app-unlocked)마다 다시
  // 실행되고, 예전 dedup 로직은 "지금 todos 배열에 그 sourceId가 남아 있는지"만 봤다 —
  // 한솔1 원본(work-guide-state-v1)은 읽기 전용이라 절대 바뀌지 않으므로, 완료 처리로
  // todos 배열에서 사라진 순간부터는 dedup이 더 이상 그 항목을 "이미 이전됨"으로 인식하지
  // 못해 매번 새로 다시 추가해버렸다(체크 완료 → 화면에서 사라짐 → 새로고침 → 마이그레이션
  // 재실행 → 되살아남). 체크박스/삭제 핸들러 자체나 localRev 가드는 문제가 아니었다(둘 다
  // saveTodos()를 통해 동일하게 localStorage/클라우드에 정상 반영됨, 9a38fa1에서 이미 검증).
  // 수정: 실제로 이전된 sourceId를 배열과 별도로 영구 기록해두고(완료로 배열에서 빠져도
  // 이 기록은 지우지 않음), dedup을 이 기록 기준으로 판단한다.
  const IMPORTED_H1_IDS_KEY = 'shin2-todos-h1-imported-ids';
  function loadImportedH1Ids(){
    try{
      const raw = localStorage.getItem(IMPORTED_H1_IDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    }catch(e){ return new Set(); }
  }
  function saveImportedH1Ids(set){
    try{ localStorage.setItem(IMPORTED_H1_IDS_KEY, JSON.stringify(Array.from(set))); }catch(e){}
  }

  // 한솔1 이전(migration) 전용 API: sourceSystem/sourceId 기준으로 중복을 건너뛴다.
  window.SHIN2_TODOS = {
    addFromHansol1: function(records){
      let added = 0, skipped = 0;
      const importedIds = loadImportedH1Ids();
      let idsChanged = false;
      (records||[]).forEach(r=>{
        if(importedIds.has(r.sourceId)){ skipped++; return; } // 예전에 이미 이전됐던 항목(완료로 지워졌어도)은 다시 넣지 않는다
        if(todos.some(t=> t.sourceSystem === 'hansol1' && t.sourceId === r.sourceId)){
          skipped++; importedIds.add(r.sourceId); idsChanged = true; return;
        }
        if(r.done) { skipped++; importedIds.add(r.sourceId); idsChanged = true; return; } // 완료=제거 모델이므로 이미 완료된 항목은 이전하지 않는다
        todos.push({ id: genTodoId(), text: r.text, sourceSystem: 'hansol1', sourceId: r.sourceId });
        importedIds.add(r.sourceId); idsChanged = true;
        added++;
      });
      if(idsChanged) saveImportedH1Ids(importedIds);
      if(added){ saveTodos(); renderTodos(); }
      return { added, skipped };
    }
  };

  renderTodos();
})();
</script>

<script>
(function(){
  // ================================================================================================
  // 한솔1 → 한솔2 안전 재이전(migration) 모듈
  // ------------------------------------------------------------------------------------------------
  // 목적: 한솔1(work-guide-state-v1, /index.html)에 실제로 쌓여 있는 사용자 데이터를 한솔2로 "복사"한다
  // (MOVE 아님 — 한솔1 원본은 이 파일에서 절대 읽기 전용 외의 방식으로 건드리지 않는다. write/removeItem을
  // work-guide-state-v1 키에 대해 단 한 번도 호출하지 않는다).
  //
  // 원칙:
  //  - 원문 불변: guide.blocks[].body / phrases[].body / step.label / step.phoneNote / material.location 등
  //    사용자가 작성한 문자열은 그대로 originalText/content 필드에 복사한다. 맞춤법 교정, 요약, 순서 변경 없음.
  //  - 병합 identity: 모든 이전 레코드는 sourceSystem:'hansol1' + sourceId:<한솔1 원본 id 기반 문자열>을 갖는다.
  //    이미 같은 sourceSystem/sourceId 레코드가 있으면 다시 만들지 않는다(재실행해도 중복 없음 = idempotent).
  //  - 한솔2 네이티브 데이터(사용자가 한솔2에서 직접 만든 지식/할일/연락처/계정)는 절대 건드리지 않는다 —
  //    이 모듈은 항상 "추가"만 하고 기존 배열을 덮어쓰지 않는다(state 전체 overwrite 금지).
  //  - 계정 비밀번호는 절대 평문으로 어디에도 남기지 않는다 — 반드시 기존 AES-GCM 계정함(SHIN2_ACCOUNTS.migrateAdd)을
  //    통해서만 저장하고, 콘솔에 로그하지 않는다.
  const H1_STORAGE_KEY = 'work-guide-state-v1';
  const STATUS_KEY = 'shin2-migration-hansol1-status';
  const GUIDES_STAGING_KEY = 'shin2-hansol1-guides-staging';
  const SITES_STAGING_KEY = 'shin2-hansol1-sites-staging';
  const LINKS_STAGING_KEY = 'shin2-hansol1-links-staging';
  const MISC_STAGING_KEY = 'shin2-hansol1-misc-staging';
  const COMPANIES_STAGING_KEY = 'shin2-companies-staging';

  function readJson(key, fallback){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function writeJson(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
  function deepCopy(v){ return JSON.parse(JSON.stringify(v)); }

  // 결정론적(비-AI) 최소 키워드 분류. 확신 없으면 반드시 unclassified.
  function classifyText(text){
    const t = String(text || '');
    if(/공법|특허|시방서|자재|PT|MOU/.test(t)) return 'method';
    if(/전화|문의|안내|응대|통화|연락/.test(t)) return 'response';
    if(/업무|처리|점검|절차|순서|송부|등록|발주/.test(t)) return 'task';
    return 'unclassified';
  }

  // 배열 형태 대기 저장소에 원본을 그대로(딥카피) 추가한다. sourceId 기준 중복은 건너뛴다.
  function stageArray(storageKey, sourceSystem, rawRecords, idFn){
    const existing = readJson(storageKey, []);
    const arr = Array.isArray(existing) ? existing : [];
    const have = new Set(arr.map(x => x.sourceSystem + ':' + x.sourceId));
    let added = 0, skipped = 0;
    (rawRecords || []).forEach(rec=>{
      const sourceId = idFn(rec);
      const key = sourceSystem + ':' + sourceId;
      if(have.has(key)){ skipped++; return; }
      const copy = deepCopy(rec);
      copy.sourceSystem = sourceSystem;
      copy.sourceId = sourceId;
      arr.push(copy);
      have.add(key);
      added++;
    });
    writeJson(storageKey, arr);
    return { added, skipped };
  }

  function loadHansol1State(){
    const raw = readJson(H1_STORAGE_KEY, null);
    return raw && typeof raw === 'object' ? raw : null;
  }

  // Phase 1: 계정(비밀번호)이 필요 없는 모든 항목 — 페이지 로드 즉시(게이트 잠금 여부와 무관) 실행 가능.
  function runPhase1(h1){
    const counts = { guidesStaged:0, phraseItems:0, materialItems:0, guideBlockItems:0, guideStepItems:0,
      linksStaged:0, sitesStaged:0, jurisdictionContacts:0, companiesStaged:0, todosAdded:0, miscStaged:0 };

    // --- 업무가이드(guides): 구조 보존(steps/blocks 순서 그대로) + 블록/단계별 원문 지식 항목 생성 ---
    if(Array.isArray(h1.guides) && h1.guides.length){
      const rawGuides = h1.guides.map(g=>{
        const copy = deepCopy(g);
        // §5: 원본 순서를 sourceSteps에 그대로 보존. derivedSteps는 한솔2용 파생 구조(현재는 원본과 동일 —
        // 새 UI가 생기기 전까지는 파생할 내용이 없으므로 항등 복사) — 원본(steps)은 그대로 둔다.
        copy.sourceSteps = deepCopy(g.steps || []);
