      row('최근 전화자', group.recentContact ? escapeHtml(group.recentContact) : '') +
      '<div class="shin2-memo-block">' +
        '<div class="shin2-memo-head"><div class="shin2-memo-title">전화기록' + (group.records.length ? ' ' + group.records.length : '') + '</div></div>' +
        (group.records.length ? '<div class="shin2-memo-list">' + listHtml + '</div>' : '<div class="shin2-memo-empty">등록된 전화 기록이 없습니다</div>') +
      '</div>';
    popupBody.querySelectorAll('[data-call-id]').forEach(function(el){
      el.addEventListener('click', function(){
        pState.mode = 'detail';
        pState.selectedId = el.getAttribute('data-call-id');
        pState.detailBack = { mode:'apartment', key: group.key };
        renderPopup();
      });
    });
  }

  // §9: 구분 필터는 전체/시공사/아파트 그대로 두고(과하게 복잡한 필터 금지), status 필터
  // (전체/미확인/확인완료/처리완료, §12)를 별도 탭 줄로 추가한다 — 둘 다 status와 무관하게
  // 전체 레코드를 대상으로 하며(§9/§10), status 필터는 순수 조회 레이어 필터일 뿐 어떤
  // 레코드도 숨기거나 지우지 않는다(전체 탭을 고르면 항상 모든 기록이 다시 보인다).
  var STATUS_TABS = [['all','전체'],['new','미확인'],['confirmed','확인완료'],['handled','처리완료']];
  function renderBrowse(){
    // §6(신규): 카테고리함 필터 탭은 홈 입력창의 분류 버튼(CALL_TYPE_CHOICES: 아파트/시공사/기타)과
    // 동일한 3종을 그대로 노출한다 — 기존에는 "기타"가 빠져 있었다.
    var tabs = [['all','전체']].concat(CALL_TYPE_CHOICES.map(function(t){ return [t, t]; }));
    var all = loadAll();
    var byTab = all.filter(function(r){
      if(pState.tab === 'all') return true;
      return r.callerType === pState.tab;
    });
    var byStatus = byTab.filter(function(r){
      if(pState.statusTab === 'all') return true;
      return (r.status||'new') === pState.statusTab;
    });
    var ql = (pState.search||'').trim().toLowerCase();
    var items = byStatus.filter(function(r){
      if(!ql) return true;
      // §6(신규): originalText는 검색을 위해서도 절대 가공/정제하지 않고 그대로 매칭에만
      // 사용한다(표시용 값도 동일 — 원문 불변). callerType(카테고리)과 연결된 업체명(있으면)도
      // 검색 대상에 포함한다.
      var linkedCompany = findCompanyById(r.companyId);
      var hay = [r.originalText, r.callerType, r.companyCandidateName, (linkedCompany?linkedCompany.name:''), r.apartmentName, r.contactName, r.siteName, r.inquiryType, r.workType, r.requestText, r.followUp, r.phone].join(' ').toLowerCase();
      return hay.indexOf(ql) !== -1;
    }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });

    var html = '<div class="task-tabs">' + tabs.map(function(t){
      return '<button type="button" class="task-tab' + (pState.tab===t[0]?' active':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="task-tabs" style="margin-top:-4px;">' + STATUS_TABS.map(function(t){
      return '<button type="button" class="task-tab' + (pState.statusTab===t[0]?' active':'') + '" data-status-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="search-box acct-search-box"><input type="text" id="callSearchInput" placeholder="업체명 / 아파트명 / 전화자 / 전화내용 검색" value="' + escapeAttr(pState.search) + '" /></div>' +
    '<div class="home-task-row-sub" style="padding:6px 2px 10px;">확인·처리완료된 기록은 삭제되지 않습니다 — 여기서 언제든 다시 볼 수 있어요.</div>';
    if(!items.length){
      html += '<div class="acct-empty">해당하는 전화 기록이 없습니다.</div>';
    } else {
      // §6(신규): 날짜별로 묶어서 보여준다(그룹 내부는 그대로 최신순).
      var lastDateKey = null;
      html += items.map(function(r){
        var company = findCompanyById(r.companyId);
        var titleBits = [];
        var nameLabel = r.callerType === '아파트' ? r.apartmentName : (company ? company.name : r.companyCandidateName);
        if(nameLabel) titleBits.push(nameLabel);
        if(r.siteName) titleBits.push(r.siteName);
        var title = titleBits.length ? titleBits.join(' · ') : (r.originalText||'').slice(0, 30);
        var dateKey = localDateStr(r.createdAt);
        var groupHeaderHtml = '';
        if(dateKey !== lastDateKey){
          lastDateKey = dateKey;
          groupHeaderHtml = '<div class="task-pop-date-head">' + escapeHtml(dateKey === todayStr() ? '오늘' : dateKey) + '</div>';
        }
        return groupHeaderHtml + '<div class="task-pop-row" data-id="' + r.id + '">' +
          '<span class="task-badge ' + callerBadgeClass(r.callerType) + '">' + escapeHtml('[' + r.callerType + ']') + '</span>' +
          '<span class="task-badge ' + statusBadgeClass(r.status||'new') + '" style="margin-left:4px;">' + escapeHtml(statusLabel(r.status||'new')) + '</span>' +
          '<span class="task-pop-row-title">' + escapeHtml(title) + '</span>' +
          '<span class="task-pop-row-meta">' + escapeHtml(fmtShort(r.createdAt)) + '</span>' +
        '</div>';
      }).join('');
    }
    popupBody.innerHTML = html;
    popupBody.querySelectorAll('[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){ pState.tab = btn.dataset.tab; renderBrowse(); });
    });
    popupBody.querySelectorAll('[data-status-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){ pState.statusTab = btn.dataset.statusTab; renderBrowse(); });
    });
    var searchInput = document.getElementById('callSearchInput');
    searchInput.addEventListener('input', function(){ pState.search = searchInput.value; renderBrowse(); });
    popupBody.querySelectorAll('.task-pop-row').forEach(function(row){
      row.addEventListener('click', function(){ openPopup('detail', row.dataset.id); });
    });
  }

  // §18: 접수시각 + 구분 + (시공사명 or 아파트명) + 전화자/직책/전화번호 + 관련현장(시공사)
  // or 주소(아파트) + 문의유형 + 내용(불릿) + 구분선 + 원문 + 구분선 + 메모.
  function renderDetail(){
    var rec = getById(pState.selectedId);
    if(!rec){ pState.mode = 'browse'; renderPopup(); return; }
    var company = findCompanyById(rec.companyId);
    var row = function(label, valueHtml){ return valueHtml ? '<div class="task-form-field"><label>' + label + '</label><div style="font-size:13.5px;color:var(--text);">' + valueHtml + '</div></div>' : ''; };
    var isApt = rec.callerType === '아파트';
    var isCo = rec.callerType === '시공사';
    var statusVal = rec.status || 'new';

    var nameRowHtml = '';
    if(isApt){
      nameRowHtml = row('아파트', rec.apartmentName ? escapeHtml(rec.apartmentName) : '');
    } else if(isCo){
      if(company){
        nameRowHtml = row('시공사', escapeHtml(company.name) + ' <button type="button" class="task-company-link" id="callOpenCompanyBtn">업체 보기</button>');
      } else if(rec.companyCandidateName){
        nameRowHtml = row('시공사(미확정)', escapeHtml(rec.companyCandidateName));
      }
    }
    var phoneRowHtml = rec.phone ? row('전화번호', escapeHtml(rec.phone) + ' <button type="button" class="task-company-link" id="callCopyPhoneBtn">복사</button>') : '';

    var linkSectionHtml = '';
    if(isCo && rec.companyLinkStatus === 'ambiguous'){
      var opts = (rec.companyCandidateIds||[]).map(function(cid){
        var c = findCompanyById(cid);
        return c ? '<label class="co-conflict-opt"><input type="radio" name="callCoChoice" value="' + escapeAttr(cid) + '"/> ' + escapeHtml(c.name) + '</label>' : '';
      }).join('');
      linkSectionHtml = '<div class="co-conflict">' +
        '<div class="co-conflict-label">업체 연결 필요</div>' + opts +
        '<label class="co-conflict-opt"><input type="radio" name="callCoChoice" value="__none__"/> 연결하지 않음</label>' +
        '<div style="margin-top:6px;"><button type="button" class="co-text-action" id="callCoChoiceConfirm">선택 확인</button></div>' +
      '</div>';
    } else if(isCo && rec.companyLinkStatus === 'new_candidate'){
      linkSectionHtml = '<div class="co-dup-box">' +
        '<div><strong>신규 시공사</strong></div>' +
        '<div>' + escapeHtml(rec.companyCandidateName) + '</div>' +
        (rec.contactName ? '<div>전화자: ' + escapeHtml(rec.contactName) + '</div>' : '') +
        (rec.phone ? '<div>전화번호: ' + escapeHtml(rec.phone) + '</div>' : '') +
        '<div class="co-dup-actions">' +
          '<button type="button" class="co-text-action" id="callRegisterCoBtn">업체정보 등록</button>' +
          '<button type="button" class="co-text-action" id="callDismissCoBtn">연결 안 함</button>' +
        '</div>' +
      '</div>';
    }

    var suggestionsHtml = isCo ? (rec.fieldSuggestions||[]).filter(function(s){ return s.status === 'pending'; }).map(function(s){
      var body = s.kind === 'conflict'
        ? ('기존정보: ' + escapeHtml(s.oldValue) + ' / 새 정보 후보: ' + escapeHtml(s.value))
        : (s.label + ': ' + escapeHtml(s.value));
      return '<div class="co-dup-box">' +
        '<div>새 정보가 확인되었습니다</div>' +
        '<div>' + body + '</div>' +
        '<div class="co-dup-actions">' +
          '<button type="button" class="co-text-action" data-suggest-apply="' + s.field + '">반영</button>' +
          '<button type="button" class="co-text-action" data-suggest-dismiss="' + s.field + '">무시</button>' +
        '</div>' +
      '</div>';
    }).join('') : '';

    // 내용(§18): 요청내용/공종/후속업무를 불릿으로 요약 — 원문에서 이미 뽑아낸 필드만 사용,
    // 새 사실을 여기서 추가하지 않는다.
    var bulletLines = [];
    if(rec.workType) bulletLines.push('공종: ' + rec.workType);
    if(rec.requestText) bulletLines.push('요청: ' + rec.requestText);
    if(rec.followUp) bulletLines.push('후속: ' + rec.followUp);
    var bulletsHtml = bulletLines.length
      ? '<div class="task-form-field"><label>내용</label><div class="kb-plain-content">' +
        bulletLines.map(function(l){ return '<div>· ' + escapeHtml(l) + '</div>'; }).join('') + '</div></div>'
      : '';

    popupBody.innerHTML =
      '<div class="task-detail-title">' + escapeHtml('[' + rec.callerType + '] ') + escapeHtml(isApt ? (rec.apartmentName || '전화 온 내용') : (rec.siteName || rec.companyCandidateName || (company?company.name:'') || '전화 온 내용')) + '</div>' +
      row('구분', '<span class="task-badge ' + callerBadgeClass(rec.callerType) + '">' + escapeHtml(rec.callerType) + '</span>') +
      row('상태', '<span class="task-badge ' + statusBadgeClass(statusVal) + '">' + escapeHtml(statusLabel(statusVal)) + '</span>') +
      nameRowHtml +
      row('전화자', rec.contactName ? escapeHtml(rec.contactName) + (rec.position ? ' ' + escapeHtml(rec.position) : '') : '') +
      phoneRowHtml +
      (isCo ? row('관련현장', rec.siteName ? escapeHtml(rec.siteName) : '') : row('주소', rec.address ? escapeHtml(rec.address) : '')) +
      row('문의유형', rec.inquiryType ? escapeHtml(rec.inquiryType) : '') +
      bulletsHtml +
      row('접수시각', escapeHtml(fmtFull(rec.createdAt))) +
      (rec.aiFailed ? '<div class="ai-error" style="margin-bottom:10px;">AI 자동분석에 실패했습니다. 원문은 저장되어 있습니다 — 필요하면 수정에서 직접 입력해주세요.</div>' : '') +
      linkSectionHtml + suggestionsHtml +
      '<div class="task-detail-actions" id="callDetailActions">' +
        '<button type="button" class="acct-text-action" id="callEditBtn">수정</button>' +
        // §6/§15 하드룰: 아래 두 버튼은 오직 status만 바꾼다 — remove()를 절대 호출하지
        // 않으므로 클릭해도 레코드는 검색/전체보기/히스토리에 계속 남는다.
        (statusVal === 'new' ? '<button type="button" class="acct-text-action" id="callConfirmBtn">확인</button>' : '') +
        (statusVal !== 'handled' ? '<button type="button" class="acct-text-action" id="callHandledBtn">처리완료</button>' : '') +
        // §신규 라운드: 전화가 왔다고 자동으로 고객업무를 만들지 않는다(명시적 하드룰) —
        // 이 버튼을 사용자가 직접 눌렀을 때만 shin2-tasks-v1에 새 레코드 1건을 만든다.
        // 이 전화기록(rec) 자체는 절대 바뀌지 않는다(그대로 로그로 남는다).
        '<button type="button" class="acct-text-action" id="callAddTaskBtn">고객업무로 추가</button>' +
        '<button type="button" class="acct-text-action danger" id="callDeleteBtn">삭제</button>' +
      '</div>' +
      '<div class="shin2-memo-block" style="border-top:none;padding-top:0;">' +
        '<div class="shin2-memo-title" style="margin-bottom:6px;">원문</div>' +
        '<div class="kb-plain-content" style="white-space:pre-wrap;">' + escapeHtml(rec.originalText) + '</div>' +
      '</div>' +
      '<div id="callMemoFollowupSlot"></div>';

    var openCoBtn = document.getElementById('callOpenCompanyBtn');
    if(openCoBtn){
      openCoBtn.addEventListener('click', function(){
        closePopup();
        if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
        if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(rec.companyId);
      });
    }
    var copyBtn = document.getElementById('callCopyPhoneBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', function(){
        if(navigator.clipboard) navigator.clipboard.writeText(rec.phone).catch(function(){});
      });
    }
    document.getElementById('callEditBtn').addEventListener('click', function(){ pState.mode = 'edit'; renderPopup(); });

    // §6/§15: 상태만 바꾼다 — 레코드를 지우거나 목록에서 완전히 숨기지 않는다(홈 "최근"
    // 노출에만 영향). renderHomeBlock()도 함께 갱신해 홈 목록 반영을 즉시 확인할 수 있게 한다.
    var confirmBtn = document.getElementById('callConfirmBtn');
    if(confirmBtn) confirmBtn.addEventListener('click', function(){
      setStatus(rec.id, 'confirmed');
      renderHomeBlock();
      renderDetail();
    });
    var handledBtn = document.getElementById('callHandledBtn');
    if(handledBtn) handledBtn.addEventListener('click', function(){
      setStatus(rec.id, 'handled');
      renderHomeBlock();
      renderDetail();
    });

    // §신규 라운드: "[고객업무로 추가]" — 이 전화기록을 근거로 shin2-tasks-v1에 새
    // 레코드 1건을 companyId와 함께 만든다. 새 저장소를 만들지 않고 기존 SHIN2_TASKS.add()를
    // 그대로 호출한다(§ CRM 고객카드 "다음 액션"이 읽는 바로 그 저장소). 원본 전화기록(rec)의
    // 어떤 필드도 이 함수에서 바꾸지 않는다 — 별도 레코드를 하나 더 만들 뿐이다.
    function callSummaryTitle(){
      var t = (rec.requestText && rec.requestText.trim()) || (rec.followUp && rec.followUp.trim()) ||
        (rec.originalText || '').trim();
      return t.length > 50 ? (t.slice(0, 50) + '…') : (t || '전화기록에서 추가된 업무');
    }
    function createCustomerTask(companyId){
      if(!window.SHIN2_TASKS) return null;
      var task = window.SHIN2_TASKS.add({
        title: callSummaryTitle(), companyId: companyId, content: rec.originalText || '', status: 'confirm'
      });
      if(window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
      return task;
    }
    var addTaskBtn = document.getElementById('callAddTaskBtn');
    if(addTaskBtn) addTaskBtn.addEventListener('click', function(){
      var actionsRow = document.getElementById('callDetailActions');
      if(isCo && company){
        // 이미 시공사와 연결되어 있으면 바로 만든다 — 업체를 다시 고르게 하지 않는다.
        createCustomerTask(company.id);
        actionsRow.insertAdjacentHTML('beforeend',
          '<div class="co-confirm-row"><span>"' + escapeHtml(company.name) + '"의 고객 업무로 추가되었습니다.</span></div>');
        return;
      }
      // 아파트/기타/미확정 시공사처럼 연결된 업체가 없으면, 업무 추가 폼과 같은 "업체 선택"
      // 셀렉트(getCompanies())를 재사용해 먼저 업체를 고르게 한다 — 새 연결 UI를 만들지 않는다.
      var companies = getCompanies();
      var optsHtml = '<option value="">업체를 선택하세요</option>' + companies.map(function(c){
        return '<option value="' + escapeAttr(c.id) + '">' + escapeHtml(c.name) + '</option>';
      }).join('');
      actionsRow.innerHTML = '<div class="co-confirm-row" style="flex-wrap:wrap;">' +
        '<span>고객 업무로 추가할 업체를 선택하세요</span>' +
        '<select id="callTaskCoSelect">' + optsHtml + '</select>' +
        '<button type="button" class="acct-text-action" id="callTaskCoCancel">취소</button>' +
        '<button type="button" class="acct-text-action" id="callTaskCoConfirm">추가</button>' +
      '</div>';
      document.getElementById('callTaskCoCancel').addEventListener('click', renderDetail);
      document.getElementById('callTaskCoConfirm').addEventListener('click', function(){
        var sel = document.getElementById('callTaskCoSelect');
        if(!sel || !sel.value) return;
        var chosen = findCompanyById(sel.value);
        createCustomerTask(sel.value);
        actionsRow.innerHTML = '<div class="co-confirm-row"><span>"' + escapeHtml(chosen ? chosen.name : '') +
          '"의 고객 업무로 추가되었습니다.</span></div>';
      });
    });

    // §20: 삭제 전 인라인 확인(alert/confirm 금지) — 기존 업무/업체 삭제와 동일한 패턴 재사용.
    document.getElementById('callDeleteBtn').addEventListener('click', function(){
      var actionsRow = document.getElementById('callDetailActions');
      actionsRow.innerHTML = '<div class="co-confirm-row"><span>이 전화 기록을 삭제하시겠습니까?</span>' +
        '<button type="button" class="acct-text-action" id="callDeleteCancel">취소</button>' +
        '<button type="button" class="acct-text-action danger" id="callDeleteConfirm">삭제</button></div>';
      document.getElementById('callDeleteCancel').addEventListener('click', renderDetail);
      document.getElementById('callDeleteConfirm').addEventListener('click', function(){
        remove(rec.id); // 연결된 업체 정보는 그대로 남는다(§20) — 이 함수는 companies를 건드리지 않는다.
        pState.mode = 'browse';
        renderPopup();
        renderHomeBlock();
      });
    });

    var choiceConfirmBtn = document.getElementById('callCoChoiceConfirm');
    if(choiceConfirmBtn){
      choiceConfirmBtn.addEventListener('click', function(){
        var checked = popupBody.querySelector('input[name="callCoChoice"]:checked');
        if(!checked) return;
        resolveAmbiguous(rec.id, checked.value);
        renderHomeBlock();
        renderDetail();
      });
    }
    var registerBtn = document.getElementById('callRegisterCoBtn');
    if(registerBtn) registerBtn.addEventListener('click', function(){
      closePopup();
      registerNewCompany(rec.id);
    });
    var dismissCoBtn = document.getElementById('callDismissCoBtn');
    if(dismissCoBtn) dismissCoBtn.addEventListener('click', function(){ dismissNewCompany(rec.id); renderHomeBlock(); renderDetail(); });

    popupBody.querySelectorAll('[data-suggest-apply]').forEach(function(btn){
      btn.addEventListener('click', function(){ applySuggestion(rec.id, btn.getAttribute('data-suggest-apply')); renderDetail(); });
    });
    popupBody.querySelectorAll('[data-suggest-dismiss]').forEach(function(btn){
      btn.addEventListener('click', function(){ dismissSuggestion(rec.id, btn.getAttribute('data-suggest-dismiss')); renderDetail(); });
    });

    if(window.SHIN2_MEMO){
      // "원문"(불변)과 "메모"(후속 자유메모 누적, §18)를 개념적으로 분리해서 보여준다 —
      // 원문은 위 kb-plain-content 읽기전용 블록, 메모는 기존 공통 메모 컴포넌트를 그대로 재사용.
      window.SHIN2_MEMO.mount(document.getElementById('callMemoFollowupSlot'), 'call', rec.id, { title:'메모' });
    }
  }

  // §19: 구분(시공사/아파트/기타/확인 필요) 자체도 사용자가 직접 재분류 가능해야 한다 — select를
  // 바꾸면 그 즉시 해당 구분에 맞는 필드 묶음으로 폼을 다시 그린다. originalText는 폼에 없다
  // (수정 대상에서 제외, §19).
  function renderEdit(){
    var rec = getById(pState.selectedId);
    if(!rec){ pState.mode = 'browse'; renderPopup(); return; }
    var draft = pState.editDraft && pState.editDraft.id === rec.id ? pState.editDraft : Object.assign({ id: rec.id }, rec);
    pState.editDraft = draft;
    var companies = getCompanies();
    var typeOptionsHtml = CALLER_TYPES.map(function(t){
      return '<option value="' + escapeAttr(t) + '"' + (draft.callerType===t?' selected':'') + '>' + escapeHtml(t) + '</option>';
    }).join('');

    var typeSpecificHtml = '';
    if(draft.callerType === '시공사'){
      var companyOptionsHtml = '<option value="">(연결 안 함)</option>' + companies.map(function(c){
        return '<option value="' + escapeAttr(c.id) + '"' + (draft.companyId===c.id?' selected':'') + '>' + escapeHtml(c.name) + '</option>';
      }).join('');
      typeSpecificHtml =
        '<div class="task-form-field"><label>업체 연결</label><select id="callFCompany">' + companyOptionsHtml + '</select></div>' +
        '<div class="task-form-field"><label>시공사명(미확정)</label><input type="text" id="callFCoName" value="' + escapeAttr(draft.companyCandidateName) + '"/></div>' +
        '<div class="task-form-field"><label>관련현장</label><input type="text" id="callFSite" value="' + escapeAttr(draft.siteName) + '"/></div>';
    } else if(draft.callerType === '아파트'){
      typeSpecificHtml =
        '<div class="task-form-field"><label>아파트명</label><input type="text" id="callFApt" value="' + escapeAttr(draft.apartmentName) + '"/></div>' +
        '<div class="task-form-field"><label>주소</label><input type="text" id="callFAddr" value="' + escapeAttr(draft.address) + '"/></div>';
    }

    popupBody.innerHTML =
      '<div class="task-detail-title">전화 내용 수정</div>' +
      '<div class="task-form-field"><label>구분</label><select id="callFType">' + typeOptionsHtml + '</select></div>' +
      '<div id="callFTypeFields">' + typeSpecificHtml + '</div>' +
      '<div class="task-form-row">' +
        '<div class="task-form-field"><label>전화자</label><input type="text" id="callFContact" value="' + escapeAttr(draft.contactName) + '"/></div>' +
        '<div class="task-form-field"><label>직책</label><input type="text" id="callFPosition" value="' + escapeAttr(draft.position) + '"/></div>' +
      '</div>' +
      '<div class="task-form-field"><label>전화번호</label><input type="text" id="callFPhone" value="' + escapeAttr(draft.phone) + '"/></div>' +
      '<div class="task-form-row">' +
        '<div class="task-form-field"><label>문의유형</label><input type="text" id="callFInquiry" value="' + escapeAttr(draft.inquiryType) + '"/></div>' +
        '<div class="task-form-field"><label>공종</label><input type="text" id="callFWork" value="' + escapeAttr(draft.workType) + '"/></div>' +
      '</div>' +
      '<div class="task-form-field"><label>요청내용</label><textarea id="callFRequest">' + escapeHtml(draft.requestText) + '</textarea></div>' +
      '<div class="task-form-field"><label>후속업무</label><textarea id="callFFollow">' + escapeHtml(draft.followUp) + '</textarea></div>' +
      '<div class="acct-form-actions">' +
        '<button type="button" class="acct-text-action" id="callFormCancel">취소</button>' +
        '<button type="button" class="ai-run-btn" id="callFormSave">저장</button>' +
      '</div>';

    // 현재 입력값을 draft에 흡수한 뒤(재분류로 다시 그려도 유실되지 않게) 다시 그린다.
    function syncDraftFromForm(){
      var contactEl = document.getElementById('callFContact');
      if(contactEl) draft.contactName = contactEl.value;
      var posEl = document.getElementById('callFPosition');
      if(posEl) draft.position = posEl.value;
      var phoneEl = document.getElementById('callFPhone');
      if(phoneEl) draft.phone = phoneEl.value;
      var inqEl = document.getElementById('callFInquiry');
      if(inqEl) draft.inquiryType = inqEl.value;
      var workEl = document.getElementById('callFWork');
      if(workEl) draft.workType = workEl.value;
      var reqEl = document.getElementById('callFRequest');
      if(reqEl) draft.requestText = reqEl.value;
      var followEl = document.getElementById('callFFollow');
      if(followEl) draft.followUp = followEl.value;
      var coSel = document.getElementById('callFCompany');
      if(coSel) draft.companyId = coSel.value;
      var coNameEl = document.getElementById('callFCoName');
      if(coNameEl) draft.companyCandidateName = coNameEl.value;
      var siteEl = document.getElementById('callFSite');
      if(siteEl) draft.siteName = siteEl.value;
      var aptEl = document.getElementById('callFApt');
      if(aptEl) draft.apartmentName = aptEl.value;
      var addrEl = document.getElementById('callFAddr');
      if(addrEl) draft.address = addrEl.value;
    }

    document.getElementById('callFType').addEventListener('change', function(e){
      syncDraftFromForm();
      draft.callerType = e.target.value;
      renderEdit();
    });
    document.getElementById('callFormCancel').addEventListener('click', function(){ pState.editDraft = null; pState.mode = 'detail'; renderPopup(); });
    document.getElementById('callFormSave').addEventListener('click', function(){
      syncDraftFromForm();
      var fields = {
        callerType: draft.callerType,
        contactName: (draft.contactName||'').trim(),
        position: (draft.position||'').trim(),
        phone: (draft.phone||'').trim(),
        inquiryType: (draft.inquiryType||'').trim(),
        workType: (draft.workType||'').trim(),
        requestText: (draft.requestText||'').trim(),
        followUp: (draft.followUp||'').trim()
      };
      if(draft.callerType === '시공사'){
        fields.companyId = (draft.companyId||'').trim();
        fields.companyLinkStatus = fields.companyId ? 'linked' : 'none';
        fields.companyCandidateIds = [];
        fields.companyCandidateName = (draft.companyCandidateName||'').trim();
        fields.siteName = (draft.siteName||'').trim();
        fields.apartmentName = '';
        fields.address = '';
      } else if(draft.callerType === '아파트'){
        // §16: 아파트는 업체 연결을 절대 갖지 않는다.
        fields.companyId = ''; fields.companyLinkStatus = 'none'; fields.companyCandidateIds = []; fields.companyCandidateName = '';
        fields.apartmentName = (draft.apartmentName||'').trim();
        fields.address = (draft.address||'').trim();
        fields.siteName = '';
      } else {
        fields.companyId = ''; fields.companyLinkStatus = 'none'; fields.companyCandidateIds = []; fields.companyCandidateName = '';
        fields.apartmentName = ''; fields.siteName = '';
      }
      updateFields(rec.id, fields);
      pState.editDraft = null;
      pState.mode = 'detail';
      renderPopup();
      renderHomeBlock();
    });
  }

  /* ---------- 업체 상세 "전화/업무 기록" 섹션 (§10/§12/§20) ----------
     최신순으로 요약만 보여주고(원문 전체 나열 금지), 클릭하면 같은 팝업 흐름 안에서
     상세로 전환한다. 업체 데이터 안에 원문/구조화 필드를 복사 저장하지 않고 companyId로
     조회만 한다(§22) — 여기 나타나는 레코드는 전부 callerType==='시공사'인 것들뿐이다
     (아파트는 companyId를 절대 갖지 않으므로 §16이 자동으로 지켜진다). */
  function mountCompanySection(container, companyId){
    if(!container) return;
    var items = getForCompany(companyId);
    var html = '<div class="shin2-memo-block">' +
      '<div class="shin2-memo-head"><div class="shin2-memo-title">전화/업무 기록' + (items.length ? ' ' + items.length : '') + '</div></div>';
    if(!items.length){
      html += '<div class="shin2-memo-empty">등록된 전화/업무 기록이 없습니다</div>';
    } else {
      html += '<div class="shin2-memo-list">' + items.map(function(r){
        var summary = r.requestText || (r.originalText||'').slice(0, 40);
        return '<div class="shin2-memo-item" data-call-id="' + escapeAttr(r.id) + '" style="cursor:pointer;">' +
          '<div class="shin2-memo-meta">' + escapeHtml(fmtShort(r.createdAt)) +
            (r.inquiryType ? ' <span class="task-badge ' + inquiryBadgeClass(r.inquiryType) + '">' + escapeHtml(r.inquiryType) + '</span>' : '') +
          '</div>' +
          '<div class="shin2-memo-text">' + escapeHtml((r.siteName ? r.siteName + ' — ' : '') + summary) + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    container.querySelectorAll('[data-call-id]').forEach(function(el){
      el.addEventListener('click', function(){ openPopup('detail', el.getAttribute('data-call-id')); });
    });
  }

  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail.key !== 'calls' && e.detail.key !== 'companies') return;
    renderHomeBlock();
    if(popupOverlay.classList.contains('open') && pState.mode !== 'edit') renderPopup();
  });

  window.SHIN2_CALLS = {
    add: add, getAll: getAll, getById: getById, getRecentForHome: getRecentForHome,
    getForCompany: getForCompany, getForApartment: getForApartment,
    getApartmentGroups: getApartmentGroups, getApartmentGroupByKey: getApartmentGroupByKey,
    normalizeApartmentName: normalizeApartmentName,
    openPopup: openPopup, openApartmentPopupByKey: openApartmentPopupByKey, mountCompanySection: mountCompanySection,
    updateFields: updateFields, setCallerType: setCallerType, setStatus: setStatus, remove: remove
  };

  renderHomeBlock();
})();
</script>

<script>
(function(){
  // SHIN(기존)과 동일한 localStorage 키를 그대로 재사용한다(같은 origin이므로 이미 공유됨).
  // 이 키 외에는 SHIN 2 코드가 어떤 기존 localStorage 키도 읽거나 쓰지 않는다.
  const OPENAI_KEY_STORAGE = 'work-guide-openai-key';

  function getApiKey(){
    return localStorage.getItem(OPENAI_KEY_STORAGE) || '';
  }
  function saveApiKey(key){
    localStorage.setItem(OPENAI_KEY_STORAGE, key);
  }

  function promptForApiKey(onSaved){
    const overlay = document.createElement('div');
    overlay.className = 'ai-modal-overlay';
    overlay.innerHTML = `
      <div class="ai-modal">
        <div class="ai-modal-title">OpenAI API 키 등록</div>
        <div class="ai-modal-desc">AI 문구정리를 사용하려면 최초 1회 API 키가 필요합니다.</div>
        <input type="text" id="aiKeyInput" placeholder="sk-..." />
        <div class="ai-modal-actions">
          <button type="button" class="ai-copy-btn" id="aiKeyCancel">취소</button>
          <button type="button" class="ai-run-btn" id="aiKeySave">저장</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#aiKeyInput');
    input.focus();
    function close(){ overlay.remove(); }
    overlay.querySelector('#aiKeyCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    overlay.querySelector('#aiKeySave').addEventListener('click', ()=>{
      const key = input.value.trim();
      if(!key) return;
      saveApiKey(key);
      close();
      onSaved(key);
    });
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ overlay.querySelector('#aiKeySave').click(); }
    });
  }

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // [서버 이전] 프롬프트 구성 규칙(AI_RULES/PROTECTED_FIELDS)과 모드별 buildPrompt() 로직은
  // functions/index.js의 aiRewrite 함수로 그대로 옮겼다(문구 1자도 다르지 않게 포팅 —
  // 커밋 로그 참고). "AI 문구정리"는 더 이상 이 파일에서 프롬프트를 만들지 않고, 아래
  // callAiRewriteServer()로 서버에 { mode, text }만 보낸다. parseMailResult/applyPourPrefix도
  // 같은 이유로 서버에서 수행하고, 서버가 이미 분리·정리된 { subject, body }를 돌려준다.
  //
  // "빠른 지식 추가"(qaBuildPrompt/qaDoAnalyze, 아래 window.SHIN2_AI.callOpenAI 소비처)는
  // 이번 라운드 범위 밖이라 손대지 않았다 — 여전히 localStorage의 'work-guide-openai-key'를
  // 직접 읽어 브라우저에서 OpenAI로 바로 호출한다. 즉 "브라우저에 키가 전혀 남지 않는다"는
  // AI 문구정리 경로에만 해당하며, 빠른 지식 추가는 아직 아니다(보고서에 명시).
  async function callOpenAI(apiKey, prompt){
    let res;
    try{
      res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model:'gpt-4o-mini',
          messages:[
            {role:'system', content:'너는 건설/시공 업무를 돕는 한국어 비서야. 항상 정중한 존댓말로, 요청받은 형식만 정확히 출력해.'},
            {role:'user', content: prompt}
          ],
          temperature:0.5
        })
      });
    } catch(networkErr){
      // fetch() 자체가 reject된 경우: 네트워크 단절 또는 CORS 정책에 의해 브라우저가
      // 요청/응답을 아예 막은 경우가 대부분이다(응답 status조차 받지 못함).
      const e = new Error('AI request network/CORS failure: ' + (networkErr && networkErr.message));
      e.kind = 'network';
      e.original = networkErr;
      throw e;
    }
    if(!res.ok){
      let detail = '', errType = '', errCode = '';
      try{
        const body = await res.json();
        detail = body.error?.message || '';
        errType = body.error?.type || '';
        errCode = body.error?.code || '';
      }catch(e){}
      const e = new Error(`AI request failed: ${res.status} ${detail}`);
      e.kind = 'http';
      e.status = res.status;
      e.detail = detail;
      e.errType = errType;
      e.errCode = errCode;
      throw e;
    }
    let data;
    try{
      data = await res.json();
    } catch(parseErr){
      const e = new Error('AI request invalid JSON response: ' + (parseErr && parseErr.message));
      e.kind = 'parse';
      throw e;
    }
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content){
      const e = new Error('AI request empty response content');
      e.kind = 'empty';
      throw e;
    }
    return content.trim();
  }

  // [서버 이전] parseMailResult()/applyPourPrefix()([POUR공법] 접두사 1회만 부착)도
  // functions/index.js로 그대로 옮겼다 — 서버가 이미 { subject, body }로 분리하고 접두사까지
  // 붙여서 돌려주므로 클라이언트는 더 이상 원문(raw)을 직접 파싱하지 않는다.

  // AI 문구정리 전용 서버 함수 호출. Firebase Auth ID 토큰만 실어 보내고, OpenAI 키는
  // 이 파일 어디에도 없다 — 서버(functions/index.js)가 Secret Manager에서 읽어 사용한다.
  const AI_FUNCTION_URL = 'https://us-central1-pour-dashboard.cloudfunctions.net/aiRewrite';

  async function getFirebaseIdToken(){
    // 위쪽 Firebase 초기화 블록(§1401 부근)이 로그인 성공 시 window.__shin2CloudSync.getIdToken을
    // 노출해둔다. 아직 로그인 전이거나(사이트 잠금 미해제) Firebase 초기화가 실패했다면 null.
    if(window.__shin2CloudSync && typeof window.__shin2CloudSync.getIdToken === 'function'){
      try{ return await window.__shin2CloudSync.getIdToken(); }
      catch(e){ return null; }
    }
    return null;
  }

  async function callAiRewriteServer(mode, text){
    const idToken = await getFirebaseIdToken();
    if(!idToken){
      const e = new Error('AI request: not authenticated (no Firebase ID token)');
      e.kind = 'auth-required';
      throw e;
    }
    let res;
    try{
      res = await fetch(AI_FUNCTION_URL, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + idToken
        },
        body: JSON.stringify({ mode, text })
      });
    } catch(networkErr){
      // fetch() 자체가 reject된 경우: 네트워크 단절, 또는 함수가 아직 배포되지 않아
      // 도메인이 존재하지 않는 경우(CORS/DNS) 등 — 이전 직접 호출 때와 동일한 'network' 분류.
      const e = new Error('AI request network/CORS failure: ' + (networkErr && networkErr.message));
      e.kind = 'network';
      e.original = networkErr;
      throw e;
    }
    let body = null;
    try{ body = await res.json(); }
    catch(parseErr){
      const e = new Error('AI request invalid JSON response: ' + (parseErr && parseErr.message));
      e.kind = 'parse';
      throw e;
    }
    if(!res.ok || (body && body.error)){
      const info = (body && body.error) || {};
      const e = new Error('AI request failed: ' + res.status + ' ' + (info.message || ''));
      e.kind = info.kind || 'http';
      e.status = res.status;
      e.detail = info.message || '';
      e.errType = info.errType || '';
      e.errCode = info.errCode || '';
      throw e;
    }
    return body; // { text } 또는 { subject, body } — 서버가 이미 [POUR공법] 접두사까지 적용
  }

  const state = { type:'report', loading:false, error:'', result:null };

  const inputEl = document.getElementById('aiInput');
  const runBtn = document.getElementById('aiRunBtn');
  const errorEl = document.getElementById('aiError');
  const resultEl = document.getElementById('aiResult');
  const typesWrap = document.getElementById('aiTypes');

  typesWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ai-type-btn');
    if(!btn) return;
    state.type = btn.getAttribute('data-type');
    typesWrap.querySelectorAll('.ai-type-btn').forEach(b=>b.classList.toggle('active', b === btn));
  });

  // 오류 메시지 + "[다시 시도]" 버튼을 함께 그린다. 재시도는 저장해둔 값이 아니라
  // 클릭 시점의 textarea 실제 값을 다시 읽어 동일한 요청을 재실행한다(runAi() 재호출).
  function setError(msg){
    state.error = msg || '';
    if(!state.error){
      errorEl.style.display = 'none';
      errorEl.innerHTML = '';
      return;
    }
    errorEl.style.display = 'block';
    errorEl.innerHTML = '<div class="ai-error-row"><span class="ai-error-text"></span>' +
      '<button type="button" class="ai-copy-btn ai-retry-btn" id="aiRetryBtn">[다시 시도]</button></div>';
    errorEl.querySelector('.ai-error-text').textContent = state.error;
    const retryBtn = errorEl.querySelector('#aiRetryBtn');
    if(retryBtn){
      retryBtn.addEventListener('click', ()=>{ runAi(); });
    }
  }

  function setLoading(loading){
    state.loading = loading;
    runBtn.disabled = loading;
    runBtn.textContent = loading ? '정리 중...' : 'AI로 정리';
  }

  function renderResult(){
    if(!state.result){ resultEl.innerHTML = ''; return; }
    if(state.result.type === 'mail'){
      const { subject, body } = state.result;
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-heading">제목</div>
            <div class="ai-result-text" id="aiSubjectText">${escapeHtml(subject)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="subject">제목 복사</button>
            </div>
          </div>
          <div class="ai-result-block">
            <div class="ai-result-heading">본문</div>
            <div class="ai-result-text" id="aiBodyText">${escapeHtml(body)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="body">본문 복사</button>
              <button type="button" class="ai-copy-btn" data-copy="all">전체 복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    } else {
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-text" id="aiPlainText">${escapeHtml(state.result.text)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="plain">복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    }
    resultEl.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-copy');
        let text = '';
        if(kind === 'subject') text = state.result.subject;
        else if(kind === 'body') text = state.result.body;
        else if(kind === 'all') text = `제목: ${state.result.subject}\n\n본문:\n${state.result.body}`;
        else text = state.result.text;
        navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
      });
    });
    const newBtn = document.getElementById('aiNewBtn');
    if(newBtn){
      newBtn.addEventListener('click', ()=>{
        inputEl.value = '';
        state.result = null;
        setError('');
        renderResult();
      });
    }
  }

  async function runAi(){
    if(state.loading) return;
    const text = inputEl.value.trim();
    if(!text) return;
    // [서버 이전] 더 이상 로컬 OpenAI 키 유무를 먼저 확인하지 않는다 — 인증은 Firebase
    // ID 토큰으로 서버가 판단한다(콜백 안에서 'auth-required'로 처리). 입력값은 실패해도
    // textarea에 그대로 남아있다(아래 catch는 inputEl.value를 절대 지우지 않음).
    doRun(text);
  }

  async function doRun(text){
    setError('');
    setLoading(true);
    const type = state.type;
    try{
      const data = await callAiRewriteServer(type, text);
      if(type === 'mail'){
        state.result = { type:'mail', subject: data.subject, body: data.body };
      } else {
        state.result = { type, text: data.text };
      }
      renderResult();
    } catch(err){
      // 화면에는 간단한 한국어 메시지만, 콘솔에는 실제 원인을 그대로 남긴다(개발/진단용).
      console.error('[SHIN2/AI] request failed:', err);
      if(err && err.kind === 'auth-required'){
        // 이전 "OpenAI API 키가 등록되어 있지 않습니다"에 대응하는 새 상태 — 이제 필요한 건
        // OpenAI 키가 아니라 로그인(사이트 잠금 해제)이다. 기존 6종 분기는 모두 그대로 둔다.
        console.error('[SHIN2/AI] Firebase 로그인 필요 — ID 토큰 없음');
        setError('로그인이 필요합니다. 사이트 잠금을 해제한 뒤 다시 시도해주세요.');
      } else if(err && err.kind === 'http' && err.status === 401){
        console.error('[SHIN2/AI] 401 Unauthorized — API 키가 잘못되었거나 만료됨');
        setError('API 키가 올바르지 않습니다. 설정에서 키를 다시 확인해주세요.');
      } else if(err && err.kind === 'http' && err.status === 429 && (err.errCode === 'insufficient_quota' || err.errType === 'insufficient_quota')){
        console.error('[SHIN2/AI] 429 insufficient_quota — 결제/쿼터 소진', err.detail);
        setError('AI 사용 한도가 소진되었습니다. API 사용량 또는 결제 상태를 확인해주세요.');
      } else if(err && err.kind === 'http' && err.status === 429){
        console.error('[SHIN2/AI] 429', err.errType || err.errCode || '(type 미상)', '— 일시적 요청 과다', err.detail);
        setError('AI 요청이 일시적으로 많습니다. 잠시 후 다시 시도해주세요.');
      } else if(err && err.kind === 'http'){
        console.error('[SHIN2/AI] HTTP', err.status, err.detail);
        setError(`문구 정리에 실패했습니다. (오류 코드 ${err.status})`);
      } else if(err && err.kind === 'network'){
        console.error('[SHIN2/AI] 네트워크/CORS로 요청 자체가 차단됨 — 브라우저가 응답을 받지 못했습니다(함수가 아직 배포되지 않았을 수 있습니다).', err.original);
        setError('AI 서버에 연결할 수 없습니다. 네트워크 또는 브라우저 보안 정책(CORS) 문제일 수 있습니다.');
      } else {
        setError('문구 정리에 실패했습니다. 다시 시도해주세요.');
      }
    } finally {
      setLoading(false);
    }
  }

  runBtn.addEventListener('click', runAi);
  inputEl.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      runAi();
    }
  });

  // 다른 스크립트 블록(예: 지식 페이지의 "빠른 지식 추가")이 동일한 AI 호출 방식을 그대로 재사용할 수
  // 있도록 최소한의 함수만 노출한다. 새 fetch 로직을 만들지 않고 이 3개 함수만 공유한다.
  window.SHIN2_AI = { getApiKey, promptForApiKey, callOpenAI };
})();
</script>

<script>
(function(){
  // ---------- 화면 전환 (홈 / 지식) ----------
  // 계정은 더 이상 별도 페이지가 아니라 중앙 팝업이므로 여기서 관리하지 않는다(아래 "계정 팝업" 섹션).
  const brandHomeBtn = document.getElementById('brandHomeBtn');
  const navCompanies = document.getElementById('navCompanies');
  const navAccounts = document.getElementById('navAccounts');
  const navKnowledge = document.getElementById('navKnowledge');
  const navLibrary = document.getElementById('navLibrary');
  const homeView = document.getElementById('homeView');
  const companiesView = document.getElementById('companiesView');
  const knowledgeView = document.getElementById('knowledgeView');
  const libraryView = document.getElementById('libraryView');

  function showView(view){
    homeView.style.display = view === 'home' ? 'block' : 'none';
    companiesView.style.display = view === 'companies' ? 'block' : 'none';
    knowledgeView.style.display = view === 'knowledge' ? 'block' : 'none';
    libraryView.style.display = view === 'library' ? 'block' : 'none';
    navCompanies.classList.toggle('active', view === 'companies');
    navKnowledge.classList.toggle('active', view === 'knowledge');
    navLibrary.classList.toggle('active', view === 'library');
  }
  brandHomeBtn.addEventListener('click', ()=> showView('home'));

  // §우상단 드롭다운 라운드: 사용자 1·2·3 전환 UI(우측 상단 작은 드롭다운으로 재배치).
  // 전환 즉시 페이지를 새로고침한다 — 이 파일 안의 개인 데이터 모듈(내 할 일/포스트잇
  // 메모/최근 처리업무/내 일정)은 모두 각자 스크립트 로드 시점에 SHIN2_USER.nsKey()로
  // STORAGE_KEY를 한 번만 정하는 구조라, 새로고침이 가장 안전하게 모든 모듈을 새 사용자
  // 키로 다시 초기화하는 방법이다(개별 모듈마다 재로딩 로직을 새로 만들지 않음). 업체/
  // CRM/자료실/지식 등 공용 데이터는 사용자와 무관한 고정 키를 계속 쓰므로 전환해도
  // 그대로 유지된다.
  (function(){
    var dd = document.getElementById('userSelectDD');
    var btn = document.getElementById('userSelectBtn');
    var label = document.getElementById('userSelectLabel');
    var menu = document.getElementById('userSelectMenu');
    if(!dd || !btn || !menu || !window.SHIN2_USER) return;
    var current = window.SHIN2_USER.get();
    label.textContent = current;
    menu.innerHTML = window.SHIN2_USER.users.map(function(uid){
      return '<button type="button" class="user-select-item' + (uid === current ? ' active' : '') +
        '" data-user-id="' + uid + '" role="option" aria-selected="' + (uid === current) + '">' + uid + '</button>';
    }).join('');
    function closeMenu(){ menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    function toggleMenu(){
      var open = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggleMenu(); });
    document.addEventListener('click', function(e){ if(!dd.contains(e.target)) closeMenu(); });
    menu.querySelectorAll('[data-user-id]').forEach(function(item){
      item.addEventListener('click', function(){
        var uid = item.getAttribute('data-user-id');
        closeMenu();
        if(uid === window.SHIN2_USER.get()) return;
        window.SHIN2_USER.set(uid);
        location.reload();
      });
    });
  })();
  navCompanies.addEventListener('click', ()=>{
    showView('companies');
    if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.onEnter();
  });
  navAccounts.addEventListener('click', ()=> openAcctPopup());
  navLibrary.addEventListener('click', ()=>{
    showView('library');
    if(window.SHIN2_LIBRARY) window.SHIN2_LIBRARY.onEnter();
  });
  navKnowledge.addEventListener('click', ()=>{
    showView('knowledge');
    if(window.SHIN2_KB) window.SHIN2_KB.renderKbList();
  });

  // 업체 검색 결과 클릭(§14) 등 다른 스크립트 블록에서 화면 전환이 필요할 때 쓰는 최소 확장 포인트.
  window.SHIN2_NAV = { showView };

  // ---------- 사이트 잠금 + 계정(비밀번호) 보관함 (통합 인증) ----------
  // 저장 위치: localStorage['shin2-accounts-vault'] = { salt, check:{cipher,iv}, records:[...] }
  // - salt/check/cipher/iv 는 비밀이 아닌 값(암호문·솔트)이며 이 위치에 저장해도 안전하다.
  // - 사이트 진입 비밀번호 원문은 어디에도 저장하지 않는다(localStorage/sessionStorage 모두 금지).
  // - "사이트 게이트"와 "계정함 암호화"는 하나의 비밀번호/파생 키를 공유한다: 사용자가 최초 진입 시
  //   입력한 비밀번호가 곧 이 계정함(shin2-accounts-vault)의 마스터 비밀번호이기도 하다. 같은
  //   salt로 같은 PBKDF2 파라미터를 거쳐 같은 AES-GCM 키가 나오므로, 계정 메뉴 진입 시 별도로
  //   다시 물어볼 필요가 없다.
  // - 새로고침 후에도(같은 탭) 다시 로그인시키지 않아야 한다는 요구사항(§4)을 만족시키려면 탭이
  //   유지되는 동안 파생 키가 어딘가에는 있어야 한다. CryptoKey 객체 자체는 새로고침 시 소멸하므로,
  //   PBKDF2로 유도한 "원시 키 바이트"만 base64로 sessionStorage에 두고(원본 비밀번호 문자열은
  //   절대 두지 않음), 새로고침 시 그 바이트를 다시 importKey 해서 CryptoKey를 복원한다.
  //   이는 "메모리에만" 원칙에서는 후퇴이지만(탭 종료 전까지는 sessionStorage에서 읽을 수 있음),
  //   sessionStorage는 탭을 닫으면 사라지므로 §3/§5(탭 종료 시 재인증)와는 부합한다. 보고서 참고.
  const ACCT_STORAGE_KEY = 'shin2-accounts-vault';
  const PBKDF2_ITERATIONS = 150000;
  const CHECK_PLAINTEXT = 'shin2-vault-check-v1';
  // §비밀번호 재입력 최소화 라운드: 사용자 요청으로 sessionStorage(탭 종료 시 소멸) →
  // localStorage(브라우저를 껐다 켜도 유지)로 변경했다. 계정함 자체를 없애거나 암호화를
  // 약화한 것은 아니다 — 여전히 원시 AES-GCM 키 바이트만 저장하고 원본 비밀번호 문자열은
  // 절대 저장하지 않으며, 우측 상단 자물쇠 버튼(clearSessionKeyBytes)으로 언제든 다시 잠글 수
  // 있다. 트레이드오프: 이 브라우저에 접근 가능한 사람은 이제 탭을 새로 열어도 다시 비밀번호를
  // 묻지 않는다(§22 이전 결정 "탭 종료 시 재인증"에서 벗어남 — 사용자가 명시적으로 선택).
  const GATE_SESSION_KEY = 'shin2-gate-session-key'; // localStorage: base64 raw AES-GCM 키 바이트(이 브라우저에서 계속 유지)

  let vaultKey = null;      // CryptoKey, 메모리 변수 (탭 새로고침 시 sessionStorage에서 재구성)
  let vaultMeta = null;     // { salt, check } — localStorage에서 읽은 비밀 아닌 메타데이터
  const acctState = {
    records: [],
    search: '',
    selectedId: null,
    mode: 'list',        // 'list' | 'detail' | 'edit' | 'add'
    revealPassword: false,
    formDirty: false
  };

  function b64FromBuf(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function bufFromB64(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }

  // PBKDF2로 원시 키 바이트를 직접 뽑아낸다(= deriveKey와 동일한 키 소재를 만들지만,
  // 바이트 형태로도 얻어야 새로고침용 sessionStorage 저장이 가능하다).
  async function deriveRawKeyBytes(password, saltBytes){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
      baseKey,
      256
    );
    return new Uint8Array(bits);
  }
  async function importAesKey(rawBytes){
    return crypto.subtle.importKey('raw', rawBytes, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
  }
  async function deriveKey(password, saltBytes){
    const rawBytes = await deriveRawKeyBytes(password, saltBytes);
    return importAesKey(rawBytes);
  }

  async function encryptStr(key, plaintext){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const cipherBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(plaintext));
    return { cipher: b64FromBuf(cipherBuf), iv: b64FromBuf(iv.buffer) };
  }
  async function decryptStr(key, cipherB64, ivB64){
    const iv = new Uint8Array(bufFromB64(ivB64));
    const cipherBuf = bufFromB64(cipherB64);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
    return new TextDecoder().decode(plainBuf);
  }

  function loadVaultRaw(){
    try{
      const raw = localStorage.getItem(ACCT_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!vaultMeta) return;
    const vault = { salt: vaultMeta.salt, check: vaultMeta.check, records: acctState.records };
    localStorage.setItem(ACCT_STORAGE_KEY, JSON.stringify(vault));
  }

  function maskUsername(u){
    if(!u) return '-';
    const prefix = u.slice(0, Math.min(4, u.length));
    return prefix + '****';
  }
  function genId(){
    return 'acct_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  function escapeHtml2(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escapeAttr(str){ return escapeHtml2(str); }

  function showCopied(btn){
    const old = btn.nextElementSibling && btn.nextElementSibling.classList.contains('acct-copied') ? btn.nextElementSibling : null;
    if(old) old.remove();
    const span = document.createElement('span');
    span.className = 'acct-copied';
    span.textContent = '복사됨';
    btn.insertAdjacentElement('afterend', span);
    setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
  }

  function copyText(text, btn){
    if(!navigator.clipboard){ return; }
    navigator.clipboard.writeText(text).then(()=> showCopied(btn)).catch(()=>{});
  }

  function getSelectedRecord(){
    return acctState.records.find(r=> r.id === acctState.selectedId) || null;
  }

  // ---------- 계정 팝업 (중앙 모달) ----------
  // 계정은 더 이상 별도 페이지가 아니라, 현재 보고 있던 화면(홈/지식 등) 위에 뜨는 중앙 팝업이다.
  // 팝업 안에서 목록 <-> 상세 <-> 추가/수정 폼 사이를 전환하며, 브라우저 히스토리는 건드리지 않는다.
  const acctPopupOverlay = document.getElementById('acctPopupOverlay');
  const acctPopup = document.getElementById('acctPopup');
  const acctPopupBody = document.getElementById('acctPopupBody');
  const acctPopupBackBtn = document.getElementById('acctPopupBackBtn');
  const acctPopupTitle = document.getElementById('acctPopupTitle');
  const acctPopupCloseBtn = document.getElementById('acctPopupCloseBtn');
  let acctRenderGen = 0;

  function isAcctPopupOpen(){
    return acctPopupOverlay.classList.contains('open');
  }

  // 계정 메뉴는 사이트 전체 잠금이 이미 통과된 뒤에만 보이므로, 별도의 마스터 비밀번호 화면 없이
  // vaultKey가 준비되는 즉시 바로 목록을 그릴 수 있다. (아래 "사이트 잠금 게이트" 섹션에서 vaultKey 세팅)
  function refreshAccountsAfterUnlock(){
    acctState.selectedId = null;
    acctState.mode = 'list';
    acctState.revealPassword = false;
    acctState.formDirty = false;
    if(isAcctPopupOpen()) renderAcctPopup();
  }

  function openAcctPopup(){
    acctState.mode = 'list';
    acctState.selectedId = null;
    acctState.revealPassword = false;
    acctState.formDirty = false;
    acctPopupOverlay.classList.add('open');
    renderAcctPopup();
  }

  function closeAcctPopup(){
    const bar = document.getElementById('acctDiscardBar');
    if(bar) bar.remove();
    acctPopupOverlay.classList.remove('open');
    acctState.mode = 'list';
    acctState.selectedId = null;
    acctState.revealPassword = false;
    acctState.formDirty = false;
  }

  function attemptCloseAcctPopup(){
    if((acctState.mode === 'add' || acctState.mode === 'edit') && acctState.formDirty){
      showAcctDiscardConfirm();
      return;
    }
    closeAcctPopup();
  }

  function showAcctDiscardConfirm(){
    if(document.getElementById('acctDiscardBar')) return;
    const bar = document.createElement('div');
    bar.id = 'acctDiscardBar';
    bar.className = 'acct-discard-bar';
    bar.innerHTML = `
      <span>저장하지 않은 변경사항이 있습니다. 닫으시겠습니까?</span>
      <span style="display:flex; gap:10px; flex:0 0 auto;">
        <button type="button" class="acct-text-action" id="acctDiscardCancel">취소</button>
        <button type="button" class="acct-text-action danger" id="acctDiscardConfirm">닫기</button>
      </span>
    `;
    acctPopup.appendChild(bar);
    document.getElementById('acctDiscardCancel').addEventListener('click', ()=> bar.remove());
    document.getElementById('acctDiscardConfirm').addEventListener('click', ()=>{
      bar.remove();
      closeAcctPopup();
    });
  }

  acctPopupCloseBtn.addEventListener('click', attemptCloseAcctPopup);
  acctPopupOverlay.addEventListener('click', (e)=>{
    if(e.target === acctPopupOverlay) attemptCloseAcctPopup();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && isAcctPopupOpen()) attemptCloseAcctPopup();
  });
  acctPopupBackBtn.addEventListener('click', ()=>{
    acctState.mode = 'list';
    acctState.revealPassword = false;
    acctState.formDirty = false;
    renderAcctPopup();
  });

  function renderAcctPopup(){
    const bar = document.getElementById('acctDiscardBar');
    if(bar) bar.remove();
    const inSubView = acctState.mode !== 'list';
    acctPopupBackBtn.style.display = inSubView ? 'inline-flex' : 'none';
    acctPopupTitle.style.display = inSubView ? 'none' : 'block';
    if(acctState.mode === 'add'){ renderAcctFormMode(null); return; }
    if(acctState.mode === 'edit'){ renderAcctFormMode(getSelectedRecord()); return; }
    if(acctState.mode === 'detail'){ renderAcctDetailMode(); return; }
    renderAcctListMode();
  }

  // ---------- 목록 화면 ----------
  function filteredRecords(){
    const q = acctState.search.trim().toLowerCase();
    if(!q) return acctState.records;
    return acctState.records.filter(r=>
      (r.site||'').toLowerCase().includes(q) ||
      (r.username||'').toLowerCase().includes(q) ||
      (r.memoPlain||'').toLowerCase().includes(q)
    );
  }

  function renderAcctListMode(){
    acctPopupBody.innerHTML = `
      <div class="search-box acct-search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="acctSearchInput" placeholder="사이트명 또는 아이디 검색" value="${escapeAttr(acctState.search)}" />
      </div>
      <div id="acctList" class="acct-pop-list"></div>
      <div class="acct-pop-add-row">
        <button type="button" id="acctAddBtn" class="acct-add-btn">+ 계정 추가</button>
      </div>
    `;
    renderAcctList();
    const searchInput = document.getElementById('acctSearchInput');
    searchInput.addEventListener('input', ()=>{
      acctState.search = searchInput.value;
      renderAcctList();
    });
    document.getElementById('acctAddBtn').addEventListener('click', ()=>{
      acctState.selectedId = null;
      acctState.mode = 'add';
      renderAcctPopup();
    });
  }

  function renderAcctList(){
    const acctList = document.getElementById('acctList');
    if(!acctList) return;
    const items = filteredRecords();
    if(items.length === 0){
      acctList.innerHTML = `<div class="acct-empty">${acctState.records.length === 0 ? '저장된 계정이 없습니다. 아래 + 계정 추가로 등록하세요.' : '검색 결과가 없습니다.'}</div>`;
      return;
    }
    acctList.innerHTML = items.map(r=>`
      <div class="acct-pop-row" data-id="${escapeAttr(r.id)}">
        <div class="acct-pop-row-site">${escapeHtml2(r.site)}</div>
        <div class="acct-pop-row-user">${escapeHtml2(maskUsername(r.username))}</div>
      </div>
    `).join('');
    acctList.querySelectorAll('.acct-pop-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        acctState.selectedId = row.getAttribute('data-id');
        acctState.mode = 'detail';
        // 상세를 열면 비밀번호를 처음부터 보이게 한다(§계정 비밀번호 표시 요청). 가리고 싶으면
        // 상세 화면의 [숨기기] 버튼으로 언제든 되돌릴 수 있다.
        acctState.revealPassword = true;
        renderAcctPopup();
      });
    });
  }

  // ---------- 상세 화면 ----------
  async function renderAcctDetailMode(){
    const rec = getSelectedRecord();
    if(!rec){
      acctState.mode = 'list';
      renderAcctPopup();
      return;
    }
    const myGen = ++acctRenderGen;
    let pwDisplay = '••••••••••';
    if(acctState.revealPassword && rec.cipher){
      try{ pwDisplay = await decryptStr(vaultKey, rec.cipher, rec.iv); }
      catch(e){ pwDisplay = '(복호화 실패)'; }
    } else if(!rec.cipher){
      pwDisplay = '-';
    }
    if(myGen !== acctRenderGen) return; // 그 사이 다른 화면으로 전환됨

    const urlRowHtml = rec.url ? `
      <div class="acct-field">
        <div class="acct-field-label">사이트</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.url)}</div>
          <a class="acct-link-btn" href="${escapeAttr(rec.url)}" target="_blank" rel="noopener noreferrer">열기</a>
        </div>
      </div>` : '';
    const memoRowHtml = rec.memoPlain ? `
      <div class="acct-field">
        <div class="acct-field-label">메모</div>
        <div class="acct-field-memo">${escapeHtml2(rec.memoPlain)}</div>
      </div>` : '';

    acctPopupBody.innerHTML = `
      <div class="acct-detail-title acct-pop-detail-title">${escapeHtml2(rec.site)}</div>
      <div class="acct-field">
        <div class="acct-field-label">아이디</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.username || '-')}</div>
          <button type="button" class="acct-link-btn" id="acctCopyUser">복사</button>
        </div>
      </div>
      <div class="acct-field">
        <div class="acct-field-label">비밀번호</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(pwDisplay)}</div>
          ${rec.cipher ? `<button type="button" class="acct-link-btn" id="acctCopyPw">복사</button><button type="button" class="acct-link-btn" id="acctTogglePw">${acctState.revealPassword ? '숨기기' : '보기'}</button>` : ''}
        </div>
      </div>
      ${rec.cipher ? `
      <div class="acct-field">
        <div class="acct-field-row">
          <button type="button" class="acct-link-btn" id="acctCopyBoth">아이디+비밀번호 함께 복사</button>
        </div>
      </div>` : ''}
      ${urlRowHtml}
      ${memoRowHtml}
      <div class="acct-detail-actions" id="acctActionsRow">
        <button type="button" class="acct-text-action" id="acctEditBtn">수정</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteBtn">삭제</button>
      </div>
      <div id="acctMemoSlot"></div>
    `;

    document.getElementById('acctCopyUser').addEventListener('click', (e)=> copyText(rec.username || '', e.currentTarget));
    if(window.SHIN2_MEMO){
      window.SHIN2_MEMO.mount(document.getElementById('acctMemoSlot'), 'account', rec.id);
    }
    const copyPwBtn = document.getElementById('acctCopyPw');
    if(copyPwBtn){
      copyPwBtn.addEventListener('click', async (e)=>{
        try{
          const pw = await decryptStr(vaultKey, rec.cipher, rec.iv);
          copyText(pw, e.currentTarget);
        }catch(err){}
      });
    }
    // 아이디와 비밀번호를 값만 두 줄로 클립보드에 담는다(1줄=아이디, 2줄=비밀번호).
    // 비밀번호는 저장된 암호문을 그때그때 복호화해서 쓰고 어디에도 따로 보관하지 않는다.
    const copyBothBtn = document.getElementById('acctCopyBoth');
    if(copyBothBtn){
      copyBothBtn.addEventListener('click', async (e)=>{
        const btn = e.currentTarget;
        try{
          const pw = await decryptStr(vaultKey, rec.cipher, rec.iv);
          copyText((rec.username || '') + '\n' + pw, btn);
        }catch(err){ console.error('[계정] 아이디+비밀번호 복사 실패', err); }
      });
    }
    const toggleBtn = document.getElementById('acctTogglePw');
    if(toggleBtn){
      toggleBtn.addEventListener('click', ()=>{
        acctState.revealPassword = !acctState.revealPassword;
        renderAcctDetailMode();
      });
    }
    document.getElementById('acctEditBtn').addEventListener('click', ()=>{
      acctState.mode = 'edit';
      renderAcctPopup();
    });
    document.getElementById('acctDeleteBtn').addEventListener('click', ()=>{
      renderAcctDeleteConfirm(rec);
    });
  }

  function renderAcctDeleteConfirm(rec){
    const actionsRow = document.getElementById('acctActionsRow');
    if(!actionsRow) return;
    actionsRow.innerHTML = `
      <div class="acct-confirm-row">
        <span>이 계정 정보를 삭제하시겠습니까?</span>
        <button type="button" class="acct-text-action" id="acctDeleteCancel">취소</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteConfirm">삭제</button>
      </div>
    `;
    document.getElementById('acctDeleteCancel').addEventListener('click', ()=> renderAcctDetailMode());
    document.getElementById('acctDeleteConfirm').addEventListener('click', ()=>{
      acctState.records = acctState.records.filter(r=> r.id !== rec.id);
      persist();
      acctState.selectedId = null;
      acctState.mode = 'list';
      acctState.revealPassword = false;
      renderAcctPopup();
    });
  }

  // ---------- 폼 화면 (추가 / 수정) ----------
  function renderAcctFormMode(rec){
    const isNew = !rec;
    acctState.formDirty = false;
    acctPopupBody.innerHTML = `
      <div class="acct-detail-title acct-pop-detail-title">${isNew ? '새 계정' : escapeHtml2(rec.site)}</div>
      <div class="acct-form-field">
        <label>사이트명</label>
        <input type="text" id="acctFormSite" value="${isNew ? '' : escapeAttr(rec.site)}" />
      </div>
      <div id="acctFormSiteError" class="acct-form-error" style="display:none;">사이트명을 입력하세요.</div>
      <div class="acct-form-field">
        <label>사이트 주소</label>
        <input type="text" id="acctFormUrl" value="${isNew ? '' : escapeAttr(rec.url || '')}" placeholder="https://" />
      </div>
      <div class="acct-form-field">
        <label>아이디</label>
        <input type="text" id="acctFormUser" value="${isNew ? '' : escapeAttr(rec.username || '')}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>비밀번호</label>
        <input type="text" id="acctFormPw" value="" placeholder="${isNew ? '' : '변경하지 않으려면 비워두지 말고 그대로 다시 입력하세요'}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>메모</label>
        <textarea id="acctFormMemo">${isNew ? '' : escapeHtml2(rec.memoPlain || '')}</textarea>
      </div>
      <div class="acct-form-actions">
        <button type="button" class="acct-text-action" id="acctFormCancel">취소</button>
        <button type="button" class="ai-run-btn" id="acctFormSave">저장</button>
      </div>
    `;

    // 수정 모드에서는 기존 비밀번호를 미리 채워 보여준다(스펙: "현재 값이 채워진 채로").
    if(!isNew && rec.cipher){
      const myGen = ++acctRenderGen;
      decryptStr(vaultKey, rec.cipher, rec.iv).then(pw=>{
        if(myGen !== acctRenderGen) return;
        const pwInput = document.getElementById('acctFormPw');
        if(pwInput && !acctState.formDirty) pwInput.value = pw;
      }).catch(()=>{});
    }

    acctPopupBody.querySelectorAll('#acctFormSite, #acctFormUrl, #acctFormUser, #acctFormPw, #acctFormMemo').forEach(el=>{
      el.addEventListener('input', ()=>{ acctState.formDirty = true; });
    });

    document.getElementById('acctFormCancel').addEventListener('click', ()=>{
      acctState.formDirty = false;
      if(isNew){
        acctState.mode = 'list';
        acctState.selectedId = null;
      } else {
        acctState.mode = 'detail';
      }
      renderAcctPopup();
    });

    document.getElementById('acctFormSave').addEventListener('click', async ()=>{
      const siteEl = document.getElementById('acctFormSite');
      const site = siteEl.value.trim();
      const errEl = document.getElementById('acctFormSiteError');
      if(!site){
        errEl.style.display = 'block';
        siteEl.focus();
        return;
      }
      errEl.style.display = 'none';
      const url = document.getElementById('acctFormUrl').value.trim();
      const username = document.getElementById('acctFormUser').value.trim();
      const pwVal = document.getElementById('acctFormPw').value;
      const memo = document.getElementById('acctFormMemo').value.trim();

      let cipher = null, iv = null;
      if(pwVal){
        const enc = await encryptStr(vaultKey, pwVal);
        cipher = enc.cipher; iv = enc.iv;
      }

      acctState.formDirty = false;
      if(isNew){
        const newRec = { id: genId(), site, url, username, memoPlain: memo, cipher, iv };
        acctState.records.push(newRec);
        persist();
        acctState.selectedId = null;
        acctState.mode = 'list';
      } else {
        rec.site = site;
        rec.url = url;
        rec.username = username;
        rec.memoPlain = memo;
        rec.cipher = cipher;
        rec.iv = iv;
        persist();
        acctState.selectedId = rec.id;
        acctState.mode = 'detail';
      }
      acctState.revealPassword = true;
      renderAcctPopup();
    });
  }

  // ---------- 사이트 잠금 게이트 ----------
  // 사이트 진입 비밀번호 = 이 계정함(ACCT_STORAGE_KEY)의 마스터 비밀번호. 하나의 비밀번호로
  // (a) 사이트 게이트 통과 여부와 (b) 계정함 암호화 키 유도를 동시에 수행한다.
  const gateScreen = document.getElementById('gateScreen');
  const gateDesc = document.getElementById('gateDesc');
  const gatePasswordInput = document.getElementById('gatePasswordInput');
  const gateError = document.getElementById('gateError');
  const gateEnterBtn = document.getElementById('gateEnterBtn');
  const appRoot = document.getElementById('appRoot');
  const siteLockBtn = document.getElementById('siteLockBtn');

  function showGateError(msg){
    gateError.textContent = msg;
    gateError.style.display = msg ? 'block' : 'none';
  }

  function refreshGateDesc(){
    gateDesc.textContent = loadVaultRaw()
      ? '비밀번호를 입력해주세요'
      : '처음 사용하시네요. 사용할 비밀번호를 정해주세요';
  }

  function showGate(){
    appRoot.style.display = 'none';
    gateScreen.style.display = 'flex';
    gatePasswordInput.value = '';
    showGateError('');
    refreshGateDesc();
    gatePasswordInput.focus();
  }

  function showApp(){
    gateScreen.style.display = 'none';
    appRoot.style.removeProperty('display');
  }

  // localStorage: 유도된 AES-GCM 키의 "원시 바이트"만 base64로 저장한다(원본 비밀번호 문자열은
  // 절대 저장하지 않음). §비밀번호 재입력 최소화 라운드 — 브라우저를 껐다 켜도 유지되도록
  // sessionStorage에서 localStorage로 바꿨다(매번 다시 입력하지 않도록). 우측 상단 자물쇠
  // 버튼을 누르면 언제든 이 값을 지우고 다시 잠글 수 있다(clearSessionKeyBytes).
  function saveSessionKeyBytes(rawBytes){
    try{ localStorage.setItem(GATE_SESSION_KEY, b64FromBuf(rawBytes.buffer)); }catch(e){}
  }
  function loadSessionKeyBytes(){
    try{
      const b64 = localStorage.getItem(GATE_SESSION_KEY);
      return b64 ? new Uint8Array(bufFromB64(b64)) : null;
    }catch(e){ return null; }
  }
  function clearSessionKeyBytes(){
    try{ localStorage.removeItem(GATE_SESSION_KEY); }catch(e){}
  }

  async function tryAutoUnlockFromSession(){
    const rawBytes = loadSessionKeyBytes();
    if(!rawBytes) return false;
    const existing = loadVaultRaw();
    if(!existing){ clearSessionKeyBytes(); return false; }
    try{
      const key = await importAesKey(rawBytes);
      const decoded = await decryptStr(key, existing.check.cipher, existing.check.iv);
      if(decoded !== CHECK_PLAINTEXT) throw new Error('check mismatch');
      vaultMeta = { salt: existing.salt, check: existing.check };
      vaultKey = key;
      acctState.records = Array.isArray(existing.records) ? existing.records : [];
      return true;
    }catch(e){
      clearSessionKeyBytes();
      return false;
    }
  }

  async function handleGateEnter(){
    const pw = gatePasswordInput.value;
    showGateError('');
    if(!pw) return;
    gateEnterBtn.disabled = true;
    try{
      const existing = loadVaultRaw();
      if(!existing){
        // 최초 진입: 이 비밀번호를 사이트 비밀번호 겸 계정함 마스터 비밀번호로 새로 설정한다.
        const saltBytes = crypto.getRandomValues(new Uint8Array(16));
        const rawBytes = await deriveRawKeyBytes(pw, saltBytes);
        const key = await importAesKey(rawBytes);
        const check = await encryptStr(key, CHECK_PLAINTEXT);
        vaultMeta = { salt: b64FromBuf(saltBytes.buffer), check };
        vaultKey = key;
        acctState.records = [];
        persist();
        saveSessionKeyBytes(rawBytes);
        showApp();
        refreshAccountsAfterUnlock();
        // 비밀번호는 어디에도 저장하지 않고, 지금 이 순간 Firebase 로그인에만 일회성으로 전달한다
        // (집/회사에서 같은 비밀번호를 입력하면 같은 Firebase 계정(uid)으로 연결되어야 동기화가 됨).
        window.dispatchEvent(new CustomEvent('shin2-app-unlocked', { detail: { password: pw } }));
        return;
      }
      const saltBytes = new Uint8Array(bufFromB64(existing.salt));
      const rawBytes = await deriveRawKeyBytes(pw, saltBytes);
      const key = await importAesKey(rawBytes);
      let ok = false;
      try{
        const decoded = await decryptStr(key, existing.check.cipher, existing.check.iv);
        ok = (decoded === CHECK_PLAINTEXT);
      }catch(e){ ok = false; }
      if(!ok){
        showGateError('비밀번호가 올바르지 않습니다.');
        return;
      }
      vaultMeta = { salt: existing.salt, check: existing.check };
      vaultKey = key;
      acctState.records = Array.isArray(existing.records) ? existing.records : [];
      saveSessionKeyBytes(rawBytes);
      showApp();
      refreshAccountsAfterUnlock();
      window.dispatchEvent(new CustomEvent('shin2-app-unlocked', { detail: { password: pw } }));
    } finally {
      gateEnterBtn.disabled = false;
    }
  }

  gateEnterBtn.addEventListener('click', handleGateEnter);
  gatePasswordInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleGateEnter(); });

  siteLockBtn.addEventListener('click', ()=>{
    vaultKey = null;
    vaultMeta = null;
    acctState.records = [];
    acctState.selectedId = null;
    acctState.mode = 'list';
    closeAcctPopup();
    clearSessionKeyBytes();
    showGate();
  });

  (async function initGate(){
    const restored = await tryAutoUnlockFromSession();
    if(restored){
      showApp();
      refreshAccountsAfterUnlock();
      window.dispatchEvent(new CustomEvent('shin2-app-unlocked'));
    } else {
      showGate();
    }
  })();

  // 통합검색용 확장 포인트: 계정함의 사이트명/아이디만 노출한다(비밀번호/URL/메모는 절대 포함하지 않음).
  // 한솔1 이전(migration) 전용 API: sourceSystem/sourceId 기준으로 중복을 건너뛰고, 비밀번호는 항상
  // 이 계정함과 동일한 AES-GCM 키로 암호화해서만 저장한다(평문 저장 금지). 잠금 상태(vaultKey 없음)면
  // 아무 것도 하지 않고 blocked 사유를 반환한다 — 잠금 해제 이벤트에서 다시 호출하면 된다.
  async function migrateAddAccounts(records){
    if(!vaultKey) return { added:0, skipped:0, blocked:(records||[]).length, reason:'locked' };
    let added = 0, skipped = 0;
    for(const r of (records||[])){
      if(acctState.records.some(x=> x.sourceSystem === 'hansol1' && x.sourceId === r.sourceId)){ skipped++; continue; }
      let cipher = null, iv = null;
      if(r.password){
        const enc = await encryptStr(vaultKey, r.password);
        cipher = enc.cipher; iv = enc.iv;
      }
      acctState.records.push({
        id: genId(), site: r.site || '', url: r.url || '', username: r.username || '',
        memoPlain: r.memo || '', cipher, iv, sourceSystem: 'hansol1', sourceId: r.sourceId
      });
      added++;
    }
    if(added) persist();
    return { added, skipped };
  }
  window.SHIN2_ACCOUNTS = {
    getSearchable: function(){
      return acctState.records.map(r=> ({ id: r.id, site: r.site, username: r.username }));
    },
    migrateAdd: migrateAddAccounts,
    isUnlocked: function(){ return !!vaultKey; },
    // 계정 메모 검색결과 클릭용: 계정함 팝업을 해당 레코드 상세로 바로 연다.
    // 계정함 자체가 잠겨있으면(로그아웃 상태) 목록 화면만 열어 사용자가 다시 잠금 해제하게 한다.
    openDetail: function(id){
      if(!vaultKey){ openAcctPopup(); return; }
      acctState.selectedId = id;
      acctState.mode = 'detail';
      acctState.revealPassword = true;
      acctPopupOverlay.classList.add('open');
      renderAcctPopup();
    }
  };
  window.dispatchEvent(new CustomEvent('shin2-accounts-api-ready'));
})();
</script>

<!-- ─────────────────────────────────────────────────────────────────────
     [데이터 백업]/[백업 복원]/[클라우드 동기화 시작] 버튼 배선.
     - 백업/복원은 Firebase 설정 유무와 무관하게 항상 동작한다(순수 localStorage↔JSON 파일).
     - 클라우드 동기화 버튼은 firebaseConfig.js가 있고 로그인이 성공한 뒤에만 나타나며,
       클릭 이전에는 절대 아무 것도 하지 않는다(§12) — 'shin2-firebase-ready' 이벤트가 와야
       버튼이 보이고, 클릭 시점에만 window.__shin2CloudSync.startInitialSync()를 호출한다. -->
<script>
(function(){
  'use strict';
  var ACCT_KEY = 'shin2-accounts-vault'; // 계정함 — 백업에는 이미 암호화된 그대로만 포함, 복원 대상에서는 항상 제외
  var backupBtn = document.getElementById('shin2BackupBtn');
  var restoreBtn = document.getElementById('shin2RestoreBtn');
  var restoreFile = document.getElementById('shin2RestoreFile');
  var cloudBtn = document.getElementById('shin2CloudSyncBtn');
  var statusEl = document.getElementById('shin2SyncStatus');
  // 고객관리카드 진입 버튼(shin2CrmLinkBtn)은 사이드바에서 제거됐다 — 그 버튼에만 달려 있던
  // 클릭 리스너(window.open('../crm/'))도 함께 제거한다. crm 페이지 자체는 그대로 남아 있다.

  function setStatus(msg){ if(statusEl) statusEl.textContent = msg || ''; }

  // §기존 데이터 실제 마이그레이션 라운드: [클라우드 동기화 시작]을 눌러도 지금까지는
  // "동기화 중...→완료"라는 한 줄 문구만 보여주고 끝났다 — 실제로 몇 건이 발견됐고 몇 건이
  // 클라우드로 올라갔는지 확인할 방법이 없었다("기능은 만들어졌지만 실제로 이전됐는지 알 수
  // 없다"는 지적의 원인). 아래는 새 동기화 메커니즘이 아니라, 이미 있는 startInitialSync()
  // 실행 앞뒤에 "발견 건수 확인 → 이전 실행 → 결과 건수 확인" 리포트만 씌운 것이다 — 실제
  // 복사/병합 로직(§2~4 CASE A/B/C, §15 빈 값 가드)은 손대지 않았다.
  var KEY_LABELS = {
    companies: '업체(고객카드 포함)',
    customerActivities: '전화·활동기록',
    customerDocuments: '서류 메타데이터(첨부파일 정보)',
    memos: '메모(공용 업체메모 + 개인 포스트잇, 현재 사용자 기준)',
    tasks: '처리할 업무(개인, 현재 사용자 기준)',
    todos: '내 할 일(개인, 현재 사용자 기준)',
    knowledge: '지식/Q&A',
    favorites: '바로가기',
    calls: '전화기록(시공사+아파트 문의 통합)',
    library: '자료실',
    calendar: '일정(개인, 현재 사용자 기준)'
  };
  function countOf(key, val){
    if(val == null) return 0;
    if(key === 'knowledge'){
      var items = Array.isArray(val.items) ? val.items.length : 0;
      var contacts = Array.isArray(val.contacts) ? val.contacts.length : 0;
      return items + contacts;
    }
    return Array.isArray(val) ? val.length : 0;
  }
  // 발견된 로컬 데이터 건수 — 읽기 전용, 아무 것도 쓰지 않는다.
  function discoverLocalCounts(){
    var keys = window.SHIN2_SYNC_KEYS || {};
    var rows = [];
    Object.keys(keys).forEach(function(key){
      var raw = null, val = null;
      try{ raw = localStorage.getItem(keys[key]); val = raw ? JSON.parse(raw) : null; }catch(e){}
      rows.push({ key: key, label: KEY_LABELS[key] || key, storageKey: keys[key], count: countOf(key, val) });
    });
    return rows;
  }
  function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function openMigrationDiscoverModal(){
    var rows = discoverLocalCounts();
    var total = rows.reduce(function(s,r){ return s + r.count; }, 0);
    var overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    function rowHtml(r){
      return '<div class="lib-bulk-result-row"><span class="lib-bulk-result-name">' + esc2(r.label) + '</span>' +
        '<span class="lib-bulk-result-err ' + (r.count>0?'ok':'') + '">' + r.count + '건</span></div>';
    }
    overlay.innerHTML =
      '<div class="kb-modal">' +
        '<div class="kb-modal-title">이 브라우저(이 PC)에서 발견된 데이터</div>' +
        '<div class="lib-bulk-summary">읽기만 합니다 — 아직 아무 것도 클라우드로 보내지 않았습니다. 총 ' + total + '건</div>' +
        '<div class="lib-bulk-result-list">' + rows.map(rowHtml).join('') + '</div>' +
        '<div class="kb-form-actions">' +
          '<div class="kb-form-actions-right">' +
            '<button type="button" class="kb-text-action" id="migCancelBtn">취소</button>' +
            '<button type="button" class="ai-run-btn" id="migConfirmBtn">클라우드로 이전</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#migCancelBtn').addEventListener('click', function(){ overlay.remove(); });
    overlay.querySelector('#migConfirmBtn').addEventListener('click', function(){
      overlay.remove();
      runMigrationWithReport(rows);
    });
  }

  function runMigrationWithReport(beforeRows){
    if(!window.__shin2CloudSync || typeof window.__shin2CloudSync.startInitialSync !== 'function'){
      setStatus('Firebase 연결 준비 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    var overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = '<div class="kb-modal"><div class="kb-modal-title">클라우드로 이전 중...</div><div class="lib-bulk-summary" id="migProgressText">시작합니다...</div></div>';
    document.body.appendChild(overlay);
    var progressEl = overlay.querySelector('#migProgressText');
    cloudBtn.disabled = true;
    window.__shin2CloudSync.startInitialSync(function(progress){
      if(progressEl) progressEl.textContent = '처리 중: ' + (KEY_LABELS[progress.key] || progress.key) + ' (' + progress.case + ')';
    }).then(function(results){
      // 완료 직후 실제 localStorage를 다시 읽어(§15 로직이 이미 로컬에 최종 병합 결과를 써둔
      // 상태) 이전 건수와 비교한다 — 지어낸 값이 아니라 실제로 다시 읽은 값이다.
      var afterRows = discoverLocalCounts();
      var byKey = {}; afterRows.forEach(function(r){ byKey[r.key] = r; });
      var caseByKey = {}; (results||[]).forEach(function(r){ caseByKey[r.key] = r.case; });
      function rowHtml(before){
        var after = byKey[before.key] || before;
        var c = caseByKey[before.key] || '?';
        var caseLabel = { A:'로컬→클라우드 업로드', B:'클라우드→로컬 수신', C:'양쪽 병합', 'skip-empty':'둘 다 비어있음(건드리지 않음)' }[c] || c;
        return '<div class="lib-bulk-result-row"><span class="lib-bulk-result-name">' + esc2(before.label) + '</span>' +
          '<span class="lib-bulk-result-err ok">이전 ' + before.count + '건 → 이후 ' + after.count + '건 (' + caseLabel + ')</span></div>';
      }
      overlay.innerHTML =
        '<div class="kb-modal">' +
          '<div class="kb-modal-title">클라우드 이전 결과</div>' +
          '<div class="lib-bulk-result-list">' + beforeRows.map(rowHtml).join('') + '</div>' +
          '<div class="kb-form-actions"><div class="kb-form-actions-right"><button type="button" class="ai-run-btn" id="migDoneBtn">확인</button></div></div>' +
        '</div>';
      overlay.querySelector('#migDoneBtn').addEventListener('click', function(){ overlay.remove(); location.reload(); });
      setStatus('동기화 완료');
      cloudBtn.disabled = false;
    }).catch(function(err){
      console.error('[한솔2/Firebase] 최초 동기화 실패', err);
      overlay.remove();
      setStatus('동기화 중 오류가 발생했습니다. 로컬 데이터는 변경되지 않았습니다.');
      cloudBtn.disabled = false;
    });
  }

  function collectBackupData(){
    var keys = window.SHIN2_SYNC_KEYS || {};
    var data = {};
    Object.keys(keys).forEach(function(k){
      try{ var raw = localStorage.getItem(keys[k]); data[k] = raw ? JSON.parse(raw) : null; }catch(e){ data[k] = null; }
    });
    // 계정 비밀번호는 민감정보라 절대 복호화해서 넣지 않는다 — shin2-accounts-vault에 저장된
    // 값은 이미 AES-GCM cipher/iv 형태(평문 아님)이므로, 그 원본 그대로만 포함한다.
    var vaultRaw = null;
    try{ vaultRaw = localStorage.getItem(ACCT_KEY); }catch(e){}
    return {
      app: 'hansol2',
      exportedAt: new Date().toISOString(),
      data: data,
      accountsVaultEncrypted: vaultRaw ? JSON.parse(vaultRaw) : null // salt/check/{cipher,iv} — 암호문 그대로
    };
  }

  backupBtn && backupBtn.addEventListener('click', function(){
    try{
      var payload = collectBackupData();
      var json = JSON.stringify(payload, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var now = new Date();
      var pad = function(n){ return String(n).padStart(2,'0'); };
      a.href = url;
      a.download = 'hansol2-backup-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      setStatus('백업 파일을 저장했습니다.');
    }catch(e){
      console.error('[한솔2] 백업 실패', e);
      setStatus('백업 중 오류가 발생했습니다.');
    }
  });

  restoreBtn && restoreBtn.addEventListener('click', function(){
    restoreFile.value = '';
    restoreFile.click();
  });

  restoreFile && restoreFile.addEventListener('change', function(){
