<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHIN 2</title>
<style>
  :root{
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --navy: #1E2A4A;
    --text: #1F2937;
    --text-muted: #6B7280;
    --line: #E5E7EB;
    --sidebar-w: 216px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--bg);
    padding:24px 14px;
    border-right:1px solid var(--line);
  }
  .brand{ padding:4px 10px 22px; }
  .brand-main{ font-size:16px; font-weight:700; color:var(--text); letter-spacing:0.2px; }
  .brand-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:7px;
    font-size:14px;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{ flex:0 0 auto; color:var(--text-muted); }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); font-weight:600; }
  .nav-item.active svg{ color:var(--navy); }
  .nav-item:hover:not(.active){ background:#F0F1F4; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:32px 36px 40px;
  }
  .main-inner{
    max-width:1160px;
    margin:0 auto;
  }

  .search-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }
  .search-box{
    width:100%;
    max-width:680px;
    display:flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .search-box:focus-within{
    border-color:#C7CEDB;
  }
  .search-box svg{ flex:0 0 auto; color:var(--text-muted); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:transparent;
  }
  .search-box input::placeholder{ color:#9CA3AF; }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:10px;
  }

  /* ---------- Home content column (search + AI 문구정리 share the same left edge) ---------- */
  .home-col{
    max-width:800px;
    margin:0 auto;
  }
  .search-wrap{ justify-content:flex-start; }
  .search-box{ max-width:680px; }
  .hint{ text-align:left; }

  /* ---------- AI 문구정리 ---------- */
  .ai-section{
    margin-top:22px;
    max-width:800px;
  }
  .ai-title{
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .ai-subtitle{
    font-size:12px;
    color:var(--text-muted);
    margin-top:3px;
    margin-bottom:12px;
  }
  .ai-textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    line-height:1.5;
    outline:none;
  }
  .ai-textarea:focus{ border-color:#C7CEDB; }
  .ai-textarea::placeholder{ color:#9CA3AF; }

  .ai-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
  }
  .ai-types{ display:flex; gap:6px; }
  .ai-type-btn{
    height:30px;
    padding:0 12px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-type-btn:hover{ background:#F0F1F4; }
  .ai-type-btn.active{
    background:#EEF1F8;
    border-color:#EEF1F8;
    color:var(--navy);
    font-weight:600;
  }
  .ai-run-btn{
    height:32px;
    padding:0 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .ai-run-btn:hover{ opacity:0.92; }
  .ai-run-btn:disabled{ opacity:0.6; cursor:default; }

  .ai-error{
    margin-top:10px;
    font-size:12.5px;
    color:#B91C1C;
  }

  .ai-result{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .ai-result-label{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .ai-result-block + .ai-result-block{ margin-top:14px; }
  .ai-result-heading{
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .ai-result-text{
    white-space:pre-wrap;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
  }
  .ai-result-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .ai-copy-btn{
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-copy-btn:hover{ background:#F0F1F4; }
  .ai-new-btn{
    margin-top:14px;
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-new-btn:hover{ background:#F0F1F4; }

  /* ---------- API key modal ---------- */
  .ai-modal-overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .ai-modal{
    width:340px;
    background:var(--surface);
    border-radius:10px;
    border:1px solid var(--line);
    padding:20px;
  }
  .ai-modal-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .ai-modal-desc{ font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .ai-modal input{
    width:100%;
    height:36px;
    padding:0 10px;
    font-size:13px;
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .ai-modal input:focus{ border-color:#C7CEDB; }
  .ai-modal-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top:14px;
  }

  /* ---------- 계정 (accounts) ---------- */
  .accounts-view{ max-width:1160px; margin:0 auto; }

  .acct-unlock-wrap{
    display:flex;
    justify-content:center;
    padding-top:60px;
  }
  .acct-unlock-box{
    width:100%;
    max-width:320px;
    text-align:center;
  }
  .acct-unlock-title{ font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .acct-unlock-desc{ font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:16px; }
  .acct-unlock-input{
    width:100%;
    height:38px;
    padding:0 12px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    box-sizing:border-box;
  }
  .acct-unlock-input:focus{ border-color:#C7CEDB; }
  .acct-unlock-error{ font-size:12px; color:#B91C1C; margin-top:8px; text-align:left; }
  .acct-unlock-btn{ width:100%; margin-top:12px; }

  .acct-main-wrap{ display:flex; gap:0; align-items:flex-start; }
  .acct-list-col{ width:40%; flex:0 0 40%; min-width:0; padding-right:22px; }
  .acct-detail-col{
    width:60%; flex:0 0 60%; min-width:0;
    padding-left:22px;
    border-left:1px solid var(--line);
  }

  .acct-header{ display:flex; align-items:center; justify-content:space-between; }
  .acct-title{ font-size:16px; font-weight:700; color:var(--text); }
  .acct-add-btn{
    height:26px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .acct-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .acct-subtitle{ font-size:12px; color:var(--text-muted); margin-top:4px; margin-bottom:14px; }

  .acct-search-box{ max-width:none; height:36px; margin-bottom:10px; }

  .acct-list{ }
  .acct-empty{ font-size:12.5px; color:var(--text-muted); padding:14px 4px; }
  .acct-row{
    display:flex;
    align-items:center;
    gap:10px;
    height:46px;
    padding:0 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    border-radius:6px;
  }
  .acct-row:hover{ background:#F0F1F4; }
  .acct-row.active{ background:#EEF1F8; }
  .acct-row-site{ font-size:13.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-row-user{ font-size:12.5px; color:var(--text-muted); flex:0 0 auto; }
  .acct-row-chevron{ flex:0 0 auto; color:var(--text-muted); font-size:13px; }

  .acct-detail-empty{ font-size:12.5px; color:var(--text-muted); padding:8px 4px; }

  .acct-detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .acct-detail-title{ font-size:15px; font-weight:700; color:var(--text); }
  .acct-detail-close{
    border:none; background:transparent; cursor:pointer;
    font-size:16px; line-height:1; color:var(--text-muted); padding:2px 4px;
  }
  .acct-detail-close:hover{ color:var(--text); }

  .acct-field{ margin-bottom:16px; }
  .acct-field-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-field-row{ display:flex; align-items:center; gap:10px; }
  .acct-field-value{
    font-size:13.5px; color:var(--text);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acct-field-memo{ font-size:13.5px; color:var(--text); line-height:1.5; white-space:pre-wrap; }
  .acct-link-btn{
    flex:0 0 auto;
    border:none; background:transparent; cursor:pointer;
    font-size:12px; color:var(--text-muted); padding:2px 2px;
  }
  .acct-link-btn:hover{ color:var(--navy); }
  .acct-copied{ font-size:11px; color:var(--navy); }

  .acct-detail-actions{
    display:flex; gap:16px;
    margin-top:6px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .acct-text-action{
    border:none; background:transparent; cursor:pointer;
    font-size:12.5px; color:var(--text-muted); padding:2px 0;
  }
  .acct-text-action:hover{ color:var(--text); }
  .acct-text-action.danger:hover{ color:#B91C1C; }
  .acct-confirm-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }

  .acct-form-field{ margin-bottom:14px; }
  .acct-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-form-field input, .acct-form-field textarea{
    width:100%;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .acct-form-field input:focus, .acct-form-field textarea:focus{ border-color:#C7CEDB; }
  .acct-form-field textarea{ min-height:60px; resize:vertical; }
  .acct-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .acct-form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-main">SHIN</div>
      <div class="brand-sub">업무 비서</div>
    </div>
    <nav class="nav">
      <button type="button" class="nav-item active" id="navHome">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
        <span>홈</span>
      </button>
      <button type="button" class="nav-item" id="navAccounts">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16.5 5.5l3 3M13.5 8.5l2.5 2.5"/></svg>
        <span>계정</span>
      </button>
    </nav>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="home-col" id="homeView">
        <div class="search-wrap">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" placeholder="업체, 업무, 자료 검색" />
          </div>
        </div>
        <div class="hint">SHIN — 필요한 내용을 검색해서 시작하세요.</div>

        <div class="ai-section">
          <div class="ai-title">AI 문구정리</div>
          <div class="ai-subtitle">업무 중 메모한 내용을 그대로 입력하세요.</div>
          <textarea id="aiInput" class="ai-textarea" placeholder="전화내용, 메모, 단어를 편하게 입력하세요.&#10;예) 신광건설 / 질문서 회신 / 1차미팅 빨리 원함"></textarea>
          <div class="ai-toolbar">
            <div class="ai-types" id="aiTypes">
              <button type="button" class="ai-type-btn active" data-type="report">보고용</button>
              <button type="button" class="ai-type-btn" data-type="kakao">카톡용</button>
              <button type="button" class="ai-type-btn" data-type="mail">메일용</button>
            </div>
            <button type="button" id="aiRunBtn" class="ai-run-btn">AI로 정리</button>
          </div>
          <div id="aiError" class="ai-error" style="display:none;"></div>
          <div id="aiResult"></div>
        </div>
      </div>

      <div class="accounts-view" id="accountsView" style="display:none;">
        <div class="acct-unlock-wrap" id="acctUnlockWrap">
          <div class="acct-unlock-box">
            <div class="acct-unlock-title">계정 잠금 해제</div>
            <div class="acct-unlock-desc" id="acctUnlockDesc">마스터 비밀번호를 입력하세요. 이 비밀번호는 어디에도 저장되지 않으며, 잊어버리면 저장된 비밀번호를 복구할 수 없습니다.</div>
            <input type="password" id="acctMasterInput" class="acct-unlock-input" placeholder="마스터 비밀번호" autocomplete="off" />
            <div class="acct-unlock-error" id="acctUnlockError" style="display:none;"></div>
            <button type="button" id="acctUnlockBtn" class="ai-run-btn acct-unlock-btn">열기</button>
          </div>
        </div>

        <div class="acct-main-wrap" id="acctMainWrap" style="display:none;">
          <div class="acct-list-col">
            <div class="acct-header">
              <div class="acct-title">계정</div>
              <button type="button" id="acctAddBtn" class="acct-add-btn">+ 추가</button>
            </div>
            <div class="acct-subtitle">자주 사용하는 사이트의 로그인 정보를 관리합니다.</div>
            <div class="search-box acct-search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="text" id="acctSearchInput" placeholder="사이트 검색" />
            </div>
            <div id="acctList" class="acct-list"></div>
          </div>
          <div class="acct-detail-col" id="acctDetailCol">
            <div class="acct-detail-empty">목록에서 계정을 선택하세요.</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  // SHIN(기존)과 동일한 localStorage 키를 그대로 재사용한다(같은 origin이므로 이미 공유됨).
  // 이 키 외에는 SHIN 2 코드가 어떤 기존 localStorage 키도 읽거나 쓰지 않는다.
  const OPENAI_KEY_STORAGE = 'work-guide-openai-key';
  const POUR_PREFIX = '[POUR공법]';

  function getApiKey(){
    return localStorage.getItem(OPENAI_KEY_STORAGE) || '';
  }
  function saveApiKey(key){
    localStorage.setItem(OPENAI_KEY_STORAGE, key);
  }

  function promptForApiKey(onSaved){
    const overlay = document.createElement('div');
    overlay.className = 'ai-modal-overlay';
    overlay.innerHTML = `
      <div class="ai-modal">
        <div class="ai-modal-title">OpenAI API 키 등록</div>
        <div class="ai-modal-desc">AI 문구정리를 사용하려면 최초 1회 API 키가 필요합니다.</div>
        <input type="text" id="aiKeyInput" placeholder="sk-..." />
        <div class="ai-modal-actions">
          <button type="button" class="ai-copy-btn" id="aiKeyCancel">취소</button>
          <button type="button" class="ai-run-btn" id="aiKeySave">저장</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#aiKeyInput');
    input.focus();
    function close(){ overlay.remove(); }
    overlay.querySelector('#aiKeyCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    overlay.querySelector('#aiKeySave').addEventListener('click', ()=>{
      const key = input.value.trim();
      if(!key) return;
      saveApiKey(key);
      close();
      onSaved(key);
    });
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ overlay.querySelector('#aiKeySave').click(); }
    });
  }

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const PROTECTED_FIELDS = '업체명, 아파트명, 전화번호, 담당자 이름, 직급, 날짜, 시간, 금액, 공종, 공법명, 특허번호, 주소, 면적, 요청사항, 회신 여부, 일정';

  const AI_RULES = `절대 규칙:
1. 입력에 있는 사실은 절대 삭제하지 마.
2. 입력에 없는 사실을 새로 지어내지 마.
3. 숫자, 날짜, 전화번호, 회사명, 아파트/건물명, 사람 이름은 절대 바꾸지 마.
4. 모르는 정보를 추측해서 채우지 마.
5. 뒤섞인 입력은 읽기 좋은 순서로 재배열해.
6. 진짜 중복된 표현만 자연스럽게 정리해.
7. 오타, 띄어쓰기, 맞춤법을 고쳐.
8. 아래 항목처럼 보이는 값이 입력에 있으면 절대 빠뜨리지 말고 그대로 반영해: ${PROTECTED_FIELDS}.
문체(어투)만 요청된 용도에 맞게 바꾸고, 내용(사실)은 사용자가 적은 그대로 유지해.`;

  function buildPrompt(type, text){
    if(type === 'kakao'){
      return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 카카오톡으로 보낼 업무 메시지로 정리해줘.
- 캐주얼하지만 예의 바른 톤으로, 짧고 자연스럽게, 모바일에서 읽기 편하도록 필요하면 줄바꿈해줘.
- 메모 내용상 고객/거래처에게 보내는 건지 내부 동료에게 보내는 건지 유추할 수 있으면 그에 맞게, 애매하면 무난하고 정중한 비즈니스 톤으로 작성해.
- 입력에 없는 직함/호칭을 새로 만들어내지 마.

${AI_RULES}

메모:
"""
${text}
"""

다른 설명 없이 정리된 메시지 문구만 출력해.`;
    }
    if(type === 'mail'){
      return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 바탕으로 업무 이메일의 제목과 본문을 작성해줘.
- 제목은 핵심 업무 내용을 간결하게 요약해.
- 본문은 "안녕하세요."로 시작하고, 메모 내용을 자연스러운 이메일 문장으로 풀어 쓰고, "확인 부탁드립니다." "감사합니다." 등으로 자연스럽게 마무리해도 좋아(형식은 유연하게).
- 반드시 아래 형식 그대로 출력해(다른 설명 금지):
제목: (제목 내용)
본문:
(본문 내용)

${AI_RULES}

메모:
"""
${text}
"""`;
    }
    // report (보고용, 기본값)
    return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 사내 업무보고용 문구로 정리해줘.
- 모든 사실을 보존하면서 읽기 좋은 순서로 재배열해.
- 중복 표현은 제거하고, 오타/맞춤법을 고치고, 불필요한 군더더기는 빼줘.
- 사내 메신저에 바로 붙여넣을 수 있는 정중하고 간결한 보고체 문장으로 작성해.

${AI_RULES}

메모:
"""
${text}
"""

다른 설명 없이 정리된 보고 문구만 출력해.`;
  }

  async function callOpenAI(apiKey, prompt){
    let res;
    try{
      res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model:'gpt-4o-mini',
          messages:[
            {role:'system', content:'너는 건설/시공 업무를 돕는 한국어 비서야. 항상 정중한 존댓말로, 요청받은 형식만 정확히 출력해.'},
            {role:'user', content: prompt}
          ],
          temperature:0.5
        })
      });
    } catch(networkErr){
      // fetch() 자체가 reject된 경우: 네트워크 단절 또는 CORS 정책에 의해 브라우저가
      // 요청/응답을 아예 막은 경우가 대부분이다(응답 status조차 받지 못함).
      const e = new Error('AI request network/CORS failure: ' + (networkErr && networkErr.message));
      e.kind = 'network';
      e.original = networkErr;
      throw e;
    }
    if(!res.ok){
      let detail = '';
      try{ detail = (await res.json()).error?.message || ''; }catch(e){}
      const e = new Error(`AI request failed: ${res.status} ${detail}`);
      e.kind = 'http';
      e.status = res.status;
      e.detail = detail;
      throw e;
    }
    let data;
    try{
      data = await res.json();
    } catch(parseErr){
      const e = new Error('AI request invalid JSON response: ' + (parseErr && parseErr.message));
      e.kind = 'parse';
      throw e;
    }
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content){
      const e = new Error('AI request empty response content');
      e.kind = 'empty';
      throw e;
    }
    return content.trim();
  }

  // 메일용 결과 파싱: "제목: ...\n본문:\n..." 형식을 분리한다.
  function parseMailResult(raw){
    const m = raw.match(/제목\s*[:：]\s*([^\n]*)\n+본문\s*[:：]\s*([\s\S]*)/);
    let subject, body;
    if(m){
      subject = m[1].trim();
      body = m[2].trim();
    } else {
      const lines = raw.split('\n');
      subject = (lines[0] || '').trim();
      body = lines.slice(1).join('\n').trim();
    }
    return { subject, body };
  }

  // [POUR공법] 접두사를 정확히 1회만 붙인다(이미 붙어있으면 중복 방지).
  function applyPourPrefix(subject){
    const s = (subject || '').trim();
    if(s.indexOf(POUR_PREFIX) === 0) return s;
    return POUR_PREFIX + ' ' + s;
  }

  const state = { type:'report', loading:false, error:'', result:null };

  const inputEl = document.getElementById('aiInput');
  const runBtn = document.getElementById('aiRunBtn');
  const errorEl = document.getElementById('aiError');
  const resultEl = document.getElementById('aiResult');
  const typesWrap = document.getElementById('aiTypes');

  typesWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ai-type-btn');
    if(!btn) return;
    state.type = btn.getAttribute('data-type');
    typesWrap.querySelectorAll('.ai-type-btn').forEach(b=>b.classList.toggle('active', b === btn));
  });

  function setError(msg){
    state.error = msg || '';
    errorEl.style.display = state.error ? 'block' : 'none';
    errorEl.textContent = state.error;
  }

  function setLoading(loading){
    state.loading = loading;
    runBtn.disabled = loading;
    runBtn.textContent = loading ? '정리 중...' : 'AI로 정리';
  }

  function renderResult(){
    if(!state.result){ resultEl.innerHTML = ''; return; }
    if(state.result.type === 'mail'){
      const { subject, body } = state.result;
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-heading">제목</div>
            <div class="ai-result-text" id="aiSubjectText">${escapeHtml(subject)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="subject">제목 복사</button>
            </div>
          </div>
          <div class="ai-result-block">
            <div class="ai-result-heading">본문</div>
            <div class="ai-result-text" id="aiBodyText">${escapeHtml(body)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="body">본문 복사</button>
              <button type="button" class="ai-copy-btn" data-copy="all">전체 복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    } else {
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-text" id="aiPlainText">${escapeHtml(state.result.text)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="plain">복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    }
    resultEl.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-copy');
        let text = '';
        if(kind === 'subject') text = state.result.subject;
        else if(kind === 'body') text = state.result.body;
        else if(kind === 'all') text = `제목: ${state.result.subject}\n\n본문:\n${state.result.body}`;
        else text = state.result.text;
        navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
      });
    });
    const newBtn = document.getElementById('aiNewBtn');
    if(newBtn){
      newBtn.addEventListener('click', ()=>{
        inputEl.value = '';
        state.result = null;
        setError('');
        renderResult();
      });
    }
  }

  async function runAi(){
    if(state.loading) return;
    const text = inputEl.value.trim();
    if(!text) return;
    const apiKey = getApiKey();
    if(!apiKey){
      promptForApiKey((key)=> doRun(key, text));
      return;
    }
    doRun(apiKey, text);
  }

  async function doRun(apiKey, text){
    setError('');
    setLoading(true);
    const type = state.type;
    const prompt = buildPrompt(type, text);
    if(!apiKey){
      console.error('[SHIN2/AI] API key missing');
      setError('API 키가 없습니다. 다시 시도하면 키 등록창이 뜹니다.');
      setLoading(false);
      return;
    }
    try{
      const raw = await callOpenAI(apiKey, prompt);
      if(type === 'mail'){
        const { subject, body } = parseMailResult(raw);
        state.result = { type:'mail', subject: applyPourPrefix(subject), body };
      } else {
        state.result = { type, text: raw };
      }
      renderResult();
    } catch(err){
      // 화면에는 간단한 한국어 메시지만, 콘솔에는 실제 원인을 그대로 남긴다(개발/진단용).
      console.error('[SHIN2/AI] request failed:', err);
      if(err && err.kind === 'http' && err.status === 401){
        console.error('[SHIN2/AI] 401 Unauthorized — API 키가 잘못되었거나 만료됨');
        setError('API 키가 올바르지 않습니다. 설정에서 키를 다시 확인해주세요.');
      } else if(err && err.kind === 'http' && err.status === 429){
        console.error('[SHIN2/AI] 429 Too Many Requests — 요청 한도 초과 또는 결제/쿼터 문제');
        setError('요청이 많거나 사용 한도를 초과했습니다. 잠시 후 다시 시도해주세요.');
      } else if(err && err.kind === 'http'){
        console.error('[SHIN2/AI] HTTP', err.status, err.detail);
        setError(`문구 정리에 실패했습니다. (오류 코드 ${err.status})`);
      } else if(err && err.kind === 'network'){
        console.error('[SHIN2/AI] 네트워크/CORS로 요청 자체가 차단됨 — 브라우저가 응답을 받지 못했습니다.', err.original);
        setError('AI 서버에 연결할 수 없습니다. 네트워크 또는 브라우저 보안 정책(CORS) 문제일 수 있습니다.');
      } else {
        setError('문구 정리에 실패했습니다. 다시 시도해주세요.');
      }
    } finally {
      setLoading(false);
    }
  }

  runBtn.addEventListener('click', runAi);
  inputEl.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      runAi();
    }
  });
})();
</script>

<script>
(function(){
  // ---------- 화면 전환 (홈 / 계정) ----------
  const navHome = document.getElementById('navHome');
  const navAccounts = document.getElementById('navAccounts');
  const homeView = document.getElementById('homeView');
  const accountsView = document.getElementById('accountsView');

  function showView(view){
    if(view === 'accounts'){
      homeView.style.display = 'none';
      accountsView.style.display = 'block';
      navHome.classList.remove('active');
      navAccounts.classList.add('active');
    } else {
      homeView.style.display = 'block';
      accountsView.style.display = 'none';
      navAccounts.classList.remove('active');
      navHome.classList.add('active');
    }
  }
  navHome.addEventListener('click', ()=> showView('home'));
  navAccounts.addEventListener('click', ()=> showView('accounts'));

  // ---------- 계정(비밀번호) 보관함 ----------
  // 저장 위치: localStorage['shin2-accounts-vault'] = { salt, check:{cipher,iv}, records:[...] }
  // - salt/check/cipher/iv 는 비밀이 아닌 값(암호문·솔트)이며 이 위치에 저장해도 안전하다.
  // - 마스터 비밀번호 자체와 그로부터 유도된 CryptoKey는 이 IIFE의 변수(vaultKey)에만 존재하며,
  //   localStorage/sessionStorage/IndexedDB/쿠키 등 어디에도 절대 쓰지 않는다. 새로고침하면 사라진다.
  // - 사이트명/URL/아이디/메모는 평문 저장(사용자 스펙: 비밀번호만 암호화하면 된다).
  // - 비밀번호만 AES-GCM으로 암호화한다. 키는 PBKDF2(SHA-256, 150000회, salt=vault 공용 salt)로
  //   마스터 비밀번호에서 유도한다. 레코드마다 별도의 랜덤 IV를 사용한다(볼트 salt는 공용/1개).
  const ACCT_STORAGE_KEY = 'shin2-accounts-vault';
  const PBKDF2_ITERATIONS = 150000;
  const CHECK_PLAINTEXT = 'shin2-vault-check-v1';

  let vaultKey = null;      // CryptoKey, 메모리에만 존재 (세션 한정)
  let vaultMeta = null;     // { salt, check } — localStorage에서 읽은 비밀 아닌 메타데이터
  const acctState = {
    records: [],
    search: '',
    selectedId: null,
    mode: 'view',        // 'view' | 'edit' | 'add'
    revealPassword: false,
    deleteConfirm: false
  };

  function b64FromBuf(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function bufFromB64(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }

  async function deriveKey(password, saltBytes){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
      baseKey,
      { name:'AES-GCM', length:256 },
      false,
      ['encrypt','decrypt']
    );
  }

  async function encryptStr(key, plaintext){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const cipherBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(plaintext));
    return { cipher: b64FromBuf(cipherBuf), iv: b64FromBuf(iv.buffer) };
  }
  async function decryptStr(key, cipherB64, ivB64){
    const iv = new Uint8Array(bufFromB64(ivB64));
    const cipherBuf = bufFromB64(cipherB64);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
    return new TextDecoder().decode(plainBuf);
  }

  function loadVaultRaw(){
    try{
      const raw = localStorage.getItem(ACCT_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!vaultMeta) return;
    const vault = { salt: vaultMeta.salt, check: vaultMeta.check, records: acctState.records };
    localStorage.setItem(ACCT_STORAGE_KEY, JSON.stringify(vault));
  }

  function maskUsername(u){
    if(!u) return '-';
    const prefix = u.slice(0, Math.min(4, u.length));
    return prefix + '****';
  }
  function genId(){
    return 'acct_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  // ---------- 잠금 해제 화면 ----------
  const acctUnlockWrap = document.getElementById('acctUnlockWrap');
  const acctMainWrap = document.getElementById('acctMainWrap');
  const acctUnlockDesc = document.getElementById('acctUnlockDesc');
  const acctMasterInput = document.getElementById('acctMasterInput');
  const acctUnlockError = document.getElementById('acctUnlockError');
  const acctUnlockBtn = document.getElementById('acctUnlockBtn');

  function showUnlockError(msg){
    acctUnlockError.textContent = msg;
    acctUnlockError.style.display = msg ? 'block' : 'none';
  }

  function refreshUnlockDesc(){
    const existing = loadVaultRaw();
    if(existing){
      acctUnlockDesc.textContent = '마스터 비밀번호를 입력하세요. 이 비밀번호는 어디에도 저장되지 않습니다.';
    } else {
      acctUnlockDesc.textContent = '처음 사용하시네요. 사용할 마스터 비밀번호를 정하세요. 이 비밀번호는 어디에도 저장되지 않으며, 잊어버리면 저장된 비밀번호를 복구할 수 없습니다.';
    }
  }

  async function handleUnlock(){
    const pw = acctMasterInput.value;
    showUnlockError('');
    if(!pw) return;
    acctUnlockBtn.disabled = true;
    try{
      const existing = loadVaultRaw();
      if(!existing){
        // 최초 사용: 새 볼트 생성
        const saltBytes = crypto.getRandomValues(new Uint8Array(16));
        const key = await deriveKey(pw, saltBytes);
        const check = await encryptStr(key, CHECK_PLAINTEXT);
        vaultMeta = { salt: b64FromBuf(saltBytes.buffer), check };
        vaultKey = key;
        acctState.records = [];
        persist();
        unlockSuccess();
        return;
      }
      const saltBytes = new Uint8Array(bufFromB64(existing.salt));
      const key = await deriveKey(pw, saltBytes);
      let ok = false;
      try{
        const decoded = await decryptStr(key, existing.check.cipher, existing.check.iv);
        ok = (decoded === CHECK_PLAINTEXT);
      }catch(e){ ok = false; }
      if(!ok){
        showUnlockError('비밀번호가 올바르지 않습니다.');
        return;
      }
      vaultMeta = { salt: existing.salt, check: existing.check };
      vaultKey = key;
      acctState.records = Array.isArray(existing.records) ? existing.records : [];
      unlockSuccess();
    } finally {
      acctUnlockBtn.disabled = false;
    }
  }

  function unlockSuccess(){
    acctMasterInput.value = '';
    acctUnlockWrap.style.display = 'none';
    acctMainWrap.style.display = 'flex';
    acctState.selectedId = null;
    acctState.mode = 'view';
    renderList();
    renderDetail();
  }

  acctUnlockBtn.addEventListener('click', handleUnlock);
  acctMasterInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleUnlock(); });

  navAccounts.addEventListener('click', ()=>{
    // 계정 화면에 처음 들어오거나, 아직 이번 세션에 잠금 해제하지 않았다면 항상 잠금 화면부터 보여준다.
    if(!vaultKey){
      acctUnlockWrap.style.display = 'flex';
      acctMainWrap.style.display = 'none';
      showUnlockError('');
      refreshUnlockDesc();
      acctMasterInput.focus();
    }
  });

  // ---------- 목록 ----------
  const acctList = document.getElementById('acctList');
  const acctSearchInput = document.getElementById('acctSearchInput');
  const acctAddBtn = document.getElementById('acctAddBtn');
  const acctDetailCol = document.getElementById('acctDetailCol');

  function filteredRecords(){
    const q = acctState.search.trim().toLowerCase();
    if(!q) return acctState.records;
    return acctState.records.filter(r=>
      (r.site||'').toLowerCase().includes(q) ||
      (r.username||'').toLowerCase().includes(q)
    );
  }

  function renderList(){
    const items = filteredRecords();
    if(items.length === 0){
      acctList.innerHTML = `<div class="acct-empty">${acctState.records.length === 0 ? '저장된 계정이 없습니다. 오른쪽 위 + 추가로 등록하세요.' : '검색 결과가 없습니다.'}</div>`;
      return;
    }
    acctList.innerHTML = items.map(r=>`
      <div class="acct-row${r.id === acctState.selectedId ? ' active' : ''}" data-id="${escapeAttr(r.id)}">
        <div class="acct-row-site">${escapeHtml2(r.site)}</div>
        <div class="acct-row-user">${escapeHtml2(maskUsername(r.username))}</div>
        <div class="acct-row-chevron">&#8250;</div>
      </div>
    `).join('');
    acctList.querySelectorAll('.acct-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        acctState.selectedId = row.getAttribute('data-id');
        acctState.mode = 'view';
        acctState.revealPassword = false;
        acctState.deleteConfirm = false;
        renderList();
        renderDetail();
      });
    });
  }

  acctSearchInput.addEventListener('input', ()=>{
    acctState.search = acctSearchInput.value;
    renderList();
  });

  acctAddBtn.addEventListener('click', ()=>{
    acctState.selectedId = null;
    acctState.mode = 'add';
    renderList();
    renderDetail();
  });

  function escapeHtml2(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escapeAttr(str){ return escapeHtml2(str); }

  // ---------- 상세 패널 ----------
  function getSelectedRecord(){
    return acctState.records.find(r=> r.id === acctState.selectedId) || null;
  }

  function showCopied(btn){
    const old = btn.nextElementSibling && btn.nextElementSibling.classList.contains('acct-copied') ? btn.nextElementSibling : null;
    if(old) old.remove();
    const span = document.createElement('span');
    span.className = 'acct-copied';
    span.textContent = '복사됨';
    btn.insertAdjacentElement('afterend', span);
    setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
  }

  function copyText(text, btn){
    if(!navigator.clipboard){ return; }
    navigator.clipboard.writeText(text).then(()=> showCopied(btn)).catch(()=>{});
  }

  async function renderDetail(){
    if(acctState.mode === 'add'){
      renderFormMode(null);
      return;
    }
    const rec = getSelectedRecord();
    if(!rec){
      acctDetailCol.innerHTML = `<div class="acct-detail-empty">목록에서 계정을 선택하세요.</div>`;
      return;
    }
    if(acctState.mode === 'edit'){
      renderFormMode(rec);
      return;
    }
    // view mode
    let pwDisplay = '••••••••••';
    if(acctState.revealPassword && rec.cipher){
      try{ pwDisplay = await decryptStr(vaultKey, rec.cipher, rec.iv); }
      catch(e){ pwDisplay = '(복호화 실패)'; }
    } else if(!rec.cipher){
      pwDisplay = '-';
    }

    const urlRowHtml = rec.url ? `
      <div class="acct-field">
        <div class="acct-field-label">사이트</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.url)}</div>
          <a class="acct-link-btn" href="${escapeAttr(rec.url)}" target="_blank" rel="noopener noreferrer">열기</a>
        </div>
      </div>` : '';
    const memoRowHtml = rec.memoPlain ? `
      <div class="acct-field">
        <div class="acct-field-label">메모</div>
        <div class="acct-field-memo">${escapeHtml2(rec.memoPlain)}</div>
      </div>` : '';

    acctDetailCol.innerHTML = `
      <div class="acct-detail-head">
        <div class="acct-detail-title">${escapeHtml2(rec.site)}</div>
        <button type="button" class="acct-detail-close" id="acctCloseBtn">&times;</button>
      </div>
      <div class="acct-field">
        <div class="acct-field-label">아이디</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.username || '-')}</div>
          <button type="button" class="acct-link-btn" id="acctCopyUser">복사</button>
        </div>
      </div>
      <div class="acct-field">
        <div class="acct-field-label">비밀번호</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(pwDisplay)}</div>
          ${rec.cipher ? `<button type="button" class="acct-link-btn" id="acctCopyPw">복사</button><button type="button" class="acct-link-btn" id="acctTogglePw">${acctState.revealPassword ? '숨기기' : '보기'}</button>` : ''}
        </div>
      </div>
      ${urlRowHtml}
      ${memoRowHtml}
      <div class="acct-detail-actions" id="acctActionsRow">
        <button type="button" class="acct-text-action" id="acctEditBtn">수정</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteBtn">삭제</button>
      </div>
    `;

    document.getElementById('acctCloseBtn').addEventListener('click', closeDetail);
    document.getElementById('acctCopyUser').addEventListener('click', (e)=> copyText(rec.username || '', e.currentTarget));
    const copyPwBtn = document.getElementById('acctCopyPw');
    if(copyPwBtn){
      copyPwBtn.addEventListener('click', async (e)=>{
        try{
          const pw = await decryptStr(vaultKey, rec.cipher, rec.iv);
          copyText(pw, e.currentTarget);
        }catch(err){}
      });
    }
    const toggleBtn = document.getElementById('acctTogglePw');
    if(toggleBtn){
      toggleBtn.addEventListener('click', ()=>{
        acctState.revealPassword = !acctState.revealPassword;
        renderDetail();
      });
    }
    document.getElementById('acctEditBtn').addEventListener('click', ()=>{
      acctState.mode = 'edit';
      renderDetail();
    });
    document.getElementById('acctDeleteBtn').addEventListener('click', ()=>{
      renderDeleteConfirm(rec);
    });
  }

  function renderDeleteConfirm(rec){
    const actionsRow = document.getElementById('acctActionsRow');
    if(!actionsRow) return;
    actionsRow.innerHTML = `
      <div class="acct-confirm-row">
        <span>정말 삭제하시겠습니까?</span>
        <button type="button" class="acct-text-action" id="acctDeleteCancel">취소</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteConfirm">삭제</button>
      </div>
    `;
    document.getElementById('acctDeleteCancel').addEventListener('click', ()=> renderDetail());
    document.getElementById('acctDeleteConfirm').addEventListener('click', ()=>{
      acctState.records = acctState.records.filter(r=> r.id !== rec.id);
      persist();
      closeDetail();
    });
  }

  function closeDetail(){
    acctState.selectedId = null;
    acctState.mode = 'view';
    acctState.revealPassword = false;
    renderList();
    renderDetail();
  }

  // ---------- 폼 모드 (추가 / 수정) ----------
  function renderFormMode(rec){
    const isNew = !rec;
    acctDetailCol.innerHTML = `
      <div class="acct-detail-head">
        <div class="acct-detail-title">${isNew ? '새 계정' : escapeHtml2(rec.site)}</div>
      </div>
      <div class="acct-form-field">
        <label>사이트명</label>
        <input type="text" id="acctFormSite" value="${isNew ? '' : escapeAttr(rec.site)}" />
      </div>
      <div id="acctFormSiteError" class="acct-form-error" style="display:none;">사이트명을 입력하세요.</div>
      <div class="acct-form-field">
        <label>사이트 주소</label>
        <input type="text" id="acctFormUrl" value="${isNew ? '' : escapeAttr(rec.url || '')}" placeholder="https://" />
      </div>
      <div class="acct-form-field">
        <label>아이디</label>
        <input type="text" id="acctFormUser" value="${isNew ? '' : escapeAttr(rec.username || '')}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>비밀번호</label>
        <input type="text" id="acctFormPw" value="" placeholder="${isNew ? '' : '변경하지 않으려면 비워두지 말고 그대로 다시 입력하세요'}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>메모</label>
        <textarea id="acctFormMemo">${isNew ? '' : escapeHtml2(rec.memoPlain || '')}</textarea>
      </div>
      <div class="acct-form-actions">
        <button type="button" class="acct-text-action" id="acctFormCancel">취소</button>
        <button type="button" class="ai-run-btn" id="acctFormSave">저장</button>
      </div>
    `;

    // 수정 모드에서는 기존 비밀번호를 미리 채워 보여준다(스펙: "현재 값이 채워진 채로").
    if(!isNew && rec.cipher){
      decryptStr(vaultKey, rec.cipher, rec.iv).then(pw=>{
        const pwInput = document.getElementById('acctFormPw');
        if(pwInput) pwInput.value = pw;
      }).catch(()=>{});
    }

    document.getElementById('acctFormCancel').addEventListener('click', ()=>{
      if(isNew){
        acctState.mode = 'view';
        acctState.selectedId = null;
      } else {
        acctState.mode = 'view';
      }
      renderList();
      renderDetail();
    });

    document.getElementById('acctFormSave').addEventListener('click', async ()=>{
      const siteEl = document.getElementById('acctFormSite');
      const site = siteEl.value.trim();
      const errEl = document.getElementById('acctFormSiteError');
      if(!site){
        errEl.style.display = 'block';
        siteEl.focus();
        return;
      }
      errEl.style.display = 'none';
      const url = document.getElementById('acctFormUrl').value.trim();
      const username = document.getElementById('acctFormUser').value.trim();
      const pwVal = document.getElementById('acctFormPw').value;
      const memo = document.getElementById('acctFormMemo').value.trim();

      let cipher = null, iv = null;
      if(pwVal){
        const enc = await encryptStr(vaultKey, pwVal);
        cipher = enc.cipher; iv = enc.iv;
      }

      if(isNew){
        const newRec = { id: genId(), site, url, username, memoPlain: memo, cipher, iv };
        acctState.records.push(newRec);
        persist();
        acctState.selectedId = newRec.id;
      } else {
        rec.site = site;
        rec.url = url;
        rec.username = username;
        rec.memoPlain = memo;
        rec.cipher = cipher;
        rec.iv = iv;
        persist();
      }
      acctState.mode = 'view';
      acctState.revealPassword = false;
      renderList();
      renderDetail();
    });
  }
})();
</script>

</body>
</html>
