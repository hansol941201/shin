<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한솔</title>
<style>
  :root{
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --navy: #1E2A4A;
    --text: #1F2937;
    --text-muted: #6B7280;
    --line: #E5E7EB;
    --sidebar-w: 216px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--bg);
    padding:24px 14px;
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    max-height:100vh; overflow-y:auto;
  }
  /* 하단 빠른메뉴(고객관리카드/일정/Q&A, §좌측 사이드바 하단 통합 라운드) — margin-top:auto로
     사이드바 맨 아래에 붙인다. 기존 상단 메뉴(.nav-item)와 완전히 같은 스타일을 재사용한다 —
     새 버튼/박스 디자인을 만들지 않는다. */
  .nav-bottom{ margin-top:auto; padding-top:10px; display:flex; flex-direction:column; gap:2px; flex:none; }
  .nav-divider{ border-top:1px solid var(--line); margin:0 2px 10px; }
  .nav-badge{
    margin-left:auto; flex:none;
    min-width:16px; height:16px; padding:0 4px;
    font-size:9.5px; font-weight:700; line-height:16px; text-align:center;
    color:var(--navy); background:#E7EAF3; border-radius:8px;
  }
  /* 팀장 일정 승인대기 — 기존 cal-approval-pill 로직/클릭 동작 그대로, 위치만 "일정" 메뉴
     바로 아래 얇은 줄로 옮긴다(§9 과한 박스 금지). 0건이면 기존과 동일하게 완전히 숨겨진다. */
  .nav-approval-row{
    display:flex; align-items:center;
    padding:2px 10px 2px 34px;
    font-size:11px; color:var(--text-muted);
    border:none; background:transparent; cursor:pointer; text-align:left; width:100%;
  }
  .nav-approval-row:hover{ color:#C2255C; }
  .nav-approval-row b{ color:#C2255C; font-weight:700; margin-left:3px; }
  .brand-home-btn{
    display:flex; align-items:center;
    border:none; background:transparent; padding:4px; margin:-4px;
    border-radius:6px; cursor:pointer;
  }
  .brand-home-btn:hover{ background:#F0F1F4; }
  /* NETFORM 로고(§ 사이드바 브랜드 로고 교체 라운드) — 원본 비율(500:91) 그대로, 사이드바
     안에서 읽히는 선에서 컴팩트하게. 찌그러뜨리거나 크롭하지 않는다. */
  .brand-logo{ display:block; width:100%; max-width:150px; height:auto; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:7px;
    font-size:14px;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{ flex:0 0 auto; color:var(--text-muted); }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); font-weight:600; }
  .nav-item.active svg{ color:var(--navy); }
  .nav-item:hover:not(.active){ background:#F0F1F4; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:32px 36px 40px;
  }
  .main-inner{
    max-width:1160px;
    margin:0 auto;
  }

  .search-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }
  .search-box{
    width:100%;
    max-width:680px;
    display:flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .search-box:focus-within{
    border-color:#C7CEDB;
  }
  .search-box svg{ flex:0 0 auto; color:var(--text-muted); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:transparent;
  }
  .search-box input::placeholder{ color:#9CA3AF; }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:10px;
  }

  /* ---------- Home content column (search + AI 문구정리 share the same left edge) ---------- */
  .home-col{
    max-width:800px;
    margin:0 auto;
  }
  .search-wrap{ justify-content:flex-start; }
  .search-box{ max-width:680px; }
  .hint{ text-align:left; }

  /* ---------- AI 문구정리 ---------- */
  .ai-section{
    margin-top:22px;
    max-width:800px;
  }
  .ai-title{
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .ai-head-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:10px;
  }
  .ai-textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    line-height:1.5;
    outline:none;
  }
  .ai-textarea:focus{ border-color:#C7CEDB; }
  .ai-textarea::placeholder{ color:#9CA3AF; }

  .ai-toolbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:10px;
  }
  .ai-types{ display:flex; gap:6px; }
  .ai-type-btn{
    height:30px;
    padding:0 12px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-type-btn:hover{ background:#F0F1F4; }
  .ai-type-btn.active{
    background:#EEF1F8;
    border-color:#EEF1F8;
    color:var(--navy);
    font-weight:600;
  }
  .ai-run-btn{
    height:32px;
    padding:0 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .ai-run-btn:hover{ opacity:0.92; }
  .ai-run-btn:disabled{ opacity:0.6; cursor:default; }

  .ai-error{
    margin-top:10px;
    font-size:12.5px;
    color:#B91C1C;
  }
  .ai-error-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .ai-retry-btn{
    height:24px;
    padding:0 8px;
    font-size:11.5px;
  }

  .ai-result{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .ai-result-label{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .ai-result-block + .ai-result-block{ margin-top:14px; }
  .ai-result-heading{
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .ai-result-text{
    white-space:pre-wrap;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
  }
  .ai-result-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .ai-copy-btn{
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-copy-btn:hover{ background:#F0F1F4; }
  .ai-new-btn{
    margin-top:14px;
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-new-btn:hover{ background:#F0F1F4; }

  /* ---------- API key modal ---------- */
  .ai-modal-overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .ai-modal{
    width:340px;
    background:var(--surface);
    border-radius:10px;
    border:1px solid var(--line);
    padding:20px;
  }
  .ai-modal-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .ai-modal-desc{ font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .ai-modal input{
    width:100%;
    height:36px;
    padding:0 10px;
    font-size:13px;
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .ai-modal input:focus{ border-color:#C7CEDB; }
  .ai-modal-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top:14px;
  }

  /* ---------- 계정 (accounts) — 중앙 팝업 모달 ---------- */
  .acct-popup-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.14); z-index:70;
    display:none; align-items:center; justify-content:center; padding:12px;
  }
  .acct-popup-overlay.open{ display:flex; }
  .acct-popup{
    position:relative;
    width:600px; max-width:calc(100vw - 24px);
    max-height:75vh;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 8px 28px rgba(17,24,39,0.10);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .acct-popup-head{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .acct-popup-title{ font-size:15px; font-weight:700; color:var(--text); }
  .acct-popup-back{
    border:none; background:transparent; cursor:pointer;
    font-size:13px; color:var(--text-muted); padding:2px 2px;
  }
  .acct-popup-back:hover{ color:var(--navy); }
  .acct-popup-close{
    border:none; background:transparent; cursor:pointer;
    font-size:17px; line-height:1; color:var(--text-muted); padding:2px 4px;
  }
  .acct-popup-close:hover{ color:var(--text); }
  .acct-popup-body{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    padding:14px 18px 18px;
  }

  .acct-header{ display:flex; align-items:center; justify-content:space-between; }
  .acct-title{ font-size:16px; font-weight:700; color:var(--text); }
  .acct-add-btn{
    height:26px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .acct-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .acct-subtitle{ font-size:12px; color:var(--text-muted); margin-top:4px; margin-bottom:14px; }

  .acct-search-box{ max-width:none; height:36px; margin-bottom:10px; }

  .acct-pop-list{ }
  .acct-empty{ font-size:12.5px; color:var(--text-muted); padding:14px 4px; }
  .acct-pop-row{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:9px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    border-radius:6px;
  }
  .acct-pop-row:hover{ background:#F0F1F4; }
  .acct-pop-row-site{ font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-pop-row-user{ font-size:12px; color:var(--text-muted); }
  .acct-pop-add-row{ display:flex; justify-content:flex-end; padding-top:10px; }

  .acct-pop-detail-title{ margin-bottom:16px; }

  .acct-detail-empty{ font-size:12.5px; color:var(--text-muted); padding:8px 4px; }

  .acct-detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .acct-detail-title{ font-size:15px; font-weight:700; color:var(--text); }
  .acct-detail-close{
    border:none; background:transparent; cursor:pointer;
    font-size:16px; line-height:1; color:var(--text-muted); padding:2px 4px;
  }
  .acct-detail-close:hover{ color:var(--text); }

  .acct-field{ margin-bottom:16px; }
  .acct-field-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-field-row{ display:flex; align-items:center; gap:10px; }
  .acct-field-value{
    font-size:13.5px; color:var(--text);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acct-field-memo{ font-size:13.5px; color:var(--text); line-height:1.5; white-space:pre-wrap; }
  .acct-link-btn{
    flex:0 0 auto;
    border:none; background:transparent; cursor:pointer;
    font-size:12px; color:var(--text-muted); padding:2px 2px;
  }
  .acct-link-btn:hover{ color:var(--navy); }
  .acct-copied{ font-size:11px; color:var(--navy); }

  .acct-detail-actions{
    display:flex; gap:16px;
    margin-top:6px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .acct-text-action{
    border:none; background:transparent; cursor:pointer;
    font-size:12.5px; color:var(--text-muted); padding:2px 0;
  }
  .acct-text-action:hover{ color:var(--text); }
  .acct-text-action.danger:hover{ color:#B91C1C; }
  .acct-confirm-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }

  .acct-form-field{ margin-bottom:14px; }
  .acct-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-form-field input, .acct-form-field textarea{
    width:100%;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .acct-form-field input:focus, .acct-form-field textarea:focus{ border-color:#C7CEDB; }
  .acct-form-field textarea{ min-height:60px; resize:vertical; }
  .acct-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .acct-form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  .acct-discard-bar{
    position:absolute; left:16px; right:16px; bottom:16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; color:var(--text); background:#F0F1F4; border:1px solid var(--line);
    border-radius:6px; padding:8px 10px;
  }

  /* ---------- 검색 결과 (홈 검색창) ---------- */
  .kb-search-results{ margin-top:14px; }
  .kb-hint-once{ font-size:11px; color:var(--text-muted); margin-bottom:8px; }
  .kb-result-group-label{ font-size:11px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; }
  .kb-result-group-label:first-child{ margin-top:0; }
  .kb-result-card{ padding:12px 0; border-bottom:1px solid var(--line); }
  .kb-result-card[data-co-id]{ cursor:pointer; border-radius:6px; padding-left:4px; padding-right:4px; }
  .kb-result-card[data-co-id]:hover{ background:#F0F1F4; }
  .kb-result-card.top{ padding-top:2px; }
  .kb-result-cat{ font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .kb-memo-result-date{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .kb-result-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .kb-result-card:not(.top) .kb-result-title{ font-size:13px; font-weight:600; }
  .kb-script-line{ font-size:13.5px; line-height:1.9; color:var(--text); }
  .kb-hl{ background:#FEF6B2; padding:0 1px; border-radius:2px; }
  .kb-steps-label, .kb-contact-label, .kb-aftercall-label, .kb-extra-label{ font-size:11px; color:var(--text-muted); margin-top:12px; margin-bottom:3px; }
  .kb-steps-text{ font-size:13px; color:var(--text); line-height:1.6; }
  .kb-contact-line{ font-size:13px; color:var(--text); line-height:1.7; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kb-contact-name{ color:var(--navy); font-weight:600; }
  .kb-copy-btn{ border:none; background:transparent; cursor:pointer; font-size:11.5px; color:var(--text-muted); padding:1px 4px; }
  .kb-copy-btn:hover{ color:var(--navy); }
  .kb-copied-tag{ font-size:11px; color:var(--navy); }
  .kb-aftercall-text, .kb-extra-text, .kb-plain-content{ font-size:13px; color:var(--text-muted); line-height:1.6; white-space:pre-wrap; }
  .kb-aftercall-line{ display:flex; align-items:baseline; gap:7px; }
  .kb-aftercall-line + .kb-aftercall-line{ margin-top:2px; }
  .kb-aftercall-check{ color:#DC2626; font-size:12px; flex:0 0 auto; }
  .kb-contact-result-line{ font-size:13px; color:var(--text); }
  .kb-no-result{ font-size:12.5px; color:var(--text-muted); padding:10px 0; }

  /* ---------- 내 할 일 (사이드바 아이콘 + 우측 슬라이드 패널) ---------- */
  .brand{ padding:6px 10px 16px; display:flex; align-items:center; justify-content:space-between; }
  .todo-icon-btn{
    position:relative; z-index:62; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; padding:0;
    border:none; background:transparent; border-radius:6px; cursor:pointer;
    color:var(--text-muted);
  }
  .todo-icon-btn:hover{ background:#F0F1F4; color:var(--navy); }
  .todo-icon-btn.active{ background:#EEF1F8; color:var(--navy); }
  .todo-icon-badge{
    position:absolute; top:-3px; right:-4px;
    min-width:13px; height:13px; padding:0 3px;
    font-size:9px; font-weight:700; line-height:13px; text-align:center;
    color:var(--navy); background:#E7EAF3; border-radius:7px;
  }

  .todo-panel-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.12); z-index:60; display:none;
  }
  .todo-panel-overlay.open{ display:block; }
  .todo-panel{
    position:fixed; top:0; right:0; height:100vh; width:320px; max-width:88vw;
    background:var(--surface); border-left:1px solid var(--line);
    box-shadow:-6px 0 18px rgba(17,24,39,0.07);
    z-index:61; padding:20px 18px; box-sizing:border-box; overflow-y:auto;
    transform:translateX(100%); transition:transform .16s ease;
  }
  .todo-panel.open{ transform:translateX(0); }
  .todo-header{ display:flex; align-items:center; justify-content:space-between; }
  .todo-title{ font-size:14px; font-weight:700; color:var(--text); }
  .todo-panel-close{ border:none; background:transparent; cursor:pointer; font-size:17px; line-height:1; color:var(--text-muted); padding:2px 4px; }
  .todo-panel-close:hover{ color:var(--text); }
  .todo-add-toggle-row{ margin-top:14px; }
  .todo-add-row{ display:flex; gap:8px; margin-top:14px; }
  .todo-add-row input{
    flex:1; height:32px; padding:0 10px; font-size:13px; font-family:inherit;
    color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:6px; outline:none; box-sizing:border-box;
  }
  .todo-add-row input:focus{ border-color:#C7CEDB; }
  .todo-list{ margin-top:12px; }
  .todo-empty{ font-size:12.5px; color:var(--text-muted); padding:10px 4px; }
  .todo-row{ display:flex; align-items:center; gap:6px; padding:7px 2px; border-bottom:1px solid var(--line); }
  .todo-row:last-child{ border-bottom:none; }
  .todo-checkbox{ flex:0 0 auto; width:15px; height:15px; accent-color:var(--navy); cursor:pointer; }
  .todo-text{ flex:1; min-width:0; font-size:13px; color:var(--text); cursor:text; outline:none; padding:2px 2px; border-radius:3px; overflow-wrap:anywhere; }
  .todo-text:hover{ background:#F0F1F4; }
  .todo-move-btns{ display:flex; gap:2px; flex:0 0 auto; }
  .todo-move-btn{ border:none; background:transparent; cursor:pointer; font-size:11px; color:var(--text-muted); padding:2px 3px; }
  .todo-move-btn:hover{ color:var(--navy); }
  .todo-move-btn:disabled{ opacity:0.3; cursor:default; }
  .todo-del-btn{
    border:none; background:transparent; cursor:pointer; font-size:13px; color:var(--text-muted);
    padding:2px 4px; flex:0 0 auto; opacity:0; transition:opacity .1s ease;
  }
  .todo-row:hover .todo-del-btn{ opacity:1; }
  .todo-del-btn:hover{ color:#B91C1C; }

  /* §고객 진행단계 연동 라운드 */
  .todo-done-toggle-btn{
    border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; font-family:inherit;
    font-size:11px; color:var(--text-muted); padding:3px 8px; margin-left:auto; margin-right:8px;
  }
  .todo-done-toggle-btn.active{ background:#EDF1FA; border-color:var(--navy); color:var(--navy); }
  .todo-main{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px; }
  .todo-tag{ flex:none; font-size:10px; font-weight:700; color:var(--navy); background:#EDF1FA; border-radius:8px; padding:1px 6px; }
  .todo-company-link{ flex:none; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .todo-done-date{ flex:none; font-size:11px; color:var(--text-muted); }
  .todo-row-done .todo-text{ color:var(--text-muted); }

  .todo-toast{
    position:absolute; left:18px; right:18px; bottom:16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; color:var(--text); background:#F0F1F4; border:1px solid var(--line);
    border-radius:6px; padding:8px 10px;
  }
  .todo-toast-undo{ border:none; background:transparent; color:var(--navy); font-weight:700; font-size:12px; cursor:pointer; flex:0 0 auto; }
  .todo-toast-undo:hover{ text-decoration:underline; }

  /* ---------- 지식 페이지 ---------- */
  .kb-view{ max-width:1160px; margin:0 auto; }
  .kb-header{ display:flex; align-items:center; justify-content:space-between; }
  .kb-title{ font-size:16px; font-weight:700; color:var(--text); }
  .kb-add-btn{
    height:26px; padding:0 10px; font-size:12px; font-family:inherit;
    color:var(--text-muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer;
  }
  .kb-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .kb-search-box{ max-width:none; height:36px; margin:14px 0 10px; }

  /* ---------- 자료실(신규) — 회사 공용 자료 저장소 ---------- */
  .lib-header-btns{ display:flex; gap:8px; }
  .lib-banner{ font-size:11.5px; color:var(--text-muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0 4px; }
  /* ---------- 폴더 일괄 등록(신규) ---------- */
  .lib-bulk-summary{ font-size:12.5px; color:var(--text-muted); margin-bottom:12px; }
  .lib-bulk-list{ max-height:360px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin-bottom:12px; }
  .lib-bulk-row{ display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--line); }
  .lib-bulk-row:last-child{ border-bottom:none; }
  .lib-bulk-row.excluded{ opacity:0.5; }
  .lib-bulk-check{ display:flex; align-items:center; gap:6px; flex:0 0 auto; max-width:34%; cursor:pointer; }
  .lib-bulk-chk{ width:15px; height:15px; accent-color:var(--navy); cursor:pointer; flex:none; }
  .lib-bulk-fname{ font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-bulk-title{ flex:1; min-width:0; padding:7px 9px; font-size:12.5px; font-family:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px; outline:none; box-sizing:border-box; }
  .lib-bulk-title:focus{ border-color:#C7CEDB; }
  .lib-bulk-dup{ flex:0 0 auto; font-size:10.5px; color:#B08A00; background:#FEF6B2; padding:2px 7px; border-radius:8px; white-space:nowrap; }
  .lib-bulk-status{ flex:0 0 16px; text-align:center; font-size:12px; }
  .lib-bulk-status.ok{ color:var(--navy); }
  .lib-bulk-status.fail{ color:#B91C1C; }
  .lib-bulk-selcount{ font-size:12px; color:var(--text-muted); }
  .lib-bulk-result-list{ margin-bottom:12px; }
  .lib-bulk-result-row{ display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .lib-bulk-result-row:last-child{ border-bottom:none; }
  .lib-bulk-result-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .lib-bulk-result-err{ font-size:11px; color:#B91C1C; flex:1 1 auto; min-width:0; }
  .lib-bulk-result-err.ok{ color:var(--text-muted); }
  .lib-bulk-result-err.pending{ color:var(--text-muted); }
  .lib-bulk-result-row{ flex-wrap:wrap; }
  .lib-bulk-result-row [data-retry]{ flex:0 0 auto; }
  .lib-recent-label{ font-size:12px; font-weight:600; color:var(--text-muted); margin:16px 0 6px; }
  .lib-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .lib-row:hover{ background:#F0F1F4; }
  .lib-row-fav{ flex:0 0 20px; border:none; background:transparent; cursor:pointer; font-size:15px; line-height:1; color:var(--text-muted); padding:0; }
  .lib-row-fav.active{ color:var(--navy); }
  .lib-row-main{ flex:1; min-width:0; cursor:pointer; }
  .lib-row-title{ font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-row-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-row-actions{ flex:0 0 auto; display:flex; gap:10px; align-items:center; }
  .lib-progress{ height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:8px; }
  .lib-progress-bar{ height:100%; width:0%; background:var(--navy); transition:width .15s linear; }
  .lib-upload-err{ font-size:11.5px; color:#B91C1C; margin-top:6px; }
  .lib-file-note{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .co-text-action:disabled{ opacity:0.4; cursor:default; pointer-events:none; }
  .lib-file-missing{ font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .kb-tabs{ display:flex; gap:4px; margin-bottom:14px; }
  .kb-tab{
    height:28px; padding:0 12px; font-size:12.5px; font-family:inherit;
    color:var(--text-muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer;
  }
  .kb-tab:hover{ background:#F0F1F4; }
  .kb-tab.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  .kb-list{ }
  .kb-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px;
    border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px;
  }
  .kb-row:hover{ background:#F0F1F4; }
  .kb-row-cat{ font-size:11px; color:var(--text-muted); flex:0 0 40px; }
  .kb-row-title{ font-size:13.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb-row-sub{ font-size:12px; color:var(--text-muted); flex:0 0 auto; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- 업체 관리 페이지 ---------- */
  .co-layout{ display:flex; gap:24px; align-items:flex-start; margin-top:6px; }
  .co-list-col{ flex:0 0 40%; max-width:440px; min-width:280px; }
  .co-detail-col{ flex:1 1 60%; min-width:340px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .co-table-head{ display:flex; gap:10px; padding:0 4px 8px; border-bottom:1px solid var(--line); font-size:11px; color:var(--text-muted); }
  .co-row{ display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px; }
  .co-row:hover{ background:#F0F1F4; }
  .co-row.active{ background:#EEF1F8; }
  .co-col-name{ flex:1.2; font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .co-col-contact{ flex:0.8; font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .co-col-phone{ flex:0.9; font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .co-col-docs{ flex:1.1; font-size:12.5px; color:var(--text-muted); min-width:0; }
  .co-docs-count{ color:var(--text); font-weight:600; }
  .co-docs-count.is-complete{ color:var(--navy); }
  .co-docs-missing{ font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
  /* 목록 서류현황 ○/✕ 아이콘(§CSS/마크업 폴리시 라운드) — 2x2 또는 폭이 넉넉하면 한 줄로 자연스럽게
     줄바꿈되도록 flex-wrap만 사용한다(미디어쿼리 분기 없이도 좁은 목록 폭에서 자연히 2줄이 된다). */
  .co-docs-icons{ display:flex; flex-wrap:wrap; row-gap:2px; column-gap:8px; margin-top:2px; }
  .co-doc-icon{ font-size:11.5px; white-space:nowrap; }
  .co-doc-icon.is-held{ color:var(--navy); }
  .co-doc-icon.is-missing{ color:#B08A8A; }

  /* ---------- 협력사 여부 표시(§파트너 대시보드 연동 준비, 신규) ---------- */
  /* partnerStatus: 'partner'(파란 ○) / 'nonPartner'(빨간 ×) / 'unknown'(표시 없음, §6). */
  .co-partner-glyph{ font-weight:700; margin-right:3px; }
  .co-partner-glyph.is-partner{ color:#2563EB; }
  .co-partner-glyph.is-nonpartner{ color:#DC2626; }
  .co-partner-radio-row{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .co-partner-radio-row label{ display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text); cursor:pointer; }
  .co-partner-radio-row input[type="radio"]{ cursor:pointer; }

  /* ---------- 업체 서류 체크현황(§업체 서류) ---------- */
  .co-summary-line{ font-size:12px; color:var(--text-muted); margin:6px 0 10px; }
  .co-filter-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .co-status-filters{ display:flex; gap:4px; }
  .co-filter-btn{
    height:26px; padding:0 10px; font-size:12px; font-family:inherit;
    color:var(--text-muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer;
  }
  .co-filter-btn:hover{ background:#F0F1F4; }
  .co-filter-btn.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  .co-missing-select, .co-sort-select{
    height:26px; padding:0 8px; font-size:12px; font-family:inherit;
    color:var(--text-muted); background:var(--surface); border:1px solid var(--line);
    border-radius:6px; cursor:pointer; outline:none;
  }
  .co-docs-section{ margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .co-docs-title{ font-size:11.5px; color:var(--text-muted); margin-bottom:6px; }
  .co-docs-checks{ display:flex; flex-direction:column; gap:4px; }
  .co-doc-check-row{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text); cursor:pointer; }
  .co-doc-checkbox{ width:15px; height:15px; accent-color:var(--navy); cursor:pointer; }
  .co-docs-progress{ font-size:12px; color:var(--text-muted); margin-top:6px; }

  .co-detail-empty{ font-size:12.5px; color:var(--text-muted); padding:8px 4px; }
  .co-detail-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .co-detail-title{ font-size:15px; font-weight:700; color:var(--text); margin:0; }
  .co-copy-all-btn{
    height:26px; padding:0 10px; font-size:12px; font-weight:600; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer; font-family:inherit; flex:none;
  }
  .co-copy-all-btn:hover{ background:#F0F1F4; color:var(--text); }
  .co-field{ margin-bottom:8px; }
  .co-field-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:3px; }
  .co-field-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .co-field-value{ font-size:13.5px; color:var(--text); line-height:1.5; word-break:break-word; }
  .co-field-copy-btn{
    flex:none; border:none; background:transparent; cursor:pointer; font-size:11.5px; color:var(--text-muted);
    padding:2px 0 2px 8px; font-family:inherit; white-space:nowrap;
  }
  .co-field-copy-btn:hover{ color:var(--navy); text-decoration:underline; }
  .co-field-open-btn{ color:var(--text-muted); font-size:11.5px; text-decoration:none; padding:2px 0 2px 8px; white-space:nowrap; }
  .co-field-open-btn:hover{ color:var(--navy); text-decoration:underline; }
  .co-copied{ font-size:11px; color:var(--navy); padding-left:8px; white-space:nowrap; }
  .co-saved-toast{ font-size:11.5px; color:var(--navy); font-weight:600; }
  .co-memo{ white-space:pre-wrap; }
  .co-detail-actions{ display:flex; gap:16px; margin-top:2px; padding-top:8px; border-top:1px solid var(--line); }
  /* 업체 상세의 메모/전화기록 섹션만 위아래 간격을 줄인다 — 다른 화면(할 일/계정/전화팝업)의
     공용 .shin2-memo-block 스타일은 그대로 둔다(전역 영향 금지). */
  .co-detail-col .shin2-memo-block{ margin-top:10px; padding-top:8px; }
  .co-detail-col .shin2-memo-head{ margin-bottom:6px; }
  .co-detail-col .shin2-memo-empty{ padding:6px 2px; }
  .co-detail-col .shin2-memo-item{ padding:7px 2px; }
  .co-text-action{ border:none; background:transparent; cursor:pointer; font-size:12.5px; color:var(--text-muted); padding:2px 0; font-family:inherit; }
  .co-text-action:hover{ color:var(--text); }
  .co-text-action.danger:hover{ color:#B91C1C; }
  .co-confirm-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }

  /* §14: 업체 상세의 "최근 활동" — CRM(customerActivities)과 완전히 같은 데이터를 요약만 보여준다 */
  .co-activity-block{ margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
  .co-activity-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .co-activity-row{ display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .co-activity-row:last-child{ border-bottom:none; }
  .co-activity-cat{ flex:none; color:var(--navy); font-weight:600; }
  .co-activity-text{ color:var(--text); word-break:break-word; }
  .co-activity-empty{ font-size:12px; color:var(--text-muted); padding:6px 0; }

  .co-form-field{ margin-bottom:14px; }
  .co-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .co-form-field input, .co-form-field textarea{
    width:100%; padding:8px 10px; font-size:13px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; outline:none; box-sizing:border-box;
  }
  .co-form-field input:focus, .co-form-field textarea:focus{ border-color:#C7CEDB; }
  .co-form-field textarea{ min-height:56px; resize:vertical; }
  .co-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .co-form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  .co-badge{ display:inline-block; font-size:10.5px; color:var(--text); background:#FEF6B2; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:middle; }
  .co-dropzone{
    border:1.5px dashed var(--line); border-radius:10px; padding:16px 14px; text-align:center;
    cursor:pointer; margin-bottom:8px; background:var(--surface); transition:border-color .12s, background .12s;
  }
  .co-dropzone:hover{ border-color:#C7CEDB; }
  .co-dropzone.dragover{ border-color:var(--navy); background:#EEF1F8; }
  .co-dropzone-text{ font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .co-dropzone-sub{ font-size:11.5px; color:var(--text-muted); line-height:1.5; }
  .co-ocr-status{ font-size:11.5px; color:var(--text-muted); margin-bottom:8px; display:block; }
  .co-thumbs{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; justify-content:center; }
  .co-thumb-wrap{ text-align:center; }
  .co-thumb-imgbox{ position:relative; width:64px; height:64px; }
  .co-thumb{ width:64px; height:64px; object-fit:cover; border:1px solid var(--line); border-radius:6px; display:block; background:var(--bg); }
  .co-thumb-remove{
    position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%; padding:0;
    border:1px solid var(--line); background:var(--surface); color:var(--text-muted); font-size:12px;
    line-height:16px; cursor:pointer; font-family:inherit;
  }
  .co-thumb-remove:hover{ color:#B91C1C; border-color:#B91C1C; }
  .co-thumb-label{ font-size:10.5px; color:var(--text-muted); margin-top:3px; }
  .co-raw-ocr{
    width:180px; max-width:220px; text-align:left; white-space:pre-wrap; word-break:break-word;
    font-size:11px; color:var(--text-muted); background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; margin-top:4px;
  }
  .co-ocr-note{ font-size:12px; color:var(--text-muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:12px; }
  .co-conflict{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:-6px 0 12px; }
  .co-conflict-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:6px; }
  .co-conflict-opt{ display:block; font-size:12.5px; color:var(--text); margin-bottom:4px; cursor:pointer; }
  .co-dup-box{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12.5px; color:var(--text); }
  .co-dup-actions{ display:flex; gap:14px; margin-top:8px; }

  /* ---------- 지식 등록/수정 모달 ---------- */
  .kb-modal-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.35);
    display:flex; align-items:flex-start; justify-content:center;
    z-index:100; overflow-y:auto; padding:40px 16px;
  }
  .kb-modal{
    width:100%; max-width:520px; background:var(--surface);
    border-radius:10px; border:1px solid var(--line); padding:20px;
  }
  .kb-modal-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:14px; }
  .kb-form-field{ margin-bottom:14px; }
  .kb-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .kb-form-field input, .kb-form-field textarea, .kb-form-field select{
    width:100%; padding:8px 10px; font-size:13px; font-family:inherit;
    color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:6px; outline:none; box-sizing:border-box;
  }
  .kb-form-field input:focus, .kb-form-field textarea:focus, .kb-form-field select:focus{ border-color:#C7CEDB; }
  .kb-form-field textarea{ min-height:56px; resize:vertical; }
  .kb-form-hint{ font-size:11px; color:var(--text-muted); margin-top:3px; }
  .kb-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .kb-form-actions{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; }
  .kb-form-actions-right{ display:flex; gap:8px; }
  .kb-lines-wrap{ display:flex; flex-direction:column; gap:6px; }
  .kb-line-row{ display:flex; gap:6px; align-items:center; }
  .kb-line-row input{ flex:1; }
  .kb-line-remove{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); font-size:14px; padding:2px 6px; }
  .kb-line-remove:hover{ color:#B91C1C; }
  .kb-line-add{ align-self:flex-start; margin-top:2px; border:none; background:transparent; cursor:pointer; font-size:12px; color:var(--text-muted); padding:2px 0; }
  .kb-line-add:hover{ color:var(--navy); }

  .kb-contact-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .kb-chip{
    display:flex; align-items:center; gap:5px; height:24px; padding:0 4px 0 9px;
    background:#EEF1F8; color:var(--navy); border-radius:12px; font-size:12px;
  }
  .kb-chip-x{ border:none; background:transparent; cursor:pointer; color:var(--navy); font-size:13px; padding:2px 6px; line-height:1; }
  .kb-chip-x:hover{ opacity:0.6; }
  .kb-contact-picker{ position:relative; }
  .kb-contact-picker-dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:5;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    max-height:180px; overflow-y:auto; box-shadow:0 4px 14px rgba(17,24,39,0.08);
  }
  .kb-contact-picker-item{ padding:8px 10px; font-size:12.5px; color:var(--text); cursor:pointer; }
  .kb-contact-picker-item:hover{ background:#F0F1F4; }
  .kb-contact-picker-empty{ padding:10px; font-size:12px; color:var(--text-muted); }
  .kb-role-input{ margin-bottom:6px; }
  .kb-add-link-btn{
    border:none; background:transparent; cursor:pointer; font-size:12px; color:var(--text-muted); padding:2px 0;
  }
  .kb-add-link-btn:hover{ color:var(--navy); }

  /* ---------- 빠른 지식 추가(AI 자동분류) ---------- */
  .kb-modal.wide{ max-width:640px; }
  .qa-summary{ font-size:12.5px; color:var(--text-muted); margin-bottom:12px; }
  .qa-fail-banner{ font-size:12.5px; color:#B91C1C; margin-bottom:12px; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .qa-item-card{ border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .qa-item-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .qa-item-head select{ width:auto; flex:0 0 auto; padding:8px 8px; font-size:13px; font-family:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px; }
  .qa-item-head input{ flex:1; padding:8px 10px; font-size:13px; font-family:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px; box-sizing:border-box; }
  .qa-item-body{ margin-top:4px; }
  .qa-dup-note{ font-size:11.5px; color:#B91C1C; margin-top:8px; }
  .qa-dup-actions{ display:flex; gap:12px; margin-top:2px; }
  .qa-link-note{ font-size:11.5px; color:var(--text-muted); margin-top:8px; }
  .qa-original-box{ margin-top:10px; }

  .kb-detail-actions{ display:flex; gap:16px; margin-top:6px; padding-top:14px; border-top:1px solid var(--line); }
  .kb-text-action{ border:none; background:transparent; cursor:pointer; font-size:12.5px; color:var(--text-muted); padding:2px 0; }
  .kb-text-action:hover{ color:var(--text); }
  .kb-text-action.danger:hover{ color:#B91C1C; }
  .kb-confirm-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }

  /* ---------- 사이트 잠금 화면 ---------- */
  .gate-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--bg);
    padding:20px;
  }
  .gate-brand{ font-size:22px; font-weight:700; color:var(--navy); letter-spacing:0.2px; }
  .gate-desc{ font-size:13px; color:var(--text-muted); margin-top:-6px; margin-bottom:4px; text-align:center; }
  .gate-input{
    width:100%; max-width:260px; height:40px; padding:0 14px;
    font-size:14px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    outline:none; box-sizing:border-box; text-align:center;
  }
  .gate-input:focus{ border-color:#C7CEDB; }
  .gate-error{ font-size:12px; color:#B91C1C; text-align:center; }
  .gate-enter-btn{
    width:100%; max-width:260px; height:38px;
    font-size:13px; font-family:inherit; font-weight:600; color:#fff;
    background:var(--navy); border:none; border-radius:6px; cursor:pointer;
  }
  .gate-enter-btn:hover{ opacity:0.92; }
  .gate-enter-btn:disabled{ opacity:0.6; cursor:default; }

  .site-lock-btn{
    position:fixed; top:10px; right:12px; z-index:50;
    height:22px; padding:0 8px;
    font-size:11px; font-family:inherit; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:5px; cursor:pointer;
  }
  .site-lock-btn:hover{ background:#F0F1F4; color:var(--text); }

  /* 클라우드 동기화/백업/복원 — 새 디자인 시스템을 만들지 않고 기존 site-lock-btn과
     동일한 작은 텍스트형 버튼 스타일을 그대로 재사용한다(잠금 버튼 왼쪽에 나란히 배치). */
  .shin2-sync-bar{
    position:fixed; top:10px; right:70px; z-index:50;
    display:flex; align-items:center; gap:6px;
  }
  .shin2-sync-btn{
    height:22px; padding:0 8px; white-space:nowrap;
    font-size:11px; font-family:inherit; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:5px; cursor:pointer;
  }
  .shin2-sync-btn:hover{ background:#F0F1F4; color:var(--text); }
  .shin2-sync-btn:disabled{ opacity:0.5; cursor:default; }
  .shin2-sync-status{ font-size:11px; color:var(--text-muted); max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 공통 메모(SHIN2_MEMO) — 화면 어디에 붙어도 동일하게 보이는 작은 시간순 기록 목록 */
  .shin2-memo-block{ margin-top:22px; max-width:800px; padding-top:16px; border-top:1px solid var(--line); }
  .acct-field .shin2-memo-block{ max-width:none; }
  .shin2-memo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .shin2-memo-title{ font-size:13px; font-weight:700; color:var(--text); }
  /* 홈에서만 다른 섹션 제목(AI 문구정리/전화 온 내용, 14px/700)과 크기를 맞춘다(§9) —
     shin2-memo-title은 업체/계정/업무 상세 등 다른 화면에서도 재사용되므로 기본값은
     그대로 두고, 홈 메모 헤더에만 이 클래스를 덧붙인다. */
  .shin2-memo-title-lg{ font-size:14px; }
  .shin2-memo-add-btn{
    height:26px; padding:0 10px; font-size:12px; font-weight:600; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .shin2-memo-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .shin2-memo-empty{ font-size:12.5px; color:var(--text-muted); padding:10px 2px; }
  .shin2-memo-list{ display:flex; flex-direction:column; }
  .shin2-memo-item{ padding:9px 2px; border-bottom:1px solid var(--line); }
  .shin2-memo-item:last-child{ border-bottom:none; }
  .shin2-memo-meta{ font-size:11px; color:var(--text-muted); margin-bottom:3px; }
  .shin2-memo-text{ font-size:13px; color:var(--text); line-height:1.55; white-space:pre-wrap; }
  .shin2-memo-item-actions{ display:flex; gap:10px; margin-top:5px; }
  .shin2-memo-mini-btn{ background:none; border:none; padding:0; font-size:11.5px; color:var(--text-muted); cursor:pointer; font-family:inherit; }
  .shin2-memo-mini-btn:hover{ color:var(--navy); text-decoration:underline; }
  .shin2-memo-mini-btn.danger:hover{ color:#B91C1C; }
  .shin2-memo-more-btn{
    display:block; width:100%; margin-top:8px; padding:6px 0; background:none; border:none;
    font-size:12px; color:var(--text-muted); cursor:pointer; font-family:inherit; text-align:center;
  }
  .shin2-memo-more-btn:hover{ color:var(--navy); }
  .shin2-memo-form{ margin-bottom:8px; }
  .shin2-memo-input{
    width:100%; min-height:56px; resize:vertical; padding:8px 10px; font-size:13px; font-family:inherit;
    color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px;
  }
  .shin2-memo-input:focus{ outline:none; border-color:#C7CEDB; }
  .shin2-memo-form-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:6px; }
  .shin2-memo-cancel-btn, .shin2-memo-save-btn{
    height:26px; padding:0 12px; font-size:12px; font-weight:600; border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .shin2-memo-cancel-btn{ background:var(--surface); border:1px solid var(--line); color:var(--text-muted); }
  .shin2-memo-cancel-btn:hover{ background:#F0F1F4; }
  .shin2-memo-save-btn{ background:var(--navy); border:1px solid var(--navy); color:#fff; }

  /* 통합 업무 입력 패널(§신규) — 기존 "시공사 전화기록"/"아파트 문의·전화기록"/
     "AI 문구정리" 3개의 개별 박스를 탭 1개로 묶는 얇은 컨테이너. 카드 테두리/그림자/
     새 색 없이 기존 얇은 선(var(--line))과 은은한 네이비 강조만 쓴다. */
  .home-tabs-panel{ margin-top:22px; max-width:800px; }
  .home-tabs-head{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .home-tab-btn{
    height:34px; padding:0 14px; font-size:13px; font-weight:600; font-family:inherit;
    color:var(--text-muted); background:transparent; border:none; border-bottom:2px solid transparent;
    margin-bottom:-1px; border-radius:6px 6px 0 0; cursor:pointer;
  }
  .home-tab-btn:hover{ background:#F0F1F4; color:var(--text); }
  .home-tab-btn.active{ color:var(--navy); background:#EEF1F8; border-bottom-color:var(--navy); }
  /* 탭 내용 영역 안에서는 각 섹션의 기존 margin-top/max-width가 패널과 중복되지 않게
     0으로 눌러준다 — 섹션 자체의 내부 마크업/클래스는 손대지 않는다. */
  .home-tab-content .qr-block, .home-tab-content .home-task-block, .home-tab-content .ai-section{
    margin-top:0; max-width:none;
  }
  /* 탭 간 전환 시 세로 점프를 줄이기 위해 세 탭의 입력창 높이를 비슷하게(3~4줄) 맞춘다.
     완전히 똑같을 필요는 없다 — 탭2는 분류버튼 줄, 탭1/3은 각자의 여분 줄이 있어 약간의
     차이는 자연스럽다. */
  #aiInput{ min-height:112px; }
  .home-bridge-btn{
    height:32px; padding:0 12px; font-size:12.5px; font-weight:600; font-family:inherit;
    color:var(--navy); background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  }
  .home-bridge-btn:hover{ background:#F0F1F4; }
  @media (max-width: 720px){
    .home-tabs-head{ flex-wrap:wrap; }
    .home-tab-btn{ flex:1 1 auto; }
  }

  /* 빠른 고객기록(표시명: "시공사 전화기록", §5~10) — 업체명을 포함해 여러 줄로 적고
     Enter로 저장(Shift+Enter는 줄바꿈)하는 입력창. 우측 "아파트 문의·전화기록"
     textarea와 높이를 맞췄다(§정렬). */
  .qr-block{ margin-top:22px; max-width:800px; }
  .qr-head{ margin-bottom:8px; }
  .qr-title{ font-size:14px; font-weight:700; color:var(--text); }
  .qr-input{
    width:100%; min-height:108px; resize:vertical; padding:10px 12px; font-size:13px; line-height:1.5;
    font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:8px; outline:none; box-sizing:border-box;
  }
  .qr-input:focus{ border-color:#C7CEDB; }
  .qr-bottom-row{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .qr-hint{ font-size:12.5px; color:var(--text-muted); white-space:nowrap; margin-right:auto; }
  .qr-inline-ok{ font-size:12.5px; color:var(--navy); margin-top:8px; }
  .qr-inline-empty{ font-size:12.5px; color:var(--text-muted); margin-top:8px; }
  .qr-notfound{ margin-top:8px; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .qr-notfound-text{ font-size:12.5px; color:var(--text); margin-bottom:8px; }
  .qr-candidates{ margin-top:8px; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .qr-candidates-text{ font-size:12.5px; color:var(--text); margin-bottom:8px; }
  .qr-candidate-btn{
    display:block; width:100%; text-align:left; padding:7px 10px; margin-bottom:4px; font-size:12.5px;
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .qr-candidate-btn:hover{ background:#F0F1F4; }
  .qr-action-row{ display:flex; gap:8px; }

  /* 시공사 전화기록 인라인 미처리 목록(§신규 라운드) — 저장 직후 팝업을 열지 않고 입력창
     바로 아래에서 확인하는 목적. task-pop-row/co-text-action 톤을 그대로 재사용한다. */
  .qr-pending-wrap{ margin-top:14px; }
  .qr-pending-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .qr-pending-title{ font-size:12.5px; font-weight:700; color:var(--text-muted); }
  .qr-pending-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); }
  .qr-pending-row:last-child{ border-bottom:none; }
  .qr-pending-main{ flex:1 1 auto; min-width:0; }
  .qr-pending-co{ font-size:13px; font-weight:700; color:var(--text); }
  .qr-pending-contact{ font-size:11.5px; color:var(--text-muted); margin-left:6px; }
  .qr-pending-summary{ font-size:12.5px; color:var(--text); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qr-pending-meta{ flex:none; font-size:11.5px; color:var(--text-muted); }
  .qr-pending-actions{ flex:none; display:flex; gap:6px; }
  .qr-pending-more-btn{
    background:none; border:none; font-size:12px; color:var(--navy); cursor:pointer; font-family:inherit; padding:4px 0;
  }
  .qr-pending-empty{ font-size:12px; color:var(--text-muted); padding:4px; }
  .qr-pending-edit{ margin-top:6px; }

  /* 업무 메모(§신규 라운드) — 목록 행 아래에 펼쳐지는 작은 인라인 입력칸. 일반 포스트잇
     메모와는 완전히 다른 데이터(customerActivities.taskMemo)이며 스타일도 별도 팝업을
     쓰지 않는다는 것만 지키면 되므로 기존 qr-unmatched 톤을 재사용한다. */
  .qr-task-memo{ margin-top:6px; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .qr-task-memo textarea{
    width:100%; min-height:52px; padding:7px 9px; font-size:12.5px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; box-sizing:border-box; outline:none; resize:vertical;
  }
  .qr-task-memo-actions{ display:flex; gap:6px; margin-top:6px; }
  .qr-task-memo-preview{ font-size:11.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 처리완료 직후 잠깐 보여주는 실행취소 줄(§신규 라운드) — 큰 토스트/팝업이 아니라
     방금 사라진 행 자리에 그대로 텍스트 한 줄만 남긴다. */
  .qr-undo-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--text-muted); }
  .qr-undo-row button{ background:none; border:none; color:var(--navy); font-weight:700; cursor:pointer; font-family:inherit; font-size:12.5px; padding:0; }

  /* 미등록 시공사 기록(§신규) — 업체명이 매칭되지 않아도 저장을 막지 않고, 규칙 기반으로
     추정한 업체명/특이사항을 사용자가 확인·수정한 뒤 저장하는 인라인 확인 UI. qr-notfound와
     같은 톤을 그대로 재사용한다. */
  .qr-unmatched{ margin-top:8px; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .qr-unmatched-text{ font-size:12.5px; color:var(--text); margin-bottom:8px; }
  .qr-unmatched-field{ margin-bottom:8px; }
  .qr-unmatched-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .qr-unmatched-field input, .qr-unmatched-field textarea{
    width:100%; padding:7px 9px; font-size:13px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; box-sizing:border-box; outline:none;
  }
  .qr-unmatched-field textarea{ min-height:52px; resize:vertical; }
  .qr-unmatched-field input:focus, .qr-unmatched-field textarea:focus{ border-color:#C7CEDB; }

  /* 시공사 전화기록 전체보기의 미등록 기록 행/필터탭(§신규) */
  .act-filter-row{ margin-bottom:10px; }
  .act-unmatched-row{ flex-direction:column; align-items:stretch; gap:6px; cursor:default; }
  .act-unmatched-main{ display:flex; align-items:center; gap:6px; min-width:0; }
  .act-unmatched-tag{ flex:none; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; background:#F0F1F4; color:var(--text-muted); }
  .act-unmatched-actions{ display:flex; gap:12px; }
  .act-edit-fields{ display:flex; flex-direction:column; gap:6px; }
  .act-edit-fields input{
    width:100%; padding:6px 8px; font-size:13px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; box-sizing:border-box; outline:none;
  }
  .act-link-search{
    width:100%; padding:6px 8px; margin-bottom:6px; font-size:13px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; box-sizing:border-box; outline:none;
  }
  .act-link-list{ display:flex; flex-wrap:wrap; gap:6px; max-height:160px; overflow-y:auto; }

  /* 홈 "오늘 확인할 업무" 요약 — 컴팩트한 행 목록, 상태는 작은 텍스트 배지로만 구분 */
  .home-task-block{ margin-top:22px; max-width:800px; }
  .home-task-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .home-task-head-left{ display:flex; align-items:center; flex-wrap:wrap; gap:14px; }
  .home-task-title{ font-size:14px; font-weight:700; color:var(--text); }
  .home-task-more{ font-size:12px; color:var(--text-muted); text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit; }
  .home-task-more:hover{ color:var(--navy); }
  .home-task-empty{ font-size:12.5px; color:var(--text-muted); padding:10px 2px; border-top:1px solid var(--line); }
  .home-task-list{ border-top:1px solid var(--line); }
  .home-task-row{
    display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .home-task-row:hover{ background:#F8F9FB; }
  .home-task-row-main{ flex:1 1 auto; min-width:0; }
  .home-task-row-top{ display:flex; align-items:center; gap:7px; }
  .home-task-time{ font-size:11.5px; color:var(--text-muted); flex:none; }
  .home-task-row-title{ font-size:13.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .home-task-row-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .home-task-chevron{ flex:none; color:var(--text-muted); font-size:13px; }

  /* 전화메모 입력창(§전화메모 스펙) — "오늘 확인할 업무" 섹션 안에 얹히는 자유 입력창.
     기존 ai-textarea/ai-run-btn 스타일을 그대로 재사용하고, 배치용 여백만 추가한다. */
  .call-input-block{ margin-bottom:10px; }
  .call-memo-actions{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; flex-wrap:wrap; }

  .task-badge{
    flex:none; display:inline-block; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px;
    background:#EEF1F8; color:var(--navy);
  }
  .task-badge-urgent{ background:#FBEAEA; color:#B91C1C; }
  .task-badge-progress{ background:#EEF1F8; color:var(--navy); }
  .task-badge-confirm{ background:#EEF1F8; color:var(--navy); }
  .task-badge-material{ background:#F0F1F4; color:var(--text-muted); }
  .task-badge-reply{ background:#F0F1F4; color:var(--text-muted); }
  .task-badge-normal{ background:#F0F1F4; color:var(--text-muted); }

  /* 처리할 업무 팝업(전체보기/상세/폼) — 계정 팝업과 동일한 톤 재사용 */
  .task-popup{ width:640px; }
  .task-tabs{ display:flex; gap:4px; margin-bottom:10px; }
  .task-tab{
    height:28px; padding:0 12px; font-size:12.5px; font-weight:600; color:var(--text-muted);
    background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .task-tab.active{ background:#EEF1F8; color:var(--navy); border-color:#EEF1F8; }
  .task-tab:hover:not(.active){ background:#F0F1F4; }
  .task-pop-row{
    display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line);
    cursor:pointer; border-radius:6px;
  }
  .task-pop-row:hover{ background:#F0F1F4; }
  .task-pop-row.done .task-pop-row-title{ color:var(--text-muted); text-decoration:line-through; }
  .task-pop-row-title{ flex:1 1 auto; min-width:0; font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-pop-row-meta{ flex:none; font-size:11.5px; color:var(--text-muted); }
  .task-pop-date-head{ font-size:11.5px; font-weight:700; color:var(--text-muted); padding:10px 6px 4px; }
  .task-pop-date-head:first-child{ padding-top:2px; }
  .task-form-field{ margin-bottom:14px; }
  .task-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .task-form-field input, .task-form-field select, .task-form-field textarea{
    width:100%; padding:8px 10px; font-size:13.5px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
  }
  .task-form-field textarea{ min-height:64px; resize:vertical; }
  .task-form-field input:focus, .task-form-field select:focus, .task-form-field textarea:focus{ outline:none; border-color:#C7CEDB; }
  .task-form-row{ display:flex; gap:10px; }
  .task-form-row .task-form-field{ flex:1 1 0; }
  .task-detail-title{ font-size:15px; font-weight:700; color:var(--text); margin-bottom:14px; }
  .task-detail-actions{ display:flex; gap:16px; margin-top:6px; padding-top:14px; border-top:1px solid var(--line); }
  .task-company-link{ font-size:12.5px; color:var(--navy); background:none; border:none; cursor:pointer; padding:0; font-family:inherit; text-decoration:underline; }

  /* ---------- 상단 바로가기 (quick links) ---------- */
  .qlinks-bar{
    max-width:800px;
    display:flex; align-items:center; gap:6px;
    margin-bottom:14px;
  }
  .qlinks-scroll{
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; gap:3px;
    overflow-x:auto; white-space:nowrap;
    scrollbar-width:thin;
  }
  .qlinks-scroll::-webkit-scrollbar{ height:4px; }
  .qlinks-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .qlink-btn{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:4px;
    height:28px; padding:0 10px;
    font-size:12.5px; font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
  }
  .qlink-btn:hover{ background:#F0F1F4; color:var(--text); }
  .qlink-btn svg{ flex:0 0 auto; opacity:0.6; }
  .qlinks-empty-hint{ font-size:11.5px; color:var(--text-muted); flex:0 0 auto; }
  .qlinks-controls{ flex:0 0 auto; display:flex; align-items:center; gap:2px; }
  .qlinks-edit-toggle{
    height:26px; padding:0 8px;
    font-size:11.5px; font-family:inherit;
    color:var(--text-muted);
    background:transparent; border:1px solid var(--line); border-radius:6px;
    cursor:pointer;
  }
  .qlinks-edit-toggle:hover{ background:#F0F1F4; color:var(--text); }
  .qlinks-edit-toggle.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  .qlinks-add-btn{
    width:26px; height:26px;
    font-size:15px; line-height:1; font-family:inherit;
    color:var(--text-muted);
    background:transparent; border:1px solid var(--line); border-radius:6px;
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .qlinks-add-btn:hover{ background:#F0F1F4; color:var(--text); }

  .qlink-edit-item{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:4px;
    height:28px; padding:0 8px 0 10px;
    font-size:12px; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:6px;
    white-space:nowrap;
  }
  .qlink-edit-name{ max-width:120px; overflow:hidden; text-overflow:ellipsis; }
  .qlink-mini-btn{
    border:none; background:transparent; cursor:pointer;
    font-size:11px; color:var(--text-muted); padding:2px 3px; font-family:inherit;
  }
  .qlink-mini-btn:hover{ color:var(--navy); }
  .qlink-mini-btn.danger:hover{ color:#B91C1C; }
  .qlink-mini-btn:disabled{ opacity:0.3; cursor:default; }
  .qlink-mini-btn:disabled:hover{ color:var(--text-muted); }

  .qlink-modal-overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:110;
  }
  .qlink-modal{
    width:340px; max-width:calc(100vw - 24px);
    background:var(--surface);
    border-radius:10px;
    border:1px solid var(--line);
    padding:20px;
  }
  .qlink-modal-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:14px; }
  .qlink-form-field{ margin-bottom:14px; }
  .qlink-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .qlink-form-field input{
    width:100%; height:36px; padding:0 10px;
    font-size:13px; font-family:inherit; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    outline:none; box-sizing:border-box;
  }
  .qlink-form-field input:focus{ border-color:#C7CEDB; }
  .qlink-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .qlink-modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .qlink-modal-btn{
    height:32px; padding:0 14px;
    font-size:12.5px; font-family:inherit; font-weight:600;
    border-radius:6px; cursor:pointer;
  }
  .qlink-modal-btn.cancel{ background:var(--surface); border:1px solid var(--line); color:var(--text-muted); }
  .qlink-modal-btn.cancel:hover{ background:#F0F1F4; }
  .qlink-modal-btn.save{ background:var(--navy); border:1px solid var(--navy); color:#fff; }
  .qlink-modal-btn.save:hover{ opacity:0.92; }

  /* ---------- 일정관리(캘린더) — §좌측 사이드바 하단 통합 라운드부터 트리거 아이콘(#calFabBtn)/
     QA 바로가기(#qaFabBtn)/승인대기 카운트(#calApprovalPill)는 사이드바 하단 .nav-bottom
     안의 .nav-item/.nav-approval-row로 옮겨졌다(아래 nav-item, nav-badge, nav-approval-row
     참고) — 더 이상 화면에 고정(position:fixed) 떠 있지 않는다. 팝오버 자체(.cal-popover)의
     위치/폭/열기·닫기 로직은 전혀 바꾸지 않았다. */
  .cal-popover{
    position:fixed; right:18px; bottom:64px; z-index:66;
    width:min(390px, calc(100vw - 24px));
    max-height:75vh;
    display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 4px 16px rgba(17,24,39,0.10);
    overflow:hidden;
  }
  .cal-pop-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .cal-pop-title{ font-size:13.5px; font-weight:700; color:var(--text); }
  .cal-pop-head-right{ display:flex; align-items:center; gap:10px; }
  .cal-team-link-btn{
    border:none; background:transparent; cursor:pointer; padding:0;
    font-size:11px; font-family:inherit; color:var(--navy); font-weight:600;
  }
  .cal-team-link-btn:hover{ text-decoration:underline; }
  .cal-pop-close{ border:none; background:transparent; cursor:pointer; font-size:16px; line-height:1; color:var(--text-muted); padding:2px 4px; }
  .cal-pop-close:hover{ color:var(--text); }
  .cal-pop-body{ padding:12px 14px; overflow-y:auto; flex:1 1 auto; }
  /* ---------- 소스 필터(전체/내 일정/팀장 일정) — 연한 네이비 배경만, 과도한 색 금지 ---------- */
  .cal-src-tabs-row{ display:flex; gap:6px; margin-bottom:8px; }
  .cal-src-tab-btn{
    flex:1 1 0; height:24px; font-size:11px; font-family:inherit; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  }
  .cal-src-tab-btn:hover{ background:#F0F1F4; }
  .cal-src-tab-btn.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  /* ---------- 팀장 일정(team-schedule, 읽기전용) 표시 ---------- */
  .cal-grid-team-dot{ width:5px; height:5px; border-radius:50%; background:#8E9FCE; }
  .cal-team-section{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); }
  .cal-team-section-head{ font-size:12px; font-weight:700; color:var(--navy); margin-bottom:6px; }
  .cal-team-row{ padding:8px 0; border-bottom:1px solid var(--line); }
  .cal-team-row:last-child{ border-bottom:none; }
  .cal-team-row-top{ display:flex; align-items:baseline; gap:6px; }
  .cal-team-row-time{ font-size:11px; color:var(--text-muted); flex:0 0 auto; }
  .cal-team-row-title{ font-size:12.5px; color:var(--text); }
  .cal-team-row-meta{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .cal-team-readonly-tag{ font-size:10px; color:var(--text-muted); background:#EEF1F8; border-radius:4px; padding:0 4px; margin-left:4px; }
  .cal-tabs-row{ display:flex; gap:6px; margin-bottom:8px; }
  .cal-tab-btn{
    flex:1 1 0; height:26px; font-size:11.5px; font-family:inherit; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  }
  .cal-tab-btn:hover{ background:#F0F1F4; }
  .cal-tab-btn.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  .cal-add-toggle-row{ margin-bottom:10px; }
  .cal-list{ display:flex; flex-direction:column; }
  .cal-event-row{ padding:9px 0; border-bottom:1px solid var(--line); }
  .cal-event-row:last-child{ border-bottom:none; }
  .cal-event-top{ display:flex; align-items:baseline; gap:6px; }
  .cal-event-date{ font-size:11px; color:var(--text-muted); flex:0 0 auto; }
  .cal-event-title{ font-size:12.5px; color:var(--text); }
  .cal-event-title.done{ color:var(--text-muted); text-decoration:line-through; }
  .cal-event-meta{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .cal-event-actions{ display:flex; gap:12px; margin-top:4px; }
  .cal-empty-hint{ font-size:12px; color:var(--text-muted); padding:14px 0; text-align:center; }

  /* ---------- 월간 그리드(달력) 뷰 — 팝오버 기본 화면 ----------
     작은 팝오버 안에 들어가는 컴팩트 그리드. 셀 안에는 날짜 숫자 + 아주 작은
     점(일반 일정) / 연노랑 하이라이트 마크(중요 일정, .kb-hl 재사용)만 두고
     일정 제목 등 텍스트는 절대 넣지 않는다(§요구사항 4). */
  .cal-grid-head{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px; }
  .cal-grid-nav{ display:flex; align-items:center; gap:2px; }
  .cal-grid-nav-btn{
    width:22px; height:22px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--text-muted);
    cursor:pointer; font-size:12px; line-height:1;
  }
  .cal-grid-nav-btn:hover{ background:#F0F1F4; color:var(--navy); }
  .cal-grid-title{ font-size:12.5px; font-weight:700; color:var(--text); min-width:84px; text-align:center; }
  .cal-grid-today-btn{
    height:22px; padding:0 8px; font-size:10.5px; font-family:inherit; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  }
  .cal-grid-today-btn:hover{ background:#F0F1F4; color:var(--navy); }
  .cal-grid-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:10px; color:var(--text-muted); margin-bottom:2px;
  }
  .cal-grid-weekdays span{ padding:2px 0; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
  .cal-grid-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    height:32px; padding-top:2px; border:none; background:transparent; border-radius:6px;
    cursor:pointer; font-family:inherit; color:var(--text);
  }
  .cal-grid-cell:hover{ background:#F0F1F4; }
  .cal-grid-cell.out{ color:var(--text-muted); opacity:0.42; }
  .cal-grid-cell.selected{ background:#EEF1F8; }
  .cal-grid-daynum{
    display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; border-radius:50%; font-size:11px; box-sizing:border-box;
  }
  .cal-grid-cell.today .cal-grid-daynum{ border:1.3px solid var(--navy); }
  .cal-grid-dot-row{ height:6px; display:flex; align-items:center; justify-content:center; gap:2px; margin-top:1px; }
  .cal-grid-dot{ width:4px; height:4px; border-radius:50%; background:#B5B9C2; }
  .cal-grid-hl-mark{ width:9px; height:4px; border-radius:2px; }
  .cal-date-events{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .cal-date-events-head{ font-size:12px; font-weight:700; color:var(--text); margin-bottom:6px; }

  /* 사용자 1·2·3 전환(§다중 사용자 라운드 → §우상단 드롭다운 라운드) — 로그인 인증이
     아니라 "업무공간 구분"용 작은 선택 UI. 화면 오른쪽 최상단, 기존 잠금/동기화 버튼이
     이미 있는 고정(position:fixed) 줄(#shin2SyncBar) 맨 앞자리에 끼워 넣는다 — 새 좌표를
     따로 계산하지 않아 폭이 달라져도 절대 겹치지 않고, 기존 두 버튼의 위치/구조는 그대로
     보존된다(§기존 레이아웃 변경 금지). */
  .user-select-dd{ position:relative; z-index:51; }
  .user-select-btn{
    display:flex; align-items:center; gap:4px; height:22px; padding:0 8px;
    font-size:12px; font-weight:700; font-family:inherit; color:var(--navy);
    background:var(--surface); border:1px solid var(--line); border-radius:5px; cursor:pointer;
  }
  .user-select-btn:hover{ background:#F0F1F4; }
  .user-select-caret{ font-size:9px; color:var(--text-muted); line-height:1; }
  .user-select-menu{
    position:absolute; top:26px; right:0; min-width:44px;
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:2px; display:none; flex-direction:column;
  }
  .user-select-menu.open{ display:flex; }
  .user-select-item{
    padding:5px 8px; font-size:12px; font-weight:700; font-family:inherit; color:var(--text);
    background:none; border:none; border-radius:4px; cursor:pointer; text-align:left;
  }
  .user-select-item:hover{ background:#F0F1F4; }
  .user-select-item.active{ background:#EAF0FA; color:var(--navy); }

  /* ================================================================================
     오늘의 투두 우측 레일 (§오른쪽 빈 공간 활용 라운드) — 신규 블록.
     기존 .app/.sidebar/.main 규칙은 한 줄도 고치지 않는다. .app이 이미 display:flex라
     <main> 뒤에 형제로 <aside>를 하나 더 두기만 하면 자연스럽게 3단이 된다 —
     .main은 flex:1이라 남는 폭만큼 알아서 줄어들고, .main-inner의 max-width:1160px
     가운데 정렬도 그대로 유지된다(중앙 콘텐츠를 강제로 좁히는 규칙 없음).
     ================================================================================ */
  :root{ --todo-w: 440px; }
  .todo-rail{
    flex:0 0 var(--todo-w); width:var(--todo-w);
    align-self:flex-start;           /* stretch를 끊어야 sticky가 실제로 붙는다 */
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column;
    background:var(--surface); border-left:1px solid var(--line);
