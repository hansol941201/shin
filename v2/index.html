        throw Object.assign(new Error('LOCAL_STORAGE_QUOTA_EXCEEDED'), { code:'LOCAL_STORAGE_QUOTA_EXCEEDED' });
      }
      return rec;
    });
  }

  function updateMeta(id, patch){
    const list = loadDocs();
    const rec = list.find(d=> d.id === id);
    if(!rec) return null;
    // 메타데이터 수정은 파일에 전혀 손대지 않는다(§9 "수정" ≠ "파일 교체").
    ['title','category','method','workType','year','tags','description'].forEach(k=>{
      if(k in patch) rec[k] = patch[k];
    });
    rec.updatedAt = nowIso();
    saveDocs(list);
    return rec;
  }

  // replaceFile: 새 파일 저장이 "성공"한 뒤에만 기존 파일을 덮어쓴다(§9 순서 안전) — 저장이
  // 실패하면 기존 blob/메타데이터는 그대로 남는다.
  function replaceFile(id, file, onProgress, opts){
    return saveLibraryFile(id, file, onProgress, opts).then(result=>{
      const list = loadDocs();
      const rec = list.find(d=> d.id === id);
      if(!rec) throw new Error('NOT_FOUND');
      // [버그 수정] 새 blob을 쓰기 전에 기존 blob을 기억해둔다 — 아래에서 blob/메타데이터 쓰기가
      // 용량 초과로 실패하면 이 값으로 되돌려 "메타데이터는 옛 파일을 가리키는데 blob은 이미
      // 새 내용으로 덮였다" 같은 불일치 상태를 남기지 않는다.
      const oldDataUrl = D.getBlob(id);
      // 새 파일 저장이 성공한 뒤에만 기존 파일을 덮어쓴다(원래 id 그대로 재사용 — 교체이지 신규 추가가 아님).
      if(result.dataUrl){
        const blobOk = writeBlob(id, result.dataUrl);
        if(!blobOk){
          throw Object.assign(new Error('LOCAL_STORAGE_QUOTA_EXCEEDED'), { code:'LOCAL_STORAGE_QUOTA_EXCEEDED' });
        }
      } else {
        removeBlob(id); // 클라우드로 교체됐으면 예전 로컬 blob은 정리
      }
      rec.originalFileName = file.name;
      rec.storagePath = result.storagePath;
      rec.mimeType = file.type || '';
      rec.size = file.size || 0;
      rec.fileStored = true;
      rec.localOnly = result.localOnly;
      rec.updatedAt = nowIso();
      const metaOk = saveDocs(list);
      if(!metaOk){
        // 메타데이터 갱신이 실패했으면 방금 덮어쓴 blob도 원래대로 되돌린다(불일치 방지).
        if(result.dataUrl){ if(oldDataUrl) writeBlob(id, oldDataUrl); else removeBlob(id); }
        throw Object.assign(new Error('LOCAL_STORAGE_QUOTA_EXCEEDED'), { code:'LOCAL_STORAGE_QUOTA_EXCEEDED' });
      }
      return rec;
    });
  }

  function toggleFavorite(id){
    const list = loadDocs();
    const rec = list.find(d=> d.id === id);
    if(!rec) return null;
    rec.favorite = !rec.favorite;
    rec.updatedAt = nowIso();
    saveDocs(list);
    return rec;
  }

  function deleteDoc(id){
    // 메타데이터와 파일을 함께, 그리고 이 id 하나만 지운다 — 다른 자료에는 영향 없음(§10).
    saveDocs(loadDocs().filter(d=> d.id !== id));
    removeBlob(id);
  }

  // getSearchable: 통합검색(§11)에 넘기는 뷰. 원본 배열을 그대로 참조만 하며(복사 저장 없음),
  // 파일 바이너리/blob 저장소는 이 함수가 아예 참조하지 않는다 — 검색은 메타데이터 필드만 대상.
  function getSearchable(){ return loadDocs(); }

  window.SHIN2_LIBRARY_DATA = {
    LIB_CATEGORIES, LIB_ACCEPT, LIB_MAX_LOCAL_BYTES, LOCAL_ONLY_NOTICE, BLOCKED_NOTICE,
    loadDocs, findDoc, addDoc, updateMeta, replaceFile, toggleFavorite, deleteDoc,
    getBlob, getSearchable
  };

  // ======================= 화면 렌더링 =======================
  const D = window.SHIN2_LIBRARY_DATA;
  let libState = { search:'', category:'all', favOnly:false };
  const libBlobUrlCache = {};

  function dataUrlToBlob(dataUrl){
    try{
      const commaIdx = dataUrl.indexOf(',');
      const meta = dataUrl.slice(0, commaIdx);
      const isBase64 = /;base64/.test(meta);
      const mimeMatch = /^data:([^;]*)/.exec(meta);
      const mime = (mimeMatch && mimeMatch[1]) || 'application/octet-stream';
      const raw = dataUrl.slice(commaIdx + 1);
      const bin = isBase64 ? atob(raw) : decodeURIComponent(raw);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }catch(e){ return null; }
  }
  function getDocObjectUrl(doc){
    if(libBlobUrlCache[doc.id]) return libBlobUrlCache[doc.id];
    const dataUrl = D.getBlob(doc.id);
    if(!dataUrl) return '';
    const blob = dataUrlToBlob(dataUrl);
    if(!blob) return '';
    const url = URL.createObjectURL(blob);
    libBlobUrlCache[doc.id] = url;
    return url;
  }
  // getFileCase: 레코드별로 실제 파일이 어디에 있는지 "지금 상태" 그대로 정직하게 판정한다
  // (§ 파일 미저장 표시 정확도 라운드). doc.fileStored/doc.localOnly 같은 저장 시점 플래그만
  // 믿지 않고, 매번 shin2-library-blobs-v1(로컬 blob)과 storagePath 필드를 직접 확인한다 —
  // 이전에 "파일 미저장"이었던 레코드가 나중에 파일 연결됐거나, 반대로 blob이 사라진 경우도
  // 여기서 즉시 정확히 반영된다.
  //   CASE 'A': storagePath가 실제 Storage 경로("local:"로 시작하지 않음)이고 localOnly가
  //             아님 — Storage에서 다운로드를 시도해야 하는 레코드.
  //   CASE 'B': shin2-library-blobs-v1에 이 id의 dataURL이 실제로 존재함 — 클라우드 여부와
  //             무관하게 로컬에 실제 파일 바이트가 있으므로 최우선으로 취급한다.
  //   CASE 'C': 위 둘 다 아님 — 메타데이터만 있고 파일 바이트가 어디에도 없는 진짜 "파일 미저장".
  function getFileCase(doc){
    if(D.getBlob(doc.id)) return 'B';
    if(doc.storagePath && !doc.localOnly && doc.storagePath.indexOf('local:') !== 0) return 'A';
    return 'C';
  }
  // getDocUrl: 보기/다운로드가 실제로 쓰는 진입점(Promise). getFileCase()와 완전히 같은 판정
  // 순서(로컬 blob 우선 → Storage)를 써서 두 곳의 판단이 어긋나지 않도록 한다.
  function getDocUrl(doc){
    const fc = getFileCase(doc);
    if(fc === 'B'){
      return Promise.resolve(getDocObjectUrl(doc));
    }
    if(fc === 'A'){
      const ST = window.SHIN2_STORAGE;
      if(!ST || !ST.isSignedIn || !ST.isSignedIn()){
        return Promise.reject(Object.assign(new Error('NOT_AUTHENTICATED'), { code:'NOT_AUTHENTICATED' }));
      }
      return ST.getFileURL(doc.storagePath);
    }
    return Promise.reject(Object.assign(new Error('NO_FILE'), { code:'NO_FILE' }));
  }
  function canPreviewInline(doc){
    const m = (doc.mimeType || '').toLowerCase();
    return m.startsWith('image/') || m === 'application/pdf';
  }
  function fmtDate(iso){
    const d = new Date(iso); if(isNaN(d)) return '';
    const p = n=> String(n).padStart(2,'0');
    return d.getFullYear() + '.' + p(d.getMonth()+1) + '.' + p(d.getDate());
  }
  function showToast(btn, text){
    const span = document.createElement('span');
    span.className = 'kb-copied-tag';
    span.textContent = text;
    btn.insertAdjacentElement('afterend', span);
    setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
  }

  const libBanner = document.getElementById('libBanner');
  const libAddBtn = document.getElementById('libAddBtn');
  const libSearchInput = document.getElementById('libSearchInput');
  const libCatTabs = document.getElementById('libCatTabs');
  const libFavToggleBtn = document.getElementById('libFavToggleBtn');
  const libRecentSection = document.getElementById('libRecentSection');
  const libAllLabel = document.getElementById('libAllLabel');
  const libList = document.getElementById('libList');

  function libCloudReady(){ const ST = window.SHIN2_STORAGE; return !!(ST && ST.isSignedIn && ST.isSignedIn()); }
  function refreshLibBanner(){
    if(!libBanner) return;
    libBanner.textContent = libCloudReady()
      ? '새 자료는 자동으로 클라우드(Firebase Storage)에 업로드됩니다. 업로드에 실패하면 재시도하거나 이 기기에만 저장할 수 있습니다.'
      : D.BLOCKED_NOTICE;
  }
  refreshLibBanner();
  // 로그인 시점(Firebase Auth 로그인 완료)에 배너 문구를 갱신한다 — 자동 마이그레이션이 아니라
  // 단순 안내 문구 갱신이며, 이 시점에 어떤 파일도 자동 업로드하지 않는다(§ 수동 액션 원칙).
  window.addEventListener('shin2-firebase-ready', refreshLibBanner);

  function renderCatTabs(){
    const cats = ['all'].concat(D.LIB_CATEGORIES);
    libCatTabs.innerHTML = cats.map(c=> `<button type="button" class="co-filter-btn${(libState.category===c)?' active':''}" data-cat="${esc(c)}">${c==='all'?'전체':esc(c)}</button>`).join('');
  }

  function matchesSearch(doc, q){
    if(!q) return true;
    const hay = norm([doc.title, doc.originalFileName, doc.category, doc.method, doc.workType, doc.year, (doc.tags||[]).join(' '), doc.description].filter(Boolean).join(' '));
    return hay.includes(q);
  }
  function filteredDocs(){
    const q = norm(libState.search);
    return D.loadDocs().filter(d=>{
      if(libState.category !== 'all' && d.category !== libState.category) return false;
      if(libState.favOnly && !d.favorite) return false;
      return matchesSearch(d, q);
    }).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }

  function docSubLabel(doc){
    const parts = [];
    if(doc.category) parts.push(doc.category);
    if(doc.method) parts.push(doc.method);
    if(doc.workType) parts.push(doc.workType);
    if(doc.year) parts.push(String(doc.year));
    parts.push(fmtDate(doc.createdAt));
    return parts.join(' · ');
  }

  function renderRow(doc){
    // CASE A/B/C 판정을 getFileCase()에 위임한다 — 저장 시점 플래그가 아니라 지금 이 순간의
    // 로컬 blob/storagePath 상태로 정직하게 판단(§ 파일 미저장 표시 정확도 라운드).
    const fc = getFileCase(doc);
    const hasFile = fc !== 'C';
    return `<div class="lib-row" data-doc-id="${esc(doc.id)}">
      <button type="button" class="lib-row-fav${doc.favorite?' active':''}" data-fav="${esc(doc.id)}" title="즐겨찾기">${doc.favorite?'★':'☆'}</button>
      <div class="lib-row-main" data-open="${esc(doc.id)}">
        <div class="lib-row-title">${esc(doc.title)}</div>
        <div class="lib-row-sub">${esc(docSubLabel(doc))} · ${esc(doc.originalFileName)}${!hasFile ? ' · 파일 미저장' : ''}</div>
      </div>
      <div class="lib-row-actions">
        ${hasFile && canPreviewInline(doc) ? `<button type="button" class="co-text-action" data-view="${esc(doc.id)}">보기</button>` : ''}
        ${hasFile
          ? `<button type="button" class="co-text-action" data-download="${esc(doc.id)}">다운로드</button>`
          : `<button type="button" class="co-text-action" data-download="${esc(doc.id)}" disabled>다운로드</button><span class="lib-file-missing">파일 연결 필요</span><button type="button" class="co-text-action" data-connect="${esc(doc.id)}">파일 연결</button>`}
      </div>
    </div>`;
  }

  function bindRowActions(container, afterDelete){
    container.querySelectorAll('[data-fav]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{ e.stopPropagation(); D.toggleFavorite(btn.getAttribute('data-fav')); renderAll(); });
    });
    container.querySelectorAll('[data-open]').forEach(el=>{
      el.addEventListener('click', ()=> openDetail(el.getAttribute('data-open')));
    });
    container.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const doc = D.findDoc(btn.getAttribute('data-view'));
        if(!doc) return;
        getDocUrl(doc).then(url=>{ if(url) window.open(url, '_blank', 'noopener'); })
          .catch(()=> showToast(btn, '불러오기 실패'));
      });
    });
    container.querySelectorAll('[data-download]').forEach(btn=>{
      if(btn.disabled) return; // CASE C — 실제 파일이 없으므로 클릭 핸들러 자체를 붙이지 않는다.
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const doc = D.findDoc(btn.getAttribute('data-download'));
        if(!doc) return;
        getDocUrl(doc).then(url=>{
          if(!url){ showToast(btn, '다운로드에 실패했습니다'); return; }
          const a = document.createElement('a');
          a.href = url; a.download = doc.originalFileName || doc.title || 'file';
          document.body.appendChild(a); a.click(); a.remove();
        }).catch(()=> showToast(btn, '다운로드에 실패했습니다'));
      });
    });
    // [파일 연결](§ 파일 미저장 표시 정확도 라운드) — CASE C(메타데이터만 있고 파일이
    // 어디에도 없는) 레코드에 실제 파일을 연결한다. 기존 D.replaceFile()을 그대로 재사용해
    // 새 레코드를 만들지 않고 같은 id의 storagePath/mimeType/size/originalFileName만
    // 갱신한다(title/category/workType/tags/year/description/favorite/createdAt은 손대지
    // 않음 — replaceFile 자체가 이 필드들만 바꾸도록 이미 구현돼 있다).
    container.querySelectorAll('[data-connect]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute('data-connect');
        const doc = D.findDoc(id);
        if(!doc) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = D.LIB_ACCEPT;
        input.addEventListener('change', ()=>{
          const f = input.files[0];
          if(!f) return;
          const prevText = btn.textContent;
          btn.disabled = true;
          btn.textContent = '연결 중...';
          D.replaceFile(doc.id, f, ()=>{}).then(()=>{
            renderAll();
          }).catch(err=>{
            btn.disabled = false;
            btn.textContent = prevText;
            const code = err && err.code;
            showToast(btn, code === 'SIZE_LIMIT' ? '용량 초과(2MB)' : '파일 연결 실패');
          });
        });
        input.click();
      });
    });
  }

  function renderList(){
    const docs = filteredDocs();
    if(!docs.length){
      libList.innerHTML = `<div class="kb-no-result">${D.loadDocs().length===0 ? '등록된 자료가 없습니다. + 자료 추가로 등록하세요.' : '검색 결과가 없습니다.'}</div>`;
      return;

    libList.innerHTML = docs.map(renderRow).join('');

  // ======================= 폴더 일괄 등록(신규) =======================
  // 폴더 선택은 <input type="file" webkitdirectory multiple>만 사용한다 — 서버/백엔드가 파일
  // 시스템에 접근하지 않으며, OS 네이티브 선택창이 사용자의 명시적 선택을 대신한다(§2, §10).
  // 이 기능은 기존 saveLibraryFile()/D.addDoc()을 파일 개수만큼 그대로 재사용한다 — 별도의
  // 업로드 경로를 새로 만들지 않는다(§8, 저장 로직 재사용 원칙).

  function libCleanFileNameTitle(fileName){
    const base = String(fileName || '').replace(/\.[^.]+$/, '');
    return base.replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || fileName;
  }

  // 기존 사용자 작성 레코드(title vs originalFileName)를 읽어 표기 스타일을 느슨하게 참고한다
  // (§4). 하드코딩된 규칙이 아니라 "대괄호로 공종/공법을 앞에 표기하는 비율이 높은가"만 보는
  // 휴리스틱이며, 이 결과는 항상 편집 가능한 기본값을 만드는 데만 쓰인다 — 자동 제출되지 않는다.
  function libAnalyzeTitleStyle(){
    const docs = D.loadDocs();
    if(!docs.length) return null; // 학습할 기존 레코드가 0개면 파일명 정리 폴백만 사용한다(§4).
    let bracketCount = 0;
    docs.forEach(d=>{ if(/^\s*[\[(][^\])]+[\])]/.test(d.title || '')) bracketCount++; });
    return { bracketPrefixRatio: bracketCount / docs.length };
  }

  function libSuggestTitle(fileName, commonWorkType, styleInfo){
    const cleaned = libCleanFileNameTitle(fileName);
    if(styleInfo && styleInfo.bracketPrefixRatio >= 0.5 && commonWorkType){
      return `[${commonWorkType}] ${cleaned}`;
    }
    return cleaned;
  }

  // 중복 가능성 판정: originalFileName 완전일치 또는 title 부분포함(단순 정규화 문자열 비교,
  // AI 유사도 판정 아님 — §6). 발견되어도 자동 제외/자동 덮어쓰기는 절대 하지 않고 표시만 한다.
  function libFindDupCandidate(fileName, title){
    const fn = norm(fileName);
    const t = norm(title);
    const docs = D.loadDocs();
    return docs.find(d=>{
      if(norm(d.originalFileName) === fn) return true;
      if(t && norm(d.title) && (norm(d.title).includes(t) || t.includes(norm(d.title)))) return true;
      return false;
    }) || null;
  }

  // 제한된 동시성(§8 "순차 또는 제한된 병렬")으로 tasks를 실행한다. 실패한 항목이 있어도 나머지는
  // 계속 진행하며, 이미 성공한 항목을 롤백하지 않는다.
  function libRunLimited(tasks, limit, onEach){
    return new Promise(resolve=>{
      const results = new Array(tasks.length);
      let idx = 0, active = 0, doneCount = 0;
      if(tasks.length === 0){ resolve(results); return; }
      function kick(){
        while(active < limit && idx < tasks.length){
          const i = idx++;
          active++;
          tasks[i]().then(v=> ({ ok:true, value:v })).catch(e=> ({ ok:false, error:e })).then(r=>{
            results[i] = r;
            active--; doneCount++;
            if(onEach) onEach(i, r);
            if(doneCount >= tasks.length){ resolve(results); return; }
            kick();
          });
        }
      }
      kick();
    });
  }

    // 폴더명: webkitRelativePath의 첫 세그먼트(선택된 폴더 이름). 없으면 "선택한 파일"로 대체.
    const firstRel = fileList[0].webkitRelativePath || '';
    const folderName = firstRel.indexOf('/') > -1 ? firstRel.split('/')[0] : '선택한 파일';
    const styleInfo = libAnalyzeTitleStyle();

    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = `

        <div class="kb-form-field">

            ${D.LIB_CATEGORIES.map(c=> `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="kb-form-field">
          <label>공종 (전체 파일 공통 — 파일마다 다시 입력하지 않습니다)</label>
          <input type="text" id="libBulkWorkType" />
        </div>
        <div id="libBulkListWrap">
          <div class="kb-form-field" style="margin-bottom:6px;"><label>등록할 파일</label></div>
          <div class="lib-bulk-list" id="libBulkList"></div>
        </div>
        <div id="libBulkErr" class="kb-form-error" style="display:none;">등록할 파일을 1개 이상 선택하세요.</div>
        <div class="kb-form-actions">
          <div class="lib-bulk-selcount" id="libBulkSelCount"></div>
          <div class="kb-form-actions-right">
            <button type="button" class="kb-text-action" id="libBulkCancel">취소</button>
            <button type="button" class="ai-run-btn" id="libBulkSubmit"></button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    // items: {file, checked, title} — originalFileName은 항상 file.name 그대로이며(§5) 제목
    // 편집 UI가 이 값을 절대 바꾸지 않는다. 아래에서 file 객체 자체도 읽기 전용으로만 쓴다(§10).
    const items = fileList.map(f=> ({
      file: f,
      checked: true,
      title: libSuggestTitle(f.name, '', styleInfo)
    }));

    const listEl = overlay.querySelector('#libBulkList');
    const selCountEl = overlay.querySelector('#libBulkSelCount');
    const submitBtn = overlay.querySelector('#libBulkSubmit');
    const categorySel = overlay.querySelector('#libBulkCategory');
    const workTypeInput = overlay.querySelector('#libBulkWorkType');

    function refreshSuggestedTitles(){
      // 공종 입력이 바뀌면(대괄호 스타일을 학습했을 때) 사용자가 아직 손대지 않은 제목만
      // 다시 제안한다 — 이미 직접 수정한 제목은 덮어쓰지 않는다(§4 "항상 편집 가능한 기본값").
      const wt = workTypeInput.value.trim();
      items.forEach(it=>{
        if(!it.edited){
          it.title = libSuggestTitle(it.file.name, wt, styleInfo);
        }
      });
    }

    function updateSelCount(){
      const n = items.filter(it=> it.checked).length;
      selCountEl.textContent = `선택 ${n}개`;
      submitBtn.textContent = `${n}개 등록`;
      submitBtn.disabled = n === 0;
    }

    function renderItems(){
      listEl.innerHTML = items.map((it, i)=>{
        const dup = libFindDupCandidate(it.file.name, it.title);
        return `<div class="lib-bulk-row${it.checked?'':' excluded'}" data-idx="${i}">
          <label class="lib-bulk-check">
            <input type="checkbox" class="lib-bulk-chk" data-chk="${i}" ${it.checked?'checked':''} />
            <span class="lib-bulk-fname" title="${esc(it.file.name)}">${esc(it.file.name)}</span>
          </label>
          <input type="text" class="lib-bulk-title" data-title="${i}" value="${esc(it.title)}" />
          ${dup ? `<span class="lib-bulk-dup" title="기존 자료와 파일명/제목이 비슷합니다">중복 가능</span>` : ''}
        </div>`;
      }).join('');
      listEl.querySelectorAll('[data-chk]').forEach(chk=>{
        chk.addEventListener('change', ()=>{
          const i = Number(chk.getAttribute('data-chk'));
          items[i].checked = chk.checked;
          renderItems();
          updateSelCount();
        });
      });
      listEl.querySelectorAll('[data-title]').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const i = Number(inp.getAttribute('data-title'));
          items[i].title = inp.value;
          items[i].edited = true; // 사용자가 직접 수정한 제목은 자동 재제안 대상에서 제외한다.
          const row = inp.closest('.lib-bulk-row');
          const dup = libFindDupCandidate(items[i].file.name, items[i].title);
          const existingBadge = row.querySelector('.lib-bulk-dup');
          if(dup && !existingBadge){
            const badge = document.createElement('span');
            badge.className = 'lib-bulk-dup';
            badge.title = '기존 자료와 파일명/제목이 비슷합니다';
            badge.textContent = '중복 가능';
            row.appendChild(badge);
          } else if(!dup && existingBadge){
            existingBadge.remove();
          }
        });
      });
    }

    renderItems();
    updateSelCount();

    categorySel.addEventListener('change', ()=>{ /* 공통 필드 — 파일마다 재입력 없음(§7) */ });
    workTypeInput.addEventListener('input', ()=>{ refreshSuggestedTitles(); renderItems(); updateSelCount(); });

    function close(){ overlay.remove(); }
    overlay.querySelector('#libBulkCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

    submitBtn.addEventListener('click', ()=>{
      const checkedItems = items.filter(it=> it.checked);
      overlay.querySelector('#libBulkErr').style.display = checkedItems.length ? 'none' : 'block';
      if(!checkedItems.length) return;
      submitBtn.disabled = true;
      overlay.querySelector('#libBulkCancel').disabled = true;
      const commonMeta = {
        category: categorySel.value,
        workType: workTypeInput.value.trim()
      };
      runBulkUpload(overlay, checkedItems, commonMeta);
    });
  }

  // runBulkUpload: 체크된 파일들을 제한된 병렬(3개)로 기존 D.addDoc()에 그대로 위임해 업로드한다
  // (§8). 개별 실패가 나머지 파일 처리를 막지 않고, 이미 성공한 파일을 되돌리지 않는다(§8, §9).
  // [UI 개선 라운드] 파일별 상태(대기/업로드 중/완료/실패+구체적 사유)를 배치 진행 중에도
  // 실시간으로 보여준다 — 끝날 때까지 카운트만 보이던 이전 방식과 달리, 어느 파일이 지금
  // 어떤 상태인지 사용자가 중간에도 알 수 있다. state.status: 'pending'|'uploading'|'ok'|'fail'.
  function runBulkUpload(overlay, checkedItems, commonMeta){
    const modal = overlay.querySelector('.kb-modal');
    const state = checkedItems.map(it=> ({ it, status:'pending', errInfo:null }));

    function statusLabel(s){
      if(s.status==='pending') return '대기';
      if(s.status==='uploading') return '업로드 중';
      if(s.status==='ok') return '업로드 완료';
      return '업로드 실패' + (s.errInfo ? ` (${s.errInfo.category}: ${s.errInfo.reason})` : '');
    }
    function statusRowsHtml(){
      return state.map((s,i)=> `<div class="lib-bulk-result-row" data-status-idx="${i}">
        <span class="lib-bulk-status ${s.status==='ok'?'ok':s.status==='fail'?'fail':''}">${s.status==='ok'?'✓':s.status==='fail'?'✕':'…'}</span>
        <span class="lib-bulk-result-name" title="${esc(s.it.file.name)}">${esc(s.it.file.name)}</span>
        <span class="lib-bulk-result-err ${s.status==='ok'?'ok':(s.status==='pending'||s.status==='uploading')?'pending':''}">${esc(statusLabel(s))}</span>
      </div>`).join('');
    }
    function renderProgress(){
      const doneCount = state.filter(s=> s.status==='ok' || s.status==='fail').length;
      modal.innerHTML = `
        <div class="kb-modal-title">폴더 일괄 등록 — 등록 중...</div>
        <div class="lib-bulk-summary">${doneCount} / ${state.length} 처리됨</div>
        <div class="lib-bulk-result-list">${statusRowsHtml()}</div>
      `;
    }
    renderProgress();

    const tasks = state.map(s=> ()=>{
      s.status = 'uploading';
      renderProgress();
      return D.addDoc(s.it.file, {
        title: (s.it.title || '').trim() || s.it.file.name,
        category: commonMeta.category,
        workType: commonMeta.workType
      }, null, {});
    });

    libRunLimited(tasks, 3, (i, r)=>{
      state[i].status = r.ok ? 'ok' : 'fail';
      state[i].errInfo = r.ok ? null : categorizeLibError(r.error);
      renderProgress();
    }).then(()=>{
      renderBulkResult(overlay, state, commonMeta);
      renderAll();
    });
  }

  function renderBulkResult(overlay, state, commonMeta){
    const modal = overlay.querySelector('.kb-modal');
    function successCount(){ return state.filter(s=> s.status==='ok').length; }
    function failedList(){ return state.filter(s=> s.status==='fail'); }

    function rowHtml(s, i){
      if(s.status==='ok') return `<div class="lib-bulk-result-row" data-status-idx="${i}">
        <span class="lib-bulk-status ok">✓</span>
        <span class="lib-bulk-result-name" title="${esc(s.it.file.name)}">${esc(s.it.file.name)}</span>
        <span class="lib-bulk-result-err ok">업로드 완료</span>
      </div>`;
      return `<div class="lib-bulk-result-row" data-status-idx="${i}">
        <span class="lib-bulk-status fail">✕</span>
        <span class="lib-bulk-result-name" title="${esc(s.it.file.name)}">${esc(s.it.file.name)}</span>
        <span class="lib-bulk-result-err">[${esc(s.errInfo.category)}] ${esc(s.errInfo.reason)}</span>
        <button type="button" class="co-text-action" data-retry="${i}">[다시 업로드]</button>
      </div>`;
    }
    function renderList(){
      const fc = failedList().length;
      modal.innerHTML = `
        <div class="kb-modal-title">폴더 일괄 등록 — 결과</div>
        <div class="lib-bulk-summary" id="libBulkResultSummary">성공 ${successCount()} / 실패 ${fc}</div>
        <div class="lib-bulk-result-list" id="libBulkResultList">${state.map(rowHtml).join('')}</div>
        <div class="kb-form-actions">
          <div>${fc>0 ? `<button type="button" class="kb-text-action" id="libBulkRetryAllBtn">[실패 ${fc}개 다시 업로드]</button>` : ''}</div>
          <div class="kb-form-actions-right">
            <button type="button" class="ai-run-btn" id="libBulkDone">완료</button>
          </div>
        </div>
      `;
      modal.querySelector('#libBulkDone').addEventListener('click', ()=> overlay.remove());
      const retryAllBtn = modal.querySelector('#libBulkRetryAllBtn');
      if(retryAllBtn) retryAllBtn.addEventListener('click', ()=> retryOne(null, retryAllBtn));
      modal.querySelectorAll('[data-retry]').forEach(btn=>{
        btn.addEventListener('click', ()=> retryOne(Number(btn.getAttribute('data-retry')), btn));
      });
    }

    // retryOne(i, btn): i===null이면 현재 실패 상태인 항목 전체를 재시도한다 — 이미 성공(ok)한
    // 항목은 절대 다시 건드리지 않는다(§9, 중복 방지). i가 지정되면 그 파일 하나만 재시도한다.
    function retryOne(i, btn){
      const targets = (i===null) ? state.map((s,idx)=> idx).filter(idx=> state[idx].status==='fail') : [i];
      if(!targets.length) return;
      btn.disabled = true;
      btn.textContent = '재시도 중...';
      Promise.all(targets.map(idx=>{
        const s = state[idx];
        return D.addDoc(s.it.file, {
          title: (s.it.title || '').trim() || s.it.file.name,
          category: commonMeta.category,
          workType: commonMeta.workType
        }, null, {}).then(()=>{
          s.status = 'ok'; s.errInfo = null;
        }).catch(err=>{
          s.status = 'fail'; s.errInfo = categorizeLibError(err);
        });
      })).then(()=>{
        renderList();
        renderAll();
      });
    }

    renderList();
  }

  const libBulkAddBtn = document.getElementById('libBulkAddBtn');
  const libBulkFolderInput = document.getElementById('libBulkFolderInput');
  if(libBulkAddBtn && libBulkFolderInput){
    libBulkAddBtn.addEventListener('click', ()=>{
      libBulkFolderInput.value = ''; // 같은 폴더를 연속으로 골라도 change가 다시 발생하도록 초기화.
      libBulkFolderInput.click();
    });
    libBulkFolderInput.addEventListener('change', ()=>{
      const files = libBulkFolderInput.files;
      if(files && files.length) openBulkForm(files);
      libBulkFolderInput.value = '';
    });
  }

  function openDetail(id){
    const doc = D.findDoc(id);
    if(!doc) return;
    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = `
      <div class="kb-modal">
        <div class="kb-modal-title">자료 수정</div>
        <div class="kb-form-field"><label>원본 파일명 (변경 불가 — 파일 교체로만 변경됨)</label><input type="text" value="${esc(doc.originalFileName)}" disabled /></div>
        <div class="kb-form-field">
          <label>자료명 (필수)</label>
          <input type="text" id="libEFTitle" value="${esc(doc.title)}" />
        </div>
        <div id="libEFTitleErr" class="kb-form-error" style="display:none;">자료명을 입력하세요.</div>
        <div class="kb-form-field">
          <label>자료분류</label>
          <select id="libEFCategory">
            <option value="">선택 안 함</option>
            ${D.LIB_CATEGORIES.map(c=> `<option value="${esc(c)}"${doc.category===c?' selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="kb-form-field"><label>공법</label><input type="text" id="libEFMethod" value="${esc(doc.method)}" /></div>
        <div class="kb-form-field"><label>공종</label><input type="text" id="libEFWorkType" value="${esc(doc.workType)}" /></div>
        <div class="kb-form-field"><label>연도</label><input type="text" id="libEFYear" value="${esc(doc.year)}" /></div>
        <div class="kb-form-field"><label>검색 태그 (쉼표로 구분)</label><input type="text" id="libEFTags" value="${esc((doc.tags||[]).join(', '))}" /></div>
        <div class="kb-form-field"><label>설명 · 메모</label><textarea id="libEFDesc">${esc(doc.description)}</textarea></div>

        <div class="kb-form-field">
          <label>파일 교체 (메타데이터 수정과 별개 — 새 파일 저장이 성공한 뒤에만 기존 파일이 바뀝니다)</label>
          <input type="file" id="libEFFile" accept="${D.LIB_ACCEPT}" />
          <div id="libEProgressWrap" style="display:none;"><div class="lib-progress"><div class="lib-progress-bar" id="libEProgressBar"></div></div></div>
          <div id="libEUploadErr" class="lib-upload-err" style="display:none;"></div>
        </div>

        <div class="kb-form-actions">
          <div id="libEActionsLeft"><button type="button" class="kb-text-action danger" id="libDeleteBtn">삭제</button></div>
          <div class="kb-form-actions-right">
            <button type="button" class="kb-text-action" id="libFormCancel">취소</button>
            <button type="button" class="ai-run-btn" id="libFormSave">저장</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); }
    overlay.querySelector('#libFormCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

    overlay.querySelector('#libFormSave').addEventListener('click', ()=>{
      const title = overlay.querySelector('#libEFTitle').value.trim();
      overlay.querySelector('#libEFTitleErr').style.display = title ? 'none' : 'block';
      if(!title) return;
      D.updateMeta(doc.id, {
        title,
        category: overlay.querySelector('#libEFCategory').value,
        method: overlay.querySelector('#libEFMethod').value.trim(),
        workType: overlay.querySelector('#libEFWorkType').value.trim(),
        year: overlay.querySelector('#libEFYear').value.trim(),
        tags: tagsToArr(overlay.querySelector('#libEFTags').value)
        ,description: overlay.querySelector('#libEFDesc').value.trim()
      });
      close();
      renderAll();
    });

    const efFile = overlay.querySelector('#libEFFile');
    const eProgressWrap = overlay.querySelector('#libEProgressWrap');
    const eProgressBar = overlay.querySelector('#libEProgressBar');
    const eErrBox = overlay.querySelector('#libEUploadErr');
    function tryReplace(f, opts){
      opts = opts || {};
      eErrBox.style.display = 'none';
      eErrBox.innerHTML = '';
      eProgressWrap.style.display = 'block';
      eProgressBar.style.width = '0%';
      const wasCloudAttempt = !opts.forceLocal && libCloudReady();
      D.replaceFile(doc.id, f, (pct)=>{ eProgressBar.style.width = pct + '%'; }, opts).then(()=>{
        close();
        renderAll();
      }).catch(err=>{
        const code = err && err.code;
        const cat = categorizeLibError(err);
        eErrBox.style.display = 'block';
        if(code === 'SIZE_LIMIT'){
          eErrBox.textContent = '[' + cat.category + '] ' + cat.reason + ' 기존 파일은 그대로 유지됩니다.';
          efFile.value = '';
          return;
        }
        // 실패해도 기존 파일/메타데이터는 그대로 유지된다(§9) — 여기서도 조용히 로컬로
        // 대체하지 않고, 재시도 또는 명시적 "이 기기에만 저장"만 다음 시도를 진행시킨다.
        eErrBox.textContent = '[' + cat.category + '] ' + cat.reason + ' 기존 파일은 그대로 유지됩니다. ';
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button'; retryBtn.className = 'co-text-action'; retryBtn.textContent = '[다시 시도]';
        retryBtn.addEventListener('click', ()=> tryReplace(f, opts));
        eErrBox.appendChild(retryBtn);
        if(wasCloudAttempt){
          const localBtn = document.createElement('button');
          localBtn.type = 'button'; localBtn.className = 'co-text-action'; localBtn.style.marginLeft = '8px';
          localBtn.textContent = '[이 기기에만 저장]';
          localBtn.addEventListener('click', ()=> tryReplace(f, { forceLocal:true }));
          eErrBox.appendChild(localBtn);
        }
        efFile.value = '';
      });
    }
    efFile.addEventListener('change', ()=>{
      const f = efFile.files[0];
      if(!f) return;
      tryReplace(f);
    });

    // 삭제 — 네이티브 confirm() 대신 인라인 확인만 사용(§10, 기존 co-confirm-row 관례).
    overlay.querySelector('#libDeleteBtn').addEventListener('click', ()=>{
      const left = overlay.querySelector('#libEActionsLeft');
      left.innerHTML = `<div class="kb-confirm-row"><span>이 자료를 삭제할까요?</span><button type="button" class="kb-text-action" id="libDelCancel">취소</button><button type="button" class="kb-text-action danger" id="libDelConfirm">삭제</button></div>`;
      overlay.querySelector('#libDelCancel').addEventListener('click', ()=>{ close(); openDetail(doc.id); });
      overlay.querySelector('#libDelConfirm').addEventListener('click', ()=>{
        D.deleteDoc(doc.id);
        close();
        renderAll();
      });
    });
  }

  libAddBtn.addEventListener('click', openAddForm);

  function onEnter(){
    renderCatTabs();
    renderAll();
  }

  window.SHIN2_LIBRARY = { onEnter, openDetail, getSearchable: D.getSearchable };
  renderCatTabs();
})();
</script>

<script>
(function(){
  // ================================================================================
  // 오늘의 투두 (우측 레일) — 마감 날짜 기준 자동 분류
  //
  // 저장: localStorage[ SHIN2_USER.nsKey('shin2-todos') ]  ← 기존 키/구조 그대로.
  // 항목: { id, text, done, completedAt, important?, dueDate? }
  //   - important / dueDate는 값이 있을 때만 붙는 선택 필드다. 기존 항목엔 없으므로
  //     각각 false / null로 취급한다(마이그레이션·초기화·재생성·ID 변경 없음).
  // 기존 "내 할 일"(사이드바 슬라이드 패널)과 같은 배열을 공유하며, 그쪽 코드는 고치지
  // 않는다 — 저장 후 'shin2-cloud-update'({key:'todos'})를 쏘면 그쪽 기존 리스너가
  // 알아서 다시 읽어 다시 그린다.
  //
  // 분류는 저장값이 아니라 "오늘 날짜"로 매번 새로 계산한다. 그래서 자정이 지나면
  // 사용자가 아무것도 안 해도 내일 → 오늘 → 1일 지남으로 저절로 이동한다.
  // ================================================================================
  var TODO_KEY = window.SHIN2_USER ? window.SHIN2_USER.nsKey('shin2-todos') : 'shin2-todos';
  var COLLAPSE_KEY = 'netform_todo_collapsed_v1';
  var DONE_FOLD_KEY = 'netform_todo_donefold_v1';
  var LEGACY_KEY = 'netform_todo_v1';
  var LEGACY_FLAG = 'netform_todo_merged_v1';

  var railEl = document.getElementById('todoRail');
  var listEl = document.getElementById('todoRailList');
  var badgeEl = document.getElementById('todoRailBadge');
  var inputEl = document.getElementById('todoRailInput');
  var addBtn = document.getElementById('todoRailAddBtn');
  var countEl = document.getElementById('todoRailCount');
  var clearBtn = document.getElementById('todoRailClearDone');
  var collapseBtn = document.getElementById('todoRailCollapse');
  var reopenBtn = document.getElementById('todoRailReopen');
  var dateBtn = document.getElementById('todoRailDateBtn');
  var dateRow = document.getElementById('todoRailDateRow');
  var dateInput = document.getElementById('todoRailDate');
  var duePick = document.getElementById('todoRailDuePick');
  var dateClear = document.getElementById('todoRailDateClear');
  if(!railEl || !listEl) return;

  var justDone = Object.create(null);   // 이 화면에서 방금 완료한 항목(취소선으로 잠시 유지)
  var pendingDue = '';                  // 입력 중인 마감일
  var doneFolded = false;
  try{ doneFolded = localStorage.getItem(DONE_FOLD_KEY) === '1'; }catch(e){}

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function genId(){
    return 'todo_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  // ---- 로컬(한국) 날짜 기준 계산 ----
  // new Date('YYYY-MM-DD')는 UTC로 해석돼 한국에서 하루가 밀리므로 절대 쓰지 않는다.
  // 연/월/일을 쪼개 로컬 자정 Date를 만들고, 오늘도 로컬 자정으로 정규화해서 뺀다.
  function parseDue(v){
    if(!v || typeof v !== 'string') return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v.trim());
    if(!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function todayMid(){
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function dayKey(){
    var n = new Date();
    return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
  }
  // 양수 = 지난 일수, 0 = 오늘, -1 = 내일, null = 마감일 없음
  function dueDiff(v){
    var d = parseDue(v);
    if(!d) return null;
    return Math.round((todayMid().getTime() - d.getTime()) / 86400000);
  }
  function dueOf(t){ return (t && t.dueDate) ? t.dueDate : null; }
  function isImportant(t){ return !!(t && t.important); }

  function dueText(v){
    var n = dueDiff(v);
    if(n === null) return '';
    if(n === 0) return '오늘';
    if(n > 0) return n + '일 지남';
    var d = parseDue(v);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  // 미완료 항목의 구역: over / today / tomorrow / future / plain
  function bucketOf(t){
    var n = dueDiff(dueOf(t));
    if(n === null) return 'plain';
    if(n > 0) return 'over';
    if(n === 0) return 'today';
    if(n === -1) return 'tomorrow';
    return 'future';
  }

  function load(){
    try{
      var raw = localStorage.getItem(TODO_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }

  var quotaWarned = false;
  function save(todos){
    try{
      localStorage.setItem(TODO_KEY, JSON.stringify(todos));
      quotaWarned = false;
    }catch(e){
      console.error('[오늘의 투두] 저장 실패', e);
      if(!quotaWarned){
        quotaWarned = true;
        alert('저장 공간이 부족하여 To-Do를 저장하지 못했습니다.');
      }
      return false;
    }
    try{
      if(window.__shin2CloudSync && typeof window.__shin2CloudSync.push === 'function'){
        window.__shin2CloudSync.push('todos', todos);
      }
    }catch(e){ console.error('[오늘의 투두] 클라우드 전달 실패', e); }
    try{
      window.dispatchEvent(new CustomEvent('shin2-cloud-update', { detail: { key: 'todos' } }));
    }catch(e){}
    return true;
  }

  // 통합 전 독립 저장소에 남아있던 항목을 1회만 합친다(원본 키는 지우지 않는다).
  function mergeLegacyOnce(){
    try{ if(localStorage.getItem(LEGACY_FLAG) === '1') return; }catch(e){ return; }
    var legacy = [];
    try{
      var raw = localStorage.getItem(LEGACY_KEY);
      legacy = raw ? JSON.parse(raw) : [];
    }catch(e){ legacy = []; }
    if(!Array.isArray(legacy)) legacy = [];
    var todos = load();
    var added = 0;
    legacy.forEach(function(x){
      if(!x || x.text == null) return;
      var text = String(x.text).trim();
      if(!text) return;
      if(todos.some(function(t){ return String(t.text == null ? '' : t.text).trim() === text; })) return;
      todos.push({ id: genId(), text: text, done: !!x.completed, completedAt: x.completed ? Date.now() : null });
      added++;
    });
    if(added) save(todos);
    try{ localStorage.setItem(LEGACY_FLAG, '1'); }catch(e){}
  }

  function rowHtml(it, bucket){
    var star = isImportant(it);
    var due = dueOf(it);
    return '<div class="todo-rail-row ' + (it.done ? 'done' : 'b-' + bucket) + (star ? ' important' : '') + '" data-id="' + esc(it.id) + '">' +
      '<input type="checkbox" data-act="toggle"' + (it.done ? ' checked' : '') + ' />' +
      '<span class="todo-rail-text">' + esc(it.text) + '</span>' +
      (due ? '<span class="todo-due d-' + (it.done ? 'plain' : bucket) + '">' + esc(dueText(due)) + '</span>' : '') +
      '<button type="button" class="todo-rail-star' + (star ? ' on' : '') + '" data-act="star" title="' + (star ? '중요 해제' : '중요 표시') + '" aria-label="중요 표시" aria-pressed="' + (star ? 'true' : 'false') + '">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8Z"/></svg>' +
      '</button>' +
      '<button type="button" class="todo-rail-del" data-act="del" title="삭제" aria-label="삭제">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>' +
      '</button>' +
    '</div>';
  }

  // 구역 안 정렬: 중요 먼저 → 마감일 빠른 순 → 기존 배열 순서
  function sortInSection(rows){
    return rows.map(function(t, i){ return { t: t, i: i }; })
      .sort(function(a, b){
        var ia = isImportant(a.t) ? 0 : 1, ib = isImportant(b.t) ? 0 : 1;
        if(ia !== ib) return ia - ib;
        var da = parseDue(dueOf(a.t)), db = parseDue(dueOf(b.t));
        if(da && db && da.getTime() !== db.getTime()) return da - db;
        return a.i - b.i;
      })
      .map(function(x){ return x.t; });
  }

  function secHtml(kind, label, rows, extraHead){
    if(rows.length === 0) return '';
    return '<div class="todo-sec ' + kind + '">' +
      '<div class="todo-sec-head"><span>' + label + '</span>' +
        (extraHead || '') +
        '<span class="n">' + rows.length + '</span>' +
      '</div>' +
      (kind === 'done' && doneFolded ? '' : rows.map(function(t){ return rowHtml(t, kind); }).join('')) +
    '</div>';
  }

  function render(){
    var todos = load();
    // 완료 항목은 이 화면에서 방금 체크한 것만 "완료한 일"에 잠시 남긴다
    // (기존 [처리완료] 이력 전체를 끌고 오면 목록이 길어져서).
    var visible = todos.filter(function(t){ return !t.done || justDone[t.id]; });
    var g = { today: [], over: [], tomorrow: [], future: [], plain: [], done: [] };
    visible.forEach(function(t){
      if(t.done){ g.done.push(t); return; }
      g[bucketOf(t)].push(t);
    });
    Object.keys(g).forEach(function(k){ g[k] = sortInSection(g[k]); });

    if(visible.length === 0){
      listEl.innerHTML = '<div class="todo-rail-empty">할 일이 없습니다. 위에서 추가해보세요.</div>';
    } else {
      listEl.innerHTML =
        secHtml('today', '오늘 해야 할 일', g.today) +
        secHtml('over', '기한 지난 일', g.over) +
        secHtml('tomorrow', '내일 해야 할 일', g.tomorrow) +
        secHtml('future', '예정된 일', g.future) +
        secHtml('plain', '일반 할 일', g.plain) +
        secHtml('done', '완료한 일', g.done,
          '<button type="button" class="todo-sec-toggle" data-act="foldDone">' + (doneFolded ? '펼치기' : '접기') + '</button>');
    }

    countEl.textContent = '전체 ' + visible.length + '개 · 완료 ' + g.done.length + '개';
    clearBtn.disabled = g.done.length === 0;
    var activeCount = todos.filter(function(t){ return !t.done; }).length;
    badgeEl.textContent = '미완료 ' + activeCount;
    badgeEl.classList.toggle('zero', activeCount === 0);
    var reopenCnt = document.getElementById('todoRailReopenCnt');
    if(reopenCnt) reopenCnt.textContent = String(activeCount);
  }

  // ---- 마감일 입력 ----
  function renderDuePick(){
    if(pendingDue){
      duePick.textContent = dueText(pendingDue);
      duePick.style.display = '';
      dateBtn.classList.add('on');
    } else {
      duePick.style.display = 'none';
      dateBtn.classList.remove('on');
    }
  }
  dateBtn.addEventListener('click', function(){
    var open = !dateRow.classList.contains('open');
    dateRow.classList.toggle('open', open);
    if(open){
      try{ if(dateInput.showPicker) dateInput.showPicker(); else dateInput.focus(); }catch(e){ dateInput.focus(); }
    }
  });
  dateInput.addEventListener('change', function(){
    pendingDue = dateInput.value || '';
    renderDuePick();
    // 네이티브 달력이 포커스를 물고 있으면 Enter가 날짜쪽으로 먹히므로 입력창으로 돌려준다.
    try{ inputEl.focus(); }catch(e){}
  });
  dateClear.addEventListener('click', function(){
    pendingDue = '';
    dateInput.value = '';
    renderDuePick();
  });

  function addItem(){
    var text = inputEl.value.trim();
    if(!text) return;
    var todos = load();
    var item = { id: genId(), text: text };
    if(pendingDue) item.dueDate = pendingDue;   // 고른 경우에만 필드를 넣는다
    todos.push(item);
    if(save(todos)){
      inputEl.value = '';
      pendingDue = '';
      dateInput.value = '';
      renderDuePick();
    }
    render();
  }
  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addItem(); }
  });

  // 목록은 매번 다시 그리므로 개별 리스너 대신 위임을 쓴다.
  listEl.addEventListener('click', function(e){
    var foldBtn = e.target.closest('[data-act="foldDone"]');
    if(foldBtn){
      doneFolded = !doneFolded;
      try{ localStorage.setItem(DONE_FOLD_KEY, doneFolded ? '1' : '0'); }catch(err){}
      render();
      return;
    }
    var starBtn = e.target.closest('[data-act="star"]');
    if(starBtn){
      var srow = starBtn.closest('.todo-rail-row');
      if(!srow) return;
      var sid = srow.getAttribute('data-id');
      var list = load();
      var st = list.find(function(x){ return x.id === sid; });
      if(!st){ render(); return; }
      st.important = !isImportant(st);
      save(list);
      render();
      return;
    }
    var btn = e.target.closest('[data-act="del"]');
    if(!btn) return;
    var row = btn.closest('.todo-rail-row');
    if(!row) return;
    var id = row.getAttribute('data-id');
    var todos = load().filter(function(x){ return x.id !== id; });
    delete justDone[id];
    save(todos);
    render();
  });
  listEl.addEventListener('change', function(e){
    var box = e.target.closest('[data-act="toggle"]');
    if(!box) return;
    var row = box.closest('.todo-rail-row');
    if(!row) return;
    var id = row.getAttribute('data-id');
    var todos = load();
    var t = todos.find(function(x){ return x.id === id; });
    if(!t){ render(); return; }
    // 기존 "내 할 일"과 같은 완료 처리(done/completedAt) — 이력을 지우지 않는다.
    t.done = !!box.checked;
    t.completedAt = t.done ? Date.now() : null;
    // 완료 해제 시에는 표식을 지운다 → 다음 render에서 오늘 날짜로 다시 계산돼
    // 정확한 구역(기한 지남/오늘/내일/일반)으로 돌아간다.
    if(t.done) justDone[id] = true; else delete justDone[id];
    save(todos);
    render();
  });

  clearBtn.addEventListener('click', function(){
    justDone = Object.create(null);
    render();
  });

  // ---- 접기/펼치기 ----
  function applyCollapsed(collapsed){
    railEl.classList.toggle('collapsed', collapsed);
    reopenBtn.classList.toggle('show', collapsed);
  }
  function setCollapsed(collapsed){
    applyCollapsed(collapsed);
    try{ localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0'); }catch(e){}
  }
  collapseBtn.addEventListener('click', function(){ setCollapsed(true); });
  reopenBtn.addEventListener('click', function(){ setCollapsed(false); });
  var stored = null;
  try{ stored = localStorage.getItem(COLLAPSE_KEY); }catch(e){}
  applyCollapsed(stored === null ? window.innerWidth < 1100 : stored === '1');

  // ---- 외부 변경 반영 ----
  window.addEventListener('storage', function(e){ if(e.key === TODO_KEY) render(); });
  window.addEventListener('shin2-cloud-update', function(e){
    if(e && e.detail && e.detail.key === 'todos') render();
  });
  var oldPanel = document.getElementById('todoPanel');
  if(oldPanel){
    oldPanel.addEventListener('click', function(){ setTimeout(render, 0); });
    oldPanel.addEventListener('focusout', function(){ setTimeout(render, 0); });
  }
  window.addEventListener('focus', function(){ render(); });

  // ---- 자정이 지나면 자동 재분류 ----
  // 분류를 저장하지 않고 매 render마다 오늘 날짜로 다시 계산하므로, 날짜가 바뀐 것만
  // 감지해 다시 그려주면 된다. 탭을 며칠 켜둬도 내일 → 오늘 → N일 지남으로 저절로 넘어간다.
  var lastDay = dayKey();
  setInterval(function(){
    var k = dayKey();
    if(k !== lastDay){ lastDay = k; render(); }
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    var k = dayKey();
    if(k !== lastDay) lastDay = k;
    render();
  });

  mergeLegacyOnce();
  renderDuePick();
  render();
})();
</script>

</body>
</html>
