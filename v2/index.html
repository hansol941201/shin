<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHIN 2</title>
<style>
  :root{
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --navy: #1E2A4A;
    --text: #1F2937;
    --text-muted: #6B7280;
    --line: #E5E7EB;
    --sidebar-w: 216px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--bg);
    padding:24px 14px;
    border-right:1px solid var(--line);
  }
  .brand{ padding:4px 10px 22px; }
  .brand-main{ font-size:16px; font-weight:700; color:var(--text); letter-spacing:0.2px; }
  .brand-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:7px;
    font-size:14px;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{ flex:0 0 auto; color:var(--text-muted); }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); font-weight:600; }
  .nav-item.active svg{ color:var(--navy); }
  .nav-item:hover:not(.active){ background:#F0F1F4; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:32px 36px 40px;
  }
  .main-inner{
    max-width:1160px;
    margin:0 auto;
  }

  .search-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }
  .search-box{
    width:100%;
    max-width:680px;
    display:flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .search-box:focus-within{
    border-color:#C7CEDB;
  }
  .search-box svg{ flex:0 0 auto; color:var(--text-muted); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:transparent;
  }
  .search-box input::placeholder{ color:#9CA3AF; }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-main">SHIN</div>
      <div class="brand-sub">업무 비서</div>
    </div>
    <nav class="nav">
      <button type="button" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
        <span>홈</span>
      </button>
    </nav>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="search-wrap">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" placeholder="업체, 업무, 자료 검색" />
        </div>
      </div>
      <div class="hint">SHIN — 필요한 내용을 검색해서 시작하세요.</div>
    </div>
  </main>
</div>

</body>
</html>
