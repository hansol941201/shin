<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한솔</title>
<style>
  :root{
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --navy: #1E2A4A;
    --text: #1F2937;
    --text-muted: #6B7280;
    --line: #E5E7EB;
    --sidebar-w: 216px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--bg);
    padding:24px 14px;
    border-right:1px solid var(--line);
  }
  .brand-main{ font-size:19px; font-weight:600; color:var(--navy); letter-spacing:0.2px; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:7px;
    font-size:14px;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{ flex:0 0 auto; color:var(--text-muted); }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); font-weight:600; }
  .nav-item.active svg{ color:var(--navy); }
  .nav-item:hover:not(.active){ background:#F0F1F4; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:32px 36px 40px;
  }
  .main-inner{
    max-width:1160px;
    margin:0 auto;
  }

  .search-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }
  .search-box{
    width:100%;
    max-width:680px;
    display:flex;
    align-items:center;
    gap:8px;
    height:42px;
    padding:0 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .search-box:focus-within{
    border-color:#C7CEDB;
  }
  .search-box svg{ flex:0 0 auto; color:var(--text-muted); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:transparent;
  }
  .search-box input::placeholder{ color:#9CA3AF; }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:10px;
  }

  /* ---------- Home content column (search + AI 문구정리 share the same left edge) ---------- */
  .home-col{
    max-width:800px;
    margin:0 auto;
  }
  .search-wrap{ justify-content:flex-start; }
  .search-box{ max-width:680px; }
  .hint{ text-align:left; }

  /* ---------- AI 문구정리 ---------- */
  .ai-section{
    margin-top:22px;
    max-width:800px;
  }
  .ai-title{
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .ai-subtitle{
    font-size:12px;
    color:var(--text-muted);
    margin-top:3px;
    margin-bottom:12px;
  }
  .ai-textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    line-height:1.5;
    outline:none;
  }
  .ai-textarea:focus{ border-color:#C7CEDB; }
  .ai-textarea::placeholder{ color:#9CA3AF; }

  .ai-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
  }
  .ai-types{ display:flex; gap:6px; }
  .ai-type-btn{
    height:30px;
    padding:0 12px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-type-btn:hover{ background:#F0F1F4; }
  .ai-type-btn.active{
    background:#EEF1F8;
    border-color:#EEF1F8;
    color:var(--navy);
    font-weight:600;
  }
  .ai-run-btn{
    height:32px;
    padding:0 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .ai-run-btn:hover{ opacity:0.92; }
  .ai-run-btn:disabled{ opacity:0.6; cursor:default; }

  .ai-error{
    margin-top:10px;
    font-size:12.5px;
    color:#B91C1C;
  }

  .ai-result{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .ai-result-label{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .ai-result-block + .ai-result-block{ margin-top:14px; }
  .ai-result-heading{
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .ai-result-text{
    white-space:pre-wrap;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
  }
  .ai-result-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .ai-copy-btn{
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-copy-btn:hover{ background:#F0F1F4; }
  .ai-new-btn{
    margin-top:14px;
    height:28px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .ai-new-btn:hover{ background:#F0F1F4; }

  /* ---------- API key modal ---------- */
  .ai-modal-overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .ai-modal{
    width:340px;
    background:var(--surface);
    border-radius:10px;
    border:1px solid var(--line);
    padding:20px;
  }
  .ai-modal-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .ai-modal-desc{ font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .ai-modal input{
    width:100%;
    height:36px;
    padding:0 10px;
    font-size:13px;
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .ai-modal input:focus{ border-color:#C7CEDB; }
  .ai-modal-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top:14px;
  }

  /* ---------- 계정 (accounts) ---------- */
  .accounts-view{ max-width:1160px; margin:0 auto; }

  .acct-unlock-wrap{
    display:flex;
    justify-content:center;
    padding-top:60px;
  }
  .acct-unlock-box{
    width:100%;
    max-width:320px;
    text-align:center;
  }
  .acct-unlock-title{ font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .acct-unlock-desc{ font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:16px; }
  .acct-unlock-input{
    width:100%;
    height:38px;
    padding:0 12px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    box-sizing:border-box;
  }
  .acct-unlock-input:focus{ border-color:#C7CEDB; }
  .acct-unlock-error{ font-size:12px; color:#B91C1C; margin-top:8px; text-align:left; }
  .acct-unlock-btn{ width:100%; margin-top:12px; }

  .acct-main-wrap{ display:flex; gap:0; align-items:flex-start; }
  .acct-list-col{ width:40%; flex:0 0 40%; min-width:0; padding-right:22px; }
  .acct-detail-col{
    width:60%; flex:0 0 60%; min-width:0;
    padding-left:22px;
    border-left:1px solid var(--line);
  }

  .acct-header{ display:flex; align-items:center; justify-content:space-between; }
  .acct-title{ font-size:16px; font-weight:700; color:var(--text); }
  .acct-add-btn{
    height:26px;
    padding:0 10px;
    font-size:12px;
    font-family:inherit;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .acct-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .acct-subtitle{ font-size:12px; color:var(--text-muted); margin-top:4px; margin-bottom:14px; }

  .acct-search-box{ max-width:none; height:36px; margin-bottom:10px; }

  .acct-list{ }
  .acct-empty{ font-size:12.5px; color:var(--text-muted); padding:14px 4px; }
  .acct-row{
    display:flex;
    align-items:center;
    gap:10px;
    height:46px;
    padding:0 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    border-radius:6px;
  }
  .acct-row:hover{ background:#F0F1F4; }
  .acct-row.active{ background:#EEF1F8; }
  .acct-row-site{ font-size:13.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-row-user{ font-size:12.5px; color:var(--text-muted); flex:0 0 auto; }
  .acct-row-chevron{ flex:0 0 auto; color:var(--text-muted); font-size:13px; }

  .acct-detail-empty{ font-size:12.5px; color:var(--text-muted); padding:8px 4px; }

  .acct-detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .acct-detail-title{ font-size:15px; font-weight:700; color:var(--text); }
  .acct-detail-close{
    border:none; background:transparent; cursor:pointer;
    font-size:16px; line-height:1; color:var(--text-muted); padding:2px 4px;
  }
  .acct-detail-close:hover{ color:var(--text); }

  .acct-field{ margin-bottom:16px; }
  .acct-field-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-field-row{ display:flex; align-items:center; gap:10px; }
  .acct-field-value{
    font-size:13.5px; color:var(--text);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acct-field-memo{ font-size:13.5px; color:var(--text); line-height:1.5; white-space:pre-wrap; }
  .acct-link-btn{
    flex:0 0 auto;
    border:none; background:transparent; cursor:pointer;
    font-size:12px; color:var(--text-muted); padding:2px 2px;
  }
  .acct-link-btn:hover{ color:var(--navy); }
  .acct-copied{ font-size:11px; color:var(--navy); }

  .acct-detail-actions{
    display:flex; gap:16px;
    margin-top:6px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .acct-text-action{
    border:none; background:transparent; cursor:pointer;
    font-size:12.5px; color:var(--text-muted); padding:2px 0;
  }
  .acct-text-action:hover{ color:var(--text); }
  .acct-text-action.danger:hover{ color:#B91C1C; }
  .acct-confirm-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }

  .acct-form-field{ margin-bottom:14px; }
  .acct-form-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .acct-form-field input, .acct-form-field textarea{
    width:100%;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
  }
  .acct-form-field input:focus, .acct-form-field textarea:focus{ border-color:#C7CEDB; }
  .acct-form-field textarea{ min-height:60px; resize:vertical; }
  .acct-form-error{ font-size:11.5px; color:#B91C1C; margin-top:-8px; margin-bottom:12px; }
  .acct-form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  /* ---------- 검색 결과 (홈 검색창) ---------- */
  .kb-search-results{ margin-top:14px; }
  .kb-hint-once{ font-size:11px; color:var(--text-muted); margin-bottom:8px; }
  .kb-result-group-label{ font-size:11px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; }
  .kb-result-group-label:first-child{ margin-top:0; }
  .kb-result-card{ padding:12px 0; border-bottom:1px solid var(--line); }
  .kb-result-card.top{ padding-top:2px; }
  .kb-result-cat{ font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .kb-result-title{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .kb-result-card:not(.top) .kb-result-title{ font-size:13px; font-weight:600; }
  .kb-script-line{ font-size:13.5px; line-height:1.9; color:var(--text); }
  .kb-hl{ background:#FEF6B2; padding:0 1px; border-radius:2px; }
  .kb-steps-label, .kb-contact-label, .kb-aftercall-label, .kb-extra-label{ font-size:11px; color:var(--text-muted); margin-top:12px; margin-bottom:3px; }
  .kb-steps-text{ font-size:13px; color:var(--text); line-height:1.6; }
  .kb-contact-line{ font-size:13px; color:var(--text); line-height:1.7; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kb-contact-name{ color:var(--navy); font-weight:600; }
  .kb-copy-btn{ border:none; background:transparent; cursor:pointer; font-size:11.5px; color:var(--text-muted); padding:1px 4px; }
  .kb-copy-btn:hover{ color:var(--navy); }
  .kb-copied-tag{ font-size:11px; color:var(--navy); }
  .kb-aftercall-text, .kb-extra-text, .kb-plain-content{ font-size:13px; color:var(--text-muted); line-height:1.6; white-space:pre-wrap; }
  .kb-aftercall-line{ display:flex; align-items:baseline; gap:7px; }
  .kb-aftercall-line + .kb-aftercall-line{ margin-top:2px; }
  .kb-aftercall-check{ color:#DC2626; font-size:12px; flex:0 0 auto; }
  .kb-contact-result-line{ font-size:13px; color:var(--text); }
  .kb-no-result{ font-size:12.5px; color:var(--text-muted); padding:10px 0; }

  /* ---------- 내 할 일 (사이드바 아이콘 + 우측 슬라이드 패널) ---------- */
  .brand{ padding:4px 10px 22px; display:flex; align-items:center; justify-content:space-between; }
  .todo-icon-btn{
    position:relative; z-index:62; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; padding:0;
    border:none; background:transparent; border-radius:6px; cursor:pointer;
    color:var(--text-muted);
  }
  .todo-icon-btn:hover{ background:#F0F1F4; color:var(--navy); }
  .todo-icon-btn.active{ background:#EEF1F8; color:var(--navy); }
  .todo-icon-badge{
    position:absolute; top:-3px; right:-4px;
    min-width:13px; height:13px; padding:0 3px;
    font-size:9px; font-weight:700; line-height:13px; text-align:center;
    color:var(--navy); background:#E7EAF3; border-radius:7px;
  }

  .todo-panel-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.12); z-index:60; display:none;
  }
  .todo-panel-overlay.open{ display:block; }
  .todo-panel{
    position:fixed; top:0; right:0; height:100vh; width:320px; max-width:88vw;
    background:var(--surface); border-left:1px solid var(--line);
    box-shadow:-6px 0 18px rgba(17,24,39,0.07);
    z-index:61; padding:20px 18px; box-sizing:border-box; overflow-y:auto;
    transform:translateX(100%); transition:transform .16s ease;
  }
  .todo-panel.open{ transform:translateX(0); }
  .todo-header{ display:flex; align-items:center; justify-content:space-between; }
  .todo-title{ font-size:14px; font-weight:700; color:var(--text); }
  .todo-panel-close{ border:none; background:transparent; cursor:pointer; font-size:17px; line-height:1; color:var(--text-muted); padding:2px 4px; }
  .todo-panel-close:hover{ color:var(--text); }
  .todo-add-toggle-row{ margin-top:14px; }
  .todo-add-row{ display:flex; gap:8px; margin-top:14px; }
  .todo-add-row input{
    flex:1; height:32px; padding:0 10px; font-size:13px; font-family:inherit;
    color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:6px; outline:none; box-sizing:border-box;
  }
  .todo-add-row input:focus{ border-color:#C7CEDB; }
  .todo-list{ margin-top:12px; }
  .todo-empty{ font-size:12.5px; color:var(--text-muted); padding:10px 4px; }
  .todo-row{ display:flex; align-items:center; gap:6px; padding:7px 2px; border-bottom:1px solid var(--line); }
  .todo-row:last-child{ border-bottom:none; }
  .todo-checkbox{ flex:0 0 auto; width:15px; height:15px; accent-color:var(--navy); cursor:pointer; }
  .todo-text{ flex:1; min-width:0; font-size:13px; color:var(--text); cursor:text; outline:none; padding:2px 2px; border-radius:3px; overflow-wrap:anywhere; }
  .todo-text:hover{ background:#F0F1F4; }
  .todo-move-btns{ display:flex; gap:2px; flex:0 0 auto; }
  .todo-move-btn{ border:none; background:transparent; cursor:pointer; font-size:11px; color:var(--text-muted); padding:2px 3px; }
  .todo-move-btn:hover{ color:var(--navy); }
  .todo-move-btn:disabled{ opacity:0.3; cursor:default; }
  .todo-del-btn{
    border:none; background:transparent; cursor:pointer; font-size:13px; color:var(--text-muted);
    padding:2px 4px; flex:0 0 auto; opacity:0; transition:opacity .1s ease;
  }
  .todo-row:hover .todo-del-btn{ opacity:1; }
  .todo-del-btn:hover{ color:#B91C1C; }

  .todo-toast{
    position:absolute; left:18px; right:18px; bottom:16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; color:var(--text); background:#F0F1F4; border:1px solid var(--line);
    border-radius:6px; padding:8px 10px;
  }
  .todo-toast-undo{ border:none; background:transparent; color:var(--navy); font-weight:700; font-size:12px; cursor:pointer; flex:0 0 auto; }
  .todo-toast-undo:hover{ text-decoration:underline; }

  /* ---------- 지식 페이지 ---------- */
  .kb-view{ max-width:1160px; margin:0 auto; }
  .kb-header{ display:flex; align-items:center; justify-content:space-between; }
  .kb-title{ font-size:16px; font-weight:700; color:var(--text); }
  .kb-add-btn{
    height:26px; padding:0 10px; font-size:12px; font-family:inherit;
    color:var(--text-muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer;
  }
  .kb-add-btn:hover{ background:#F0F1F4; color:var(--text); }
  .kb-search-box{ max-width:none; height:36px; margin:14px 0 10px; }
  .kb-tabs{ display:flex; gap:4px; margin-bottom:14px; }
  .kb-tab{
    height:28px; padding:0 12px; font-size:12.5px; font-family:inherit;
    color:var(--text-muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer;
  }
  .kb-tab:hover{ background:#F0F1F4; }
  .kb-tab.active{ background:#EEF1F8; border-color:#EEF1F8; color:var(--navy); font-weight:600; }
  .kb-list{ }
  .kb-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px;
    border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px;
  }
  .kb-row:hover{ background:#F0F1F4; }
  .kb-row-cat{ font-size:11px; color:var(--text-muted); flex:0 0 40px; }
  .kb-row-title{ font-size:13.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb-row-sub{ font-size:12px; color:var(--text-muted); flex:0 0 auto; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- 지식 등록/수정 모달 ---------- */
  .kb-modal-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.35);

  /* ---------- 사이트 잠금 화면 ---------- */

  .gate-enter-btn{
    width:100%; max-width:260px; height:38px;
    font-size:13px; font-family:inherit; font-weight:600; color:#fff;
    background:var(--navy); border:none; border-radius:6px; cursor:pointer;

  .gate-enter-btn:hover{ opacity:0.92; }

</style>
</head>

<script>
(function(){
  // SHIN(기존)과 동일한 localStorage 키를 그대로 재사용한다(같은 origin이므로 이미 공유됨).
  // 이 키 외에는 SHIN 2 코드가 어떤 기존 localStorage 키도 읽거나 쓰지 않는다.
  const OPENAI_KEY_STORAGE = 'work-guide-openai-key';
  const POUR_PREFIX = '[POUR공법]';

  function getApiKey(){
    return localStorage.getItem(OPENAI_KEY_STORAGE) || '';
  }
  function saveApiKey(key){
    localStorage.setItem(OPENAI_KEY_STORAGE, key);
  }

  function promptForApiKey(onSaved){
    const overlay = document.createElement('div');
    overlay.className = 'ai-modal-overlay';
    overlay.innerHTML = `
      <div class="ai-modal">
        <div class="ai-modal-title">OpenAI API 키 등록</div>
        <div class="ai-modal-desc">AI 문구정리를 사용하려면 최초 1회 API 키가 필요합니다.</div>
        <input type="text" id="aiKeyInput" placeholder="sk-..." />
        <div class="ai-modal-actions">
          <button type="button" class="ai-copy-btn" id="aiKeyCancel">취소</button>
          <button type="button" class="ai-run-btn" id="aiKeySave">저장</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#aiKeyInput');
    input.focus();
    function close(){ overlay.remove(); }
    overlay.querySelector('#aiKeyCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    overlay.querySelector('#aiKeySave').addEventListener('click', ()=>{
      const key = input.value.trim();
      if(!key) return;
      saveApiKey(key);
      close();
      onSaved(key);
    });
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ overlay.querySelector('#aiKeySave').click(); }
    });
  }

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const PROTECTED_FIELDS = '업체명, 아파트명, 전화번호, 담당자 이름, 직급, 날짜, 시간, 금액, 공종, 공법명, 특허번호, 주소, 면적, 요청사항, 회신 여부, 일정';

  const AI_RULES = `절대 규칙:
1. 입력에 있는 사실은 절대 삭제하지 마.
2. 입력에 없는 사실을 새로 지어내지 마.
3. 숫자, 날짜, 전화번호, 회사명, 아파트/건물명, 사람 이름은 절대 바꾸지 마.
4. 모르는 정보를 추측해서 채우지 마.
5. 뒤섞인 입력은 읽기 좋은 순서로 재배열해.
6. 진짜 중복된 표현만 자연스럽게 정리해.
7. 오타, 띄어쓰기, 맞춤법을 고쳐.
8. 아래 항목처럼 보이는 값이 입력에 있으면 절대 빠뜨리지 말고 그대로 반영해: ${PROTECTED_FIELDS}.
문체(어투)만 요청된 용도에 맞게 바꾸고, 내용(사실)은 사용자가 적은 그대로 유지해.`;

  function buildPrompt(type, text){
    if(type === 'kakao'){
      return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 카카오톡으로 보낼 업무 메시지로 정리해줘.
- 캐주얼하지만 예의 바른 톤으로, 짧고 자연스럽게, 모바일에서 읽기 편하도록 필요하면 줄바꿈해줘.
- 메모 내용상 고객/거래처에게 보내는 건지 내부 동료에게 보내는 건지 유추할 수 있으면 그에 맞게, 애매하면 무난하고 정중한 비즈니스 톤으로 작성해.
- 입력에 없는 직함/호칭을 새로 만들어내지 마.

${AI_RULES}

메모:
"""
${text}
"""

다른 설명 없이 정리된 메시지 문구만 출력해.`;
    }
    if(type === 'mail'){
      return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 바탕으로 업무 이메일의 제목과 본문을 작성해줘.
- 제목은 핵심 업무 내용을 간결하게 요약해.
- 본문은 "안녕하세요."로 시작하고, 메모 내용을 자연스러운 이메일 문장으로 풀어 쓰고, "확인 부탁드립니다." "감사합니다." 등으로 자연스럽게 마무리해도 좋아(형식은 유연하게).
- 반드시 아래 형식 그대로 출력해(다른 설명 금지):
제목: (제목 내용)
본문:
(본문 내용)

${AI_RULES}

메모:
"""
${text}
"""`;
    }
    // report (보고용, 기본값)
    return `아래는 업무 중 편하게 적은 메모입니다. 이 메모를 사내 업무보고용 문구로 정리해줘.
- 모든 사실을 보존하면서 읽기 좋은 순서로 재배열해.
- 중복 표현은 제거하고, 오타/맞춤법을 고치고, 불필요한 군더더기는 빼줘.
- 사내 메신저에 바로 붙여넣을 수 있는 정중하고 간결한 보고체 문장으로 작성해.

${AI_RULES}

메모:
"""
${text}
"""

다른 설명 없이 정리된 보고 문구만 출력해.`;
  }

  async function callOpenAI(apiKey, prompt){
    let res;
    try{
      res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model:'gpt-4o-mini',
          messages:[
            {role:'system', content:'너는 건설/시공 업무를 돕는 한국어 비서야. 항상 정중한 존댓말로, 요청받은 형식만 정확히 출력해.'},
            {role:'user', content: prompt}
          ],
          temperature:0.5
        })
      });
    } catch(networkErr){
      // fetch() 자체가 reject된 경우: 네트워크 단절 또는 CORS 정책에 의해 브라우저가
      // 요청/응답을 아예 막은 경우가 대부분이다(응답 status조차 받지 못함).
      const e = new Error('AI request network/CORS failure: ' + (networkErr && networkErr.message));
      e.kind = 'network';
      e.original = networkErr;
      throw e;
    }
    if(!res.ok){
      let detail = '';
      try{ detail = (await res.json()).error?.message || ''; }catch(e){}
      const e = new Error(`AI request failed: ${res.status} ${detail}`);
      e.kind = 'http';
      e.status = res.status;
      e.detail = detail;
      throw e;
    }
    let data;
    try{
      data = await res.json();
    } catch(parseErr){
      const e = new Error('AI request invalid JSON response: ' + (parseErr && parseErr.message));
      e.kind = 'parse';
      throw e;
    }
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content){
      const e = new Error('AI request empty response content');
      e.kind = 'empty';
      throw e;
    }
    return content.trim();
  }

  // 메일용 결과 파싱: "제목: ...\n본문:\n..." 형식을 분리한다.
  function parseMailResult(raw){
    const m = raw.match(/제목\s*[:：]\s*([^\n]*)\n+본문\s*[:：]\s*([\s\S]*)/);
    let subject, body;
    if(m){
      subject = m[1].trim();
      body = m[2].trim();
    } else {
      const lines = raw.split('\n');
      subject = (lines[0] || '').trim();
      body = lines.slice(1).join('\n').trim();
    }
    return { subject, body };
  }

  // [POUR공법] 접두사를 정확히 1회만 붙인다(이미 붙어있으면 중복 방지).
  function applyPourPrefix(subject){
    const s = (subject || '').trim();
    if(s.indexOf(POUR_PREFIX) === 0) return s;
    return POUR_PREFIX + ' ' + s;
  }

  const state = { type:'report', loading:false, error:'', result:null };

  const inputEl = document.getElementById('aiInput');
  const runBtn = document.getElementById('aiRunBtn');
  const errorEl = document.getElementById('aiError');
  const resultEl = document.getElementById('aiResult');
  const typesWrap = document.getElementById('aiTypes');

  typesWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ai-type-btn');
    if(!btn) return;
    state.type = btn.getAttribute('data-type');
    typesWrap.querySelectorAll('.ai-type-btn').forEach(b=>b.classList.toggle('active', b === btn));
  });

  function setError(msg){
    state.error = msg || '';
    errorEl.style.display = state.error ? 'block' : 'none';
    errorEl.textContent = state.error;
  }

  function setLoading(loading){
    state.loading = loading;
    runBtn.disabled = loading;
    runBtn.textContent = loading ? '정리 중...' : 'AI로 정리';
  }

  function renderResult(){
    if(!state.result){ resultEl.innerHTML = ''; return; }
    if(state.result.type === 'mail'){
      const { subject, body } = state.result;
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-heading">제목</div>
            <div class="ai-result-text" id="aiSubjectText">${escapeHtml(subject)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="subject">제목 복사</button>
            </div>
          </div>
          <div class="ai-result-block">
            <div class="ai-result-heading">본문</div>
            <div class="ai-result-text" id="aiBodyText">${escapeHtml(body)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="body">본문 복사</button>
              <button type="button" class="ai-copy-btn" data-copy="all">전체 복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    } else {
      resultEl.innerHTML = `
        <div class="ai-result">
          <div class="ai-result-label">수정 결과</div>
          <div class="ai-result-block">
            <div class="ai-result-text" id="aiPlainText">${escapeHtml(state.result.text)}</div>
            <div class="ai-result-actions">
              <button type="button" class="ai-copy-btn" data-copy="plain">복사</button>
            </div>
          </div>
          <button type="button" class="ai-new-btn" id="aiNewBtn">새 문구</button>
        </div>
      `;
    }
    resultEl.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-copy');
        let text = '';
        if(kind === 'subject') text = state.result.subject;
        else if(kind === 'body') text = state.result.body;
        else if(kind === 'all') text = `제목: ${state.result.subject}\n\n본문:\n${state.result.body}`;
        else text = state.result.text;
        navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
      });
    });
    const newBtn = document.getElementById('aiNewBtn');
    if(newBtn){
      newBtn.addEventListener('click', ()=>{
        inputEl.value = '';
        state.result = null;
        setError('');
        renderResult();
      });
    }
  }

  async function runAi(){
    if(state.loading) return;
    const text = inputEl.value.trim();
    if(!text) return;
    const apiKey = getApiKey();
    if(!apiKey){
      promptForApiKey((key)=> doRun(key, text));
      return;
    }
    doRun(apiKey, text);
  }

  async function doRun(apiKey, text){
    setError('');
    setLoading(true);
    const type = state.type;
    const prompt = buildPrompt(type, text);
    if(!apiKey){
      console.error('[SHIN2/AI] API key missing');
      setError('API 키가 없습니다. 다시 시도하면 키 등록창이 뜹니다.');
      setLoading(false);
      return;
    }
    try{
      const raw = await callOpenAI(apiKey, prompt);
      if(type === 'mail'){
        const { subject, body } = parseMailResult(raw);
        state.result = { type:'mail', subject: applyPourPrefix(subject), body };
      } else {
        state.result = { type, text: raw };
      }
      renderResult();
    } catch(err){
      // 화면에는 간단한 한국어 메시지만, 콘솔에는 실제 원인을 그대로 남긴다(개발/진단용).
      console.error('[SHIN2/AI] request failed:', err);
      if(err && err.kind === 'http' && err.status === 401){
        console.error('[SHIN2/AI] 401 Unauthorized — API 키가 잘못되었거나 만료됨');
        setError('API 키가 올바르지 않습니다. 설정에서 키를 다시 확인해주세요.');
      } else if(err && err.kind === 'http' && err.status === 429){
        console.error('[SHIN2/AI] 429 Too Many Requests — 요청 한도 초과 또는 결제/쿼터 문제');
        setError('요청이 많거나 사용 한도를 초과했습니다. 잠시 후 다시 시도해주세요.');
      } else if(err && err.kind === 'http'){
        console.error('[SHIN2/AI] HTTP', err.status, err.detail);
        setError(`문구 정리에 실패했습니다. (오류 코드 ${err.status})`);
      } else if(err && err.kind === 'network'){
        console.error('[SHIN2/AI] 네트워크/CORS로 요청 자체가 차단됨 — 브라우저가 응답을 받지 못했습니다.', err.original);
        setError('AI 서버에 연결할 수 없습니다. 네트워크 또는 브라우저 보안 정책(CORS) 문제일 수 있습니다.');
      } else {
        setError('문구 정리에 실패했습니다. 다시 시도해주세요.');
      }
    } finally {
      setLoading(false);
    }
  }

  runBtn.addEventListener('click', runAi);
  inputEl.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      runAi();
    }
  });

  // 다른 스크립트 블록(예: 지식 페이지의 "빠른 지식 추가")이 동일한 AI 호출 방식을 그대로 재사용할 수
  // 있도록 최소한의 함수만 노출한다. 새 fetch 로직을 만들지 않고 이 3개 함수만 공유한다.
  window.SHIN2_AI = { getApiKey, promptForApiKey, callOpenAI };
})();
</script>

<script>
(function(){
  // ---------- 화면 전환 (홈 / 계정) ----------
  const navHome = document.getElementById('navHome');
  const navAccounts = document.getElementById('navAccounts');
  const navKnowledge = document.getElementById('navKnowledge');
  const homeView = document.getElementById('homeView');
  const accountsView = document.getElementById('accountsView');
  const knowledgeView = document.getElementById('knowledgeView');

  function showView(view){
    homeView.style.display = view === 'home' ? 'block' : 'none';
    accountsView.style.display = view === 'accounts' ? 'block' : 'none';
    knowledgeView.style.display = view === 'knowledge' ? 'block' : 'none';
    navHome.classList.toggle('active', view === 'home');
    navAccounts.classList.toggle('active', view === 'accounts');
    navKnowledge.classList.toggle('active', view === 'knowledge');
  }
  navHome.addEventListener('click', ()=> showView('home'));
  navAccounts.addEventListener('click', ()=> showView('accounts'));
  navKnowledge.addEventListener('click', ()=>{
    showView('knowledge');
    if(window.SHIN2_KB) window.SHIN2_KB.renderKbList();
  });

  // ---------- 사이트 잠금 + 계정(비밀번호) 보관함 (통합 인증) ----------
  // 저장 위치: localStorage['shin2-accounts-vault'] = { salt, check:{cipher,iv}, records:[...] }
  // - salt/check/cipher/iv 는 비밀이 아닌 값(암호문·솔트)이며 이 위치에 저장해도 안전하다.
  // - 사이트 진입 비밀번호 원문은 어디에도 저장하지 않는다(localStorage/sessionStorage 모두 금지).
  // - "사이트 게이트"와 "계정함 암호화"는 하나의 비밀번호/파생 키를 공유한다: 사용자가 최초 진입 시
  //   입력한 비밀번호가 곧 이 계정함(shin2-accounts-vault)의 마스터 비밀번호이기도 하다. 같은
  //   salt로 같은 PBKDF2 파라미터를 거쳐 같은 AES-GCM 키가 나오므로, 계정 메뉴 진입 시 별도로
  //   다시 물어볼 필요가 없다.
  // - 새로고침 후에도(같은 탭) 다시 로그인시키지 않아야 한다는 요구사항(§4)을 만족시키려면 탭이
  //   유지되는 동안 파생 키가 어딘가에는 있어야 한다. CryptoKey 객체 자체는 새로고침 시 소멸하므로,
  //   PBKDF2로 유도한 "원시 키 바이트"만 base64로 sessionStorage에 두고(원본 비밀번호 문자열은
  //   절대 두지 않음), 새로고침 시 그 바이트를 다시 importKey 해서 CryptoKey를 복원한다.
  //   이는 "메모리에만" 원칙에서는 후퇴이지만(탭 종료 전까지는 sessionStorage에서 읽을 수 있음),
  //   sessionStorage는 탭을 닫으면 사라지므로 §3/§5(탭 종료 시 재인증)와는 부합한다. 보고서 참고.
  const ACCT_STORAGE_KEY = 'shin2-accounts-vault';
  const PBKDF2_ITERATIONS = 150000;
  const CHECK_PLAINTEXT = 'shin2-vault-check-v1';
  const GATE_SESSION_KEY = 'shin2-gate-session-key'; // sessionStorage: base64 raw AES-GCM 키 바이트(탭 한정)

  let vaultKey = null;      // CryptoKey, 메모리 변수 (탭 새로고침 시 sessionStorage에서 재구성)
  let vaultMeta = null;     // { salt, check } — localStorage에서 읽은 비밀 아닌 메타데이터
  const acctState = {
    records: [],
    search: '',
    selectedId: null,
    mode: 'view',        // 'view' | 'edit' | 'add'
    revealPassword: false,
    deleteConfirm: false
  };

  function b64FromBuf(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function bufFromB64(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }

  // PBKDF2로 원시 키 바이트를 직접 뽑아낸다(= deriveKey와 동일한 키 소재를 만들지만,
  // 바이트 형태로도 얻어야 새로고침용 sessionStorage 저장이 가능하다).
  async function deriveRawKeyBytes(password, saltBytes){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
      baseKey,
      256
    );
    return new Uint8Array(bits);
  }
  async function importAesKey(rawBytes){
    return crypto.subtle.importKey('raw', rawBytes, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
  }
  async function deriveKey(password, saltBytes){
    const rawBytes = await deriveRawKeyBytes(password, saltBytes);
    return importAesKey(rawBytes);
  }

  async function encryptStr(key, plaintext){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const cipherBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(plaintext));
    return { cipher: b64FromBuf(cipherBuf), iv: b64FromBuf(iv.buffer) };
  }
  async function decryptStr(key, cipherB64, ivB64){
    const iv = new Uint8Array(bufFromB64(ivB64));
    const cipherBuf = bufFromB64(cipherB64);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
    return new TextDecoder().decode(plainBuf);
  }

  function loadVaultRaw(){
    try{
      const raw = localStorage.getItem(ACCT_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!vaultMeta) return;
    const vault = { salt: vaultMeta.salt, check: vaultMeta.check, records: acctState.records };
    localStorage.setItem(ACCT_STORAGE_KEY, JSON.stringify(vault));
  }

  function maskUsername(u){
    if(!u) return '-';
    const prefix = u.slice(0, Math.min(4, u.length));
    return prefix + '****';
  }
  function genId(){
    return 'acct_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  const acctMainWrap = document.getElementById('acctMainWrap');

  // 계정 메뉴는 사이트 전체 잠금이 이미 통과된 뒤에만 보이므로, 별도의 마스터 비밀번호 화면 없이
  // vaultKey가 준비되는 즉시 바로 목록을 그린다. (아래 "사이트 잠금 게이트" 섹션에서 vaultKey 세팅)
  function refreshAccountsAfterUnlock(){
    acctState.selectedId = null;
    acctState.mode = 'view';
    renderList();
    renderDetail();
  }

  // ---------- 목록 ----------
  const acctList = document.getElementById('acctList');
  const acctSearchInput = document.getElementById('acctSearchInput');
  const acctAddBtn = document.getElementById('acctAddBtn');
  const acctDetailCol = document.getElementById('acctDetailCol');

  function filteredRecords(){
    const q = acctState.search.trim().toLowerCase();
    if(!q) return acctState.records;
    return acctState.records.filter(r=>
      (r.site||'').toLowerCase().includes(q) ||
      (r.username||'').toLowerCase().includes(q)
    );
  }

  function renderList(){
    const items = filteredRecords();
    if(items.length === 0){
      acctList.innerHTML = `<div class="acct-empty">${acctState.records.length === 0 ? '저장된 계정이 없습니다. 오른쪽 위 + 추가로 등록하세요.' : '검색 결과가 없습니다.'}</div>`;
      return;
    }
    acctList.innerHTML = items.map(r=>`
      <div class="acct-row${r.id === acctState.selectedId ? ' active' : ''}" data-id="${escapeAttr(r.id)}">
        <div class="acct-row-site">${escapeHtml2(r.site)}</div>
        <div class="acct-row-user">${escapeHtml2(maskUsername(r.username))}</div>
        <div class="acct-row-chevron">&#8250;</div>
      </div>
    `).join('');
    acctList.querySelectorAll('.acct-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        acctState.selectedId = row.getAttribute('data-id');
        acctState.mode = 'view';
        acctState.revealPassword = false;
        acctState.deleteConfirm = false;
        renderList();
        renderDetail();
      });
    });
  }

  acctSearchInput.addEventListener('input', ()=>{
    acctState.search = acctSearchInput.value;
    renderList();
  });

  acctAddBtn.addEventListener('click', ()=>{
    acctState.selectedId = null;
    acctState.mode = 'add';
    renderList();
    renderDetail();
  });

  function escapeHtml2(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escapeAttr(str){ return escapeHtml2(str); }

  // ---------- 상세 패널 ----------
  function getSelectedRecord(){
    return acctState.records.find(r=> r.id === acctState.selectedId) || null;
  }

  function showCopied(btn){
    const old = btn.nextElementSibling && btn.nextElementSibling.classList.contains('acct-copied') ? btn.nextElementSibling : null;
    if(old) old.remove();
    const span = document.createElement('span');
    span.className = 'acct-copied';
    span.textContent = '복사됨';
    btn.insertAdjacentElement('afterend', span);
    setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
  }

  function copyText(text, btn){
    if(!navigator.clipboard){ return; }
    navigator.clipboard.writeText(text).then(()=> showCopied(btn)).catch(()=>{});
  }

  async function renderDetail(){
    if(acctState.mode === 'add'){
      renderFormMode(null);
      return;
    }
    const rec = getSelectedRecord();
    if(!rec){
      acctDetailCol.innerHTML = `<div class="acct-detail-empty">목록에서 계정을 선택하세요.</div>`;
      return;
    }
    if(acctState.mode === 'edit'){
      renderFormMode(rec);
      return;
    }
    // view mode
    let pwDisplay = '••••••••••';
    if(acctState.revealPassword && rec.cipher){
      try{ pwDisplay = await decryptStr(vaultKey, rec.cipher, rec.iv); }
      catch(e){ pwDisplay = '(복호화 실패)'; }
    } else if(!rec.cipher){
      pwDisplay = '-';
    }

    const urlRowHtml = rec.url ? `
      <div class="acct-field">
        <div class="acct-field-label">사이트</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.url)}</div>
          <a class="acct-link-btn" href="${escapeAttr(rec.url)}" target="_blank" rel="noopener noreferrer">열기</a>
        </div>
      </div>` : '';
    const memoRowHtml = rec.memoPlain ? `
      <div class="acct-field">
        <div class="acct-field-label">메모</div>
        <div class="acct-field-memo">${escapeHtml2(rec.memoPlain)}</div>
      </div>` : '';

    acctDetailCol.innerHTML = `
      <div class="acct-detail-head">
        <div class="acct-detail-title">${escapeHtml2(rec.site)}</div>
        <button type="button" class="acct-detail-close" id="acctCloseBtn">&times;</button>
      </div>
      <div class="acct-field">
        <div class="acct-field-label">아이디</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(rec.username || '-')}</div>
          <button type="button" class="acct-link-btn" id="acctCopyUser">복사</button>
        </div>
      </div>
      <div class="acct-field">
        <div class="acct-field-label">비밀번호</div>
        <div class="acct-field-row">
          <div class="acct-field-value">${escapeHtml2(pwDisplay)}</div>
          ${rec.cipher ? `<button type="button" class="acct-link-btn" id="acctCopyPw">복사</button><button type="button" class="acct-link-btn" id="acctTogglePw">${acctState.revealPassword ? '숨기기' : '보기'}</button>` : ''}
        </div>
      </div>
      ${urlRowHtml}
      ${memoRowHtml}
      <div class="acct-detail-actions" id="acctActionsRow">
        <button type="button" class="acct-text-action" id="acctEditBtn">수정</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteBtn">삭제</button>
      </div>
    `;

    document.getElementById('acctCloseBtn').addEventListener('click', closeDetail);
    document.getElementById('acctCopyUser').addEventListener('click', (e)=> copyText(rec.username || '', e.currentTarget));
    const copyPwBtn = document.getElementById('acctCopyPw');
    if(copyPwBtn){
      copyPwBtn.addEventListener('click', async (e)=>{
        try{
          const pw = await decryptStr(vaultKey, rec.cipher, rec.iv);
          copyText(pw, e.currentTarget);
        }catch(err){}
      });
    }
    const toggleBtn = document.getElementById('acctTogglePw');
    if(toggleBtn){
      toggleBtn.addEventListener('click', ()=>{
        acctState.revealPassword = !acctState.revealPassword;
        renderDetail();
      });
    }
    document.getElementById('acctEditBtn').addEventListener('click', ()=>{
      acctState.mode = 'edit';
      renderDetail();
    });
    document.getElementById('acctDeleteBtn').addEventListener('click', ()=>{
      renderDeleteConfirm(rec);
    });
  }

  function renderDeleteConfirm(rec){
    const actionsRow = document.getElementById('acctActionsRow');
    if(!actionsRow) return;
    actionsRow.innerHTML = `
      <div class="acct-confirm-row">
        <span>정말 삭제하시겠습니까?</span>
        <button type="button" class="acct-text-action" id="acctDeleteCancel">취소</button>
        <button type="button" class="acct-text-action danger" id="acctDeleteConfirm">삭제</button>
      </div>
    `;
    document.getElementById('acctDeleteCancel').addEventListener('click', ()=> renderDetail());
    document.getElementById('acctDeleteConfirm').addEventListener('click', ()=>{
      acctState.records = acctState.records.filter(r=> r.id !== rec.id);
      persist();
      closeDetail();
    });
  }

  function closeDetail(){
    acctState.selectedId = null;
    acctState.mode = 'view';
    acctState.revealPassword = false;
    renderList();
    renderDetail();
  }

  // ---------- 폼 모드 (추가 / 수정) ----------
  function renderFormMode(rec){
    const isNew = !rec;
    acctDetailCol.innerHTML = `
      <div class="acct-detail-head">
        <div class="acct-detail-title">${isNew ? '새 계정' : escapeHtml2(rec.site)}</div>
      </div>
      <div class="acct-form-field">
        <label>사이트명</label>
        <input type="text" id="acctFormSite" value="${isNew ? '' : escapeAttr(rec.site)}" />
      </div>
      <div id="acctFormSiteError" class="acct-form-error" style="display:none;">사이트명을 입력하세요.</div>
      <div class="acct-form-field">
        <label>사이트 주소</label>
        <input type="text" id="acctFormUrl" value="${isNew ? '' : escapeAttr(rec.url || '')}" placeholder="https://" />
      </div>
      <div class="acct-form-field">
        <label>아이디</label>
        <input type="text" id="acctFormUser" value="${isNew ? '' : escapeAttr(rec.username || '')}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>비밀번호</label>
        <input type="text" id="acctFormPw" value="" placeholder="${isNew ? '' : '변경하지 않으려면 비워두지 말고 그대로 다시 입력하세요'}" autocomplete="off" />
      </div>
      <div class="acct-form-field">
        <label>메모</label>
        <textarea id="acctFormMemo">${isNew ? '' : escapeHtml2(rec.memoPlain || '')}</textarea>
      </div>
      <div class="acct-form-actions">
        <button type="button" class="acct-text-action" id="acctFormCancel">취소</button>
        <button type="button" class="ai-run-btn" id="acctFormSave">저장</button>
      </div>
    `;

    // 수정 모드에서는 기존 비밀번호를 미리 채워 보여준다(스펙: "현재 값이 채워진 채로").
    if(!isNew && rec.cipher){
      decryptStr(vaultKey, rec.cipher, rec.iv).then(pw=>{
        const pwInput = document.getElementById('acctFormPw');
        if(pwInput) pwInput.value = pw;
      }).catch(()=>{});
    }

    document.getElementById('acctFormCancel').addEventListener('click', ()=>{
      if(isNew){
        acctState.mode = 'view';
        acctState.selectedId = null;
      } else {
        acctState.mode = 'view';
      }
      renderList();
      renderDetail();
    });

    document.getElementById('acctFormSave').addEventListener('click', async ()=>{
      const siteEl = document.getElementById('acctFormSite');
      const site = siteEl.value.trim();
      const errEl = document.getElementById('acctFormSiteError');
      if(!site){
        errEl.style.display = 'block';
        siteEl.focus();
        return;
      }
      errEl.style.display = 'none';
      const url = document.getElementById('acctFormUrl').value.trim();
      const username = document.getElementById('acctFormUser').value.trim();
      const pwVal = document.getElementById('acctFormPw').value;
      const memo = document.getElementById('acctFormMemo').value.trim();

      let cipher = null, iv = null;
      if(pwVal){
        const enc = await encryptStr(vaultKey, pwVal);
        cipher = enc.cipher; iv = enc.iv;
      }

      if(isNew){
        const newRec = { id: genId(), site, url, username, memoPlain: memo, cipher, iv };
        acctState.records.push(newRec);
        persist();
        acctState.selectedId = newRec.id;
      } else {
        rec.site = site;
        rec.url = url;
        rec.username = username;
        rec.memoPlain = memo;
        rec.cipher = cipher;
        rec.iv = iv;
        persist();
      }
      acctState.mode = 'view';
      acctState.revealPassword = false;
      renderList();
      renderDetail();
    });
  }

  // ---------- 사이트 잠금 게이트 ----------
  // 사이트 진입 비밀번호 = 이 계정함(ACCT_STORAGE_KEY)의 마스터 비밀번호. 하나의 비밀번호로
  // (a) 사이트 게이트 통과 여부와 (b) 계정함 암호화 키 유도를 동시에 수행한다.
  const gateScreen = document.getElementById('gateScreen');
  const gateDesc = document.getElementById('gateDesc');
  const gatePasswordInput = document.getElementById('gatePasswordInput');
  const gateError = document.getElementById('gateError');
  const gateEnterBtn = document.getElementById('gateEnterBtn');
  const appRoot = document.getElementById('appRoot');
  const siteLockBtn = document.getElementById('siteLockBtn');

  function showGateError(msg){
    gateError.textContent = msg;
    gateError.style.display = msg ? 'block' : 'none';
  }

  function refreshGateDesc(){
    gateDesc.textContent = loadVaultRaw()
      ? '비밀번호를 입력해주세요'
      : '처음 사용하시네요. 사용할 비밀번호를 정해주세요';
  }

  function showGate(){
    appRoot.style.display = 'none';
    gateScreen.style.display = 'flex';
    gatePasswordInput.value = '';
    showGateError('');
    refreshGateDesc();
    gatePasswordInput.focus();
  }

  function showApp(){
    gateScreen.style.display = 'none';
    appRoot.style.removeProperty('display');
  }

  // sessionStorage: 유도된 AES-GCM 키의 "원시 바이트"만 base64로 저장한다(원본 비밀번호 문자열은
  // 절대 저장하지 않음). 탭을 닫으면 sessionStorage가 사라지므로 재접속 시 다시 인증을 요구하게 된다.
  function saveSessionKeyBytes(rawBytes){
    try{ sessionStorage.setItem(GATE_SESSION_KEY, b64FromBuf(rawBytes.buffer)); }catch(e){}
  }
  function loadSessionKeyBytes(){
    try{
      const b64 = sessionStorage.getItem(GATE_SESSION_KEY);
      return b64 ? new Uint8Array(bufFromB64(b64)) : null;
    }catch(e){ return null; }
  }
  function clearSessionKeyBytes(){
    try{ sessionStorage.removeItem(GATE_SESSION_KEY); }catch(e){}
  }

  async function tryAutoUnlockFromSession(){
    const rawBytes = loadSessionKeyBytes();
    if(!rawBytes) return false;
    const existing = loadVaultRaw();
    if(!existing){ clearSessionKeyBytes(); return false; }
    try{
      const key = await importAesKey(rawBytes);
      const decoded = await decryptStr(key, existing.check.cipher, existing.check.iv);
      if(decoded !== CHECK_PLAINTEXT) throw new Error('check mismatch');
      vaultMeta = { salt: existing.salt, check: existing.check };
      vaultKey = key;
      acctState.records = Array.isArray(existing.records) ? existing.records : [];
      return true;
    }catch(e){
      clearSessionKeyBytes();
      return false;
    }
  }

  async function handleGateEnter(){
    const pw = gatePasswordInput.value;
    showGateError('');
    if(!pw) return;
    gateEnterBtn.disabled = true;
    try{
      const existing = loadVaultRaw();
      if(!existing){
        // 최초 진입: 이 비밀번호를 사이트 비밀번호 겸 계정함 마스터 비밀번호로 새로 설정한다.
        const saltBytes = crypto.getRandomValues(new Uint8Array(16));
        const rawBytes = await deriveRawKeyBytes(pw, saltBytes);
        const key = await importAesKey(rawBytes);
        const check = await encryptStr(key, CHECK_PLAINTEXT);
        vaultMeta = { salt: b64FromBuf(saltBytes.buffer), check };
        vaultKey = key;
        acctState.records = [];
        persist();
        saveSessionKeyBytes(rawBytes);
        showApp();
        refreshAccountsAfterUnlock();
        window.dispatchEvent(new CustomEvent('shin2-app-unlocked'));
        return;
      }
      const saltBytes = new Uint8Array(bufFromB64(existing.salt));
      const rawBytes = await deriveRawKeyBytes(pw, saltBytes);
      const key = await importAesKey(rawBytes);
      let ok = false;
      try{
        const decoded = await decryptStr(key, existing.check.cipher, existing.check.iv);
        ok = (decoded === CHECK_PLAINTEXT);
      }catch(e){ ok = false; }
      if(!ok){
        showGateError('비밀번호가 올바르지 않습니다.');
        return;
      }
      vaultMeta = { salt: existing.salt, check: existing.check };
      vaultKey = key;
      acctState.records = Array.isArray(existing.records) ? existing.records : [];
      saveSessionKeyBytes(rawBytes);
      showApp();
      refreshAccountsAfterUnlock();
      window.dispatchEvent(new CustomEvent('shin2-app-unlocked'));
    } finally {
      gateEnterBtn.disabled = false;
    }
  }

  gateEnterBtn.addEventListener('click', handleGateEnter);
  gatePasswordInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleGateEnter(); });

  siteLockBtn.addEventListener('click', ()=>{
    vaultKey = null;
    vaultMeta = null;
    acctState.records = [];
    acctState.selectedId = null;
    acctState.mode = 'view';
    clearSessionKeyBytes();
    showGate();
  });

  (async function initGate(){
    const restored = await tryAutoUnlockFromSession();
    if(restored){
      showApp();
      refreshAccountsAfterUnlock();
      window.dispatchEvent(new CustomEvent('shin2-app-unlocked'));
    } else {
      showGate();
    }
  })();

  // 통합검색용 확장 포인트: 계정함의 사이트명/아이디만 노출한다(비밀번호/URL/메모는 절대 포함하지 않음).
  // 한솔1 이전(migration) 전용 API: sourceSystem/sourceId 기준으로 중복을 건너뛰고, 비밀번호는 항상
  // 이 계정함과 동일한 AES-GCM 키로 암호화해서만 저장한다(평문 저장 금지). 잠금 상태(vaultKey 없음)면
  // 아무 것도 하지 않고 blocked 사유를 반환한다 — 잠금 해제 이벤트에서 다시 호출하면 된다.
  async function migrateAddAccounts(records){
    if(!vaultKey) return { added:0, skipped:0, blocked:(records||[]).length, reason:'locked' };
    let added = 0, skipped = 0;
    for(const r of (records||[])){
      if(acctState.records.some(x=> x.sourceSystem === 'hansol1' && x.sourceId === r.sourceId)){ skipped++; continue; }
      let cipher = null, iv = null;
      if(r.password){
        const enc = await encryptStr(vaultKey, r.password);
        cipher = enc.cipher; iv = enc.iv;
      }
      acctState.records.push({
        id: genId(), site: r.site || '', url: r.url || '', username: r.username || '',
        memoPlain: r.memo || '', cipher, iv, sourceSystem: 'hansol1', sourceId: r.sourceId
      });
      added++;
    }
    if(added) persist();
    return { added, skipped };
  }
  window.SHIN2_ACCOUNTS = {
    getSearchable: function(){
      return acctState.records.map(r=> ({ id: r.id, site: r.site, username: r.username }));
    },
    migrateAdd: migrateAddAccounts,
    isUnlocked: function(){ return !!vaultKey; }
  };
  window.dispatchEvent(new CustomEvent('shin2-accounts-api-ready'));
})();
</script>

<script>
(function(){
  // ---------- 업무 지식 (검색창 + 지식 관리 페이지) ----------
  // 저장 위치: localStorage['shin2-knowledge-v1'] = { items:[...], contacts:[...] }
  // 이 기능에는 AI 개입이 없다. 사용자가 직접 추가/수정/삭제하는 순수 입력 데이터다.
  const KB_STORAGE_KEY = 'shin2-knowledge-v1';
  const KB_HINT_SEEN_KEY = 'shin2-kb-hint-seen';
  const CAT_LABEL = { response:'응대', task:'업무', method:'공법', unclassified:'미분류' };

  // items/contacts는 기존 그대로. importBatches는 "빠른 지식 추가"가 쓰는 신규 배열로, 같은
  // 저장소(KB_STORAGE_KEY)에 얹는다(§ 구현노트: 별도 localStorage 키를 새로 만들지 않는다).
  const kbState = { items: [], contacts: [], importBatches: [], filter: 'all', search: '' };

  function kbNormalize(s){ return (s == null ? '' : String(s)).trim().toLowerCase(); }
  function kbEscapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function kbEscapeAttr(str){ return kbEscapeHtml(str); }
  function genKbId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  function loadKbRaw(){
    try{
      const raw = localStorage.getItem(KB_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveKb(){
    localStorage.setItem(KB_STORAGE_KEY, JSON.stringify({ items: kbState.items, contacts: kbState.contacts, importBatches: kbState.importBatches }));
  }

  function seedIfEmpty(){
    const existing = loadKbRaw();
    if(existing){
      kbState.items = Array.isArray(existing.items) ? existing.items : [];
      kbState.contacts = Array.isArray(existing.contacts) ? existing.contacts : [];
      kbState.importBatches = Array.isArray(existing.importBatches) ? existing.importBatches : [];
      return;
    }
    const c1 = { id:genKbId('ct'), name:'심혜진', role:'연구원', dept:'', phone:'010-9954-7653', area:'공법/자재 기술관련 · 시방서 기술문의', keywords:['기술문의','시방서','시방서 기술문의','공법기술','심혜진'], memo:'' };
    const c2 = { id:genKbId('ct'), name:'한준엽', role:'과장', dept:'', phone:'010-3355-3458', area:'공사일정', keywords:['공사일정','일정','한준엽'], memo:'' };
    const c3 = { id:genKbId('ct'), name:'정정훈', role:'과장', dept:'', phone:'010-8003-6900', area:'하자보수', keywords:['하자보수','하자','정정훈'], memo:'' };
    const c4 = { id:genKbId('ct'), name:'이란', role:'매니저', dept:'', phone:'1800-8203', area:'스토어', keywords:['스토어','이란'], memo:'' };
    const c5 = { id:genKbId('ct'), name:'', role:'', dept:'용인공장', phone:'010-2737-3394', area:'폐기물 처리과정/신청', keywords:['폐기물','폐기물 처리','용인공장'], memo:'' };
    const c6 = { id:genKbId('ct'), name:'', role:'', dept:'', phone:'010-9291-3892', area:'미팅일정/시공사', keywords:['미팅일정','시공사'], memo:'' };
    const c7 = { id:genKbId('ct'), name:'', role:'', dept:'', phone:'010-8678-9398', area:'아파트 문의', keywords:['아파트 문의','아파트'], memo:'' };
    kbState.contacts = [c1,c2,c3,c4,c5,c6,c7];

    const i1 = {
      id: genKbId('kb'), category:'response', title:'견적문의',
      keywords:['견적','견적문의','견적요청','견적궁금','공사견적','견적질문'],
      scriptLines:['어느 아파트에서 전화주셨을까요?','정확한 현장 확인을 위해 도로명 주소도 부탁드립니다.','어떤 공종을 검토하고 계실까요?'],
      steps:['아파트명','주소','공종','견적요청 내용','유입경로'],
      afterCall:'POUR공법 문의 및 응대 토픽방 등록',
      extraNote:'',
      contactLinks:[{ contactId:c6.id, role:'시공사 문의' }]
    };
    const i2 = {
      id: genKbId('kb'), category:'method', title:'특허번호 차이',
      keywords:['특허','특허번호','공법특허'],
      content:'특허번호마다 차이는 없습니다. 같은 공종이며 연구개발을 통해 갱신·등록하고 있습니다. 어떤 특허를 사용해도 동일합니다.'
    };
    const i3 = {
      id: genKbId('kb'), category:'task', title:'자재발주',
      keywords:['자재','자재발주'],
      content:'필요 자재 소요량을 확인한 뒤 발주 요청서를 작성하여 담당 부서에 전달합니다. 발주 후 입고 예정일을 확인하고 현장과 공유합니다. (세부 절차는 필요에 따라 직접 수정해서 사용하세요.)'
    };
    kbState.items = [i1,i2,i3];
    saveKb();
  }
  seedIfEmpty();

  // ---------- 통합검색 우선순위: 1)제목/이름 정확 2)제목/이름 부분 3)keyword 정확 4)keyword 부분
  // 5)본문/원문(originalText) 6)담당자/연락처 등 연관정보 ----------
  // originalText는 향후 "한솔1 데이터 가져오기"/"AI 자동분류 빠른메모" 기능이 채우기 시작할 필드다.
  // 이 인덱스는 원본 데이터를 읽기만 할 뿐 어떤 필드도 수정하지 않는다(파생 데이터, 캐시 아님).
  function kbScoreItem(item, q){
    if(!q) return 0;
    const title = kbNormalize(item.title);
    if(title === q) return 100;
    if(title.includes(q)) return 90;
    const kws = (item.keywords || []).map(kbNormalize).filter(Boolean);
    if(kws.includes(q)) return 80;
    if(kws.some(k => k.includes(q) || q.includes(k))) return 60;
    const parts = [];
    if(item.category === 'response'){
      parts.push(...(item.scriptLines||[]), ...(item.steps||[]), item.afterCall||'', item.extraNote||'');
    } else {
      parts.push(item.content||'');
    }
    // originalText 필드가 존재하는 항목이 있다면(현재 시드 데이터에는 없을 수 있음) 방어적으로 포함한다.
    if(item.originalText) parts.push(item.originalText);
    const text = kbNormalize(parts.join(' '));
    if(text.includes(q)) return 40;
    return 0;
  }
  function kbScoreContact(c, q){
    if(!q) return 0;
    const name = kbNormalize(c.name);
    if(name && name === q) return 100;
    if(name && name.includes(q)) return 90;
    const kws = (c.keywords || []).map(kbNormalize).filter(Boolean);
    if(kws.includes(q)) return 80;
    if(kws.some(k => k.includes(q) || q.includes(k))) return 60;
    const text = kbNormalize([c.dept,c.role,c.area,c.memo,c.originalText||''].join(' '));
    if(text.includes(q)) return 40;
    // 전화번호도 검색어로 매치는 가능하되(연관정보 수준의 낮은 우선순위), 결과 카드 표시는 기존 방식 그대로.
    if(c.phone && kbNormalize(c.phone).includes(q)) return 30;
    return 0;
  }
  // 계정함 항목: 사이트명/아이디까지만 검색 대상. 비밀번호/URL/메모는 절대 채점 대상에 포함하지 않는다
  // (rec.cipher/rec.iv를 이 함수는 아예 참조하지 않으므로 복호화 자체가 일어나지 않는다).
  function kbScoreAccount(acc, q){
    if(!q) return 0;
    const site = kbNormalize(acc.site);
    if(site && site === q) return 100;
    if(site && site.includes(q)) return 90;
    const user = kbNormalize(acc.username);
    if(user && (user === q || user.includes(q))) return 20;
    return 0;
  }

  // ---------- 통합검색 인덱스 빌더 (확장 포인트) ----------
  // 새 데이터 소스(예: 향후 업체관리)를 검색에 포함시키려면 이 배열에 { type, getRecords, score, render }
  // 항목 하나만 추가하면 된다. 각 소스는 자신의 원본 데이터를 참조만 하며 복사/캐시하지 않는다.
  const SHIN2_SEARCH_SOURCES = [
    { type:'item', getRecords: ()=> kbState.items, score: kbScoreItem, render: kbRenderItemCard },
    { type:'contact', getRecords: ()=> kbState.contacts, score: kbScoreContact, render: kbRenderContactCard },
    {
      type:'account',
      getRecords: ()=> (window.SHIN2_ACCOUNTS && window.SHIN2_ACCOUNTS.getSearchable) ? window.SHIN2_ACCOUNTS.getSearchable() : [],
      score: kbScoreAccount,
      render: kbRenderAccountCard
    },
    // 업체 대기 저장소(shin2-companies-staging, §6) — 업체관리 화면은 아직 없지만 검색에는 연결한다.
    { type:'company', getRecords: getCompanyStaging, score: kbScoreCompany, render: kbRenderCompanyCard }
  ];

  function kbSearchAll(query){
    const q = kbNormalize(query);
    if(!q) return [];
    const results = [];
    SHIN2_SEARCH_SOURCES.forEach(src=>{
      src.getRecords().forEach(record=>{
        const s = src.score(record, q);
        if(s > 0) results.push({ type: src.type, record, score: s });
      });
    });
    results.sort((a,b)=> b.score - a.score);
    return results;
  }

  function kbContactDisplayName(c){
    if(!c) return '(삭제된 연락처)';
    if(c.name) return c.name + (c.role ? ' ' + c.role : '');
    return c.dept || c.area || '담당자 미지정';
  }

  function kbCopy(text, btn){
    if(!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.nextElementSibling && btn.nextElementSibling.classList.contains('kb-copied-tag') ? btn.nextElementSibling : null;
      if(old) old.remove();
      const span = document.createElement('span');
      span.className = 'kb-copied-tag';
      span.textContent = '복사됨';
      btn.insertAdjacentElement('afterend', span);
      setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
    }).catch(()=>{});
  }

  // ---------- 홈 검색창: 라이브 검색 결과 ----------
  const mainSearchInput = document.getElementById('mainSearchInput');
  const mainSearchHint = document.getElementById('mainSearchHint');
  const mainSearchResults = document.getElementById('mainSearchResults');

  // 검색어와 일치하는 부분을 기존 .kb-hl 스타일로 감싼다(새 스타일을 만들지 않고 그대로 재사용).
  function kbHighlight(text, q){
    const raw = String(text == null ? '' : text);
    const nq = kbNormalize(q);
    if(!nq) return kbEscapeHtml(raw);
    const lower = raw.toLowerCase();
    let idx = lower.indexOf(nq);
    if(idx === -1) return kbEscapeHtml(raw);
    let out = '';
    let cursor = 0;
    while(idx !== -1){
      out += kbEscapeHtml(raw.slice(cursor, idx));
      out += '<mark class="kb-hl">' + kbEscapeHtml(raw.slice(idx, idx + nq.length)) + '</mark>';
      cursor = idx + nq.length;
      idx = lower.indexOf(nq, cursor);
    }
    out += kbEscapeHtml(raw.slice(cursor));
    return out;
  }
  // 원문/본문에서 검색어 근처를 발췌한다(있는 경우). 일치 지점이 없으면 앞부분만 잘라 보여준다.
  function kbSnippet(text, q, radius){
    const raw = String(text == null ? '' : text);
    if(!raw) return '';
    radius = radius || 50;
    const nq = kbNormalize(q);
    const lower = raw.toLowerCase();
    const idx = nq ? lower.indexOf(nq) : -1;
    if(idx === -1){
      return raw.length > radius * 2 ? raw.slice(0, radius * 2) + '…' : raw;
    }
    const start = Math.max(0, idx - radius);
    const end = Math.min(raw.length, idx + nq.length + radius);
    let snippet = raw.slice(start, end);
    if(start > 0) snippet = '…' + snippet;
    if(end < raw.length) snippet = snippet + '…';
    return snippet;
  }

  function kbRenderScriptLine(line){
    return `<div class="kb-script-line"><mark class="kb-hl">"${kbEscapeHtml(line)}"</mark></div>`;
  }
  function kbRenderContactLink(link){
    const c = kbState.contacts.find(x=> x.id === link.contactId);
    const name = kbContactDisplayName(c);
    const phone = c && c.phone ? c.phone : '';
    const roleLabel = link.role ? kbEscapeHtml(link.role) + ' · ' : '';
    return `<div class="kb-contact-line">
      <span>${roleLabel}<span class="kb-contact-name">${kbEscapeHtml(name)}</span>${phone ? ' / ' + kbEscapeHtml(phone) : ''}</span>
      ${phone ? `<button type="button" class="kb-copy-btn" data-copy-text="${kbEscapeAttr(phone)}">복사</button>` : ''}
    </div>`;
  }
  function kbRenderItemCard(item, isTop, q){
    const catLabel = CAT_LABEL[item.category] || item.category;
    let body;
    if(item.category === 'response'){
      const scriptHtml = (item.scriptLines||[]).map(kbRenderScriptLine).join('');
      const stepsHtml = (item.steps||[]).length ? `<div class="kb-steps-label">확인 순서</div><div class="kb-steps-text">${kbEscapeHtml((item.steps||[]).join(' → '))}</div>` : '';
      const linksHtml = (item.contactLinks||[]).length ? `<div class="kb-contact-label">담당</div>${(item.contactLinks||[]).map(kbRenderContactLink).join('')}` : '';
      const afterHtml = item.afterCall ? `<div class="kb-aftercall-label">통화 후</div><div class="kb-aftercall-text">${item.afterCall.split('\n').filter(line=>line.trim()).map(line=>`<div class="kb-aftercall-line"><span class="kb-aftercall-check">✓</span>${kbEscapeHtml(line.trim())}</div>`).join('')}</div>` : '';
      const extraHtml = item.extraNote ? `<div class="kb-extra-label">추가 참고</div><div class="kb-extra-text">${kbEscapeHtml(item.extraNote)}</div>` : '';
      body = scriptHtml + stepsHtml + linksHtml + afterHtml + extraHtml;
    } else {
      body = `<div class="kb-plain-content">${kbHighlight(item.content||'', q)}</div>`;
    }
    // originalText 필드는 있을 때만 발췌+강조해서 보여준다(향후 데이터 이전/빠른메모 기능 대비).
    const originalHtml = item.originalText
      ? `<div class="kb-extra-label">원문</div><div class="kb-plain-content">${kbHighlight(kbSnippet(item.originalText, q), q)}</div>`
      : '';
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">${catLabel}</div>
      <div class="kb-result-title">${kbHighlight(item.title, q)}</div>
      ${body}
      ${originalHtml}
    </div>`;
  }
  function kbRenderContactCard(c, isTop, q){
    const name = kbContactDisplayName(c);
    const areaLine = c.area ? `<div class="kb-contact-result-line">${kbHighlight(c.area, q)}</div>` : '';
    const phoneLine = c.phone
      ? `<div class="kb-contact-line"><span class="kb-contact-name">${kbEscapeHtml(name)}</span> / ${kbEscapeHtml(c.phone)} <button type="button" class="kb-copy-btn" data-copy-text="${kbEscapeAttr(c.phone)}">복사</button></div>`
      : '';
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">연락처</div>
      <div class="kb-result-title">${kbHighlight(name, q)}</div>
      ${areaLine}
      ${phoneLine}
    </div>`;
  }
  // 계정함 결과: 사이트명/아이디까지만 표시한다. rec.cipher/rec.iv(비밀번호)는 이 함수에 애초에
  // 전달되지 않으므로(window.SHIN2_ACCOUNTS.getSearchable가 site/username만 노출) 비밀번호 텍스트가
  // 결과 DOM 어디에도 나타날 수 없다.
  function kbRenderAccountCard(acc, isTop, q){
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">계정</div>
      <div class="kb-result-title">${kbHighlight(acc.site, q)}</div>
      <div class="kb-plain-content">아이디: ${acc.username ? kbHighlight(acc.username, q) : '-'}</div>
    </div>`;
  }
  // ---------- 업체 대기 저장소(shin2-companies-staging) 검색 연동 ----------
  // 한솔2에는 아직 업체관리 화면이 없으므로 이 저장소는 화면을 만들지 않고 검색에만 연결한다(§6/§24).
  // 원본 데이터를 읽기만 하고 이 파일은 절대 그 값을 고치지 않는다.
  const COMPANIES_STAGING_KEY = 'shin2-companies-staging';
  function getCompanyStaging(){
    try{
      const raw = localStorage.getItem(COMPANIES_STAGING_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function kbScoreCompany(co, q){
    if(!q) return 0;
    const name = kbNormalize(co.name);
    if(name && name === q) return 100;
    if(name && name.includes(q)) return 90;
    const rep = kbNormalize(co.repName);
    if(rep && rep.includes(q)) return 70;
    const contact = kbNormalize(co.contactName);
    if(contact && contact.includes(q)) return 65;
    if(co.phone && kbNormalize(co.phone).includes(q)) return 60;
    const text = kbNormalize([co.address, co.memo, co.bizRegNo, co.email].filter(Boolean).join(' '));
    if(text.includes(q)) return 40;
    return 0;
  }
  function kbRenderCompanyCard(co, isTop, q){
    const lines = [];
    if(co.repName) lines.push(`대표: ${kbEscapeHtml(co.repName)}`);
    if(co.contactName) lines.push(`담당: ${kbEscapeHtml(co.contactName)}`);
    if(co.phone) lines.push(`전화: ${kbEscapeHtml(co.phone)}`);
    if(co.address) lines.push(`주소: ${kbEscapeHtml(co.address)}`);
    if(co.memo) lines.push(`메모: ${kbHighlight(co.memo, q)}`);
    return `<div class="kb-result-card${isTop?' top':''}">
      <div class="kb-result-cat">업체</div>
      <div class="kb-result-title">${kbHighlight(co.name, q)}</div>
      <div class="kb-plain-content">${lines.join('<br>')}</div>
    </div>`;
  }

  function kbRenderResultEntry(entry, isTop, q){
    const src = SHIN2_SEARCH_SOURCES.find(s=> s.type === entry.type);
    return src ? src.render(entry.record, isTop, q) : '';
  }

  function renderMainResults(query){
    const q = (query || '').trim();
    if(!q){
      mainSearchResults.innerHTML = '';
      mainSearchHint.style.display = 'block';
      return;
    }
    mainSearchHint.style.display = 'none';
    const results = kbSearchAll(q);
    if(results.length === 0){
      mainSearchResults.innerHTML = `<div class="kb-no-result">검색 결과가 없습니다.</div>`;
      return;
    }
    let hintHtml = '';
    if(!localStorage.getItem(KB_HINT_SEEN_KEY)){
      hintHtml = `<div class="kb-hint-once">노란 표시 = 통화 중 읽을 문장</div>`;
      localStorage.setItem(KB_HINT_SEEN_KEY, '1');
    }
    const top = results[0];
    const rest = results.slice(1);
    let html = hintHtml + `<div class="kb-result-group-label">가장 관련 있는 결과</div>` + kbRenderResultEntry(top, true, q);
    if(rest.length){
      html += `<div class="kb-result-group-label">관련 결과</div>` + rest.map(e=> kbRenderResultEntry(e, false, q)).join('');
    }
    mainSearchResults.innerHTML = html;
  }

  let kbSearchDebounce = null;
  mainSearchInput.addEventListener('input', ()=>{
    clearTimeout(kbSearchDebounce);
    const val = mainSearchInput.value;
    kbSearchDebounce = setTimeout(()=> renderMainResults(val), 150);
  });
  mainSearchResults.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-copy-text]');
    if(!btn) return;
    kbCopy(btn.getAttribute('data-copy-text'), btn);
  });

  // ---------- 지식 관리 페이지 ----------
  const kbTabs = document.getElementById('kbTabs');
  const kbSearchInput = document.getElementById('kbSearchInput');
  const kbAddBtn = document.getElementById('kbAddBtn');
  const kbListEl = document.getElementById('kbList');

  function kbFilteredList(){
    const q = kbNormalize(kbState.search);
    let entries = [];
    kbState.items.forEach(it=> entries.push({ type:'item', record:it }));
    kbState.contacts.forEach(c=> entries.push({ type:'contact', record:c }));
    if(kbState.filter !== 'all'){
      entries = entries.filter(e=> (e.type === 'contact' ? 'contact' : e.record.category) === kbState.filter);
    }
    if(q){
      entries = entries.filter(e=> e.type === 'item' ? kbScoreItem(e.record, q) > 0 : kbScoreContact(e.record, q) > 0);
    }
    return entries;
  }

  function renderKbList(){
    const entries = kbFilteredList();
    if(entries.length === 0){
      kbListEl.innerHTML = `<div class="kb-no-result">등록된 지식이 없습니다. + 추가로 등록하세요.</div>`;
      return;
    }
    kbListEl.innerHTML = entries.map(e=>{
      if(e.type === 'item'){
        const cat = CAT_LABEL[e.record.category] || e.record.category;
        const sub = e.record.category === 'response' ? (e.record.steps||[]).join(' → ') : (e.record.content||'');
        return `<div class="kb-row" data-type="item" data-id="${kbEscapeAttr(e.record.id)}">
          <div class="kb-row-cat">${cat}</div>
          <div class="kb-row-title">${kbEscapeHtml(e.record.title)}</div>
          <div class="kb-row-sub">${kbEscapeHtml(sub)}</div>
        </div>`;
      }
      const c = e.record;
      const display = kbContactDisplayName(c);
      return `<div class="kb-row" data-type="contact" data-id="${kbEscapeAttr(c.id)}">
        <div class="kb-row-cat">연락처</div>
        <div class="kb-row-title">${kbEscapeHtml(display)}</div>
        <div class="kb-row-sub">${kbEscapeHtml(c.phone || '')}</div>
      </div>`;
    }).join('');
    kbListEl.querySelectorAll('.kb-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const id = row.getAttribute('data-id');
        const type = row.getAttribute('data-type');
        if(type === 'item') openItemForm(kbState.items.find(x=> x.id === id));
        else openContactForm(kbState.contacts.find(x=> x.id === id));
      });
    });
  }

  kbTabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('.kb-tab');
    if(!btn) return;
    kbState.filter = btn.getAttribute('data-filter');
    kbTabs.querySelectorAll('.kb-tab').forEach(b=> b.classList.toggle('active', b === btn));
    renderKbList();
  });
  kbSearchInput.addEventListener('input', ()=>{
    kbState.search = kbSearchInput.value;
    renderKbList();
  });
  kbAddBtn.addEventListener('click', ()=>{
    if(kbState.filter === 'contact') openContactForm(null);
    else openItemForm(null, kbState.filter);
  });

  // ---------- 지식(응대/업무/공법) 추가·수정 폼 ----------
  function kbRenderLinesEditor(containerEl, values, placeholder){
    containerEl.innerHTML = '';
    const list = (values && values.length) ? values : [''];
    list.forEach(v=> kbAddLineRow(containerEl, v, placeholder));
  }
  function kbAddLineRow(containerEl, value, placeholder){
    const row = document.createElement('div');
    row.className = 'kb-line-row';
    row.innerHTML = `<input type="text" value="${kbEscapeAttr(value||'')}" placeholder="${kbEscapeAttr(placeholder||'')}" /><button type="button" class="kb-line-remove">&times;</button>`;
    row.querySelector('.kb-line-remove').addEventListener('click', ()=> row.remove());
    containerEl.appendChild(row);
  }
  function kbGetLinesValues(containerEl){
    return Array.from(containerEl.querySelectorAll('input')).map(i=> i.value.trim()).filter(Boolean);
  }

  function openItemForm(record, defaultCategory){
    const isNew = !record;
    const category = record ? record.category : ((defaultCategory && defaultCategory !== 'contact' && defaultCategory !== 'all') ? defaultCategory : 'task');
    let formLinks = record && record.contactLinks ? record.contactLinks.map(l=> Object.assign({}, l)) : [];

    const overlay = document.createElement('div');
    overlay.className = 'kb-modal-overlay';
    overlay.innerHTML = `
      <div class="kb-modal">
        <div class="kb-modal-title">${isNew ? '지식 추가' : '지식 수정'}</div>
        ${(!isNew && record && record.originalText) ? `
        <button type="button" class="kb-text-action" id="kbViewOriginalBtn">원문 보기</button>
        <div id="kbOriginalBox" class="kb-form-field" style="display:none;">
          <div class="kb-extra-label">원문</div>
          <div class="kb-plain-content">${kbEscapeHtml(record.originalText)}</div>
        </div>` : ''}
        <div class="kb-form-field">
          <label>제목</label>
          <input type="text" id="kbFTitle" value="${isNew ? '' : kbEscapeAttr(record.title)}" />
        </div>
        <div id="kbFTitleErr" class="kb-form-error" style="display:none;">제목을 입력하세요.</div>
        <div class="kb-form-field">
          <label>분류</label>
          <select id="kbFCategory">
            <option value="response">응대</option>
            <option value="task">업무</option>
            <option value="method">공법</option>
            <option value="unclassified">미분류</option>
          </select>
        </div>
        <div class="kb-form-field">
          <label>검색 키워드 (쉼표로 구분)</label>
          <input type="text" id="kbFKeywords" value="${isNew ? '' : kbEscapeAttr((record.keywords||[]).join(', '))}" placeholder="예: 견적, 견적문의, 견적요청" />
        </div>

        <div id="kbResponseFields">
          <div class="kb-form-field">
            <label>전화 멘트 (실제로 읽는 문장, 줄마다 하나)</label>
            <div class="kb-lines-wrap" id="kbScriptLines"></div>
            <button type="button" class="kb-line-add" id="kbScriptAdd">+ 문장 추가</button>
          </div>
          <div class="kb-form-field">
            <label>확인 순서 (단계마다 하나)</label>
            <div class="kb-lines-wrap" id="kbStepLines"></div>
            <button type="button" class="kb-line-add" id="kbStepAdd">+ 단계 추가</button>
          </div>
          <div class="kb-form-field">
            <label>통화 후 처리</label>
            <textarea id="kbFAfterCall">${isNew ? '' : kbEscapeHtml(record.afterCall||'')}</textarea>
          </div>
          <div class="kb-form-field">
            <label>추가 참고 (선택)</label>
            <textarea id="kbFExtra">${isNew ? '' : kbEscapeHtml(record.extraNote||'')}</textarea>
          </div>
        </div>

        <div id="kbContentField" class="kb-form-field">
          <label>내용</label>
          <textarea id="kbFContent">${isNew ? '' : kbEscapeHtml(record.content||'')}</textarea>
        </div>

        <div id="kbLinksSection" class="kb-form-field">
          <label>관련 담당자</label>
          <div class="kb-contact-chips" id="kbChips"></div>
          <div class="kb-contact-picker" id="kbPickerWrap" style="display:none;">
            <input type="text" class="kb-role-input" id="kbRoleInput" placeholder="역할/조건 라벨 (예: 시공사 문의)" />
            <input type="text" id="kbContactSearch" placeholder="연락처 이름/부서/업무영역 검색 (기존 연락처만 선택 가능)" />
            <div class="kb-contact-picker-dropdown" id="kbPickerDropdown" style="display:none;"></div>
          </div>
          <button type="button" class="kb-add-link-btn" id="kbAddLinkBtn">+ 담당자 연결</button>
        </div>

        <div class="kb-form-actions">
          <div id="kbActionsLeft">${!isNew ? '<button type="button" class="kb-text-action danger" id="kbDeleteBtn">삭제</button>' : ''}</div>
          <div class="kb-form-actions-right">
            <button type="button" class="kb-text-action" id="kbFormCancel">취소</button>
            <button type="button" class="ai-run-btn" id="kbFormSave">저장</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const viewOrigBtn = overlay.querySelector('#kbViewOriginalBtn');
    if(viewOrigBtn){
      viewOrigBtn.addEventListener('click', ()=>{
        const box = overlay.querySelector('#kbOriginalBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
      });
    }

    const catSelect = overlay.querySelector('#kbFCategory');
    catSelect.value = category;
    const responseFieldsEl = overlay.querySelector('#kbResponseFields');
    const contentFieldEl = overlay.querySelector('#kbContentField');
    const linksSectionEl = overlay.querySelector('#kbLinksSection');
    function applyCategoryVisibility(){
      const cat = catSelect.value;
      responseFieldsEl.style.display = cat === 'response' ? 'block' : 'none';
      contentFieldEl.style.display = cat === 'response' ? 'none' : 'block';
      linksSectionEl.style.display = (cat === 'response' || cat === 'task') ? 'block' : 'none';
    }
    catSelect.addEventListener('change', applyCategoryVisibility);
    applyCategoryVisibility();

    const scriptWrap = overlay.querySelector('#kbScriptLines');
    const stepWrap = overlay.querySelector('#kbStepLines');

  // 한솔1 이전(migration) 전용 API: sourceSystem/sourceId 기준으로 이미 있는 항목은 건너뛴다(중복 생성 금지).
  // originalText 등 넘어온 원문 필드는 그대로 저장할 뿐 이 함수가 가공/수정하지 않는다.
  function kbHasSource(list, sourceSystem, sourceId){
    // sourceSystem이 없는(네이티브) 항목끼리는 절대 "같은 출처"로 취급하지 않는다 — 둘 다 undefined이면
    // 서로 다른 네이티브 레코드인데도 중복으로 오판해 건너뛰는 버그를 막기 위한 가드.
    if(!sourceSystem) return false;
    return list.some(x => x.sourceSystem === sourceSystem && x.sourceId === sourceId);
  }
  function kbAddItems(newItems){
    let added = 0, skipped = 0;
    (newItems||[]).forEach(it=>{
      if(kbHasSource(kbState.items, it.sourceSystem, it.sourceId)){ skipped++; return; }
      kbState.items.push(it); added++;
    });
    if(added) saveKb();
    return { added, skipped };
  }
  function kbAddContacts(newContacts){
    let added = 0, skipped = 0;
    (newContacts||[]).forEach(c=>{
      if(kbHasSource(kbState.contacts, c.sourceSystem, c.sourceId)){ skipped++; return; }
      kbState.contacts.push(c); added++;
    });
    if(added) saveKb();
    return { added, skipped };
  }
  // ================================================================================================
  // 빠른 지식 추가 (붙여넣기 → AI 자동분류 → 미리보기 → 저장)

  //  - importBatch.originalText = 붙여넣은 전체 원문 그대로(수정 없음).
  //  - 분리된 각 항목의 originalText/sourceExcerpt = 그 항목이 유래한 원문 발췌(AI가 준 값을 그대로 저장,
  //    이 파일이 문장을 다시 쓰거나 요약해서 대체하지 않는다).
  //  - AI 분석이 실패(네트워크/HTTP/JSON 파싱 오류 전부 포함)해도 원문을 잃지 않도록 미분류 1건으로
  //    즉시 폴백 저장 가능한 미리보기를 띄운다.
  const QA_CAT_LABEL = { response:'응대', task:'업무', method:'공법', contact:'연락처', unclassified:'미분류' };

  function qaBuildPrompt(text){

검색하기 좋은 지식 항목들로 분류·구조화해줘.

절대 규칙:
1. 원문에 없는 사실(회사명, 사람 이름, 부서, 전화번호, 절차 등)을 절대 새로 지어내지 마.
