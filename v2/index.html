<!-- ─────────────────────────────────────────────────────────────────────
     사용자 1·2·3(§다중 사용자 라운드) — 로그인 보안이 아니라 "개인 데이터 네임스페이스"
     구분용. 반드시 SHIN2_SYNC_KEYS보다 먼저 로드되어야 한다(그쪽이 nsKey를 바로 씀).

     핵심 설계: 사용자 "1"은 기존 키를 접미어 없이 그대로 쓴다 — 그래서 지금까지 쌓인
     개인 데이터(shin2-todos/shin2-memos-v1/shin2-tasks-v1/shin2-calendar-events-v1)는
     복사/이관 없이 곧바로 "사용자1의 데이터"가 된다(데이터 손실 0건, migration 불필요).
     사용자 2/3만 접미어(__u2/__u3)가 붙은 새 키를 쓰므로 처음엔 빈 상태로 시작한다.
     기존 키를 읽거나 지우는 코드는 이 블록에 전혀 없다 — nsKey()는 순수 문자열 조합
     함수일 뿐이고, 실제 localStorage 접근은 각 모듈이 지금까지처럼 그대로 한다. -->
<script>
  window.SHIN2_USER = (function(){
    var ACTIVE_KEY = 'shin2-active-user-id';
    var USERS = ['1','2','3'];
    function get(){
      var v = null;
      try{ v = localStorage.getItem(ACTIVE_KEY); }catch(e){}
      return USERS.indexOf(v) !== -1 ? v : '1';
    }
    function set(id){
      if(USERS.indexOf(id) === -1) return;
      try{ localStorage.setItem(ACTIVE_KEY, id); }catch(e){}
    }
    // 개인 데이터 전용 키만 이 함수를 거친다 — 업체/CRM/자료실/지식 등 공용 데이터 키는
    // 절대 이 함수를 쓰지 않고 지금까지처럼 고정 문자열을 그대로 쓴다.
    function nsKey(baseKey){
      var uid = get();
      return uid === '1' ? baseKey : (baseKey + '__u' + uid);
    }
    return { users: USERS.slice(), get: get, set: set, nsKey: nsKey };
  })();
</script>

<!-- 한솔(root) index.html이 쓰는 것과 동일한 Firebase 프로젝트 설정을 그대로 재사용한다.
     (Firebase 웹 apiKey는 비밀키가 아니라 프로젝트 식별용 공개 값 — 실제 접근 제어는
     Firestore 보안 규칙이 담당) 이 파일이 없으면 자동으로 localStorage 전용 모드로 동작한다. -->
<script src="../firebaseConfig.js" onerror="console.warn('firebaseConfig.js 없음 — localStorage 전용 모드로 동작합니다')"></script>

<!-- ─────────────────────────────────────────────────────────────────────
     동기화 대상 키 + "안전 병합" 헬퍼 (Firebase 유무와 무관하게 항상 존재해야 함).
     [데이터 백업]/[백업 복원]은 Firebase 설정이 없어도(로컬 전용 모드) 동작해야 하므로,
     아래 firebaseConfig 유무를 확인하는 module script보다 먼저, 그리고 그 분기 바깥에
     정의한다. classic script는 파서가 만나는 즉시 동기적으로 실행되므로, 뒤에 나오는
     module script(비동기 로딩되는 firebase 모듈들)보다 먼저 window에 값이 채워진다.

     안전 규칙(감사 결과 반영, §2~4): 두 값(local/cloud 또는 백업파일/local)을 합칠 때
     - 한쪽이 비어있고 한쪽에 데이터가 있으면 데이터 있는 쪽을 그대로 채택(빈 값이 있는
       데이터를 절대 덮어쓰지 않음)
     - 둘 다 데이터가 있으면 id 기준으로 합집합을 만들고, 같은 id가 양쪽에 있을 때만
       updatedAt/createdAt이 더 최신인 쪽을 채택(그 항목 자체를 잃지는 않음).
       id가 다르면(=별개 데이터로 판단) 무조건 둘 다 보존한다 — 삭제보다 중복 우선(§4). -->
<script>
  // §다중 사용자 라운드: tasks/memos/todos/calendar는 "개인 데이터"라 SHIN2_USER.nsKey()로
  // 현재 사용자의 실제 저장 키를 그대로 넣는다 — 사용자 전환은 페이지를 새로고침해서
  // 반영하므로(아래 사용자 선택 UI), 이 객체가 만들어지는 시점의 활성 사용자 키가 곧 이
  // 탭에서 그 세션 동안 쓸 키다. companies 등 공용 데이터는 지금까지처럼 고정 키 그대로.
  var _ns = window.SHIN2_USER ? window.SHIN2_USER.nsKey : function(k){ return k; };
  window.SHIN2_SYNC_KEYS = {
    companies: 'shin2-companies-staging',
    tasks: _ns('shin2-tasks-v1'),
    memos: _ns('shin2-memos-v1'),
    todos: _ns('shin2-todos'),
    knowledge: 'shin2-knowledge-v1',
    favorites: 'shin2-quicklinks-v1',
    calls: 'shin2-call-entries-v1',
    // 자료실 메타데이터(신규, § Storage 연결 라운드) — 기존 키와 완전히 동일한 안전 패턴
    // (§2~4 CASE A/B/C, §15 빈 값 가드)만 그대로 따른다. [클라우드 동기화 시작] 버튼을
    // 눌렀을 때만 최초 동기화되고, 그 외에는 기존 실시간 push 경로(saveDocs → push)만 탄다.
    // 파일 바이트 자체(shin2-library-blobs-v1)는 여전히 이 목록에 없다 — 그건 로컬 전용
    // 폴백일 뿐이며 클라우드로 나가는 것은 오직 이 메타데이터 배열(storagePath 포함)이다.
    library: 'shin2-library-documents-v1',
    // CRM(고객업무관리카드, crm/index.html)에서 추가한 두 키 — 기존 키와 완전히 동일한 안전
    // 패턴(§2~4 CASE A/B/C, §15 빈 값 가드)을 그대로 따른다. 메커니즘 자체는 바뀌지 않았고
    // (여전히 [클라우드 동기화 시작] 버튼 클릭에서만 최초 동기화 실행), 동기화 대상 배열이
    // 두 개 늘었을 뿐이다.
    customerActivities: 'shin2-customer-activities-v1',
    customerDocuments: 'shin2-customer-documents-v1',
    // 일정관리(캘린더, 신규) — 위와 완전히 동일한 안전 패턴(§2~4 CASE A/B/C, §15 빈 값
    // 가드)만 그대로 따른다. [클라우드 동기화 시작] 버튼을 눌렀을 때만 최초 동기화되고,
    // 그 외에는 기존 실시간 push 경로(각 모듈의 saveAll → window.__shin2CloudSync.push)만
    // 탄다 — 새 동기화 메커니즘을 만들지 않았다.
    calendar: _ns('shin2-calendar-events-v1')
  };
  // crm/index.html은 별도 페이지지만 같은 origin이라 localStorage를 직접 공유한다(§4/§37) —
  // 다만 그쪽 탭에서 쓴 값은 이 탭의 인메모리 push 경로를 거치지 않으므로, 이 탭이 이미
  // 실시간 동기화 중일 때(window.__shin2CloudSync.ready)만 그 변경을 그대로 전달해준다.
  // 새 동기화 경로가 아니라 "이미 켜져 있는 기존 push 함수를 다른 탭의 변경에도 호출해주는
  // 전달자"일 뿐이며, 최초 동기화(CASE A/B/C) 판단이나 자동 실행을 전혀 새로 만들지 않는다.
  window.addEventListener('storage', function(e){
    if(!e.key || e.newValue == null) return;
    if(!window.__shin2CloudSync || !window.__shin2CloudSync.ready) return;
    var keys = window.SHIN2_SYNC_KEYS || {};
    var matchedKey = Object.keys(keys).find(function(k){ return keys[k] === e.key; });
    if(!matchedKey) return;
    try{
      var data = JSON.parse(e.newValue);
      window.__shin2CloudSync.push(matchedKey, data);
    }catch(err){ /* 파싱 실패 시 무시 — 로컬 데이터는 이미 각 탭에서 정상 저장된 상태 */ }
  });
  window.SHIN2_SYNC_MERGE = (function(){
    function tsOf(item){
      var t = item && (item.updatedAt || item.createdAt);
      if(!t) return 0;
      var n = Date.parse(t);
      return isNaN(n) ? 0 : n;
    }
    function mergeArrays(localArr, cloudArr){
      localArr = Array.isArray(localArr) ? localArr : [];
      cloudArr = Array.isArray(cloudArr) ? cloudArr : [];
      var map = {}, order = [];
      function addItem(item){
        if(item == null) return;
        if(item.id == null){
          // id가 없는 항목도 절대 버리지 않는다 — 합성 키로 그대로 보존.
          var syn = '__noid_' + order.length + '_' + Math.random().toString(36).slice(2,8);
          map[syn] = item; order.push(syn);
          return;
        }
        var key = String(item.id);
        if(!(key in map)){ map[key] = item; order.push(key); }
        else if(tsOf(item) > tsOf(map[key])){ map[key] = item; } // 같은 id면 최신 것만 채택(삭제 아님, 같은 항목의 더 새 버전)
      }
      localArr.forEach(addItem);
      cloudArr.forEach(addItem);
      return order.map(function(k){ return map[k]; });
    }
    function isEmptyVal(key, v){
      if(key === 'knowledge'){
        if(!v || typeof v !== 'object') return true;
        var items = Array.isArray(v.items) ? v.items : [];
        var contacts = Array.isArray(v.contacts) ? v.contacts : [];
        return items.length === 0 && contacts.length === 0;
      }
      return !Array.isArray(v) || v.length === 0;
    }
    function mergeValues(key, localV, cloudV){
      if(key === 'knowledge'){
        var lo = (localV && typeof localV === 'object') ? localV : {};
        var cl = (cloudV && typeof cloudV === 'object') ? cloudV : {};
        return {
          items: mergeArrays(lo.items, cl.items),
          contacts: mergeArrays(lo.contacts, cl.contacts)
        };
      }
      return mergeArrays(localV, cloudV);
    }
    return { isEmptyVal: isEmptyVal, mergeValues: mergeValues, mergeArrays: mergeArrays };
  })();
</script>

<!-- 한솔2 Firebase 동기화 브릿지 (§14 작업분, 이후 재검토로 인증 방식 변경).
     ─────────────────────────────────────────────────────────────────────
     [재검토 이력] 처음에는 signInAnonymously를 썼는데, 익명 인증은 정의상 기기/브라우저마다
     서로 다른 Firebase uid가 새로 생성되므로 "집 PC와 회사 PC가 같은 사용자가 된다"는
     목표에 맞지 않는다는 것을 재확인했다(브라우저 데이터를 지우거나 다른 기기에서 열면
     완전히 다른 uid가 됨 → 절대 동기화되지 않음). 그래서 Email/Password 인증으로 바꿨다.
     ─────────────────────────────────────────────────────────────────────
     새 로그인 UI를 따로 만들지 않기 위해, 이미 있는 사이트 잠금 화면의 비밀번호를 그대로
     재사용한다: 사용자가 사이트 잠금 화면에 비밀번호를 입력해 잠금을 풀면('shin2-app-unlocked'
     이벤트, detail.password로 그 순간의 비밀번호를 딱 한 번 전달 — 어디에도 저장하지 않음)
     그 비밀번호로 고정된 이메일(HANSOL2_FIXED_EMAIL) + 그 비밀번호로 Firebase
     Email/Password 로그인을 시도한다. 집/회사에서 동일한 사이트 잠금 비밀번호를 쓰면
     동일한 Firebase 계정(=동일 uid)으로 연결되어 실제로 데이터가 동기화된다.

     Firebase Console에서 Authentication → Sign-in method → 이메일/비밀번호 제공업체를
     켜야 실제로 로그인이 성공한다(콘솔 설정, 코드로는 불가능 — BLOCKED로 남김).
     연결에 실패해도(제공업체 미설정, 비밀번호 6자 미만 등) 기존 localStorage 동작에는
     전혀 영향이 없다 — 사이트 잠금 자체는 이 코드와 무관하게 이미 완료된 뒤이므로, 이 블록이
     실패해도 로컬 데이터는 손상되지 않는다(항상 로컬이 우선 진실).

     계정함(비밀번호 저장소)은 여전히 동기화하지 않는다 — 기기마다 다른 salt로 마스터
     비밀번호를 유도하는 현재 구조상, 그대로 동기화하면 다른 기기에서 복호화가 실패해
     계정함 자체를 열 수 없게 될 위험이 있어 안전을 위해 보류했다. -->
<script type="module">
  // 위쪽 classic script에서 이미 정의한 것을 그대로 재사용한다(단일 소스 — 값이 두 곳에서
  // 따로 정의되면 나중에 하나만 고쳐서 어긋날 위험이 있어 하나로 합쳤다).
  const SHIN2_SYNC_KEYS = window.SHIN2_SYNC_KEYS;
  // 실제 사람 메일함이 아니어도 된다(Firebase Email/Password는 존재 확인을 안 함) — 이
  // 프로젝트·앱 전용으로 고정된 하나의 이메일을 "한 명이 쓰는 개인 사이트"의 계정 식별자로
  // 쓴다. 집/회사 모두 같은 사이트 잠금 비밀번호를 입력하면 같은 계정으로 로그인된다.
  const HANSOL2_FIXED_EMAIL = 'hansol2-owner@pour-dashboard.firebaseapp.com';

  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.projectId || cfg.projectId === 'YOUR_PROJECT_ID'){
    console.info('[한솔2/Firebase] 설정이 없어 localStorage 전용 모드로 동작합니다.');
  } else if(cfg.apiKey && cfg.apiKey.includes(' ')){
    // 보안 점검: Firebase 웹 apiKey는 비밀키가 아닌 공개 식별자이지만(공식 안내), 그래도
    // 형식이 이상하면(예: 실수로 다른 비밀값이 붙어 들어온 경우) 조용히 넘어가지 않고 경고한다.
    console.error('[한솔2/Firebase] apiKey 형식이 비정상적입니다 — firebaseConfig.js 값을 확인해주세요.');
  } else {
    // 경쟁 상태(race condition) 방지: 아래 async 블록의 동적 import 3개가 끝나기 전에
    // 사용자가 이미 사이트 잠금을 풀 수도 있다(특히 브라우저 캐시가 없는 최초 로딩,
    // 또는 세션 저장소 자동 로그인 직후 곧바로 잠금해제 이벤트가 도착하는 경우). 리스너
    // 등록을 async 함수 "안"에 두면 그 순간 이벤트가 이미 지나가버려 최초 로그인 시도
    // 자체가 통째로 스킵될 수 있어, 리스너는 여기서 동기적으로 즉시 등록하고 비밀번호를
    // 큐에 버퍼링해뒀다가 Firebase 준비가 끝나는 즉시 처리한다.
    let pendingPassword = null;
    let trySignInWithPassword = null; // 준비되면 실제 로그인 함수로 교체된다
    window.addEventListener('shin2-app-unlocked', (e) => {
      const pw = e.detail && e.detail.password;
      if(!pw) return;
      if(trySignInWithPassword) trySignInWithPassword(pw);
      else pendingPassword = pw; // 아직 Firebase 모듈 로딩 중 — 로딩 완료 후 처리
    });

    (async () => {
      try{
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
        const {
          getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
        } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
        const {
          getFirestore, doc, setDoc, onSnapshot, getDoc,
          enableIndexedDbPersistence, serverTimestamp
        } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
        // Storage SDK — 자료실/CRM 서류함 파일 업로드용(신규). 기존 Auth/Firestore와 동일한
        // CDN 동적 import 패턴을 그대로 따른다(새 로딩 방식을 만들지 않음). getStorage(app)를
        // 버킷 이름 없이 호출하므로, firebaseConfig.js의 cfg.storageBucket 값(현재
        // "pour-dashboard.firebasestorage.app")을 SDK가 그대로 사용한다 — 이 파일에서 버킷
        // 이름을 직접 하드코딩하지 않는다(§ 실제 Console 값과 어긋날 위험 방지).
        const {
          getStorage, ref: storageRef, uploadBytesResumable, getDownloadURL
        } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js');

        const app = initializeApp(cfg, 'shin2');
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        try{ await enableIndexedDbPersistence(db); }catch(e){ /* 여러 탭이면 실패할 수 있음 — 무시해도 안전 */ }

        // ─────────────────────────────────────────────────────────────────
        // [감사 결과 반영 — 가장 중요한 변경] 이전 라운드 코드는 로그인(onAuthStateChanged)
        // 이벤트가 오는 즉시 getDoc으로 클라우드를 확인하고 필요하면 setDoc(업로드)까지
        // "자동으로" 실행했다. 이는 스펙 §12("페이지 로드/로그인 성공 시점에 자동으로
        // migration/sync 실행 금지, 반드시 명시적 버튼 클릭")를 위반하는 경로였다 — 그래서
        // 이번 라운드에서 최초 동기화(§2~3 CASE A/B/C 판단)는 아래 startInitialSync()
        // 함수 하나로만 실행되도록 완전히 분리했고, 이 함수는 오직 사용자가 화면의
        // [클라우드 동기화 시작] 버튼을 눌렀을 때(맨 아래 UI 배선 스크립트)만 호출된다.
        // onAuthStateChanged는 이제 "로그인됐다"는 사실만 기록할 뿐, 그 자체로는 어떤
        // Firestore 읽기/쓰기도 수행하지 않는다.
        const { isEmptyVal, mergeValues } = window.SHIN2_SYNC_MERGE;
        let liveSyncStarted = false;
        let currentUid = null;

        function noopPush(){ /* 아직 사용자가 동기화를 시작하지 않음 — 빈 값이든 아니든 아무것도 클라우드에 쓰지 않는다 */ }

        // ─────────────────────────────────────────────────────────────────
        // [신규] Firebase Storage 업로드/다운로드 공용 추상화. 공용 자료실(saveLibraryFile)과
        // CRM 고객서류함(crm/index.html의 saveDocumentFile)이 이 동일한 로직을 각자 페이지에서
        // 그대로 재사용한다 — 이 저장소는 독립 HTML 2개(<script> import 공유 불가)라서 SHIN2_CRM_OCR/
        // SHIN2_COMPANY_OCR와 동일한 관례(텍스트 그대로 복제)로 crm/index.html에도 이 블록과
        // 동일한 함수를 복제해 둔다 — 한쪽만 고치면 어긋나므로 다음에 고칠 때는 두 파일을 함께 수정.
        //
        // uploadToStorage(file, path, onProgress): uploadBytesResumable()로 진행률을 실시간
        // 전달하며 업로드한다. 성공하면 { storagePath: path }로 resolve, 실패하면 그대로 reject
        // (호출부가 "업로드 실패 + 재시도/로컬저장" UI를 그린다 — 여기서 조용히 로컬로 대체하지 않음).
        // 2MB 같은 크기 상한을 여기서 절대 걸지 않는다(Storage는 대용량 파일을 resumable upload로
        // 처리하기 위한 경로다 — 로컬 dataURL 폴백에만 있는 2MB 상한과는 완전히 다른 목적).
        function uploadToStorage(file, path, onProgress){
          return new Promise((resolve, reject) => {
            if(!currentUid){
              reject(Object.assign(new Error('NOT_AUTHENTICATED'), { code: 'NOT_AUTHENTICATED' }));
              return;
            }
            let task;
            try{ task = uploadBytesResumable(storageRef(storage, path), file); }
            catch(e){ reject(Object.assign(e, { code: e.code || 'UPLOAD_FAILED' })); return; }
            task.on('state_changed',
              (snap) => { if(onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred / snap.totalBytes * 100)); },
              (err) => { reject(Object.assign(err, { code: err.code || 'UPLOAD_FAILED' })); },
              () => { resolve({ storagePath: path }); }
            );
          });
        }
        // getStorageFileURL(path): 클라우드 파일 보기/다운로드용 다운로드 URL을 매번 새로 요청한다
        // (URL을 메타데이터에 캐싱하지 않음 — 항상 최신 보안규칙/토큰 기준으로 재발급).
        function getStorageFileURL(path){
          return getDownloadURL(storageRef(storage, path));
        }
        window.SHIN2_STORAGE = {
          uploadFile: uploadToStorage,
          getFileURL: getStorageFileURL,
          isSignedIn: () => !!currentUid,
          getUid: () => currentUid
        };

        // 최초 동기화가 끝난 뒤(=사용자가 버튼을 눌러 이미 CASE A/B/C 판단을 명시적으로
        // 완료한 뒤)에만 호출되는, 평상시 실시간 동기화. 이 시점부터는 "이미 안전하게
        // 병합된 상태"이므로 이후 추가/수정 내용을 실시간으로 주고받는 것은 migration이
        // 아니라 정상적인 지속 동기화 동작이다(§16: 삭제 동기화만 새로 강화하지 않음).
        function enableLiveSync(){
          if(liveSyncStarted) return;
          liveSyncStarted = true;
          const uid = currentUid;
          const pushTimers = {};
          // [버그 수정 — 삭제 항목 되살아남] localRev: 로컬에서 저장(삭제 포함)할 때마다
          // localStorage에 즉시(디바운스 전에) 기록해두는 단조증가 타임스탬프. onSnapshot이
          // 이 값보다 오래된(=아직 이 기기의 최신 로컬 변경을 반영하지 못한) 클라우드 스냅샷을
          // 받으면 그걸로 localStorage를 덮어쓰지 않는다 — 예전 코드는 스냅샷을 무조건
          // 덮어썼는데, 그게 "삭제 직후 새로고침하면 다시 나타남" 버그의 원인이었다
          // (삭제 후 500ms 디바운스가 아직 클라우드에 반영되기 전에 새로고침하면, 재연결
          // 시점의 첫 onSnapshot이 삭제 이전의 오래된 클라우드 값을 그대로 로컬에 다시 써버림).
          // §다중 사용자 라운드: 개인 데이터 키는 사용자별로 실제 storageKey가 다르므로,
          // rev 추적도 storageKey 기준으로 나눠야 사용자 전환 후에도 서로 섞이지 않는다.
          function localRevKey(key){ return 'shin2-sync-rev-' + (SHIN2_SYNC_KEYS[key] || key); }
          function pushToCloud(key, data){
            if(!SHIN2_SYNC_KEYS[key]) return;
            // §15 가드: 빈 배열/빈 객체는 애초에 클라우드에 쓰지 않는다(집 PC의 빈 상태가
            // 회사 데이터를 덮어쓰는 경쟁 상태 방지).
            if(isEmptyVal(key, data)) return;
            const rev = Date.now();
            try{ localStorage.setItem(localRevKey(key), String(rev)); }catch(e){}
            clearTimeout(pushTimers[key]);
            pushTimers[key] = setTimeout(async () => {
              try{ await setDoc(doc(db, 'users', uid, 'shin2', SHIN2_SYNC_KEYS[key] || key), { value: data, updatedAt: serverTimestamp(), localRev: rev }); }
              catch(e){ console.error(`[한솔2/Firebase] ${key} 저장 실패`, e); }
            }, 500);
          }
          window.__shin2CloudSync.push = pushToCloud;
          window.__shin2CloudSync.ready = true;

          Object.keys(SHIN2_SYNC_KEYS).forEach((key) => {
            const storageKey = SHIN2_SYNC_KEYS[key];
            const ref = doc(db, 'users', uid, 'shin2', SHIN2_SYNC_KEYS[key] || key);
            onSnapshot(ref, (snap) => {
              if(!snap.exists()) return; // 문서가 없으면 아무것도 하지 않는다 — 로컬 데이터 보존
              const payload = snap.data();
              if(payload.value == null) return; // 값이 비어있는 스냅샷으로 로컬을 지우지 않는다
              if(isEmptyVal(key, payload.value)) return; // 이중 가드: 빈 값 스냅샷은 절대 반영하지 않음
              // 이 기기가 이 스냅샷보다 더 최신 로컬 변경(삭제 포함)을 이미 갖고 있다면, 오래된
              // 클라우드 값으로 되돌리지 않는다 — 대신 현재 로컬 값을 다시 밀어넣어 클라우드가
              // 따라잡게 한다(삭제를 잃지 않음, 데이터 유실 없음).
              let localRev = 0;
              try{ localRev = parseInt(localStorage.getItem(localRevKey(key)) || '0', 10) || 0; }catch(e){}
              const snapRev = (typeof payload.localRev === 'number') ? payload.localRev : 0;
              if(localRev && localRev > snapRev){
                let currentLocal = null;
                try{ const raw = localStorage.getItem(storageKey); currentLocal = raw ? JSON.parse(raw) : null; }catch(e){}
                if(!isEmptyVal(key, currentLocal)) pushToCloud(key, currentLocal);
                return;
              }
              try{ localStorage.setItem(storageKey, JSON.stringify(payload.value)); }catch(e){}
              window.dispatchEvent(new CustomEvent('shin2-cloud-update', { detail: { key, data: payload.value } }));
            }, (err) => console.error(`[한솔2/Firebase] ${key} 구독 실패`, err));
          });

          console.info('[한솔2/Firebase] 실시간 동기화 연결됨 (uid: ' + uid.slice(0,6) + '…)');
        }

        // 최초 동기화 — [클라우드 동기화 시작] 버튼에서만 호출된다(자동 호출 없음).
        // §2~4의 CASE A/B/C를 키별로 정확히 수행하고, 실행 직전에 스냅샷 백업을 남긴다(§10).
        async function startInitialSync(onProgress){
          if(!currentUid) throw new Error('not-authenticated');
          const uid = currentUid;

          // §10: 이 스냅샷 저장은 오직 이 버튼 클릭 경로 안에서만 실행된다(페이지 로드 시
          // 자동 실행되지 않음 — 이 함수 자체가 명시적 버튼 클릭으로만 호출되기 때문).
          const snapshot = {};
          Object.keys(SHIN2_SYNC_KEYS).forEach((k) => {
            const sk = SHIN2_SYNC_KEYS[k];
            try{ const raw = localStorage.getItem(sk); snapshot[k] = raw ? JSON.parse(raw) : null; }catch(e){ snapshot[k] = null; }
          });
          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const snapKey = `shin2-pre-firebase-backup-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
          try{ localStorage.setItem(snapKey, JSON.stringify({ takenAt: now.toISOString(), data: snapshot })); }catch(e){}

          const results = [];
          for(const key of Object.keys(SHIN2_SYNC_KEYS)){
            const storageKey = SHIN2_SYNC_KEYS[key];
            const ref = doc(db, 'users', uid, 'shin2', SHIN2_SYNC_KEYS[key] || key);
            let local = null;
            try{ const raw = localStorage.getItem(storageKey); local = raw ? JSON.parse(raw) : null; }catch(e){}
            const localEmpty = isEmptyVal(key, local);

            const snap = await getDoc(ref);
            let cloud = null;
            if(snap.exists()){
              const payload = snap.data();
              cloud = (payload && payload.value != null) ? payload.value : null;
            }
            const cloudEmpty = isEmptyVal(key, cloud);

            if(cloudEmpty && !localEmpty){
              // CASE A: 클라우드 비어있음 + 로컬 있음 → 로컬을 그대로 두고 클라우드로 업로드만.
              await setDoc(ref, { value: local, updatedAt: serverTimestamp() });
              const verify = await getDoc(ref);
              if(!verify.exists()) console.error(`[한솔2/Firebase] ${key} 최초 업로드 검증 실패`);
              results.push({ key, case: 'A' });
            } else if(!cloudEmpty && localEmpty){
              // CASE B: 클라우드 있음 + 로컬 비어있음 → 클라우드 값을 로컬로 불러오기(로컬엔 지울 게 없음).
              try{ localStorage.setItem(storageKey, JSON.stringify(cloud)); }catch(e){}
              results.push({ key, case: 'B' });
            } else if(!cloudEmpty && !localEmpty){
              // CASE C: 둘 다 있음 → 즉시 덮어쓰기 금지, id/createdAt/updatedAt 비교해 안전 병합.
              const merged = mergeValues(key, local, cloud);
              if(!isEmptyVal(key, merged)){
                try{ localStorage.setItem(storageKey, JSON.stringify(merged)); }catch(e){}
                await setDoc(ref, { value: merged, updatedAt: serverTimestamp() });
              }
              results.push({ key, case: 'C' });
            } else {
              // 둘 다 비어있음 → 아무것도 하지 않는다(빈 값을 클라우드에 쓰지 않음 — §15).
              results.push({ key, case: 'skip-empty' });
            }
            if(typeof onProgress === 'function') onProgress(results[results.length-1]);
          }

          localStorage.setItem('shin2-cloud-sync-enabled', '1');
          enableLiveSync();
          return results;
        }

        onAuthStateChanged(auth, (user) => {
          if(!user) return;
          currentUid = user.uid;
          window.__shin2CloudSync = window.__shin2CloudSync || {};
          window.__shin2CloudSync.push = noopPush; // 동기화 시작 전까지는 어떤 push도 클라우드에 쓰지 않는다
          window.__shin2CloudSync.ready = false;
          // [AI 문구정리 서버 이전용] 이미 로그인된 이 Firebase Auth 사용자의 ID 토큰을
          // 다른 스크립트 블록(AI 문구정리)이 재사용할 수 있도록 최소 함수만 노출한다.
          // 여기서 auth/user 객체 자체를 통째로 노출하지 않고 getIdToken()만 노출한다.
          window.__shin2CloudSync.getIdToken = () => user.getIdToken();
          window.__shin2CloudSync.startInitialSync = startInitialSync;
          window.dispatchEvent(new CustomEvent('shin2-firebase-ready'));
          // 이 기기에서 예전에 이미 [클라우드 동기화 시작] 버튼을 눌러 최초 동기화를 마친 적이
          // 있다면(=이 localStorage 플래그가 있다면) 재접속 시마다 다시 버튼을 누르지 않아도
          // 되도록 실시간 동기화만 재개한다. 이 플래그는 오직 startInitialSync() 안에서만
          // 설정되므로(§12), 이 분기 자체가 "버튼을 한 번도 누른 적 없는 기기"에서는 절대
          // 실행되지 않는다 — 자동 최초 동기화가 아니다.
          if(localStorage.getItem('shin2-cloud-sync-enabled') === '1'){
            enableLiveSync();
          }
        });

        // 사이트 잠금 해제 시점에 그 비밀번호로 Firebase 로그인을 시도한다(비밀번호는 여기서만
        // 잠깐 쓰이고 변수에도 남기지 않는다 — 클로저 밖으로 절대 전달하지 않음).
        trySignInWithPassword = (pw) => {
          signInWithEmailAndPassword(auth, HANSOL2_FIXED_EMAIL, pw).catch((err) => {
            if(err && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')){
              // 이 계정으로 처음 로그인하는 경우 — 지금 비밀번호로 새로 만든다(집/회사 중 먼저
              // 연 쪽이 계정을 만들고, 다른 쪽은 같은 비밀번호로 로그인만 하면 됨).
              createUserWithEmailAndPassword(auth, HANSOL2_FIXED_EMAIL, pw).catch((createErr) => {
                if(createErr && createErr.code === 'auth/weak-password'){
                  console.warn('[한솔2/Firebase] 사이트 잠금 비밀번호가 6자 미만이라 Firebase 로그인 계정을 만들 수 없습니다 — 동기화를 쓰려면 잠금 비밀번호를 6자 이상으로 설정해주세요. localStorage 전용 모드로 계속 동작합니다.');
                } else {
                  console.warn('[한솔2/Firebase] 로그인 계정 생성 실패 — localStorage 전용 모드로 계속 동작합니다.', createErr);
                }
              });
            } else if(err && err.code === 'auth/operation-not-allowed'){
              console.warn('[한솔2/Firebase] 이메일/비밀번호 로그인 실패 — Firebase Console에서 Authentication의 "이메일/비밀번호" 제공업체가 켜져 있는지 확인해주세요. localStorage 전용 모드로 계속 동작합니다.', err);
            } else if(err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')){
              console.warn('[한솔2/Firebase] 이 PC의 사이트 잠금 비밀번호가 예전에 다른 곳에서 동기화 계정을 만들 때 쓴 비밀번호와 다릅니다. 두 PC에서 같은 사이트 잠금 비밀번호를 쓰면 자동으로 다시 연결됩니다. 그 전까지는 localStorage 전용 모드로 동작합니다.', err);
            } else {
              console.warn('[한솔2/Firebase] 로그인 실패 — localStorage 전용 모드로 계속 동작합니다.', err);
            }
          });
        };

        // Firebase 준비가 끝나기 전에 이미 잠금해제 이벤트가 지나가버린 경우(경쟁 상태) —
        // 큐에 버퍼링해둔 비밀번호가 있으면 지금 바로 처리한다.
        if(pendingPassword){
          const pw = pendingPassword;
          pendingPassword = null;
          trySignInWithPassword(pw);
        }
      } catch(err){
        console.error('[한솔2/Firebase] 초기화 실패 — localStorage 전용 모드로 동작합니다.', err);
      }
    })();
  }
</script>

        <script>
        // 통합 업무 입력 패널의 탭 전환 + "AI로 다듬기" 브리지 버튼(§신규).
        // 순수 표시 전환만 한다 — DOM을 지우거나 다시 그리지 않으므로 탭을 오가도
        // 각 탭의 입력값은 그대로 남는다. 시공사/아파트 저장 로직, AI 문구정리 서버 호출
        // 로직은 여기서 전혀 건드리지 않는다(§9).
        (function(){
          function initHomeTabs(){
            var panel = document.getElementById('homeTabsPanel');
            if(!panel) return;
            var tabBtns = panel.querySelectorAll('.home-tab-btn');
            var contents = panel.querySelectorAll('.home-tab-content');
            function activate(tab){
              tabBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-home-tab') === tab); });
              contents.forEach(function(c){ c.style.display = (c.getAttribute('data-home-tab-content') === tab) ? '' : 'none'; });
            }
            tabBtns.forEach(function(b){
              b.addEventListener('click', function(){ activate(b.getAttribute('data-home-tab')); });
            });

            // "AI로 다듬기": 원본 textarea의 텍스트를 AI 문구정리 textarea로 "복사"만 하고
            // (원본 textarea 값은 절대 지우지 않는다), AI 문구정리 탭으로 전환한다.
            // AI 요청은 여기서 자동으로 보내지 않는다 — 사용자가 [AI로 정리]를 직접 눌러야 한다.
            // 이벤트 위임을 써서 아파트 탭처럼 나중에(renderHomeBlock으로) 다시 그려지는
            // 버튼도 항상 동작한다.
            panel.addEventListener('click', function(e){
              var btn = e.target.closest ? e.target.closest('[data-bridge-from]') : null;
              if(!btn || !panel.contains(btn)) return;
              var srcEl = document.getElementById(btn.getAttribute('data-bridge-from'));
              var aiEl = document.getElementById('aiInput');
              if(!srcEl || !aiEl) return;
              aiEl.value = srcEl.value;
              activate('ai');
              aiEl.focus();
            });
          }
          if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', initHomeTabs);
          } else {
            initHomeTabs();
          }
        })();
        </script>

      <span id="todoRailCount">전체 0개 · 완료 0개</span>
      <button type="button" class="todo-rail-clear" id="todoRailClearDone" title="체크한 항목을 목록에서 치웁니다. 처리완료 이력은 기존 [내 할 일]에 그대로 남습니다.">완료 항목 치우기</button>
    </div>
  </aside>
  <button type="button" class="todo-rail-reopen" id="todoRailReopen" title="오늘의 투두 열기" aria-label="오늘의 투두 열기">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12.5 2.3 2.3L16 9.5"/></svg>
    <span class="lbl">오늘의 투두</span>
    <span class="cnt" id="todoRailReopenCnt">0</span>
  </button>
</div>

<script>
/* ==========================================================================
   SHIN2_MEMO — 공통 메모(시간순 기록) 컴포넌트
   여러 화면(홈/계정 상세/업무 상세/업체 상세 등)에서 재사용하는 독립 모듈.
   v2는 단일 state/render 구조가 아니라 화면별 IIFE로 구성되어 있으므로,
   이 모듈도 동일한 방식으로 만들었다 — 주어진 컨테이너 엘리먼트 하나에
   자기 자신을 그려 넣고, 자기 안의 이벤트만 스스로 처리한다.

   저장 데이터: localStorage 'shin2-memos-v1' = [{id, targetType, targetId,
   text, createdAt, updatedAt}]. 다른 화면의 메모와 절대 섞이지 않도록
   targetType+targetId로만 필터링해서 보여준다.
   ========================================================================== */
(function(){
  'use strict';
  // §다중 사용자 라운드: 포스트잇 메모는 개인 데이터 — 사용자1은 접미어 없는 기존 키
  // 그대로(데이터 그대로 보존), 사용자2/3만 새 접미어 키를 쓴다.
  var STORAGE_KEY = window.SHIN2_USER ? window.SHIN2_USER.nsKey('shin2-memos-v1') : 'shin2-memos-v1';

  function loadAll(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveAll(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
    if(window.__shin2CloudSync) window.__shin2CloudSync.push('memos', list);
  }
  function uid(){ return 'memo_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmtFull(ts){
    var d = new Date(ts);
    return d.getFullYear() + '.' + pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtTime(ts){
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtCompact(ts){
    var d = new Date(ts);
    return pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getFor(targetType, targetId){
    return loadAll()
      .filter(function(m){ return m.targetType === targetType && String(m.targetId) === String(targetId); })
      .sort(function(a,b){ return (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt); });
  }
  function countFor(targetType, targetId){ return getFor(targetType, targetId).length; }

  // §신규 라운드: 폼 UI 없이 프로그램적으로 메모 한 건을 "추가"하는 API(시공사 전화기록
  // 저장 시 업체 메모에 자동으로 한 줄 남기기 위함, 요구사항 7). mount()의 폼 제출 핸들러가
  // 새 항목을 만들 때 쓰는 것과 완전히 같은 모양({id, targetType, targetId, text, createdAt,
  // updatedAt})으로 push한 뒤 같은 saveAll()을 호출한다 — 기존 메모를 절대 지우거나
  // 덮어쓰지 않고 배열에 새 항목만 추가하는 순수 append이며, 별도의 메모 저장소를 새로
  // 만들지 않는다.
  function addFor(targetType, targetId, text){
    var t = String(text || '').trim();
    if(!t) return null;
    var now = Date.now();
    var rec = { id: uid(), targetType: targetType, targetId: String(targetId), text: t, createdAt: now, updatedAt: now };
    var all = loadAll();
    all.push(rec);
    saveAll(all);
    return rec;
  }

  /**
   * container: 메모 섹션을 그려 넣을 빈 엘리먼트
   * targetType/targetId: 이 메모가 연결된 대상
   * opts.title: 섹션 제목 (기본 '메모 기록')
   * opts.compactHome: 홈 요약 모드 — 최근 3개만 보여주고(§6), 각 행의 수정/삭제는
   *   기본적으로 숨긴 뒤 그 행을 클릭했을 때만 노출한다(§7-b). 날짜도 "MM.DD HH:MM"
   *   짧은 형식으로 표기한다. 다른 화면(업체/계정/업무 상세)의 기존 호출에는 opts를
   *   전달하지 않으므로 이 옵션 추가는 그쪽 동작에 전혀 영향을 주지 않는다.
   * opts.onViewAll: 지정하면 헤더에 "전체 보기 >" 버튼이 추가되고 클릭 시 호출된다
   *   (홈에서는 전체 메모 팝업을 여는 데 사용, §6).
   * opts.forceExpanded: true면 3개로 자르지 않고 처음부터 전체를 보여준다(전체 메모
   *   팝업에서 사용).
   */
  function mount(container, targetType, targetId, opts){
    if(!container) return null;
    opts = opts || {};
    var title = opts.title || '메모 기록';
    var mode = 'list'; // 'list' | 'add' | 'edit'
    var editId = null;
    var expanded = !!opts.forceExpanded;
    var activeActionsId = null; // compactHome 전용: 지금 수정/삭제가 펼쳐진 행

    function formHtml(text, id){
      return '' +
        '<form class="shin2-memo-form" data-m-form="save" data-id="' + (id||'') + '">' +
          '<textarea class="shin2-memo-input" placeholder="메모를 입력하세요" rows="2" required>' + escapeHtml(text||'') + '</textarea>' +
          '<div class="shin2-memo-form-actions">' +
            '<button type="button" class="shin2-memo-cancel-btn" data-m-action="cancel">취소</button>' +
            '<button type="submit" class="shin2-memo-save-btn">저장</button>' +
          '</div>' +
        '</form>';
    }

    function itemHtml(m){
      if(mode === 'edit' && editId === m.id) return formHtml(m.text, m.id);
      var wasEdited = m.updatedAt && m.updatedAt !== m.createdAt;
      // §7: compactHome에서는 지금 선택된(activeActionsId) 행에서만 수정/삭제를 보여준다 —
      // 평상시엔 날짜+내용만 깔끔하게 보이고, 행을 클릭하면 그 행에 한해 펼쳐진다.
      var showActions = !opts.compactHome || activeActionsId === m.id;
      var metaText = opts.compactHome ? fmtCompact(m.createdAt) : fmtFull(m.createdAt);
      return '' +
        '<div class="shin2-memo-item" data-id="' + m.id + '"' + (opts.compactHome ? ' style="cursor:pointer;"' : '') + '>' +
          '<div class="shin2-memo-meta">' + metaText + (wasEdited ? ' · 수정됨 ' + fmtTime(m.updatedAt) : '') + '</div>' +
          '<div class="shin2-memo-text">' + escapeHtml(m.text) + '</div>' +
          (showActions ?
            '<div class="shin2-memo-item-actions">' +
              '<button type="button" class="shin2-memo-mini-btn" data-m-action="edit" data-id="' + m.id + '">수정</button>' +
              '<button type="button" class="shin2-memo-mini-btn danger" data-m-action="delete" data-id="' + m.id + '">삭제</button>' +
            '</div>' : '') +
        '</div>';
    }

    function render(){
      var items = getFor(targetType, targetId);
      var visible = expanded ? items : items.slice(0, 3);
      var countLabel = items.length ? (' ' + items.length) : '';
      var titleCls = 'shin2-memo-title' + (opts.compactHome ? ' shin2-memo-title-lg' : '');
      var headRight = '';
      if(mode === 'list') headRight += '<button type="button" class="shin2-memo-add-btn" data-m-action="add">+ 추가</button>';
      if(opts.onViewAll) headRight += '<button type="button" class="home-task-more" data-m-action="view-all" style="margin-left:8px;">전체 보기 &gt;</button>';
      var html = '<div class="shin2-memo-block">' +
        '<div class="shin2-memo-head">' +
          '<div class="' + titleCls + '">' + escapeHtml(title) + countLabel + '</div>' +
          (headRight ? '<div style="display:flex;align-items:center;">' + headRight + '</div>' : '') +
        '</div>';
      if(mode === 'add') html += formHtml('');
      if(!items.length && mode !== 'add'){
        html += '<div class="shin2-memo-empty">등록된 메모가 없습니다</div>';
      } else if(items.length){
        html += '<div class="shin2-memo-list">' + visible.map(itemHtml).join('') + '</div>';
      }
      // compactHome은 헤더의 "전체 보기 >"가 이미 전체 목록으로 가는 길이므로, 목록 아래
      // 별도의 "전체보기(N)/접기" 버튼은 만들지 않는다(중복 UI 방지).
      if(!opts.compactHome && items.length > 3){
        html += '<button type="button" class="shin2-memo-more-btn" data-m-action="toggle-expand">' + (expanded ? '접기' : ('전체보기 (' + items.length + ')')) + '</button>';
      }
      html += '</div>';
      container.innerHTML = html;
      wire();
    }

    function focusInput(){
      var ta = container.querySelector('.shin2-memo-input');
      if(ta){ ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
    }

    function wire(){
      Array.prototype.forEach.call(container.querySelectorAll('[data-m-action]'), function(el){
        el.addEventListener('click', function(e){
          e.stopPropagation();
          var action = el.dataset.mAction;
          if(action === 'add'){ mode = 'add'; editId = null; render(); focusInput(); }
          else if(action === 'cancel'){ mode = 'list'; editId = null; render(); }
          else if(action === 'edit'){ mode = 'edit'; editId = el.dataset.id; render(); focusInput(); }
          else if(action === 'delete'){
            if(confirm('이 메모를 삭제하시겠습니까?')){
              saveAll(loadAll().filter(function(m){ return m.id !== el.dataset.id; }));
              render();
            }
          } else if(action === 'toggle-expand'){ expanded = !expanded; render(); }
          else if(action === 'view-all'){ if(opts.onViewAll) opts.onViewAll(); }
        });
      });
      // §7-b: compactHome에서 행 자체(수정/삭제 버튼 제외)를 클릭하면 그 행에 한해
      // 수정/삭제를 펼치거나 접는다. 다시 클릭하면 접힌다.
      if(opts.compactHome){
        Array.prototype.forEach.call(container.querySelectorAll('.shin2-memo-item'), function(el){
          el.addEventListener('click', function(e){
            if(e.target.closest('[data-m-action]')) return;
            var id = el.getAttribute('data-id');
            activeActionsId = (activeActionsId === id) ? null : id;
            render();
          });
        });
      }
      var form = container.querySelector('[data-m-form="save"]');
      if(form){
        form.addEventListener('submit', function(e){
          e.preventDefault();
          var text = form.querySelector('.shin2-memo-input').value.trim();
          if(!text) return;
          var now = Date.now();
          var all = loadAll();
          if(form.dataset.id){
            var rec = all.find(function(m){ return m.id === form.dataset.id; });
            if(rec){ rec.text = text; rec.updatedAt = now; }
          } else {
            all.push({ id: uid(), targetType: targetType, targetId: String(targetId), text: text, createdAt: now, updatedAt: now });
          }
          saveAll(all);
          mode = 'list'; editId = null;
          render();
        });
      }
    }

    render();
    return { refresh: render };
  }

  window.SHIN2_MEMO = { mount: mount, getFor: getFor, countFor: countFor, loadAll: loadAll, addFor: addFor };

  // §6/§7: 홈 화면 메모(targetType 'home')는 최근 3개만 요약으로 보여주고(compactHome),
  // 수정/삭제는 행을 클릭했을 때만 나타난다. "전체 보기"는 계정/업무 팝업과 같은
  // acct-popup 톤을 재사용한 새 memoPopup을 열어 전체 메모를 forceExpanded로 보여준다
  // — 기존에 전체 메모만 따로 보는 화면이 없었기 때문에 새로 추가했다.
  var memoPopupOverlay = document.getElementById('memoPopupOverlay');
  var memoPopupBody = document.getElementById('memoPopupBody');
  var memoPopupCloseBtn = document.getElementById('memoPopupCloseBtn');
  var homeMemoHandle = null;

  function openMemoPopup(){
    if(!memoPopupOverlay || !memoPopupBody) return;
    memoPopupOverlay.classList.add('open');
    mount(memoPopupBody, 'home', 'home', { title: '메모 전체', forceExpanded: true });
  }
  function closeMemoPopup(){
    if(!memoPopupOverlay) return;
    memoPopupOverlay.classList.remove('open');
    if(homeMemoHandle) homeMemoHandle.refresh();
  }
  if(memoPopupCloseBtn) memoPopupCloseBtn.addEventListener('click', closeMemoPopup);
  if(memoPopupOverlay) memoPopupOverlay.addEventListener('click', function(e){ if(e.target === memoPopupOverlay) closeMemoPopup(); });

  // 홈 화면 메모(targetType 'home')는 화면이 하나뿐이라 정적 컨테이너에 바로 마운트한다.
  var homeSlot = document.getElementById('homeMemoSlot');
  if(homeSlot) homeMemoHandle = mount(homeSlot, 'home', 'home', { title: '메모', compactHome: true, onViewAll: openMemoPopup });
})();
</script>

<script>
/* ==========================================================================
   SHIN2_TASKS — 홈 "오늘 확인할 업무" + 전체보기 팝업
   기존 v2의 "내 할 일"(shin2-todos, 단순 체크리스트)과는 다른 별도 데이터다 —
   그쪽은 개인 체크리스트, 이쪽은 상태/업체/일정이 붙는 "처리할 업무"다.
   두 시스템을 하나로 합치라는 요청은 없었고 데이터 모양도 근본적으로 달라
   (todos: {id,text}, tasks: {id,title,status,companyId,date,time,...})
   섞으면 오히려 기존 "내 할 일" 기능을 깨뜨리게 되어 분리된 새 저장소로 만들었다.
   저장: localStorage 'shin2-tasks-v1'.
   ========================================================================== */
(function(){
  'use strict';
  // §다중 사용자 라운드: '처리할 업무'는 개인 데이터.
  var STORAGE_KEY = window.SHIN2_USER ? window.SHIN2_USER.nsKey('shin2-tasks-v1') : 'shin2-tasks-v1';
  var COMPANY_STORAGE_KEY = 'shin2-companies-staging';

  var STATUS_META = {
    urgent:   { label:'긴급', cls:'task-badge-urgent' },
    progress: { label:'진행', cls:'task-badge-progress' },
    confirm:  { label:'확인', cls:'task-badge-confirm' },
    material: { label:'자료', cls:'task-badge-material' },
    reply:    { label:'회신', cls:'task-badge-reply' },
    normal:   { label:'일반', cls:'task-badge-normal' }
  };
  var STATUS_ORDER = ['urgent','progress','confirm','material','reply','normal'];

  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function uid(){ return 'task_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }
  function fmtDateTime(ts){
    var d = new Date(ts);
    return d.getFullYear() + '.' + pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function loadAll(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveAll(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
    if(window.__shin2CloudSync) window.__shin2CloudSync.push('tasks', list);
  }

  function getCompanies(){
    try{ var raw = localStorage.getItem(COMPANY_STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function findCompany(id){ return id ? getCompanies().find(function(c){ return c.id === id; }) : null; }

  function add(fields){
    var now = Date.now();
    var rec = {
      id: uid(),
      title: (fields.title || '').trim(),
      status: STATUS_META[fields.status] ? fields.status : 'normal',
      companyId: fields.companyId || '',
      content: (fields.content || '').trim(),
      date: fields.date || '',
      time: fields.time || '',
      done: false,
      createdAt: now,
      updatedAt: now
    };
    var all = loadAll();
    all.push(rec);
    saveAll(all);
    return rec;
  }
  function update(id, fields){
    var all = loadAll();
    var rec = all.find(function(t){ return t.id === id; });
    if(!rec) return null;
    if(fields.title !== undefined) rec.title = fields.title.trim();
    if(fields.status !== undefined) rec.status = STATUS_META[fields.status] ? fields.status : 'normal';
    if(fields.companyId !== undefined) rec.companyId = fields.companyId;
    if(fields.content !== undefined) rec.content = fields.content.trim();
    if(fields.date !== undefined) rec.date = fields.date;
    if(fields.time !== undefined) rec.time = fields.time;
    rec.updatedAt = Date.now();
    saveAll(all);
    return rec;
  }
  function setDone(id, done){
    var all = loadAll();
    var rec = all.find(function(t){ return t.id === id; });
    if(!rec) return null;
    rec.done = !!done;
    rec.updatedAt = Date.now();
    saveAll(all);
    return rec;
  }
  function remove(id){ saveAll(loadAll().filter(function(t){ return t.id !== id; })); }

  // 정렬 기준(요청 명세 §9 그대로): 1) 사용자 지정 순서가 있으면 최우선
  // 2) 긴급 상태 3) 오늘 마감(date===오늘) 4) 시간이 지정된 업무 5) 최근 등록 순
  function sortForHome(items){
    var today = todayStr();
    return items.slice().sort(function(a,b){
      if(typeof a.order === 'number' && typeof b.order === 'number' && a.order !== b.order) return a.order - b.order;
      var aUrgent = a.status === 'urgent', bUrgent = b.status === 'urgent';
      if(aUrgent !== bUrgent) return aUrgent ? -1 : 1;
      var aToday = a.date === today, bToday = b.date === today;
      if(aToday !== bToday) return aToday ? -1 : 1;
      var aTime = !!a.time, bTime = !!b.time;
      if(aTime !== bTime) return aTime ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  /* ---------- 홈 요약 (최대 5건, 상세관리 버튼 없음) ---------- */
  var homeSlotEl = null;
  // §5: 홈에는 "처리할 업무"가 있을 때만 섹션 자체를 그린다 — 0건이면 빈 상태 안내문도
  // 없이 섹션을 통째로 렌더링하지 않는다(기능/데이터는 그대로, 홈 노출만 조건부).
  // 있을 때는 최대 2~3건만 보여주고 헤더에 "처리할 업무 N건"으로 총 건수를 알려준다.
  function renderHomeSummary(){
    if(!homeSlotEl) return;
    // §신규 라운드(역할 분리): companyId가 붙은 항목은 이제 별도 "고객 업무" 홈 섹션
    // (homeCustomerTaskSlot, 아래 별도 IIFE)이 담당한다 — 같은 레코드를 두 섹션에 동시에
    // 그리면 사용자가 헷갈리므로, 여기 "처리할 업무" 섹션은 companyId가 없는(순수 개인)
    // 항목만 보여주도록 필터만 좁혔다. 데이터(shin2-tasks-v1)/필드/저장 로직은 전혀
    // 바뀌지 않았고, companyId가 있는 항목도 여전히 이 배열 안에 그대로 남아있다 —
    // "업무 상세" 팝업의 전체 보기(filteredForBrowse)에서는 지금까지처럼 전체가 보인다.
    var all = sortForHome(loadAll().filter(function(t){ return !t.done && !t.companyId; }));
    if(!all.length){ homeSlotEl.innerHTML = ''; return; }
    var items = all.slice(0, 3);
    var html = '<div class="home-task-block">' +
      '<div class="home-task-head">' +
        '<div class="home-task-title">처리할 업무 ' + all.length + '건</div>' +
        '<button type="button" class="home-task-more" data-t-action="view-all">전체 보기 &gt;</button>' +
      '</div>';
    {
      html += '<div class="home-task-list">' + items.map(function(t){
        var meta = STATUS_META[t.status] || STATUS_META.normal;
        return '<div class="home-task-row" data-t-action="open" data-id="' + t.id + '">' +
          '<div class="home-task-row-main">' +
            '<div class="home-task-row-top">' +
              (t.time ? '<span class="home-task-time">' + escapeHtml(t.time) + '</span>' : '') +
              '<span class="task-badge ' + meta.cls + '">' + meta.label + '</span>' +
              '<span class="home-task-row-title">' + escapeHtml(t.title) + '</span>' +
            '</div>' +
            (t.content ? '<div class="home-task-row-sub">' + escapeHtml(t.content) + '</div>' : '') +
          '</div>' +
          '<div class="home-task-chevron">&gt;</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';
    homeSlotEl.innerHTML = html;
    homeSlotEl.querySelectorAll('[data-t-action]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var action = el.dataset.tAction;
        if(action === 'view-all') openPopup('browse');
        else if(action === 'add') openPopup('add');
        else if(action === 'open') openPopup('detail', el.dataset.id);
      });
    });
  }

  /* ---------- 전체보기 / 상세 / 폼 팝업 ---------- */
  var popupOverlay = document.getElementById('taskPopupOverlay');
  var popupBody = document.getElementById('taskPopupBody');
  var popupTitle = document.getElementById('taskPopupTitle');
  var popupBackBtn = document.getElementById('taskPopupBackBtn');
  var popupCloseBtn = document.getElementById('taskPopupCloseBtn');

  var pState = { mode:'browse', tab:'all', search:'', selectedId:null, formValues:null };

  function openPopup(mode, id){
    pState.mode = mode || 'browse';
    pState.selectedId = id || null;
    if(pState.mode === 'add') pState.formValues = { title:'', status:'normal', companyId:'', content:'', date:'', time:'' };
    if(pState.mode === 'edit'){
      var rec = loadAll().find(function(t){ return t.id === pState.selectedId; });
      pState.formValues = rec ? Object.assign({}, rec) : { title:'', status:'normal', companyId:'', content:'', date:'', time:'' };
    }
    popupOverlay.classList.add('open');
    renderPopup();
  }
  function closePopup(){ popupOverlay.classList.remove('open'); renderHomeSummary(); }

  popupCloseBtn.addEventListener('click', closePopup);
  popupOverlay.addEventListener('click', function(e){ if(e.target === popupOverlay) closePopup(); });
  popupBackBtn.addEventListener('click', function(){
    if(pState.mode === 'detail' || pState.mode === 'add'){ pState.mode = 'browse'; renderPopup(); }
    else if(pState.mode === 'edit'){ pState.mode = 'detail'; renderPopup(); }
  });

  function renderPopup(){
    popupBackBtn.style.display = pState.mode === 'browse' ? 'none' : '';
    if(pState.mode === 'browse'){ popupTitle.textContent = '처리할 업무'; renderBrowse(); return; }
    if(pState.mode === 'detail'){ popupTitle.textContent = '업무 상세'; renderDetail(); return; }
    if(pState.mode === 'add'){ popupTitle.textContent = '업무 추가'; renderForm(true); return; }
    if(pState.mode === 'edit'){ popupTitle.textContent = '업무 수정'; renderForm(false); return; }
  }

  function filteredForBrowse(){
    var today = todayStr();
    var all = loadAll();
    var byTab = all.filter(function(t){
      if(pState.tab === 'today') return !t.done && t.date === today;
      if(pState.tab === 'upcoming') return !t.done && t.date && t.date > today;
      if(pState.tab === 'done') return !!t.done;
      return !t.done; // 'all' 탭은 미완료 전체(완료는 완료 탭에서만)
    });
    var q = pState.search.trim().toLowerCase();
    if(!q) return sortForHome(byTab);
    return sortForHome(byTab.filter(function(t){
      var company = findCompany(t.companyId);
      var hay = [t.title, t.content, company ? company.name : '']
        .concat((window.SHIN2_MEMO ? window.SHIN2_MEMO.getFor('task', t.id) : []).map(function(m){ return m.text; }))
        .join(' ').toLowerCase();
      return hay.includes(q);
    }));
  }

  function renderBrowse(){
    var items = filteredForBrowse();
    var tabs = [['all','전체'],['today','오늘'],['upcoming','예정'],['done','완료']];
    var html = '' +
      '<div class="task-tabs">' + tabs.map(function(t){
        return '<button type="button" class="task-tab' + (pState.tab===t[0]?' active':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="search-box acct-search-box"><input type="text" id="taskSearchInput" placeholder="업체명 / 업무 제목 / 내용 / 메모 검색" value="' + escapeAttr(pState.search) + '" /></div>';
    if(!items.length){
      html += '<div class="acct-empty">해당하는 업무가 없습니다.</div>';
    } else {
      html += items.map(function(t){
        var meta = STATUS_META[t.status] || STATUS_META.normal;
        var company = findCompany(t.companyId);
        var metaBits = [];
        if(t.date) metaBits.push(t.date.slice(5).replace('-','.'));
        if(t.time) metaBits.push(t.time);
        return '<div class="task-pop-row' + (t.done?' done':'') + '" data-id="' + t.id + '">' +
          '<span class="task-badge ' + meta.cls + '">' + meta.label + '</span>' +
          '<span class="task-pop-row-title">' + escapeHtml(t.title) + (company ? ' · ' + escapeHtml(company.name) : '') + '</span>' +
          (metaBits.length ? '<span class="task-pop-row-meta">' + escapeHtml(metaBits.join(' ')) + '</span>' : '') +
        '</div>';
      }).join('');
    }
    html += '<div class="acct-pop-add-row"><button type="button" class="acct-add-btn" id="taskAddBtn">+ 업무 추가</button></div>';
    popupBody.innerHTML = html;

    popupBody.querySelectorAll('.task-tab').forEach(function(btn){
      btn.addEventListener('click', function(){ pState.tab = btn.dataset.tab; renderBrowse(); });
    });
    var searchInput = document.getElementById('taskSearchInput');
    searchInput.addEventListener('input', function(){ pState.search = searchInput.value; renderBrowse(); });
    popupBody.querySelectorAll('.task-pop-row').forEach(function(row){
      row.addEventListener('click', function(){ openPopup('detail', row.dataset.id); });
    });
    document.getElementById('taskAddBtn').addEventListener('click', function(){ openPopup('add'); });
  }

  function renderDetail(){
    var rec = loadAll().find(function(t){ return t.id === pState.selectedId; });
    if(!rec){ pState.mode = 'browse'; renderPopup(); return; }
    var meta = STATUS_META[rec.status] || STATUS_META.normal;
    var company = findCompany(rec.companyId);
    var row = function(label, valueHtml){ return valueHtml ? '<div class="task-form-field"><label>' + label + '</label><div style="font-size:13.5px;color:var(--text);">' + valueHtml + '</div></div>' : ''; };
    popupBody.innerHTML = '' +
      '<div class="task-detail-title">' + escapeHtml(rec.title) + '</div>' +
      row('상태', '<span class="task-badge ' + meta.cls + '">' + meta.label + '</span>') +
      row('업체', company ? escapeHtml(company.name) + ' <button type="button" class="task-company-link" id="taskOpenCompanyBtn">업체 보기</button>' : '') +
      row('내용', rec.content ? escapeHtml(rec.content) : '') +
      row('등록시간', escapeHtml(fmtDateTime(rec.createdAt)) + (rec.updatedAt !== rec.createdAt ? ' · 수정됨 ' + escapeHtml(fmtDateTime(rec.updatedAt)) : '')) +
      row('마감일/시간', (rec.date || rec.time) ? escapeHtml([rec.date, rec.time].filter(Boolean).join(' ')) : '') +
      '<div class="task-detail-actions" id="taskDetailActions">' +
        '<button type="button" class="acct-text-action" id="taskEditBtn">수정</button>' +
        (rec.done
          ? '<button type="button" class="acct-text-action" id="taskUndoBtn">완료 취소</button>'
          : '<button type="button" class="acct-text-action" id="taskCompleteBtn">완료</button>') +
        '<button type="button" class="acct-text-action danger" id="taskDeleteBtn">삭제</button>' +
      '</div>' +
      '<div id="taskMemoSlot"></div>';

    var openCompanyBtn = document.getElementById('taskOpenCompanyBtn');
    if(openCompanyBtn){
      openCompanyBtn.addEventListener('click', function(){
        closePopup();
        if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
        if(window.SHIN2_COMPANIES) window.SHIN2_COMPANIES.openDetail(rec.companyId);
      });
    }
    document.getElementById('taskEditBtn').addEventListener('click', function(){ openPopup('edit', rec.id); });
    document.getElementById('taskDeleteBtn').addEventListener('click', function(){
      var actionsRow = document.getElementById('taskDetailActions');
      actionsRow.innerHTML = '<div class="co-confirm-row"><span>이 업무를 삭제하시겠습니까?</span>' +
        '<button type="button" class="acct-text-action" id="taskDeleteCancel">취소</button>' +
        '<button type="button" class="acct-text-action danger" id="taskDeleteConfirm">삭제</button></div>';
      document.getElementById('taskDeleteCancel').addEventListener('click', renderDetail);
      document.getElementById('taskDeleteConfirm').addEventListener('click', function(){
        remove(rec.id);
        pState.mode = 'browse';
        renderPopup();
      });
    });
    var completeBtn = document.getElementById('taskCompleteBtn');
    if(completeBtn) completeBtn.addEventListener('click', function(){
      setDone(rec.id, true); renderHomeSummary(); renderDetail();
      // companyId가 있는 업무는 홈 "고객 업무" 섹션도 같은 레코드를 보여주므로 즉시 갱신한다.
      if(rec.companyId && window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
    });
    var undoBtn = document.getElementById('taskUndoBtn');
    if(undoBtn) undoBtn.addEventListener('click', function(){
      setDone(rec.id, false); renderHomeSummary(); renderDetail();
      if(rec.companyId && window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
    });

    if(window.SHIN2_MEMO){
      window.SHIN2_MEMO.mount(document.getElementById('taskMemoSlot'), 'task', rec.id, { title:'메모' });
    }
  }

  function renderForm(isNew){
    var vals = pState.formValues;
    var companies = getCompanies();
    var statusOptionsHtml = STATUS_ORDER.map(function(key){
      return '<option value="' + key + '"' + (vals.status===key?' selected':'') + '>' + STATUS_META[key].label + '</option>';
    }).join('');
    var companyOptionsHtml = '<option value="">(선택 안 함)</option>' + companies.map(function(c){
      return '<option value="' + escapeAttr(c.id) + '"' + (vals.companyId===c.id?' selected':'') + '>' + escapeHtml(c.name) + '</option>';
    }).join('');
    popupBody.innerHTML = '' +
      '<div class="task-detail-title">' + (isNew ? '업무 추가' : '업무 수정') + '</div>' +
      '<div class="task-form-field"><label>업무 제목 (필수)</label><input type="text" id="taskFTitle" value="' + escapeAttr(vals.title) + '" placeholder="예: 신광건설 견적 문의" /></div>' +
      '<div id="taskFTitleErr" class="acct-form-error" style="display:none;">업무 제목을 입력하세요.</div>' +
      '<div class="task-form-row">' +
        '<div class="task-form-field"><label>상태</label><select id="taskFStatus">' + statusOptionsHtml + '</select></div>' +
        '<div class="task-form-field"><label>업체</label><select id="taskFCompany">' + companyOptionsHtml + '</select></div>' +
      '</div>' +
      '<div class="task-form-field"><label>내용</label><textarea id="taskFContent">' + escapeHtml(vals.content) + '</textarea></div>' +
      '<div class="task-form-row">' +
        '<div class="task-form-field"><label>날짜</label><input type="date" id="taskFDate" value="' + escapeAttr(vals.date) + '" /></div>' +
        '<div class="task-form-field"><label>시간</label><input type="time" id="taskFTime" value="' + escapeAttr(vals.time) + '" /></div>' +
      '</div>' +
      '<div class="acct-form-actions">' +
        '<button type="button" class="acct-text-action" id="taskFormCancel">취소</button>' +
        '<button type="button" class="ai-run-btn" id="taskFormSave">저장</button>' +
      '</div>';

    document.getElementById('taskFormCancel').addEventListener('click', function(){
      pState.mode = isNew ? 'browse' : 'detail';
      renderPopup();
    });
    document.getElementById('taskFormSave').addEventListener('click', function(){
      var titleEl = document.getElementById('taskFTitle');
      var title = titleEl.value.trim();
      if(!title){
        document.getElementById('taskFTitleErr').style.display = 'block';
        titleEl.focus();
        return;
      }
      var fields = {
        title: title,
        status: document.getElementById('taskFStatus').value,
        companyId: document.getElementById('taskFCompany').value,
        content: document.getElementById('taskFContent').value,
        date: document.getElementById('taskFDate').value,
        time: document.getElementById('taskFTime').value
      };
      if(isNew){
        var rec = add(fields);
        pState.mode = 'detail'; pState.selectedId = rec.id;
      } else {
        update(pState.selectedId, fields);
        pState.mode = 'detail';
      }
      renderHomeSummary();
      // companyId가 있는(고객 업무) 새 업무/수정은 홈 "고객 업무" 섹션도 즉시 갱신한다.
      if(fields.companyId && window.SHIN2_CUSTOMER_TASKS_HOME) window.SHIN2_CUSTOMER_TASKS_HOME.render();
      renderPopup();
    });
  }

  window.SHIN2_TASKS = { add:add, update:update, setDone:setDone, remove:remove, getAll:loadAll, openPopup:openPopup };

  window.addEventListener('shin2-cloud-update', function(e){
    if(e.detail.key !== 'tasks') return;
    renderHomeSummary();
    if(popupOverlay.classList.contains('open') && pState.mode !== 'add' && pState.mode !== 'edit') renderPopup();
  });

  homeSlotEl = document.getElementById('homeTaskSlot');
  renderHomeSummary();
})();
</script>

<script>
/* ==========================================================================
   SHIN2_CALLS — "전화 온 내용" (전화받으면서 자유메모 → 저장 → 로컬 규칙 기반 파서가
   시공사/아파트/기타/확인 필요로 자동 분류 → 시공사는 업체관리와 연결 제안, 아파트는
   업체관리와 절대 섞이지 않는 자체 히스토리로 관리)
   ------------------------------------------------------------------------
   [로컬 파서 전환] 이 라운드부터 구조화 단계는 외부 AI API(OpenAI/Claude/Gemini 등)를 전혀
   사용하지 않는다 — parseCallMemoLocally()가 기존 업체 DB 대조/직책·전화번호 정규식/
   아파트·공법 키워드만으로 동기적으로 즉시 구조화한다(네트워크 호출 없음, API KEY 불필요).
   결과 데이터 모양은 예전 AI 구조화 결과와 동일하게 맞춰 아래 업체 연결·충돌 UI/렌더링
   코드는 손대지 않았다. window.SHIN2_AI.callOpenAI는 "AI 문구정리"/"빠른 지식 추가"가
   여전히 사용하므로 그대로 남겨두되, 이 모듈의 저장 경로에서는 더 이상 호출하지 않는다.
   [리네이밍/재구성 이력] 이전 라운드("전화메모 접수함")의 원문 보존/업체 연결·충돌 UI
   패턴은 그대로 재사용하고, 다음을 새로 도입했다:
     - callerType('시공사'/'아파트'/'기타'/'확인 필요') 자동 분류 + 사용자 재분류(§19)
     - 아파트는 업체관리(shin2-companies-staging)에 절대 연결/등록하지 않는다(§16) —
       companyId/companyLinkStatus 관련 로직은 callerType==='시공사'일 때만 동작한다.
     - "완료" 개념(status:'done', [완료] 버튼, 완료시 홈에서 사라지는 동작)을 완전히 제거했다
       (§23). 모든 기록은 항상 존재하며, 홈에는 항상 최신 5건만 보인다 — 5건이 넘으면
       자연히 목록에서 밀려날 뿐 사용자가 누르는 별도의 "완료" 액션은 없다.
     - 홈 UI를 더 이상 SHIN2_TASKS("처리할 업무")의 #homeTaskSlot DOM에 patch하지 않는다.
       이제 이 모듈은 완전히 독립된 #homeCallSlot에 직접 그린다 — SHIN2_TASKS 코드/데이터
       (shin2-tasks-v1, "처리할 업무")는 이 리네이밍 작업에서 그 어떤 줄도 건드리지 않았다.

   기존 SHIN2_TASKS(shin2-tasks-v1, 사용자가 직접 상태/일정을 입력하는 "처리할 업무")와는
   완전히 다른 별도 데이터다. 이쪽은 형식 강제 없이 자유롭게 적은 원문을 그대로 저장한 뒤
   AI가 구조화하고, 업체관리 데이터와 자동으로 "연결을 제안"할 뿐 업체 데이터를 절대 몰래
   덮어쓰지 않는다(§13/§14). 두 데이터를 하나로 합치면 저장 스키마가 근본적으로 달라
   오히려 기존 "처리할 업무" 기능을 깨뜨리게 되므로 분리를 유지한다.

   저장: localStorage 'shin2-call-entries-v1' (기존과 동일한 키 그대로 재사용 — §22: 새
   스토리지 키를 만들지 않는다. Firebase 동기화 브릿지의 'calls' 항목도 이 키를 그대로
   가리키므로 브릿지 코드는 변경할 필요가 없다).
   원문(originalText)은 add()에서 저장된 뒤 그 어떤 함수로도 변경되지 않는다(절대 규칙 —
   updateFields()는 originalText/id/createdAt 키를 명시적으로 무시한다).

   [기존 데이터 마이그레이션 — §21/하드룰]
   이전 라운드가 이미 저장해둔 레코드에는 callerType/apartmentName 필드가 없다. loadAll()이
   호출될 때마다 그런 레코드를 감지해 안전한 기본값으로 채워 넣는다:
     - callerType이 아예 없는 레코드는, companyId가 있거나(업체와 이미 연결됨) 또는
       companyCandidateName이 있으면(AI가 이미 시공사 후보명을 뽑아뒀던 경우) '시공사'로,

      rec.followUp = extracted.followUp || '';
      rec.repName = extracted.repName || '';
      rec.extraMemo = extracted.memo || '';
      rec.companyCandidateName = rec.callerType === '시공사' ? (extracted.companyName || '') : '';
      rec.aiFailed = false;

      if(rec.callerType !== '시공사' || !rec.companyCandidateName){
        rec.companyLinkStatus = 'none';
        rec.companyId = ''; rec.companyCandidateIds = [];
        return;
      }
      var match = findCompanyMatches(rec.companyCandidateName, extracted.phone);
      if(match.status === 'linked'){
        var company = match.companies[0];
        rec.companyId = company.id;
        rec.companyLinkStatus = 'linked';
        rec.companyCandidateIds = [];
        rec.fieldSuggestions = buildFieldSuggestions(company, rec);
      } else if(match.status === 'ambiguous'){
        rec.companyId = '';
        rec.companyLinkStatus = 'ambiguous';
        rec.companyCandidateIds = match.companies.map(function(c){ return c.id; });
      } else {
        rec.companyId = '';
        rec.companyLinkStatus = 'new_candidate';
        rec.companyCandidateIds = [];
      }
    });
  }

  function resolveAmbiguous(id, companyIdOrNone){
    updateRecord(id, function(rec){
      if(companyIdOrNone === '__none__'){
        rec.companyLinkStatus = 'none';
        rec.companyId = ''; rec.companyCandidateIds = [];
        return;
      }
      var company = findCompanyById(companyIdOrNone);
      rec.companyId = companyIdOrNone;
      rec.companyLinkStatus = company ? 'linked' : 'none';
      rec.companyCandidateIds = [];
      if(company) rec.fieldSuggestions = buildFieldSuggestions(company, rec);
    });
  }

  // [업체정보 등록] 눌러야만 실제 업체 데이터가 생성된다(§14) — AI가 후보를 뽑아냈다고 자동
  // 생성하지 않는다. 아파트는 이 함수를 호출하는 UI 경로 자체가 없다(§16).
  // §18: 업체관리의 업체 추가 폼(명함·사업자등록증 드래그앤드롭 포함)을 그대로 열어 전화메모
  // 후보정보로 미리 채우고, 사용자가 확인/수정 후 [저장]을 눌러야만 실제로 업체가 생성된다 —
  // 예전처럼 버튼 클릭 한 번에 곧장 저장하지 않는다(§저장 전 사용자 확인 원칙과 통일).
  function registerNewCompany(id){
    var rec = getById(id);
    if(!rec || rec.callerType !== '시공사') return;
    var prefill = {
      name: rec.companyCandidateName || '', repName: rec.repName || '', contactName: rec.contactName || '',
      position: rec.position || '', phone: rec.phone || '', address: rec.address || ''
    };
    if(window.SHIN2_NAV) window.SHIN2_NAV.showView('companies');
    if(window.SHIN2_COMPANIES && window.SHIN2_COMPANIES.openAddPrefilled){
      window.SHIN2_COMPANIES.openAddPrefilled(prefill, function(newCo){
        updateRecord(id, function(r){
          r.companyId = newCo.id; r.companyLinkStatus = 'linked'; r.companyCandidateIds = [];
        });
        renderHomeBlock();
      });
    }
  }
  function dismissNewCompany(id){
    updateRecord(id, function(r){ r.companyLinkStatus = 'none'; });
  }

  function applySuggestion(id, field){
    var rec = getById(id);
    if(!rec || !rec.companyId) return;
    var s = (rec.fieldSuggestions||[]).find(function(x){ return x.field === field && x.status === 'pending'; });
    if(!s) return;
    var companies = getCompanies();
    var company = companies.find(function(c){ return c.id === rec.companyId; });
    if(company){
      company[field] = s.value;
      writeCompanies(companies);
    }
    updateRecord(id, function(r){
      var sug = (r.fieldSuggestions||[]).find(function(x){ return x.field === field; });
      if(sug) sug.status = 'applied';
    });
  }
  function dismissSuggestion(id, field){
    updateRecord(id, function(r){
      var sug = (r.fieldSuggestions||[]).find(function(x){ return x.field === field; });
      if(sug) sug.status = 'dismissed';
    });
  }

  /* 사용자가 시공사↔아파트 구분을 직접 재분류(§19)했을 때 — 업체 연결 상태를 그 구분에
     맞게 안전한 상태로 재설정한다. originalText는 건드리지 않는다. */
  function setCallerType(id, callerType){
    if(CALLER_TYPES.indexOf(callerType) === -1) return null;
    return updateRecord(id, function(rec){
      rec.callerType = callerType;
      if(callerType !== '시공사'){
        // 아파트/기타/확인 필요로 바뀌면 시공사 업체 연결은 전부 해제한다(§16) — 업체
        // 데이터 자체는 건드리지 않고 이 레코드의 링크만 끊는다.
        rec.companyId = ''; rec.companyLinkStatus = 'none'; rec.companyCandidateIds = [];
      }
    });
  }

  // 상태 전환 전용 — [확인]/[처리완료] 버튼이 호출한다. status만 바꾸고 절대 레코드를
  // 지우거나 다른 필드를 건드리지 않는다(하드룰: 이 두 버튼은 삭제 기능이 아니다).
  function setStatus(id, status){
    if(STATUS_VALUES.indexOf(status) === -1) return null;
    return updateRecord(id, function(rec){ rec.status = status; });
  }

  /* ---------- 로컬 규칙 기반 파서 (외부 AI API 완전 미사용) ----------
     이 모듈은 어떤 네트워크 호출도 하지 않는다(완전 동기 함수). window.SHIN2_AI/callOpenAI는
     이 파일 아래쪽에 여전히 정의되어 있지만(§ "AI 문구정리"/"빠른 지식 추가"가 계속 사용),
     "전화 온 내용" 저장 경로에서는 더 이상 호출하지 않는다 — API KEY가 없어도 이 기능은
     항상 즉시 동작해야 한다.
     원칙(스펙 §15): AI처럼 문장을 이해하려 하지 않는다 — 정확히 판별 가능한 신호(기존 업체
     DB와의 부분일치, 직책 키워드, 전화번호 정규식, 아파트/공법 키워드)만 뽑아내고, 그 외에는
     빈 칸 또는 "확인 필요"로 남겨 사용자가 직접 채우게 한다. */

  var POSITION_KEYWORDS = ['관리소장','대표','사장','과장','부장','차장','팀장','소장','회장','이사','전무','상무'];
  // [키워드 보강] 스펙 §3이 명시한 키워드 집합("아파트/APT/주공/푸르지오/자이/래미안/
  // 힐스테이트/아이파크/더샵/롯데캐슬/현대/센트럴/오피스텔/지식산업센터")에서 '현대'가 누락돼
  // 있던 것을 채워 넣는다(스펙 예시 "황성현대2차"가 실제로는 전혀 인식되지 않는 문제였음).
  // 추출 알고리즘(정규식 구조/매칭 방식) 자체는 그대로이고, 이미 선언된 키워드 목록만 스펙에
  // 맞춰 완성한 것이다.
  var APT_KEYWORDS = ['아파트','APT','주공','푸르지오','자이','힐스테이트','래미안','더샵','아이파크','롯데캐슬','현대','센트럴','빌라','오피스텔','지식산업센터'];
  var COMPANY_SUFFIXES = ['건설','산업','개발','기업','상사','이엔지','E&C','EnC','주식회사'];
  var INQUIRY_RULES = [
    [['견적','단가'], '견적문의'],
    [['시방서'], '시방서 요청'],
    [['샘플'], '샘플 요청'],
    [['실적리스트','실적'], '실적 요청'],
    [['협약'], '협약문의'],
    [['질문서'], '질문서'],
    [['미팅','방문'], '미팅문의'],
    [['공법설명회','설명회'], '설명회 문의'],
    [['공사','시공'], '시공문의'],
    [['담당자'], '담당자 문의']
  ];
  var TRADE_KEYWORDS = ['방수','재도장','도장','옥상','복합시트','POUR','포어','아스콘','보수','보강','주차장','에폭시','금속기와','싱글','슁글','PVC','우레탄'];

  // 한국 전화번호 정규식(§4): 휴대폰(010/011 등) + 지역번호(02/031~033/041~044/051~055/061~064).
  var PHONE_RE = /01[016789][-\s]?\d{3,4}[-\s]?\d{4}|02[-\s]?\d{3,4}[-\s]?\d{4}|0(?:3[1-3]|4[1-4]|5[1-5]|6[1-4])[-\s]?\d{3,4}[-\s]?\d{4}/g;

  function extractPhone(text){
    var m = text.match(PHONE_RE);
    if(!m || !m.length) return '';
    // 휴대폰(010/011...) 형태를 가장 표준적인 형태로 우선 채택(§4), 없으면 첫 매칭.
    var mobile = m.find(function(p){ return /^01[016789]/.test(p.replace(/[^0-9]/g,'')); });
    return (mobile || m[0]).trim();
  }

  // 직책 키워드 바로 앞의 2~4자 한글 이름 패턴(§ implementation notes) — 완벽할 필요 없음,
  // 실패하면 그냥 빈칸으로 둔다(억지로 채우지 않는다). 공백 토큰 단위로 비교한다(문자 단위
  // 정규식 백트래킹을 쓰면 "관리소장"처럼 그 자체가 직책 키워드인 4음절 단어가 "관리"+"소장"
  // 으로 잘못 쪼개져 "관리"가 사람 이름으로 오인식되는 문제가 있어, 토큰 방식이 더 안전하다).
  function extractNamePosition(text){
    var tokens = String(text||'').split(/\s+/).filter(Boolean);
    var punct = /^[,.!?"'()·:;]+|[,.!?"'()·:;]+$/g;
    for(var i = 0; i < tokens.length; i++){
      var tok = tokens[i].replace(punct, '');
      var bare = tok.replace(/님$/, '');
      if(POSITION_KEYWORDS.indexOf(bare) !== -1){
        var name = '';
        if(i > 0){
          var prevTok = tokens[i-1].replace(punct, '');
          if(/^[가-힣]{2,4}$/.test(prevTok)) name = prevTok;
        }
        return { name: name, position: bare };
      }
    }
    return { name: '', position: '' };
  }

  // 아파트/현장명 키워드 근처 후보(§5). 접두어(회사명/단지 앞부분)가 붙어 있으면 함께 묶는다 —
  // "한솔아파트"/"한솔APT"/"한솔 아파트" 표기 변형을 전부 하나의 후보로 흡수.
  // [버그 수정 — 아파트 엔티티 분리 하드룰 준수] 키워드 뒤에 곧바로 "1단지"/"2단지"/"3차"
  // 같은 단지 구분 접미어가 붙어 있으면 반드시 함께 캡처한다. 이 접미어를 캡처하지 않으면
  // "덕천주공1단지"와 "덕천주공2단지"가 둘 다 "덕천주공"으로 잘려 같은 아파트로 오인 병합되는데,
  // 이는 스펙의 최상위 하드룰("단지 구분이 다르면 절대 같은 아파트로 병합하지 않는다")을
  // 직접 위반한다 — callerType 분류/업체연결 판단 로직은 전혀 건드리지 않고, 아파트명
  // 캡처 범위만 넓혀 잘못된 절단을 막는다.
  function extractSiteCandidate(text){
    var aptAlt = APT_KEYWORDS.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    var re = new RegExp('([가-힣A-Za-z0-9]{1,10})?\\s?(' + aptAlt + ')(\\s?\\d{1,3}\\s?(?:단지|차|동|블록))?', 'i');
    var m = text.match(re);
    if(!m) return '';
    return String((m[1]||'') + m[2] + (m[3]||'')).trim();
  }

  // 기존 업체명 부분일치(§2) — 업체관리 DB를 최우선 대조. 가장 긴 업체명이 매칭되면 그것을 채택.
  function findCompanyNameInText(text, companies){
    var hay = String(text||'').replace(/\s+/g,'').toLowerCase();
    var best = null;
    companies.forEach(function(c){
      if(!c.name) return;
      var n = normName(c.name);
      if(n && hay.indexOf(n) !== -1){
        if(!best || c.name.length > best.length) best = c.name;
      }
    });
    return best || '';
  }

  // DB에 없는 업체라도 "OO건설"/"OO산업" 같은 명확한 업체 접미어가 있으면 신규 후보로 인정한다
  // (§14의 "신규 업체 후보" 배너가 그대로 계속 동작하도록). 접미어가 없으면 절대 억지로
  // 업체명을 만들어내지 않는다.
  function findCompanySuffixCandidate(text){
    var sufAlt = COMPANY_SUFFIXES.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    var re = new RegExp('([가-힣A-Za-z0-9]{1,10}(?:' + sufAlt + '))');
    var m = text.match(re);
    return m ? m[1].trim() : '';
  }

  // 키워드가 여러 개 매칭되면 배열로 모으되(§6/§7), 서로 포함관계인 중복 태그(예: "재도장"이
  // 있으면 "도장"은 굳이 따로 표시하지 않음)는 제거한다. 기존 렌더링 코드가 inquiryType/
  // workType을 단일 문자열로 다루고 있어(검색/뱃지/상세 렌더) 호환성을 위해 ' · '로 join한
  // 문자열로 반환한다 — 값 자체는 그대로 여러 태그를 담고 있다.
  function collectTags(text, rules){
    var hit = [];
    rules.forEach(function(pair){
      var keywords = pair[0], tag = pair[1];
      if(keywords.some(function(k){ return text.indexOf(k) !== -1; })){
        if(hit.indexOf(tag) === -1) hit.push(tag);
      }
    });
    return hit;
  }
  function collectKeywordList(text, keywords){
    var hit = keywords.filter(function(k){ return text.indexOf(k) !== -1; });
    // 서로 포함관계인 항목 중 더 짧은 쪽은 제거("도장"은 "재도장"에 흡수).
    return hit.filter(function(k){
      return !hit.some(function(o){ return o !== k && o.indexOf(k) !== -1; });
    });
  }

  /* ---------- 로컬 파서 본체(§1~§8, §15) — 순수 함수, 네트워크 호출 없음 ---------- */
  function parseCallMemoLocally(text, companies){
    var t = String(text || '');
    var out = {
      callerType: '확인 필요', companyName: '', apartmentName: '', contactName: '', position: '',
      repName: '', phone: '', siteName: '', address: '', inquiryType: '', workType: '',
      requestText: '', followUp: '', memo: ''
    };

    out.phone = extractPhone(t);

    var dbCompany = findCompanyNameInText(t, companies || []);
    var siteCandidate = extractSiteCandidate(t);
    var suffixCandidate = (!dbCompany && !siteCandidate) ? findCompanySuffixCandidate(t) : '';

    if(dbCompany){
      out.callerType = '시공사';
      out.companyName = dbCompany;
      // 아파트/현장 키워드가 같이 등장하면 "관련현장"으로만 사용한다(§16: 시공사와 아파트는
      // 절대 섞이지 않으므로 apartmentName에는 넣지 않는다).
      out.siteName = siteCandidate;
    } else if(suffixCandidate){
      out.callerType = '시공사';
      out.companyName = suffixCandidate;
    } else if(siteCandidate){
      out.callerType = '아파트';
      out.apartmentName = siteCandidate;
    }
    // 셋 다 없으면 §15 원칙대로 "확인 필요"로 남긴다 — 절대 강제 추측하지 않는다.

    // 업체명/아파트명으로 이미 흡수된 부분은 이름/직책 추출에서 제외한다 — 그렇지 않으면
    // "한솔아파트 관리소장님"에서 "솔아파트"가 사람 이름으로 잘못 잡히는 문제가 생긴다.
    var nameSourceText = t;
    [dbCompany, suffixCandidate, siteCandidate].forEach(function(chunk){
      if(chunk) nameSourceText = nameSourceText.split(chunk).join(' ');
    });
    var np = extractNamePosition(nameSourceText);
    out.contactName = np.name;
    out.position = np.position;

    out.inquiryType = collectTags(t, INQUIRY_RULES).join(' · ');
    out.workType = collectKeywordList(t, TRADE_KEYWORDS).join(' · ');

    return out;
  }

  /* ---------- 홈 "전화 온 내용" 섹션 (§1/§2/§8) ----------
     이제 SHIN2_TASKS("처리할 업무")의 DOM을 patch하지 않고 완전히 독립된 #homeCallSlot에
     직접 그린다 — SHIN2_TASKS 코드/데이터는 이 작업에서 전혀 건드리지 않았다. */
  var homeCallSlotEl = document.getElementById('homeCallSlot');
  // 홈 입력창의 분류 선택 상태(§2/§3) — 재분류/저장 후에는 다시 미선택으로 초기화한다.
  // 버튼 클릭 시에는 renderHomeBlock() 전체를 다시 그리지 않고 DOM만 직접 갱신해서(아래
  // wireHomeCallForm 내부) 입력 중이던 textarea 내용이 지워지지 않게 한다.
  var homeSelectedType = null;

  function renderHomeRowHtml(rec){
    var badgeCls = callerBadgeClass(rec.callerType);
    var badgeLabel = '[' + rec.callerType + ']';
    var company = findCompanyById(rec.companyId);
    var nameLabel = rec.callerType === '아파트'
      ? (rec.apartmentName || '')
      : (company ? company.name : (rec.companyCandidateName || ''));
    var titleParts = [];
    if(nameLabel) titleParts.push(nameLabel);
    if(rec.contactName) titleParts.push(rec.contactName + (rec.position ? ' ' + rec.position : ''));
    var title = titleParts.length ? titleParts.join(' · ') : (rec.originalText || '').slice(0, 30);
    // 핵심 요약 1줄(§8): 현장/요청내용을 우선 사용, 없으면 원문 일부.
    var summary = rec.requestText || rec.siteName || (rec.originalText || '').slice(0, 40);
    return '<div class="home-task-row" data-call-action="open" data-id="' + rec.id + '">' +
      '<div class="home-task-row-main">' +
        '<div class="home-task-row-top">' +
          '<span class="task-badge ' + badgeCls + '">' + escapeHtml(badgeLabel) + '</span>' +
          '<span class="home-task-row-title">' + escapeHtml(title) + '</span>' +
        '</div>' +
        (summary ? '<div class="home-task-row-sub">' + escapeHtml(summary) + '</div>' : '') +
      '</div>' +
      '<span class="home-task-time">' + escapeHtml(fmtHomeTime(rec.createdAt)) + '</span>' +
      '<div class="home-task-chevron">&gt;</div>' +
    '</div>';
  }

  function renderHomeBlock(){
    if(!homeCallSlotEl) return;
    // §5(신규): 홈 화면은 입력 중심으로 두고, 계속 길어지는 과거 기록 목록은 더 이상 입력창
    // 바로 아래에 렌더링하지 않는다. 데이터(shin2-call-entries-v1)는 전혀 지우지 않으며,
    // 과거 기록은 "전체 보기"(renderBrowse, 아래 카테고리함)에서 그대로 다시 볼 수 있다.
    var html = '<div class="home-task-block">' +
      '<div class="home-task-head">' +
        '<div class="home-task-head-left">' +
          '<div class="home-task-title">아파트 문의·전화기록</div>' +
          '<div class="call-type-btns" style="display:flex;gap:6px;">' +
            CALL_TYPE_CHOICES.map(function(t){
              return '<button type="button" class="co-filter-btn call-type-btn" data-call-type="' + escapeAttr(t) + '">' + escapeHtml(t) + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<button type="button" class="home-task-more" data-call-action="view-all">전체 보기 &gt;</button>' +
      '</div>' +
      '<div class="call-input-block">' +
        '<textarea id="callMemoInput" class="ai-textarea" placeholder="아파트 문의·전화 내용을 편하게 적어주세요." style="min-height:108px;"></textarea>' +
        '<div class="call-memo-actions">' +
          '<span class="home-task-row-sub" id="callTypeHint" style="margin-right:auto;white-space:nowrap;">구분을 선택해주세요</span>' +
          '<button type="button" id="callMemoToAiBtn" class="home-bridge-btn" data-bridge-from="callMemoInput">AI로 다듬기</button>' +
          '<button type="button" id="callMemoSaveBtn" class="ai-run-btn" disabled>저장</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    homeCallSlotEl.innerHTML = html;

    var ta = homeCallSlotEl.querySelector('#callMemoInput');
    var btn = homeCallSlotEl.querySelector('#callMemoSaveBtn');
    var hintEl = homeCallSlotEl.querySelector('#callTypeHint');
    var typeBtns = homeCallSlotEl.querySelectorAll('.call-type-btn');

    // 선택 상태를 버튼 강조/저장버튼 활성화/안내문구에 반영한다(§2/§저장전 필수선택).
    // 전체 재렌더 없이 DOM만 갱신하므로 textarea에 입력 중인 내용은 그대로 유지된다.
    function syncTypeUi(){
      typeBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-call-type') === homeSelectedType); });
      btn.disabled = !homeSelectedType;
      hintEl.style.display = homeSelectedType ? 'none' : '';
    }
    typeBtns.forEach(function(b){
      b.addEventListener('click', function(){
        homeSelectedType = b.getAttribute('data-call-type');
        syncTypeUi();
      });
    });
    syncTypeUi();

    btn.addEventListener('click', function(){
      // 구분 미선택이면 저장 자체가 불가능하다(버튼이 disabled라 여기 도달하지 않지만,
      // 이중 방어로 한 번 더 확인한다). alert/confirm은 쓰지 않는다.
      if(!homeSelectedType){ hintEl.style.display = ''; return; }
      var text = ta.value.trim();
      if(!text) return;
      var rec = add(text, homeSelectedType); // 원문은 여기서 즉시 저장된다. callerType은 사용자 선택값 고정.
      // 로컬 규칙 기반 파서(§1~§15) — 네트워크 호출/외부 API 없이 동기적으로 즉시 구조화한다.
      var extracted = parseCallMemoLocally(text, getCompanies());
      // 사용자의 명시적 분류 선택이 파서의 자동추측보다 항상 우선한다(§3) — 다른 추출 필드
      // (전화번호/이름/직책/문의유형 등)는 그대로 파서 결과를 사용한다.
      extracted.callerType = homeSelectedType;
      applyMatchAfterAi(rec.id, extracted);
      ta.value = '';
      homeSelectedType = null;
      renderHomeBlock();
    });
    homeCallSlotEl.querySelectorAll('[data-call-action="open"]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); openPopup('detail', el.dataset.id); });
    });
    homeCallSlotEl.querySelectorAll('[data-call-action="view-all"]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); openPopup('browse'); });
    });
  }

  /* ---------- 전체보기 / 상세 / 수정 팝업 ---------- */
  var popupOverlay = document.getElementById('callPopupOverlay');
  var popupBody = document.getElementById('callPopupBody');
  var popupTitle = document.getElementById('callPopupTitle');
  var popupBackBtn = document.getElementById('callPopupBackBtn');
  var popupCloseBtn = document.getElementById('callPopupCloseBtn');

  var pState = { mode:'browse', tab:'all', statusTab:'all', search:'', selectedId:null, selectedApartmentKey:null, detailBack:null };

  function openPopup(mode, id){
    pState.mode = mode || 'browse';
    pState.selectedId = id || null;
    pState.detailBack = null; // 기본 진입은 항상 목록으로 돌아간다 — 아파트뷰에서 들어온 경우만 예외적으로 세팅됨.
    popupOverlay.classList.add('open');
    renderPopup();
  }
  // 검색결과의 아파트 카드/"전체 전화기록 보기"에서 진입(§5/§6) — 완전히 새로운 "아파트
  // 관리 페이지"를 만들지 않고, 기존 팝업 컴포넌트(overlay/title/back/close) 안에 새 모드만
  // 하나 추가하는 방식으로 재사용한다.
  function openApartmentPopupByKey(key){
    var group = getApartmentGroupByKey(key);
    if(!group) return;
    pState.mode = 'apartment';
    pState.selectedApartmentKey = group.key;
    pState.detailBack = null;
    popupOverlay.classList.add('open');
    renderPopup();
  }
  function closePopup(){ popupOverlay.classList.remove('open'); renderHomeBlock(); }
  popupCloseBtn.addEventListener('click', closePopup);
  popupOverlay.addEventListener('click', function(e){ if(e.target === popupOverlay) closePopup(); });
  popupBackBtn.addEventListener('click', function(){
    if(pState.mode === 'detail'){
      if(pState.detailBack && pState.detailBack.mode === 'apartment'){
        pState.mode = 'apartment';
        pState.selectedApartmentKey = pState.detailBack.key;
        pState.detailBack = null;
      } else {
        pState.mode = 'browse';
      }
      renderPopup();
    }
    else if(pState.mode === 'edit'){ pState.mode = 'detail'; renderPopup(); }
    else if(pState.mode === 'apartment'){ pState.mode = 'browse'; pState.selectedApartmentKey = null; renderPopup(); }
  });

  function renderPopup(){
    popupBackBtn.style.display = pState.mode === 'browse' ? 'none' : '';
    if(pState.mode === 'browse'){ popupTitle.textContent = '전체 전화기록'; renderBrowse(); return; }
    if(pState.mode === 'detail'){ popupTitle.textContent = '전화 상세'; renderDetail(); return; }
    if(pState.mode === 'edit'){ popupTitle.textContent = '전화 내용 수정'; renderEdit(); return; }
    if(pState.mode === 'apartment'){ popupTitle.textContent = '아파트'; renderApartmentView(); return; }
  }

  /* ---------- 아파트 히스토리 뷰 (§5/§8/§9, 신규) ----------
     시공사 검색 카드와 동일한 컴포넌트 구조(shin2-memo-block/shin2-memo-title/
     shin2-memo-list/shin2-memo-item)를 그대로 재사용해 "업체" vs "아파트" 라벨/필드만
     다르게 렌더링한다(§8). 최신순 히스토리 전체를 여기서 보여준다 — 검색 카드에는 최근
     3건 요약만 노출하고 [전체 전화기록 보기]를 누르면 이 뷰로 이어진다. */
  function renderApartmentView(){
    var group = pState.selectedApartmentKey ? getApartmentGroupByKey(pState.selectedApartmentKey) : null;
    if(!group){ pState.mode = 'browse'; renderPopup(); return; }
    var row = function(label, valueHtml){ return valueHtml ? '<div class="task-form-field"><label>' + label + '</label><div style="font-size:13.5px;color:var(--text);">' + valueHtml + '</div></div>' : ''; };
    var listHtml = group.records.map(function(r){
      var who = r.contactName ? (r.contactName + (r.position ? ' ' + r.position : '')) : '';
      var summary = r.requestText || (r.originalText || '').slice(0, 60);
      return '<div class="shin2-memo-item" data-call-id="' + escapeAttr(r.id) + '" style="cursor:pointer;">' +
        '<div class="shin2-memo-meta">' + escapeHtml(fmtFull(r.createdAt)) + '</div>' +
        '<div class="shin2-memo-text">' + escapeHtml((who ? who + ' · ' : '') + summary) + '</div>' +
      '</div>';
    }).join('');
    popupBody.innerHTML =
      '<div class="task-detail-title">' + escapeHtml('[아파트] ' + group.name) + '</div>' +
      row('주소', group.address ? escapeHtml(group.address) : '') +
      row('대표 연락처', group.phone ? escapeHtml(group.phone) : '') +
