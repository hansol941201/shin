contentEl.addEventListener('input', (e)=>{
  if(e.target && e.target.id === 'aiNoteInput'){
    aiComposerState.draftText = e.target.value;
    // 입력창은 최소 6~8줄에서 시작해서 내용이 늘어나면 자동으로 커진다(별도 라이브러리 없이 높이만 갱신).
    e.target.style.height = 'auto';
    e.target.style.height = Math.max(e.target.scrollHeight, e.target.offsetHeight) + 'px';
    return;
  }
  if(e.target && e.target.matches && e.target.matches('[data-action="company-memo-input"]')){
    const c = state.companies.find(c=>c.id===e.target.dataset.id);
    if(c){ c.memo = e.target.value; saveState(); }
    return;
  }
  if(e.target && e.target.id === 'companySearchInput'){
    companySearchQuery = e.target.value;
    updateCompanySearchUI();
    return;
  }
  // Q&A 검색: 전체 render() 대신 목록 영역만 다시 그려 검색창 포커스를 유지한다
  if(e.target && e.target.id === 'qaSearchInput'){
    qaSearchQuery = e.target.value;
    updateQaListUI();
    return;
  }
  // 전화 비서: 통화 메모(자유 입력)는 render()로 다시 그리지 않고 값만 세션에 반영 + 임시 저장 (입력 중 포커스 유지)
  if(e.target && e.target.id === 'paRawMemo'){
    if(!phoneSession) phoneSession = newPhoneSession();
    phoneSession.rawMemo = e.target.value;
    persistActiveCall();
    return;
  }
  // 전화 비서: 통화 종료 후 정리본(요약)도 사용자가 직접 수정 가능 — rawMemo는 절대 덮어쓰지 않는다
  if(e.target && e.target.id === 'paSummaryEdit'){
    if(phoneSession){ phoneSession.report = e.target.value; persistActiveCall(); }
    return;
  }
  // 전화 비서: 후속 업무 항목 텍스트 수정
  if(e.target && e.target.matches && e.target.matches('.pa-followup-input')){
    const idx = Number(e.target.dataset.paFollowupIndex);
    if(phoneSession && phoneSession.followups[idx]){
      phoneSession.followups[idx].text = e.target.value;
      persistActiveCall();
    }
    return;
  }
  // 전화 비서: 질문별 답변 입력 — render() 없이 값만 반영해 타이핑 중 포커스를 유지한다
  if(e.target && e.target.matches && e.target.matches('.pa-qa-answer')){
    const item = phoneSession && phoneSession.qa.find(q => q.id === e.target.dataset.qaId);
    if(item){ item.answer = e.target.value; persistActiveCall(); }
    return;
  }
  // 전화 비서: 질문 편집 모드에서 질문 문장 수정 (지금 통화 + 다음 통화부터 쓸 질문 세트 모두에 반영)
  if(e.target && e.target.matches && e.target.matches('.pa-qa-question-input')){
    const item = phoneSession && phoneSession.qa.find(q => q.id === e.target.dataset.qaId);
    if(item){
      item.question = e.target.value;
      const setItem = phoneSession.scenarioTag && (state.phoneQuestionSets[phoneSession.scenarioTag]||[]).find(q=>q.id===item.id);
      if(setItem) setItem.question = e.target.value;
      persistActiveCall(); saveState();
    }
    return;
  }
  // 전화 비서: 질문 편집 모드에서 질문 라벨(진행순서 짧은 이름) 수정
  if(e.target && e.target.matches && e.target.matches('.pa-qa-label-input')){
    const item = phoneSession && phoneSession.qa.find(q => q.id === e.target.dataset.qaId);
    if(item){
      item.label = e.target.value;
      const setItem = phoneSession.scenarioTag && (state.phoneQuestionSets[phoneSession.scenarioTag]||[]).find(q=>q.id===item.id);
      if(setItem) setItem.label = e.target.value;
      persistActiveCall(); saveState();
    }
    return;
  }
  // 전화 비서: 진행순서 항목 텍스트 수정
  if(e.target && e.target.matches && e.target.matches('.pa-proc-input')){
    const tag = phoneSession && phoneSession.scenarioTag;
    const item = tag && (state.phoneProcedureSets[tag]||[]).find(p => p.id === e.target.dataset.procId);
    if(item){ item.text = e.target.value; saveState(); }
    return;
  }
  // 전화 비서: 통화완료 후 구조화 필드 직접 수정 (사용자 최종 수정본만 바뀌고, AI가 추출한 원본은 보존됨)
  if(e.target && e.target.matches && e.target.matches('.pa-field-input')){
    if(phoneSession){
      phoneSession.finalFields[e.target.dataset.fieldKey] = e.target.value;
      phoneSession.relayText = buildRelayText(phoneSession.scenarioTag, phoneSession.finalFields);
      persistActiveCall();
    }
    return;
  }
  // 전화 비서: 전달용 문구 직접 수정
  if(e.target && e.target.id === 'paRelayText'){
    if(phoneSession){ phoneSession.relayText = e.target.value; persistActiveCall(); }
    return;
  }
});

/* ---------- Global Search ---------- */
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function buildSearchIndex(){
  const idx = [];
  state.guides.forEach(g => {
    idx.push({
      id:`guide-${g.id}`, view:{type:'guide', id:g.id}, chap: g.title,
      text:[g.tag, g.title, g.subtitle, ...g.steps.map(s=>s.label)].filter(Boolean).join(' ')
    });
    g.blocks.forEach(b => {
      idx.push({ id:`block-${g.id}-${b.id}`, view:{type:'guide', id:g.id}, chap: g.title, text: b.body || '' });
    });
  });
  state.todos.forEach(t => idx.push({ id:`todo-${t.id}`, view:{type:'todos'}, chap:'할 일 목록', text: t.text }));
  state.links.forEach(l => idx.push({ id:`link-${l.id}`, view:{type:'openLink', url:l.url}, chap:'사이트 바로가기', text: `${l.title} ${l.url}` }));
  state.phrases.forEach(p => idx.push({ id:`phrase-${p.id}`, view:{type:'phrases'}, chap:'자주 쓰는 멘트', text: `${p.title} ${p.body}` }));
  state.companies.forEach(c => idx.push({
    id:`company-${c.id}`, view:{type:'companies', companyId:c.id}, chap:'업체 관리',
    text: [c.name, c.contactName, c.repName, c.phone, c.fax, c.email, c.bizRegNo, c.address, c.memo].filter(Boolean).join(' ')
  }));
  return idx;
}
function snippet(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  let s;
  if(i < 0){ s = text.slice(0, 90); }
  else {
    const st = Math.max(0, i-28), en = Math.min(text.length, i+q.length+56);
    s = (st>0?'…':'') + text.slice(st, en) + (en<text.length?'…':'');
  }
  let out = escapeHtml(s);
  try{ out = out.replace(new RegExp('('+escRe(escapeHtml(q))+')', 'ig'), '<mark>$1</mark>'); }catch(e){}
  return out;
}

/* 입력 중: 업체명 자동완성만 가볍게 보여준다 */
function runQuickCompanyAutocomplete(){
  const q = searchBox.value.trim();
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
  const matches = state.companies.filter(c => c.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(!matches.length){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
  searchResults.innerHTML = `<div class="sr-head">🏢 업체 자동완성</div><div class="sr-list"></div>`;
  const list = searchResults.querySelector('.sr-list');
  matches.forEach(c => {
    const item = document.createElement('div');
    item.className = 'sr-item';
    item.innerHTML = `<div class="sr-text">🏢 ${escapeHtml(c.name)}</div>`;
    item.addEventListener('click', () => {
      searchResults.classList.remove('open');
      searchBox.value = '';
      openCompanyChecklist(c.id);
    });
    list.appendChild(item);
  });
  searchResults.classList.add('open');
}

/* Enter: 업체명·아파트명·키워드 전체 검색. 업체와 정확히 일치하면 체크리스트를 바로 표시 */
function runSearch(){
  const q = searchBox.value.trim();
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
  const exactCompany = state.companies.find(c => c.name.toLowerCase() === q.toLowerCase());
  if(exactCompany){
    searchResults.classList.remove('open'); searchResults.innerHTML='';
    searchBox.value = '';
    openCompanyChecklist(exactCompany.id);
    return;
  }
  const hits = buildSearchIndex().filter(x => x.text.toLowerCase().includes(q.toLowerCase()));
  if(!hits.length){
    searchResults.innerHTML = '<div class="sr-empty">검색 결과가 없습니다.</div>';
    searchResults.classList.add('open');
    return;
  }
  searchResults.innerHTML = `<div class="sr-head">검색 결과 ${hits.length}건${hits.length>30?' (상위 30건 표시)':''}</div><div class="sr-list"></div>`;
  const list = searchResults.querySelector('.sr-list');
  hits.slice(0,30).forEach(h => {
    const item = document.createElement('div');
    item.className = 'sr-item';
    item.innerHTML = `<div class="sr-chap">${escapeHtml(h.chap)}</div><div class="sr-text">${snippet(h.text, q)}</div>`;
    item.addEventListener('click', () => {
      searchResults.classList.remove('open');
      searchBox.value = '';
      if(h.view.type === 'openLink'){
        window.open(h.view.url, '_blank', 'noopener');
        const chip = document.querySelector(`[data-entry="${h.id}"]`);
        if(chip){ chip.classList.add('search-hit'); setTimeout(()=>chip.classList.remove('search-hit'), 1700); }
        return;
      }
      if(h.view.type === 'todos'){
        openNotePanel();
        setTimeout(() => {
          const target = notePanelBody.querySelector(`[data-entry="${h.id}"]`);
          if(target){
            target.scrollIntoView({block:'center'});
            target.classList.add('search-hit');
            setTimeout(()=>target.classList.remove('search-hit'), 1700);
          }
        }, 60);
        return;
      }
      if(h.view.type === 'companies'){
        openCompanyChecklist(h.view.companyId);
        return;
      }
      state.currentView = h.view;
      saveState(); render();
      setTimeout(() => {
        const target = document.querySelector(`[data-entry="${h.id}"]`);
        if(target){
          target.scrollIntoView({block:'center'});
          target.classList.add('search-hit');
          setTimeout(()=>target.classList.remove('search-hit'), 1700);
        }
      }, 60);
    });
    list.appendChild(item);
  });
  searchResults.classList.add('open');
}

const vaultOverlay = document.getElementById('vaultOverlay');

const revealedPw = new Set();
function renderVault(){
  vaultList.innerHTML = state.credentials.map(c => `
    <div class="vault-item">
      <div class="vault-site">${escapeHtml(c.site)}</div>
      <div class="vault-fields">
        <span class="vault-field-label">ID</span>
        <span class="vault-field-val">${escapeHtml(c.username || '-')}</span>
        <button class="vault-icon-btn" data-action="cred-copy" data-id="${c.id}" data-field="username" title="아이디 복사">📋</button>
        <span class="vault-field-label">PW</span>
        <span class="vault-field-val">${revealedPw.has(c.id) ? escapeHtml(c.password || '-') : '•'.repeat(Math.max(6, (c.password||'').length))}</span>
        <button class="vault-icon-btn" data-action="cred-toggle" data-id="${c.id}" title="보기/숨기기">${revealedPw.has(c.id) ? '🙈' : '👁'}</button>
        <button class="vault-icon-btn" data-action="cred-copy" data-id="${c.id}" data-field="password" title="비밀번호 복사">📋</button>
      </div>
      <button class="vault-icon-btn danger" data-action="cred-delete" data-id="${c.id}" title="삭제">🗑</button>
    </div>
  `).join('') || '<div class="empty-state">등록된 계정 정보가 없습니다</div>';
}
function openVault(){ renderVault(); vaultOverlay.classList.add('open'); }

/* ---------- Quick Links (상단 바로가기, 최대 6개 고정 슬롯) ---------- */
const MAX_QUICKLINKS = 6;
const quickLinksEl = document.getElementById('quickLinks');
function openAddQuickLinkModal(){
  if(state.links.length >= MAX_QUICKLINKS){ showToast('바로가기는 최대 6개까지 등록할 수 있습니다'); return; }
  openModal({
    title:'사이트 바로가기 추가', submitLabel:'추가',
    fields:[
      {name:'title', label:'사이트 이름', placeholder:'예: 잔디 드라이브'},
      {name:'url', label:'URL', placeholder:'https://...'}
    ],
    onSubmit(data){
      if(!data.title || !data.url) return;
      if(state.links.length >= MAX_QUICKLINKS) return;
      let url = data.url;
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
      state.links.push({id:uid(), title:data.title, url});
      saveState(); renderQuickLinks();
    }
  });
}
/* 바로가기 아이콘: 모든 아이콘은 남색 단색으로 통일(브랜드 컬러 사용 안 함), 알려진 사이트는 전용 기호를 사용 */
function getQuickLinkIcon(title){
  const t = (title || '').trim();
  if(/기술지원/.test(t)){
    return { cls:'', style:'', html:'A' };
  }
  if(/협약/.test(t)){
    return { cls:'qicon-doc', style:'', html:'<i></i><i></i><i></i>' };
  }
  if(/partner\s*dashboard/i.test(t)){
    return { cls:'qicon-grid', style:'', html:'<i></i><i></i><i></i><i></i>' };
  }
  if(/네이버/.test(t)){
    return { cls:'', style:'', html:'N' };
  }
  if(/하이웍스|hiworks/i.test(t)){
    return { cls:'', style:'', html:'H' };
  }
  return { cls:'', style:'', html: escapeHtml(t.charAt(0).toUpperCase() || '#') };
}
/* 상단 헤더 바로가기: 검색창 옆에 작은 캡슐 버튼으로 표시. 클릭 시 새 탭으로 열리고(target=_blank),
   각 캡슐에는 작은 삭제(✕) 버튼이 있다(평소엔 연하게, hover 시에만 진하게 — 큰 빨간 버튼 사용 안 함). */
function quickLinksMarkup(){
  let html = state.links.map(l => `
    <span class="qlink-chip" data-entry="link-${l.id}">
      <a class="qlink-chip-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.title)}</a>
      <button type="button" class="qlink-chip-del" data-action="qlink-delete" data-id="${l.id}" title="바로가기 삭제">✕</button>
    </span>
  `).join('');
  if(state.links.length < MAX_QUICKLINKS){
    html += `<button type="button" class="qlink-chip-add" data-action="qlink-add-slot">+ 바로가기</button>`;
  }
  return html;
}
function renderQuickLinks(){
  quickLinksEl.innerHTML = quickLinksMarkup();
}
quickLinksEl.addEventListener('click', (e)=>{
  const addBtn = e.target.closest('[data-action="qlink-add-slot"]');
  if(addBtn){ openAddQuickLinkModal(); return; }
  const delBtn = e.target.closest('[data-action="qlink-delete"]');
  if(delBtn){
    const link = state.links.find(l => l.id === delBtn.dataset.id);
    if(link && confirm(`"${link.title}" 바로가기를 삭제하시겠습니까?`)){
      state.links = state.links.filter(l => l.id !== link.id);
      saveState(); renderQuickLinks();
    }
  }
});

/* ---------- AI 업무비서 (메모장 입력 → OpenAI로 문구 자동 수정) ---------- */
const OPENAI_KEY_STORAGE = 'work-guide-openai-key';

function getOpenAIKey(){
  return localStorage.getItem(OPENAI_KEY_STORAGE) || '';
}
function promptForOpenAIKey(onSaved){
  // 최초 1회만 호출됨: 여기서 저장한 키는 이후 자동으로 재사용되고, 다시 묻지 않는다.
  openModal({
    title:'OpenAI API 키 등록 (최초 1회)',
    submitLabel:'저장',
    fields:[{name:'key', label:'OpenAI API Key', placeholder:'sk-...'}],
    onSubmit(data){
      if(!data.key) return;
      localStorage.setItem(OPENAI_KEY_STORAGE, data.key);
      showToast('API 키가 저장되었습니다. 이후에는 자동으로 사용됩니다');
      onSaved(data.key);
    }
  });

function openAiSettingsModal(){
  // API 키를 변경/삭제할 수 있는 유일한 경로. 필드를 비운 채 저장하면 키가 삭제된다.
  const current = getOpenAIKey();
  openModal({
    title:'⚙️ AI 업무비서 설정',
    submitLabel:'저장',
    fields:[{name:'key', label:'OpenAI API Key (비우고 저장하면 삭제됩니다)', value: current, placeholder:'sk-...'}],
    onSubmit(data){
      if(data.key){

      } else {

        showToast('API 키가 삭제되었습니다');
      }
    }
  });
}
/* AI 문구수정 카드는 홈 화면(전화비서 바로 아래)에 렌더링되므로, 다른 dynamic 영역과 마찬가지로
   contentEl에 위임된 리스너로만 동작한다(직접 바인딩 금지 — render()마다 노드가 새로 만들어짐). */

function detectNoteType(text){
  const t = text.trim();
  if(/^(메일|이메일)\s*/.test(t)) return { type:'mail', rest: t.replace(/^(메일|이메일)\s*/, '') };
  if(/^(카카오톡|카톡)\s*/.test(t)) return { type:'kakao', rest: t.replace(/^(카카오톡|카톡)\s*/, '') };
  if(/^(전화보고|보고)\s*/.test(t)) return { type:'report', rest: t.replace(/^(전화보고|보고)\s*/, '') };
  return { type:'kakao', rest: t };
}

// 공통 규칙: 오타/맞춤법 교정, 순서 재배치, 중복 표현 제거, 단어/문장 조각을 자연스러운 문장으로 연결,
// 유형에 맞는 어투로 변환하되 — 입력에 없는 사실을 새로 지어내거나(추측 금지), 입력에 있는 사실
// (전화번호, 업체/건물/아파트명, 요청 사항, 중요 상황 정보 등)을 빠뜨리는 것은 절대 금지한다.
const AI_FACT_RULE = `절대 규칙:\n- 입력에 없는 내용(사실, 숫자, 이름, 약속 등)을 새로 지어내지 마.\n- 입력에 있는 사실(전화번호, 업체명, 건물/아파트명, 요청 사항, 담당자, 위치, 상황 등)은 절대 빠뜨리지 말고 전부 반영해.\n- 맞춤법/띄어쓰기를 고치고, 순서를 자연스럽게 정리하고, 중복 표현은 줄이고, 짧은 단어/조각들을 자연스러운 문장으로 연결해줘.`;

function buildAiPrompt(type, rest){
  if(type === 'mail'){
    return `아래 메모를 바탕으로 업무용 이메일을 작성해줘. 반드시 다음 형식을 그대로 지켜서 출력해:\n\n제목\n[POUR공법] (내용에 맞는 제목)\n\n본문\n안녕하세요.\nPOUR공법입니다.\n\n(메모 내용을 정중하고 명확한 문장으로 풀어서 작성)\n\n감사합니다.\n\n${AI_FACT_RULE}\n\n메모: "${rest}"\n\n다른 설명 없이 위 형식의 결과만 출력해.`;
  }
  if(type === 'report'){
    return `아래 메모를 바탕으로 팀장님께 드리는 업무보고 문구를 작성해줘. 반드시 "팀장님,"으로 시작하고, 정중하고 간결한 보고체로 작성해.\n\n${AI_FACT_RULE}\n\n메모: "${rest}"\n\n다른 설명 없이 결과 문구만 출력해.`;
  }
  return `아래 메모를 바탕으로 카카오톡으로 보낼 업무 메시지를 작성해줘. 반드시 다음 형식을 지켜서 출력해:\n\n안녕하세요.\nPOUR공법입니다.\n\n(메모 내용을 정중하고 명확한 문장으로 풀어서 작성)\n\n감사합니다.\n\n${AI_FACT_RULE}\n\n메모: "${rest}"\n\n다른 설명 없이 위 형식의 결과만 출력해.`;
}

async function callOpenAI(apiKey, prompt){
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model:'gpt-4o-mini',
      messages:[
        {role:'system', content:'너는 건설/시공 업무를 돕는 한국어 비서야. 항상 정중한 존댓말로, 요청받은 형식만 정확히 출력해.'},
        {role:'user', content: prompt}
      ],
      temperature:0.5
    })
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).error?.message || ''; }catch(e){}
    throw new Error(`OpenAI API 오류 (${res.status}) ${detail}`);
  }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
}

// AI 문구수정 카드(홈 화면, 전화비서 바로 아래)의 임시 UI 상태 — 원본 입력 textarea 내용은
// 절대 AI 결과로 덮어쓰지 않고(§23), 결과는 별도로 보관해 입력 아래에 그대로 보여준다.
let aiComposerState = { mode:'report', draftText:'', result:'', loading:false };
const AI_MODE_LABEL = { mail:'메일', kakao:'카카오톡', report:'업무보고' };

// AI 문구수정 카드 — 홈 화면의 첫 번째(가장 중요한) 블록으로 렌더링된다.
const AI_COMPOSER_PLACEHOLDER = `통화내용이나 업무문구를 편하게 입력하세요. 짧은 단어·문장 조각·오타·받아쓰기 메모도 그대로 괜찮습니다.\n\n예시)\n마크원 지식산업센터 센터장 전화옴\n8층 주차장 에폭시 다 벗겨짐\n다른공법 가능한지 궁금\n1층도 주차선 포함해서 공사 원함\n담당자 콜백 원함`;
function renderAiComposerCard(){
  return `
    <div class="card" id="aiComposerCard">
      <div class="card-head">
        <div class="card-title" style="margin:0;">✨ AI 문구수정</div>
        <button type="button" class="icon-btn" data-action="ai-settings" title="API 키 설정">⚙</button>
      </div>
      <textarea id="aiNoteInput" class="ai-note-textarea" rows="7"
        placeholder="${escapeHtml(AI_COMPOSER_PLACEHOLDER)}">${escapeHtml(aiComposerState.draftText)}</textarea>
      <div class="ai-composer-mode-row">
        <button type="button" class="copy-btn ${aiComposerState.mode==='report'?'active':''}" data-action="ai-mode" data-mode="report">업무보고</button>
        <button type="button" class="copy-btn ${aiComposerState.mode==='kakao'?'active':''}" data-action="ai-mode" data-mode="kakao">카카오톡</button>
        <button type="button" class="copy-btn ${aiComposerState.mode==='mail'?'active':''}" data-action="ai-mode" data-mode="mail">메일</button>
        <button type="button" class="btn btn-ghost" style="margin-left:auto;" data-action="ai-new">새 문구</button>
        <button type="button" class="btn btn-primary" data-action="ai-rewrite">AI 문구정리</button>
      </div>
      <span class="ai-note-status" id="aiNoteStatus" style="display:${aiComposerState.loading?'flex':'none'};"><span class="spin"></span>문구 수정 중...</span>
      ${aiComposerState.result ? `
        <div class="ai-composer-result">
          <div class="ai-composer-result-label">수정 결과</div>
          <div class="pa-note-line" style="white-space:pre-wrap;">${escapeHtml(aiComposerState.result)}</div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button type="button" class="copy-btn" data-action="ai-result-copy">복사</button>
            <button type="button" class="copy-btn" data-action="ai-result-retry">다시 수정</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function triggerAiRewrite(){
  if(aiComposerState.loading) return;
  const input = document.getElementById('aiNoteInput');
  const text = (input ? input.value : aiComposerState.draftText).trim();
  if(!text) return;
  aiComposerState.draftText = input ? input.value : aiComposerState.draftText;
  const apiKey = getOpenAIKey();
  if(!apiKey){
    promptForOpenAIKey((key)=> runAiRewrite(key, text));
    return;
  }
  runAiRewrite(apiKey, text);
}

async function runAiRewrite(apiKey, text){
  const detected = detectNoteType(text);
  const type = aiComposerState.mode || detected.type;
  const rest = aiComposerState.mode ? text : (detected.rest || text);
  const prompt = buildAiPrompt(type, rest);
  aiComposerState.loading = true;
  render();
  try{
    const result = await callOpenAI(apiKey, prompt);
    if(result) aiComposerState.result = result;
    else showToast('AI 응답이 비어있습니다');
  } catch(err){
    console.error(err);
    showToast('문구 수정에 실패했습니다.');
  } finally {
    aiComposerState.loading = false;
    render();
    requestAnimationFrame(()=>{ const el = document.getElementById('aiNoteInput'); if(el) el.focus(); });
  }
}

/* ==========================================================================
   전화 비서 (통화 중 실시간 업무비서)
   - 통화 중에는 짧은 단어/문장만 입력한다. 정확한 키워드 일치가 아니라
     동의어(PHONE_INTENT_GROUPS)를 기준으로 의도를 인식한다.
   - 화면에 보여주는 정보(전화대사/업무순서/자료위치/관할담당자/업체정보)는
     전부 state(guides/phrases/companies/materials/jurisdictions/sites)에서
     찾아서 보여줄 뿐, AI가 지어내지 않는다. 등록된 정보가 없으면 그렇게 표시한다.
   - 통화 세션 자체는 state에 저장하지 않는다(통화 중 임시 작업 메모이며,
     기존 Firebase 컬렉션 구조에는 전혀 영향을 주지 않는다).
   ========================================================================== */

// 짧은 입력을 같은 업무 의도로 묶어주는 동의어 사전. 새 의도가 필요하면 이 배열에 항목만 추가하면 된다.
const PHONE_INTENT_GROUPS = [
  { tag:'체결',      keywords:['체결','협약','mou','MOU','제휴','업무협약','협약문의'] },
  { tag:'시방서',    keywords:['시방서','시방','시방서 요청','시방서요청'] },
  { tag:'공법설명회', keywords:['공법설명회','설명회','공법 설명','공법설명','공법문의','공법 문의','pt','PT','공법설명회 일정','pt 일정'] },
  { tag:'자료요청',  keywords:['자료','자료달라','자료줘','자료요청','보내달라','발송해'] },
  { tag:'담당자',    keywords:['담당자','담당','지사','연락처','전화번호','누가'] },
  { tag:'견적',      keywords:['견적','견적문의','견적 요청','견적요청','공사 견적','공사견적','비용','가격'] },
  { tag:'특허',      keywords:['특허','특허번호','인증'] },
  { tag:'현장등록',  keywords:['현장등록','현장 등록'] },
  { tag:'질문서',    keywords:['질문서','질의서'] },
];
// 관할 담당자 조회에 사용하는 광역 지역명
const PHONE_REGION_LIST = ['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
// 자료 요청으로 볼 수 있는 의도 — 이 태그가 인식됐는데 등록된 자료가 없으면 "확인 필요"로 명시한다
const MATERIAL_REQUEST_TAGS = ['시방서','자료요청','질문서','특허'];
// 검색 전 화면의 빠른 유형 선택 칩. 클릭하면 이 문구를 입력한 것과 똑같이 통화 시작(addPhoneNote) 흐름을 그대로 탄다 —
// 새 인식 로직이 아니라 기존 PHONE_INTENT_GROUPS 키워드 인식에 그대로 올라타는 지름길일 뿐이다.
const PHONE_QUICK_TYPES = ['견적문의','협약문의','자료요청','공법문의','PT요청','자재발주','공사진행','기타'];

function textIncludesAny(text, keywords){
  const t = String(text||'').toLowerCase().replace(/\s+/g,'');
  return keywords.some(k => t.includes(String(k).toLowerCase().replace(/\s+/g,'')));
}
function detectIntents(line){
  return PHONE_INTENT_GROUPS.filter(g => textIncludesAny(line, g.keywords)).map(g => g.tag);
}
function detectRegion(line){ return PHONE_REGION_LIST.find(r => line.includes(r)) || null; }
function detectSite(line){
  const norm = line.replace(/\s+/g,'');
  return state.sites.find(s => s.name && norm.includes(s.name.replace(/\s+/g,''))) || null;
}
function detectCompany(line){
  const norm = line.replace(/\s+/g,'').toLowerCase();
  return state.companies.find(c => c.name && norm.includes(c.name.replace(/\s+/g,'').toLowerCase())) || null;
}

// 인식된 의도(tag) 목록으로 "지금 말할 내용"을 찾는다. 자주 쓰는 멘트 → 업무 가이드의 메모 순으로 우선 참고한다.
// (처리할 업무 비서의 "전화할 때" 항목도 이 함수를 그대로 재사용한다.)
function findScriptForTags(tags){
  for(const tag of [...tags].reverse()){
    const phraseHit = state.phrases.find(p => textIncludesAny(`${p.title} ${p.body}`, [tag]));
    if(phraseHit) return { title: phraseHit.title, body: phraseHit.body };
    for(const g of state.guides){
      const blockHit = g.blocks.find(b => textIncludesAny(b.body, [tag]));
      if(blockHit) return { title: g.title, body: blockHit.body };
    }
  }
  return null;
}

// 통화 세션(임시, state에는 저장하지 않음). [저장]을 누르기 전까지는 새로고침해도 사라지지 않도록
// localStorage에 임시 보관해둔 내용이 있으면 그대로 복구한다(아래 restoreActiveCall 정의부 참고).
let phoneSession = null;
function newPhoneSession(){
  return {
    active:true, notes:[], matchedIntents:[], region:null, site:null, company:null, firstLine:'',
    rawMemo:'', // 통화 메모(자유 입력 textarea) 원문 — 업무 유형이 인식되지 않았을 때만 사용. 절대 덮어쓰지 않는다
    scenarioTag:null, qa:[], currentQaIndex:0, // 업무 유형이 인식되면 질문(question)+답변(answer) 목록으로 통화를 진행한다
    endedAt:null, report:null, followups:[],
    extractedFields:{}, finalFields:{}, relayText:'', // 통화완료 시 채워지는 구조화 결과(원본 추출값/사용자 최종수정값 분리 보관)
    qaEditMode:false, procEditMode:false,
    qaOverviewOpen:false, procOpen:false, // 통화 중 화면: 전체 질문 목록/진행순서는 기본 접힘 (한 번에 하나씩 보여주기 위함)
    lastScript:null, lastMaterial:null, lastJurisdiction:null, lastScriptBlocks:[]
  };
}
function addPhoneNote(text){
  if(!phoneSession) phoneSession = newPhoneSession();
  const line = String(text||'').trim();
  if(!line) return;
  if(!phoneSession.notes.length) phoneSession.firstLine = line;
  phoneSession.notes.push({ text: line, intents: detectIntents(line) });
  const region = detectRegion(line); if(region) phoneSession.region = region;
  const site = detectSite(line); if(site) phoneSession.site = site;
  const company = detectCompany(line); if(company) phoneSession.company = company;
  detectIntents(line).forEach(tag => {
    if(!phoneSession.matchedIntents.includes(tag)) phoneSession.matchedIntents.push(tag);
  });
  // 업무 유형이 아직 확정되지 않았으면 다시 판별해본다(한 번 확정되면 답변을 잃지 않도록 다시 만들지 않는다)
  if(!phoneSession.scenarioTag){
    const tag = primaryBusinessTag(phoneSession.matchedIntents);
    if(tag){
      const questions = getPhoneQuestionSet(tag);
      if(questions.length){
        phoneSession.scenarioTag = tag;
        phoneSession.qa = questions.map(q => ({ id: uid(), label: q.label, question: q.question, answer: '', source: 'auto' }));
        phoneSession.currentQaIndex = 0;
      }
    }
  }
  persistActiveCall();
}
// 검색창 줄(notes) + 질문·답변(qa) + 자유 메모(rawMemo, 업무 유형 미인식 시)를 합친 전체 원문 — 요약/저장에 사용
function combinedRawMemo(s){
  const lines = s.notes.map(n => n.text);
  const qaLines = (s.qa||[]).filter(q => (q.answer||'').trim())
    .map(q => `${String(q.question||'').trim()} → ${q.answer.trim()}`);
  const extra = (s.rawMemo || '').split('\n').map(l => l.trim()).filter(Boolean);
  return [...lines, ...qaLines, ...extra].join('\n');
}

/* ---------- 통화 메모 임시 저장 (새로고침/실수 이동 대비, 저장 완료 전까지만 유지) ---------- */
const ACTIVE_CALL_STORAGE_KEY = 'work-guide-active-call-v1';
let activeCallSaveTimer = null;
function persistActiveCall(){
  if(!phoneSession) return;
  clearTimeout(activeCallSaveTimer);
  activeCallSaveTimer = setTimeout(() => {
    try{ localStorage.setItem(ACTIVE_CALL_STORAGE_KEY, JSON.stringify(phoneSession)); }
    catch(e){}
  }, 300);
}
function clearActiveCallStorage(){
  clearTimeout(activeCallSaveTimer);
  try{ localStorage.removeItem(ACTIVE_CALL_STORAGE_KEY); }catch(e){}
}
function restoreActiveCall(){
  try{
    const raw = localStorage.getItem(ACTIVE_CALL_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    const hasAnsweredQa = Array.isArray(parsed?.qa) && parsed.qa.some(q => (q.answer||'').trim());
    if(parsed && (parsed.notes?.length || (parsed.rawMemo || '').trim() || parsed.endedAt || hasAnsweredQa)) return parsed;
  }catch(e){}
  return null;
}
phoneSession = restoreActiveCall(); // 페이지를 새로 열었을 때 저장 전 통화 메모가 있으면 그대로 복구

function findPhoneProcedure(){
  const tags = phoneSession.matchedIntents;
  if(!tags.length) return null;
  let best = null, bestScore = 0;
  state.guides.forEach(g => {
    const haystack = `${g.tag||''} ${g.title||''} ${g.steps.map(s=>s.label).join(' ')}`;
    const score = tags.filter(tag => textIncludesAny(haystack, [tag])).length;
    if(score > bestScore){ bestScore = score; best = g; }
  });
  return best;
}
function findPhoneMaterial(){
  const tags = phoneSession.matchedIntents;
  for(const tag of [...tags].reverse()){
    const hit = state.materials.find(m => textIncludesAny(m.name, [tag]));
    if(hit) return hit;
  }
  return null;
}

/* ---------- 업무 유형(시나리오) 판별 ----------
   "견적문의" 같은 업무 유형이 인식되면, 여러 곳에 흩어져 있는 기존 데이터(가이드 단계/전화 메모/
   가이드 메모/자주 쓰는 멘트)를 전부 모아 하나의 시나리오로 묶는다. 새 문장/새 절차는 절대 만들지 않고,
   저장된 텍스트를 "말할 문장(문장부호·따옴표로 끝남)"과 "확인 항목(짧은 라벨)"으로만 재배치한다. */
const BUSINESS_TYPE_TAGS = ['견적','체결','시방서','공법설명회','자료요청','특허','현장등록','질문서'];
const BUSINESS_TYPE_LABEL = {
  '견적':'견적문의', '체결':'체결문의', '시방서':'시방서', '공법설명회':'공법설명회',
  '자료요청':'자료요청', '특허':'특허문의', '현장등록':'현장등록', '질문서':'질문서'
};
function primaryBusinessTag(matchedIntents){
  for(let i = matchedIntents.length - 1; i >= 0; i--){
    if(BUSINESS_TYPE_TAGS.includes(matchedIntents[i])) return matchedIntents[i];
  }
  return null;
}

/* ---------- 업무유형별 구조화 필드 스키마 (통화완료 결과 정리용) ----------
   key는 의미별 공통 이름(전달용 문구 자동 생성에 사용), label은 화면/저장에 실제로 보여줄 한글 이름이다.
   core:true 인 필드만 값이 비어 있을 때 [미확인] 배지를 보여준다. 그 외 빈 필드는 그냥 숨긴다. */

/* ---------- 업무유형별 질문 세트 (state.phoneQuestionSets[tag]) ----------
   최초 1회, 그 업무유형이 처음 인식됐을 때만 buildIntentQuestions() 결과로 시드하고
   이후에는 절대 자동으로 덮어쓰지 않는다(사용자가 [질문 편집]으로 직접 관리). */
// 업무 가이드/멘트에 아직 등록된 문장이 없는 업무유형(tag)을 위한 기본 질문 문구.
// 필드 스키마(PHONE_FIELD_SCHEMA)의 각 항목을 실제로 전화로 여쭤볼 수 있는 자연스러운 문장으로 바꾼 것뿐이며,
// 새 사실을 지어내지 않는다(그저 "무엇을 물어봐야 하는지" 안내 문구).
const PHONE_QUESTION_TEXT_BY_KEY = {
  subject:'어느 아파트/현장에서 전화주셨을까요?', subject2:'어느 업체에서 전화주셨을까요?',
  role:'전화주신 분 성함이 어떻게 되실까요?', position:'직책이 어떻게 되실까요?',

  location:'현장 주소가 어떻게 되실까요?', topic:'어떤 공종 관련 문의이실까요?',
  scale:'공사 면적/규모가 어느 정도 되실까요?', status:'현재 현장 상황이 어떻게 되시나요?',
  request:'어떤 부분을 요청하시나요?', material:'필요하신 자료가 있으실까요?',
  source:'저희를 어떻게 알고 연락주셨을까요?', schedule:'PT 일정이 어떻게 되실까요?',
  equipment:'빔프로젝터는 준비되어 있을까요?', order:'발표 순서는 어떻게 진행될까요?',
  competitor:'경쟁사도 참여하시나요?', qna:'질의응답 시간은 얼마나 필요하실까요?',
  meeting:'미팅 관련 요청사항이 있으실까요?'
};
function defaultQuestionsForTag(tag){
  return phoneFieldSchemaFor(tag).map(f => ({ label: f.label, question: PHONE_QUESTION_TEXT_BY_KEY[f.key] || `${f.label}을(를) 확인해주세요.` }));
}
function getPhoneQuestionSet(tag){
  if(!state.phoneQuestionSets) state.phoneQuestionSets = {};
  if(!state.phoneQuestionSets[tag]){
    let questions = buildIntentQuestions(tag).map(q => ({ id: uid(), label:q.label, question:q.question }));
    if(!questions.length) questions = defaultQuestionsForTag(tag).map(q => ({ id: uid(), label:q.label, question:q.question }));
    state.phoneQuestionSets[tag] = questions;
    saveState();
  }
  return state.phoneQuestionSets[tag];
}

/* ---------- 업무유형별 진행순서 세트 (state.phoneProcedureSets[tag]) ----------
   각 태그는 독립된 배열로 보관되어 서로 영향을 주지 않는다. 최초 1회만 시드한다. */
const PHONE_PROCEDURE_DEFAULTS = {
  '견적':      ['시공사/아파트 파악', '문의내용 확인', '토픽방 등록', '담당자 전달'],
  '체결':      ['업체/담당자 확인', '협약 내용 확인', '질문서 발송 여부 확인', '담당자 전달'],
  '시방서':    ['요청 자료 확인', '자료 위치 확인', '자료 발송', '담당자 전달'],
  '공법설명회': ['일정 확인', '참석 인원/장소 확인', '발표자료 준비', '담당자 전달'],
};
function getPhoneProcedureSet(tag){
  if(!state.phoneProcedureSets) state.phoneProcedureSets = {};
  if(!state.phoneProcedureSets[tag]){
    const guide = findPhoneProcedure();
    let steps = (guide && guide.steps && guide.steps.length) ? guide.steps.map(st=>st.label) : null;
    if(!steps || !steps.length) steps = PHONE_PROCEDURE_DEFAULTS[tag] || ['문의내용 확인', '담당자 전달'];
    state.phoneProcedureSets[tag] = steps.map(t => ({ id: uid(), text: t }));
    saveState();
  }
  return state.phoneProcedureSets[tag];
}

   AI는 opt-in 강화일 뿐이며, 결정론적 결과가 항상 먼저(기본값으로) 만들어진다. */
const PHONE_FIELD_KEYWORDS = {

  status:['현장상황','현장 상황','진행상황'], request:['요청사항','요청내용','견적요청','협약문의','협약문의 내용'],
  material:['자료요청','필요자료','질문서','질문서 발송'], source:['유입경로','경로'],
  schedule:['pt 일정','일정'], equipment:['빔프로젝터'], order:['발표순서'], competitor:['경쟁사'], qna:['질의응답'],
  meeting:['미팅']
};
function extractFieldsDeterministic(s){
  const tag = s.scenarioTag;
  const schema = phoneFieldSchemaFor(tag);
  const fields = {};
  // 1) 질문 라벨/문장이 필드명과 직접 일치하는 답변을 최우선으로 사용한다(사용자가 직접 답한 값이므로 신뢰도가 가장 높음)
  (s.qa||[]).forEach(q => {
    const ans = (q.answer||'').trim();
    if(!ans) return;
    const hay = `${q.label||''} ${q.question||''}`;
    const matched = schema.find(f => !fields[f.key] && textIncludesAny(hay, PHONE_FIELD_KEYWORDS[f.key] || [f.label]));
    if(matched) fields[matched.key] = ans;
  });
  // 2) 한 답변에 여러 사실이 섞여 있어도(예: "관리소장이고 010-.... 재도장 예정") 텍스트 전체에서 추가로 채굴한다.
  //    이미 채워진 필드는 덮어쓰지 않는다(1번 결과가 항상 우선).
  const allText = [ ...(s.qa||[]).map(q=>q.answer), s.rawMemo||'', ...(s.notes||[]).map(n=>n.text) ].filter(Boolean).join(' \n ');
  mineFieldsFromText(allText, schema, fields, s);
  return fields;
}
function mineFieldsFromText(text, schema, fields, s){
  const has = k => schema.some(f=>f.key===k);
  if(has('contact') && !fields.contact){
    const m = text.match(/01[016789]-?\d{3,4}-?\d{4}/);
    if(m) fields.contact = m[0];
  }
  if(has('email') && !fields.email){
    const m = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
    if(m) fields.email = m[0];
  }
  if(has('position') && !fields.position){
    const POS = ['관리소장','소장','대표','팀장','과장','부장','이사','담당자','대리','차장','상무','전무'];
    const found = POS.find(p => text.includes(p));
    if(found) fields.position = found;
  }
  if(has('topic') && !fields.topic){
    const WORK = ['재도장','도장','방수','석재','타일','미장','철근','콘크리트','조적','단열','누수보수','도색','옥상방수'];
    const found = WORK.find(w => text.includes(w));
    if(found) fields.topic = found;
  }
  if(has('subject') && !fields.subject){
    if(s && s.site && s.site.name) fields.subject = s.site.name;
    else { const m = text.match(/([가-힣0-9]{2,14}(?:아파트|APT|apt))/); if(m) fields.subject = m[1]; }
  }
  if(has('subject2') && !fields.subject2 && s && s.company && s.company.name) fields.subject2 = s.company.name;
  if(has('scale') && !fields.scale){
    const m = text.match(/약?\s?[\d,.]+\s?(?:㎡|평|m2|m²)/);
    if(m) fields.scale = m[0].trim();
  }
  if(has('status') && !fields.status){
    const m = text.match(/(내년|올해|내달|다음달|이번달|당장|조만간|이번 겨울|내년경)[^,.\n]{0,20}(예정|검토중|검토 중|계획)?/);
    if(m) fields.status = m[0].trim();
  }
}
async function extractFieldsAI(apiKey, s){
  const tag = s.scenarioTag;
  const schema = phoneFieldSchemaFor(tag);
  try{
    const qaText = (s.qa||[]).filter(q=>(q.answer||'').trim())
      .map(q => `${q.question || q.label}: ${q.answer}`).join('\n');
    if(!qaText.trim()) return {};
    const keys = schema.map(f => `${f.key}(${f.label})`).join(', ');
    const prompt = `다음은 전화 통화 질문과 답변이다. 아래 필드 중 통화 내용에 실제로 언급된 사실만 뽑아 JSON으로 만들어줘: ${keys}\n\n${qaText}\n\n규칙: 언급되지 않은 필드는 절대 넣지 마. 사실을 지어내지 마. JSON 객체만 출력해(다른 설명 금지).`;
    const raw = await callOpenAI(apiKey, prompt);
    const m = raw.match(/\{[\s\S]*\}/);
    if(!m) return {};
    const parsed = JSON.parse(m[0]);
    const out = {};
    schema.forEach(f => { const v = parsed[f.key]; if(v && String(v).trim()) out[f.key] = String(v).trim(); });
    return out;
  }catch(err){ console.error('[AI 필드 추출 실패]', err); return {}; }
}

/* ---------- 전달용 문구(회사 메신저용) 자동 생성 — 구조화 필드에 실제로 채워진 값만 사용한다 ---------- */
function buildRelayText(tag, fields){
  const typeLabel = BUSINESS_TYPE_LABEL[tag] || '업무';
  const subj = fields.subject || fields.subject2 || '';
  const roleSuffix = fields.position ? ` ${fields.position}님께서` : (subj ? ' 측에서' : '');
  const who = subj ? `${subj}${roleSuffix}` : (fields.role ? `${fields.role}님께서` : '문의주신 분께서');
  const paras = [];
  paras.push(`${who} ${fields.topic ? fields.topic + ' ' : ''}${typeLabel} 관련하여 문의주셨습니다.`);

  const locScale = [];
  if(fields.location) locScale.push(`현장은 ${fields.location}이며,`);
  if(fields.scale) locScale.push(`${fields.location ? '' : '현장 규모는 '}${fields.location ? '공사 면적은 약 ' : '약 '}${fields.scale}입니다.`);
  if(locScale.length) paras.push(locScale.join('\n'));

  const statusReq = [];
  if(fields.status) statusReq.push(`${fields.status}으로 공사를 검토 중이며,`);
  if(fields.request) statusReq.push(`${fields.request}을(를) 요청하셨습니다.`);
  if(statusReq.length) paras.push(statusReq.join('\n'));

  if(fields.material) paras.push(`추가로 ${fields.material} 자료도 요청하셨습니다.`);
  if(fields.source) paras.push(`유입경로는 ${fields.source}입니다.`);
  if(fields.schedule) paras.push(`PT 일정은 ${fields.schedule}입니다.`);
  if(fields.equipment) paras.push(`빔프로젝터: ${fields.equipment}`);
  if(fields.order) paras.push(`발표순서: ${fields.order}`);
  if(fields.competitor) paras.push(`경쟁사: ${fields.competitor}`);
  if(fields.qna) paras.push(`질의응답시간: ${fields.qna}`);
  if(fields.meeting) paras.push(`미팅 요청: ${fields.meeting}`);
  if(fields.email) paras.push(`이메일: ${fields.email}`);
  if(fields.contact) paras.push(`연락처는 ${fields.contact}입니다.`);
  return paras.join('\n\n');
}
function buildStructuredText(tag, fields){
  const schema = phoneFieldSchemaFor(tag);
  const lines = ['통화 접수 정리', `문의유형 : ${BUSINESS_TYPE_LABEL[tag] || tag || '-'}`];
  schema.forEach(f => {
    const v = (fields[f.key]||'').trim();
    if(v) lines.push(`${f.label} : ${v}`);
    else if(f.core) lines.push(`${f.label} : [미확인]`);
  });
  return lines.join('\n');
}
// 말하는 문장처럼 보이는 줄(따옴표로 감싸져 있거나 문장부호로 끝남)만 골라낸다
function splitSpokenLines(body){
  return String(body||'').split('\n').map(l=>l.trim()).filter(Boolean)
    .filter(l => /["“”]|[.?!]$/.test(l));
}
// 짧은 확인 항목/체크리스트처럼 보이는 줄(문장부호로 끝나지 않는 짧은 라벨)만 골라낸다
function splitChecklistLines(body){
  return String(body||'').split('\n').map(l=>l.trim()).filter(Boolean)
    .filter(l => !/["“”]|[.?!]$/.test(l));
}
// 짧은 진행순서 라벨(전체 목록 미리보기용). 새 문구를 만들지 않고 실제 문장을 그대로 잘라서 쓴다.
function shortLabel(text){
  const t = String(text||'').replace(/^["“]+|["”]+$/g,'').trim();
  return t.length > 16 ? t.slice(0,16) + '…' : t;
}
// 업무 유형(tag)에 해당하는 "질문" 목록을 만든다. 각 항목은 {label(진행순서용 짧은 라벨), question(그대로
// 읽을 전화대본 문장)}이다. 하드코딩된 질문이 아니라 매번 현재 state에서 다시 계산하므로, 업무지식
// (가이드 단계/전화 메모/가이드 메모/자주 쓰는 멘트)을 나중에 추가하면 다음 통화부터 자동으로 반영된다.
// 문장 자체도 지어내지 않는다: 저장된 전화 메모(phoneNote)·말하는 문장을 우선 쓰고, 그런 문장이 없는
// 항목은 저장된 단계 라벨/체크리스트 문구를 그대로 질문 자리에 사용한다.
function buildIntentQuestions(tag){
  const items = [];
  const seen = new Set();
  function addItem(label, question){
    const q = String(question || label || '').trim();
    const key = q.replace(/\s+/g,'');
    if(q && !seen.has(key)){ seen.add(key); items.push({ label: String(label || q).trim(), question: q }); }
  }
  state.guides.forEach(g => {
    const guideMatches = textIncludesAny(`${g.tag||''} ${g.title||''}`, [tag]);
    g.steps.forEach(st => {
      if(guideMatches || textIncludesAny(st.label, [tag])){
        const q = st.hasPhone && (st.phoneNote||'').trim() ? st.phoneNote.trim() : st.label;
        addItem(st.label, q);
      }
    });
    g.blocks.forEach(b => {
      if(textIncludesAny(b.body, [tag])){
        splitSpokenLines(b.body).forEach(t => addItem(shortLabel(t), t));
        splitChecklistLines(b.body).forEach(t => addItem(t, t));
      }
    });
  });
  state.phrases.forEach(p => {
    if(!textIncludesAny(`${p.title} ${p.body}`, [tag])) return;
    const says = splitSpokenLines(p.body);
    const checks = splitChecklistLines(p.body);
    says.forEach(t => addItem(shortLabel(t), t));
    checks.forEach(t => addItem(t, t));
    if(!says.length && !checks.length) addItem(shortLabel(p.body), p.body);
  });
  return items;
}
// 업무 유형별로 진행된 질문/답변을 자연스러운 업무 전달 문구로 정리한다(사실은 절대 바꾸지 않고,
// 답변이 있는 항목만 사용한다 — 빈 답변에 "미확인"처럼 억지 문구를 채우지 않는다).
function buildScenarioSummary(s){
  const who = s.company ? s.company.name : s.site ? s.site.name : (s.firstLine || '고객');
  const typeLabel = BUSINESS_TYPE_LABEL[s.scenarioTag] || '';
  const answered = (s.qa||[]).filter(q => (q.answer||'').trim());
  const lines = [`${who}${/님$/.test(who) ? '' : ' 측'}에서${typeLabel ? ' ' + typeLabel + ' 관련하여' : ''} 전화 문의주셨습니다.`];
  if(answered.length){
    lines.push('');
    answered.forEach(q => {
      const qText = String(q.question||'').replace(/^["“]+|["”]+$/g,'').replace(/[.?!]+$/,'').trim();
      lines.push(qText ? `${qText} → ${q.answer.trim()}` : q.answer.trim());
    });
  }
  return lines.join('\n');
}

// "지금 말할 내용"을 대화형 대본(말할 문장 → 확인 항목 → 다음 말할 문장 …)으로 구성한다.
// 새 문장을 지어내지 않고, 기존에 저장된 데이터만 순서대로 엮는다:
//   - 여는 문장: 기존 자주 쓰는 멘트/가이드 메모 중 매칭되는 것(기존 findScriptForTags 그대로 재사용)
//   - 확인 항목 + 그다음 말할 문장: 매칭된 업무 순서(가이드)의 각 단계 라벨 + 그 단계에 이미 저장돼 있는
//     전화 메모(step.phoneNote, 기존 "전화 메모" 기능으로 사용자가 직접 적어둔 문장)
// 저장된 phoneNote가 없는 단계는 확인 항목만 보여주고 문장을 지어내지 않는다.
function buildPhoneScript(s, openingScript, procedure){
  const blocks = [];
  if(openingScript) blocks.push({ type:'say', text: openingScript.body });
  if(procedure){
    procedure.steps.forEach(st => {
      blocks.push({ type:'check', items:[st.label] });
      if(st.hasPhone && (st.phoneNote || '').trim()){
        blocks.push({ type:'say', text: st.phoneNote.trim() });
      }
    });
  }
  return blocks;
}

function buildPhoneCallReport(s){
  // 업무 유형(질문/답변) 흐름으로 진행된 통화는 답변 기반 요약을 우선 사용한다
  if(s.scenarioTag && (s.qa||[]).length) return buildScenarioSummary(s);

  const who = s.company ? s.company.name : s.site ? s.site.name : (s.firstLine || '상대방');
  const lines = [`${who}${/님|소장|담당자|과장|부장|팀장|대표$/.test(who) ? '' : ' 관계자'}께서 전화 문의주셨습니다.`, ''];
  const seen = new Set();
  const SUMMARY_TEXT = {
    '체결':'협약(체결) 관련 문의를 주셨습니다.',
    '시방서':'시방서 자료를 요청하셨습니다.',
    '공법설명회':'공법설명회 관련 문의를 주셨습니다.',
    '자료요청':'관련 자료를 요청하셨습니다.',
    '담당자':'담당자 확인을 요청하셨습니다.',
    '견적':'견적 문의를 주셨습니다.',
    '특허':'특허 관련 문의를 주셨습니다.',
    '현장등록':'현장등록 관련 문의를 주셨습니다.',
    '질문서':'질문서 관련 문의를 주셨습니다.'
  };
  s.matchedIntents.forEach(tag => {
    if(seen.has(tag) || !SUMMARY_TEXT[tag]) return;
    seen.add(tag);
    lines.push(SUMMARY_TEXT[tag]);
  });
  if(lines.length === 2) lines.push('세부 문의 내용은 아래 통화 메모를 참고해주세요.');
  const memo = combinedRawMemo(s);
  if(memo){
    lines.push('', '[통화 메모]');
    memo.split('\n').forEach(l => lines.push(`- ${l}`));
  }
  return lines.join('\n');
}
function buildPhoneFollowups(s){
  const out = [];
  const tags = s.matchedIntents;
  if(tags.some(t => MATERIAL_REQUEST_TAGS.includes(t))){
    const m = findPhoneMaterial();
    out.push({ text: m ? `${m.name} 발송 필요` : '요청 자료 발송 필요 (자료 위치 확인 필요)', status:'material', materialId: m?m.id:null });
  }
  if(tags.includes('담당자') && !(s.region && state.jurisdictions.find(j=>j.region===s.region))){
    out.push({ text:'담당자 확인 필요', status:'contactcheck' });
  }
  if(tags.includes('견적')) out.push({ text:'견적 확인 필요', status:'unhandled' });
  if(tags.includes('체결')) out.push({ text:'체결 진행 상황 콜백 필요', status:'callback' });
  return out;
}

async function polishPhoneReport(apiKey){
  const s = phoneSession;
  if(!s || !s.report) return;
  try{
    showToast('AI로 다듬는 중...');
    const prompt = `아래는 전화 통화 내용을 정리한 업무 전달 문구 초안이야. 사실 내용을 절대 바꾸거나 추가하지 말고, 회사 메신저로 담당자에게 바로 전달할 수 있는 간단하고 자연스러운 문체로 다듬어줘. 지나치게 공식적인 보고서 문체로 만들지 마.\n\n${s.report}\n\n다듬은 문구만 출력해.`;
    const result = await callOpenAI(apiKey, prompt);
    if(result){ s.report = result; render(); }
  }catch(err){ console.error(err); showToast('AI 다듬기에 실패했습니다'); }
}

// [저장] — 검토(수정)까지 끝난 통화 기록을 확정 저장한다. rawMemo(원문)/summary(정리본)/followUps(후속업무)를
// 분리해서 그대로 기록하고, 업체/현장이 인식됐으면 기존 ID로 연결한다. 저장 전까지는 임시 데이터만 존재한다.
function savePhoneCallLog(){
  const s = phoneSession;
  if(!s || !s.endedAt) return;
  state.callLogs.push({
    id: uid(),
    at: Date.now(),
    companyId: s.company ? s.company.id : null,
    companyName: s.company ? s.company.name : '',
    siteId: s.site ? s.site.id : null,
    siteName: s.site ? s.site.name : '',
    firstLine: s.firstLine || '',
    scenarioTag: s.scenarioTag || null,
    searchQuery: s.notes.length ? s.notes[0].text : (s.firstLine || ''), // 원래 검색어
    qa: (s.qa||[]).map(q => ({ question: q.question, answer: q.answer })), // 질문 목록 + 각 질문별 원본 답변 (AI가 절대 덮어쓰지 않음)
    rawMemo: combinedRawMemo(s),   // 사용자가 입력한 원문 그대로 (AI가 절대 덮어쓰지 않음)
    summary: s.report || '',       // 정리본(사용자가 수정한 최종본, 업무유형 미인식 통화만 사용)
    extractedFields: s.extractedFields || {}, // AI/결정론적 로직이 추출한 구조화 필드(원본)
    finalFields: s.finalFields || {},         // 사용자가 수정한 최종 구조화 필드
    relayText: s.relayText || '',             // 전달용 문구
    followUps: s.followups.map(f => f.text).filter(Boolean)
  });
  saveState();
  clearActiveCallStorage();
  showToast('통화 내용이 저장되었습니다.');
  phoneSession = newPhoneSession();
  render();
}

// 전화 비서 "본체"(통화 입력창 + 결과 카드) — 홈 화면과 전화 비서 전체 화면이 동일하게 재사용한다.
// 로직/데이터는 전혀 바뀌지 않고, 어디에 배치되느냐만 다르다.
function renderPhoneAssistantCore(){
  if(!phoneSession) phoneSession = newPhoneSession();
  const s = phoneSession;
  if(s.endedAt) return renderPhoneCallEndedCore(s);

  // §1 검색 전: 전화가 오면 들은 내용을 짧게 입력하는 한 줄 입력창 + 빠른 유형 선택 칩만 보여준다
  // (대본/질문/진행순서/담당자/자료/통화완료는 전부 숨김 — "통화 시작" 전까지는 최대한 미니멀하게)
  const preSearch = !s.notes.length && !s.scenarioTag && !s.company && !s.site && !s.region;
  if(preSearch){
    return `
      <div class="card pa-callbar">
        <form class="inline-form" data-pa-form="add-note">
          <input type="text" id="paInput" placeholder="전화가 오면 들은 내용을 짧게 입력하세요 (예: 견적 문의인데 ○○아파트 관리소장님)" autocomplete="off" />
          <button type="submit">통화 시작 →</button>
        </form>
        <div class="pa-quick-chips">
          ${PHONE_QUICK_TYPES.map(t => `<button type="button" class="pa-quick-chip" data-pa-action="quick-select" data-text="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
        </div>
      </div>
    `;
  }

  const counterpart = s.company ? `🏢 ${escapeHtml(s.company.name)}`
    : s.site ? `🏠 ${escapeHtml(s.site.name)}`
    : s.firstLine ? escapeHtml(s.firstLine)
    : '통화 상대 미확인';

  const script = findScriptForTags(s.matchedIntents);
  const procedure = findPhoneProcedure();
  const material = findPhoneMaterial();
  const wantsMaterial = s.matchedIntents.some(t => MATERIAL_REQUEST_TAGS.includes(t));
  const jurisdiction = s.region ? (state.jurisdictions.find(j=>j.region===s.region) || 'missing') : null;
  // "견적문의"처럼 업무 유형이 뚜렷하게 인식되면 질문(question)+답변(answer) 목록으로 통화를 진행한다.
  // 업무 유형이 뚜렷하지 않을 때만 기존 대화형 대본(buildPhoneScript)으로 대체 표시한다.
  const hasQaScenario = !!(s.scenarioTag && s.qa.length);
  const checkSteps = (procedure && !hasQaScenario) ? procedure.steps.filter(st => /확인/.test(st.label)) : [];
  const scriptBlocks = hasQaScenario ? [] : buildPhoneScript(s, script, procedure);
  const procSteps = hasQaScenario ? getPhoneProcedureSet(s.scenarioTag) : [];
  const typeLabel = hasQaScenario ? (BUSINESS_TYPE_LABEL[s.scenarioTag] || s.scenarioTag) : '';

  s.lastScript = script;
  s.lastMaterial = material;
  s.lastJurisdiction = (jurisdiction && jurisdiction !== 'missing') ? jurisdiction : null;
  s.lastScriptBlocks = scriptBlocks;

  const nothingYet = !hasQaScenario && !script && !procedure && !material && !wantsMaterial && !s.region && !s.company && !s.site;

  // §11 우선순위: 지금 말할 질문(집중) > 답변 입력 > 다음 질문 > 통화 메모(측면, 항상 작게) > 담당자(작게) > 진행순서(접힘)
  // 질문형 시나리오가 인식된 경우, 전체를 한 번에 나열하지 않고 "지금 이 질문 하나"만 크게 보여준다.
  if(hasQaScenario){
    const total = s.qa.length;
    const idx = Math.min(Math.max(s.currentQaIndex||0, 0), total-1);
    const q = s.qa[idx];
    s.currentQaIndex = idx;
    const answeredCount = s.qa.filter(item => (item.answer||'').trim()).length;

    const focusHtml = `
      <div class="card pa-qa-focus">
        <div class="pa-qa-focus-head">${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
        ${s.qaEditMode ? `
          <input type="text" class="pa-qa-question-input" data-qa-id="${q.id}" placeholder="질문 문장 (예: 어느 아파트에서 전화주셨을까요?)" value="${escapeHtml(q.question)}" style="width:100%;box-sizing:border-box;margin-bottom:10px;" />
          <input type="text" class="pa-qa-label-input" data-qa-id="${q.id}" placeholder="라벨 (진행순서용 짧은 이름)" value="${escapeHtml(q.label)}" style="width:100%;box-sizing:border-box;padding:9px 11px;border-radius:8px;border:1px solid var(--card-border);font-family:inherit;font-size:13px;margin-bottom:14px;" />
          <div style="display:flex;gap:8px;">
            <button type="button" class="icon-btn" data-pa-action="qa-up" data-id="${q.id}" title="위로">↑</button>
            <button type="button" class="icon-btn" data-pa-action="qa-down" data-id="${q.id}" title="아래로">↓</button>
            <button type="button" class="icon-btn danger" data-pa-action="qa-delete" data-id="${q.id}" title="이 질문 삭제">✕</button>
          </div>
        ` : `
          <div class="pa-qa-focus-question">"${escapeHtml(q.question)}"</div>
          <div class="pa-qa-focus-answer-label">답변</div>
          <input type="text" class="pa-qa-answer pa-qa-focus-answer" data-qa-id="${q.id}" placeholder="답변 입력 (짧은 단어만 입력해도 됩니다)" value="${escapeHtml(q.answer)}" autocomplete="off" />
          ${script ? `
            <div class="pa-qa-focus-guide">
              <div class="pa-qa-focus-guide-label">안내</div>
              <div class="pa-qa-focus-guide-text">"${escapeHtml(script.body)}"</div>
            </div>
          ` : ''}
          <div class="pa-qa-focus-actions">
            ${idx>0 ? `<button type="button" class="btn btn-ghost" data-pa-action="qa-prev">← 이전</button>` : ''}
            <button type="button" class="btn btn-primary" data-pa-action="qa-next">${idx<total-1 ? '다음 질문 →' : '마지막 질문'}</button>
          </div>
        `}
      </div>
      <div class="pa-qa-links">
        <button type="button" class="link-btn" data-pa-action="qa-overview-toggle">${s.qaOverviewOpen ? '전체 질문 접기' : '전체 질문 보기'}</button>
        <button type="button" class="link-btn" data-pa-action="qa-edit-toggle">${s.qaEditMode ? '편집 완료' : '질문 편집'}</button>
      </div>
      ${(s.qaOverviewOpen || s.qaEditMode) ? `
        <div class="card pa-qa-overview-card">
          ${s.qaEditMode ? `
            ${s.qa.map((item,i) => `
              <div class="pa-qa-ov-row ${i===idx?'current':''}" style="cursor:default;">
                <span class="pa-qa-ov-mark">${String(i+1).padStart(2,'0')}</span>
                <span class="pa-qa-ov-label">${escapeHtml(item.label || item.question || '(빈 질문)')}</span>
                <button type="button" class="link-btn" data-pa-action="qa-jump" data-index="${i}">이동</button>
              </div>
            `).join('')}
            <button type="button" class="pa-qa-add" data-pa-action="qa-add">+ 질문 추가</button>
          ` : `
            <div class="pa-qa-overview" style="margin-bottom:0;">
              ${s.qa.map((item,i) => {
                const answered = (item.answer||'').trim();
                const cls = answered ? 'answered' : (i===idx ? 'current' : '');
                const mark = answered ? '✓' : (i===idx ? '●' : '○');
                return `
                  <button type="button" class="pa-qa-ov-row ${cls}" data-pa-action="qa-jump" data-index="${i}">
                    <span class="pa-qa-ov-mark">${mark}</span>
                    <span class="pa-qa-ov-label">${escapeHtml(item.label || item.question || '질문')}</span>
                    ${answered ? `<span class="pa-qa-ov-current-tag">${escapeHtml(item.answer)}</span>` : (i===idx ? `<span class="pa-qa-ov-current-tag">입력 중</span>` : '')}
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>
      ` : ''}
    `;

    const materialHtml = (material || wantsMaterial) ? `
      <div class="pa-contact-line">
        <span>📎</span>
        ${material ? `<strong>${escapeHtml(material.name)}</strong><span>· ${escapeHtml(material.location)}</span><button type="button" class="link-btn" data-pa-action="copy-material">복사</button>`
          : `<span class="pa-missing">등록된 자료 없음 — 확인 필요</span>`}
      </div>
    ` : '';

    const jurisdictionHtml = s.region ? `
      <div class="pa-contact-line">
        <span>📍</span>
        ${s.lastJurisdiction ? `
          <strong>${escapeHtml(s.lastJurisdiction.manager||'담당자 미등록')}</strong>
          <span>${s.lastJurisdiction.branch ? escapeHtml(s.lastJurisdiction.branch) + ' · ' : ''}${escapeHtml(s.lastJurisdiction.phone||'-')}</span>
          ${s.lastJurisdiction.phone ? `<button type="button" class="link-btn" data-pa-action="copy-jurisdiction-phone">복사</button>` : ''}
        ` : `<span class="pa-missing">등록된 담당자 정보 없음 (${escapeHtml(s.region)})</span>`}
      </div>
    ` : '';

    const procHtml = `
      <div class="pa-collapse">
        <button type="button" class="pa-collapse-toggle" data-pa-action="proc-section-toggle">통화 후 처리 &nbsp;${s.procOpen ? '펼쳐보기 ▲' : '펼쳐보기 ▼'}</button>
        ${s.procOpen ? `
          <div class="card-head" style="margin-bottom:6px;">
            <div></div>
            <button type="button" class="copy-btn" data-pa-action="proc-edit-toggle">${s.procEditMode ? '편집 완료' : '진행순서 편집'}</button>
          </div>
          ${s.procEditMode ? `
            ${procSteps.map((p,i) => `
              <div class="pa-proc-edit-row">
                <span class="pa-qa-block-num">${String(i+1).padStart(2,'0')}</span>
                <input type="text" class="pa-proc-input" data-proc-id="${p.id}" value="${escapeHtml(p.text)}" style="flex:1;" />
                <button type="button" class="icon-btn" data-pa-action="proc-up" data-id="${p.id}" title="위로">↑</button>
                <button type="button" class="icon-btn" data-pa-action="proc-down" data-id="${p.id}" title="아래로">↓</button>
                <button type="button" class="icon-btn danger" data-pa-action="proc-delete" data-id="${p.id}" title="삭제">✕</button>
              </div>
            `).join('') || '<div class="empty-state" style="padding:8px 0;">등록된 진행순서가 없습니다</div>'}
            <button type="button" class="pa-qa-add" data-pa-action="proc-add">+ 항목 추가</button>
          ` : `
            <div class="steps-row" style="margin-bottom:0;">
              ${procSteps.map((p,i) => `
                ${i>0?'<span class="step-arrow">→</span>':''}
                <span class="step-chip"><span class="step-num">${String(i+1).padStart(2,'0')}</span>${escapeHtml(p.text)}</span>
              `).join('') || '<span class="empty-state" style="padding:0;">등록된 진행순서가 없습니다</span>'}
            </div>
          `}
        ` : ''}
      </div>
    `;

    const mainHtml = `
      <div class="card pa-callbar">
        <div class="pa-callbar-head">
          <div>
            <div class="pa-callbar-label">전화비서${typeLabel ? ' · ' + escapeHtml(typeLabel) : ''}</div>
            <div class="pa-callbar-who">${counterpart}</div>
          </div>
        </div>
        <div class="pa-progress">지금 확인할 내용 &nbsp;${answeredCount} / ${total}</div>
        ${s.notes.length ? `
          <div class="pa-notes-log">
            <div class="pa-notes-log-label">검색 기록</div>
            ${s.notes.map((n,i) => `
              <div class="pa-note-line">
                <span>· ${escapeHtml(n.text)}</span>
                <button type="button" class="pa-note-del" data-pa-action="note-delete" data-index="${i}" title="이 기록 삭제">✕</button>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
      ${focusHtml}
      ${materialHtml}
      ${jurisdictionHtml}
      ${procHtml}
    `;

    const sideHtml = `
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">📝 통화 메모</div>
        <textarea id="paRawMemo" class="pa-rawmemo" placeholder="자유롭게 메모…">${escapeHtml(s.rawMemo)}</textarea>
      </div>
    `;

    return `
      <div class="pa-call-layout">
        <div class="pa-call-main">${mainHtml}</div>
        <div class="pa-call-side">${sideHtml}</div>
      </div>
      <div class="pa-endcall-row">
        <button type="button" class="btn btn-primary" data-pa-action="end-call">통화 완료 및 정리</button>
      </div>
    `;
  }

  // 업무 유형이 뚜렷하게 인식되지 않은 통화(질문 세트가 없는 경우) — 기존 대본/절차 정보를 그대로 보여주되
  // 화면 비중은 최소화한다. 통화 메모는 마찬가지로 측면 패널로 보여준다.
  const mainHtml = `
    <div class="card pa-callbar">
      <div class="pa-callbar-head">
        <div>
          <div class="pa-callbar-label">전화비서</div>
          <div class="pa-callbar-who">${counterpart}</div>
        </div>
      </div>
      <form class="inline-form" data-pa-form="add-note" style="margin-top:14px;">
        <input type="text" id="paInput" placeholder="업체명 / 아파트명 / 문의내용을 입력하세요 (예: 부산 덕천주공1단지, 시방서, 체결 문의)" autocomplete="off" />
        <button type="submit">검색 / 시작</button>
      </form>
      ${s.notes.length ? `
        <div class="pa-notes-log">
          <div class="pa-notes-log-label">과거 기록</div>
          ${s.notes.map((n,i) => `
            <div class="pa-note-line">
              <span>· ${escapeHtml(n.text)}</span>
              <button type="button" class="pa-note-del" data-pa-action="note-delete" data-index="${i}" title="이 기록 삭제">✕</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>

    ${scriptBlocks.length ? `
      <div class="card highlight">
        <div class="card-head">
          <div class="card-title" style="margin:0;">🗣️ 지금 말할 내용</div>
          <div class="card-actions"><button class="copy-btn" data-pa-action="copy-script">📋 복사</button></div>
        </div>
        <div class="pa-script">
          ${scriptBlocks.map((b,i) => b.type === 'say' ? `
            <div class="pa-script-say">
              <div class="pa-script-say-label">${i===0 ? '내가 먼저 말할 내용' : '다음에 말할 내용'}</div>
              <div class="pa-script-say-text">${escapeHtml(b.text)}</div>
              <button class="copy-btn" data-pa-action="copy-script-line" data-index="${i}">📋 이 문장 복사</button>
            </div>
          ` : `
            <div class="pa-script-check">
              <div class="pa-script-check-label">확인할 순서</div>
              <div class="pa-script-check-items">${b.items.map(it => `<span>${escapeHtml(it)}</span>`).join('')}</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    ${procedure ? `
      <div class="pa-collapse">
        <button type="button" class="pa-collapse-toggle" data-pa-action="proc-section-toggle">통화 후 처리 — ${escapeHtml(procedure.title)} &nbsp;${s.procOpen ? '▲' : '▼'}</button>
        ${s.procOpen ? `
          <div class="steps-row" style="margin-bottom:0;">
            ${procedure.steps.map((st,i) => `
              ${i>0?'<span class="step-arrow">→</span>':''}
              <span class="step-chip"><span class="step-num">${String(i+1).padStart(2,'0')}</span>${escapeHtml(st.label)}</span>
            `).join('') || '<span class="empty-state" style="padding:0;">등록된 단계가 없습니다</span>'}
          </div>
        ` : ''}
      </div>
    ` : ''}

    ${(material || wantsMaterial) ? `
      <div class="pa-contact-line">
        <span>📎</span>
        ${material ? `<strong>${escapeHtml(material.name)}</strong><span>· ${escapeHtml(material.location)}</span><button type="button" class="link-btn" data-pa-action="copy-material">복사</button>`
          : `<span class="pa-missing">등록된 자료 없음 — 확인 필요</span>`}
      </div>
    ` : ''}

    ${s.region ? `
      <div class="pa-contact-line">
        <span>📍</span>
        ${s.lastJurisdiction ? `
          <strong>${escapeHtml(s.lastJurisdiction.manager||'담당자 미등록')}</strong>
          <span>${s.lastJurisdiction.branch ? escapeHtml(s.lastJurisdiction.branch) + ' · ' : ''}${escapeHtml(s.lastJurisdiction.phone||'-')}</span>
          ${s.lastJurisdiction.phone ? `<button type="button" class="link-btn" data-pa-action="copy-jurisdiction-phone">복사</button>` : ''}
        ` : `<span class="pa-missing">등록된 담당자 정보 없음 (${escapeHtml(s.region)})</span>`}
      </div>
    ` : ''}

    ${s.company ? `
      <div class="card">
        <div class="card-title">🏢 업체 정보 — ${escapeHtml(s.company.name)}</div>
        <div class="company-info-grid" style="border:none;padding:0;margin-bottom:0;">
          <div class="company-info-item"><span class="company-info-label">담당자</span><span class="company-info-val">${escapeHtml(s.company.contactName||'-')}</span></div>
          <div class="company-info-item"><span class="company-info-label">전화번호</span><span class="company-info-val">${escapeHtml(s.company.phone||'-')}</span></div>
          ${s.company.memo ? `<div class="company-info-item company-info-wide"><span class="company-info-label">기존 메모</span><span class="company-info-val">${escapeHtml(s.company.memo)}</span></div>` : ''}
        </div>
      </div>
    ` : ''}
    ${s.site ? `
      <div class="card">
        <div class="card-title">🏠 아파트/현장 정보 — ${escapeHtml(s.site.name)}</div>
        <div class="company-info-grid" style="border:none;padding:0;margin-bottom:0;">
          <div class="company-info-item"><span class="company-info-label">지역</span><span class="company-info-val">${escapeHtml(s.site.region||'-')}</span></div>
          ${s.site.memo ? `<div class="company-info-item company-info-wide"><span class="company-info-label">메모</span><span class="company-info-val">${escapeHtml(s.site.memo)}</span></div>` : ''}
        </div>
      </div>
    ` : ''}

    ${checkSteps.length ? `
      <div class="card">
        <div class="card-title">✅ 통화 중 확인해야 할 추가 항목</div>
        ${checkSteps.map(st => `<div class="pa-check-item">· ${escapeHtml(st.label)}</div>`).join('')}
      </div>
    ` : ''}

    ${nothingYet ? `<div class="empty-state">입력한 내용과 일치하는 저장된 정보가 아직 없습니다. 단어를 더 입력해보세요.</div>` : ''}
  `;

  const sideHtml = `
    <div class="card">
      <div class="card-title" style="margin-bottom:8px;">📝 통화 메모</div>
      <textarea id="paRawMemo" class="pa-rawmemo" placeholder="전화하면서 메모를 계속 입력하세요…">${escapeHtml(s.rawMemo)}</textarea>
    </div>
  `;

  return `
    <div class="pa-call-layout">
      <div class="pa-call-main">${mainHtml}</div>
      <div class="pa-call-side">${sideHtml}</div>
    </div>
    <div class="pa-endcall-row">
      <button type="button" class="btn btn-primary" data-pa-action="end-call">통화 완료 및 정리</button>
    </div>
  `;
}

// 전화 비서 전체 화면(사이드바 "전화 비서") — 위 본체에 제목과 참고 데이터 관리 패널만 덧붙인다.
function renderPhoneAssistantView(){
  return `
    <div class="view-topbar"><span class="crumb">TOOLS</span></div>
    <div class="view-header">
      <h1>📞 전화 비서</h1>
      <p>통화하면서 단어·짧은 문장만 입력해도 지금 필요한 정보를 바로 보여드립니다.</p>
    </div>
    ${renderPhoneAssistantCore()}
    <div class="card" style="margin-top:24px;">
      <div class="card-head"><div class="card-title" style="margin:0;">⚙️ 전화 비서 참고 데이터 관리</div></div>
      ${renderPhoneAdminPanel()}
    </div>
  `;
}

/* ==========================================================================
   홈 (사이트를 열면 가장 먼저 보이는 화면)
   순서: ① AI 문구수정 ② 처리할 업무 ③ 업무도구
   전부 기존 함수를 그대로 재사용해서 조합만 한다 — 새 로직/새 데이터 없음.

   ========================================================================== */
