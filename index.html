// §1 빠른 유형 선택 칩과 직접 입력 제출이 똑같은 흐름(addPhoneNote → 인식 → 렌더)을 타도록 공유한다
function submitPhoneNoteText(text){
  if(!String(text||'').trim()) return;
  addPhoneNote(text);
  render();
  requestAnimationFrame(()=>{ const el = document.getElementById('paInput'); if(el) el.focus(); });
}
contentEl.addEventListener('submit', (e)=>{
  const form = e.target.closest('[data-pa-form="add-note"]');
  if(!form) return;
  e.preventDefault();
  const input = form.querySelector('#paInput');
  const text = input.value;
  input.value = '';
  submitPhoneNoteText(text);
});

// 여러 줄 메모를 편하게 입력할 수 있도록 Enter는 항상 줄바꿈이고, Ctrl+Enter(또는 Cmd+Enter)로만 실행한다.
contentEl.addEventListener('keydown', (e)=>{
  if(e.target && e.target.id === 'aiNoteInput' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    triggerAiRewrite();
  }
});
// 질문 답변 입력 중 Enter를 누르면 [다음]과 동일하게 다음 질문으로 넘어간다
contentEl.addEventListener('keydown', (e)=>{
  if(e.target && e.target.matches && e.target.matches('.pa-qa-focus-answer') && e.key === 'Enter'){
    e.preventDefault();
    if(!phoneSession) return;
    phoneSession.currentQaIndex = Math.min(phoneSession.currentQaIndex + 1, phoneSession.qa.length - 1);
    persistActiveCall();
    render();
    requestAnimationFrame(()=>{
      const el = document.querySelector('.pa-qa-focus-answer');
      if(el) el.focus();
    });
  }
});

contentEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-pa-action]');
  if(!btn) return;
  const action = btn.dataset.paAction;
  if(action === 'quick-select'){
    // §1 빠른 유형 선택 칩: 그 문구를 직접 입력하고 제출한 것과 완전히 동일한 흐름(기존 통화 시작 로직)을 그대로 탄다
    submitPhoneNoteText(btn.dataset.text || '');
  } else if(action === 'qa-overview-toggle'){
    phoneSession.qaOverviewOpen = !phoneSession.qaOverviewOpen;
    render();
  } else if(action === 'proc-section-toggle'){
    phoneSession.procOpen = !phoneSession.procOpen;
    render();
  } else if(action === 'end-call'){
    const hasQaAnswer = !!(phoneSession && (phoneSession.qa||[]).some(q => (q.answer||'').trim()));
    if(!phoneSession || (!phoneSession.notes.length && !(phoneSession.rawMemo||'').trim() && !hasQaAnswer)){
      showToast('입력된 내용이 없습니다'); return;
    }
    // 통화 메모(rawMemo)에 등장한 키워드도 업무정보/후속업무 판단에 반영한다
    detectIntents(phoneSession.rawMemo || '').forEach(tag => {
      if(!phoneSession.matchedIntents.includes(tag)) phoneSession.matchedIntents.push(tag);
    });
    phoneSession.endedAt = Date.now();
    phoneSession.report = buildPhoneCallReport(phoneSession);
    phoneSession.followups = buildPhoneFollowups(phoneSession);
    if(phoneSession.scenarioTag){
      const det = extractFieldsDeterministic(phoneSession);
      phoneSession.extractedFields = det;
      phoneSession.finalFields = { ...det };
      phoneSession.relayText = buildRelayText(phoneSession.scenarioTag, phoneSession.finalFields);
      const apiKey = getOpenAIKey();
      if(apiKey){
        const sessionRef = phoneSession;
        extractFieldsAI(apiKey, sessionRef).then(aiFields => {
          if(phoneSession !== sessionRef) return; // 그 사이 새 통화가 시작됐으면 반영하지 않는다
          Object.keys(aiFields).forEach(k => { if(aiFields[k]) sessionRef.extractedFields[k] = aiFields[k]; });
          // 사용자가 이미 직접 고친 값은 AI 결과로 덮어쓰지 않는다
          Object.keys(aiFields).forEach(k => {
            if(aiFields[k] && !(sessionRef.finalFields[k]||'').trim()) sessionRef.finalFields[k] = aiFields[k];
          });
          sessionRef.relayText = buildRelayText(sessionRef.scenarioTag, sessionRef.finalFields);
          persistActiveCall();
          render();
        });
      }
    }
    persistActiveCall(); // 저장 전 검토 단계도 새로고침에 대비해 계속 임시 보관한다
    render();
  } else if(action === 'new-call'){
    phoneSession = newPhoneSession();
    clearActiveCallStorage();
    render();
  } else if(action === 'field-edit-noop'){
    // no-op (input change is handled by contentEl 'input' listener below)
  } else if(action === 'relay-copy'){
    copyText(phoneSession.relayText || '');
  } else if(action === 'copy-all'){
    const s = phoneSession;
    copyText([buildStructuredText(s.scenarioTag, s.finalFields), '', '전달용 문구', s.relayText || ''].join('\n'));
  } else if(action === 'call-edit-again'){
    phoneSession.endedAt = null;
    persistActiveCall();
    render();
  } else if(action === 'qa-edit-toggle'){
    phoneSession.qaEditMode = !phoneSession.qaEditMode;
    render();
  } else if(action === 'proc-edit-toggle'){
    phoneSession.procEditMode = !phoneSession.procEditMode;
    render();
  } else if(action === 'proc-add'){
    const tag = phoneSession.scenarioTag;
    getPhoneProcedureSet(tag).push({ id: uid(), text:'' });
    saveState(); render();
    requestAnimationFrame(()=>{
      const inputs = document.querySelectorAll('.pa-proc-input');
      const last = inputs[inputs.length-1];
      if(last) last.focus();
    });
  } else if(action === 'proc-delete'){
    if(confirm('이 진행순서 항목을 삭제하시겠습니까?')){
      const tag = phoneSession.scenarioTag;
      state.phoneProcedureSets[tag] = (state.phoneProcedureSets[tag]||[]).filter(p=>p.id!==btn.dataset.id);
      saveState(); render();
    }
  } else if(action === 'proc-up' || action === 'proc-down'){
    const tag = phoneSession.scenarioTag;
    const arr = state.phoneProcedureSets[tag] || [];
    const idx = arr.findIndex(p=>p.id===btn.dataset.id);
    const swapWith = action === 'proc-up' ? idx-1 : idx+1;
    if(idx>=0 && swapWith>=0 && swapWith<arr.length){
      [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
      saveState(); render();
    }
  } else if(action === 'qa-up' || action === 'qa-down'){
    const arr = phoneSession.qa;
    const idx = arr.findIndex(q=>q.id===btn.dataset.id);
    const swapWith = action === 'qa-up' ? idx-1 : idx+1;
    if(idx>=0 && swapWith>=0 && swapWith<arr.length){
      [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
      const setArr = phoneSession.scenarioTag && state.phoneQuestionSets[phoneSession.scenarioTag];
      if(setArr){
        const sIdx = setArr.findIndex(q=>q.id===btn.dataset.id);
        const sSwap = action === 'qa-up' ? sIdx-1 : sIdx+1;
        if(sIdx>=0 && sSwap>=0 && sSwap<setArr.length){ [setArr[sIdx], setArr[sSwap]] = [setArr[sSwap], setArr[sIdx]]; saveState(); }
      }
      persistActiveCall(); render();
    }
  } else if(action === 'qa-add'){
    const item = { id: uid(), label:'', question:'', answer:'', source:'custom' };
    phoneSession.qa.push(item);
    phoneSession.currentQaIndex = phoneSession.qa.length - 1; // 추가한 질문으로 바로 이동
    if(phoneSession.scenarioTag){
      getPhoneQuestionSet(phoneSession.scenarioTag).push({ id:item.id, label:item.label, question:item.question });
      saveState();
    }
    persistActiveCall();
    render();
    requestAnimationFrame(()=>{
      const inputs = document.querySelectorAll('.pa-qa-question-input');
      const last = inputs[inputs.length-1];
      if(last) last.focus();
    });
  } else if(action === 'qa-delete'){
    if(confirm('이 질문을 삭제하시겠습니까?')){
      const delIdx = phoneSession.qa.findIndex(q => q.id === btn.dataset.id);
      phoneSession.qa = phoneSession.qa.filter(q => q.id !== btn.dataset.id);
      if(phoneSession.scenarioTag && state.phoneQuestionSets[phoneSession.scenarioTag]){
        state.phoneQuestionSets[phoneSession.scenarioTag] = state.phoneQuestionSets[phoneSession.scenarioTag].filter(q=>q.id!==btn.dataset.id);
        saveState();
      }
      if(phoneSession.currentQaIndex >= delIdx) phoneSession.currentQaIndex = Math.max(0, phoneSession.currentQaIndex - 1);
      persistActiveCall();
      render();
    }
  } else if(action === 'qa-jump'){
    phoneSession.currentQaIndex = Number(btn.dataset.index);
    persistActiveCall();
    render();
  } else if(action === 'qa-next' || action === 'qa-skip'){
    phoneSession.currentQaIndex = Math.min(phoneSession.currentQaIndex + 1, phoneSession.qa.length - 1);
    persistActiveCall();
    render();
  } else if(action === 'qa-prev'){
    phoneSession.currentQaIndex = Math.max(phoneSession.currentQaIndex - 1, 0);
    persistActiveCall();
    render();
  } else if(action === 'followup-add'){
    phoneSession.followups.push({ text:'', status:'unhandled' });
    render();
    requestAnimationFrame(()=>{
      const inputs = document.querySelectorAll('.pa-followup-input');
      const last = inputs[inputs.length-1];
      if(last) last.focus();
    });
  } else if(action === 'followup-delete'){
    if(confirm('이 후속 업무를 삭제하시겠습니까?')){
      phoneSession.followups.splice(Number(btn.dataset.index), 1);
      persistActiveCall();
      render();
    }
  } else if(action === 'save-call'){
    savePhoneCallLog();
  } else if(action === 'copy-script'){
    // 대본 전체가 아니라 내가 실제로 말할 문장들만 이어서 복사한다
    const blocks = (phoneSession.lastScriptBlocks || []).filter(b => b.type === 'say');
    if(blocks.length) copyText(blocks.map(b => b.text).join('\n\n'));
  } else if(action === 'copy-script-line'){
    const b = (phoneSession.lastScriptBlocks || [])[Number(btn.dataset.index)];
    if(b && b.type === 'say') copyText(b.text);
  } else if(action === 'note-delete'){
    const idx = Number(btn.dataset.index);
    if(phoneSession && phoneSession.notes[idx] && confirm('이 기록을 삭제하시겠습니까?')){
      phoneSession.notes.splice(idx, 1);
      persistActiveCall();
      render();
    }
  } else if(action === 'copy-material'){
    if(phoneSession.lastMaterial) copyText(phoneSession.lastMaterial.url || phoneSession.lastMaterial.location);
  } else if(action === 'copy-jurisdiction-phone'){
    if(phoneSession.lastJurisdiction) copyText(phoneSession.lastJurisdiction.phone || '');
  } else if(action === 'copy-report'){
    copyText(phoneSession.report || '');
  } else if(action === 'ai-polish-report'){
    const apiKey = getOpenAIKey();
    if(!apiKey){ promptForOpenAIKey((key)=> polishPhoneReport(key)); return; }
    polishPhoneReport(apiKey);
  } else if(action === 'add-todo'){
    const f = phoneSession.followups[Number(btn.dataset.index)];
    if(!f) return;
    const who = phoneSession.company ? phoneSession.company.name : phoneSession.site ? phoneSession.site.name : (phoneSession.firstLine || '');
    state.todos.push({id:uid(), text: who ? `${who} — ${f.text}` : f.text, done:false});
    // 처리할 업무 비서와 연결: 같은 업체/현장 ID를 참조하는 업무 카드로도 함께 등록한다 (요청에 따라 자동 등록, 삭제되지 않음)
    state.workItems.push({
      id:uid(),
      companyId: phoneSession.company ? phoneSession.company.id : null,
      siteId: phoneSession.site ? phoneSession.site.id : null,
      who,
      title: f.text,
      status: f.status,
      reason: `전화 메모 "${combinedRawMemo(phoneSession).split('\n').join(' / ')}" 에서 확인됨`,
      nextAction: f.text,
      materialId: f.materialId || null,
      createdAt: Date.now(),
      done:false,
      snoozedUntil:null
    });
    saveState(); render();
    showToast('오늘 할 일 · 처리할 업무에 추가되었습니다');
  } else if(action === 'add-work-item-from-call'){
    // §9 [처리할 업무에 추가]: 구조화 결과가 있는 통화(문의유형 인식됨)에서, 기존 add-todo와 같은 workItems 데이터
    // 구조를 그대로 재사용해 업무 카드를 만든다. 새 데이터 형태를 발명하지 않는다.
    const s = phoneSession;
    if(!s) return;
    const who = s.company ? s.company.name : s.site ? s.site.name : (s.firstLine || '');
    const typeLabel = BUSINESS_TYPE_LABEL[s.scenarioTag] || s.scenarioTag || '전화 문의';
    const title = (s.relayText || '').split('\n').map(l=>l.trim()).find(Boolean) || `${who ? who + ' ' : ''}${typeLabel}`.trim();
    state.workItems.push({
      id: uid(),
      companyId: s.company ? s.company.id : null,
      siteId: s.site ? s.site.id : null,
      who,
      title,
      status: 'unhandled',
      reason: `전화 접수 "${typeLabel}" 에서 확인됨`,
      nextAction: title,
      materialId: null,
      createdAt: Date.now(),
      done:false,
      snoozedUntil:null
    });
    saveState(); render();
    showToast('처리할 업무에 추가되었습니다');
  } else if(action === 'jur-add'){ openPhoneJurisdictionModal(); }
  else if(action === 'jur-edit'){ openPhoneJurisdictionModal(btn.dataset.id); }
  else if(action === 'jur-delete'){
    if(confirm('삭제할까요?')){ state.jurisdictions = state.jurisdictions.filter(j=>j.id!==btn.dataset.id); saveState(); render(); }
  }
  else if(action === 'mat-add'){ openPhoneMaterialModal(); }
  else if(action === 'mat-edit'){ openPhoneMaterialModal(btn.dataset.id); }
  else if(action === 'mat-delete'){
    if(confirm('삭제할까요?')){ state.materials = state.materials.filter(m=>m.id!==btn.dataset.id); saveState(); render(); }
  }
  else if(action === 'site-add'){ openPhoneSiteModal(); }
  else if(action === 'site-edit'){ openPhoneSiteModal(btn.dataset.id); }
  else if(action === 'site-delete'){
    if(confirm('삭제할까요?')){ state.sites = state.sites.filter(s=>s.id!==btn.dataset.id); saveState(); render(); }
  }
  else if(action === 'calllog-delete'){
    if(confirm('이 통화 기록을 삭제하시겠습니까?')){
      state.callLogs = state.callLogs.filter(l=>l.id!==btn.dataset.id);
      saveState(); render();
    }
  }
});

/* ==========================================================================
   처리할 업무 비서
   - "할 일"이 아니라 실제 기록(전화 비서 후속업무, 직접 등록)만 업무 카드로 만든다.
   - 완료되지 않았고(snoozedUntil이 지났거나 없는) 카드만 오늘 목록에 뜬다.
   - AI는 문장 정리에만 쓰고, 담당자/전화번호/자료위치/진행상태는 항상 state에서만 가져온다.
   ========================================================================== */

const TODAY_STATUS_META = {
  urgent:       { label:'긴급',       tagClass:'st-urgent',   doneLabel:'완료',      weight:0 },
  callback:     { label:'콜백',       tagClass:'st-callback', doneLabel:'전화 완료', weight:1 },
  material:     { label:'자료발송',   tagClass:'st-material', doneLabel:'발송 완료', weight:2 },
  replywait:    { label:'회신대기',   tagClass:'',            doneLabel:'회신 확인', weight:3 },
  contactcheck: { label:'담당자확인', tagClass:'',            doneLabel:'확인 완료', weight:3 },
  waiting:      { label:'대기',       tagClass:'st-waiting',  doneLabel:'자료 수령', weight:4 },
  unhandled:    { label:'미처리',     tagClass:'',            doneLabel:'완료',      weight:5 },
  meeting:      { label:'미팅',       tagClass:'',            doneLabel:'미팅 등록', weight:5 },
};

function activeWorkItems(){
  const now = Date.now();
  return state.workItems.filter(w => !w.done && (!w.snoozedUntil || w.snoozedUntil <= now));
}
function sortWorkItems(items){
  return items.slice().sort((a,b) => {
    const wa = (TODAY_STATUS_META[a.status]||{}).weight ?? 9;
    const wb = (TODAY_STATUS_META[b.status]||{}).weight ?? 9;
    if(wa !== wb) return wa - wb;
    return (a.createdAt||0) - (b.createdAt||0);
  });
}
function workItemCompany(w){ return w.companyId ? state.companies.find(c=>c.id===w.companyId) : null; }
function workItemSite(w){ return w.siteId ? state.sites.find(s=>s.id===w.siteId) : null; }
function workItemMaterial(w){ return w.materialId ? state.materials.find(m=>m.id===w.materialId) : null; }
function workItemJurisdiction(w){
  const site = workItemSite(w);
  const region = site && site.region;
  if(!region) return null;
  return state.jurisdictions.find(j=>j.region===region) || undefined; // undefined = 지역은 있으나 담당자 미등록
}

let expandedWorkItemId = null;

// 업무 목록 자체(한 줄 행 + 클릭 시 펼쳐지는 상세) — 홈 화면과 처리할 업무 전체 화면이 동일하게 재사용한다.
// 상태 요약 가로칸(긴급1·자료발송2 …)은 두지 않는다 — 각 행 왼쪽 상태 태그로만 표시한다.
function renderTodayList(){
  const items = sortWorkItems(activeWorkItems());
  return `
    <div class="today-list">
      ${items.map(w => renderTodayCard(w)).join('') || '<div class="today-empty">지금 처리할 업무가 없습니다.</div>'}
    </div>
  `;
}

// 처리할 업무 전체 화면(사이드바 "처리할 업무") — 목록 + 직접 추가/정리 보기 도구를 함께 보여준다.
function renderTodayView(){
  const items = activeWorkItems();
  return `
    <div class="view-topbar"><span class="crumb">TOOLS</span></div>
    <div class="view-header">
      <h1>처리할 업무 ${items.length}건</h1>
      <p>후속업무와 직접 등록한 업무를 모아 우선순위대로 보여드립니다.</p>
    </div>
    <div class="today-toolbar-row">
      <button type="button" class="today-toolbar-btn" data-tw-action="add-open">+ 업무 직접 추가</button>
      <button type="button" class="today-toolbar-btn" data-tw-action="show-summary">정리 보기</button>
    </div>
    <div id="todaySummaryArea"></div>
    ${renderTodayList()}
  `;
}
function renderTodayCard(w){
  const meta = TODAY_STATUS_META[w.status] || {label:w.status, tagClass:'', doneLabel:'완료'};
  const company = workItemCompany(w);
  const site = workItemSite(w);
  const who = company ? company.name : site ? site.name : (w.who || '');
  const expanded = expandedWorkItemId === w.id;
  return `
    <div class="today-card ${expanded?'expanded':''}" data-tw-action="toggle" data-id="${w.id}">
      <div class="today-card-top">
        <span class="today-status-tag ${meta.tagClass}">${escapeHtml(meta.label)}</span>
        <span class="today-card-title">${who ? escapeHtml(who) + ' · ' : ''}${escapeHtml(w.title)}</span>
        <button type="button" class="today-card-del" data-tw-action="work-delete" data-id="${w.id}" title="이 업무 삭제">✕</button>
      </div>
      ${w.nextAction ? `<div class="today-card-sub">${escapeHtml(w.nextAction)}</div>` : ''}
      ${expanded ? renderTodayDetail(w, meta, company, site) : ''}
    </div>
  `;
}
function renderTodayDetail(w, meta, company, site){
  const material = workItemMaterial(w);
  const jurisdiction = workItemJurisdiction(w);
  const script = findScriptForTags(detectIntents(`${w.title} ${w.nextAction||''} ${w.reason||''}`));
  const rows = [['현재 상태', meta.label]];
  if(w.reason) rows.push(['왜 표시됐나요?', w.reason]);
  if(w.nextAction) rows.push(['지금 해야 할 일', w.nextAction]);
  return `
    <div class="today-detail" onclick="event.stopPropagation()">
      ${rows.map(([label,val]) => `
        <div class="today-detail-row">
          <div class="today-detail-label">${escapeHtml(label)}</div>
          <div class="today-detail-val">${escapeHtml(val)}</div>
        </div>
      `).join('')}
      ${script ? `<div class="today-detail-row"><div class="today-detail-label">전화할 때</div><div class="today-detail-val">${escapeHtml(script.body)}</div></div>` : ''}
      ${material ? `
        <div class="today-detail-row"><div class="today-detail-label">필요 자료 / 자료 위치</div><div class="today-detail-val">${escapeHtml(material.name)} — ${escapeHtml(material.location)}</div></div>
      ` : (w.status==='material' ? `
        <div class="today-detail-row"><div class="today-detail-label">필요 자료 / 자료 위치</div><div class="today-detail-val pa-missing">등록된 자료 없음 — 확인 필요</div></div>
      ` : '')}
      ${jurisdiction === undefined ? `
        <div class="today-detail-row"><div class="today-detail-label">관할 담당자</div><div class="today-detail-val pa-missing">등록된 관할 담당자 정보 없음</div></div>
      ` : jurisdiction ? `
        <div class="today-detail-row">
          <div class="today-detail-label">관할 담당자 / 전화번호</div>
          <div class="today-detail-val">${escapeHtml(jurisdiction.branch||'-')} · ${escapeHtml(jurisdiction.manager||'-')} · ${escapeHtml(jurisdiction.phone||'-')}
            ${jurisdiction.phone ? ` <button class="copy-btn" data-tw-action="copy-phone" data-phone="${escapeHtml(jurisdiction.phone)}">복사</button>` : ''}
          </div>
        </div>
      ` : ''}
      ${company && company.memo ? `<div class="today-detail-row"><div class="today-detail-label">관련 과거 기록 (업체 메모)</div><div class="today-detail-val">${escapeHtml(company.memo)}</div></div>` : ''}
      <div class="today-actions">
        <button class="copy-btn" data-tw-action="done" data-id="${w.id}">${escapeHtml(meta.doneLabel)}</button>
        <button class="copy-btn" data-tw-action="snooze-menu" data-id="${w.id}">나중에</button>
        <button class="copy-btn" data-tw-action="work-delete" data-id="${w.id}" title="이 업무 삭제">🗑 삭제</button>
      </div>
      <div class="today-snooze-menu" id="snoozeMenu-${w.id}" style="display:none;">
        <button class="copy-btn" data-tw-action="snooze" data-id="${w.id}" data-minutes="30">30분 후</button>
        <button class="copy-btn" data-tw-action="snooze" data-id="${w.id}" data-minutes="240">오후</button>
        <button class="copy-btn" data-tw-action="snooze" data-id="${w.id}" data-minutes="1440">내일</button>
        <input type="datetime-local" id="snoozeCustom-${w.id}" class="search-box" style="width:170px;height:34px;font-size:12px;padding:4px 8px;" />
        <button class="copy-btn" data-tw-action="snooze-custom" data-id="${w.id}">적용</button>
      </div>
    </div>
  `;
}

async function polishDailySummary(apiKey){
  const el = document.getElementById('todaySummaryText');
  if(!el) return;
  const raw = el.textContent;
  try{
    showToast('보고용 문구 정리 중...');
    const prompt = `아래는 오늘 처리한 업무 현황 메모야. 사실을 바꾸지 말고 "오늘 처리한 업무 / 진행 중 업무 / 확인 필요한 업무 / 내일 할 업무" 순서의 보고용 문장으로 정리해줘. 다른 설명 없이 정리된 문구만 출력해.\n\n${raw}`;
    const result = await callOpenAI(apiKey, prompt);
    if(result) el.textContent = result;
  }catch(err){ console.error(err); showToast('정리에 실패했습니다'); }
}

contentEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-tw-action]');
  if(!btn) return;
  const action = btn.dataset.twAction;
  if(action === 'toggle'){
    expandedWorkItemId = expandedWorkItemId === btn.dataset.id ? null : btn.dataset.id;
    render();
  } else if(action === 'done'){
    const w = state.workItems.find(w=>w.id===btn.dataset.id);
    if(!w) return;
    w.done = true; w.doneAt = Date.now();
    saveState(); render();
    showToast('완료 처리되었습니다');
  } else if(action === 'work-delete'){
    const w = state.workItems.find(w=>w.id===btn.dataset.id);
    if(w && confirm('이 업무를 삭제하시겠습니까?')){
      state.workItems = state.workItems.filter(x=>x.id!==w.id);
      saveState(); render();
    }
  } else if(action === 'snooze-menu'){
    const el = document.getElementById('snoozeMenu-'+btn.dataset.id);
    if(el) el.style.display = (el.style.display === 'none' || !el.style.display) ? 'flex' : 'none';
  } else if(action === 'snooze'){
    const w = state.workItems.find(w=>w.id===btn.dataset.id);
    if(!w) return;
    w.snoozedUntil = Date.now() + Number(btn.dataset.minutes) * 60000;
    saveState(); render();
    showToast('나중에 다시 표시됩니다');
  } else if(action === 'snooze-custom'){
    const input = document.getElementById('snoozeCustom-'+btn.dataset.id);
    const w = state.workItems.find(w=>w.id===btn.dataset.id);
    if(!input || !input.value || !w) return;
    const ts = new Date(input.value).getTime();
    if(isNaN(ts)) return;
    w.snoozedUntil = ts;
    saveState(); render();
    showToast('나중에 다시 표시됩니다');
  } else if(action === 'copy-phone'){
    copyText(btn.dataset.phone || '');
  } else if(action === 'add-open'){
    openModal({
      title:'업무 직접 추가', submitLabel:'추가',
      fields:[
        {name:'title', label:'업무 제목 (예: 사업자등록증 미수령)'},
        {name:'companyName', label:'업체명 (등록된 업체명과 같으면 자동 연결)', placeholder:'선택 입력'},
        {name:'status', label:'상태 (urgent/callback/material/waiting/replywait/contactcheck/unhandled/meeting)', value:'unhandled'},
        {name:'reason', label:'왜 필요한가요?', type:'textarea'},
        {name:'nextAction', label:'지금 해야 할 일', type:'textarea'}
      ],
      onSubmit(data){
        if(!data.title) return;
        const company = data.companyName ? state.companies.find(c=>c.name.toLowerCase()===data.companyName.toLowerCase()) : null;
        const status = TODAY_STATUS_META[data.status] ? data.status : 'unhandled';
        state.workItems.push({
          id:uid(), companyId: company?company.id:null, siteId:null,
          who: company ? company.name : (data.companyName || ''),
          title:data.title, status, reason:data.reason||'', nextAction:data.nextAction||'',
          materialId:null, createdAt:Date.now(), done:false, snoozedUntil:null
        });
        saveState(); render();
      }
    });
  } else if(action === 'show-summary'){
    const area = document.getElementById('todaySummaryArea');
    if(!area) return;
    const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    const doneToday = state.workItems.filter(w=>w.done && w.doneAt && w.doneAt >= startOfDay.getTime());
    const pending = activeWorkItems();
    const byStatusDone = {};
    doneToday.forEach(w=>{ byStatusDone[w.status]=(byStatusDone[w.status]||0)+1; });
    const lines = [`오늘 처리 ${doneToday.length}건`, `진행 중(대기) ${pending.length}건`];
    Object.keys(byStatusDone).forEach(k=> lines.push(`${(TODAY_STATUS_META[k]||{label:k}).label} ${byStatusDone[k]}건 완료`));
    area.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="card-title" style="margin:0;">처리할 업무 정리</div>
          <div class="card-actions">
            <button class="copy-btn" data-tw-action="copy-daily-summary">📋 복사</button>
            <button class="icon-btn" data-tw-action="ai-daily-summary" title="보고용 문구 만들기">✨</button>
          </div>
        </div>
        <div class="card-body" id="todaySummaryText">${escapeHtml(lines.join('\n'))}</div>
      </div>
    `;
  } else if(action === 'copy-daily-summary'){
    const el = document.getElementById('todaySummaryText');
    if(el) copyText(el.textContent);
  } else if(action === 'ai-daily-summary'){
    const apiKey = getOpenAIKey();
    if(!apiKey){ promptForOpenAIKey((key)=>polishDailySummary(key)); return; }
    polishDailySummary(apiKey);
  }
});

/* ============================================================
   Q&A: 전사 공용 Q&A 관리
   업체별로 화면을 나누지 않고, 하나의 전역 컬렉션(state.qaQuestions)에
   1차 미팅 / 2차 미팅 / PT 질문을 계속 누적한다. companyName/companyId는
   질문 출처 추적용으로만 쓰고, 업체별로 목록을 분리해서 보여주지 않는다.
   기존 질문서/1차미팅/2차미팅/MOU/고객관리카드/업체 칸반보드/일정 등과는
   완전히 분리된 별도의 공용 지식 데이터베이스다.
   ============================================================ */
const QA_STAGES = [
  {key:'first', label:'1차 미팅 Q&A'},
  {key:'second', label:'2차 미팅 Q&A'},
  {key:'pt', label:'PT Q&A'}
];
const QA_QUESTIONER_OPTIONS = ['회장','동대표','관리소장','관리사무소','입주민','기타'];

// 탐색 위치(현재 탭/검색어/필터)는 데이터가 아니므로 다른 도구들과 동일하게 localStorage에 저장하지 않는다.
let qaActiveTab = 'first';
let qaSearchQuery = '';
let qaSearchScope = 'all'; // 'all' | 'tab'
let qaUnansweredOnly = false;
let qaExpandedId = null;

function qaStageLabel(key){
  const s = QA_STAGES.find(s=>s.key===key);
  return s ? s.label : key;
}
function qaFormatDate(value){
  if(!value) return '';
  const d = new Date(value);
  if(isNaN(d.getTime())) return '';
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yy}.${mm}.${dd}`;
}

function qaMatchesQuery(item, q){
  const hay = [
    item.category, item.questionSummary, item.questionOriginal, item.questionContext,
    item.answer, item.memo, item.companyName, item.siteName, item.questioner
  ].filter(Boolean).join('\n').toLowerCase();
  return hay.includes(q);
}
// 검색/탭/미답변 필터를 적용한 목록 (등록일 최신순). 검색 범위가 '전체'이고 검색어가 있으면
// 1차/2차/PT를 모두 합쳐서 보여주고, 그 외에는 현재 탭 안에서만 보여준다.
function qaVisibleList(){
  const q = qaSearchQuery.trim().toLowerCase();
  const searchAll = !!q && qaSearchScope === 'all';
  let list = state.qaQuestions.filter(item => searchAll ? true : item.stage === qaActiveTab);
  if(q) list = list.filter(item => qaMatchesQuery(item, q));
  if(qaUnansweredOnly) list = list.filter(item => item.answerStatus !== 'answered');
  return list.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
}
function qaTabStats(stage){
  const list = state.qaQuestions.filter(item => item.stage === stage);
  return { total: list.length, unanswered: list.filter(item => item.answerStatus !== 'answered').length };
}
// 자주 나온 질문: 현재 탭 안에서 카테고리별 건수 상위 5개 — 고객들이 실제로 가장 궁금해하는 것을 한눈에 보여준다.
function qaTopCategories(stage){
  const counts = {};
  state.qaQuestions.filter(item => item.stage === stage).forEach(item => {
    const key = item.category || '기타';
    counts[key] = (counts[key]||0) + 1;
  });
  return Object.keys(counts).map(k => ({ category:k, count:counts[k] }))
    .sort((a,b) => b.count - a.count).slice(0,5);
}
// 유사 질문(간단 버전): 원본 질문은 절대 자동으로 합치거나 지우지 않는다. 같은 미팅 유형·같은 카테고리
// 안에서 질문 요약/실제 질문의 단어 겹침 비율이 높으면 "참고용"으로만 묶어서 보여준다.
function qaTokenize(text){
  return (text||'').toLowerCase().replace(/[?!.,()·~"'“”]/g,' ').split(/\s+/).filter(w => w.length >= 2);
}
function qaSimilarityScore(a, b){
  const wa = new Set(qaTokenize(a.questionSummary + ' ' + a.questionOriginal));
  const wb = new Set(qaTokenize(b.questionSummary + ' ' + b.questionOriginal));
  if(!wa.size || !wb.size) return 0;
  let overlap = 0;
  wa.forEach(w => { if(wb.has(w)) overlap++; });
  return overlap / Math.min(wa.size, wb.size);
}
function qaFindSimilar(item){
  return state.qaQuestions.filter(other => (
    other.id !== item.id && other.stage === item.stage && other.category === item.category &&
    qaSimilarityScore(item, other) >= 0.45
  ));
}

function renderQaView(){
  const stats = qaTabStats(qaActiveTab);
  const freq = qaTopCategories(qaActiveTab);
  const list = qaVisibleList();

  return `

function renderQaListArea(list, showStageCol){
  if(!list.length){
    return `<div class="qa-table-wrap"><div class="qa-empty">${qaSearchQuery.trim() ? '검색 결과가 없습니다.' : '등록된 질문이 없습니다. 오른쪽 위 [+ 질문 추가]로 첫 질문을 등록해보세요.'}</div></div>`;

function renderQaRow(item, showStageCol){
  const similar = qaFindSimilar(item);
  const isPt = item.stage === 'pt';
  const companyCell = isPt
    ? ([item.siteName, item.questioner].filter(Boolean).join(' · ') || item.companyName || '')

  const rows = [`

      <td>
        <div class="qa-q-summary">${escapeHtml(item.questionSummary || '(요약 없음)')}</div>
        ${similar.length ? `<span class="qa-similar-tag">유사 질문 ${similar.length}건</span>` : ''}
      </td>
      ${showStageCol ? `<td><span class="qa-stage-tag">${escapeHtml(qaStageLabel(item.stage))}</span></td>` : ''}
      <td>
        <span class="qa-status ${item.answerStatus==='answered'?'answered':'unanswered'}">${item.answerStatus==='answered'?'답변완료':'미답변'}</span>
        ${item.officialAnswer ? '<span class="qa-official">★ 공식답변</span>' : ''}
      </td>

  if(qaExpandedId === item.id){

function openQaQuestionModal(stage, editId){

  const questionerOptions = QA_QUESTIONER_OPTIONS.map(q => `<option value="${escapeHtml(q)}" ${existing && existing.questioner===q ? 'selected':''}>${escapeHtml(q)}</option>`).join('');

  modal.classList.add('modal-wide');
  modal.innerHTML = `
    <h2>${existing ? '질문 수정' : '질문 추가'} · ${escapeHtml(qaStageLabel(stage))}</h2>

        <input type="text" name="questionSummary" placeholder="예: 아스팔트슁글 조달 가능 여부" value="${escapeHtml(existing?.questionSummary || '')}" />

      <div class="field">
        <label>실제 질문 (한 줄에 하나씩 입력)</label>
        <textarea name="questionOriginal" placeholder="예: 아스팔트슁글도 조달을 통해 진행할 수 있나요?">${escapeHtml(existing?.questionOriginal || '')}</textarea>
      </div>
      <div class="field">
        <label>질문 배경 (선택)</label>
        <textarea name="questionContext" placeholder="이 질문이 나온 배경/상황">${escapeHtml(existing?.questionContext || '')}</textarea>
      </div>
      ${isPt ? `
        <div class="field-row">
          <div class="field">
            <label>현장명</label>
            <input type="text" name="siteName" placeholder="예: OO아파트" value="${escapeHtml(existing?.siteName || '')}" />
          </div>
          <div class="field">
            <label>질문자</label>
            <select name="questioner">
              <option value="">선택 안 함</option>
              ${questionerOptions}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>PT 일자</label>
            <input type="date" name="meetingDate" value="${escapeHtml(existing?.meetingDate || '')}" />
          </div>
          <div class="field">
            <label class="field-check" style="margin-top:30px;">
              <input type="checkbox" name="followUpNeeded" ${existing?.followUpNeeded ? 'checked':''} />
              추가 확인 필요
            </label>
          </div>
        </div>
      ` : ''}
      <div class="field">
        <label>답변 (선택 — 입력해서 저장하면 답변완료로 등록됩니다)</label>
        <textarea name="answer" placeholder="답변 내용">${escapeHtml(existing?.answer || '')}</textarea>
      </div>
      <div class="field">
        <label>메모 (선택)</label>
        <textarea name="memo" placeholder="추가 메모">${escapeHtml(existing?.memo || '')}</textarea>

        <button type="submit" class="btn btn-primary">${existing ? '저장' : '등록'}</button>

        memo: f.memo.value.trim(), createdAt: now, updatedAt: now
      });
    }
    saveState(); closeModal(); render();
    showToast(existing ? '질문이 수정되었습니다' : '질문이 등록되었습니다');
  };
  const firstField = modal.querySelector('select, input, textarea');
  if(firstField) firstField.focus();
}

          <div class="qa-cat-modal-row">
            <input type="text" value="${escapeHtml(c)}" data-cat-rename="${i}" />
            <span class="qa-cat-modal-count">${counts[c] || 0}건</span>
            <button type="button" class="icon-btn danger" data-cat-delete="${i}" title="삭제">🗑</button>
          </div>
        `).join('')}
      </div>
      <div class="inline-form">
        <input type="text" id="qaCatNewInput" placeholder="새 카테고리 이름" />
        <button type="button" id="qaCatAddBtn">추가</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="qaCatCloseBtn">닫기</button>
      </div>
    `;
    modal.querySelector('#qaCatCloseBtn').onclick = closeModal;
    modal.querySelector('#qaCatAddBtn').onclick = () => {
      const input = modal.querySelector('#qaCatNewInput');
      const name = input.value.trim();
      if(!name) return;
      if(state.qaCategories.includes(name)){ showToast('이미 있는 카테고리입니다'); return; }
      state.qaCategories.push(name);
      saveState(); renderQaCategoryModalBody(); render();
    };
    modal.querySelectorAll('[data-cat-rename]').forEach(input => {
      input.onchange = () => {
        const idx = Number(input.dataset.catRename);
        const oldName = state.qaCategories[idx];
        const newName = input.value.trim();
        if(!newName){ input.value = oldName; return; }
        if(newName === oldName) return;
        if(state.qaCategories.includes(newName)){ showToast('이미 있는 카테고리입니다'); input.value = oldName; return; }
        state.qaCategories[idx] = newName;
        // 이 카테고리를 쓰던 질문들도 함께 이름을 바꿔줘서 기존 질문의 분류가 끊기지 않게 한다
        state.qaQuestions.forEach(q => { if(q.category === oldName) q.category = newName; });
        saveState(); renderQaCategoryModalBody(); render();
      };
    });
    modal.querySelectorAll('[data-cat-delete]').forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.dataset.catDelete);
        const name = state.qaCategories[idx];
        const used = state.qaQuestions.filter(q => q.category === name).length;
        const msg = used
          ? `"${name}" 카테고리를 삭제하시겠습니까?\n이 카테고리로 등록된 질문 ${used}건은 "기타"로 이동합니다.`
          : `"${name}" 카테고리를 삭제하시겠습니까?`;
        if(!confirm(msg)) return;
        state.qaCategories = state.qaCategories.filter((c,i) => i !== idx);
        if(!state.qaCategories.includes('기타')) state.qaCategories.push('기타');
        state.qaQuestions.forEach(q => { if(q.category === name) q.category = '기타'; });
        saveState(); renderQaCategoryModalBody(); render();
      };
    });
  }
}

/* ---------- Q&A: 목록 화면 이벤트(delegated) ---------- */
contentEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action^="qa-"]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'qa-tab'){
    qaActiveTab = btn.dataset.stage;
    qaExpandedId = null;
    render();
  }
  else if(action === 'qa-scope'){
    qaSearchScope = btn.dataset.scope;
    render();
  }
  else if(action === 'qa-add-open'){
    openQaQuestionModal(qaActiveTab, null);
  }
  else if(action === 'qa-toggle-unanswered'){
    qaUnansweredOnly = !qaUnansweredOnly;
    render();
  }
  else if(action === 'qa-category-manage'){
    openQaCategoryModal();
  }
  else if(action === 'qa-row-toggle'){
    const id = btn.dataset.id;
    qaExpandedId = (qaExpandedId === id) ? null : id;
    updateQaListUI();
  }
  else if(action === 'qa-edit'){
    const item = state.qaQuestions.find(q=>q.id===btn.dataset.id);
    if(item) openQaQuestionModal(item.stage, item.id);
  }
  else if(action === 'qa-delete'){
    const item = state.qaQuestions.find(q=>q.id===btn.dataset.id);
    if(!item) return;
    if(confirm('이 질문을 삭제하시겠습니까? 등록된 답변/메모도 함께 삭제됩니다.')){
      state.qaQuestions = state.qaQuestions.filter(q=>q.id!==item.id);
      if(qaExpandedId === item.id) qaExpandedId = null;
      saveState(); render();
    }
  }
  else if(action === 'qa-official-toggle'){
    const item = state.qaQuestions.find(q=>q.id===btn.dataset.id);
    if(!item) return;
    item.officialAnswer = !item.officialAnswer;
    item.updatedAt = new Date().toISOString();
    saveState(); render();
  }
  else if(action === 'qa-answer-save'){
    const id = btn.dataset.id;
    const item = state.qaQuestions.find(q=>q.id===id);
    const ta = document.getElementById(`qaAnswerInput-${id}`);
    if(!item || !ta) return;
    item.answer = ta.value;
    item.answerStatus = ta.value.trim() ? 'answered' : 'unanswered';
    item.updatedAt = new Date().toISOString();
    saveState(); render();
    showToast('답변이 저장되었습니다');
  }
  else if(action === 'qa-memo-save'){
    const id = btn.dataset.id;
    const item = state.qaQuestions.find(q=>q.id===id);
    const ta = document.getElementById(`qaMemoInput-${id}`);
    if(!item || !ta) return;
    item.memo = ta.value;
    item.updatedAt = new Date().toISOString();
    saveState(); render();
    showToast('메모가 저장되었습니다');
  }
});

/* ---------- Init ---------- */
// 인사말/브리핑 토스트는 두지 않는다 — 홈 화면 자체가 항상 "처리할 업무"를 곧바로 보여준다.
function render(){ renderSidebar(); renderContent(); renderQuickLinks(); updateTodoBadge(); }
render();
</script>
