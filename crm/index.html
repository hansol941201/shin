(function(){
  'use strict';
  const CO_KEY = 'shin2-companies-staging';
  const ACT_KEY = 'shin2-customer-activities-v1';
  const DOC_KEY = 'shin2-customer-documents-v1';
  const BLOB_KEY = 'shin2-customer-doc-blobs-v1'; // 로컬 전용 — SHIN2_SYNC_KEYS에 절대 추가하지 않는다(§25)
  const MEMO_KEY = 'shin2-memos-v1';
  // 공용 자료실(v2/index.html SHIN2_LIBRARY 모듈)의 메타데이터 저장소 — CRM은 여기서 "읽기만"
  // 한다. 업로드/삭제/수정은 전부 v2 자료실 화면의 몫이고, 이 파일은 그 저장소의 이름과 구조를
  // 절대 바꾸지 않는다(§29). 질문에 "제공자료"를 연결할 때 파일명을 보여주기 위한 참조 전용.
  const LIB_KEY = 'shin2-library-documents-v1';

  function readArr(key){ try{ const raw = localStorage.getItem(key); const a = raw?JSON.parse(raw):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function writeArr(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){ console.error('저장 실패', key, e); } }
  function readObj(key){ try{ const raw = localStorage.getItem(key); const o = raw?JSON.parse(raw):{}; return (o && typeof o==='object')?o:{}; }catch(e){ return {}; } }
  function writeObj(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ console.error('저장 실패(용량 초과 가능)', key, e); } }

  function genId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }

  // ---- companies (기존 저장소, 재사용만) ----
  function loadCompanies(){ return readArr(CO_KEY); }
  function saveCompanies(list){ writeArr(CO_KEY, list); } // §37: 화면 개편과 무관하게 항상 이 키 그대로 유지
  function findCompany(id){ return loadCompanies().find(c=> c.id === id) || null; }
  function addCompany(fields){
    // createdAt은 §영업 대시보드 카드 라운드에서 "등록일" 표시를 위해 새로 추가하는 업체부터만
    // 채운다 — 기존에 이미 저장된 업체 레코드에는 절대 소급 기입하지 않는다(§13/§17, 없음/미확인
    // 구분 원칙 — 등록일을 몰라서 비어있는 기존 업체는 화면에서 "미확인"으로만 표시된다).
    const rec = Object.assign({ id: genId('co'), name:'', repName:'', contactName:'', position:'', phone:'', mobile:'', fax:'', email:'', bizRegNo:'', address:'', website:'', memo:'', createdAt: nowIso() }, fields);
    const list = loadCompanies();
    list.push(rec);
    saveCompanies(list);
    return rec;
  }
  function updateCompany(id, patch, opts){
    const list = loadCompanies();
    const rec = list.find(c=> c.id === id);
    if(!rec) return null;
    Object.keys(patch).forEach(k=>{
      // §PART2-12: "빈 정보만 채우기" — 기존 값이 있으면 절대 덮어쓰지 않는다.
      if(opts && opts.onlyFillEmpty){
        if(!rec[k]) rec[k] = patch[k];
      } else {
        rec[k] = patch[k];
      }
    });
    saveCompanies(list);
    return rec;
  }

  // ---- customerActivities ----
  function loadActivities(){ return readArr(ACT_KEY); }
  function saveActivities(list){ writeArr(ACT_KEY, list); }
  function classifyActivity(text){
    const t = String(text || '');
    if(/(협약|MOU)/i.test(t)) return '협약';
    if(/(견적)/.test(t)) return '견적문의';
    if(/(공법)/.test(t)) return '공법문의';
    if(/(시방서|제안서|자료)/.test(t)) return '자료요청';
    if(/(PT|설명회)/i.test(t)) return 'PT/설명회';
    if(/(자재)/.test(t)) return '자재문의';
    if(/(공사진행|공사중|일정)/.test(t)) return '공사진행';
    if(/(미팅|회의)/.test(t)) return '미팅';
    if(/(전화)/.test(t)) return '전화';
    return '기타';
  }
  function addActivity(companyId, text){
    const rec = { id: genId('act'), companyId, originalText: text, activityText: text, category: classifyActivity(text), createdAt: nowIso(), updatedAt: nowIso() };
    const list = loadActivities(); list.push(rec); saveActivities(list); return rec;
  }
  function updateActivityText(id, text){
    const list = loadActivities();
    const rec = list.find(a=> a.id === id);
    if(!rec) return null;
    rec.activityText = text; rec.category = classifyActivity(text); rec.updatedAt = nowIso();
    saveActivities(list);
    return rec;
  }
  function deleteActivity(id){ saveActivities(loadActivities().filter(a=> a.id !== id)); }
  function activitiesForCompany(companyId){
    return loadActivities().filter(a=> a.companyId === companyId).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }

  // ---- customerDocuments (메타데이터만 — 바이너리는 별도 로컬 전용 blob 저장소) ----
  function loadDocuments(){ return readArr(DOC_KEY); }
  // saveDocuments: 로컬에 쓴 직후, 이미 실시간 동기화가 켜진 기기라면(§ 위 firebase 블록의
  // SHIN2_CRM_DOCS_SYNC — v2에서 [클라우드 동기화 시작]을 이미 눌러둔 기기만) 같은 배열을
  // 그대로 클라우드에도 밀어준다 — v2 탭이 열려있어야만 동작하던 기존 "storage 이벤트
  // 전달자" 경로에 의존하지 않고 이 함수를 호출하는 모든 지점(추가/이름변경/메모/삭제/
  // 공용전환)에서 항상 직접 동기화된다.
  function saveDocuments(list){
    writeArr(DOC_KEY, list);
    try{ if(window.SHIN2_CRM_DOCS_SYNC && window.SHIN2_CRM_DOCS_SYNC.push) window.SHIN2_CRM_DOCS_SYNC.push(list); }catch(e){}
  }
  function documentsForCompany(companyId, type){
    return loadDocuments().filter(d=> d.companyId === companyId && (!type || d.documentType === type))
      .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }
  function findDocument(id){ return loadDocuments().find(d=> d.id === id) || null; }
  // 공용 자료실(읽기 전용 참조, §13) — v2 SHIN2_LIBRARY와 완전히 같은 키를 읽기만 한다.
  function loadLibraryDocs(){ return readArr(LIB_KEY); }
  function findLibraryDoc(id){ return loadLibraryDocs().find(d=> d.id === id) || null; }
  const DOC_MAX_LOCAL_BYTES = 2 * 1024 * 1024; // 2MB — 로컬 dataURL 폴백에만 적용되는 상한(localStorage 용량 한계 때문).
  // 클라우드(Storage) 업로드 경로는 로컬 저장 용량 문제가 없지만, 완전 무제한도 아니다
  // (§9 — "무제한은 아니되" 요청). 20MB는 요청서의 제안값을 그대로 채택했다.
  const DOC_MAX_CLOUD_BYTES = 20 * 1024 * 1024;
  // 허용 파일 종류(§10) — PDF/JPG/JPEG/PNG/WEBP는 필수, 오피스 문서(XLSX/XLS/DOCX/HWP 등)는
  // 이미 질문서/물품공급계약서 카테고리의 accept 속성이 문서 파일을 받고 있었으므로(§실제 서류함
  // 단순화 라운드) 안전하게 허용 목록에 포함했다. 실행파일 등은 목록에 없으므로 거부된다.
  const DOC_ALLOWED_EXT = ['pdf','jpg','jpeg','png','webp','xlsx','xls','docx','doc','hwp','hwpx'];
  function isAllowedDocFile(file){
    const name = String((file && file.name) || '').toLowerCase();
    const dot = name.lastIndexOf('.');
    const ext = dot >= 0 ? name.slice(dot+1) : '';
    return DOC_ALLOWED_EXT.indexOf(ext) !== -1;
  }
  // currentUserLabel: uploadedBy 기록용. v2의 SHIN2_USER가 쓰는 것과 완전히 같은 localStorage
  // 키(shin2-active-user-id)를 읽기만 한다 — CRM은 별도 로그인 개념이 없으므로, 이미 존재하는
  // "지금 이 브라우저에서 선택된 사용자 1/2/3" 값을 그대로 재사용한다(새 로그인/식별 체계를
  // 만들지 않음). 이 키가 없으면(v2를 한 번도 안 연 기기 등) 기존 관례대로 '1'을 기본값으로 쓴다.
  function currentUserLabel(){
    let uid = '1';
    try{ uid = localStorage.getItem('shin2-active-user-id') || '1'; }catch(e){}
    return '사용자 ' + uid;
  }
  function dataUrlToFileRec(dataUrl, fileName){
    return new Promise((resolve, reject)=>{
      try{
        const commaIdx = dataUrl.indexOf(',');
        const meta = dataUrl.slice(0, commaIdx);
        const isBase64 = /;base64/.test(meta);
        const mimeMatch = /^data:([^;]*)/.exec(meta);
        const mime = (mimeMatch && mimeMatch[1]) || 'application/octet-stream';
        const raw = dataUrl.slice(commaIdx + 1);
        const bin = isBase64 ? atob(raw) : decodeURIComponent(raw);
        const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        resolve(new File([arr], fileName || 'file', { type: mime }));
      }catch(e){ reject(e); }
    });
  }

  // saveDocumentFile: 실제 파일 바이트를 저장하는 유일한 진입점(§ Storage 연결 라운드).
  // window.SHIN2_STORAGE(로그인 상태)가 있으면 클라우드 업로드를 먼저 시도하고, 없거나
  // opts.forceLocal이면 기존 로컬 전용 blob 저장소(dataURL)에 쓴다. 업로드/저장이 "성공"한
  // 뒤에만 resolve되므로, 호출부(addDocument)는 실패한 파일의 메타데이터를 절대 만들지 않는다.
  // 반환: Promise<{ localOnly, storagePath, dataUrl }> — dataUrl은 localOnly일 때만 채워진다.
  function saveDocumentFile(id, companyId, file, onProgress, opts){
    opts = opts || {};
    const ST = window.SHIN2_STORAGE;
    const useCloud = !opts.forceLocal && ST && ST.isSignedIn && ST.isSignedIn();
    if(useCloud){
      if(file.size > DOC_MAX_CLOUD_BYTES){
        return Promise.reject(Object.assign(new Error('SIZE_LIMIT_CLOUD'), { code:'SIZE_LIMIT_CLOUD' }));
      }
      const path = `users/${ST.getUid()}/customers/${companyId}/documents/${id}/${file.name}`;
      return ST.uploadFile(file, path, onProgress).then(res=> ({ localOnly:false, storagePath: res.storagePath, dataUrl:null }));
    }
    // 로컬 전용 폴백 — Storage 미로그인이거나 사용자가 명시적으로 "이 기기에만 저장"을 선택한
    // 경우에만 여기로 온다.
    return new Promise((resolve, reject)=>{
      if(file.size > DOC_MAX_LOCAL_BYTES){
        reject(Object.assign(new Error('SIZE_LIMIT'), { code:'SIZE_LIMIT' }));
        return;
      }
      const reader = new FileReader();
      reader.onprogress = (e)=>{ if(onProgress && e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
      reader.onload = ()=>{ if(onProgress) onProgress(100); resolve({ localOnly:true, storagePath: 'local:' + id, dataUrl: reader.result }); };
      reader.onerror = ()=> reject(reader.error || Object.assign(new Error('READ_FAILED'), { code:'READ_FAILED' }));
      reader.readAsDataURL(file);
    });
  }
  // addDocument: OCR 등 부가 처리와 완전히 독립적으로 "파일 저장(성공)→메타데이터 기록" 순서만
  // 지킨다(§8 OCR/파일저장 분리는 그대로 유지 — 이 함수 자체가 OCR을 전혀 모른다).
  function addDocument(companyId, documentType, file, onProgress, extracted, opts){
    // §10 허용 파일 종류 검증 — Storage 업로드/로컬 저장을 시도하기 전에 먼저 거부한다
    // (실행파일 등 원치 않는 종류가 아예 저장 시도조차 되지 않도록).
    if(!isAllowedDocFile(file)){
      return Promise.reject(Object.assign(new Error('FILE_TYPE'), { code:'FILE_TYPE' }));
    }
    const id = genId('doc');
    return saveDocumentFile(id, companyId, file, onProgress, opts).then(result=>{
      if(result.dataUrl){
        const blobs = readObj(BLOB_KEY);
        blobs[id] = result.dataUrl;
        writeObj(BLOB_KEY, blobs);
      }
      const now = nowIso();
      const rec = {
        id, companyId, documentType,
        fileName: file.name, originalFileName: file.name, // originalFileName은 업로드 이후 절대 바꾸지 않는다 — fileName만 "이름변경"으로 바뀔 수 있다.
        storagePath: result.storagePath,
        mimeType: file.type || '', size: file.size || 0, fileSize: file.size || 0, memo:'',
        createdAt: now, updatedAt: now, uploadedAt: now, uploadedBy: currentUserLabel(),
        localOnly: result.localOnly // true면 이 기기에만 파일 바이트가 있음, false면 Storage 업로드 완료
      };
      if(extracted){
        rec.extractedContactName = extracted.contactName && extracted.contactName.value || '';
        rec.extractedPosition = extracted.position && extracted.position.value || '';
        rec.extractedPhone = extracted.phone && extracted.phone.value || '';
        rec.extractedMobile = '';
        rec.extractedEmail = extracted.email && extracted.email.value || '';
        rec.extractedCompanyName = extracted.name && extracted.name.value || '';
        rec.rawOcrText = extracted.rawOcrText || '';
      }
      const list = loadDocuments(); list.push(rec); saveDocuments(list);
      return rec;
    });
  }
  function updateDocumentExtracted(id, extracted){
    // OCR은 저장 이후의 부가 결과일 뿐이다(§8) — 이미 저장된 파일/메타데이터를 지우거나 바꾸지 않고 추출필드만 덧붙인다.
    const list = loadDocuments(); const rec = list.find(d=> d.id===id); if(!rec) return null;
    if(extracted){
      rec.extractedContactName = extracted.contactName && extracted.contactName.value || '';
      rec.extractedPosition = extracted.position && extracted.position.value || '';
      rec.extractedPhone = extracted.phone && extracted.phone.value || '';
      rec.extractedMobile = '';
      rec.extractedEmail = extracted.email && extracted.email.value || '';
      rec.extractedCompanyName = extracted.name && extracted.name.value || '';
      rec.rawOcrText = extracted.rawOcrText || '';
    }
    rec.updatedAt = nowIso();
    saveDocuments(list);
    return rec;
  }
  function getBlob(id){ const blobs = readObj(BLOB_KEY); return blobs[id] || ''; }
  function renameDocument(id, fileName){
    const list = loadDocuments(); const rec = list.find(d=> d.id===id); if(!rec) return;
    rec.fileName = fileName; rec.updatedAt = nowIso(); saveDocuments(list);
  }
  function setDocumentMemo(id, memo){
    const list = loadDocuments(); const rec = list.find(d=> d.id===id); if(!rec) return;
    rec.memo = memo; rec.updatedAt = nowIso(); saveDocuments(list);
  }
  function deleteDocument(id){
    // companyId로만 연결되어 있으므로(§9) 이 id 하나만 지우면 같은 회사의 다른 문서,
    // 다른 회사의 문서 모두 영향 없음 — 메타데이터와 blob을 함께, 그리고 이것만 지운다.
    const rec = findDocument(id);
    saveDocuments(loadDocuments().filter(d=> d.id !== id));
    const blobs = readObj(BLOB_KEY);
    delete blobs[id];
    writeObj(BLOB_KEY, blobs);
    // §11: 메타데이터를 지운 뒤 실제 Storage 파일도 함께 지운다(클라우드 문서일 때만).
    // 메타데이터 삭제(화면/다른 직원에게 즉시 반영되어야 함)를 이 네트워크 요청 때문에
    // 지연시키지 않는다 — best-effort로 뒤따라 지우고, 실패해도 콘솔 경고만 남긴다
    // (이미 메타데이터가 없으므로 다른 직원 화면에는 더 이상 이 파일이 보이지 않는다).
    if(rec && rec.localOnly === false && rec.storagePath){
      const ST = window.SHIN2_STORAGE;
      if(ST && ST.deleteFile){
        ST.deleteFile(rec.storagePath).catch(e=> console.warn('[CRM] Storage 파일 삭제 실패(메타데이터는 이미 삭제됨)', e));
      }
    }
  }
  // migrateDocumentToCloud: §15 "기존 로컬 전용 파일 보호 — 자동 마이그레이션 금지" 원칙에
  // 따라, 사용자가 명시적으로 [공용으로 업로드] 버튼을 눌렀을 때만 호출된다. 같은 문서 id의
  // 레코드를 그대로 유지한 채(§ 새 레코드를 만들지 않음 — 메모/추출정보 등 기존 필드 보존)
  // storagePath/localOnly만 클라우드 업로드 성공 후에 갱신한다. 업로드 실패 시 기존 로컬
  // 파일은 전혀 건드리지 않는다(reject만 하고 아무것도 바꾸지 않음).
  function migrateDocumentToCloud(id, onProgress){
    const ST = window.SHIN2_STORAGE;
    if(!ST || !ST.isSignedIn || !ST.isSignedIn()){
      return Promise.reject(Object.assign(new Error('NOT_AUTHENTICATED'), { code:'NOT_AUTHENTICATED' }));
    }
    const rec = findDocument(id);
    if(!rec) return Promise.reject(Object.assign(new Error('NOT_FOUND'), { code:'NOT_FOUND' }));
    const blobs = readObj(BLOB_KEY);
    const dataUrl = blobs[id];
    if(!dataUrl) return Promise.reject(Object.assign(new Error('NO_BLOB'), { code:'NO_BLOB' }));
    return dataUrlToFileRec(dataUrl, rec.fileName || rec.originalFileName).then(file=>{
      if(file.size > DOC_MAX_CLOUD_BYTES){
        return Promise.reject(Object.assign(new Error('SIZE_LIMIT_CLOUD'), { code:'SIZE_LIMIT_CLOUD' }));
      }
      const path = `users/${ST.getUid()}/customers/${rec.companyId}/documents/${id}/${file.name}`;
      return ST.uploadFile(file, path, onProgress).then(res=>{
        const list = loadDocuments();
        const rec2 = list.find(d=> d.id===id);
        if(!rec2) return null;
        rec2.storagePath = res.storagePath;
        rec2.localOnly = false;
        rec2.updatedAt = nowIso();
        saveDocuments(list);
        const blobs2 = readObj(BLOB_KEY);
        delete blobs2[id];
        writeObj(BLOB_KEY, blobs2);
        return rec2;
      });
    });
  }

  // ---- memos (공용 컴포넌트 재사용 — targetType 'company', v2의 SHIN2_MEMO와 완전히 동일한 스키마) ----
  function loadMemos(){ return readArr(MEMO_KEY); }
  function saveMemos(list){ writeArr(MEMO_KEY, list); }
  function memosFor(companyId){
    return loadMemos().filter(m=> m.targetType==='company' && String(m.targetId)===String(companyId))
      .sort((a,b)=> (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt));
  }
  function addMemo(companyId, text){
    const now = Date.now();
    const list = loadMemos();
    list.push({ id: genId('memo'), targetType:'company', targetId:String(companyId), text, createdAt: now, updatedAt: now });
    saveMemos(list);
  }
  function updateMemo(id, text){
    const list = loadMemos(); const rec = list.find(m=> m.id===id); if(!rec) return;
    rec.text = text; rec.updatedAt = Date.now(); saveMemos(list);
  }
  function deleteMemo(id){ saveMemos(loadMemos().filter(m=> m.id !== id)); }

  // ---- 다음 할 일: customerActivities의 status:'pending'(전화기록 미처리, v2 496501d) +
  // shin2-tasks-v1의 companyId 연결 항목(!done) — 읽기 전용, v2가 쓰는 저장소를 그대로 재조회만
  // 한다(§ 새 저장소를 만들지 않는다). shin2-todos(개인 체크리스트)는 companyId 필드가 아예
  // 없어서(v2 §2363~2367 주석 확인) 여기 포함하지 않는다.
  const TASK_KEY = 'shin2-tasks-v1';
  const CAL_KEY = 'shin2-calendar-events-v1';
  function pendingActivitiesForCompany(companyId){
    // rec.status||'completed' 규약(v2 pendingStatusOf와 동일) — status 필드가 없는 레거시
    // 레코드는 절대 미처리로 취급하지 않는다.
    return activitiesForCompany(companyId).filter(a=> (a.status || 'completed') === 'pending');
  }
  function tasksForCompany(companyId){
    return readArr(TASK_KEY).filter(t=> t.companyId === companyId && !t.done)
      .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  }
  function calendarEventsForCompany(companyId){
    return readArr(CAL_KEY).filter(ev=> ev.companyId === companyId)
      .sort((a,b)=> String(a.date||'')+String(a.time||'') > String(b.date||'')+String(b.time||'') ? 1 : -1);
  }
  function upcomingCalendarEventsForCompany(companyId){
    const today = new Date(); today.setHours(0,0,0,0);
    return calendarEventsForCompany(companyId).filter(ev=>{
      if(!ev.date) return false;
      const d = new Date(ev.date + 'T' + (ev.time || '00:00'));
      return !isNaN(d) && d >= today;
    });
  }

  // ---- 고객 차트 신규 필드(모두 companies 레코드에 추가형 필드로 — 읽는 시점 기본값 패턴,
  // 기존 레코드에 필드가 없어도 항상 빈 배열/빈 문자열로 취급된다) ----
  const DEAL_STAGES = ['협약 전','질문서 발송','1차 미팅','협약','영업 진행','현장 등록','입찰 준비','공사 진행'];

  // 무관한 신규 필드. 이 값이 설정된 업체만 진행단계 자동 할 일이 생성된다.

  // ---- 고객 니즈 제안(규칙 기반 — AI 미사용): 최근 활동 텍스트에서 같은 단어가 반복되면
  // "[니즈에 추가]"로만 제안한다. 사용자가 직접 누르기 전에는 절대 needs 배열에 들어가지 않는다.
  const NEEDS_STOPWORDS = new Set(['전화','문의','확인','요청','관련','있음','없음','완료','진행','업체','고객','대해','부분']);
  function suggestNeedFor(companyId){
    const co = findCompany(companyId); if(!co) return null;
    const acts = activitiesForCompany(companyId).slice(0, 8);
    if(acts.length < 3) return null;
    const counts = {};
    acts.forEach(a=>{
      const text = String(a.activityText || a.originalText || '');
      const tokens = new Set((text.match(/[가-힣a-zA-Z0-9]{2,}/g) || []));
      tokens.forEach(tok=>{
        if(NEEDS_STOPWORDS.has(tok)) return;
        counts[tok] = (counts[tok] || 0) + 1;
      });
    });
    const existingText = (co.needs || []).map(n=> n.text).join(' ');
    const dismissed = co.needsDismissed || [];
    let best = null;
    Object.keys(counts).forEach(tok=>{
      if(counts[tok] < 3) return;
      if(dismissed.includes(tok)) return;
      if(existingText.includes(tok)) return;
      if(!best || counts[tok] > best.count) best = { key: tok, count: counts[tok] };
    });
    return best;
  }

  // ---- 고객 이해용 요약정보(§ 고객 니즈/영업 핵심정보 구조 개선 라운드) — 전부 companies
  // 레코드에 추가형 필드로만 얹는다(기존 필드/저장 위치는 절대 건드리지 않음). 값은 전부
  // 사용자가 직접 입력한 텍스트일 뿐 AI가 자동 생성하지 않는다 — "근거 없는 평가/추측 금지"
  // 원칙을 코드가 아니라 "입력 자체를 사람이 한다"는 방식으로 지킨다. 각 항목은 evidence(근거,
  // 선택)를 함께 저장할 수 있어 화면에서 [근거 보기]로만 노출한다(§13).
  function addWhyPour(companyId, text, evidence){

  // coreNeeds: {expand,tech,profit} 세 칸 — 항목별로 비어있으면 화면에서 "미확인"으로 취급(§5).
  function setCoreNeed(companyId, key, text){

  // customerQuestions: 고객이 실제로 한 질문 원문(§8 — meetingChecklist와 역할 분리). §고객
  // 니즈 기반 영업지원 CRM 라운드에서 category/status/자료연결/출처 필드로 확장한다 — 기존
  // 항목(§고객 니즈/영업 핵심정보 라운드에서 만든 {id,text,evidence,createdAt})은 그대로 두고,
  // 새 필드는 읽는 시점에 기본값(카테고리 '기타', status '미답변')으로 취급한다(마이그레이션 없음).
  const QUESTION_CATEGORIES = ['조달','가격/단가','수익/마진','실행공사/계약','영업지원','공종/제품','실적','자료','타 공법','기타'];
  const QUESTION_STATUSES = ['미답변','확인중','답변완료','자료발송','추가확인'];
  function normQuestionText(s){ return String(s || '').replace(/\s+/g, '').toLowerCase(); }
  // fields: {text, category, evidence, sourceType('manual'|'memo-parse'), sourceId}
  function addCustomerQuestion(companyId, fields){
    const co = findCompany(companyId); if(!co) return null;
    const list = (co.customerQuestions || []).slice();
    list.push({
      id: genId('cq'), text: fields.text, category: fields.category || '기타',
      status: '미답변', evidence: fields.evidence || '',
      customerDocumentId: null, libraryMaterialId: null,
      sourceType: fields.sourceType || 'manual', sourceId: fields.sourceId || null,
      createdAt: nowIso(), resolvedAt: null
    });
    return updateCompany(companyId, { customerQuestions: list });
  }
  // §23 질문 누적/중복 방지 — 자동정리가 같은 질문을 다시 만들지 않도록, 정규화한 텍스트가
  // 이미 있으면 아무것도 하지 않고 null을 반환한다(수동 추가에는 쓰지 않음 — 사람이 같은 말을
  // 두 번 입력하고 싶을 수도 있어 강제하지 않는다).
  function addCustomerQuestionIfNew(companyId, fields){
    const co = findCompany(companyId); if(!co) return null;
    const exists = (co.customerQuestions || []).some(q=> normQuestionText(q.text) === normQuestionText(fields.text));
    if(exists) return null;
    return addCustomerQuestion(companyId, fields);
  }
  function removeCustomerQuestion(companyId, itemId){
    const co = findCompany(companyId); if(!co) return null;
    return updateCompany(companyId, { customerQuestions: (co.customerQuestions||[]).filter(x=> x.id !== itemId) });
  }
  function setQuestionStatus(companyId, questionId, status){
    const co = findCompany(companyId); if(!co) return null;
    const list = (co.customerQuestions || []).slice();
    const q = list.find(x=> x.id === questionId); if(!q) return null;
    q.status = status;
    if(status === '답변완료' || status === '자료발송') q.resolvedAt = nowIso();
    return updateCompany(companyId, { customerQuestions: list });
  }
  // links: {customerDocumentId} 그리고/또는 {libraryMaterialId} — 파일 자체를 복제하지 않고
  // 기존 저장소(고객별 서류함 customerDocuments / 공용 자료실 library)의 id만 참조한다(§13).
  function linkQuestionDocument(companyId, questionId, links){
    const co = findCompany(companyId); if(!co) return null;
    const list = (co.customerQuestions || []).slice();
    const q = list.find(x=> x.id === questionId); if(!q) return null;
    if('customerDocumentId' in links) q.customerDocumentId = links.customerDocumentId || null;
    if('libraryMaterialId' in links) q.libraryMaterialId = links.libraryMaterialId || null;
    return updateCompany(companyId, { customerQuestions: list });

  // meetingChecklist: 다음 미팅에서 우리가 답변/확인해야 할 것(§8 — customerQuestions와 역할 분리).
  function addMeetingChecklistItem(companyId, text, evidence){

  // nextActions: §고객 니즈 기반 영업지원 CRM 라운드 — 완료 처리(done/completedAt)를 추가한다.
  // 완료된 항목은 "다음 행동" 활성 목록에서는 빠지지만 배열에서 삭제하지 않고, 완료 사실을
  // customerActivities에도 기록해 활동/완료이력에 남긴다(§9 — 새 저장소를 만들지 않고 기존

  /* ================================================================
     요청 자료(§ 업체 업무 차트 라운드) — 전화 통화 중 들어오는 자료 요청(단가표/시방서/
     실적자료/카탈로그/특허자료/시험성적서/협약업체리스트/MSDS)을 업체별로 추적한다.
     co.requestedMaterials[]에 {id,materialType,status,evidence,sourceType,sourceActivityId,
     createdAt} 형태로 저장 — 새 저장소를 만들지 않고 기존 companies 레코드에 추가형 필드로만
     얹는다. sourceType은 'manual'(직원이 직접 추가) 또는 'call-extract'(전화기록 원문에서
     규칙 기반으로 자동 추출)이다.
     ================================================================ */
  const REQUESTED_MATERIAL_TYPES = ['단가표','시방서','실적자료','카탈로그','특허자료','시험성적서','협약업체리스트','MSDS'];
  const REQUESTED_MATERIAL_STATUSES = ['요청','준비중','발송완료'];
  function addRequestedMaterial(companyId, fields){
    const co = findCompany(companyId); if(!co) return null;
    const list = (co.requestedMaterials || []).slice();
    list.push({
      id: genId('rm'), materialType: fields.materialType, status: '요청',
      evidence: fields.evidence || '', sourceType: fields.sourceType || 'manual',
      sourceActivityId: fields.sourceActivityId || null, createdAt: nowIso()
    });
    return updateCompany(companyId, { requestedMaterials: list });
  }
  function removeRequestedMaterial(companyId, itemId){
    const co = findCompany(companyId); if(!co) return null;
    return updateCompany(companyId, { requestedMaterials: (co.requestedMaterials||[]).filter(x=> x.id !== itemId) });
  }
  function setRequestedMaterialStatus(companyId, itemId, status){
    const co = findCompany(companyId); if(!co) return null;
    const list = (co.requestedMaterials || []).slice();
    const rec = list.find(x=> x.id === itemId); if(!rec) return null;
    rec.status = status;
    return updateCompany(companyId, { requestedMaterials: list });
  }
  // 같은 전화기록(activityId)에서 같은 자료종류를 이미 추출했으면 다시 만들지 않는다(§ 중복
  // 생성 방지, 멱등 — 카드를 여러 번 열어도 안전).
  function addRequestedMaterialIfNew(companyId, fields){
    const co = findCompany(companyId); if(!co) return null;
    const exists = (co.requestedMaterials || []).some(x=>
      x.materialType === fields.materialType && x.sourceActivityId === fields.sourceActivityId);
    if(exists) return null;
    return addRequestedMaterial(companyId, fields);
  }
  const REQUEST_MATERIAL_KEYWORDS = {
    '단가표': ['단가표','가격표'], '시방서': ['시방서'], '실적자료': ['실적자료','시공실적'],
    '카탈로그': ['카탈로그'], '특허자료': ['특허자료','특허증'], '시험성적서': ['시험성적서','성적서'],
    '협약업체리스트': ['협약업체','협력업체 리스트'], 'MSDS': ['msds']
  };
  // "단가 관련 이야기함"처럼 자료명만 언급된 경우를 요청으로 오판하지 않도록, 명확한
  // 요청 표현이 같은 문장에 함께 있을 때만 추출한다(§15).
  const REQUEST_INDICATOR_RE = /(요청|보내달라|보내주세요|보내줘|보내달라고|메일로|메일 요청|필요하다고|필요하다함|필요해서|달라고|요청함|요청드림|요청하심|요청 들어옴|요청이 들어옴)/;
  function splitIntoSentences(text){
    return String(text || '')
      .split(/\n+/)
      .reduce((acc, line)=> acc.concat(line.split(/(?<=[.?!])\s+/)), [])
      .map(s=> s.trim())
      .filter(s=> s.length >= 2);
  }
  // 이 업체의 전화기록(customerActivities) 원문(originalText — 절대 수정하지 않음, §16)을
  // 훑어서 명확한 자료 요청만 뽑아 requestedMaterials에 추가한다. 카드를 열 때마다 호출해도
  // addRequestedMaterialIfNew의 중복 방지 덕분에 안전하다.
  function extractRequestedMaterialsFromActivities(companyId){
    const acts = activitiesForCompany(companyId);
    const added = [];
    acts.forEach(a=>{
      const text = a.originalText || a.activityText || '';
      splitIntoSentences(text).forEach(s=>{
        if(!REQUEST_INDICATOR_RE.test(s)) return;
        const low = s.toLowerCase();
        REQUESTED_MATERIAL_TYPES.forEach(mt=>{
          const kws = REQUEST_MATERIAL_KEYWORDS[mt];
          if(kws.some(kw=> low.includes(kw.toLowerCase()))){
            const rec = addRequestedMaterialIfNew(companyId, { materialType: mt, evidence: s, sourceType:'call-extract', sourceActivityId: a.id });
            if(rec) added.push(rec);
          }
        });
      });
    });
    return added;
  }

  /* ================================================================
     Partner Dashboard 이관(§ Partner Dashboard 이관 라운드) — window.SHIN2_PARTNER_SNAPSHOT
     (실제 원본에서 추출해 다른 스크립트에 읽기 전용으로 embed된 스냅샷, 348개 업체)를 현재
     companies와 매칭해서 안전하게 병합/신규생성한다.

     절대 원칙:
     - company.id는 절대 바꾸지 않는다(기존 업체는 updateCompany로만 patch — id는 그대로).
     - 기존 값이 있는 필드는 절대 덮어쓰지 않는다(항상 onlyFillEmpty:true로만 병합).
     - 매칭이 애매하면(동일 정규화 이름/전화번호가 CRM에 여러 건이거나, 담당자+업체명 유사
       수준일 뿐 확정할 수 없으면) 자동 병합하지 않고 "검토 필요" 목록으로만 분류한다 —
       previewPartnerImport()가 계산만 하고, applyPartnerImport()는 review 항목을 절대
       저장하지 않는다(사람이 나중에 직접 처리).
     - 매칭 우선순위: ①사업자등록번호(양쪽에 실제 값이 있을 때만) ②정규화한 업체명 완전일치
       ③전화번호 ④담당자(대표자)명 일치+업체명 일부 유사 — 이건 확정 매칭이 아니라 항상
       "검토 필요"로만 분류한다(자동 병합 금지).
     ================================================================ */
  function normCompanyName(s){
    if(!s) return '';
    let t = String(s).replace(/\(주\)|㈜|주식회사/g, '');
    t = t.replace(/[\s()\[\]㈱·\-_,.]/g, '');
    return t.trim().toLowerCase();
  }
  function normBizNo(s){ return String(s || '').replace(/[^0-9]/g, ''); }
  function normPhone(s){ return String(s || '').replace(/[^0-9]/g, ''); }

  function matchPartnerToCompany(partner, companies){
    if(partner.bizno){
      const nb = normBizNo(partner.bizno);
      if(nb){
        const hits = companies.filter(c=> c.bizRegNo && normBizNo(c.bizRegNo) === nb);
        if(hits.length === 1) return { company: hits[0], matchedBy: 'bizno' };
        if(hits.length > 1) return { ambiguous: true, reason: '동일 사업자번호의 CRM 업체가 여러 건', candidates: hits };
      }
    }
    const pn = normCompanyName(partner.name);
    if(pn){
      const hits = companies.filter(c=> normCompanyName(c.name) === pn);
      if(hits.length === 1) return { company: hits[0], matchedBy: 'name' };
      if(hits.length > 1) return { ambiguous: true, reason: '동일 정규화 업체명의 CRM 업체가 여러 건', candidates: hits };
    }
    if(partner.phone){
      const np = normPhone(partner.phone);
      if(np){
        const hits = companies.filter(c=> (c.phone && normPhone(c.phone) === np) || (c.mobile && normPhone(c.mobile) === np));
        if(hits.length === 1) return { company: hits[0], matchedBy: 'phone' };
        if(hits.length > 1) return { ambiguous: true, reason: '동일 전화번호의 CRM 업체가 여러 건', candidates: hits };
      }
    }
    if(partner.ceo && pn){
      const hits = companies.filter(c=> c.repName && c.repName === partner.ceo &&
        (normCompanyName(c.name).includes(pn.slice(0,3)) || pn.includes(normCompanyName(c.name).slice(0,3))));
      if(hits.length) return { ambiguous: true, reason: '담당자(대표자)명 일치 + 업체명 일부 유사(자동 병합 안 함)', candidates: hits };
    }
    return { noMatch: true };
  }

  function buildPartnerDashboardMeta(partner, matchedBy){
    const meta = { source: 'partner-dashboard', sourceCompanyName: partner.name, matchedBy, importedAt: nowIso() };
    ['region','mouDate','code','capital','note','grade','gradeSales','gradeHistory','newMou'].forEach(k=>{
      if(partner[k] !== undefined) meta[k] = partner[k];
    });
    return meta;
  }

  // previewPartnerImport: 아무것도 저장하지 않는 순수 분석 함수 — 분류 결과만 반환한다.
  function previewPartnerImport(){
    const snapshot = window.SHIN2_PARTNER_SNAPSHOT || [];
    const companies = loadCompanies();
    const matched = [], newCompanies = [], review = [];
    snapshot.forEach(p=>{
      const r = matchPartnerToCompany(p, companies);
      if(r.company) matched.push({ partner: p, companyId: r.company.id, companyName: r.company.name, matchedBy: r.matchedBy });
      else if(r.ambiguous) review.push({ partner: p, reason: r.reason, candidates: (r.candidates||[]).map(c=> ({ id: c.id, name: c.name })) });
      else newCompanies.push({ partner: p });
    });
    return { total: snapshot.length, matched, newCompanies, review };
  }

  // applyPartnerImport: preview()가 분류한 matched/newCompanies만 저장한다(review는 절대
  // 자동 처리하지 않음). 기존 업체는 onlyFillEmpty로만 병합, 신규 업체는 원본에 실제 존재하는
  // 필드만 채워 최소 생성한다. 같은 데이터로 다시 실행해도 안전하다(재현 가능/멱등) — 이미
  // 채워진 필드는 다시 덮어쓰지 않고, 신규 생성된 업체는 다음 실행에서 bizRegNo/이름으로 곧바로
  // 매칭되어 중복 생성되지 않는다.
  function applyPartnerImport(){
    const preview = previewPartnerImport();
    preview.matched.forEach(m=>{
      const p = m.partner;
      const patch = {};
      if(p.ceo) patch.repName = p.ceo;
      if(p.phone) patch.phone = p.phone;
      if(p.fax) patch.fax = p.fax;
      if(p.email) patch.email = p.email;
      if(p.address) patch.address = p.address;
      if(p.bizno) patch.bizRegNo = p.bizno;
      if(Object.keys(patch).length) updateCompany(m.companyId, patch, { onlyFillEmpty: true });
      updateCompany(m.companyId, { partnerStatus: 'partner' }, { onlyFillEmpty: true });
      updateCompany(m.companyId, { partnerDashboard: buildPartnerDashboardMeta(p, m.matchedBy) });
    });
    preview.newCompanies.forEach(n=>{
      const p = n.partner;
      const fields = { name: p.name, partnerStatus: 'partner', partnerDashboard: buildPartnerDashboardMeta(p, 'new') };
      if(p.ceo) fields.repName = p.ceo;
      if(p.phone) fields.phone = p.phone;
      if(p.fax) fields.fax = p.fax;
      if(p.email) fields.email = p.email;
      if(p.address) fields.address = p.address;
      if(p.bizno) fields.bizRegNo = p.bizno;
      addCompany(fields);
    });
    return { mergedCount: preview.matched.length, createdCount: preview.newCompanies.length, reviewCount: preview.review.length, review: preview.review };
  }

  /* ==========================================================================
     POUR 시공실적 연결(§POUR 시공실적 라운드) — SHIN2_POUR_TRACK_RECORD_SNAPSHOT(엑셀에서
     한 번만 추출해 embed된 원본 값)을 현재 CRM companies와 "정규화된 업체명 완전일치"로만
     연결한다. Partner Dashboard 이관과 같은 안전 원칙을 그대로 따른다:
     - company.id는 절대 바꾸지 않는다.
     - 새 CRM 업체를 만들지 않는다 — 이 엑셀은 어디까지나 "기존 업체의 과거 실적"을 보여주기
       위한 것이지 업체목록 소스가 아니다(요청 §17/§23 — 없는 업체명을 CRM에 만들어내지 않음).
     - 정규화 후에도 CRM에 같은 이름의 업체가 여러 건이면 자동 연결하지 않고 "검토 필요"로만
       분류한다(부분일치 자동 병합 금지, §4/§5).
     - 실적은 회사별로 그룹핑해서 한 번에 co.pourTrackRecords에 append-only로 병합한다 —
       이미 들어있는 sourceRecordId는 다시 추가하지 않는다(§20 중복 방지, 재실행/최신 엑셀
       교체 모두 안전).
     ========================================================================== */
  function normCompanyNameForPour(s){ return normCompanyName(s); } // 매칭 규칙 재사용(§2/§3)

  // previewPourTrackImport: 아무것도 저장하지 않는 순수 분석. 엑셀 스냅샷을 정규화 업체명으로
  // 그룹핑한 뒤, 그룹당 CRM 업체 매칭을 1번만 수행한다(레코드 1149건이 아니라 업체 170개 기준).
  function previewPourTrackImport(){
    const snapshot = window.SHIN2_POUR_TRACK_RECORD_SNAPSHOT || [];
    const companies = loadCompanies();
    const groups = new Map(); // normName -> { sampleName, records: [] }
    snapshot.forEach(rec=>{
      const norm = normCompanyNameForPour(rec.company);
      if(!norm) return;
      if(!groups.has(norm)) groups.set(norm, { sampleName: rec.company, records: [] });
      groups.get(norm).records.push(rec);
    });
    const matched = [], review = [], unmatched = [];
    groups.forEach((g, norm)=>{
      const hits = companies.filter(c=> normCompanyNameForPour(c.name) === norm);
      if(hits.length === 1) matched.push({ companyId: hits[0].id, companyName: hits[0].name, excelName: g.sampleName, records: g.records });
      else if(hits.length > 1) review.push({ reason: '동일 정규화 업체명의 CRM 업체가 여러 건', excelName: g.sampleName, candidates: hits.map(c=> ({ id:c.id, name:c.name })), recordCount: g.records.length });
      else unmatched.push({ excelName: g.sampleName, recordCount: g.records.length });
    });
    return {
      totalRecords: snapshot.length, totalCompanies: groups.size,
      matched, review, unmatched,
      matchedRecordCount: matched.reduce((s,m)=> s + m.records.length, 0)
    };
  }

  // applyPourTrackImport: preview()가 분류한 matched만 저장한다(review/unmatched는 절대
  // 자동 처리하지 않음). 기존 co.pourTrackRecords는 절대 지우거나 덮어쓰지 않고, 없는
  // sourceRecordId만 append한다 — 같은 스냅샷으로 다시 실행해도 중복이 생기지 않는다.
  function applyPourTrackImport(){
    const preview = previewPourTrackImport();
    let addedCount = 0;
    preview.matched.forEach(m=>{
      const co = findCompany(m.companyId);
      if(!co) return;
      const existing = co.pourTrackRecords || [];
      const existingIds = new Set(existing.map(r=> r.sourceRecordId));
      const toAdd = m.records.filter(r=> !existingIds.has(r.sourceRecordId));
      if(!toAdd.length) return;
      addedCount += toAdd.length;
      updateCompany(m.companyId, { pourTrackRecords: existing.concat(toAdd) });
    });
    return { companiesLinked: preview.matched.length, recordsAdded: addedCount, reviewCount: preview.review.length, review: preview.review, unmatchedCount: preview.unmatched.length, unmatched: preview.unmatched };
  }

  window.SHIN2_CRM_DATA = {
    loadCompanies, findCompany, addCompany, updateCompany,
    loadActivities, addActivity, updateActivityText, deleteActivity, activitiesForCompany, classifyActivity,
    loadDocuments, documentsForCompany, addDocument, updateDocumentExtracted, getBlob, renameDocument, setDocumentMemo, deleteDocument, findDocument, migrateDocumentToCloud,
    memosFor, addMemo, updateMemo, deleteMemo,
    pendingActivitiesForCompany, tasksForCompany, calendarEventsForCompany, upcomingCalendarEventsForCompany,
    DEAL_STAGES, setDealStage, setAssigneeUserId, addNeed, removeNeed, dismissNeedSuggestion, addSpecialNote, removeSpecialNote, setImportant, suggestNeedFor,
    addWhyPour, removeWhyPour, setCoreNeed, addKeyFactor, removeKeyFactor,
    QUESTION_CATEGORIES, QUESTION_STATUSES,
    addCustomerQuestion, addCustomerQuestionIfNew, removeCustomerQuestion, setQuestionStatus, linkQuestionDocument,
    addMeetingChecklistItem, removeMeetingChecklistItem,
    setSalesTendency, addNextAction, removeNextAction, completeNextAction,
    addBlocker, removeBlocker, addPourSupport, removePourSupport,
    addReaction, removeReaction, addRecommendedSupport, removeRecommendedSupport, setMemoSummary,
    loadLibraryDocs, findLibraryDoc,
    setLegacyBusiness, setTargetMarket, setPartnerContractor, setOtherMethods, setCustomerStatusNote,
    addCurrentSituation, removeCurrentSituation, addInterestField, removeInterestField,
    previewPartnerImport, applyPartnerImport,
    previewPourTrackImport, applyPourTrackImport,
    REQUESTED_MATERIAL_TYPES, REQUESTED_MATERIAL_STATUSES,
    addRequestedMaterial, removeRequestedMaterial, setRequestedMaterialStatus, extractRequestedMaterialsFromActivities
  };
})();
</script>

<script>
/* ==========================================================================
   자동정리 엔진(§ 고객 니즈 기반 영업지원 CRM 라운드) — 순수 함수(입력 텍스트 → 표준 결과
   객체)이며 localStorage/DOM/네트워크를 전혀 건드리지 않는다. 실제 저장은 항상 UI 레이어가
   사람의 확인(미리보기 → [적용])을 거친 뒤 SHIN2_CRM_DATA 함수를 호출해서만 이루어진다 —
   이 파일은 절대 직접 쓰지 않는다.

   교체 가능한 엔진 인터페이스: window.SHIN2_CRM_ANALYSIS.analyzeCustomerMemo가 현재 활성
   엔진을 가리킨다(지금은 ruleBasedAnalyzeCustomerMemo). 나중에 서버측 AI 분석이 필요해지면
   같은 표준 스키마를 반환하는 aiAnalyzeCustomerMemo(text)를 만들어 이 참조만 바꿔 끼우면
   되고, 고객카드 UI/저장 로직은 전혀 손댈 필요가 없다(§ 엔진 교체 가능 원칙). v2의
   SHIN2_AI.callOpenAI()는 이번 라운드에서 재사용하지 않는다(§ CRM과 v2를 억지로 결합하지
   않는다) — 이 모듈은 v2를 전혀 참조하지 않는다.

   원칙(§20/§21/§23): 원문에 없는 사실을 생성하지 않는다. "없음"과 "미확인"을 구분한다 —
   원문에 명시적 부정이 있을 때만 blockers/questions로 뽑고, 언급 자체가 없는 항목은 결과에
   아예 넣지 않는다(빈 배열 = 미확인, UI가 그렇게 표시한다). 질문을 예상해서 만들지 않는다 —
   실제 문장에서만 뽑는다. 결과는 항상 그 근거가 된 원문 문장(evidence)을 함께 반환한다.
   ========================================================================== */
window.SHIN2_CRM_ANALYSIS = (function(){
  'use strict';
  const QUESTION_CATEGORIES = ['조달','가격/단가','수익/마진','실행공사/계약','영업지원','공종/제품','실적','자료','타 공법','기타'];

  // 문장 분리 — 줄바꿈과 종결부호(. ? !) 기준. 너무 짧은 조각은 버린다(1글자 등 잡음 방지).
  function splitSentences(text){
    return String(text || '')
      .split(/\n+/)
      .reduce((acc, line)=> acc.concat(line.split(/(?<=[.?!])\s+/)), [])
      .map(s=> s.trim())
      .filter(s=> s.length >= 2);
  }

  const QUESTION_MARKERS = /(궁금|가능한지|가능할지|되는지|되나요|하나요|있는지|없는지|없나요|어떻게 되|어느 정도|문의|물어|여쭤|아닌지|않는지|질문)/;
  function looksLikeQuestion(s){
    return /[?？]\s*$/.test(s) || QUESTION_MARKERS.test(s);
  }

  const CATEGORY_KEYWORDS = {
    '조달': ['조달'],
    '가격/단가': ['가격','단가','입찰가'],
    '수익/마진': ['마진','수익','이윤'],
    '실행공사/계약': ['실행공사','실행비','하도급','계약','대금','시공지원','실행 지원','시공 지원'],
    '영업지원': ['pt','설명회','영업지원','영업 지원','스펙영업','스펙 영업'],
    '공종/제품': ['공종','제품','자재','아스팔트슁글','슁글'],
    '실적': ['실적'],
    '자료': ['자료','시방서','카탈로그','제안서'],
    '타 공법': ['타 공법','루프마스터','우레탄','타공법','병행']
  };
  function categorize(s){
    const low = s.toLowerCase();
    for(const cat of Object.keys(CATEGORY_KEYWORDS)){
      if(CATEGORY_KEYWORDS[cat].some(kw=> low.includes(kw.toLowerCase()))) return cat;
    }
    return '기타';
  }

  // "POUR가 해줘야 할 것"(§8)/"다음 행동"(§9)/"추천 지원"(§14~15) — 고객 질문을 그대로
  // 복사하지 않고 카테고리별로 우리 회사가 제공할 서비스/행동 형태로 바꾼다.
  const SUPPORT_TEMPLATE = {
    '조달':'조달 등록 현황 확인 및 안내', '가격/단가':'입찰 단가 및 가격지원 기준 안내',
    '수익/마진':'실행견적·예상 마진 검토', '실행공사/계약':'계약·대금 구조 및 실행 지원범위 안내',
    '영업지원':'관공사 설계반영 자료 및 PT 지원', '공종/제품':'적용 가능한 특허·기술자료 제공',
    '실적':'관련 실적자료 제공', '자료':'요청 자료 준비 및 제공', '타 공법':'타 공법 대비 비교자료 제공',
    '기타':'문의 내용 확인 및 안내'
  };
  const NEXT_ACTION_TEMPLATE = {
    '조달':'조달등록 현황 확인', '가격/단가':'단가 조정 기준 확인', '수익/마진':'실행비·마진 설명자료 준비',
    '실행공사/계약':'계약구조 답변 준비', '영업지원':'영업지원 자료 준비', '공종/제품':'적용 제품·기술자료 준비',
    '실적':'관련 실적자료 준비', '자료':'요청 자료 준비', '타 공법':'비교자료 준비', '기타':'문의 내용 확인'
  };
  const RECOMMEND_TAG = {
    '조달':'조달자료', '가격/단가':'단가표', '수익/마진':'마진 검토', '실행공사/계약':'실행견적',
    '영업지원':'PT 지원', '공종/제품':'공종별 실적', '실적':'공종별 실적', '자료':'표준자료',
    '타 공법':'비교자료', '기타':null
  };

  const WANT_MARKERS = ['확대','진출','키우고 싶','늘리고 싶','넓히고 싶','스펙 영업','스펙영업','희망','원함','추진'];
  const BLOCKER_MARKERS = ['안 돼','안돼','못했','문제','어려움','힘듦','막혀','불가'];
  const REACTION_MARKERS = ['긍정적','좋게 평가','관심 있','만족스럽','희망함','구체적으로 확인하고 싶'];
  const COMPETITOR_NAMES = ['루프마스터','우레탄','타공법','타 공법'];
  const BUSINESS_MARKERS = ['사업','업종','공사','시공','영업'];

  // ruleBasedAnalyzeCustomerMemo: 입력 텍스트 하나에서 표준 결과 객체를 만든다. 문장 하나는
  // 항상 한 카테고리로만 분류한다(질문 → 경쟁공법 비교 → 막히는 것 → 원하는 것 → 반응 →
  // 사업설명, 이 순서로 먼저 매칭되는 것을 채택 — 중복 분류로 같은 문장이 여러 섹션에 흩어져
  // 보이는 것을 막는다).
  function ruleBasedAnalyzeCustomerMemo(text){
    const sentences = splitSentences(text);
    const result = {
      summary: '', wants: [], blockers: [], pourSupports: [], nextActions: [],
      questions: [], reactions: [], salesStyle: null, recommendedSupports: []
    };
    const businessClauses = [];
    const wantClauses = [];
    const supportCatSeen = new Set();
    const actionCatSeen = new Set();
    const recommendSeen = new Set();

    sentences.forEach(s=>{
      if(looksLikeQuestion(s)){
        const cat = categorize(s);
        result.questions.push({ text: s, category: cat });
        if(!supportCatSeen.has(cat)){
          supportCatSeen.add(cat);
          result.pourSupports.push({ text: SUPPORT_TEMPLATE[cat] || SUPPORT_TEMPLATE['기타'], evidence: s });
        }
        if(!actionCatSeen.has(cat)){
          actionCatSeen.add(cat);
          result.nextActions.push({ text: NEXT_ACTION_TEMPLATE[cat] || NEXT_ACTION_TEMPLATE['기타'], evidence: s });
        }
        const tag = RECOMMEND_TAG[cat];
        if(tag && !recommendSeen.has(tag)){ recommendSeen.add(tag); result.recommendedSupports.push(tag); }
        return;
      }
      if(COMPETITOR_NAMES.some(name=> s.includes(name)) && /(검토|비교|병행|같이)/.test(s)){
        result.salesStyle = { text:'현장 조건에 따라 여러 공법을 비교·활용하는 방식.', evidence: s };
        return;
      }
      if(BLOCKER_MARKERS.some(kw=> s.includes(kw))){
        result.blockers.push({ text: s, evidence: s });
        return;
      }
      if(WANT_MARKERS.some(kw=> s.includes(kw))){
        result.wants.push({ text: s, evidence: s });
        wantClauses.push(s);
        return;
      }
      if(REACTION_MARKERS.some(kw=> s.includes(kw))){
        result.reactions.push({ text: s, evidence: s });
        return;
      }
      if(BUSINESS_MARKERS.some(kw=> s.includes(kw)) && !/pour/i.test(s.toLowerCase())){
        businessClauses.push(s);
      }
    });

    // 한 줄 요약(§4) — "이 업체가 무슨 사업을 하는지" 한 문장 + "무엇을 원하는지" 한 문장을
    // 실제 원문 문장에서 그대로 뽑아 이어붙인다. 새 문장을 창작하지 않는다.
    const bizSentence = businessClauses.find(s=> /영업|스펙|관공사/.test(s)) || businessClauses[0];
    const summaryParts = [];
    if(bizSentence) summaryParts.push(bizSentence.replace(/[.]+$/, ''));
    if(wantClauses[0]) summaryParts.push(wantClauses[0].replace(/[.]+$/, ''));
    result.summary = summaryParts.join(' · ');

    return result;
  }

  return {
    ruleBasedAnalyzeCustomerMemo,
    analyzeCustomerMemo: ruleBasedAnalyzeCustomerMemo, // 현재 활성 엔진 — 교체 시 이 참조만 바꾼다
    QUESTION_CATEGORIES,
    RECOMMEND_TAG // 추천 지원 칩 계산(§14/§15)에서 렌더 레이어가 재사용 — 표를 두 곳에 중복 정의하지 않는다
  };
})();
</script>

<script>
/* ==========================================================================
   CRM 화면 렌더링 — 데이터 계층(SHIN2_CRM_DATA)과 렌더 레이어를 분리해서(§37) 화면을
   앞으로 계속 바꿔도 데이터 구조/저장 위치는 그대로 유지되게 한다.
   ========================================================================== */
window.SHIN2_CRM_APP_INIT = function(){
  'use strict';
  const D = window.SHIN2_CRM_DATA;
  const OCR = window.SHIN2_CRM_OCR;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(iso){
    const d = new Date(iso); if(isNaN(d)) return '';
    const p = n=> String(n).padStart(2,'0');
    return d.getFullYear() + '.' + p(d.getMonth()+1) + '.' + p(d.getDate());
  }
  function fmtTime(iso){
    const d = new Date(iso); if(isNaN(d)) return '';
    const p = n=> String(n).padStart(2,'0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  // 협력사 여부 표시(§파트너 대시보드 연동 준비, 신규) — dealStage(협약 진행 단계)와는 다른
  // 별개 개념이다. v2/index.html 업체관리와 동일한 규칙(값은 shin2-companies-staging의
  // co.partnerStatus를 그대로 읽기만 하고, CRM 쪽에 별도로 복제 저장하지 않는다):
  // partner→파란 ○ / nonPartner→빨간 × / unknown(필드 없음 포함, 레거시 업체)→표시 없음.
  function partnerGlyphHtml(co){
    const st = co && co.partnerStatus;
    if(st === 'partner') return '<span class="co-partner-glyph is-partner" title="협력사">○</span>';
    if(st === 'nonPartner') return '<span class="co-partner-glyph is-nonpartner" title="비협력사">×</span>';
    return '';
  }
  function copyText(text, btn){
    if(!navigator.clipboard || !text) return;
    navigator.clipboard.writeText(text).then(()=>{
      const span = document.createElement('span');
      span.className = 'co-copied'; span.textContent = '복사됨';
      btn.insertAdjacentElement('afterend', span);
      setTimeout(()=> span.remove(), 1200);
    }).catch(()=>{});
  }

  const listEl = document.getElementById('crmList');
  const listView = document.getElementById('listView');
  const cardView = document.getElementById('cardView');
  const searchInput = document.getElementById('crmSearchInput');
  const listTitle = document.getElementById('crmListTitle');
  let searchQuery = '';
  let currentCompanyId = null;
  // §첫 화면 최종 수정 라운드: 필터/정렬/페이지 상태. 서버가 없는 순수 클라이언트 화면이라
  // 세 값 모두 렌더 시점에 메모리에서만 들고 있고, 별도로 저장하지 않는다(새로고침하면
  // 기본값 "전체/POUR 실적순/1페이지"로 돌아간다 — 스펙 §3 기본 정렬 유지).
  let filterKey = 'all';
  let sortMode = 'pour';
  let currentPage = 1;
  const PAGE_SIZE = 15;
  // §2 필터 칩 정의 — "진행중"은 buildProgressStages(co).hasAny(=Partner Dashboard 진행
  // 데이터가 실제로 있음)를 그대로 쓴다. 질문서/1차미팅/2차미팅/MOU는 그 안에서 "현재 단계"
  // (buildProgressStages의 currentIdx, 이미 §진행 기록 라운드에서 만든 계산)로 좁힌다.
  const FILTER_DEFS = [
    ['all','전체'], ['inProgress','진행중'], ['q','질문서'],
    ['m1','1차미팅'], ['m2','2차미팅'], ['mou','MOU'], ['partner','협력업체']
  ];
  function matchesFilter(co, progress, key){
    if(key === 'all') return true;
    if(key === 'partner') return co.partnerStatus === 'partner';
    if(key === 'inProgress') return progress.hasAny;
    if(!progress.hasAny) return false;
    return progress.stages[progress.currentIdx].key === key;
  }
  function buildStageBadgeHtml(progress){
    if(!progress.hasAny) return `<span class="stage-badge st-none">미확인</span>`;
    const stage = progress.stages[progress.currentIdx];
    const cls = stage.key === 'q' ? 'st-doc' : (stage.key === 'mou' ? 'st-mou' : 'st-meeting');
    return `<span class="stage-badge ${cls}">${esc(stage.label)} ${esc(PROGRESS_STATUS_LABEL[stage.state])}</span>`;
  }
  function applySort(rows){
    if(sortMode === 'recent'){
      rows.sort((a,b)=>{
        const ta = a.summary ? new Date(a.summary.createdAt).getTime() : 0;
        const tb = b.summary ? new Date(b.summary.createdAt).getTime() : 0;
        if(tb !== ta) return tb - ta;
        return String(a.co.name||'').localeCompare(String(b.co.name||''), 'ko');
      });
    } else if(sortMode === 'name'){
      rows.sort((a,b)=> String(a.co.name||'').localeCompare(String(b.co.name||''), 'ko'));
    } else if(sortMode === 'stage'){
      const order = { q:0, m1:1, m2:2, mou:3 };
      rows.sort((a,b)=>{
        const oa = a.progress.hasAny ? order[a.progress.stages[a.progress.currentIdx].key] : 99;
        const ob = b.progress.hasAny ? order[b.progress.stages[b.progress.currentIdx].key] : 99;
        if(oa !== ob) return oa - ob;
        return String(a.co.name||'').localeCompare(String(b.co.name||''), 'ko');
      });
    } else {
      // §3 기본 정렬: POUR 시공실적 건수 내림차순(하드코딩 없이 co.pourTrackRecords.length 집계).
      rows.sort((a,b)=> (b.pourCount - a.pourCount) || String(a.co.name||'').localeCompare(String(b.co.name||''), 'ko'));
    }
  }
  function renderFilterChips(counts){
    const wrap = document.getElementById('crmFilterRow');
    if(!wrap) return;
    wrap.innerHTML = FILTER_DEFS.map(([key,label])=>
      `<button type="button" class="list-filter-chip${filterKey===key?' is-active':''}" data-filter="${esc(key)}">${esc(label)} ${counts[key]||0}</button>`
    ).join('');
    wrap.querySelectorAll('[data-filter]').forEach(btn=> btn.addEventListener('click', ()=>{
      filterKey = btn.getAttribute('data-filter');
      currentPage = 1;
      renderList();
    }));
  }
  function renderPagination(totalPages){
    const wrap = document.getElementById('crmPagination');
    if(!wrap) return;
    if(totalPages <= 1){ wrap.innerHTML = ''; return; }
    const windowSize = 5;
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(totalPages, start + windowSize - 1);
    start = Math.max(1, end - windowSize + 1);
    const pages = [];
    for(let p = start; p <= end; p++) pages.push(p);
    let html = `<button type="button" class="page-btn" data-page="${currentPage-1}" ${currentPage<=1?'disabled':''}>&lt;</button>`;
    if(start > 1){ html += `<button type="button" class="page-btn" data-page="1">1</button>`; if(start > 2) html += `<span class="page-ellipsis">…</span>`; }
    html += pages.map(p=> `<button type="button" class="page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`).join('');
    if(end < totalPages){ if(end < totalPages - 1) html += `<span class="page-ellipsis">…</span>`; html += `<button type="button" class="page-btn" data-page="${totalPages}">${totalPages}</button>`; }
    html += `<button type="button" class="page-btn" data-page="${currentPage+1}" ${currentPage>=totalPages?'disabled':''}>&gt;</button>`;
    wrap.innerHTML = html;
    wrap.querySelectorAll('[data-page]').forEach(btn=> btn.addEventListener('click', ()=>{
      const p = parseInt(btn.getAttribute('data-page'), 10);
      if(!p || p < 1 || p > totalPages || p === currentPage) return;
      currentPage = p;
      renderList();
    }));
  }
  // §5: POUR 실적 숫자를 누르면 그 업체 카드를 열고 POUR 시공실적 상세(§POUR 시공실적
  // 라운드에서 이미 있는 #cdashPourTrackBlock)로 스크롤한다 — 새 화면/구조를 만들지 않는다.
  function openCardAndScrollToPour(id){
    openCard(id);
    requestAnimationFrame(()=>{
      const target = document.getElementById('cdashPourTrackBlock');
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }

  function companySummary(co){
    const acts = D.activitiesForCompany(co.id);
    return { last: acts[0] || null, count: acts.length };
  }

  function matchesSearch(co, acts, q){
    if(!q) return true;
    q = q.toLowerCase();
    const hay = [co.name, co.repName, co.contactName, co.phone, co.mobile, co.address, co.bizRegNo]
      .concat(acts.map(a=> a.activityText)).join(' ').toLowerCase();
    return hay.includes(q);
  }

  function renderList(){
    const companies = D.loadCompanies();
    listTitle.textContent = '고객 ' + companies.length;
    // 파생 데이터는 매번 다시 계산만 한다(§26 — companyId 기준 실제 POUR/진행 데이터에서
    // 집계, 회사명 텍스트로 새 데이터를 만들지 않음. 별도 저장 없음).
    const enriched = companies.map(co=>{
      const acts = D.activitiesForCompany(co.id);
      const progress = buildProgressStages(co);
      const pourCount = (co.pourTrackRecords || []).length;
      return { co, acts, summary: acts[0] || null, progress, pourCount };
    });

    // §6 ★ 상위 20% — POUR 실적을 가진 업체 전체를 기준으로(필터/검색과 무관하게 항상
    // 동일한 기준), 건수 내림차순 상위 ceil(20%)만 표시. "우수업체" 평가가 아니라 단순
    // 시각 표시(§6 명시).
    const withPour = enriched.filter(r=> r.pourCount > 0).slice().sort((a,b)=> b.pourCount - a.pourCount);
    const starCut = Math.ceil(withPour.length * 0.2);
    const starredIds = new Set(withPour.slice(0, starCut).map(r=> r.co.id));

    const filterCounts = {};
    FILTER_DEFS.forEach(([key])=>{ filterCounts[key] = enriched.filter(r=> matchesFilter(r.co, r.progress, key)).length; });
    renderFilterChips(filterCounts);

    const rows = enriched
      .filter(r=> matchesFilter(r.co, r.progress, filterKey))
      .filter(r=> matchesSearch(r.co, r.acts, searchQuery));
    applySort(rows);

    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    const pageRows = rows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    if(!rows.length){
      listEl.innerHTML = `<div class="empty-note">${companies.length===0 ? '등록된 고객이 없습니다.' : '검색 결과가 없습니다.'}</div>`;
      renderPagination(0);
      return;
    }
    listEl.innerHTML = pageRows.map(r=>{
      const star = starredIds.has(r.co.id) ? '<span class="co-star">★</span>' : '';
      const assignee = r.co.assigneeUserId ? '사용자 ' + esc(r.co.assigneeUserId) : '—';
      const pourHtml = r.pourCount > 0
        ? `<button type="button" class="pour-count" data-pour-link="${esc(r.co.id)}">${r.pourCount}건</button>`
        : `<span class="pour-none">—</span>`;
      return `
      <div class="co-row" data-id="${esc(r.co.id)}">
        <div class="col-name">${star}${partnerGlyphHtml(r.co)}${esc(r.co.name)}</div>
        <div class="col-stage">${buildStageBadgeHtml(r.progress)}</div>
        <div class="col-contact">${assignee}</div>
        <div class="col-recent">${r.summary ? esc(r.summary.activityText || r.summary.originalText) : '—'}</div>
        <div class="col-date">${r.summary ? fmtDate(r.summary.createdAt) : '—'}</div>

      row.addEventListener('click', ()=> openCard(row.getAttribute('data-id')));

  function openCard(id){
    const co = D.findCompany(id);
    if(!co){ return; }
    currentCompanyId = id;
    cardState.evidenceOpen = {}; // 업체를 새로 열 때만 근거 펼침 상태 초기화 — 같은 업체 재렌더링(수정 등) 중에는 유지
    cardState.questionLinkOpenId = null;
    cardState.memoModal = null;
    cardState.sectionEdit = {};
    cardState.progressStageSel = null; // §진행 기록 라운드: 업체를 새로 열 때만 선택 단계 초기화
    cardState.pourExpanded = false; cardState.pourYearFilter = 'all'; // §POUR 시공실적 라운드
    cardView.style.display = 'block';
    history.replaceState(null, '', '?company=' + encodeURIComponent(id));
    renderChart(co);
  }
  function openList(){
    currentCompanyId = null;
    cardView.innerHTML = '';
    cardView.style.display = 'none';
    listView.style.display = 'block';
    document.body.classList.remove('chart-lock');
    history.replaceState(null, '', location.pathname);
    renderList();

  function refreshChart(){
    const co = D.findCompany(currentCompanyId);

  const CO_INFO_LABELS = CO_FIELD_LABELS.filter(([k])=> !['name','contactName','position'].includes(k));

  // 편집모드로 바꾸는 대신, 영역 제목 옆 작은 [수정]을 누른 영역만 편집 상태가 된다. 키:

  // 다른 탭(v2 또는 CRM 다른 탭)에서 shin2-companies-staging이 바뀌었을 때 지금 이 탭이
  // 편집 폼을 띄워둔 상태라면 storage 이벤트로 인한 재렌더링이 사용자의 입력 중인 내용을

  let addingNewCompany = false;

  function buildFullInfoText(co){
    return CO_FIELD_LABELS.filter(([k])=> co[k]).map(([k,label])=> `${label} : ${co[k]}`).join('\n');

  // ---- 고객 차트 팝업 뼈대 — 배경 목록은 그대로 두고(§4 목록화면은 단순하게 유지) 위에
  // 오버레이만 띄운다. 내부 각 섹션은 독립된 render*() 함수가 채운다(§37 렌더 레이어 분리 관례
  // 그대로 유지) — 서류함/활동기록/메모는 기존 함수를 그대로 재사용한다(중복 구현 금지).
  // ---- 정보 우선순위(§ 5-10초 브리핑 카드 라운드) — ①헤더 ②한눈에 보기(신규) ③핵심
  // 3-strip ④고객니즈/특이사항 ⑤최근 이력/예정 일정 ⑥서류 요약 ⑦업체정보·전체이력·메모
  // (모두 펼치기 방식의 보조영역)를 이 순서 그대로 DOM에 둔다. ----
  // ---- 정보 순서(§ 고객 니즈 기반 영업지원 CRM 라운드, §2/§26) — ①업체 헤더 ②한눈에 보기
  // ③2×2 핵심영역(원하는 것/막히는 것/POUR가 해줘야 할 것/다음 행동) ④고객 실제 질문(해결
  // 상태 포함) ⑤추천 지원 ⑥고객 반응·영업 성향 ⑦최근 활동/예정일정 ⑧서류 요약 ⑨업체정보
  // ⑩이전 라운드에서 만든 3분할 strip/니즈·특이사항/판단요소/미팅확인사항(레거시, 삭제하지
  // 않고 접어서 유지) ⑪전체이력/서류함/메모, 이 순서 그대로 DOM에 둔다. ----
  // ---- 정보 순서(§ 한 장짜리 영업 대시보드 라운드, §2/§22) — 반드시 3단 고정 구조:
  // 1단 헤더(진한 남색 바 + 4분할 요약박스), 2단 4분할(업체 기본정보/POUR 협약목적/현재상황/
  // 관심공종·제품), 3단 고객 주요 질문(전체 폭, 카테고리별 동적 컬럼), 4단 3분할(고객 반응·
  // 성향/다음 행동/핵심 한줄요약), 마지막 작은 버튼 줄(업체정보/서류함/전체이력/메모/미팅기록/
  // 이전 요약정보)로 나머지 기존 기능을 전부 접어서 보존한다(§14/§17 — 삭제 금지). ----
  // ---- 정보 순서(§ 업체 업무 차트 라운드, §24) — 반드시: ①헤더(업체명 + X) ②액션 행([고객
  // 메모 정리][수정]) ③연락처 박스(대표자/전화번호/주소/사업자번호) ④업체 기본정보|관심
  // 공종·제품 2분할 ⑤미팅 기록(Partner Dashboard newMou 기반) ⑥요청 자료(전화기록 자동추출 +
  // 수동 추가) ⑦고객 반응·성향|다음 행동 2분할 ⑧핵심 한 줄 요약 ⑨보조 버튼(업체정보/서류함/
  // 메모)만. POUR 협약목적/현재상황/고객주요질문/전체이력/이전요약정보는 화면에서만 빼고
  // 데이터(D.addWhyPour 등)는 그대로 남겨둔다(§6/§17 — 삭제 아님, 렌더 호출만 하지 않음). ----
  // ---- 업체 한눈에 보기(§카드 재구성 라운드) — 헤더 바로 아래, 왼쪽은 기존 "핵심 한 줄
  // 요약"(cdashSummaryCol, D.setMemoSummary가 이미 쓰던 그 값 그대로) 재사용, 오른쪽은
  // 현재단계/최근접촉/POUR실적 3개 스탯만 계산해서 보여준다(§서류함 스크롤/담당자 정리
  // 라운드 — "담당자" 스탯은 co.contactName(고객 쪽 연락처, 실제로 안 쓰여 항상 "미확인"만
  // 뜨던 필드)을 보여주던 것이라 사용자 요청으로 제거했다. 새 데이터 필드를 만들지 않는다 —
  // 전부 이미 있는 함수(buildProgressStages/activitiesForCompany/pourTrackRecords)를 다시
  // 읽기만 한다. ----
  // §중복정보 제거/상단 재배치 라운드: "최근 접촉" 대신 "주요 시공"(POUR 시공실적 원본을
  // 공종별로 집계해 건수 많은 순 상위 2개)을 보여준다 — buildPourUsageSummary(co)가 이미
  // 하는 집계를 그대로 재사용할 뿐, 별도로 저장하지 않는다(§8).
  function buildGlanceStats(co){
    const { stages, currentIdx, hasAny } = buildProgressStages(co);
    const stageText = hasAny ? `${stages[currentIdx].label} ${PROGRESS_STATUS_LABEL[stages[currentIdx].state]}` : '미확인';
    const usage = buildPourUsageSummary(co);
    const topCats = usage ? usage.categoryTop.slice(0, 2) : [];
    return {
      stageText,
      mainCategoryText: topCats.length ? topCats.map(([name])=> name).join(' · ') : '—',
      mainCategorySub: topCats.length ? topCats.map(([name,count])=> name + ' ' + count).join(' · ') : '',
      pourCount: usage ? usage.totalCount : 0,
      pourLatestYear: usage ? usage.latestYear : null
    };
  }
  function renderGlanceRow(co){
    const wrap = document.getElementById('cdashGlanceStats');
    if(!wrap) return;

    wrap.innerHTML = `
      <div class="cdash-glance-stat"><div class="cdash-glance-stat-label">현재 단계</div><div class="cdash-glance-stat-value">${esc(g.stageText)}</div></div>
      <div class="cdash-glance-stat"><div class="cdash-glance-stat-label">주요 시공</div><div class="cdash-glance-stat-value">${esc(g.mainCategoryText)}</div>${g.mainCategorySub ? `<div class="cdash-glance-stat-sub">${esc(g.mainCategorySub)}</div>` : ''}</div>
      <div class="cdash-glance-stat"><div class="cdash-glance-stat-label">시공실적</div><div class="cdash-glance-stat-value">${g.pourCount ? `${g.pourCount}건` : '없음'}</div>${g.pourLatestYear ? `<div class="cdash-glance-stat-sub">최근 ${esc(g.pourLatestYear)}년</div>` : ''}</div>
    `;
  }

  // ---- 요청자료 미리보기(§카드 재구성 라운드) — 하단 우측 영역. 데이터 소스는 기존
  // buildRequestListItems(co)를 그대로 재사용(§요청자료 정리 라운드에서 만든 함수) — 최신
  // 3건만 보여주고 [더보기]는 기존 요청자료 팝업(openMemoPanel)을 그대로 연다. 새 저장소/

  // 칸에서 계속 확인/수정할 수 있다(§17 데이터 보존, 아래 renderBasicInfoCol 참고). ----

    const editing = cardState.chartEditing;
    const contactFields = [
      ['repName','대표자'], ['phone','전화번호'], ['address','주소'], ['bizRegNo','사업자번호']
    ];
    wrap.innerHTML = `

          </div>

        <div class="cdash-header-box">
          ${contactFields.map(([k,label])=> `
            <div class="cdash-header-field">
              <div class="cdash-header-field-label">${esc(label)}</div>
              <div class="cdash-header-field-value${co[k] ? '' : ' is-muted'}">${esc(co[k] || '미확인')}</div>

    `;
    document.getElementById('chartCloseBtn').addEventListener('click', closeChart);

  // ---- 2단 4분할의 공통 불릿 목록 렌더러(§9/§21) — POUR 협약 목적/현재 상황/관심 공종·제품이
  // 전부 "목록 + 영역별 독립 [수정]" 모양이라 공통 함수로 묶는다. 값이 없으면 "미확인"만

  function renderMiniBulletCol(co, cfg){

    const editing = !!cardState.sectionEdit[cfg.sectionKey];

  // ---- 업체 기본 정보 — 기존 주력/주요 시장/협력 시공사/타 공법 + 영업 단계(§7 유지, §5

  // 신규 추가 필드(co.legacyBusiness 등)일 뿐 기존 업체 스키마는 바뀌지 않는다. ----
  const CDASH_BASIC_FIELDS = [
    ['legacyBusiness','기존 주력'], ['targetMarket','주요 시장'],

    const wrap = document.getElementById('cdashBasicInfoCol');

    const stage = co.dealStage || '';

    const assigneeRow = editing

    // §자동 요약 구조 개선 라운드: 자동 사실(facts)을 항상 맨 위에 먼저 보여준다 — 사람이
    // 직접 입력한 위 bodyHtml(영업단계/담당자/기존 4필드)은 전혀 건드리지 않고 그 위에
    // 붙이기만 한다(§15 자동+직접입력 함께, 덮어쓰기 금지).
    const autoFacts = buildCompanyFeatureFacts(co);

      ${editing ? `<div class="cdash-mini-form-actions" style="margin-top:6px;"><button type="button" class="co-text-action primary" id="cdashBasicInfoSaveBtn">저장</button></div>` : ''}

    document.getElementById('cdashBasicInfoToggle').addEventListener('click', ()=>{

  // ---- §자동 요약 구조 개선 라운드: "관심 공종/제품"(추측성 라벨) → "POUR 활용현황"

  // ---- 미팅 기록(§17~21) — Partner Dashboard에서 이미 가져와 co.partnerDashboard.newMou에
  // 저장돼 있는 실제 진행정보(질문서 발송/회신, 1차/2차 미팅, MOU)를 그대로 읽어서 날짜 역순
  // 표로 보여준다. 새 저장소를 만들지 않는다 — 이 함수는 순수 계산(읽기)만 한다. 라벨이
  // "X"이거나 비어있으면(원본에 값이 없다는 뜻) 해당 항목을 만들지 않는다(§2/§20 없는 정보를
  // 만들어내지 않음). "미팅"과 "MOU"는 type 값을 다르게 유지해 구분한다(§21). ----
  function parsePartnerDateLabel(label){
    if(!label || label === 'X') return null;
    const m = String(label).match(/(\d{2,4})[.\-](\d{1,2})[.\-](\d{1,2})/);
    if(!m) return null;
    let y = parseInt(m[1],10); if(y < 100) y += 2000;
    const mo = parseInt(m[2],10), d = parseInt(m[3],10);
    const dt = new Date(y, mo-1, d);
    if(isNaN(dt.getTime())) return null;
    return { ts: dt.getTime(), display: y + '.' + String(mo).padStart(2,'0') + '.' + String(d).padStart(2,'0') };
  }
  // (§요청자료 정리 라운드까지 쓰이던 날짜 역순 표 버전 — §진행 기록 라운드에서 아래
  // buildProgressStages/renderMeetingRecordSection로 교체되어 더 이상 호출되지 않지만,
  // 데이터/로직은 그대로 남겨둔다.)
  function buildMeetingRecords(co){
    const nm = co.partnerDashboard && co.partnerDashboard.newMou;
    if(!nm) return [];
    const entries = [];
    const push = (label, type, status)=>{
      const p = parsePartnerDateLabel(label);
      if(!p) return;
      entries.push({ ts: p.ts, dateDisplay: p.display, type, status: status || '완료' });
    };
    push(nm.qSentLabel, '질문서 발송');
    push(nm.qReplyLabel, '질문서 회신');
    push(nm.m1Label, '1차 미팅');
    push(nm.m2Label, '2차 미팅');
    if(nm.mouDone) push(nm.mouLabel, 'MOU');
    entries.sort((a,b)=> b.ts - a.ts);
    return entries;
  }

  // ---- 진행 기록(§진행 기록 라운드) — 질문서→1차미팅→2차미팅→MOU 고정 순서의 진행바.
  // co.partnerDashboard.newMou에 이미 있는 값만 그대로 읽어서 상태를 "계산"할 뿐, 새 진행
  // 데이터를 만들거나 기존 값을 고치지 않는다. 상태는 세 가지만 쓴다:
  //   done(완료)      — 신뢰 가능한 완료 신호가 있음(질문서=회신일 존재, 미팅=날짜가 오늘 이하,
  //                      MOU=newMou.mouDone===true인 경우만 — 추측하지 않음)
  //   scheduled(예정) — 날짜가 파싱되고 아직 미래인 경우(실제 날짜 비교, 지어내지 않음)
  //   waiting(대기)   — 파싱 가능한 날짜가 아직 없음
  // ----
  function buildProgressStages(co){
    const nm = (co.partnerDashboard && co.partnerDashboard.newMou) || {};
    const now = Date.now();
    function dateState(label){
      const p = parsePartnerDateLabel(label);
      if(!p) return { state:'waiting', dateDisplay:'—', ts:null };
      return { state: p.ts <= now ? 'done' : 'scheduled', dateDisplay: p.display, ts: p.ts };
    }
    const q = (()=>{
      const reply = parsePartnerDateLabel(nm.qReplyLabel);
      if(reply) return { state:'done', dateDisplay: reply.display, ts: reply.ts };
      const sent = parsePartnerDateLabel(nm.qSentLabel);
      if(sent) return { state:'waiting', dateDisplay: sent.display, ts: sent.ts }; // 발송만 되고 회신 대기
      return { state:'waiting', dateDisplay:'—', ts:null };
    })();
    const m1 = dateState(nm.m1Label);
    const m2 = dateState(nm.m2Label);
    const mou = (()=>{
      if(nm.mouDone){
        const p = parsePartnerDateLabel(nm.mouLabel);
        return { state:'done', dateDisplay: p ? p.display : '완료', ts: p ? p.ts : now };
      }
      return dateState(nm.mouLabel);
    })();
    const stages = [
      { key:'q', label:'질문서', ...q },
      { key:'m1', label:'1차미팅', ...m1 },
      { key:'m2', label:'2차미팅', ...m2 },
      { key:'mou', label:'MOU', ...mou }
    ];
    // 현재 단계(§6): 마지막으로 완료된 단계의 "다음" 단계. 전부 완료면 MOU, 전부 대기면 질문서.
    let lastDoneIdx = -1;
    stages.forEach((s,i)=>{ if(s.state === 'done') lastDoneIdx = i; });
    const currentIdx = lastDoneIdx === -1 ? 0 : Math.min(lastDoneIdx + 1, stages.length - 1);
    return { stages, currentIdx, hasAny: !!(co.partnerDashboard && co.partnerDashboard.newMou) };
  }
  const PROGRESS_STATUS_LABEL = { done:'완료', scheduled:'예정', waiting:'대기' };

  /* ==========================================================================
     고객 진행단계 → 개인 할 일 자동 생성(§고객 진행단계 연동 라운드)

     저장 위치: v2(v2/index.html)의 "내 할 일"이 이미 쓰는 바로 그 localStorage
     키(shin2-todos, 사용자2/3는 shin2-todos__u2/__u3)에 이 파일에서 직접 항목을
     추가/완료 처리한다 — 새 저장소를 만들지 않는다. v2의 SHIN2_USER.nsKey와 동일한
     규칙(사용자1은 접미어 없음)을 이 문서 안에서 그대로 다시 쓴다(두 문서가 별개 HTML이라
     JS 모듈을 공유할 수 없음 — 이 저장소의 다른 § 라운드들과 같은 관례).

     각 자동 항목은 companyId + stage + 'schedule' 조합의 안정적인 autoKey를 가진다
     (예: "co_xxx_m1_schedule") — 같은 autoKey가 이미 있으면(완료 여부 무관) 다시
     만들지 않는다(§5 중복 생성 금지, 재실행/재동기화 안전).

     완료는 배열에서 항목을 지우지 않고 done:true+completedAt만 남긴다(§3/§9/§10/§12
     완료 이력 보존) — v2 쪽 "내 할 일" 모듈도 이번 라운드에서 같은 모델로 바꿨다.

     담당자(사용자) 매칭: co.assigneeUserId가 없는 업체는 자동 생성하지 않는다(§6,
     사용자 확인 완료 — 임의 매칭 대신 업체별 "담당자" 필드를 신설해 명시적으로 지정된
     업체만 연결). ----------------------------------------------------------------- */
  function todoKeyForUser(uid){ return uid === '1' ? 'shin2-todos' : ('shin2-todos__u' + uid); }
  function loadUserTodos(uid){
    try{ const raw = localStorage.getItem(todoKeyForUser(uid)); const a = raw ? JSON.parse(raw) : []; return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  }
  function saveUserTodos(uid, list){
    try{ localStorage.setItem(todoKeyForUser(uid), JSON.stringify(list)); }catch(e){}
  }
  function genAutoTodoId(){ return 'todo_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  // ensureAutoTodo: 이미 같은 autoKey가 있으면(완료든 미완료든) 아무것도 하지 않는다.
  function ensureAutoTodo(co, stageKey, label){
    const uid = co.assigneeUserId;
    if(!uid) return;
    const autoKey = co.id + '_' + stageKey + '_schedule';
    const list = loadUserTodos(uid);
    if(list.some(t=> t.autoKey === autoKey)) return;
    list.push({
      id: genAutoTodoId(), text: co.name + ' — ' + label, done: false,
      createdAt: Date.now(), companyId: co.id, companyName: co.name,
      source: 'customer-stage', category: '고객관리', autoKey
    });
    saveUserTodos(uid, list);
  }
  // completeAutoTodo: 실제 일정이 등록되면(§10) 자동으로 완료 처리 — 삭제하지 않는다.
  function completeAutoTodo(co, stageKey){
    const uid = co.assigneeUserId;
    if(!uid) return;
    const autoKey = co.id + '_' + stageKey + '_schedule';
    const list = loadUserTodos(uid);
    const item = list.find(t=> t.autoKey === autoKey && !t.done);
    if(!item) return;
    item.done = true;
    item.completedAt = Date.now();
    saveUserTodos(uid, list);
  }
  // syncCustomerStageTodos: 카드를 열 때마다(§ extractRequestedMaterialsFromActivities와
  // 같은 패턴) 진행단계를 다시 계산해서 필요한 자동 할 일만 만들거나 완료 처리한다. 순수
  // 진행상태 재확인일 뿐 새 진행 데이터를 만들지 않는다(§4 마지막 문단 — MOU 이후 업무는
  // 근거 있는 데이터가 없으므로 만들지 않음, 질문서→1차미팅→2차미팅만 연결).
  function syncCustomerStageTodos(co){
    if(!co.assigneeUserId) return;
    const { stages, hasAny } = buildProgressStages(co);
    if(hasAny){
      const q = stages.find(s=> s.key==='q'), m1 = stages.find(s=> s.key==='m1'), m2 = stages.find(s=> s.key==='m2');
      if(q.state === 'done'){
        if(m1.state === 'waiting') ensureAutoTodo(co, 'm1', '1차미팅 날짜 잡기');
        else completeAutoTodo(co, 'm1');
      }
      if(m1.state === 'done'){
        if(m2.state === 'waiting') ensureAutoTodo(co, 'm2', '2차미팅 날짜 잡기');
        else completeAutoTodo(co, 'm2');
      }
    }
    // §자동 요약 구조 개선 라운드 §10: "자료요청 존재 + 미처리 → 요청자료 처리" — 진행단계와
    // 무관하게(hasAny와 별개로) 실제 미처리 요청자료가 있을 때만 만든다. 요청자료 항목별로
    // autoKey를 나눠(reqmat_{materialId}) 여러 건이 각각 독립적으로 생성/완료된다.
    (co.requestedMaterials || []).forEach(m=>{
      const stageKey = 'reqmat_' + m.id;
      if(m.status !== '발송완료') ensureAutoTodo(co, stageKey, (m.materialType || '자료') + ' 요청자료 처리');
      else completeAutoTodo(co, stageKey);
    });
  }
  // autoStageTodosForCompany: 고객카드 "다음 행동"이 같은 항목을 읽기만 할 때 쓴다(§8 —
  // 데이터를 두 곳에 저장하지 않고 한 군데를 두 화면에서 보여줌).
  function autoStageTodosForCompany(co){
    if(!co.assigneeUserId) return [];
    return loadUserTodos(co.assigneeUserId).filter(t=> t.companyId === co.id && t.source === 'customer-stage');
  }
  // completeAutoTodoManually: 고객카드 다음 행동 쪽 [완료] 버튼 — 같은 배열의 같은 항목을
  // done:true로 바꿀 뿐이다(§9 양방향 반영 — v2 쪽은 storage 이벤트로 즉시 반영).
  function completeAutoTodoManually(uid, todoId){
    const list = loadUserTodos(uid);
    const item = list.find(t=> t.id === todoId);
    if(!item || item.done) return;
    item.done = true;
    item.completedAt = Date.now();
    saveUserTodos(uid, list);
  }

  // §진행 기록 라운드(현장 이력 정리) — co.partnerDashboard.newMou.site는 실제로 줄바꿈으로
  // 구분된 "현장별 진행 로그"다(예: "1/31_영등포대우미래사랑(옥상방수)_낙찰"). 지금까지는
  // 이 값을 한 줄로 통째로 붙여 보여줘서 몇 건이 낙찰인지 알아보기 어려웠다 — 원문을 고치지
  // 않고 줄 단위로만 나눠서 각 줄에 실제 적혀 있는 상태 단어(낙찰/진행/PT/유찰/보류/중단/대기)를
  // 그 줄에서 가장 마지막에 나오는 단어로 판단해 배지로 붙이고, "낙찰" 건수를 세어 보여준다.
  // 상태 단어가 없는 줄은 배지 없이 원문 그대로만 보여준다(추측해서 채우지 않음).
  const SITE_STATUS_KEYWORDS = ['낙찰','유찰','보류','중단','진행','PT','대기'];
  function parseSiteLog(text){
    return String(text || '').split(/\n+/).map(s=> s.trim()).filter(Boolean).map(line=>{
      let status = null, bestIdx = -1;
      SITE_STATUS_KEYWORDS.forEach(kw=>{
        const idx = line.lastIndexOf(kw);
        if(idx > bestIdx){ bestIdx = idx; status = kw; }
      });
      return { text: line, status };
    });
  }
  function renderMeetingRecordSection(co){
    const wrap = document.getElementById('cdashMeetingBlock');
    if(!wrap) return;
    const { stages, currentIdx, hasAny } = buildProgressStages(co);
    if(!hasAny){
      wrap.innerHTML = `
        <div class="cdash-col-title-row"><div class="cdash-col-title">진행 기록</div></div>
        <div class="cdash-field-value is-muted">미확인</div>
      `;
      return;
    }
    const selKey = cardState.progressStageSel || stages[currentIdx].key;
    const selIdx = Math.max(0, stages.findIndex(s=> s.key === selKey));
    const sel = stages[selIdx];
    const nm = co.partnerDashboard.newMou;
    // §카드 재구성 라운드(최근 기록) — 진행바 바로 아래에 가장 최근 전화기록 1건만 강조.
    // 새 저장소 없음, D.activitiesForCompany가 이미 최신순으로 정렬해서 돌려준다.
    const recentAct = (D.activitiesForCompany(co.id) || [])[0];
    wrap.innerHTML = `
      <div class="cdash-col-title-row"><div class="cdash-col-title">진행 기록</div></div>
      <div class="cdash-progress-bar">
        ${stages.map((s,i)=> `
          ${i>0 ? '<div class="cdash-progress-connector"></div>' : ''}
          <button type="button" class="cdash-progress-stage${i===currentIdx?' current':''}${i===selIdx?' selected':''}" data-stage="${esc(s.key)}">
            <div class="cdash-progress-stage-name">${esc(s.label)}</div>
            <div class="cdash-progress-stage-status">${esc(PROGRESS_STATUS_LABEL[s.state])}</div>
            <div class="cdash-progress-stage-date">${esc(s.dateDisplay)}</div>
          </button>
        `).join('')}
      </div>
      ${recentAct ? `
        <div class="cdash-recent-act">
          <div class="cdash-recent-act-label">최근 기록</div>
          <div class="cdash-recent-act-body">${esc([fmtDate(recentAct.createdAt), recentAct.category, (recentAct.activityText || recentAct.originalText)].filter(Boolean).join(' · '))}</div>
        </div>
      ` : ''}
      <div class="cdash-progress-detail">
        <div class="cdash-progress-detail-row"><span>현재 단계</span><strong>${esc(sel.label)}</strong></div>
        <div class="cdash-progress-detail-row"><span>일시</span><span>${esc(sel.dateDisplay)}</span></div>
        <div class="cdash-progress-detail-row"><span>상태</span><span>${esc(PROGRESS_STATUS_LABEL[sel.state])}</span></div>
        ${nm.note ? `<div class="cdash-progress-detail-row"><span>비고</span><span>${esc(nm.note)}</span></div>` : ''}
      </div>
      ${(()=>{
        if(!nm.site) return '';
        const entries = parseSiteLog(nm.site);
        const wonCount = entries.filter(e=> e.status === '낙찰').length;
        return `
          <div class="cdash-site-log">
            <div class="cdash-site-log-head">현장 이력 ${entries.length}건 · 낙찰 ${wonCount}건</div>
            <div class="cdash-site-log-list">
              ${entries.map(e=> `<div class="cdash-site-row${e.status==='낙찰' ? ' won' : ''}">
                <span class="cdash-site-row-text">${esc(e.text)}</span>
                ${e.status ? `<span class="cdash-site-row-tag">${esc(e.status)}</span>` : ''}
              </div>`).join('')}
            </div>
          </div>
        `;
      })()}
    `;
    wrap.querySelectorAll('[data-stage]').forEach(btn=> btn.addEventListener('click', ()=>{
      cardState.progressStageSel = btn.getAttribute('data-stage');
      renderMeetingRecordSection(co);
    }));
  }

  // ---- POUR 시공실적(§POUR 시공실적 라운드) — co.pourTrackRecords[](POUR 시공실적 가져오기
  // 모달이 정규화 업체명 완전일치로 연결해둔, 엑셀 원본 값 그대로의 실적)를 최신 연도순으로
  // 보여준다. 실적이 없으면 영역 자체를 비운다(§6 큰 빈 박스 금지). 기본 5건만 보이고
  // [전체 실적 N건 보기]로 같은 영역 안에서 펼친다(§14), 연도 필터는 최근 4개년+이전(§15). ----
  function fmtLocation(region, city, client){
    const left = [region, city].filter(Boolean).join(' ');
    if(left && client) return `${left} / ${client}`;
    if(left) return left;
    return client || '—';
  }
  function fmtHouseholds(n){ return (typeof n === 'number' && n > 0) ? `${n}세대` : '—'; }
  function fmtCategoryDisplay(s){ return s ? String(s).replace(/\n+/g, '·') : '—'; }
  function fmtPatentDisplay(s){ return s ? String(s).replace(/\n+/g, ', ') : '—'; }
  // ---- §자동 요약 구조 개선 라운드: POUR 활용현황 집계 — co.pourTrackRecords(§POUR
  // 시공실적 라운드에서 이미 만든 원본 배열)를 다시 저장하지 않고 매번 집계만 한다(§17
  // "시공실적 원본 → 자동 집계 → 표시" 구조, 데이터 복제 저장 금지). category/patentNo
  // 필드는 이미 \n으로 여러 값이 합쳐져 있을 수 있어(§POUR 라운드) 그대로 분리해서 센다.
  function buildPourUsageSummary(co){
    const records = co.pourTrackRecords || [];
    if(!records.length) return null;
    const catCount = new Map();
    records.forEach(r=>{
      String(r.category || '').split('\n').map(s=> s.trim()).filter(Boolean).forEach(c=>{
        catCount.set(c, (catCount.get(c) || 0) + 1);
      });
    });
    const catList = Array.from(catCount.entries()).sort((a,b)=> b[1]-a[1]);
    const regionCount = new Map();
    records.forEach(r=>{
      const region = [r.region, r.city].filter(Boolean).join(' ').trim();
      if(!region) return;
      regionCount.set(region, (regionCount.get(region) || 0) + 1);
    });
    const regionList = Array.from(regionCount.entries()).sort((a,b)=> b[1]-a[1]).map(([name])=> name);
    const patentSet = new Set();
    records.forEach(r=>{
      String(r.patentNo || '').split('\n').map(s=> s.trim()).filter(Boolean).forEach(p=> patentSet.add(p));
    });
    const patents = Array.from(patentSet);
    const years = records.map(r=> r.year).filter(y=> typeof y === 'number').sort((a,b)=> b-a);
    return {
      totalCount: records.length,
      latestYear: years[0] || null,
      categoryTop: catList.slice(0, 3),
      regionTop: regionList.slice(0, 3),
      regionAll: regionList,
      patents
    };
  }

  // ---- §자동 요약 구조 개선 라운드: 업체 특징 자동 사실(facts) — "느낌/평가"가 아니라
  // 실제 존재하는 데이터 유무만 짧게 나열한다(§1/§21 — 우수업체/가능성 높은 업체 같은
  // 평가 문구 금지). source는 나중에 근거 확인용으로만 내부에 유지한다(§12, 화면에 크게
  // 표시하지 않음). ----
  function buildCompanyFeatureFacts(co){
    const facts = [];
    const pour = co.pourTrackRecords || [];
    if(pour.length){
      const years = pour.map(r=> r.year).filter(y=> typeof y === 'number').sort((a,b)=> b-a);
      const latestYear = years[0];
      const latestCount = latestYear ? pour.filter(r=> r.year === latestYear).length : 0;
      facts.push({ text: 'POUR 시공실적 보유 업체', source: 'pourPerformance' });
      facts.push({ text: (latestYear ? latestYear + '년 실적 ' + latestCount + '건 · ' : '') + '전체 ' + pour.length + '건', source: 'pourPerformance' });
    }
    if(co.partnerStatus === 'partner') facts.push({ text: '협력업체', source: 'partnerDashboard' });
    const { stages, currentIdx, hasAny } = buildProgressStages(co);
    if(hasAny) facts.push({ text: '현재 ' + stages[currentIdx].label + ' ' + PROGRESS_STATUS_LABEL[stages[currentIdx].state], source: 'partnerStage' });
    const hadMeeting = hasAny && stages.some(s=> (s.key === 'm1' || s.key === 'm2') && s.state === 'done');
    if(hadMeeting) facts.push({ text: '과거 미팅 진행 이력 있음', source: 'partnerStage' });
    const reqCount = (co.requestedMaterials || []).length;
    if(reqCount) facts.push({ text: '요청자료 이력 ' + reqCount + '건', source: 'materialRequest' });
    if(!facts.length) facts.push({ text: 'POUR 실적 및 상담기록 없음', source: null });
    return facts;
  }

  // ---- §자동 요약 구조 개선 라운드: 고객 정보 자동 요약 — 우선순위(전화기록 > 미팅기록 >
  // 요청자료 > 고객메모 > 질문서기록) 순으로 실제 있는 항목만, 최대 3개까지 뽑는다(§8/§9).
  // 성향/등급을 추측하지 않고 원문(또는 원문 그대로에 가까운 요약)만 보여준다. ----
  function buildCustomerInfoFacts(co){
    const facts = [];
    const acts = D.activitiesForCompany(co.id) || []; // 최신순 정렬된 상태로 옴(§activitiesForCompany)
    const callAct = acts.find(a=> a.category !== '미팅');
    if(callAct) facts.push({ label: '최근 문의', text: callAct.activityText, source: 'callRecord' });
    const nm = co.partnerDashboard && co.partnerDashboard.newMou;
    const meetingAct = acts.find(a=> a.category === '미팅');
    if(nm && nm.note) facts.push({ label: '최근 미팅', text: nm.note, source: 'meetingRecord' });
    else if(meetingAct) facts.push({ label: '최근 미팅', text: meetingAct.activityText, source: 'meetingRecord' });
    if(facts.length < 3){
      const pendingMat = (co.requestedMaterials || []).slice()
        .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt))
        .find(m=> m.status !== '발송완료');
      if(pendingMat) facts.push({ label: '최근 요청', text: (pendingMat.materialType || '자료') + ' 요청', source: 'materialRequest' });
    }
    if(facts.length < 3){
      const memo = (D.memosFor(co.id) || [])[0];
      if(memo) facts.push({ label: '고객 메모', text: memo.text, source: 'memo' });
    }
    if(facts.length < 3){
      const q = (co.customerQuestions || []).slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt))[0];
      if(q) facts.push({ label: '고객 질문', text: q.text, source: 'question' });
    }
    return facts.slice(0, 3);
  }

  function renderPourTrackSection(co){
    const wrap = document.getElementById('cdashPourTrackBlock');
    if(!wrap) return;
    const all = (co.pourTrackRecords || []).slice()
      .sort((a,b)=> (b.year - a.year) || String(a.client||'').localeCompare(String(b.client||'')));
    if(!all.length){
      wrap.className = '';
      wrap.innerHTML = '';
      return;
    }
    wrap.className = 'cdash-block';
    const years = Array.from(new Set(all.map(r=> r.year))).sort((a,b)=> b-a);
    const recentYears = years.slice(0, 4);
    const filter = cardState.pourYearFilter;
    const filtered = filter === 'all' ? all
      : filter === 'older' ? all.filter(r=> !recentYears.includes(r.year))
      : all.filter(r=> r.year === Number(filter));

    // 주요 공종(§7) — 실제 건수를 세어 가장 많은 것만, 동률이면 추측하지 않고 첫 항목으로 안정 정렬.
    const catCount = new Map();
    all.forEach(r=>{ const c = fmtCategoryDisplay(r.category); if(c==='—') return; catCount.set(c, (catCount.get(c)||0)+1); });
    let topCategory = null, topCount = 0;

        <tbody>

    wrap.querySelectorAll('[data-pour-year]').forEach(btn=> btn.addEventListener('click', ()=>{
      cardState.pourYearFilter = btn.getAttribute('data-pour-year');
      cardState.pourExpanded = false;

    const moreBtn = document.getElementById('cdashPourMoreBtn');
    if(moreBtn) moreBtn.addEventListener('click', ()=>{

  // ---- 요청 자료(§12~16) — co.requestedMaterials[]를 최신순으로 표시. 상태 변경(요청/준비중/

  function renderTopStrip(co){
    const wrap = document.getElementById('chartStrip');
    const stage = co.dealStage || '';
    const acts = D.activitiesForCompany(co.id);
    const last = acts[0] || null;
    const pendingActs = D.pendingActivitiesForCompany(co.id);
    const pendingTasks = D.tasksForCompany(co.id);
    const todoCount = pendingActs.length + pendingTasks.length;
    const nextText = (pendingActs[0] && (pendingActs[0].activityText || pendingActs[0].originalText)) || (pendingTasks[0] && pendingTasks[0].title) || '';
    wrap.innerHTML = `
