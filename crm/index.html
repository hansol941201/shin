  // ---- 이 업체 한눈에 보기(§ 5-10초 브리핑 카드 라운드, 신규) ----
  // AI 호출이 아니라 순수 JS 규칙 기반 문자열 조립이다 — dealStage/최근 활동 텍스트(사전에
  // 등록된 업무 키워드가 실제로 그 텍스트 안에 등장할 때만 뽑아쓴다)/대기중인 활동·업무/
  // 니즈/특이사항/가까운 일정, 이 여섯 가지 "이미 저장된 데이터"만 조합해서 한 문장을
  // 만든다. 저장하지 않고 카드를 열 때마다 다시 계산한다(캐시 없음 — 항상 최신 데이터 반영).
  const CHART_BRIEF_KEYWORDS = ['시방서','실적자료','견적서','견적','도면','계약서','제안서','자재','샘플','공법','협약서','현장방문','품질서류','인증서'];
  function buildChartBrief(co){
    const acts = D.activitiesForCompany(co.id);
    const needs = co.needs || [];
    const notes = co.specialNotes || [];
    const pendingActs = D.pendingActivitiesForCompany(co.id);
    const pendingTasks = D.tasksForCompany(co.id);
    const events = D.upcomingCalendarEventsForCompany(co.id);
    const stage = co.dealStage || '';

    const hasAnySignal = acts.length || needs.length || notes.length || pendingActs.length || pendingTasks.length || stage || events.length;
    if(!hasAnySignal) return '기본정보만 등록됨';

    // 최근 활동 텍스트(최대 3건) 안에서 실제로 등장하는 업무 키워드만 뽑는다 — 사전에 없는
    // 단어나 활동에 안 적힌 사실은 절대 만들어내지 않는다.
    const recentKeywords = [];
    acts.slice(0,3).forEach(a=>{
      const text = a.activityText || a.originalText || '';
      CHART_BRIEF_KEYWORDS.forEach(kw=>{ if(text.includes(kw) && !recentKeywords.includes(kw)) recentKeywords.push(kw); });
    });
    let recentClause = '';
    if(recentKeywords.length){
      recentClause = '최근 ' + recentKeywords.slice(0,3).join('·') + '를 요청';
    } else if(acts[0]){
      recentClause = '최근 ' + (acts[0].category || '활동') + ' 기록 있음';
    }

    const nextTitle = (pendingActs[0] && (pendingActs[0].activityText || pendingActs[0].originalText)) || (pendingTasks[0] && pendingTasks[0].title) || '';
    let nextClause = '';
    if(nextTitle) nextClause = /(필요|확인)\s*$/.test(nextTitle) ? nextTitle : (nextTitle + ' 확인 필요');
    else if(stage) nextClause = stage + ' 단계';

    let sentence = [recentClause, nextClause].filter(Boolean).join('하며 ');
    if(!sentence){
      if(needs.length) sentence = '등록된 니즈 ' + needs.length + '건';
      else if(notes.length) sentence = '특이사항 ' + notes.length + '건 등록됨';
      else if(events.length) sentence = '예정 일정 "' + (events[0].title || '') + '" 있음';
      else if(stage) sentence = stage + ' 단계';
    }
    if(!sentence) return '기본정보만 등록됨';
    return sentence + ' 업체';
  }
  // memoSummary(§4/§21) — 자동정리로 [적용]했거나 직원이 직접 확정한 한 줄 요약이 있으면
  // 그것을 우선 보여준다. 없으면 이전 라운드부터 있던 규칙기반 buildChartBrief() 계산값으로
  // 자연스럽게 대체된다(§ 기존 기능 보호 — 계산 로직 자체는 그대로 둔다).
  function renderChartBrief(co){
    const wrap = document.getElementById('chartBrief');
    const editing = cardState.chartEditing;
    const text = co.memoSummary || buildChartBrief(co);
    if(editing){
      wrap.innerHTML = `
        <div class="chart-brief-label">이 업체 한눈에 보기</div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="chartBriefInput" value="${esc(co.memoSummary || '')}" placeholder="${esc(buildChartBrief(co))}" style="flex:1;padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:6px;outline:none;" />
          <button type="button" class="co-text-action primary" id="chartBriefSaveBtn">저장</button>
        </div>
      `;
      document.getElementById('chartBriefSaveBtn').addEventListener('click', ()=>{
        D.setMemoSummary(co.id, document.getElementById('chartBriefInput').value.trim());
        renderChartBrief(D.findCompany(co.id));
      });
      return;
    }
    wrap.innerHTML = `<div class="chart-brief-label">이 업체 한눈에 보기</div><div>${esc(text)}</div>`;
  }

  // ---- 고객 니즈/영업 핵심정보(§ 고객 니즈/영업 핵심정보 구조 개선 라운드) ------------------
  // 아래 섹션들은 전부 "사람이 직접 입력한 사실"만 저장하는 목록형/짧은 텍스트형 필드다.
  // AI가 추측해서 채우지 않는다 — 값이 없으면 항상 "—"(section 전체가 비었으면 숨김)로만
  // 표시한다. evidence(근거)가 있는 항목은 기본적으로 숨겨두고 [근거 보기]를 눌렀을 때만
  // 노출한다(§13) — cardState.evidenceOpen[sectionKey]로 섹션 단위 펼침 상태를 기억한다.
  //
  // renderEditableTextList: whyPour/keyFactors/customerQuestions/meetingChecklist/nextActions
  // 다섯 섹션이 전부 "목록 + (편집모드일 때만) 추가/삭제"라는 동일한 모양이라 공통 렌더러로
  // 묶는다 — 서로 다른 것은 필드 키(cfg.key)와 데이터 함수(cfg.addFn/removeFn)뿐이다.
  function renderEditableTextList(co, cfg){
    const wrap = document.getElementById(cfg.wrapId);
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const items = co[cfg.key] || [];
    if(!editing && !items.length){
      if(cfg.hideWhenEmpty){ wrap.innerHTML = ''; return; }
      wrap.innerHTML = `<div class="chart-combined-empty"><div class="chart-section-title">${esc(cfg.title)}</div><div class="chart-empty">—</div></div>`;
      return;
    }
    const hasEvidence = items.some(it=> it.evidence);
    const evOpen = !!cardState.evidenceOpen[cfg.wrapId];
    const itemHtml = (it)=>{
      const text = cfg.quote ? `"${esc(it.text)}"` : esc(it.text);
      const evLine = (it.evidence && evOpen) ? `<div class="chart-evidence-line">근거: ${esc(it.evidence)}</div>` : '';
      return `<div class="chart-bullet-item"><span>${cfg.bullet !== false ? '– ' : ''}${text}${evLine}</span>${editing ? `<button type="button" class="chart-tag-del" data-del="${esc(it.id)}">삭제</button>` : ''}</div>`;
    };
    const tagHtml = (it)=> `<span class="chart-tag-chip">${esc(it.text)}${editing ? `<button type="button" class="chart-tag-chip-del" data-del="${esc(it.id)}" title="삭제">×</button>` : ''}</span>`;
    wrap.innerHTML = `
      <div class="chart-section-head">
        <div class="chart-section-title">${esc(cfg.title)}</div>
        ${hasEvidence ? `<button type="button" class="co-text-action" id="${cfg.wrapId}EvBtn">${evOpen ? '근거 숨기기' : '근거 보기'}</button>` : ''}
      </div>
      ${cfg.asTags
        ? `<div class="chart-tag-row">${items.length ? items.map(tagHtml).join('') : '<span class="chart-empty">—</span>'}</div>`
        : `<div class="chart-bullet-list">${items.length ? items.map(itemHtml).join('') : '<div class="chart-empty">—</div>'}</div>`}
      ${editing ? `<div class="chart-add-inline">
          <input type="text" id="${cfg.wrapId}Input" placeholder="${esc(cfg.placeholder || '내용 추가')}" />
          ${cfg.withEvidence ? `<input type="text" id="${cfg.wrapId}EvInput" placeholder="근거(선택, 실제 발언/기록)" />` : ''}
          <button type="button" class="co-text-action primary" id="${cfg.wrapId}AddBtn">추가</button>
        </div>` : ''}
    `;
    wrap.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=>{
      cfg.removeFn(co.id, btn.getAttribute('data-del'));
      cfg.renderSelf(D.findCompany(co.id));
    }));
    if(hasEvidence){
      document.getElementById(cfg.wrapId + 'EvBtn').addEventListener('click', ()=>{
        cardState.evidenceOpen[cfg.wrapId] = !evOpen;
        cfg.renderSelf(D.findCompany(co.id));
      });
    }
    if(editing){
      const doAdd = ()=>{
        const input = document.getElementById(cfg.wrapId + 'Input');
        const text = input.value.trim();
        if(!text) return;
        const evInput = cfg.withEvidence ? document.getElementById(cfg.wrapId + 'EvInput') : null;
        cfg.addFn(co.id, text, evInput ? evInput.value.trim() : undefined);
        cfg.renderSelf(D.findCompany(co.id));
      };
      document.getElementById(cfg.wrapId + 'AddBtn').addEventListener('click', doAdd);
      document.getElementById(cfg.wrapId + 'Input').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
    }
  }

  // ---- 왜 POUR인가(§4) ----
  // ---- 2×2 핵심영역 ①: 이 업체가 원하는 것(§6) — 이전 라운드의 "왜 POUR인가"(whyPour
  // 필드)와 개념이 사실상 같아 필드를 새로 쪼개지 않고 그대로 재사용한다. 항상 칸을 보여주고
  // (hideWhenEmpty:false) 비어있으면 "—"만 표시해 2×2 그리드 구조가 흐트러지지 않게 한다. ----
  function renderWantsSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartWants', key: 'whyPour', title: '이 업체가 원하는 것',
      addFn: D.addWhyPour, removeFn: D.removeWhyPour, renderSelf: renderWantsSection,
      placeholder: '이 업체가 원하는 것 (실제 확인된 내용만)', withEvidence: true, hideWhenEmpty: false
    });
  }
  // ---- 2×2 핵심영역 ②: 현재 막히는 것(§7) ----
  function renderBlockersSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartBlockers', key: 'blockers', title: '현재 막히는 것',
      addFn: D.addBlocker, removeFn: D.removeBlocker, renderSelf: renderBlockersSection,
      placeholder: '실제 확인이 필요하거나 장애가 되는 요소', withEvidence: true, hideWhenEmpty: false
    });
  }
  // ---- 2×2 핵심영역 ③: POUR가 해줘야 할 것(§8) — 고객 문제를 그대로 복사하지 않고 우리
  // 회사가 제공할 서비스 형태로 바꿔 적는다(자동정리 미리보기에서도 이 변환을 거쳐 들어온다). ----
  function renderPourSupportsSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartPourSupports', key: 'pourSupports', title: 'POUR가 해줘야 할 것',
      addFn: D.addPourSupport, removeFn: D.removePourSupport, renderSelf: renderPourSupportsSection,
      placeholder: '우리 회사가 제공할 지원(서비스 형태로)', withEvidence: true, hideWhenEmpty: false
    });
  }

  // ---- 핵심 니즈 3분할(§5) — 사업 확대 / 제품·기술 / 수익·실행. 항목별로 비어있으면
  // "미확인"으로만 표시하고, 세 칸 모두 비어있으면(편집모드가 아닐 때) 섹션 전체를 숨긴다. ----
  const CORE_NEED_FIELDS = [['expand','사업 확대'], ['tech','제품·기술'], ['profit','수익·실행']];
  function renderCoreNeedsSection(co){
    const wrap = document.getElementById('chartCoreNeeds');
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const coreNeeds = co.coreNeeds || {};
    const anyFilled = CORE_NEED_FIELDS.some(([k])=> coreNeeds[k]);
    if(!editing && !anyFilled){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="chart-section-title">핵심 니즈</div>
      <div class="chart-needs3">
        ${CORE_NEED_FIELDS.map(([key,label])=> `
          <div class="chart-needs3-block">
            <div class="chart-needs3-label">${esc(label)}</div>
            ${editing
              ? `<input type="text" class="chart-needs3-input" data-need-key="${key}" value="${esc(coreNeeds[key] || '')}" placeholder="미확인" />`
              : `<div class="chart-needs3-value${coreNeeds[key] ? '' : ' muted'}">${esc(coreNeeds[key] || '미확인')}</div>`}
          </div>
        `).join('')}
      </div>
    `;
    if(editing){
      wrap.querySelectorAll('[data-need-key]').forEach(input=>{
        input.addEventListener('change', ()=> D.setCoreNeed(co.id, input.getAttribute('data-need-key'), input.value.trim()));
      });
    }
  }

  // ---- 중요 판단요소(§6) — 짧은 태그 형태 ----
  function renderKeyFactorsSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartKeyFactors', key: 'keyFactors', title: '중요 판단요소',
      addFn: (id,text)=> D.addKeyFactor(id,text), removeFn: D.removeKeyFactor, renderSelf: renderKeyFactorsSection,
      placeholder: '판단요소 (예: 조달등록)', asTags: true, hideWhenEmpty: true
    });
  }

  // ---- 고객 실제 질문(§10~13) — 카테고리별로 묶어서 보여주고, 질문마다 해결 상태(§12)와
  // 관련자료 연결(§13, 고객서류함/공용자료실 둘 다 참조 가능하되 화면에서 성격을 구분해
  // 보여준다)을 관리한다. 실제 질문이 존재하는 카테고리만 표시한다(§10). 상태 변경/자료연결은
  // 일상적인 운영 조작이라 전체 [수정] 모드와 무관하게 항상 가능하다 — 질문 문장 자체의
  // 추가/삭제만 [수정] 모드에서 가능하게 한다(§ 사람이 직접 작성한 질문 원문은 함부로 안 늘림).
  function renderQuestionsSection(co){
    const wrap = document.getElementById('chartQuestions');
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const questions = co.customerQuestions || [];
    if(!editing && !questions.length){ wrap.innerHTML = ''; return; }
    const byCat = {};
    questions.forEach(q=>{
      const cat = q.category || '기타';
      (byCat[cat] = byCat[cat] || []).push(q);
    });
    const cats = D.QUESTION_CATEGORIES.filter(c=> byCat[c] && byCat[c].length);
    const linkOpenId = cardState.questionLinkOpenId;

    function docLinkChips(q){
      const chips = [];
      if(q.customerDocumentId){
        const doc = D.findDocument(q.customerDocumentId);
        chips.push(`<span class="chart-doc-link-chip">[고객서류] <b>${esc(doc ? (doc.fileName || doc.originalFileName || '문서') : '(삭제된 문서)')}</b></span>`);
      }
      if(q.libraryMaterialId){
        const doc = D.findLibraryDoc(q.libraryMaterialId);
        chips.push(`<span class="chart-doc-link-chip">[제공자료] <b>${esc(doc ? (doc.title || doc.originalFileName || '자료') : '(삭제된 자료)')}</b></span>`);
      }
      return chips.join('');
    }

    function linkPanelHtml(q){
      if(linkOpenId !== q.id) return '';
      const customerDocs = D.documentsForCompany(co.id);
      const libDocs = D.loadLibraryDocs();
      return `
        <div class="chart-q-link-panel">
          <span style="font-size:10.5px;color:var(--text-muted);">고객서류</span>
          <select data-link-customer-doc="${esc(q.id)}">
            <option value="">연결 안 함</option>
            ${customerDocs.map(d=> `<option value="${esc(d.id)}" ${q.customerDocumentId===d.id?'selected':''}>${esc(d.fileName || d.originalFileName || d.id)}</option>`).join('')}
          </select>
          <span style="font-size:10.5px;color:var(--text-muted);">공용자료실</span>
          <select data-link-library-doc="${esc(q.id)}">
            <option value="">연결 안 함</option>
            ${libDocs.map(d=> `<option value="${esc(d.id)}" ${q.libraryMaterialId===d.id?'selected':''}>${esc(d.title || d.originalFileName || d.id)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    wrap.innerHTML = `
      <div class="chart-section-head">
        <div class="chart-section-title">고객 실제 질문</div>
      </div>
      ${cats.length ? cats.map(cat=> `
        <div class="chart-q-group">
          <div class="chart-q-group-title">${esc(cat)}</div>
          ${byCat[cat].map(q=> `
            <div class="chart-q-item" data-q-id="${esc(q.id)}">
              <div class="chart-q-text">"${esc(q.text)}"${editing ? ` <button type="button" class="chart-tag-del" data-del-question="${esc(q.id)}">삭제</button>` : ''}</div>
              <div class="chart-q-meta">
                <select class="chart-status-select" data-status-select="${esc(q.id)}">
                  ${D.QUESTION_STATUSES.map(st=> `<option value="${esc(st)}" ${q.status===st?'selected':''}>${esc(st)}</option>`).join('')}
                </select>
                <span class="chart-status-badge st-${esc(q.status || '미답변')}">${esc(q.status || '미답변')}</span>
                ${docLinkChips(q)}
                <button type="button" class="chart-q-link-btn" data-toggle-link="${esc(q.id)}">${linkOpenId===q.id ? '자료연결 닫기' : '자료연결'}</button>
              </div>
              ${linkPanelHtml(q)}
            </div>
          `).join('')}
        </div>
      `).join('') : '<div class="chart-empty">—</div>'}
      ${editing ? `<div class="chart-add-inline">
          <input type="text" id="chartQuestionInput" placeholder="고객이 실제로 한 질문" />
          <select id="chartQuestionCategory">${D.QUESTION_CATEGORIES.map(c=> `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
          <button type="button" class="co-text-action primary" id="chartQuestionAddBtn">추가</button>
        </div>` : ''}
    `;
    wrap.querySelectorAll('[data-del-question]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.removeCustomerQuestion(co.id, btn.getAttribute('data-del-question'));
      renderQuestionsSection(D.findCompany(co.id));
    }));
    wrap.querySelectorAll('[data-status-select]').forEach(sel=> sel.addEventListener('change', ()=>{
      D.setQuestionStatus(co.id, sel.getAttribute('data-status-select'), sel.value);
      renderQuestionsSection(D.findCompany(co.id));
    }));
    wrap.querySelectorAll('[data-toggle-link]').forEach(btn=> btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-toggle-link');
      cardState.questionLinkOpenId = (cardState.questionLinkOpenId === id) ? null : id;
      renderQuestionsSection(D.findCompany(co.id));
    }));
    wrap.querySelectorAll('[data-link-customer-doc]').forEach(sel=> sel.addEventListener('change', ()=>{
      D.linkQuestionDocument(co.id, sel.getAttribute('data-link-customer-doc'), { customerDocumentId: sel.value || null });
      renderQuestionsSection(D.findCompany(co.id));
    }));
    wrap.querySelectorAll('[data-link-library-doc]').forEach(sel=> sel.addEventListener('change', ()=>{
      D.linkQuestionDocument(co.id, sel.getAttribute('data-link-library-doc'), { libraryMaterialId: sel.value || null });
      renderQuestionsSection(D.findCompany(co.id));
    }));
    if(editing){
      const doAdd = ()=>{
        const input = document.getElementById('chartQuestionInput');
        const text = input.value.trim();
        if(!text) return;
        const category = document.getElementById('chartQuestionCategory').value;
        D.addCustomerQuestion(co.id, { text, category, sourceType:'manual' });
        renderQuestionsSection(D.findCompany(co.id));
      };
      document.getElementById('chartQuestionAddBtn').addEventListener('click', doAdd);
      document.getElementById('chartQuestionInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
    }
  }

  // ---- 추천 지원(§14/§15) — 카테고리 규칙 기반 후보(저장 안 함, 매번 재계산)와 직원이
  // 확정한 태그(co.recommendedSupports, 저장됨)를 함께 보여준다. 후보의 [추가]를 눌러야만
  // 확정 목록으로 들어간다 — 자동으로 자료를 발송하거나 확정하지 않는다(§15). ----
  function suggestSupportsFor(co){
    const A = window.SHIN2_CRM_ANALYSIS;
    const cats = new Set((co.customerQuestions || []).map(q=> q.category || '기타'));
    const confirmed = new Set((co.recommendedSupports || []).map(x=> x.text));
    const out = [];
    cats.forEach(cat=>{
      const tag = A.RECOMMEND_TAG[cat];
      if(tag && !confirmed.has(tag) && !out.includes(tag)) out.push(tag);
    });
    return out;
  }
  function renderRecommendedSupportsSection(co){
    const wrap = document.getElementById('chartRecommendedSupports');
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const confirmed = co.recommendedSupports || [];
    const suggestions = suggestSupportsFor(co);
    if(!editing && !confirmed.length && !suggestions.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="chart-section-title">이 업체에 추천하는 지원</div>
      <div class="chart-recommend-row">
        ${confirmed.map(x=> `<span class="chart-recommend-chip">${esc(x.text)}${editing ? `<button type="button" class="chart-tag-chip-del" data-del-recommend="${esc(x.id)}" title="삭제">×</button>` : ''}</span>`).join('')}
        ${suggestions.map(tag=> `<span class="chart-recommend-chip is-suggested">${esc(tag)}(제안)<button type="button" data-add-recommend="${esc(tag)}">추가</button></span>`).join('')}
        ${(!confirmed.length && !suggestions.length) ? '<span class="chart-empty">—</span>' : ''}
      </div>
    `;
    wrap.querySelectorAll('[data-del-recommend]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.removeRecommendedSupport(co.id, btn.getAttribute('data-del-recommend'));
      renderRecommendedSupportsSection(D.findCompany(co.id));
    }));
    wrap.querySelectorAll('[data-add-recommend]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.addRecommendedSupport(co.id, btn.getAttribute('data-add-recommend'));
      renderRecommendedSupportsSection(D.findCompany(co.id));
    }));
  }

  // ---- 고객 반응(§16) — 고객이 실제로 표현한 반응만 누적. 성향 판단(salesTendency)과 달리
  // 여러 건이 쌓일 수 있어 목록형으로 관리한다. ----
  function renderReactionsSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartReactions', key: 'reactions', title: '고객 반응',
      addFn: D.addReaction, removeFn: D.removeReaction, renderSelf: renderReactionsSection,
      placeholder: '고객이 실제로 표현한 반응', withEvidence: true, hideWhenEmpty: true
    });
  }

  /* ==========================================================================
     고객 메모 정리(§19~23) — 흐름: 메모 입력 → [분석](ruleBasedAnalyzeCustomerMemo, 순수
     계산, 아무것도 저장하지 않음) → 미리보기(항목별 체크박스로 선택) → 사람 확인 → [적용]
     (선택된 항목만 SHIN2_CRM_DATA로 저장). AI 결과가 기존 값을 자동으로 덮어쓰지 않는다(§21) —
     이미 값이 있는 한줄요약/영업성향은 [기존 유지]/[새 결과 적용] 중 하나를 직접 골라야만
     바뀐다(§22). 목록형 항목(원하는 것/막히는 것/POUR 지원/다음 행동/고객 반응/질문)은
     전부 "추가"일 뿐 기존 값을 덮어쓰지 않으므로 충돌 선택이 필요 없다 — 질문은
     addCustomerQuestionIfNew로 중복(정규화 텍스트 일치)을 걸러 누적한다(§23).
     ========================================================================== */
  function openMemoParseModal(co){
    cardState.memoModal = { companyId: co.id, step:'input', text:'', analysis:null, accepted:null, summaryChoice:'new', tendencyChoice:'new' };
    renderMemoModal();
  }
  function closeMemoModal(){
    cardState.memoModal = null;
    renderMemoModal();
  }
  function renderMemoModal(){
    const root = document.getElementById('chartMemoModalRoot');
    if(!root) return;
    const m = cardState.memoModal;
    if(!m){ root.innerHTML = ''; return; }
    const co = D.findCompany(m.companyId);
    if(!co){ closeMemoModal(); return; }

    if(m.step === 'input'){
      root.innerHTML = `
        <div class="chart-memo-overlay" id="memoOverlay">
          <div class="chart-memo-panel" role="dialog" aria-modal="true" aria-label="고객 메모 정리">
            <div class="chart-memo-head">
              <div class="chart-memo-title">고객 메모 정리 — ${esc(co.name)}</div>
              <button type="button" class="chart-close-btn" id="memoModalCloseBtn" aria-label="닫기">&times;</button>
            </div>
            <div class="chart-memo-body">
              <div class="chart-legacy-note">전화내용/미팅내용/메모를 자유롭게 붙여넣으세요. 원문에 없는 내용은 만들어내지 않고, 실제 문장에서만 항목을 뽑습니다(규칙 기반 — AI 미사용).</div>
              <textarea id="memoTextarea" placeholder="예) 기존 실내건축, 창호, 금속공사. 관공사 위주. ...">${esc(m.text)}</textarea>
            </div>
            <div class="chart-memo-actions">
              <button type="button" class="co-text-action" id="memoCancelBtn">취소</button>
              <button type="button" class="co-text-action primary" id="memoAnalyzeBtn">분석</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('memoModalCloseBtn').addEventListener('click', closeMemoModal);
      document.getElementById('memoCancelBtn').addEventListener('click', closeMemoModal);
      document.getElementById('memoAnalyzeBtn').addEventListener('click', ()=>{
        const text = document.getElementById('memoTextarea').value;
        m.text = text;
        if(!text.trim()) return;
        m.analysis = window.SHIN2_CRM_ANALYSIS.analyzeCustomerMemo(text);
        // 기본값: 목록형 항목은 전부 체크(사람이 미리보기에서 해제 가능) — 저장은 [적용]을
        // 눌러야만 실행되므로 기본 체크가 "즉시 반영"을 뜻하지 않는다.
        m.accepted = {
          wants: m.analysis.wants.map(()=> true),
          blockers: m.analysis.blockers.map(()=> true),
          pourSupports: m.analysis.pourSupports.map(()=> true),
          nextActions: m.analysis.nextActions.map(()=> true),
          questions: m.analysis.questions.map(()=> true),
          reactions: m.analysis.reactions.map(()=> true),
          recommendedSupports: m.analysis.recommendedSupports.map(()=> true),
          summary: !!m.analysis.summary,
          salesStyle: !!m.analysis.salesStyle
        };
        m.summaryConflict = !!(co.memoSummary && m.analysis.summary);
        m.tendencyConflict = !!(co.salesTendency && co.salesTendency.text && m.analysis.salesStyle);
        m.summaryChoice = m.summaryConflict ? 'keep' : 'new';
        m.tendencyChoice = m.tendencyConflict ? 'keep' : 'new';
        m.step = 'preview';
        renderMemoModal();
      });
      return;
    }

    // ---- 미리보기 단계 ----
    const A = m.analysis;
    const listSection = (label, key, items, textOf)=>{
      if(!items.length) return '';
      return `
        <div class="chart-memo-preview-section">
          <div class="chart-memo-preview-title">${esc(label)} (${items.length}건)</div>
          ${items.map((it,i)=> `
            <label class="chart-memo-preview-item">
              <input type="checkbox" data-accept="${key}:${i}" ${m.accepted[key][i] ? 'checked' : ''} />
              <span>${esc(textOf(it))}</span>
            </label>
          `).join('')}
        </div>
      `;
    };
    const questionSection = A.questions.length ? `
      <div class="chart-memo-preview-section">
        <div class="chart-memo-preview-title">고객 실제 질문 (${A.questions.length}건)</div>
        ${A.questions.map((q,i)=> `
          <label class="chart-memo-preview-item">
            <input type="checkbox" data-accept="questions:${i}" ${m.accepted.questions[i] ? 'checked' : ''} />
            <span>[${esc(q.category)}] "${esc(q.text)}"</span>
          </label>
        `).join('')}
      </div>
    ` : '';
    const recommendSection = A.recommendedSupports.length ? `
      <div class="chart-memo-preview-section">
        <div class="chart-memo-preview-title">추천 지원 후보 (${A.recommendedSupports.length}건)</div>
        ${A.recommendedSupports.map((tag,i)=> `
          <label class="chart-memo-preview-item">
            <input type="checkbox" data-accept="recommendedSupports:${i}" ${m.accepted.recommendedSupports[i] ? 'checked' : ''} />
            <span>${esc(tag)}</span>
          </label>
        `).join('')}
      </div>
    ` : '';
    const summaryHtml = A.summary ? `
      <div class="chart-memo-preview-section">
        <div class="chart-memo-preview-title">이 업체 한눈에 보기</div>
        ${m.summaryConflict ? `
          <div class="chart-memo-conflict">
            <div>기존 값이 이미 있습니다 — 사람이 확인한 값을 자동으로 덮어쓰지 않습니다.</div>
            <div style="margin-top:4px;color:var(--text-muted);">기존: ${esc(co.memoSummary)}</div>
            <div style="color:var(--text);">새 결과: ${esc(A.summary)}</div>
            <div class="chart-memo-conflict-row">
              <label><input type="radio" name="summaryChoice" value="keep" ${m.summaryChoice==='keep'?'checked':''} /> 기존 유지</label>
              <label><input type="radio" name="summaryChoice" value="new" ${m.summaryChoice==='new'?'checked':''} /> 새 결과 적용</label>
            </div>
          </div>
        ` : `<label class="chart-memo-preview-item"><input type="checkbox" data-accept="summary:0" ${m.accepted.summary?'checked':''} /><span>${esc(A.summary)}</span></label>`}
      </div>
    ` : '';
    const tendencyHtml = A.salesStyle ? `
      <div class="chart-memo-preview-section">
        <div class="chart-memo-preview-title">영업 성향</div>
        ${m.tendencyConflict ? `
          <div class="chart-memo-conflict">
            <div>기존 값이 이미 있습니다 — 사람이 확인한 값을 자동으로 덮어쓰지 않습니다.</div>
            <div style="margin-top:4px;color:var(--text-muted);">기존: ${esc(co.salesTendency.text)}</div>
            <div style="color:var(--text);">새 결과: ${esc(A.salesStyle.text)}</div>
            <div class="chart-memo-conflict-row">
              <label><input type="radio" name="tendencyChoice" value="keep" ${m.tendencyChoice==='keep'?'checked':''} /> 기존 유지</label>
              <label><input type="radio" name="tendencyChoice" value="new" ${m.tendencyChoice==='new'?'checked':''} /> 새 결과 적용</label>
            </div>
          </div>
        ` : `<label class="chart-memo-preview-item"><input type="checkbox" data-accept="salesStyle:0" ${m.accepted.salesStyle?'checked':''} /><span>${esc(A.salesStyle.text)} <span style="color:var(--text-muted);">(근거: ${esc(A.salesStyle.evidence)})</span></span></label>`}
      </div>
    ` : '';

    const nothingFound = !A.wants.length && !A.blockers.length && !A.pourSupports.length && !A.nextActions.length
      && !A.questions.length && !A.reactions.length && !A.recommendedSupports.length && !A.summary && !A.salesStyle;

    root.innerHTML = `
      <div class="chart-memo-overlay" id="memoOverlay">
        <div class="chart-memo-panel" role="dialog" aria-modal="true" aria-label="고객 메모 정리 미리보기">
          <div class="chart-memo-head">
            <div class="chart-memo-title">분석 결과 확인 — ${esc(co.name)}</div>
            <button type="button" class="chart-close-btn" id="memoModalCloseBtn" aria-label="닫기">&times;</button>
          </div>
          <div class="chart-memo-body">
            ${nothingFound ? '<div class="chart-memo-preview-empty">원문에서 추가로 뽑아낼 수 있는 항목을 찾지 못했습니다. 원문에 없는 내용은 만들어내지 않습니다.</div>' : ''}
            ${summaryHtml}
            ${listSection('이 업체가 원하는 것', 'wants', A.wants, it=> it.text)}
            ${listSection('현재 막히는 것', 'blockers', A.blockers, it=> it.text)}
            ${listSection('POUR가 해줘야 할 것', 'pourSupports', A.pourSupports, it=> it.text + ' (근거: ' + it.evidence + ')')}
            ${listSection('다음 행동', 'nextActions', A.nextActions, it=> it.text)}
            ${questionSection}
            ${recommendSection}
            ${listSection('고객 반응', 'reactions', A.reactions, it=> it.text)}
            ${tendencyHtml}
          </div>
          <div class="chart-memo-actions">
            <button type="button" class="co-text-action" id="memoBackBtn">다시 입력</button>
            <button type="button" class="co-text-action" id="memoCancelBtn2">취소</button>
            <button type="button" class="co-text-action primary" id="memoApplyBtn">적용</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('memoModalCloseBtn').addEventListener('click', closeMemoModal);
    document.getElementById('memoCancelBtn2').addEventListener('click', closeMemoModal);
    document.getElementById('memoBackBtn').addEventListener('click', ()=>{ m.step = 'input'; renderMemoModal(); });
    root.querySelectorAll('[data-accept]').forEach(cb=> cb.addEventListener('change', (e)=>{
      const [key, idx] = cb.getAttribute('data-accept').split(':');
      if(key === 'summary') m.accepted.summary = cb.checked;
      else if(key === 'salesStyle') m.accepted.salesStyle = cb.checked;
      else m.accepted[key][Number(idx)] = cb.checked;
    }));
    root.querySelectorAll('input[name=summaryChoice]').forEach(r=> r.addEventListener('change', ()=>{ m.summaryChoice = r.value; }));
    root.querySelectorAll('input[name=tendencyChoice]').forEach(r=> r.addEventListener('change', ()=>{ m.tendencyChoice = r.value; }));
    document.getElementById('memoApplyBtn').addEventListener('click', ()=> applyMemoAnalysis());
  }

  // applyMemoAnalysis: 체크된 항목만 SHIN2_CRM_DATA를 통해 실제로 저장한다. 목록형 항목은
  // 전부 추가(append)일 뿐이라 기존 값을 지우거나 바꾸지 않는다 — 질문만 addCustomerQuestionIfNew로
  // 중복을 걸러 누적한다(§23). summary/salesStyle은 충돌이 있을 때 사람이 고른 선택을 따른다(§22).
  function applyMemoAnalysis(){
    const m = cardState.memoModal;
    if(!m || !m.analysis) return;
    const companyId = m.companyId;
    const A = m.analysis;
    A.wants.forEach((it,i)=>{ if(m.accepted.wants[i]) D.addWhyPour(companyId, it.text, it.evidence); });
    A.blockers.forEach((it,i)=>{ if(m.accepted.blockers[i]) D.addBlocker(companyId, it.text, it.evidence); });
    A.pourSupports.forEach((it,i)=>{ if(m.accepted.pourSupports[i]) D.addPourSupport(companyId, it.text, it.evidence); });
    A.nextActions.forEach((it,i)=>{ if(m.accepted.nextActions[i]) D.addNextAction(companyId, it.text, it.evidence); });
    A.questions.forEach((q,i)=>{ if(m.accepted.questions[i]) D.addCustomerQuestionIfNew(companyId, { text: q.text, category: q.category, sourceType:'memo-parse' }); });
    A.reactions.forEach((it,i)=>{ if(m.accepted.reactions[i]) D.addReaction(companyId, it.text, it.evidence); });
    A.recommendedSupports.forEach((tag,i)=>{ if(m.accepted.recommendedSupports[i]) D.addRecommendedSupport(companyId, tag); });
    if(A.summary){
      const applySummary = m.summaryConflict ? (m.summaryChoice === 'new') : m.accepted.summary;
      if(applySummary) D.setMemoSummary(companyId, A.summary);
    }
    if(A.salesStyle){
      const applyTendency = m.tendencyConflict ? (m.tendencyChoice === 'new') : m.accepted.salesStyle;
      if(applyTendency) D.setSalesTendency(companyId, A.salesStyle.text, A.salesStyle.evidence);
    }
    cardState.memoModal = null;
    renderMemoModal();
    refreshChart();
  }

  // ---- 다음 미팅 핵심 확인사항(§7/§8) — 고객 질문 중 아직 답변/확인이 필요한 것 ----
  function renderMeetingChecklistSection(co){
    renderEditableTextList(co, {
      wrapId: 'chartMeetingChecklist', key: 'meetingChecklist', title: '다음 미팅 핵심 확인사항',
      addFn: D.addMeetingChecklistItem, removeFn: D.removeMeetingChecklistItem, renderSelf: renderMeetingChecklistSection,
      placeholder: '다음 미팅에서 확인/답변할 내용', withEvidence: true, hideWhenEmpty: true
    });
  }

  // ---- 영업 성향(§9) — 근거가 명확할 때만 한 줄로 기록. AI가 성격을 판단하지 않고 사람이
  // 직접 입력한다(입력창 자체가 "근거" 칸을 필수로 받도록 안내만 한다 — 강제 검증은 하지 않음). ----
  function renderSalesTendencySection(co){
    const wrap = document.getElementById('chartSalesTendency');
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const st = co.salesTendency || {};
    if(!editing && !st.text){ wrap.innerHTML = ''; return; }
    const evOpen = !!cardState.evidenceOpen.chartSalesTendency;
    if(editing){
      wrap.innerHTML = `
        <div class="chart-section-title">영업 성향</div>
        <div class="chart-important-edit" style="flex-direction:column;align-items:stretch;gap:6px;">
          <input type="text" id="chartTendencyText" value="${esc(st.text || '')}" placeholder="실제 발언/행동에서 명확히 확인되는 경우에만 입력" />
          <input type="text" id="chartTendencyEvidence" value="${esc(st.evidence || '')}" placeholder="근거(실제 기록/발언)" />
          <button type="button" class="co-text-action primary" id="chartTendencySaveBtn" style="align-self:flex-start;">저장</button>
        </div>
      `;
      document.getElementById('chartTendencySaveBtn').addEventListener('click', ()=>{
        const text = document.getElementById('chartTendencyText').value.trim();
        const evidence = document.getElementById('chartTendencyEvidence').value.trim();
        D.setSalesTendency(co.id, text, evidence);
        renderSalesTendencySection(D.findCompany(co.id));
      });
      return;
    }
    wrap.innerHTML = `
      <div class="chart-section-head">
        <div class="chart-section-title">영업 성향</div>
        ${st.evidence ? `<button type="button" class="co-text-action" id="chartTendencyEvBtn">${evOpen ? '근거 숨기기' : '근거 보기'}</button>` : ''}
      </div>
      <div>${esc(st.text)}</div>
      ${(st.evidence && evOpen) ? `<div class="chart-evidence-line">근거: ${esc(st.evidence)}</div>` : ''}
    `;
    if(st.evidence){
      document.getElementById('chartTendencyEvBtn').addEventListener('click', ()=>{
        cardState.evidenceOpen.chartSalesTendency = !evOpen;
        renderSalesTendencySection(D.findCompany(co.id));
      });
    }
  }

  // ---- 2×2 핵심영역 ④: 다음 행동(§9) — 고객 니즈/질문을 바탕으로 우리 직원이 할 일(질문의
  // 단순 복사가 아니라 우리 쪽 행동으로 적는다). [완료]는 전체 [수정] 모드와 무관하게 항상
  // 누를 수 있는 일상 조작이다 — 완료된 항목은 이 활성 목록에서는 빠지지만 배열에서 지우지
  // 않고, 완료 사실을 customerActivities에도 남겨 활동/완료이력에서 계속 확인할 수 있다(§9). ----
  function renderNextActionsSection(co){
    const wrap = document.getElementById('chartNextActions');
    if(!wrap) return;
    const editing = cardState.chartEditing;
    const all = co.nextActions || [];
    const active = all.filter(x=> !x.done);
    wrap.innerHTML = `
      <div class="chart-section-title">다음 행동</div>
      <div class="chart-bullet-list">
        ${active.length ? active.map(it=> `
          <div class="chart-na-item">
            <span>– ${esc(it.text)}</span>
            <span class="chart-na-actions">
              <button type="button" class="chart-na-complete-btn" data-complete-na="${esc(it.id)}">완료</button>
              ${editing ? `<button type="button" class="chart-tag-del" data-del="${esc(it.id)}">삭제</button>` : ''}
            </span>
          </div>
        `).join('') : '<div class="chart-empty">—</div>'}
      </div>
      ${editing ? `<div class="chart-add-inline">
          <input type="text" id="chartNextActionsInput" placeholder="우리가 다음에 해야 할 행동" />
          <button type="button" class="co-text-action primary" id="chartNextActionsAddBtn">추가</button>
        </div>` : ''}
    `;
    wrap.querySelectorAll('[data-complete-na]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.completeNextAction(co.id, btn.getAttribute('data-complete-na'));
      renderNextActionsSection(D.findCompany(co.id));
      renderRecentActivities(D.findCompany(co.id)); // 완료 시 활동이력에도 기록되므로 최근 활동도 함께 갱신
    }));
    wrap.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.removeNextAction(co.id, btn.getAttribute('data-del'));
      renderNextActionsSection(D.findCompany(co.id));
    }));
    if(editing){
      const doAdd = ()=>{
        const input = document.getElementById('chartNextActionsInput');
        const text = input.value.trim();
        if(!text) return;
        D.addNextAction(co.id, text);
        renderNextActionsSection(D.findCompany(co.id));
      };
      document.getElementById('chartNextActionsAddBtn').addEventListener('click', doAdd);
      document.getElementById('chartNextActionsInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
    }
  }

  // ---- 고객 니즈 / 특이사항 — 둘 다 비어 있고(편집모드가 아니고, 등록 제안도 없을 때) 한
  // 줄로 합쳐 접는다(§4 콤팩트 카드 추가 압축). 편집 중이거나 둘 중 하나라도 내용이 있으면
  // 기존 2열 레이아웃을 그대로 쓴다(§ db4f817의 접근을 유지) ----
  function renderNeedsSpecialSection(co){
    const wrap = document.getElementById('chartNeedsSpecialWrap');
    const needs = co.needs || [];
    const notes = co.specialNotes || [];
    const editing = cardState.chartEditing;
    const suggestion = D.suggestNeedFor(co.id);
    if(!editing && !needs.length && !notes.length && !suggestion){
      wrap.innerHTML = `<div class="chart-combined-empty"><div class="chart-section-title">고객 니즈 · 특이사항</div><div class="chart-empty">—</div></div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="chart-2col">
        <div>
          <div class="chart-section-title">고객 니즈</div>
          <div id="chartNeeds"></div>
        </div>
        <div>
          <div class="chart-section-title">특이사항</div>
          <div id="chartSpecial"></div>
        </div>
      </div>
    `;
    renderNeedsSection(co);
    renderSpecialSection(co);
  }

  function renderNeedsSection(co){
    const wrap = document.getElementById('chartNeeds');
    const needs = co.needs || [];
    const suggestion = D.suggestNeedFor(co.id);
    const editing = cardState.chartEditing;
    wrap.innerHTML = `
      <div class="chart-bullet-list">
        ${needs.length ? needs.map(n=> `<div class="chart-bullet-item"><span>– ${esc(n.text)}</span>${editing ? `<button type="button" class="chart-tag-del" data-need-del="${esc(n.id)}">삭제</button>` : ''}</div>`).join('') : '<div class="chart-empty">—</div>'}
      </div>
      ${suggestion ? `<div class="chart-suggest-box"><span>반복 언급 감지: "${esc(suggestion.key)}" — 니즈로 등록할까요?</span>
        <span class="chart-suggest-actions">
          <button type="button" class="co-text-action primary" id="chartNeedSuggestAdd">니즈에 추가</button>
          <button type="button" class="co-text-action" id="chartNeedSuggestDismiss">닫기</button>
        </span></div>` : ''}
      ${editing ? `<div class="chart-add-inline"><input type="text" id="chartNeedInput" placeholder="니즈 직접 추가" /><button type="button" class="co-text-action primary" id="chartNeedAddBtn">추가</button></div>` : ''}
    `;
    wrap.querySelectorAll('[data-need-del]').forEach(btn=> btn.addEventListener('click', ()=>{ D.removeNeed(co.id, btn.getAttribute('data-need-del')); renderNeedsSection(D.findCompany(co.id)); }));
    if(editing){
      const addBtn = document.getElementById('chartNeedAddBtn');
      const doAdd = ()=>{
        const input = document.getElementById('chartNeedInput');
        const text = input.value.trim();
        if(!text) return;
        D.addNeed(co.id, text, 'manual');
        renderNeedsSection(D.findCompany(co.id));
      };
      addBtn.addEventListener('click', doAdd);
      document.getElementById('chartNeedInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
    }
    if(suggestion){
      document.getElementById('chartNeedSuggestAdd').addEventListener('click', ()=>{
        D.addNeed(co.id, suggestion.key, 'suggested');
        renderNeedsSection(D.findCompany(co.id));
      });
      document.getElementById('chartNeedSuggestDismiss').addEventListener('click', ()=>{
        D.dismissNeedSuggestion(co.id, suggestion.key);
        renderNeedsSection(D.findCompany(co.id));
      });
    }
  }

  function renderSpecialSection(co){
    const wrap = document.getElementById('chartSpecial');
    const notes = co.specialNotes || [];
    const editing = cardState.chartEditing;
    wrap.innerHTML = `
      <div class="chart-bullet-list">

  // ---- 전체 타임라인: 저장된 데이터를 새로 만들지 않고 기존 배열들을 매 렌더링마다
  // 클라이언트에서 병합·정렬만 하는 뷰 함수(§9 요구사항) ----
  function buildTimelineEntries(co){
    const entries = [];
    D.activitiesForCompany(co.id).forEach(a=> entries.push({ ts: new Date(a.createdAt).getTime() || 0, type:'전화', text: a.activityText || a.originalText }));
    D.memosFor(co.id).forEach(m=> entries.push({ ts: Number(m.createdAt) || 0, type:'메모', text: m.text }));
    D.calendarEventsForCompany(co.id).forEach(ev=>{
      const t = new Date((ev.date || '') + 'T' + (ev.time || '00:00')).getTime();
      entries.push({ ts: !isNaN(t) ? t : (ev.createdAt || 0), type:'일정', text: ev.title, important: !!ev.isImportant });
    });
    DOC_TYPES.forEach(([type,label])=>{
      D.documentsForCompany(co.id, type).forEach(d=> entries.push({ ts: new Date(d.createdAt).getTime() || 0, type:'서류', text: label + ' 등록: ' + (d.fileName || d.originalFileName || '') }));
    });
    D.tasksForCompany(co.id).forEach(t=> entries.push({ ts: t.createdAt || 0, type:'업무', text: t.title }));
    entries.sort((a,b)=> b.ts - a.ts);
    return entries;
  }
  function renderTimelineSection(co){
    const wrap = document.getElementById('chartTimeline');
    if(!wrap) return;
    const entries = buildTimelineEntries(co);
    if(!entries.length){ wrap.innerHTML = '<div class="chart-empty">—</div>'; return; }
    const groups = [];
    entries.forEach(e=>{
      const key = e.ts ? fmtDate(new Date(e.ts).toISOString()) : '날짜 미상';
      let g = groups.find(x=> x.key === key);
      if(!g){ g = { key, items: [] }; groups.push(g); }
      g.items.push(e);
    });
    wrap.innerHTML = groups.map(g=> `<div class="chart-timeline-group"><div class="chart-timeline-date">${esc(g.key)}</div>
      ${g.items.map(e=> `<div class="chart-timeline-row"><span class="chart-timeline-type">${esc(e.type)}</span><span class="chart-timeline-text">${e.important ? `<mark class="kb-hl">${esc(e.text)}</mark>` : esc(e.text)}</span><span class="chart-timeline-time">${e.ts ? fmtTime(new Date(e.ts).toISOString()) : ''}</span></div>`).join('')}
    </div>`).join('');
  }

  // ---------------- 서류함(4분류) — 고객별 파일 보관함 ----------------
  // §1~9 개편: 탭 뒤에 파일 하나만 숨기지 않고, 4개 분류를 모두 펼쳐서 각자 자기 파일 목록을
  // 갖는 "진짜 다중 파일 보관함"으로 만든다. 카테고리별 accept는 실제로 올라올 만한 파일
  // 형식을 반영(사업자등록증/질문서는 PDF·문서 파일도 허용, 명함/로고는 이미지 중심).
  const DOC_TYPES = [
    ['businessCard','명함', 'image/*'],
    ['businessRegistration','사업자등록증', 'image/*,application/pdf'],
    ['questionnaire','질문서', 'image/*,application/pdf,.doc,.docx,.hwp,.hwpx,.txt'],
    ['logo','로고', 'image/*']
  ];
  const LOCAL_ONLY_NOTICE = '이 파일은 현재 이 기기에만 저장되어 있습니다 (다른 기기에서는 목록만 보이고 파일은 없을 수 있습니다)';
  function crmCloudReady(){ const ST = window.SHIN2_STORAGE; return !!(ST && ST.isSignedIn && ST.isSignedIn()); }
  // 로그인 완료 시점에 안내 문구만 갱신한다(자동 업로드/마이그레이션 아님 — 단순 텍스트 갱신,
  // §수동 액션 원칙 위반 아님). 카드 화면이 열려 있지 않으면 조용히 무시된다.
  window.addEventListener('shin2-crm-firebase-ready', ()=>{
    const note = document.getElementById('crmDocNote');
    if(!note) return;
    note.textContent = crmCloudReady()
      ? '새 파일은 자동으로 클라우드(Firebase Storage)에 업로드됩니다. 업로드에 실패하면 재시도하거나 이 기기에만 저장할 수 있습니다. 메타데이터(파일명/종류/업로드일/메모)는 기존처럼 클라우드 동기화 대상에 포함됩니다.'
      : ('클라우드 로그인이 안 되어 있어 지금은 파일 1개당 2MB 이하만 이 기기에 임시로 저장할 수 있습니다 — ' + LOCAL_ONLY_NOTICE + '. 메타데이터(파일명/종류/업로드일/메모)는 정상적으로 기존 클라우드 동기화 대상에 포함되지만, 바이너리 자체는 로컬 저장일 때 어떤 경우에도 Firestore로 전송되지 않습니다.');
  });
  // 문서 id → Blob object URL 캐시. dataURL을 그대로 window.open에 넘기면 최신 브라우저가
  // top-level 네비게이션을 막는 경우가 있어, 보기/다운로드는 항상 이 object URL을 쓴다.
  const docBlobUrlCache = {};
  function dataUrlToBlob(dataUrl){
    try{
      const commaIdx = dataUrl.indexOf(',');
      const meta = dataUrl.slice(0, commaIdx); // e.g. "data:image/png;base64"
      const isBase64 = /;base64/.test(meta);
      const mimeMatch = /^data:([^;]*)/.exec(meta);
      const mime = (mimeMatch && mimeMatch[1]) || 'application/octet-stream';
      const raw = dataUrl.slice(commaIdx + 1);
      const bin = isBase64 ? atob(raw) : decodeURIComponent(raw);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }catch(e){ return null; }
  }
  function getDocObjectUrl(doc){
    if(docBlobUrlCache[doc.id]) return docBlobUrlCache[doc.id];
    const dataUrl = D.getBlob(doc.id);
    if(!dataUrl) return '';
    const blob = dataUrlToBlob(dataUrl);
    if(!blob) return '';
    const url = URL.createObjectURL(blob);
    docBlobUrlCache[doc.id] = url;
    return url;
  }
  // getDocUrl: 보기/다운로드가 실제로 쓰는 진입점(Promise). 로컬 전용 파일은 기존 object URL
  // 경로 그대로(§ 이미 있던 로컬 파일이 깨지지 않도록), 클라우드 파일은 Storage에서 매번 새
  // 다운로드 URL을 요청한다(캐시하지 않음 — 보안규칙 상 로그인 상태 변화에 항상 최신이어야 함).
  function getDocUrl(doc){
    if(doc.localOnly){
      return Promise.resolve(getDocObjectUrl(doc));
    }
    const ST = window.SHIN2_STORAGE;
    if(!ST || !ST.isSignedIn || !ST.isSignedIn()){
      return Promise.reject(Object.assign(new Error('NOT_AUTHENTICATED'), { code:'NOT_AUTHENTICATED' }));
    }
    return ST.getFileURL(doc.storagePath);
  }
  function revokeDocObjectUrl(id){
    if(docBlobUrlCache[id]){ try{ URL.revokeObjectURL(docBlobUrlCache[id]); }catch(e){} delete docBlobUrlCache[id]; }
  }
  function canPreviewInline(doc){
    const m = (doc.mimeType || '').toLowerCase();
    return m.startsWith('image/') || m === 'application/pdf';
  }

  function renderDocsSection(co){
    const wrap = document.getElementById('crmDocsSection');
    const noteText = crmCloudReady()
      ? '새 파일은 자동으로 클라우드(Firebase Storage)에 업로드됩니다. 업로드에 실패하면 재시도하거나 이 기기에만 저장할 수 있습니다. 메타데이터(파일명/종류/업로드일/메모)는 기존처럼 클라우드 동기화 대상에 포함됩니다.'
      : '클라우드 로그인이 안 되어 있어 지금은 파일 1개당 2MB 이하만 이 기기에 임시로 저장할 수 있습니다 — ' + LOCAL_ONLY_NOTICE + '. 메타데이터(파일명/종류/업로드일/메모)는 정상적으로 기존 클라우드 동기화 대상에 포함되지만, 바이너리 자체는 로컬 저장일 때 어떤 경우에도 Firestore로 전송되지 않습니다.';
    wrap.innerHTML = `
      <div class="doc-blocked-note" id="crmDocNote">${esc(noteText)}</div>
      ${DOC_TYPES.map(([type,label])=> `
        <div class="doc-category" data-doc-cat="${type}">
          <div class="doc-cat-head">
            <div class="doc-cat-title">${label}</div>
            <button type="button" class="co-text-action primary doc-add-btn" data-doc-add="${type}">+ 파일 추가</button>
          </div>
          <input type="file" id="crmDocInput_${type}" style="display:none;" multiple />
          <div id="crmUploadStatus_${type}" class="doc-upload-status" style="display:none;"></div>
          <div id="crmOcrReviewSlot_${type}"></div>
          <div class="doc-list" id="crmDocList_${type}"></div>
        </div>
      `).join('')}
    `;
    DOC_TYPES.forEach(([type,label,accept])=>{
      const box = wrap.querySelector(`[data-doc-cat="${type}"]`);
      const input = document.getElementById('crmDocInput_' + type);
      input.setAttribute('accept', accept);
      wrap.querySelector(`[data-doc-add="${type}"]`).addEventListener('click', ()=> input.click());
      input.addEventListener('change', (e)=>{
        // §2 실사용 버그 수정: e.target.files는 input에 연결된 살아있는(live) FileList라서
        // 바로 아래에서 e.target.value=''로 입력을 비우면 이 참조도 함께 비어버려(길이 0)
        // 파일 선택 자체가 통째로 무시되는 버그가 있었다 — Array.from으로 스냅샷을 떠서 분리한다.
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if(files.length) handleDocFiles(co, type, files);
      });
      box.addEventListener('dragover', (e)=>{ e.preventDefault(); box.classList.add('drag-over'); });
      box.addEventListener('dragleave', ()=> box.classList.remove('drag-over'));
      box.addEventListener('drop', (e)=>{
        e.preventDefault(); box.classList.remove('drag-over');
        if(e.dataTransfer.files.length) handleDocFiles(co, type, e.dataTransfer.files);
      });
      renderDocList(co, type);
    });
    renderOcrReviewSlot(co);
  }

  function renderDocList(co, type){
    const listWrap = document.getElementById('crmDocList_' + type);
    if(!listWrap) return;
    const docs = D.documentsForCompany(co.id, type);
    if(!docs.length){ listWrap.innerHTML = '<div class="doc-empty">—</div>'; return; }
    listWrap.innerHTML = docs.map(doc=>{
      // 로컬 전용 문서는 실제 blob이 있어야 하고, 클라우드 문서는 storagePath가 local:이
      // 아니면(=업로드가 실제로 성공해 기록된 경우) 파일이 있다고 본다 — addDocument가 업로드
      // 성공 후에만 메타데이터를 쓰므로 이 가정이 성립한다(§ 고아 메타데이터 금지).
      const hasBlob = doc.localOnly ? !!D.getBlob(doc.id) : true;
      const isImg = (doc.mimeType||'').startsWith('image/');
      const dataUrl = (doc.localOnly && hasBlob) ? D.getBlob(doc.id) : '';
      const displayName = doc.fileName || doc.originalFileName || '(이름 없음)';
      return `<div class="doc-item" data-doc-id="${esc(doc.id)}">
        ${isImg && dataUrl ? `<img class="doc-thumb" src="${dataUrl}" alt="${esc(displayName)}" />` : `<div class="doc-thumb-generic">FILE</div>`}
        <div class="doc-main">
          <div class="doc-name" data-name-view="${esc(doc.id)}">${esc(displayName)}</div>
          <div class="doc-meta">${fmtDate(doc.createdAt)} ${fmtTime(doc.createdAt)}${doc.extractedContactName ? ' · 추출: ' + esc(doc.extractedContactName) + (doc.extractedPosition ? '('+esc(doc.extractedPosition)+')' : '') : ''}</div>
          ${doc.memo ? `<div class="doc-memo">${esc(doc.memo)}</div>` : ''}
          ${doc.localOnly !== false ? `<div class="doc-local-note">${esc(LOCAL_ONLY_NOTICE)}</div>` : ''}
          <div class="doc-actions">
            ${hasBlob && canPreviewInline(doc) ? `<button type="button" class="co-text-action" data-view="${esc(doc.id)}">보기</button>` : ''}
            ${hasBlob ? `<button type="button" class="co-text-action" data-download="${esc(doc.id)}">다운로드</button>` : ''}
            <button type="button" class="co-text-action" data-rename="${esc(doc.id)}">이름변경</button>
            <button type="button" class="co-text-action" data-memo="${esc(doc.id)}">메모</button>
            <button type="button" class="co-text-action danger" data-del="${esc(doc.id)}">삭제</button>
          </div>
        </div>
      </div>`;
    }).join('');
    listWrap.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const doc = docs.find(d=> d.id === btn.getAttribute('data-view'));
        if(!doc) return;
        getDocUrl(doc).then(url=>{ if(url) window.open(url, '_blank', 'noopener'); })
          .catch(()=>{ btn.insertAdjacentHTML('afterend', '<span class="doc-inline-err">불러오기 실패</span>'); setTimeout(()=>{ const s=btn.nextElementSibling; if(s && s.classList.contains('doc-inline-err')) s.remove(); }, 2000); });
      });
    });
    listWrap.querySelectorAll('[data-download]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const doc = docs.find(d=> d.id === btn.getAttribute('data-download'));
        if(!doc) return;
        getDocUrl(doc).then(url=>{
          if(!url) return;
          const a = document.createElement('a');
          a.href = url; a.download = doc.fileName || doc.originalFileName || 'file';
          document.body.appendChild(a); a.click(); a.remove();
        }).catch(()=>{ btn.insertAdjacentHTML('afterend', '<span class="doc-inline-err">다운로드 실패</span>'); setTimeout(()=>{ const s=btn.nextElementSibling; if(s && s.classList.contains('doc-inline-err')) s.remove(); }, 2000); });
      });
    });
    listWrap.querySelectorAll('[data-rename]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = btn.closest('.doc-item');
        const nameEl = item.querySelector('[data-name-view]');
        const id = btn.getAttribute('data-rename');
        const doc = docs.find(d=> d.id===id);
        nameEl.innerHTML = `<div class="doc-rename-row"><input type="text" id="renameInput_${id}" value="${esc(doc.fileName)}" /><button type="button" class="co-text-action primary" data-rename-save="${id}">저장</button></div>`;
        item.querySelector('[data-rename-save]').addEventListener('click', ()=>{
          const val = document.getElementById('renameInput_' + id).value.trim();
          if(val){ D.renameDocument(id, val); }
          renderDocList(co, type);
        });
      });
    });
    listWrap.querySelectorAll('[data-memo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = btn.closest('.doc-item');
        const id = btn.getAttribute('data-memo');
        const doc = docs.find(d=> d.id===id);
        const box = document.createElement('div');
        box.innerHTML = `<div class="doc-rename-row"><input type="text" id="memoInput_${id}" value="${esc(doc.memo||'')}" placeholder="짧은 메모" /><button type="button" class="co-text-action primary" data-memo-save="${id}">저장</button></div>`;
        item.querySelector('.doc-main').appendChild(box);
        box.querySelector('[data-memo-save]').addEventListener('click', ()=>{
          D.setDocumentMemo(id, document.getElementById('memoInput_' + id).value.trim());
          renderDocList(co, type);
        });
      });
    });
    listWrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        // §6: alert()/confirm() 대신 인라인 확인만 사용 — 이 파일 하나만 지우고, 같은 분류의
        // 다른 파일이나 다른 분류/다른 회사의 파일에는 전혀 영향을 주지 않는다(id 단위 삭제, §9).
        const item = btn.closest('.doc-item');
        const id = btn.getAttribute('data-del');
        item.querySelector('.doc-actions').innerHTML = `<span style="font-size:12px;color:var(--text-muted);">이 파일을 삭제할까요?</span>
          <button type="button" class="co-text-action danger" data-del-confirm="${id}">삭제</button>
          <button type="button" class="co-text-action" data-del-cancel="1">취소</button>`;
        item.querySelector('[data-del-cancel]').addEventListener('click', ()=> renderDocList(co, type));
        item.querySelector('[data-del-confirm]').addEventListener('click', ()=>{
          revokeDocObjectUrl(id);
          D.deleteDocument(id);
          renderDocList(co, type);
          renderDocCounts(co);
          renderTimelineSection(co);
        });
      });
    });
  }

  async function handleDocFiles(co, type, fileList){
    const files = Array.from(fileList || []);
    const statusEl = document.getElementById('crmUploadStatus_' + type);
    for(const file of files){
      await uploadOneDoc(co, type, file, statusEl); // 순차 처리 — 여러 파일이어도 진행률 표시가 하나씩 명확하게 보이도록.
    }
  }

  // uploadOneDoc: 파일 1개 저장(클라우드 우선 시도 → 실패 시 재시도/이 기기에만 저장 UI) +
  // 저장이 "성공"한 뒤에만 OCR을 돌린다(§8 OCR/파일저장 완전 분리는 그대로 유지).
  // opts.forceLocal===true는 사용자가 실패 후 명시적으로 "이 기기에만 저장"을 눌렀을 때만 켜진다.
  function uploadOneDoc(co, type, file, statusEl, opts){
    opts = opts || {};
    const wasCloudAttempt = !opts.forceLocal && crmCloudReady();
    if(statusEl){
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<div class="doc-upload-progress"><div class="doc-upload-bar" style="width:0%"></div></div><div class="doc-upload-label">업로드 중 0%</div>`;
    }
    const bar = statusEl && statusEl.querySelector('.doc-upload-bar');
    const label = statusEl && statusEl.querySelector('.doc-upload-label');
    return D.addDocument(co.id, type, file, (pct)=>{
      if(bar) bar.style.width = pct + '%';
      if(label) label.textContent = '업로드 중 ' + pct + '%';
    }, null, opts).then(async (rec)=>{
      if(statusEl){ statusEl.style.display = 'none'; statusEl.innerHTML = ''; }
      renderDocList(co, type);
      renderDocCounts(co);
      renderTimelineSection(co);
      // §8: 어떤 분류든 파일 저장이 먼저다 — OCR은 저장된 뒤에 벌어지는 부가 처리일 뿐, 저장의
      // 전제조건이 아니다. OCR이 실패하거나 아예 안 돌아도 파일은 이미 저장되어 있다(이 시점에
      // 이미 addDocument가 resolve됨 = 업로드/로컬저장이 끝났다는 뜻).
      if(type === 'businessCard' && file.type && file.type.startsWith('image/') && typeof Tesseract !== 'undefined'){
        cardState.ocrReview = { docId: rec.id, status:'recognizing' };
        renderOcrReviewSlot(co);
        try{
          const { data } = await Tesseract.recognize(URL.createObjectURL(file), 'kor+eng');
          const kind = OCR.coClassifyDocType(data.text || '');
          const extracted = kind === 'card' ? OCR.extractFromCardText(data.text || '') : OCR.extractFromBizRegText(data.text || '');
          D.updateDocumentExtracted(rec.id, extracted); // 이미 저장된 문서에 추출 결과만 덧붙임 — 원본 파일은 그대로.
          cardState.ocrReview = { docId: rec.id, status:'ready', extracted, showRaw:false };
        } catch(e){
          cardState.ocrReview = null; // 인식 실패해도 파일 저장은 이미 끝났으므로 조용히 넘어간다.
        }
        renderDocList(co, 'businessCard');
        renderOcrReviewSlot(co);
      }
    }).catch(err=>{
      const code = err && err.code;
      if(!statusEl) return;
      statusEl.style.display = 'block';
      if(code === 'SIZE_LIMIT'){
        statusEl.innerHTML = `<div class="doc-upload-err">이 파일은 로컬 저장 한도(2MB)를 초과합니다. 클라우드 로그인 후 다시 시도해주세요.</div>`;
        return;
      }
      // 업로드/저장 실패는 절대 조용히 로컬로 대체되지 않는다 — 재시도 또는 사용자가 직접
      // "이 기기에만 저장"을 눌러야만 로컬 폴백으로 진행된다(§ 안전 규칙).
      statusEl.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'doc-upload-err';
      msg.textContent = wasCloudAttempt ? '업로드에 실패했습니다. ' : '저장에 실패했습니다. ';
      const retryBtn = document.createElement('button');
      retryBtn.type = 'button'; retryBtn.className = 'co-text-action'; retryBtn.textContent = '[다시 시도]';
      retryBtn.addEventListener('click', ()=> uploadOneDoc(co, type, file, statusEl, opts));
      msg.appendChild(retryBtn);
      if(wasCloudAttempt){
        const localBtn = document.createElement('button');
        localBtn.type = 'button'; localBtn.className = 'co-text-action'; localBtn.style.marginLeft = '8px';
        localBtn.textContent = '[이 기기에만 저장]';
        localBtn.addEventListener('click', ()=> uploadOneDoc(co, type, file, statusEl, { forceLocal:true }));
        msg.appendChild(localBtn);
      }
      statusEl.appendChild(msg);
    });
  }

  function renderOcrReviewSlot(co){
    const slot = document.getElementById('crmOcrReviewSlot_businessCard');
    if(!slot) return;
    const r = cardState.ocrReview;
    if(!r){ slot.innerHTML = ''; return; }
    if(r.status === 'recognizing'){ slot.innerHTML = '<div class="ocr-review">이미지 인식 중... (파일은 이미 저장되었습니다)</div>'; return; }
    const ex = r.extracted;
    const field = (key, label)=> `<div class="co-form-field"><label>${label}${ex[key] && ex[key].ambiguous ? '<span class="ocr-badge">확인 필요</span>' : ''}</label><input type="text" id="ocrF_${key}" value="${esc(ex[key] ? ex[key].value : '')}" /></div>`;
    slot.innerHTML = `<div class="ocr-review">
      <div class="ocr-review-title">명함 인식 결과 (파일은 이미 저장되었습니다)</div>
      ${field('name','업체명')}${field('contactName','담당자')}${field('position','직책')}
      ${field('phone','전화번호')}${field('email','이메일')}${field('address','주소')}
      <div class="co-checkbox-row"><input type="checkbox" id="ocrOnlyEmpty" checked /> <label for="ocrOnlyEmpty">빈 정보만 채우기(기존 값이 있는 필드는 유지)</label></div>
      <div class="ocr-actions">
        <button type="button" class="co-text-action" id="ocrViewRawBtn">${r.showRaw ? '원문 숨기기' : '원문 OCR 보기'}</button>
        <button type="button" class="co-text-action" id="ocrCancelBtn2">닫기</button>
        <button type="button" class="co-text-action primary" id="ocrApplyBtn">업체정보에 반영</button>
      </div>
      ${r.showRaw ? `<div class="ocr-raw-box">${esc(ex.rawOcrText || '')}</div>` : ''}
    </div>`;
    document.getElementById('ocrViewRawBtn').addEventListener('click', ()=>{ r.showRaw = !r.showRaw; renderOcrReviewSlot(co); });
    document.getElementById('ocrCancelBtn2').addEventListener('click', ()=>{ cardState.ocrReview = null; renderOcrReviewSlot(co); });
    document.getElementById('ocrApplyBtn').addEventListener('click', ()=>{
      // 문서 자체는 이미 저장되어 있음 — 사용자가 편집한 최종 값을 문서의 추출필드에 반영하고,
      // 회사 기본정보에도 병합한다(§12: 빈 정보만 채우기 옵션).
      const editedExtracted = {};
      ['name','contactName','position','phone','email','address'].forEach(k=>{
        const el = document.getElementById('ocrF_' + k);
        editedExtracted[k] = { value: el ? el.value.trim() : '', ambiguous:false };
      });
      editedExtracted.rawOcrText = ex.rawOcrText;
      D.updateDocumentExtracted(r.docId, editedExtracted);
      const onlyEmpty = document.getElementById('ocrOnlyEmpty').checked;
      const patch = {};
      if(editedExtracted.contactName.value) patch.contactName = editedExtracted.contactName.value;
      if(editedExtracted.position.value) patch.position = editedExtracted.position.value;
      if(editedExtracted.phone.value) patch.phone = editedExtracted.phone.value;
      if(editedExtracted.email.value) patch.email = editedExtracted.email.value;
      if(editedExtracted.address.value) patch.address = editedExtracted.address.value;
      if(Object.keys(patch).length) D.updateCompany(co.id, patch, { onlyFillEmpty: onlyEmpty });
      cardState.ocrReview = null;
      refreshChart();
    });
  }

  // ---------------- 활동 타임라인 ----------------
  function renderActivitySection(co){
    const wrap = document.getElementById('crmActivitySection');
    const items = D.activitiesForCompany(co.id);
    const groups = [];
    items.forEach(a=>{
      const key = fmtDate(a.createdAt);
      let g = groups.find(x=> x.key===key);
      if(!g){ g = { key, items:[] }; groups.push(g); }
      g.items.push(a);
    });
    wrap.innerHTML = `
      <div class="act-add-row"><input type="text" id="crmActInput" placeholder="활동 내용을 입력하세요 (예: 견적문의 재도장)" /><button type="button" id="crmActAddBtn">기록</button></div>
      <div id="crmActGroups">${groups.length ? groups.map(g=> `
        <div class="act-date-group">
          <div class="act-date-label">${esc(g.key)}</div>
          ${g.items.map(a=> `<div class="act-row" data-act-id="${esc(a.id)}">
            <span class="act-time">${fmtTime(a.createdAt)}</span>
            <span class="act-cat">${esc(a.category)}</span>
            <span class="act-text">${esc(a.activityText || a.originalText)}</span>
            <span class="act-row-actions">
              <button type="button" class="co-text-action" data-act-edit="${esc(a.id)}">수정</button>
              <button type="button" class="co-text-action danger" data-act-del="${esc(a.id)}">삭제</button>
            </span>
          </div>`).join('')}
        </div>`).join('') : '<div class="doc-empty">—</div>'}</div>
    `;
    document.getElementById('crmActAddBtn').addEventListener('click', ()=>{
      const input = document.getElementById('crmActInput');
      const text = input.value.trim();
      if(!text) return;
      D.addActivity(co.id, text);
      input.value = '';
      renderActivitySection(co);
      renderList();
      refreshChartDerived(co);
    });
    document.getElementById('crmActInput').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('crmActAddBtn').click(); }
    });
    wrap.querySelectorAll('[data-act-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = btn.closest('.act-row');
        row.querySelector('.act-row-actions').innerHTML = `<span style="font-size:11.5px;color:var(--text-muted);">삭제할까요?</span>
          <button type="button" class="co-text-action" data-act-del-cancel="1">취소</button>
          <button type="button" class="co-text-action danger" data-act-del-confirm="${btn.getAttribute('data-act-del')}">삭제</button>`;
        row.querySelector('[data-act-del-cancel]').addEventListener('click', ()=> renderActivitySection(co));
        row.querySelector('[data-act-del-confirm]').addEventListener('click', ()=>{
          D.deleteActivity(btn.getAttribute('data-act-del'));
          renderActivitySection(co);
          refreshChartDerived(co);
        });
      });
    });
    wrap.querySelectorAll('[data-act-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-act-edit');
        const row = btn.closest('.act-row');
        const a = items.find(x=> x.id===id);
        row.querySelector('.act-text').outerHTML = `<span class="act-edit-row"><input type="text" id="actEditInput_${id}" value="${esc(a.activityText||a.originalText)}" /><button type="button" class="co-text-action primary" data-act-save="${id}">저장</button></span>`;
        row.querySelector('[data-act-save]').addEventListener('click', ()=>{
          const val = document.getElementById('actEditInput_' + id).value.trim();
          if(val) D.updateActivityText(id, val);
          renderActivitySection(co);
          renderList();
          refreshChartDerived(co);
        });
      });
    });
  }

  // ---------------- 메모(공용 컴포넌트 패턴 재사용) ----------------
  // ---- 메모(공용 컴포넌트 패턴 재사용) — §5-10초 브리핑 카드 라운드에서 기본 노출을
  // "미리보기 1줄"로 줄인다. 메모 리스트/추가 폼 자체는 그대로 재사용하고(중복 구현 금지),
  // 기본 표시 모드만 preview로 바꿔서 [보기]를 눌러야 기존 목록이 펼쳐지게 한다. ----
  function renderMemoSection(co){
    const wrap = document.getElementById('crmMemoSection');
    let mode = 'preview'; // 'preview' | 'list' | 'add'
    function render(){
      const items = D.memosFor(co.id);
      const latest = items[0];
      const previewRaw = latest ? String(latest.text || '').split('\n')[0] : '';
      const previewText = previewRaw.length > 40 ? previewRaw.slice(0,40) + '…' : previewRaw;
      wrap.innerHTML = `
        <div class="memo-head">
          ${mode === 'preview' ? `<span class="memo-preview-text">${latest ? esc(previewText) : '—'}</span>` : '<span></span>'}
          <span class="memo-preview-actions">
            ${mode !== 'add' ? `<button type="button" class="co-text-action" id="crmMemoListBtn">${mode==='list' ? '접기' : '보기'}</button>` : ''}
            <button type="button" class="memo-add-btn" id="crmMemoAddBtn">${mode==='add' ? '닫기' : '+ 추가'}</button>
          </span>
        </div>
        ${mode==='add' ? `<div class="memo-form"><textarea id="crmMemoInput" placeholder="메모를 입력하세요"></textarea>
          <div class="memo-form-actions"><button type="button" class="co-text-action" id="crmMemoCancel">취소</button><button type="button" class="co-text-action primary" id="crmMemoSave">저장</button></div></div>` : ''}
        ${mode==='list' ? (items.length ? items.map(m=> `<div class="memo-item" data-memo-id="${esc(m.id)}">
            <div class="memo-meta">${fmtDate(new Date(m.createdAt).toISOString())} ${fmtTime(new Date(m.createdAt).toISOString())}</div>
            <div class="memo-text">${esc(m.text)}</div>
            <div class="memo-item-actions"><button type="button" class="co-text-action danger" data-memo-del="${esc(m.id)}">삭제</button></div>
          </div>`).join('') : '<div class="memo-empty">—</div>') : ''}
      `;
      const listBtn = document.getElementById('crmMemoListBtn');
      if(listBtn) listBtn.addEventListener('click', ()=>{ mode = mode==='list' ? 'preview' : 'list'; render(); });
      document.getElementById('crmMemoAddBtn').addEventListener('click', ()=>{ mode = mode==='add' ? 'preview' : 'add'; render(); if(mode==='add') document.getElementById('crmMemoInput').focus(); });
      const cancelBtn = document.getElementById('crmMemoCancel');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ mode='preview'; render(); });
      const saveBtn = document.getElementById('crmMemoSave');
      if(saveBtn) saveBtn.addEventListener('click', ()=>{
        const text = document.getElementById('crmMemoInput').value.trim();
        if(!text) return;
        D.addMemo(co.id, text);
        mode = 'list';
        render();
        renderTimelineSection(co);
      });
      wrap.querySelectorAll('[data-memo-del]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const item = btn.closest('.memo-item');
          item.querySelector('.memo-item-actions').innerHTML = `<span style="font-size:11.5px;color:var(--text-muted);">삭제할까요?</span>
            <button type="button" class="co-text-action" data-memo-del-cancel="1">취소</button>
            <button type="button" class="co-text-action danger" data-memo-del-confirm="${btn.getAttribute('data-memo-del')}">삭제</button>`;
          item.querySelector('[data-memo-del-cancel]').addEventListener('click', render);
          item.querySelector('[data-memo-del-confirm]').addEventListener('click', ()=>{ D.deleteMemo(btn.getAttribute('data-memo-del')); render(); renderTimelineSection(co); });
        });
      });
    }
    render();
  }

  // 활동 추가/수정/삭제 뒤에 상단 요약/최근 활동/타임라인/니즈 제안을 함께 갱신한다(§ 데이터는
  // 그대로, 뷰만 다시 그림 — activitiesForCompany/memosFor 등은 항상 최신 localStorage를
  // 다시 읽으므로 별도 캐시 무효화가 필요 없다).
  function refreshChartDerived(co){
    const fresh = D.findCompany(co.id);
    if(!fresh) return;
    renderChartBrief(fresh);
    renderTopStrip(fresh);
    renderRecentActivities(fresh);
    renderTimelineSection(fresh);
    renderNeedsSpecialSection(fresh);
  }

  // ================= 고객 등록(신규) =================
  function openAddCompanyForm(){
    addingNewCompany = true;
    const co = { id:null, name:'', repName:'', contactName:'', position:'', phone:'', mobile:'', fax:'', email:'', bizRegNo:'', address:'', website:'', memo:'' };
    cardView.innerHTML = `
      <button type="button" class="back-link" id="crmBackBtn2">&larr; 고객 목록</button>
      <div class="card-title" style="margin-bottom:14px;">신규 고객 등록</div>
      <div id="crmAddFormWrap"></div>
    `;
    listView.style.display = 'none';
    cardView.style.display = 'block';
    document.getElementById('crmBackBtn2').addEventListener('click', ()=>{ addingNewCompany = false; openList(); });
    const wrap = document.getElementById('crmAddFormWrap');
    wrap.innerHTML = CO_FIELD_LABELS.map(([k,l])=> `<div class="co-form-field"><label>${l}</label><input type="text" id="crmNewF_${k}" /></div>`).join('') +
      `<div id="crmNewFErr" style="display:none;color:#B91C1C;font-size:12px;margin-bottom:8px;">업체명을 입력하세요.</div>
       <button type="button" class="co-text-action primary" id="crmNewFSave">등록</button>`;
    document.getElementById('crmNewFSave').addEventListener('click', ()=>{
      const patch = {};
      CO_FIELD_LABELS.forEach(([k])=>{ patch[k] = document.getElementById('crmNewF_' + k).value.trim(); });
      if(!patch.name){ document.getElementById('crmNewFErr').style.display = 'block'; return; }
      addingNewCompany = false;
      const rec = D.addCompany(patch);
      openCard(rec.id);
      renderList();
    });
  }

  // ---------------- 진입 ----------------
  document.getElementById('crmAddBtn').addEventListener('click', openAddCompanyForm);
  document.getElementById('hansolLinkBtn').addEventListener('click', ()=> window.open('../v2/', '_blank', 'noopener'));
  searchInput.addEventListener('input', ()=>{ searchQuery = searchInput.value.trim(); renderList(); });

  // 다른 탭(v2 또는 CRM의 다른 탭)에서 shin2-companies-staging을 바꾸면 native storage
  // 이벤트가 이 탭에 도착한다(자기 자신이 쓴 변경에는 절대 발생하지 않음 — 브라우저 표준
  // 동작). 지금 이 탭이 편집/신규등록 폼을 띄워둔 상태라면 사용자의 입력 중인 내용을
  // 덮어쓰지 않도록 재렌더링을 건너뛴다. 새 Firestore/네트워크 동작은 전혀 추가하지 않는다 —
  // 순수 localStorage 재조회 + 화면 재렌더링만 한다.
  window.addEventListener('storage', (e)=>{
    if(e.key !== 'shin2-companies-staging') return;
    if(cardState.editingCompany || cardState.chartEditing || addingNewCompany) return;
    if(cardView.style.display === 'block'){
      if(!currentCompanyId) return; // 신규등록 폼 등 id가 아직 없는 화면은 건드리지 않는다
      const co = D.findCompany(currentCompanyId);
      if(co){ renderChart(co); } else { openList(); }
    } else {
      renderList();
    }
  });

  const params = new URLSearchParams(location.search);
  const initialCompanyId = params.get('company');
  if(initialCompanyId && D.findCompany(initialCompanyId)){
    openCard(initialCompanyId);
  } else {
    renderList();
  }
};
// 게이트가 이 스크립트보다 먼저 통과되어 있었을 수도(세션 복원) 있고, 아직 안 됐을 수도
// 있다 — 두 경우 모두 정확히 한 번만 초기화되도록 플래그를 먼저 확인하고, 없으면 이벤트를 기다린다.
if(window.SHIN2_CRM_GATE_PASSED){ window.SHIN2_CRM_APP_INIT(); }
else { window.addEventListener('shin2-crm-gate-passed', window.SHIN2_CRM_APP_INIT, { once:true }); }
</script>
