  /* ==========================================================================
     요청자료 — 세로 리스트 패널(§요청자료 정리 라운드). 예전 "메모" 포스트잇 패널을
     그대로 재사용하되(같은 오버레이 열림/닫힘 구조, 같은 memoPanelState 변수, 같은
     D.memosFor/addMemo/updateMemo/deleteMemo 호출) 화면에는 두 가지 기존 데이터를
     날짜순으로 합쳐서 보여준다 — 새 저장소를 만들지 않는다:
       1) D.memosFor(co.id) — 직원이 자유 텍스트로 남긴 기록("15:41 msds발행" 같은
          기존 항목 포함). [수정]/[삭제]까지 그대로 가능.
       2) co.requestedMaterials — 전화기록에서 자동 추출되었거나 수동으로 추가된
          자재/자료 요청(§요청 자료 라운드에서 이미 만든 구조). 같은 sourceActivityId를
          가진 항목들은 한 통화에서 나온 것이므로 "단가표·시방서 요청"처럼 한 줄로 묶어
          보여준다. 여기서는 읽기+삭제만(자유 텍스트가 아니라 구조화된 자재명이라 인라인
          수정 대상에서 제외했다) — 상태(요청/준비중/발송완료) 선택 UI는 만들지 않는다(§9).
     "+ 요청자료 추가"로 새로 적는 항목은 자유 텍스트이므로 D.addMemo로 저장한다(메모
     저장 로직 재사용, §2). 다음 행동/전화기록 원문과는 여기서 절대 서로 변환하지 않는다.
     ========================================================================== */
  function buildRequestListItems(co){
    const items = [];
    D.memosFor(co.id).forEach(m=> items.push({
      id: 'memo:' + m.id, kind:'memo', memoId: m.id, text: m.text,
      ts: m.updatedAt || m.createdAt, createdAtIso: new Date(m.createdAt).toISOString()
    }));
    const materials = (co.requestedMaterials || []);
    const groups = new Map(); // sourceActivityId(있으면) 또는 개별 id로 그룹
    materials.forEach(mat=>{
      const key = mat.sourceActivityId ? ('act:' + mat.sourceActivityId) : ('single:' + mat.id);
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(mat);
    });
    groups.forEach(group=>{
      const types = group.map(g=> g.materialType).filter(Boolean);
      const earliest = group.reduce((a,b)=> new Date(a.createdAt) < new Date(b.createdAt) ? a : b);
      items.push({
        id: 'mat:' + group.map(g=> g.id).join(','), kind:'material',
        materialIds: group.map(g=> g.id), text: types.join('·') + ' 요청',
        ts: earliest.createdAt, createdAtIso: earliest.createdAt
      });
    });
    items.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
    return items;
  }
  let memoPanelState = { editingId: null, drafting: false, deleteConfirmId: null };
  function openMemoPanel(co){
    memoPanelState = { editingId: null, drafting: false, deleteConfirmId: null };
    renderMemoPanel(co);
  }
  function closeMemoPanel(){
    memoPanelState = { editingId: null, drafting: false, deleteConfirmId: null };
    const root = document.getElementById('memoPanelRoot');
    if(root) root.innerHTML = '';
    // 목록 건수가 바뀌었을 수 있으니 하단 [요청자료] 버튼 라벨만 다시 계산한다(카드 전체를 다시 그리지 않음).
    const btn = document.getElementById('cdashBtnMemo');
    if(btn && currentCompanyId){
      const co = D.findCompany(currentCompanyId);
      const n = co ? buildRequestListItems(co).length : 0;
      btn.textContent = n ? `요청자료 ${n}` : '요청자료';
    }
  }
  function reqRowHtml(co, it){
    const dateLabel = fmtDate(it.createdAtIso) + ' ' + fmtTime(it.createdAtIso);
    if(it.kind === 'memo' && memoPanelState.editingId === it.memoId){
      return `<div class="req-row req-row-edit" data-req-id="${esc(it.id)}">
        <div class="req-row-meta">${esc(dateLabel)}</div>
        <div class="req-row-edit-body">
          <textarea data-memo-edit-input="${esc(it.memoId)}">${esc(it.text)}</textarea>
          <div class="req-row-actions">
            <button type="button" class="cdash-mini-edit" data-memo-edit-cancel="1">취소</button>
            <button type="button" class="co-text-action primary" data-memo-edit-save="${esc(it.memoId)}" style="font-size:11px;padding:2px 8px;">저장</button>
          </div>
        </div>
      </div>`;
    }
    if(it.kind === 'memo' && memoPanelState.deleteConfirmId === it.id){
      return `<div class="req-row" data-req-id="${esc(it.id)}">
        <div class="req-row-meta">${esc(dateLabel)}</div>
        <div class="req-row-text">${esc(it.text)}</div>
        <div class="req-row-actions">
          삭제할까요?
          <button type="button" class="cdash-mini-edit" data-memo-del-cancel="1">취소</button>
          <button type="button" class="cdash-mini-edit" data-memo-del-confirm="${esc(it.memoId)}" style="color:#B91C1C;">삭제</button>
        </div>
      </div>`;
    }
    if(it.kind === 'material' && memoPanelState.deleteConfirmId === it.id){
      return `<div class="req-row" data-req-id="${esc(it.id)}">
        <div class="req-row-meta">${esc(dateLabel)}</div>
        <div class="req-row-text">${esc(it.text)}</div>
        <div class="req-row-actions">
          삭제할까요?
          <button type="button" class="cdash-mini-edit" data-material-del-cancel="1">취소</button>
          <button type="button" class="cdash-mini-edit" data-material-del-confirm="${esc(it.id)}" style="color:#B91C1C;">삭제</button>
        </div>
      </div>`;
    }
    return `<div class="req-row" data-req-id="${esc(it.id)}">
      <div class="req-row-meta">${esc(dateLabel)}</div>
      <div class="req-row-text">${esc(it.text)}</div>
      <div class="req-row-actions">
        ${it.kind === 'memo' ? `<button type="button" class="cdash-mini-edit" data-memo-edit="${esc(it.memoId)}">수정</button>` : ''}
        ${it.kind === 'memo'
          ? `<button type="button" class="cdash-mini-edit" data-memo-del="${esc(it.memoId)}">삭제</button>`
          : `<button type="button" class="cdash-mini-edit" data-material-del="${esc(it.id)}">삭제</button>`}
      </div>
    </div>`;
  }
  function reqDraftHtml(){
    return `<div class="req-row req-row-edit" id="memoDraftCard">
      <div class="req-row-meta">신규</div>
      <div class="req-row-edit-body">
        <textarea id="memoDraftInput" placeholder="요청자료 내용을 입력하세요"></textarea>
        <div class="req-row-actions">
          <button type="button" class="cdash-mini-edit" id="memoDraftCancel">취소</button>
          <button type="button" class="co-text-action primary" id="memoDraftSave" style="font-size:11px;padding:2px 8px;">저장</button>
        </div>
      </div>
    </div>`;
  }
  function renderMemoPanel(co){
    const root = document.getElementById('memoPanelRoot');
    if(!root) return;
    const items = buildRequestListItems(co);
    root.innerHTML = `
      <div class="chart-memo-overlay" id="memoPanelOverlay">
        <div class="chart-memo-panel req-panel" style="max-width:680px;">
          <div class="chart-memo-head">
            <div class="chart-memo-title">요청자료 — ${esc(co.name)}</div>
            <div style="display:flex;align-items:center;gap:10px;">
              <button type="button" class="co-text-action primary" id="memoPanelAddBtn">+ 요청자료 추가</button>
              <button type="button" class="chart-close-btn" id="memoPanelCloseBtn" aria-label="닫기">&times;</button>
            </div>
          </div>
          <div class="chart-memo-body req-list-scroll">
            ${memoPanelState.drafting ? reqDraftHtml() : ''}
            ${items.map(it=> reqRowHtml(co, it)).join('')}
            ${(!items.length && !memoPanelState.drafting) ? '<div class="chart-memo-preview-empty">아직 요청자료 기록이 없습니다. [+ 요청자료 추가]를 눌러 적어보세요.</div>' : ''}
          </div>
        </div>
      </div>
    `;
    document.getElementById('memoPanelCloseBtn').addEventListener('click', closeMemoPanel);
    document.getElementById('memoPanelAddBtn').addEventListener('click', ()=>{
      memoPanelState.drafting = true;
      renderMemoPanel(co);
      const input = document.getElementById('memoDraftInput');
      if(input) input.focus();
    });
    const draftInput = document.getElementById('memoDraftInput');
    if(draftInput){
      draftInput.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); document.getElementById('memoDraftSave').click(); }
      });
      document.getElementById('memoDraftCancel').addEventListener('click', ()=>{ memoPanelState.drafting = false; renderMemoPanel(co); });
      document.getElementById('memoDraftSave').addEventListener('click', ()=>{
        const text = draftInput.value.trim();
        if(!text) return;
        D.addMemo(co.id, text);
        memoPanelState.drafting = false;
        renderMemoPanel(co);
      });
    }
    root.querySelectorAll('[data-memo-edit]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.editingId = btn.getAttribute('data-memo-edit');
      renderMemoPanel(co);
      const ta = document.querySelector('[data-memo-edit-input]');
      if(ta) ta.focus();
    }));
    root.querySelectorAll('[data-memo-edit-cancel]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.editingId = null;
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-memo-edit-input]').forEach(ta=> ta.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
        e.preventDefault();
        const id = ta.getAttribute('data-memo-edit-input');
        document.querySelector(`[data-memo-edit-save="${id}"]`).click();
      }
    }));
    root.querySelectorAll('[data-memo-edit-save]').forEach(btn=> btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-memo-edit-save');
      const ta = document.querySelector(`[data-memo-edit-input="${id}"]`);
      const text = ta.value.trim();
      if(!text) return;
      D.updateMemo(id, text);
      memoPanelState.editingId = null;
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-memo-del]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.deleteConfirmId = 'memo:' + btn.getAttribute('data-memo-del');
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-memo-del-cancel]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.deleteConfirmId = null;
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-memo-del-confirm]').forEach(btn=> btn.addEventListener('click', ()=>{
      D.deleteMemo(btn.getAttribute('data-memo-del-confirm'));
      memoPanelState.deleteConfirmId = null;
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-material-del]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.deleteConfirmId = btn.getAttribute('data-material-del');
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-material-del-cancel]').forEach(btn=> btn.addEventListener('click', ()=>{
      memoPanelState.deleteConfirmId = null;
      renderMemoPanel(co);
    }));
    root.querySelectorAll('[data-material-del-confirm]').forEach(btn=> btn.addEventListener('click', ()=>{
      const compositeId = btn.getAttribute('data-material-del-confirm'); // 'mat:id1,id2,...'
      const idPart = compositeId.slice(compositeId.indexOf(':') + 1);
      idPart.split(',').forEach(matId=> D.removeRequestedMaterial(co.id, matId));
      memoPanelState.deleteConfirmId = null;
      currentCompanyId ? renderMemoPanel(D.findCompany(currentCompanyId)) : renderMemoPanel(co);
    }));
  }

  // 활동 추가/수정/삭제 뒤에 상단 요약/최근 활동/타임라인/니즈 제안을 함께 갱신한다(§ 데이터는

  /* ==========================================================================
     Partner Dashboard 이관 UI(§ Partner Dashboard 이관 라운드) — 목록 화면 상단
     [협력사 데이터 가져오기] 버튼으로 연다. 흐름: [분석 시작](읽기 전용, 아무것도 저장 안 함)
     → 숫자 요약 + 매칭/신규/검토필요 목록 + 샘플 5건 비교 → 사람이 확인 → [적용](이때만
     실제로 저장). 검토 필요 항목은 이 화면에서 자동 처리하지 않는다(§4 원칙) — 명단만
     보여주고, 실제 처리는 직원이 각 업체를 열어 수동으로 판단한다.
     ========================================================================== */
  let piState = { preview: null, applied: null };
  function openPartnerImportModal(){
    piState = { preview: null, applied: null };
    renderPartnerImportModal();
  }
  function closePartnerImportModal(){
    piState = { preview: null, applied: null };
    document.getElementById('partnerImportModalRoot').innerHTML = '';
  }
  function renderPartnerImportModal(){
    const root = document.getElementById('partnerImportModalRoot');
    if(!root) return;
    const snapshotCount = (window.SHIN2_PARTNER_SNAPSHOT || []).length;

    if(!piState.preview){
      root.innerHTML = `
        <div class="pi-overlay" id="piOverlay">
          <div class="pi-panel" role="dialog" aria-modal="true" aria-label="협력사 데이터 가져오기">
            <div class="pi-head">
              <div class="pi-title">Partner Dashboard 협력업체 데이터 가져오기</div>
              <button type="button" class="chart-close-btn" id="piCloseBtn" aria-label="닫기">&times;</button>
            </div>
            <div class="pi-body">
              <div class="pi-note">
                원본: pourservice/partner-dashboard (2026-07-23 스냅샷, 총 ${snapshotCount}개 업체 — 내부 협력업체 리스트 + 등급 + 신규 MOU 진행현황을 업체명 기준으로 병합).<br/>
                [분석 시작]은 아무것도 저장하지 않습니다 — 현재 CRM 업체와 비교한 결과만 미리 보여줍니다. 실제 저장은 결과를 확인한 뒤 [적용]을 눌러야만 일어납니다.
              </div>
            </div>
            <div class="pi-actions">
              <button type="button" class="co-text-action" id="piCancelBtn">닫기</button>
              <button type="button" class="co-text-action primary" id="piAnalyzeBtn">분석 시작</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('piCloseBtn').addEventListener('click', closePartnerImportModal);
      document.getElementById('piCancelBtn').addEventListener('click', closePartnerImportModal);
      document.getElementById('piAnalyzeBtn').addEventListener('click', ()=>{
        piState.preview = D.previewPartnerImport();
        renderPartnerImportModal();
      });
      return;
    }

    const p = piState.preview;
    const sampleMatched = p.matched.slice(0, 5);
    const rowsHtml = (list, metaFn)=> list.length
      ? `<div class="pi-list">${list.map(x=> `<div class="pi-row"><span class="pi-row-name">${esc(x.partner.name)}</span><span class="pi-row-meta">${esc(metaFn(x))}</span></div>`).join('')}</div>`
      : `<div class="pi-note">해당 없음</div>`;

    root.innerHTML = `
      <div class="pi-overlay" id="piOverlay">
        <div class="pi-panel" role="dialog" aria-modal="true" aria-label="협력사 데이터 가져오기 분석 결과">
          <div class="pi-head">
            <div class="pi-title">분석 결과${piState.applied ? ' — 적용 완료' : ''}</div>
            <button type="button" class="chart-close-btn" id="piCloseBtn" aria-label="닫기">&times;</button>
          </div>
          <div class="pi-body">
            <div class="pi-stats">
              <div class="pi-stat"><div class="pi-stat-num">${p.total}</div><div class="pi-stat-label">원본 전체 업체</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.matched.length}</div><div class="pi-stat-label">기존 CRM과 매칭</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.newCompanies.length}</div><div class="pi-stat-label">신규 등록 대상</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.review.length}</div><div class="pi-stat-label">매칭 검토 필요</div></div>
            </div>

            ${piState.applied ? `
              <div class="pi-result-box">
                <b>적용 완료</b> — 기존 업체 ${piState.applied.mergedCount}건 병합(협력정보만 추가, company.id·기존 내용 그대로 유지), 신규 업체 ${piState.applied.createdCount}건 생성.
                검토 필요 ${piState.applied.reviewCount}건은 자동 처리하지 않았습니다 — 아래 목록에서 업체를 직접 확인해주세요.

                  <thead><tr><th>원본 업체명</th><th>매칭 기준</th><th>CRM 업체명(id)</th><th>사업자번호</th><th>전화</th></tr></thead>
                  <tbody>
                    ${sampleMatched.map(m=>{
                      const co = D.findCompany(m.companyId);
                      return `<tr>
                        <td>${esc(m.partner.name)}</td>

            <div class="pi-section">

            <div class="pi-section">

            </div>

          <div class="pi-actions">

              ? `<button type="button" class="co-text-action primary" id="piDoneBtn">닫기</button>`
              : `<button type="button" class="co-text-action" id="piCancelBtn">취소</button>
                 <button type="button" class="co-text-action primary" id="piApplyBtn">적용(${p.matched.length + p.newCompanies.length}건 저장)</button>`}

        </div>

    if(piState.applied){
      document.getElementById('piDoneBtn').addEventListener('click', ()=>{ closePartnerImportModal(); renderList(); });
    } else {
      document.getElementById('piCancelBtn').addEventListener('click', closePartnerImportModal);
      document.getElementById('piApplyBtn').addEventListener('click', ()=>{
        piState.applied = D.applyPartnerImport();
        renderPartnerImportModal();
      });
    }
  }

  /* ==========================================================================

              <div class="pi-note">
                원본: ★1)POUR 년도별 공사실적 List 26.08.04.xlsx (2024~2026년 시트, 총 ${snapshotCount}건 — 시공사명이 실제로 있는 행만).<br/>
                업체명을 정규화((주)/㈜/주식회사 표기 차이만 제거)해서 CRM 업체와 완전히 같을 때만 연결합니다 — 부분일치는 자동 연결하지 않습니다.<br/>
                [분석 시작]은 아무것도 저장하지 않습니다 — 결과를 확인한 뒤 [적용]을 눌러야만 실적이 저장됩니다. CRM에 새 업체를 만들지 않습니다.
              </div>
            </div>
            <div class="pi-actions">
              <button type="button" class="co-text-action" id="pourPiCancelBtn">닫기</button>
              <button type="button" class="co-text-action primary" id="pourPiAnalyzeBtn">분석 시작</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('pourPiCloseBtn').addEventListener('click', closePourImportModal);
      document.getElementById('pourPiCancelBtn').addEventListener('click', closePourImportModal);
      document.getElementById('pourPiAnalyzeBtn').addEventListener('click', ()=>{
        pourImpState.preview = D.previewPourTrackImport();
        renderPourImportModal();
      });
      return;
    }

    const p = pourImpState.preview;
    const sampleMatched = p.matched.slice(0, 5);

    root.innerHTML = `
      <div class="pi-overlay" id="pourPiOverlay">
        <div class="pi-panel" role="dialog" aria-modal="true" aria-label="POUR 시공실적 가져오기 분석 결과">
          <div class="pi-head">
            <div class="pi-title">분석 결과${pourImpState.applied ? ' — 적용 완료' : ''}</div>
            <button type="button" class="chart-close-btn" id="pourPiCloseBtn" aria-label="닫기">&times;</button>
          </div>
          <div class="pi-body">
            <div class="pi-stats">
              <div class="pi-stat"><div class="pi-stat-num">${p.totalRecords}</div><div class="pi-stat-label">엑셀 전체 실적 행</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.totalCompanies}</div><div class="pi-stat-label">엑셀 내 시공사 수</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.matched.length}</div><div class="pi-stat-label">CRM과 매칭된 업체</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.matchedRecordCount}</div><div class="pi-stat-label">매칭된 실적 건수</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.unmatched.length}</div><div class="pi-stat-label">CRM에 없는 업체</div></div>
              <div class="pi-stat"><div class="pi-stat-num">${p.review.length}</div><div class="pi-stat-label">매칭 검토 필요</div></div>
            </div>

            ${pourImpState.applied ? `
              <div class="pi-result-box">
                <b>적용 완료</b> — ${pourImpState.applied.companiesLinked}개 업체에 실적 ${pourImpState.applied.recordsAdded}건 새로 연결(company.id·기존 데이터는 그대로, 이미 있던 실적은 중복 추가하지 않음).
                검토 필요 ${pourImpState.applied.reviewCount}건 / CRM에 없는 업체 ${pourImpState.applied.unmatchedCount}건은 자동 처리하지 않았습니다.
              </div>
              <div class="pi-section" style="margin-top:14px;"></div>
            ` : ''}

            <div class="pi-section">
              <div class="pi-section-title">샘플 매칭(최대 5건) — 엑셀 시공사명 → CRM 업체</div>
              <div style="overflow-x:auto;">
                <table class="pi-sample-table">
                  <thead><tr><th>엑셀 시공사명</th><th>실적 건수</th><th>CRM 업체명(id)</th></tr></thead>
                  <tbody>
                    ${sampleMatched.map(m=> `<tr>
                        <td>${esc(m.excelName)}</td>
                        <td>${m.records.length}</td>
                        <td>${esc(m.companyName)} (${esc(m.companyId)})</td>
                      </tr>`).join('') || '<tr><td colspan="3">매칭된 업체가 없습니다</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="pi-section">
              <div class="pi-section-title">CRM에 없는 업체(${p.unmatched.length}건) — 자동 생성하지 않음</div>
              ${p.unmatched.length ? `<div class="pi-list">${p.unmatched.map(x=> `<div class="pi-row"><span class="pi-row-name">${esc(x.excelName)}</span><span class="pi-row-meta">실적 ${x.recordCount}건</span></div>`).join('')}</div>` : '<div class="pi-note">해당 없음</div>'}
            </div>

            <div class="pi-section">
              <div class="pi-section-title">매칭 검토 필요 — 자동 처리하지 않음(${p.review.length}건)</div>
              ${p.review.length ? `<div class="pi-list">${p.review.map(r=> `<div class="pi-row"><span class="pi-row-name">${esc(r.excelName)}</span><span class="pi-row-meta">${esc(r.reason)} — 후보: ${esc(r.candidates.map(c=>c.name).join(', '))} (실적 ${r.recordCount}건)</span></div>`).join('')}</div>` : '<div class="pi-note">해당 없음</div>'}
            </div>
          </div>
          <div class="pi-actions">
            ${pourImpState.applied
              ? `<button type="button" class="co-text-action primary" id="pourPiDoneBtn">닫기</button>`
              : `<button type="button" class="co-text-action" id="pourPiCancelBtn">취소</button>
                 <button type="button" class="co-text-action primary" id="pourPiApplyBtn">적용(${p.matched.length}개 업체 연결)</button>`}
          </div>
        </div>
      </div>
    `;
    document.getElementById('pourPiCloseBtn').addEventListener('click', closePourImportModal);
    if(pourImpState.applied){
      document.getElementById('pourPiDoneBtn').addEventListener('click', ()=>{ closePourImportModal(); renderList(); });
    } else {
      document.getElementById('pourPiCancelBtn').addEventListener('click', closePourImportModal);
      document.getElementById('pourPiApplyBtn').addEventListener('click', ()=>{
        pourImpState.applied = D.applyPourTrackImport();
        renderPourImportModal();
      });
    }
  }

  // ---------------- 진입 ----------------
  document.getElementById('crmAddBtn').addEventListener('click', openAddCompanyForm);
  document.getElementById('crmPartnerImportBtn').addEventListener('click', openPartnerImportModal);
  document.getElementById('crmPourImportBtn').addEventListener('click', openPourImportModal);
  document.getElementById('hansolLinkBtn').addEventListener('click', ()=> window.open('../v2/', '_blank', 'noopener'));
  searchInput.addEventListener('input', ()=>{ searchQuery = searchInput.value.trim(); currentPage = 1; renderList(); });
  const sortSelect = document.getElementById('crmSortSelect');
  if(sortSelect){
    sortSelect.value = sortMode;
    sortSelect.addEventListener('change', ()=>{ sortMode = sortSelect.value; currentPage = 1; renderList(); });
  }

  // 다른 탭(v2 또는 CRM의 다른 탭)에서 shin2-companies-staging을 바꾸면 native storage
  // 이벤트가 이 탭에 도착한다(자기 자신이 쓴 변경에는 절대 발생하지 않음 — 브라우저 표준
  // 동작). 지금 이 탭이 편집/신규등록 폼을 띄워둔 상태라면 사용자의 입력 중인 내용을
  // 덮어쓰지 않도록 재렌더링을 건너뛴다. 새 Firestore/네트워크 동작은 전혀 추가하지 않는다 —
  // 순수 localStorage 재조회 + 화면 재렌더링만 한다.
  window.addEventListener('storage', (e)=>{
    if(e.key !== 'shin2-companies-staging') return;
    if(cardState.editingCompany || cardState.chartEditing || addingNewCompany) return;
    if(cardView.style.display === 'block'){
      if(!currentCompanyId) return; // 신규등록 폼 등 id가 아직 없는 화면은 건드리지 않는다
      const co = D.findCompany(currentCompanyId);
      if(co){ renderChart(co); } else { openList(); }
    } else {
      renderList();
    }
  });

  const params = new URLSearchParams(location.search);
  const initialCompanyId = params.get('company');
  if(initialCompanyId && D.findCompany(initialCompanyId)){
    openCard(initialCompanyId);
  } else {
    renderList();
  }
};
// 게이트가 이 스크립트보다 먼저 통과되어 있었을 수도(세션 복원) 있고, 아직 안 됐을 수도
// 있다 — 두 경우 모두 정확히 한 번만 초기화되도록 플래그를 먼저 확인하고, 없으면 이벤트를 기다린다.
if(window.SHIN2_CRM_GATE_PASSED){ window.SHIN2_CRM_APP_INIT(); }
else { window.addEventListener('shin2-crm-gate-passed', window.SHIN2_CRM_APP_INIT, { once:true }); }
</script>
<!-- §서류함 단순화 라운드: 명함 OCR 자동인식 기능을 제거하면서 이 페이지에서 더 이상 쓰지
     않는 Tesseract 로드도 함께 제거했다(서류함이 파일 저장/목록만 하도록 단순화). -->
</body>
</html>
