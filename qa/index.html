<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&amp;A 자료실</title>
<style>
  /* ============================================================
     Q&A 자료실 전용 스타일 — 기존 루트 사이트(../index.html)의 CSS와는
     완전히 분리되어 있습니다. 모든 클래스/변수에 qna- 접두사를 사용해
     혹시 같은 페이지에 다른 스타일이 섞이더라도 충돌하지 않게 했습니다.
     ============================================================ */
  :root{
    --qna-bg:#f7f9fc;
    --qna-card-bg:#ffffff;
    --qna-border:#d7dee7;
    --qna-navy:#244a73;
    --qna-navy-dark:#1b3a5c;
    --qna-navy-soft:#e8edf4;
    --qna-blue:#3b82f6;
    --qna-blue-soft:#eaf2fe;
    --qna-text:#1f2937;
    --qna-text-gray:#6b7280;
    --qna-text-faint:#9aa3af;
    --qna-danger:#ef4444;
    --qna-danger-soft:#fdecec;
    --qna-success:#22c55e;
    --qna-success-soft:#eafaf0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--qna-bg);
    color:var(--qna-text);
  }
  .qna-app{max-width:1180px;margin:0 auto;padding:0 24px 60px;}
  .qna-topbar{border-bottom:1px solid var(--qna-border);background:#fff;margin-bottom:24px;}
  .qna-topbar-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:baseline;gap:12px;}
  .qna-brand{font-size:20px;font-weight:800;color:var(--qna-navy);}
  .qna-brand-sub{font-size:12.5px;font-weight:500;color:var(--qna-text-faint);}

  .qna-head{margin-bottom:18px;}
  .qna-head h1{font-size:26px;margin:0 0 4px;color:var(--qna-navy);}
  .qna-head p{margin:0;color:var(--qna-text-gray);font-size:13px;}

  .qna-tabs{display:flex;gap:0;border-bottom:1px solid var(--qna-border);margin-bottom:18px;}
  .qna-tab{
    background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;margin-right:26px;
    font-size:15px;font-weight:700;color:var(--qna-text-gray);cursor:pointer;font-family:inherit;
  }
  .qna-tab:hover{color:var(--qna-navy-dark);}
  .qna-tab.active{color:var(--qna-navy);border-bottom-color:var(--qna-navy);}

  .qna-search-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .qna-search-input{
    flex:1;min-width:220px;height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--qna-border);
    font-size:15px;font-family:inherit;background:var(--qna-bg);color:var(--qna-text);
  }
  .qna-search-input:focus{outline:none;border-color:var(--qna-navy);background:#fff;box-shadow:0 0 0 3px var(--qna-blue-soft);}
  .qna-scope-toggle{display:flex;border:1px solid var(--qna-border);border-radius:8px;overflow:hidden;flex:none;}
  .qna-scope-btn{background:#fff;border:none;padding:0 14px;height:44px;font-size:12.5px;font-weight:700;color:var(--qna-text-gray);cursor:pointer;font-family:inherit;}
  .qna-scope-btn + .qna-scope-btn{border-left:1px solid var(--qna-border);}
  .qna-scope-btn.active{background:var(--qna-navy);color:#fff;}
  .qna-add-btn{
    flex:none;height:44px;padding:0 18px;background:var(--qna-navy);color:#fff;border:none;border-radius:8px;
    font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .qna-add-btn:hover{background:var(--qna-navy-dark);}

  .qna-stats-row{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:16px;padding:12px 16px;background:var(--qna-bg);border:1px solid var(--qna-border);border-radius:8px;}
  .qna-stat{font-size:13px;color:var(--qna-text-gray);}
  .qna-stat b{color:var(--qna-text);font-size:14px;}
  .qna-stat.warn b{color:#b45309;}
  .qna-unanswered-toggle{margin-left:auto;background:#fff;border:1px solid var(--qna-border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--qna-text-gray);cursor:pointer;font-family:inherit;}
  .qna-unanswered-toggle.active{background:var(--qna-navy);border-color:var(--qna-navy);color:#fff;}
  .qna-cat-manage-btn{background:none;border:1px solid var(--qna-border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--qna-text-gray);cursor:pointer;font-family:inherit;}
  .qna-cat-manage-btn:hover{border-color:var(--qna-navy);color:var(--qna-navy-dark);}

  .qna-freq{margin-bottom:16px;}
  .qna-freq-title{font-size:12px;font-weight:700;color:var(--qna-text-gray);margin-bottom:8px;}
  .qna-freq-list{display:flex;flex-wrap:wrap;gap:8px;}
  .qna-freq-item{font-size:12.5px;color:var(--qna-text);background:var(--qna-card-bg);border:1px solid var(--qna-border);border-radius:999px;padding:5px 12px;}
  .qna-freq-item b{color:var(--qna-navy-dark);}

  .qna-table-wrap{border:1px solid var(--qna-border);border-radius:10px;overflow:hidden;overflow-x:auto;background:#fff;}
  table.qna-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.qna-table th{
    text-align:left;background:var(--qna-bg);color:var(--qna-text-gray);font-size:11.5px;font-weight:700;
    padding:10px 14px;border-bottom:1px solid var(--qna-border);white-space:nowrap;
  }
  table.qna-table td{padding:12px 14px;border-bottom:1px solid var(--qna-border);vertical-align:top;color:var(--qna-text);}
  table.qna-table tr:last-child td{border-bottom:none;}
  table.qna-table tbody tr.qna-row{cursor:pointer;}
  table.qna-table tbody tr.qna-row:hover{background:var(--qna-blue-soft);}
  table.qna-table tbody tr.qna-row.expanded{background:var(--qna-blue-soft);}
  .qna-cat-pill{display:inline-block;background:var(--qna-navy-soft);color:var(--qna-navy-dark);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .qna-q-summary{font-weight:600;}
  .qna-similar-tag{display:block;margin-top:4px;font-size:11px;color:var(--qna-blue);}
  .qna-status{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .qna-status.unanswered{background:var(--qna-danger-soft);color:var(--qna-danger);}
  .qna-status.answered{background:var(--qna-success-soft);color:var(--qna-success);}
  .qna-official{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--qna-navy-dark);}
  .qna-stage-tag{font-size:11px;color:var(--qna-text-gray);}
  .qna-empty{padding:60px 0;text-align:center;color:var(--qna-text-gray);font-size:14px;}

  .qna-detail-row td{background:#fbfcfe;padding:0;}
  .qna-detail{padding:18px 22px 22px;border-top:1px dashed var(--qna-border);}
  .qna-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 24px;margin-bottom:16px;}
  .qna-detail-item{min-width:0;}
  .qna-detail-item.wide{grid-column:1 / -1;}
  .qna-detail-label{font-size:11px;font-weight:700;color:var(--qna-text-gray);margin-bottom:4px;letter-spacing:.02em;}
  .qna-detail-val{font-size:13.5px;color:var(--qna-text);white-space:pre-wrap;line-height:1.6;}
  .qna-detail-actions{display:flex;gap:8px;margin-bottom:14px;}
  .qna-answer-box{border-top:1px solid var(--qna-border);padding-top:14px;margin-top:4px;}
  .qna-answer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
  .qna-answer-head-label{font-size:12px;font-weight:700;color:var(--qna-text-gray);}
  .qna-official-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--qna-text-gray);cursor:pointer;}
  .qna-official-toggle input{accent-color:var(--qna-navy);}
  .qna-answer-textarea, .qna-memo-textarea{
    width:100%;min-height:90px;padding:10px 12px;border-radius:8px;border:1px solid var(--qna-border);
    font-size:13.5px;font-family:inherit;line-height:1.6;resize:vertical;color:var(--qna-text);
  }
  .qna-answer-textarea:focus, .qna-memo-textarea:focus{outline:none;border-color:var(--qna-navy);}
  .qna-memo-box{margin-top:14px;}
  .qna-memo-label{font-size:12px;font-weight:700;color:var(--qna-text-gray);margin-bottom:8px;}
  .qna-save-row{display:flex;justify-content:flex-end;margin-top:8px;}
  .qna-similar-list{margin-top:14px;padding-top:14px;border-top:1px solid var(--qna-border);}
  .qna-similar-list-title{font-size:12px;font-weight:700;color:var(--qna-text-gray);margin-bottom:8px;}
  .qna-similar-list-item{font-size:12.5px;color:var(--qna-text);padding:6px 0;border-bottom:1px solid var(--qna-border);}
  .qna-similar-list-item:last-child{border-bottom:none;}
  .qna-similar-list-item span{color:var(--qna-text-gray);}

  .qna-btn{border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .qna-btn-primary{background:var(--qna-navy);color:#fff;}
  .qna-btn-primary:hover{background:var(--qna-navy-dark);}
  .qna-btn-ghost{background:var(--qna-bg);color:var(--qna-text-gray);}
  .qna-btn-ghost:hover{background:var(--qna-blue-soft);}
  .qna-icon-btn{background:#fff;border:1px solid var(--qna-border);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--qna-text-gray);font-size:12px;}
  .qna-icon-btn.danger:hover{border-color:var(--qna-danger);color:var(--qna-danger);}

  /* 모달 */
  .qna-modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,16,26,.5);
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .qna-modal-overlay.open{display:flex;}
  .qna-modal{
    background:#fff;border-radius:14px;padding:24px;width:100%;max-width:640px;
    max-height:88vh;overflow-y:auto;
  }
  .qna-modal h2{margin:0 0 16px;font-size:18px;color:var(--qna-navy);}
  .qna-field{margin-bottom:14px;}
  .qna-field label{display:block;font-size:12px;font-weight:700;color:var(--qna-text-gray);margin-bottom:6px;}
  .qna-field input[type=text], .qna-field input[type=date], .qna-field textarea, .qna-field select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--qna-border);
    font-size:14px;font-family:inherit;resize:vertical;background:#fff;color:var(--qna-text);
  }
  .qna-field textarea{min-height:90px;}
  .qna-field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .qna-field-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--qna-text);margin-top:28px;}
  .qna-field-check input{accent-color:var(--qna-navy);}
  .qna-field-hint{font-size:11px;color:var(--qna-text-faint);margin-top:4px;}
  .qna-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .qna-cat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .qna-cat-row input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--qna-border);font-size:13px;font-family:inherit;}
  .qna-cat-row input:focus{outline:none;border-color:var(--qna-navy);}
  .qna-cat-count{font-size:11px;color:var(--qna-text-faint);flex:none;width:44px;text-align:right;}
  .qna-cat-add-row{display:flex;gap:8px;margin-top:12px;}
  .qna-cat-add-row input{
    flex:1;min-width:0;padding:9px 12px;border-radius:8px;border:1px solid var(--qna-border);font-size:14px;font-family:inherit;
  }
  .qna-cat-add-row button{
    background:var(--qna-navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;
    font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .qna-cat-add-row button:hover{background:var(--qna-navy-dark);}

  .qna-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--qna-navy);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;
    opacity:0;transition:all .25s;pointer-events:none;z-index:200;
  }
  .qna-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:720px){
    .qna-app{padding:0 14px 40px;}
    .qna-detail-grid{grid-template-columns:1fr;}
    .qna-field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="qna-topbar">
  <div class="qna-topbar-inner">
    <span class="qna-brand">Q&amp;A</span>
    <span class="qna-brand-sub">전사 공용 질문·답변 자료실 (기존 사이트와 별개의 독립 페이지입니다)</span>
  </div>
</div>

<div class="qna-app">
  <div id="qnaMain"></div>
</div>

<div class="qna-modal-overlay" id="qnaModalOverlay">
  <div class="qna-modal" id="qnaModal"></div>
</div>
<div class="qna-toast" id="qnaToast"></div>

<!-- Q&A 전용 Firebase 설정 파일. 없어도 조용히 무시되고 이 페이지 localStorage만으로 동작합니다. -->
<script src="firebaseConfig.js" onerror="console.warn('qa/firebaseConfig.js 없음 — localStorage 전용 모드로 동작합니다')"></script>

<!-- Q&A 전용 Firebase 실시간 동기화 브릿지. 기존 루트 사이트의 CLOUD_COLLECTIONS와는
     전혀 다른 이름(qna_questions / qna_categories)의 컬렉션만 사용하므로 기존 데이터와
     절대 겹치지 않습니다. -->
<script type="module">
  const QNA_CLOUD_COLLECTIONS = ['qna_questions', 'qna_categories'];
  const cfg = window.QNA_FIREBASE_CONFIG;
  if(!cfg || !cfg.projectId){
    console.info('[Q&A] Firebase 설정이 없어 localStorage 전용 모드로 동작합니다.');
  } else {
    (async () => {
      try{
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
        const {
          getFirestore, doc, setDoc, onSnapshot, getDoc,
          enableIndexedDbPersistence, serverTimestamp
        } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');

        const app = initializeApp(cfg, 'qna-site'); // 이름을 지정해 루트 사이트가 같은 페이지에 없어도 항상 독립 인스턴스로 초기화
        const db = getFirestore(app);
        try{ await enableIndexedDbPersistence(db); } catch(e){ /* 오프라인 캐시 실패는 무시 */ }

        const pushTimers = {};
        function pushToCloud(key, data){
          clearTimeout(pushTimers[key]);
          pushTimers[key] = setTimeout(async () => {
            try{ await setDoc(doc(db, key, 'data'), { value: data, updatedAt: serverTimestamp() }); }
            catch(e){ console.error(`[Q&A][Firebase] ${key} 저장 실패`, e); }
          }, 500);
        }
        window.__qnaCloudSync = {
          ready: true,
          push(key, data){ if(QNA_CLOUD_COLLECTIONS.includes(key)) pushToCloud(key, data); }
        };

        window.dispatchEvent(new CustomEvent('qna-cloud-sync-init', {
          detail: {
            async seedIfEmpty(key, localData){
              const snap = await getDoc(doc(db, key, 'data'));
              if(!snap.exists()) await setDoc(doc(db, key, 'data'), { value: localData, updatedAt: serverTimestamp() });
            }
          }
        }));

        QNA_CLOUD_COLLECTIONS.forEach(key => {
          onSnapshot(doc(db, key, 'data'), (snap) => {
            if(!snap.exists()) return;
            const payload = snap.data();
            window.dispatchEvent(new CustomEvent('qna-cloud-sync-update', { detail: { key, data: payload.value } }));
          }, (err) => console.error(`[Q&A][Firebase] ${key} 구독 실패`, err));
        });

        window.dispatchEvent(new CustomEvent('qna-cloud-sync-ready'));
        console.info('[Q&A] 실시간 동기화 연결됨');
      } catch(err){
        console.error('[Q&A] Firebase 초기화 실패 — localStorage 전용 모드로 동작합니다.', err);
      }
    })();
  }
</script>

<script>
/* ============================================================
   Q&A 자료실 — 완전 독립 페이지
   업체별로 화면을 나누지 않고, 1차 미팅 / 2차 미팅 / PT에서 나온 질문을
   하나의 전역 목록(qnaState.questions)에 계속 누적하는 전사 공용 Q&A
   데이터베이스입니다. companyName/companyId는 출처 추적용으로만 씁니다.
   ============================================================ */
const QNA_STORAGE_KEY = 'qna-site-state-v1';
function qnaUid(){ return 'q' + Math.random().toString(36).slice(2,10); }

const QNA_STAGES = [
  {key:'first', label:'1차 미팅 Q&A'},
  {key:'second', label:'2차 미팅 Q&A'},
  {key:'pt', label:'PT Q&A'}
];
const QNA_QUESTIONER_OPTIONS = ['회장','동대표','관리소장','관리사무소','입주민','기타'];
const QNA_DEFAULT_CATEGORIES = ['조달','가격 / 단가','수익 / 마진','공법','자재','특허','영업지원','실행공사','계약 / 대금','시공','하자','보증','타 공법 / 경쟁사','기타'];

// 서강건설 1차 미팅에서 실제 나온 질문 — 2차 미팅이 아니라 1차 미팅 Q&A 초기 데이터로 등록한다.
function qnaBuildSeedQuestions(){
  const now = new Date().toISOString();
  const mk = (category, questionSummary, lines, questionContext, companyName) => ({
    id: qnaUid(), stage:'first', category, questionSummary,
    questionOriginal: lines.join('\n'), questionContext: questionContext || '',
    answer:'', answerStatus:'unanswered', officialAnswer:false,
    companyName, companyId:'', siteName:'', questioner:'', meetingDate:'', followUpNeeded:false,
    memo:'', createdAt: now, updatedAt: now
  });
  return [
    mk('조달', '아스팔트슁글 조달 가능 여부', [
      'POUR 제품이나 공법은 조달 등록이 되어 있나요?',
      '아스팔트슁글도 조달을 통해 진행할 수 있나요?',
      '현재 조달 등록이 되어 있지 않은 제품은 향후 등록 계획이 있나요?'
    ], '과거 POUR 아스팔트슁글을 사용하고 싶었으나 조달 등록 문제로 진행하지 못한 경험이 있음.', '(주)서강건설'),
    mk('가격 / 단가', '현장별 가격·단가 조정 가능 여부', [
      '아파트 입찰에서 단가 경쟁이 발생하면 현장 상황에 따라 가격 조정이 가능한가요?',
      '견적 경쟁 시 본사에서 가격 협의나 지원이 가능한가요?'
    ], '', '(주)서강건설'),
    mk('수익 / 마진', 'POUR 협력사의 평균 마진·수익', [
      'POUR공법 실제 공사 시 시공사가 가져가는 평균 마진은 어느 정도인가요?',
      '공종별로 마진율이 다른가요?',
      '일반 공사 대비 POUR 협력사의 수익적인 장점은 무엇인가요?'
    ], '', '(주)서강건설'),
    mk('실행공사', '실행공사 진행 시 대금·계약 구조', [

function qnaLoadState(){
  try{
    const raw = localStorage.getItem(QNA_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.categories)) parsed.categories = QNA_DEFAULT_CATEGORIES.slice();
      if(!Array.isArray(parsed.questions)) parsed.questions = [];
      return parsed;
    }
  }catch(e){}
  return { categories: QNA_DEFAULT_CATEGORIES.slice(), questions: qnaBuildSeedQuestions() };
}
let qnaState = qnaLoadState();

function qnaSaveState(){
  localStorage.setItem(QNA_STORAGE_KEY, JSON.stringify(qnaState));
  if(window.__qnaCloudSync && window.__qnaCloudSync.ready){
    window.__qnaCloudSync.push('qna_questions', qnaState.questions);
    window.__qnaCloudSync.push('qna_categories', qnaState.categories);
  }
}

// Firebase 실시간 동기화 연결(연결 안 되면 조용히 무시되고 localStorage 그대로 동작)
function qnaIsUserTyping(){
  const ae = document.activeElement;
  return !!(ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox')));
}
let qnaPendingCloudRender = false;
document.addEventListener('focusout', ()=>{
  if(qnaPendingCloudRender && !qnaIsUserTyping()){ qnaPendingCloudRender = false; qnaRender(); }
}, true);
window.addEventListener('qna-cloud-sync-init', async (e) => {
  try{
    await e.detail.seedIfEmpty('qna_questions', qnaState.questions);
    await e.detail.seedIfEmpty('qna_categories', qnaState.categories);
  }catch(err){ console.error('[Q&A] 초기 동기화(시드) 실패', err); }
});
window.addEventListener('qna-cloud-sync-update', (e) => {
  const { key, data } = e.detail;
  if(data == null) return;
  if(key === 'qna_questions') qnaState.questions = data;
  else if(key === 'qna_categories') qnaState.categories = data;
  localStorage.setItem(QNA_STORAGE_KEY, JSON.stringify(qnaState));
  if(qnaIsUserTyping()) qnaPendingCloudRender = true; else qnaRender();
});
window.addEventListener('qna-cloud-sync-ready', () => qnaShowToast('실시간 동기화가 연결되었습니다'));

function qnaEscapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function qnaShowToast(msg){
  const t = document.getElementById('qnaToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(qnaShowToast._timer);
  qnaShowToast._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

// 탐색 위치(현재 탭/검색어/필터)는 데이터가 아니므로 localStorage에 저장하지 않는다.
let qnaActiveTab = 'first';
let qnaSearchQuery = '';
let qnaSearchScope = 'all'; // 'all' | 'tab'
let qnaUnansweredOnly = false;
let qnaExpandedId = null;

function qnaStageLabel(key){
  const s = QNA_STAGES.find(s=>s.key===key);
  return s ? s.label : key;
}
function qnaFormatDate(value){
  if(!value) return '';
  const d = new Date(value);
  if(isNaN(d.getTime())) return '';
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yy}.${mm}.${dd}`;
}
function qnaMatchesQuery(item, q){
  const hay = [
    item.category, item.questionSummary, item.questionOriginal, item.questionContext,
    item.answer, item.memo, item.companyName, item.siteName, item.questioner
  ].filter(Boolean).join('\n').toLowerCase();
  return hay.includes(q);
}
function qnaVisibleList(){
  const q = qnaSearchQuery.trim().toLowerCase();
  const searchAll = !!q && qnaSearchScope === 'all';
  let list = qnaState.questions.filter(item => searchAll ? true : item.stage === qnaActiveTab);
  if(q) list = list.filter(item => qnaMatchesQuery(item, q));
  if(qnaUnansweredOnly) list = list.filter(item => item.answerStatus !== 'answered');
  return list.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
}
function qnaTabStats(stage){
  const list = qnaState.questions.filter(item => item.stage === stage);
  return { total: list.length, unanswered: list.filter(item => item.answerStatus !== 'answered').length };
}
function qnaTopCategories(stage){
  const counts = {};
  qnaState.questions.filter(item => item.stage === stage).forEach(item => {
    const key = item.category || '기타';
    counts[key] = (counts[key]||0) + 1;
  });
  return Object.keys(counts).map(k => ({ category:k, count:counts[k] }))
    .sort((a,b) => b.count - a.count).slice(0,5);
}
function qnaTokenize(text){
  return (text||'').toLowerCase().replace(/[?!.,()·~"'“”]/g,' ').split(/\s+/).filter(w => w.length >= 2);
}
function qnaSimilarityScore(a, b){
  const wa = new Set(qnaTokenize(a.questionSummary + ' ' + a.questionOriginal));
  const wb = new Set(qnaTokenize(b.questionSummary + ' ' + b.questionOriginal));
  if(!wa.size || !wb.size) return 0;
  let overlap = 0;
  wa.forEach(w => { if(wb.has(w)) overlap++; });
  return overlap / Math.min(wa.size, wb.size);
}
function qnaFindSimilar(item){
  return qnaState.questions.filter(other => (
    other.id !== item.id && other.stage === item.stage && other.category === item.category &&
    qnaSimilarityScore(item, other) >= 0.45
  ));
}

      <div class="qna-modal-actions">
        <button type="button" class="qna-btn qna-btn-ghost" id="qnaQuestionCancel">취소</button>
        <button type="submit" class="qna-btn qna-btn-primary">${existing ? '저장' : '등록'}</button>
      </div>
    </form>
  `;
  overlay.classList.add('open');
  modal.querySelector('#qnaQuestionCancel').onclick = qnaCloseModal;
  modal.querySelector('#qnaQuestionForm').onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const summary = f.questionSummary.value.trim();
    const original = f.questionOriginal.value.trim();
    if(!summary || !original){ qnaShowToast('질문 요약과 실제 질문을 입력해주세요'); return; }
    const answer = f.answer.value.trim();
    const now = new Date().toISOString();
    if(existing){
      existing.category = f.category.value;
      existing.companyName = f.companyName.value.trim();
      existing.questionSummary = summary;
      existing.questionOriginal = original;
      existing.questionContext = f.questionContext.value.trim();
      existing.answer = answer;
      existing.answerStatus = answer ? 'answered' : 'unanswered';
      existing.memo = f.memo.value.trim();
      if(isPt){
        existing.siteName = f.siteName.value.trim();
        existing.questioner = f.questioner.value;
        existing.meetingDate = f.meetingDate.value;
        existing.followUpNeeded = f.followUpNeeded.checked;
      }
      existing.updatedAt = now;
    } else {
      qnaState.questions.push({
        id: qnaUid(), stage, category: f.category.value,
        questionSummary: summary, questionOriginal: original,
        questionContext: f.questionContext.value.trim(),
        answer, answerStatus: answer ? 'answered' : 'unanswered', officialAnswer:false,
        companyName: f.companyName.value.trim(), companyId:'',
        siteName: isPt ? f.siteName.value.trim() : '',
        questioner: isPt ? f.questioner.value : '',
        meetingDate: isPt ? f.meetingDate.value : '',
        followUpNeeded: isPt ? f.followUpNeeded.checked : false,
        memo: f.memo.value.trim(), createdAt: now, updatedAt: now
      });
    }
    qnaSaveState(); qnaCloseModal(); qnaRender();
    qnaShowToast(existing ? '질문이 수정되었습니다' : '질문이 등록되었습니다');
  };
  const firstField = modal.querySelector('select, input, textarea');
  if(firstField) firstField.focus();
}

/* ---------- 카테고리 관리 모달 ---------- */
function qnaOpenCategoryModal(){
  const modal = document.getElementById('qnaModal');
  const overlay = document.getElementById('qnaModalOverlay');
  overlay.classList.add('open');
  renderBody();

  function renderBody(){
    const counts = {};
    qnaState.questions.forEach(q => { counts[q.category] = (counts[q.category]||0) + 1; });
    modal.innerHTML = `
      <h2>카테고리 관리</h2>
      <div id="qnaCatList">
        ${qnaState.categories.map((c,i) => `
          <div class="qna-cat-row">
            <input type="text" value="${qnaEscapeHtml(c)}" data-cat-rename="${i}" />
            <span class="qna-cat-count">${counts[c] || 0}건</span>
            <button type="button" class="qna-icon-btn danger" data-cat-delete="${i}" title="삭제">삭제</button>
          </div>
        `).join('')}
      </div>
      <div class="qna-cat-add-row">
        <input type="text" id="qnaCatNewInput" placeholder="새 카테고리 이름" />
        <button type="button" id="qnaCatAddBtn">추가</button>
      </div>
      <div class="qna-modal-actions">
        <button type="button" class="qna-btn qna-btn-primary" id="qnaCatCloseBtn">닫기</button>
      </div>
    `;
    modal.querySelector('#qnaCatCloseBtn').onclick = qnaCloseModal;
    modal.querySelector('#qnaCatAddBtn').onclick = () => {
      const input = modal.querySelector('#qnaCatNewInput');
      const name = input.value.trim();
      if(!name) return;
      if(qnaState.categories.includes(name)){ qnaShowToast('이미 있는 카테고리입니다'); return; }
      qnaState.categories.push(name);
      qnaSaveState(); renderBody(); qnaRender();
    };
    modal.querySelectorAll('[data-cat-rename]').forEach(input => {
      input.onchange = () => {
        const idx = Number(input.dataset.catRename);
        const oldName = qnaState.categories[idx];
        const newName = input.value.trim();
        if(!newName){ input.value = oldName; return; }
        if(newName === oldName) return;
        if(qnaState.categories.includes(newName)){ qnaShowToast('이미 있는 카테고리입니다'); input.value = oldName; return; }
        qnaState.categories[idx] = newName;
        qnaState.questions.forEach(q => { if(q.category === oldName) q.category = newName; });
        qnaSaveState(); renderBody(); qnaRender();
      };
    });
    modal.querySelectorAll('[data-cat-delete]').forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.dataset.catDelete);
        const name = qnaState.categories[idx];
        const used = qnaState.questions.filter(q => q.category === name).length;
        const msg = used
          ? `"${name}" 카테고리를 삭제하시겠습니까?\n이 카테고리로 등록된 질문 ${used}건은 "기타"로 이동합니다.`
          : `"${name}" 카테고리를 삭제하시겠습니까?`;
        if(!confirm(msg)) return;
        qnaState.categories = qnaState.categories.filter((c,i) => i !== idx);
        if(!qnaState.categories.includes('기타')) qnaState.categories.push('기타');
        qnaState.questions.forEach(q => { if(q.category === name) q.category = '기타'; });
        qnaSaveState(); renderBody(); qnaRender();
      };
    });
  }
}

/* ---------- 목록 화면 이벤트(delegated) ---------- */
const qnaMainEl = document.getElementById('qnaMain');
qnaMainEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'tab'){
    qnaActiveTab = btn.dataset.stage;
    qnaExpandedId = null;
    qnaRender();
  }
  else if(action === 'scope'){
    qnaSearchScope = btn.dataset.scope;
    qnaRender();
  }
  else if(action === 'add-open'){
    qnaOpenQuestionModal(qnaActiveTab, null);
  }
  else if(action === 'toggle-unanswered'){
    qnaUnansweredOnly = !qnaUnansweredOnly;
    qnaRender();
  }
  else if(action === 'category-manage'){
    qnaOpenCategoryModal();
  }
  else if(action === 'row-toggle'){
    const id = btn.dataset.id;
    qnaExpandedId = (qnaExpandedId === id) ? null : id;
    qnaUpdateListUI();
  }
  else if(action === 'edit'){
    const item = qnaState.questions.find(q=>q.id===btn.dataset.id);
    if(item) qnaOpenQuestionModal(item.stage, item.id);
  }
  else if(action === 'delete'){
    const item = qnaState.questions.find(q=>q.id===btn.dataset.id);
    if(!item) return;
    if(confirm('이 질문을 삭제하시겠습니까? 등록된 답변/메모도 함께 삭제됩니다.')){
      qnaState.questions = qnaState.questions.filter(q=>q.id!==item.id);
      if(qnaExpandedId === item.id) qnaExpandedId = null;
      qnaSaveState(); qnaRender();
    }
  }
  else if(action === 'official-toggle'){
    const item = qnaState.questions.find(q=>q.id===btn.dataset.id);
    if(!item) return;
    item.officialAnswer = !item.officialAnswer;
    item.updatedAt = new Date().toISOString();
    qnaSaveState(); qnaRender();
  }
  else if(action === 'answer-save'){
    const id = btn.dataset.id;
    const item = qnaState.questions.find(q=>q.id===id);
    const ta = document.getElementById(`qnaAnswerInput-${id}`);
    if(!item || !ta) return;
    item.answer = ta.value;
    item.answerStatus = ta.value.trim() ? 'answered' : 'unanswered';
    item.updatedAt = new Date().toISOString();
    qnaSaveState(); qnaRender();
    qnaShowToast('답변이 저장되었습니다');
  }
  else if(action === 'memo-save'){
    const id = btn.dataset.id;
    const item = qnaState.questions.find(q=>q.id===id);
    const ta = document.getElementById(`qnaMemoInput-${id}`);
    if(!item || !ta) return;
    item.memo = ta.value;
    item.updatedAt = new Date().toISOString();
    qnaSaveState(); qnaRender();
    qnaShowToast('메모가 저장되었습니다');
  }
});
qnaMainEl.addEventListener('input', (e)=>{
  if(e.target && e.target.id === 'qnaSearchInput'){
    qnaSearchQuery = e.target.value;
    qnaUpdateListUI();
  }
});

qnaRender();
</script>
