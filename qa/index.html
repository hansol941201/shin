<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&amp;A 자료집</title>
<style>
  /* ============================================================
     사내 미팅용 Q&A 자료집 — 기존 루트 사이트(../index.html)의 CSS와는
     완전히 분리되어 있습니다. 모든 클래스/변수에 qna- 접두사를 사용해
     혹시 같은 페이지에 다른 스타일이 섞이더라도 충돌하지 않게 했습니다.
     ============================================================ */
  :root{
    --qna-bg:#f7f9fc;
    --qna-card-bg:#ffffff;
    --qna-border:#d9e0e9;
    --qna-navy:#1f3a5f;
    --qna-navy-dark:#152a45;
    --qna-navy-soft:#eaf0f8;
    --qna-blue-soft:#eaf2fe;
    --qna-text:#1f2937;
    --qna-text-gray:#667085;
    --qna-text-faint:#9aa3af;
    --qna-star:#b7791f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--qna-bg);
    color:var(--qna-text);
  }
  .qna-app{max-width:980px;margin:0 auto;padding:36px 24px 80px;}
  /* 추천 패널을 오른쪽에 나란히 두기 위한 폭 — 질문 목록 자체의 실질 폭(약 980px 기준의 내용
     영역)은 그대로 유지되도록, 목록 컬럼은 max-width로 다시 한 번 제한한다. */
  .qna-app.has-reco{max-width:1280px;}

  /* 전체 글씨 크기 축소(2026-08 2차 조정, 1차 대비 추가로 약 2px씩 축소) — 레이아웃·기능은 그대로 유지 */
  .qna-title{font-size:21px;font-weight:800;color:var(--qna-navy);margin:0 0 4px;}
  .qna-subtitle{font-size:11.5px;color:var(--qna-text-gray);margin:0 0 18px;}
  .qna-logo{height:30px;width:auto;display:block;margin:0 0 14px;}

  .qna-search-input{
    width:100%;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--qna-border);
    font-size:13px;font-family:inherit;background:#fff;color:var(--qna-text);margin-bottom:16px;
  }
  .qna-search-input:focus{outline:none;border-color:var(--qna-navy);box-shadow:0 0 0 3px var(--qna-blue-soft);}

  /* 상단 3개 파트: 가장 먼저 눈에 들어와야 하는 큰 탭 */
  .qna-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .qna-tab{
    background:#fff;border:1px solid var(--qna-border);border-radius:12px;
    padding:13px 10px;font-size:14.5px;font-weight:800;color:var(--qna-text-gray);cursor:pointer;font-family:inherit;
    text-align:center;transition:border-color .12s, color .12s, background .12s;
  }
  .qna-tab:hover{border-color:var(--qna-navy);color:var(--qna-navy);}
  .qna-tab.active{background:var(--qna-navy);border-color:var(--qna-navy);color:#fff;}

  .qna-toolbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
  .qna-toolbar-text{min-width:0;}
  .qna-toolbar-label{font-size:13px;font-weight:700;color:var(--qna-navy);}
  .qna-toolbar-desc{font-size:11px;color:var(--qna-text-gray);margin-top:3px;}
  .qna-add-btn{
    background:var(--qna-navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;
    font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .qna-add-btn:hover{background:var(--qna-navy-dark);}

  .qna-list{border-top:1px solid var(--qna-border);}
  .qna-item{padding:11px 4px;border-bottom:1px solid var(--qna-border);}
  .qna-item-top{display:flex;align-items:flex-start;gap:10px;}
  .qna-q-main{flex:1;min-width:0;}
  .qna-q-text{font-size:13px;font-weight:700;line-height:1.5;color:var(--qna-text);}
  .qna-badge{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;color:var(--qna-star);}
  .qna-part-tag{
    flex:none;font-size:10.5px;font-weight:700;color:var(--qna-navy);background:var(--qna-navy-soft);
    padding:2px 9px;border-radius:999px;margin-top:2px;white-space:nowrap;
  }
  .qna-a-text{font-size:12px;line-height:1.65;color:var(--qna-text-gray);white-space:pre-wrap;margin:5px 0 8px;}
  .qna-a-empty{font-size:11.5px;color:var(--qna-text-faint);margin:5px 0 8px;}

  /* 관리 링크(수정 · 삭제) — 질문/답변 보기보다 절대 눈에 띄면 안 되는 아주 작은 보조 요소.
     배경/테두리/그림자/아이콘 없이 텍스트만, 마우스를 올렸을 때만 살짝 진해진다. */
  .qna-manage-inline{display:flex;align-items:center;gap:4px;flex:none;margin-top:2px;}
  .qna-manage-btn{
    background:none;border:none;padding:0;margin:0;font-size:11.5px;color:var(--qna-text-faint);
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .qna-manage-btn:hover{color:var(--qna-text-gray);}
  .qna-manage-btn.danger:hover{color:#c0392b;}
  .qna-manage-sep{font-size:11.5px;color:var(--qna-text-faint);}

  /* 1차 미팅 전용: 질문 한 줄 + [답변 보기] 토글 방식 (사내 FAQ 스타일, 카드/그림자 없음) */
  .qna-row{padding:9px 4px;border-bottom:1px solid var(--qna-border);}
  .qna-row-top{display:flex;align-items:flex-start;gap:10px;}
  .qna-row-q{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.45;color:var(--qna-text);}
  /* 자주 나오는 질문의 반복 횟수 — 아주 작고 연하게, 화면을 복잡하게 만들지 않는다 */
  .qna-count-tag{flex:none;font-size:10px;color:var(--qna-text-faint);margin-left:4px;}
  .qna-row-part-tag{
    flex:none;font-size:10.5px;font-weight:700;color:var(--qna-navy);background:var(--qna-navy-soft);
    padding:2px 9px;border-radius:999px;white-space:nowrap;
  }
  /* 답변 보기 버튼 + 수정·삭제를 하나의 묶음으로 고정해, 질문이 길어져 줄바꿈되어도 오른쪽
     위치가 흐트러지지 않게 한다. */
  .qna-row-right{display:flex;align-items:center;gap:10px;flex:none;}
  .qna-row-toggle{
    flex:none;background:none;border:none;color:var(--qna-navy);font-size:11px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;padding:2px;
  }
  .qna-row-toggle:hover{text-decoration:underline;}
  .qna-row-right .qna-manage-inline{margin-top:0;}
  .qna-row-answer{
    margin-top:6px;padding:9px 12px;border-radius:6px;background:var(--qna-navy-soft);
    color:var(--qna-text);font-size:12px;line-height:1.6;white-space:pre-wrap;
  }
  .qna-row-answer.empty{color:var(--qna-text-faint);}

  .qna-empty-state{padding:44px 10px;text-align:center;color:var(--qna-text-gray);font-size:12.5px;}

  /* 오른쪽 패널: "AI 업무 제안" — 본문(질문 목록)은 그대로 두고 옆에만 붙는 보조 패널이라,
     목록 컬럼 자체의 폭은 기존과 동일하게 유지한다. */
  .qna-content-row{display:flex;align-items:flex-start;gap:24px;}
  .qna-content-main{flex:1;min-width:0;max-width:980px;}
  .qna-reco-panel{
    flex:0 0 300px;width:300px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;
    background:var(--qna-card-bg);border:1px solid var(--qna-navy);border-radius:10px;
  }
  .qna-reco-details summary{list-style:none;cursor:pointer;}
  .qna-reco-details summary::-webkit-details-marker{display:none;}
  .qna-reco-summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:1;
    padding:12px 14px;font-size:13px;font-weight:800;color:#fff;background:var(--qna-navy);border-radius:9px 9px 0 0;
  }
  .qna-reco-summary::after{content:'▾';font-size:11px;flex:none;transition:transform .15s;}
  .qna-reco-details[open] .qna-reco-summary::after{transform:rotate(180deg);}
  .qna-reco-body{padding:12px 14px 14px;}
  .qna-ai-empty{font-size:11.5px;color:var(--qna-text-faint);margin:0 0 4px;}
  .qna-ai-current{font-size:11px;color:var(--qna-text-gray);margin:0 0 12px;padding-bottom:10px;border-bottom:1px dashed var(--qna-border);line-height:1.5;}
  .qna-ai-current b{color:var(--qna-navy);}
  .qna-ai-item{padding:10px 0;border-top:1px solid var(--qna-border);}
  .qna-ai-item:first-of-type{border-top:none;padding-top:0;}
  .qna-ai-item-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .qna-ai-tier{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;flex:none;}
  .qna-ai-tier.tier-must{background:#c0392b;}
  .qna-ai-tier.tier-frequent{background:var(--qna-star);}
  .qna-ai-tier.tier-recommend{background:var(--qna-navy);}
  .qna-ai-tag{font-size:10px;font-weight:700;color:var(--qna-navy);background:var(--qna-navy-soft);padding:2px 8px;border-radius:6px;flex:none;}
  .qna-ai-item-title{font-size:12.5px;font-weight:800;color:var(--qna-text);line-height:1.4;}
  .qna-ai-item-reason{font-size:11px;color:var(--qna-text-gray);margin:3px 0 0;line-height:1.5;}
  .qna-ai-item-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .qna-ai-btn{
    border:1px solid var(--qna-border);background:#fff;color:var(--qna-text-gray);font-size:10.5px;font-weight:700;
    padding:3px 9px;border-radius:6px;cursor:pointer;font-family:inherit;
  }
  .qna-ai-btn:hover{border-color:var(--qna-navy);color:var(--qna-navy);}
  .qna-ai-btn.primary{background:var(--qna-navy);border-color:var(--qna-navy);color:#fff;}
  .qna-ai-btn.primary:hover{background:var(--qna-navy-dark);}
  .qna-ai-btn.danger:hover{border-color:#c0392b;color:#c0392b;}
  .qna-ai-status{display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--qna-text-faint);margin-top:7px;}
  .qna-ai-status.done{color:#1f6f3f;}
  .qna-ai-more{margin-top:10px;}
  .qna-ai-more summary{list-style:none;cursor:pointer;font-size:11px;font-weight:700;color:var(--qna-navy);}
  .qna-ai-more summary::-webkit-details-marker{display:none;}
  .qna-ai-more[open] summary{margin-bottom:4px;}

  @media (max-width:960px){
    .qna-content-row{flex-direction:column;}
    .qna-content-main{max-width:none;}
    .qna-reco-panel{width:100%;flex:none;position:static;max-height:none;}
    .qna-reco-summary{position:static;}
  }

  .qna-btn{border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .qna-btn-primary{background:var(--qna-navy);color:#fff;}
  .qna-btn-primary:hover{background:var(--qna-navy-dark);}
  .qna-btn-ghost{background:var(--qna-bg);color:var(--qna-text-gray);}
  .qna-btn-ghost:hover{background:var(--qna-blue-soft);}

  /* 모달 */
  .qna-modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,16,26,.5);
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .qna-modal-overlay.open{display:flex;}
  .qna-modal{
    background:#fff;border-radius:14px;padding:26px;width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;
  }
  .qna-modal h2{margin:0 0 18px;font-size:15.5px;color:var(--qna-navy);}
  .qna-field{margin-bottom:16px;}
  .qna-field label{display:block;font-size:11px;font-weight:700;color:var(--qna-text-gray);margin-bottom:6px;}
  .qna-field select, .qna-field textarea{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--qna-border);
    font-size:12.5px;font-family:inherit;resize:vertical;background:#fff;color:var(--qna-text);
  }
  .qna-field textarea{min-height:80px;line-height:1.6;}
  .qna-field-check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--qna-text);cursor:pointer;}
  .qna-field-check input{accent-color:var(--qna-navy);width:16px;height:16px;}
  .qna-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  .qna-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--qna-navy);color:#fff;padding:10px 20px;border-radius:999px;font-size:11.5px;
    opacity:0;transition:all .25s;pointer-events:none;z-index:200;
  }
  .qna-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:640px){
    .qna-app{padding:24px 14px 60px;}
    .qna-tabs{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="qna-app has-reco">
  <img src="netform-logo.webp" alt="NETFORM" class="qna-logo" />
  <div class="qna-title">Q&amp;A 자료집</div>
  <p class="qna-subtitle">1차 미팅·2차 미팅·PT에서 받은 질문과 답변을 모아둔 사내 자료집입니다.</p>

  <input type="text" id="qnaSearchInput" class="qna-search-input" placeholder="질문 검색하기" autocomplete="off" />

  <div class="qna-tabs" id="qnaTabs"></div>

  <div class="qna-content-row">
    <div class="qna-content-main">
      <div id="qnaMain"></div>
    </div>
    <!-- AI 업무 제안: 현재 탭에 쌓인 질문 전체를 분석해 준비하면 좋은 것/새로운 아이디어
         2가지로 보여주는 보조 패널. 질문 목록의 구조·기능에는 관여하지 않는다. -->
    <aside class="qna-reco-panel">
      <details class="qna-reco-details" open>
        <summary class="qna-reco-summary">AI 업무 제안</summary>
        <div class="qna-reco-body" id="qnaRecoBody"></div>
      </details>
    </aside>
  </div>
</div>

<div class="qna-modal-overlay" id="qnaModalOverlay">
  <div class="qna-modal" id="qnaModal"></div>
</div>
<div class="qna-toast" id="qnaToast"></div>

<!-- Q&A 전용 Firebase 설정 파일. 없어도 조용히 무시되고 이 페이지 localStorage만으로 동작합니다. -->
<script src="firebaseConfig.js" onerror="console.warn('qa/firebaseConfig.js 없음 — localStorage 전용 모드로 동작합니다')"></script>

<!-- Q&A 전용 Firebase 실시간 동기화 브릿지. 기존 루트 사이트의 컬렉션과는 전혀 다른
     이름(qna_questions)의 컬렉션만 사용하므로 기존 데이터와 절대 겹치지 않습니다. -->
<script type="module">
  const QNA_CLOUD_COLLECTIONS = ['qna_questions'];
  const cfg = window.QNA_FIREBASE_CONFIG;
  if(!cfg || !cfg.projectId){
    console.info('[Q&A] Firebase 설정이 없어 localStorage 전용 모드로 동작합니다.');
  } else {
    (async () => {
      try{
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
        const {
          getFirestore, doc, setDoc, onSnapshot, getDoc,
          enableIndexedDbPersistence, serverTimestamp
        } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');

        const app = initializeApp(cfg, 'qna-site'); // 이름을 지정해 항상 독립 인스턴스로 초기화
        const db = getFirestore(app);
        try{ await enableIndexedDbPersistence(db); } catch(e){ /* 오프라인 캐시 실패는 무시 */ }

        const pushTimers = {};
        function pushToCloud(key, data){
          clearTimeout(pushTimers[key]);
          pushTimers[key] = setTimeout(async () => {
            try{ await setDoc(doc(db, key, 'data'), { value: data, updatedAt: serverTimestamp() }); }
            catch(e){ console.error(`[Q&A][Firebase] ${key} 저장 실패`, e); }
          }, 500);
        }
        window.__qnaCloudSync = {
          ready: true,
          push(key, data){ if(QNA_CLOUD_COLLECTIONS.includes(key)) pushToCloud(key, data); }
        };

        window.dispatchEvent(new CustomEvent('qna-cloud-sync-init', {
          detail: {
            async seedIfEmpty(key, localData){
              const snap = await getDoc(doc(db, key, 'data'));
              if(!snap.exists()) await setDoc(doc(db, key, 'data'), { value: localData, updatedAt: serverTimestamp() });
            }
          }
        }));

        QNA_CLOUD_COLLECTIONS.forEach(key => {
          onSnapshot(doc(db, key, 'data'), (snap) => {
            if(!snap.exists()) return;
            const payload = snap.data();
            window.dispatchEvent(new CustomEvent('qna-cloud-sync-update', { detail: { key, data: payload.value } }));
          }, (err) => console.error(`[Q&A][Firebase] ${key} 구독 실패`, err));
        });

        window.dispatchEvent(new CustomEvent('qna-cloud-sync-ready'));
        console.info('[Q&A] 실시간 동기화 연결됨');
      } catch(err){
        console.error('[Q&A] Firebase 초기화 실패 — localStorage 전용 모드로 동작합니다.', err);
      }
    })();
  }
</script>

<script>
/* ============================================================
   Q&A 자료집 — 완전 독립 페이지 (사내 미팅용 단순 Q&A)
   업체/고객/담당자 등과 전혀 연결하지 않는다. 1차 미팅 / 2차 미팅 / PT
   3개 파트로만 질문·답변을 분류해서 누적하는 자료집.
   유사 질문이 반복되면 빈도(frequencyCount)를 누적하고, 사용자가 직접
   지정한 중요 질문(isImportant)과 함께 목록 상단에 우선 노출한다.
   ============================================================ */
const QNA_STORAGE_KEY = 'qna-site-state-v6';
function qnaUid(){ return 'q' + Math.random().toString(36).slice(2,10); }

const QNA_PARTS = [
  {key:'first_meeting', label:'1차 미팅'},
  {key:'second_meeting', label:'2차 미팅'},
  {key:'pt', label:'PT'}
];
function qnaPartLabel(key){
  const p = QNA_PARTS.find(p=>p.key===key);
  return p ? p.label : key;
}
// 이 횟수 이상 반복되면 "자주 나오는 질문"으로 표시하고 상단 우선순위를 준다.
const QNA_FREQUENT_THRESHOLD = 3;
// 새 질문 등록 시 이 값 이상 유사하면 "기존 질문과 유사합니다" 확인창을 띄운다.
// 키워드 충돌 가드(아래)로 서로 다른 제품/주제를 묻는 질문이 잘못 묶이지 않도록 막는다.
// 최종 판단은 항상 사람이 "기존 질문에 합칠까요?" 확인창에서 내린다 — 자동 병합은 하지 않는다.
const QNA_SIMILAR_THRESHOLD = 0.45;
// "~할 수 있나요?/가능한가요?/되나요?" 같은 흔한 질문 어미가 같다는 이유만으로 유사도가 높게
// 나오는 걸 막기 위해, 유사도를 잴 때는 이런 흔한 어미를 먼저 떼어내고 남은 핵심 내용(무엇을
// 묻는지)끼리 비교한다. 예: "관공사에 POUR공법 적용 가능한가요?" → "관공사에 POUR공법"
const QNA_QUESTION_ENDINGS = [
  '진행할 수 있나요', '진행이 가능한가요', '적용할 수 있나요', '적용이 가능한가요', '적용 가능한가요',
  '가능한가요', '할 수 있나요', '받을 수 있나요', '해 주나요', '해주나요', '주나요',
  '계획이 있나요', '문제는 없나요', '문제가 될 수 있는 부분은 없나요', '구성되나요', '다른가요',
  '되는 건가요', '되는건가요', '되나요', '있나요', '인가요',
];
function qnaStripQuestionEnding(text){
  let t = (text || '').trim().replace(/[?!.]+$/, '').trim();
  for(const ending of QNA_QUESTION_ENDINGS){
    if(t.endsWith(ending)){ t = t.slice(0, t.length - ending.length).trim(); break; }
  }
  return t;
}
// 문장이 비슷해도 실제로 묻는 대상(구체적인 제품/공법명)이나 주제(가격·마진·기간 등)가 다르면
// 같은 질문으로 보면 안 된다. 예:
//  · "POUR공법 관공사 적용이 가능한가요?" vs "아스팔트슁글도 관공사 적용이 가능한가요?" (제품이 다름)
//  · "공종별로 예상 마진율이 다른가요?" vs "공종별로 시공 기간이 다른가요?" (같은 틀, 묻는 항목이 다름)
// 'POUR'는 거의 모든 질문에 등장하는 회사명이라 구분 기준으로 쓸 수 없어 제외했다 — 대신 구체적인
// 세부 제품/공법명만 넣어서, 한쪽이라도 특정 제품을 콕 집어 말하는데 다른 쪽은 그 제품을 전혀
// 언급하지 않으면(둘 다 언급 안 하거나 같은 제품을 언급하면 통과) 무조건 다른 질문으로 본다.
const QNA_SUBJECT_KEYWORDS = ['아스팔트슁글', '다모아', '루프마스터', '금속기와', '우레탄', '방수'];
// 주제 키워드는 양쪽 모두 이 목록의 키워드를 언급했는데 겹치는 게 하나도 없을 때만(둘 다 언급이
// 없으면 판단하지 않음) 다른 질문으로 본다.
const QNA_TOPIC_KEYWORDS = ['마진', '단가', '가격', '조달', '계약', '하도급', '법적', '영업', '특허', '현장', '기간', '등록', '시공', '대금', '발주처', '병행', '관공사', '아파트', '입찰'];
function qnaKeywordsIn(text, list){
  return list.filter(k => (text||'').includes(k));
}
// 두 질문이 서로 다른 대상/주제를 가리키고 있으면 true — 이 경우 아무리 문장이 비슷해도 합치지 않는다.
function qnaHasSubjectConflict(a, b){
  const sa = qnaKeywordsIn(a, QNA_SUBJECT_KEYWORDS), sb = qnaKeywordsIn(b, QNA_SUBJECT_KEYWORDS);
  if((sa.length || sb.length) && !sa.some(k => sb.includes(k))) return true; // 한쪽만 특정 제품을 언급 → 다른 질문
  const ta = qnaKeywordsIn(a, QNA_TOPIC_KEYWORDS), tb = qnaKeywordsIn(b, QNA_TOPIC_KEYWORDS);
  if(ta.length && tb.length && !ta.some(k => tb.includes(k))) return true; // 둘 다 주제어가 있는데 안 겹침 → 다른 질문
  return false;
}

// 서강건설 1차 미팅에서 실제 나온 질문 — 처음 접속했을 때만 예시로 보이는 초기 자료.
function qnaBuildSeedQuestions(){
  const now = new Date().toISOString();
  let order = 0;
  // category는 화면에 표시하지 않는 내부 관리용 값이다(질문지 원본의 분류 제목을 그대로 보관).
  const mk = (part, question, answer, category, freq, aliases) => {
    const frequencyCount = freq || 1;
    return {
      id: qnaUid(), part, question, answer: answer || '', category: category || '',
      createdAt: now, updatedAt: now, order: order++,
      frequencyCount, isImportant: false, frequent: frequencyCount >= QNA_FREQUENT_THRESHOLD,
      aliases: aliases || [], lastAskedAt: now, actionStates: {}

  return [
    // (주)서강건설 1차 미팅 질문 — 첨부해주신 원본 문서(1차질문.hwpx) 문구 그대로 반영.
    // 두 번째로 첨부해주신 질문지(관급공사 적용 관련 3건 추가, 나머지 15건은 첫 번째 질문지와
    // 완전히 동일한 문구라 중복 등록하지 않고 frequencyCount만 1건씩 올려 반영했다.
    mk('first_meeting', 'POUR 제품이나 공법은 관공서·공공기관 발주 공사에도 적용할 수 있나요?', '', '관급공사 적용 관련'),
    mk('first_meeting', 'POUR 아스팔트슁글도 관급공사에 적용하여 진행할 수 있나요?', '', '관급공사 적용 관련'),
    mk('first_meeting', '현재 관급공사에 적용이 어려운 제품이 있다면, 향후 공공공사에도 적용할 수 있도록 추진할 계획이 있나요?', '', '관급공사 적용 관련'),
    mk('first_meeting', 'POUR 제품이나 공법은 조달 등록이 되어 있나요?', '', '조달 관련', 2),
    mk('first_meeting', '아스팔트슁글도 조달을 통해 진행할 수 있나요?', '', '조달 관련', 2),
    mk('first_meeting', '현재 조달 등록이 되어 있지 않은 제품은 향후 등록 계획이 있나요?', '', '조달 관련', 2),
    mk('first_meeting', '아파트 입찰에서는 결국 단가 경쟁이 발생하는데, 현장 상황에 따라 단가 조정이 가능한가요?', '', '가격 / 단가', 2),
    mk('first_meeting', '견적 경쟁이 붙었을 때 본사에서 어느 정도까지 가격 협의나 지원이 가능한가요?', '', '가격 / 단가', 2),
    mk('first_meeting', 'POUR공법으로 실제 공사를 진행하면 시공사가 가져갈 수 있는 평균적인 마진은 어느 정도인가요?', '', '수익 / 마진', 2),
    mk('first_meeting', '공종별로 예상 마진율이 다른가요?', '', '수익 / 마진', 2),
    mk('first_meeting', '일반 공사와 비교했을 때 POUR 협력사가 얻을 수 있는 수익적인 장점은 무엇인가요?', '', '수익 / 마진', 2),
    mk('first_meeting', '현장 수주 후 실행공사를 진행할 때 POUR 측에서 대금 관련 부분까지 지원하는 경우가 있나요?', '', '실행공사 / 계약 구조', 2),
    mk('first_meeting', '그렇게 진행하면 실질적으로 하도급 계약 형태가 되는 건가요?', '', '실행공사 / 계약 구조', 2),
    mk('first_meeting', '계약이나 대금 지급 구조상 법적으로 문제가 될 수 있는 부분은 없나요?', '', '실행공사 / 계약 구조', 2),
    mk('first_meeting', '실제 계약 관계는 발주처·시공사·POUR 중 어떻게 구성되나요?', '', '실행공사 / 계약 구조', 2),
    mk('first_meeting', '현재 관공사 위주로 해왔는데, 아파트 민간시장에 처음 진입하는 업체도 지원받을 수 있나요?', '', '민간 아파트 영업 지원', 2),

    mk('first_meeting', '유사한 공법을 병행하는 경우 협약이나 영업상 제한사항이 있나요?', '', '타 공법 병행', 2)

function qnaLoadState(){
  try{
    const raw = localStorage.getItem(QNA_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.questions)) parsed.questions = [];
      parsed.questions.forEach(q => {
        if(typeof q.frequencyCount !== 'number') q.frequencyCount = 1;
        if(typeof q.isImportant !== 'boolean') q.isImportant = false;
        if(!q.lastAskedAt) q.lastAskedAt = q.updatedAt || q.createdAt || new Date().toISOString();
        if(typeof q.category !== 'string') q.category = ''; // 화면에는 쓰지 않는 내부 관리용 값
        if(!Array.isArray(q.aliases)) q.aliases = []; // 병합된 과거 질문 원문(표현이 달랐던 문구들)
        if(typeof q.frequent !== 'boolean') q.frequent = q.frequencyCount >= QNA_FREQUENT_THRESHOLD;
        if(!q.actionStates || typeof q.actionStates !== 'object') q.actionStates = {}; // AI 업무 제안 실행/완료/제외 상태(질문별로 별도 저장)
      });
      return parsed;
    }
  }catch(e){}
  return { questions: qnaBuildSeedQuestions() };
}
let qnaState = qnaLoadState();

function qnaSaveState(){
  localStorage.setItem(QNA_STORAGE_KEY, JSON.stringify(qnaState));
  if(window.__qnaCloudSync && window.__qnaCloudSync.ready){
    window.__qnaCloudSync.push('qna_questions', qnaState.questions);
  }
}

// Firebase 실시간 동기화 연결(연결 안 되면 조용히 무시되고 localStorage 그대로 동작)
function qnaIsUserTyping(){
  const ae = document.activeElement;
  return !!(ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox')));
}
let qnaPendingCloudRender = false;
document.addEventListener('focusout', ()=>{
  if(qnaPendingCloudRender && !qnaIsUserTyping()){ qnaPendingCloudRender = false; qnaRenderAll(); }
}, true);
window.addEventListener('qna-cloud-sync-init', async (e) => {
  try{ await e.detail.seedIfEmpty('qna_questions', qnaState.questions); }
  catch(err){ console.error('[Q&A] 초기 동기화(시드) 실패', err); }
});
window.addEventListener('qna-cloud-sync-update', (e) => {
  const { key, data } = e.detail;
  if(data == null || key !== 'qna_questions') return;
  qnaState.questions = data;
  localStorage.setItem(QNA_STORAGE_KEY, JSON.stringify(qnaState));
  if(qnaIsUserTyping()) qnaPendingCloudRender = true; else qnaRenderAll();
});
window.addEventListener('qna-cloud-sync-ready', () => qnaShowToast('실시간 동기화가 연결되었습니다'));

function qnaEscapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function qnaShowToast(msg){
  const t = document.getElementById('qnaToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(qnaShowToast._timer);
  qnaShowToast._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- 유사 질문 감지 (문자 2-그램 기반, 확실히 비슷할 때만 물어보고 절대 자동 병합하지 않음) ---------- */
function qnaBigrams(text){
  const clean = (text||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const grams = new Set();
  for(let i=0; i<clean.length-1; i++) grams.add(clean.slice(i, i+2));
  return grams;
}
function qnaQuestionSimilarity(a, b){
  // 묻는 대상(제품/공법)이 서로 다르면 문장이 아무리 비슷해도 유사하지 않은 것으로 본다.
  // 예: "POUR공법 관공사 적용이 가능한가요?" vs "아스팔트슁글도 관공사 적용이 가능한가요?"
  if(qnaHasSubjectConflict(a, b)) return 0;
  // "~할 수 있나요?/가능한가요?" 같은 흔한 어미를 떼어내고 핵심 내용끼리만 비교한다 — 그래야
  // "관공사에 POUR공법 적용 가능한가요?" / "관공사에도 POUR로 진행할 수 있나요?"처럼 어순·표현이
  // 달라도 실제로 같은 걸 묻는 질문을 놓치지 않는다.
  const ca = qnaStripQuestionEnding(a), cb = qnaStripQuestionEnding(b);
  const ga = qnaBigrams(ca), gb = qnaBigrams(cb);
  if(!ga.size || !gb.size) return 0;
  let overlap = 0;
  ga.forEach(g => { if(gb.has(g)) overlap++; });
  // Dice 계수(2*교집합/전체합) — 길이가 크게 다른 두 질문은 자동으로 점수가 낮아진다.
  return (2 * overlap) / (ga.size + gb.size);
}
// 같은 파트 안에서 가장 비슷한 기존 질문 1건을 찾는다(임계값 미만이면 null → 새 질문으로 등록).
// 원본 질문(question)뿐 아니라 그 질문에 이미 병합된 과거 표현(aliases)과도 비교해서, 표현이
// 조금씩 다른 질문이 여러 번 들어와도 계속 같은 대표 질문에 잘 모이도록 한다.
function qnaFindMostSimilar(question, part, excludeId){
  let best = null, bestScore = 0;
  qnaState.questions.forEach(q => {
    if(q.part !== part || q.id === excludeId) return;
    const candidates = [q.question, ...(q.aliases || [])];
    const s = Math.max(...candidates.map(c => qnaQuestionSimilarity(question, c)));
    if(s > bestScore){ bestScore = s; best = q; }
  });
  return bestScore >= QNA_SIMILAR_THRESHOLD ? best : null;
}

/* ---------- 정렬: ① 직접 지정한 중요 질문 → ② 자주 나오는 질문(빈도 높은 순) → ③ 일반 질문 ---------- */
function qnaSortTier(q){
  if(q.isImportant) return 0;
  if((q.frequencyCount||1) >= QNA_FREQUENT_THRESHOLD) return 1;
  return 2;
}
function qnaSortCompare(a, b){
  const ta = qnaSortTier(a), tb = qnaSortTier(b);
  if(ta !== tb) return ta - tb;
  if(ta === 1){
    const cd = (b.frequencyCount||1) - (a.frequencyCount||1);
    if(cd !== 0) return cd;
  }
  return (a.order||0) - (b.order||0);
}

// 탐색 위치(현재 탭/검색어)는 데이터가 아니므로 localStorage에 저장하지 않는다.
let qnaActiveTab = 'first_meeting';
let qnaSearchQuery = '';
// 1차 미팅에서만 쓰는 "답변 보기/닫기" 펼침 상태 — 여러 개를 동시에 열어둘 수 있도록 Set으로 관리.
// (2차 미팅/PT는 기존 그대로 답변이 항상 함께 보이는 방식이라 이 상태를 쓰지 않는다.)
let qnaOpenIds = new Set();
// 오른쪽 "AI 업무 제안" 패널이 지금 어떤 질문을 기준으로 제안을 보여주고 있는지 — 질문 등록/수정/
// 병합/답변 열람 시점마다 갱신된다. 데이터가 아니라 화면 상태라서 저장하지 않는다.
let qnaRecoQuestionId = null;

function qnaRenderTabs(){
  document.getElementById('qnaTabs').innerHTML = QNA_PARTS.map(p => `
    <button type="button" class="qna-tab ${qnaActiveTab===p.key?'active':''}" data-action="tab" data-part="${p.key}">${qnaEscapeHtml(p.label)}</button>
  `).join('');
}

function qnaMatchesQuery(item, q){
  return (item.question||'').toLowerCase().includes(q) || (item.answer||'').toLowerCase().includes(q);
}
function qnaVisibleList(){
  const q = qnaSearchQuery.trim().toLowerCase();
  if(q){
    return qnaState.questions.filter(item => qnaMatchesQuery(item, q)).slice().sort(qnaSortCompare);
  }
  return qnaState.questions.filter(item => item.part === qnaActiveTab).slice().sort(qnaSortCompare);
}

function qnaRenderMain(){
  const list = qnaVisibleList();
  const isSearching = !!qnaSearchQuery.trim();
  const label = isSearching ? `검색 결과 (${list.length}건)` : qnaPartLabel(qnaActiveTab);
  // 1차 미팅에서만 소개 문구를 보여준다(다른 파트의 화면 구조는 그대로 유지).
  const desc = (!isSearching && qnaActiveTab === 'first_meeting') ? '자주 나온 질문과 답변을 빠르게 확인하세요.' : '';
  return `
    <div class="qna-toolbar">
      <div class="qna-toolbar-text">
        <div class="qna-toolbar-label">${qnaEscapeHtml(label)}</div>
        ${desc ? `<div class="qna-toolbar-desc">${qnaEscapeHtml(desc)}</div>` : ''}
      </div>
      <button type="button" class="qna-add-btn" data-action="add-open">+ 질문 추가</button>
    </div>
    <div id="qnaListArea">${qnaRenderListArea(list, isSearching)}</div>
  `;
}
function qnaRenderListArea(list, showPartTag){
  if(!list.length){
    return `<div class="qna-empty-state">${qnaSearchQuery.trim() ? '해당하는 질문을 찾을 수 없습니다.' : '등록된 질문이 없습니다. [+ 질문 추가]로 첫 질문을 등록해보세요.'}</div>`;
  }
  return `<div class="qna-list">${list.map(item => (
    item.part === 'first_meeting' ? qnaRenderRowToggle(item, showPartTag) : qnaRenderItem(item, showPartTag)
  )).join('')}</div>`;
}
function qnaIsStarred(item){
  return !!item.isImportant || (item.frequencyCount||1) >= QNA_FREQUENT_THRESHOLD;
}
function qnaRenderBadge(item){
  if(item.isImportant) return `<span class="qna-badge">★ 중요 질문</span>`;
  if((item.frequencyCount||1) >= QNA_FREQUENT_THRESHOLD) return `<span class="qna-badge">★ 자주 나오는 질문 · ${item.frequencyCount}회</span>`;
  return '';
}
// 질문 오른쪽 끝에 붙는 아주 작은 관리 링크(수정 · 삭제) — 질문/답변 보기보다 절대 눈에 띄면 안 된다.
function qnaRenderManageLinks(item){
  return `
    <span class="qna-manage-inline">
      <button type="button" class="qna-manage-btn" data-action="edit" data-id="${item.id}">수정</button>
      <span class="qna-manage-sep">·</span>
      <button type="button" class="qna-manage-btn danger" data-action="delete" data-id="${item.id}">삭제</button>
    </span>
  `;
}
// 1차 미팅 전용: 질문 한 줄 + [답변 보기 ▼] — 클릭하면 그 질문 아래에만 답변이 펼쳐진다(여러 개 동시에 열람 가능).
function qnaRenderRowToggle(item, showPartTag){
  const isOpen = qnaOpenIds.has(item.id);
  const isFrequent = (item.frequencyCount||1) >= QNA_FREQUENT_THRESHOLD;
  const star = (item.isImportant || isFrequent) ? '★ ' : '';
  // 빈도 횟수는 아주 작고 연한 회색으로만 — 화면이 복잡해 보이지 않게 최소한으로 표시한다.
  const countTag = isFrequent ? `<span class="qna-count-tag">${item.frequencyCount}회</span>` : '';
  return `
    <div class="qna-row" data-id="${item.id}">
      <div class="qna-row-top">
        <span class="qna-row-q">${star}${qnaEscapeHtml(item.question)}</span>${countTag}
        ${showPartTag ? `<span class="qna-row-part-tag">${qnaEscapeHtml(qnaPartLabel(item.part))}</span>` : ''}
        <span class="qna-row-right">
          <button type="button" class="qna-row-toggle" data-action="toggle-answer" data-id="${item.id}">${isOpen ? '답변 닫기 ▲' : '답변 보기 ▼'}</button>
          ${qnaRenderManageLinks(item)}
        </span>
      </div>
      ${isOpen ? `
        <div class="qna-row-answer ${item.answer ? '' : 'empty'}">${item.answer ? qnaEscapeHtml(item.answer) : '아직 등록된 답변이 없습니다.'}</div>
      ` : ''}
    </div>
  `;
}
// 2차 미팅 / PT 전용: 기존 그대로 — 질문 아래 답변이 항상 함께 보인다. 관리 링크만 질문 줄 오른쪽 끝으로 이동.
function qnaRenderItem(item, showPartTag){
  return `
    <div class="qna-item" data-id="${item.id}">
      <div class="qna-item-top">
        <div class="qna-q-main">
          <span class="qna-q-text">Q. ${qnaEscapeHtml(item.question)}</span>${qnaRenderBadge(item)}
          ${item.answer ? `<p class="qna-a-text">${qnaEscapeHtml(item.answer)}</p>` : `<p class="qna-a-empty">등록된 답변이 없습니다.</p>`}
        </div>
        ${showPartTag ? `<span class="qna-part-tag">${qnaEscapeHtml(qnaPartLabel(item.part))}</span>` : ''}
        ${qnaRenderManageLinks(item)}
      </div>
    </div>
  `;
}

// 규칙 그룹: 질문 문구 키워드/카테고리가 매칭되면 정해진 순서(=중요도)대로 실행 항목을 제안한다.
// 배열 안 순서가 곧 필수(0) → 자주 요청(1) → 추천(2) 우선순위다.
const QNA_RECO_RULES = [
  { categories:['가격 / 단가','수익 / 마진'], keywords:['단가','예산','금액','가격','견적','비용','마진'],
    actions:['quantity-estimate','cost-estimate','cost-schedule-compare'] },
  { categories:['타 공법 병행'], keywords:['적용 가능','현장 조건','시공 방법','적용할 수','병행','적용'],
    actions:['mark-drawing','method-compare','site-visit'] },
  { categories:[], keywords:['품질','하자','보증','유지관리'],
    actions:['cert-select','defect-prevention','maintenance-guide'] },
  { categories:[], keywords:['실적','신뢰','사례','경험'],
    actions:['similar-cases','pt-customize','next-contact'] },
  { categories:['민간 아파트 영업 지원'], keywords:['입찰','공고','참여'],
    actions:['bid-requirement-check','bid-document-check','design-wording-check'] },
  { categories:['조달 관련','관급공사 적용 관련'], keywords:['조달','관급','관공서','공공기관','관공사','등록'],
    actions:['procurement-check','bid-requirement-check','next-contact'] },
  { categories:[], keywords:['pt','설명','발표','설명회','교육','주민','입주민'],
    actions:['pt-customize','next-contact','site-visit'] },
  { categories:['실행공사 / 계약 구조'], keywords:['협약','계약','절차','체결','하도급','대금','법적'],
    actions:['design-wording-check','bid-document-check','next-contact'] },
  { categories:[], keywords:['시공 순서','공정','드론','진단','접근'],
    actions:['construction-sequence','drone-diagnosis','site-visit'] },
];
// 어떤 규칙에도 안 걸리는 질문을 위한 기본 제안(항상 실행 가능한 것들로만 구성).
const QNA_RECO_FALLBACK = ['similar-cases','next-contact','pt-customize'];

// 질문 한 건에 대해 관련 실행 항목을 (필수→자주 요청→추천 순서로) 최대 6개까지 뽑는다.
function qnaMatchActionsForQuestion(q){
  if(!q) return [];
  const haystack = ((q.question||'') + ' ' + (q.category||'')).toLowerCase();
  const picked = []; // { id, tier }
  const seen = new Set();
  QNA_RECO_RULES.forEach(rule => {
    const hit = (rule.categories.length && rule.categories.includes(q.category)) ||
      rule.keywords.some(k => haystack.includes(k.toLowerCase()));
    if(!hit) return;
    rule.actions.forEach((id, idx) => {
      if(seen.has(id)) return;
      seen.add(id); picked.push({ id, tier: idx });
    });
  });
  if(!picked.length){
    QNA_RECO_FALLBACK.forEach((id, idx) => { if(!seen.has(id)){ seen.add(id); picked.push({ id, tier: idx }); } });
  }
  picked.sort((a,b) => a.tier - b.tier);
  return picked.slice(0, 6);
}
const QNA_TIER_LABEL = { 0:'필수', 1:'자주 요청', 2:'추천' };
const QNA_TIER_CLASS = { 0:'tier-must', 1:'tier-frequent', 2:'tier-recommend' };

// 지금 패널이 다룰 질문 한 건을 정한다 — 직접 지정된 게 있으면 그걸, 없거나 현재 탭에 없으면
// 지금 탭에서 우선순위가 가장 높은 질문(중요 → 자주 나오는 질문 → 최신 순)으로 대체한다.
function qnaResolveRecoQuestion(){
  if(qnaRecoQuestionId){
    const found = qnaState.questions.find(q => q.id === qnaRecoQuestionId && q.part === qnaActiveTab);
    if(found) return found;
  }
  const list = qnaState.questions.filter(q => q.part === qnaActiveTab).slice().sort(qnaSortCompare);
  return list[0] || null;
}
function qnaRenderRecoItem(q, entry){
  const state = (q.actionStates && q.actionStates[entry.id]) || null;
  const item = QNA_ACTIONS[entry.id];
  const tierLabel = QNA_TIER_LABEL[entry.tier];
  const tierClass = QNA_TIER_CLASS[entry.tier];
  const statusHtml = state === 'done'
    ? `<div class="qna-ai-status done">완료됨 <button type="button" class="qna-ai-btn" data-action="ai-undo" data-qid="${q.id}" data-aid="${entry.id}">되돌리기</button></div>`
    : state === 'excluded'
      ? `<div class="qna-ai-status">제외됨 <button type="button" class="qna-ai-btn" data-action="ai-undo" data-qid="${q.id}" data-aid="${entry.id}">되돌리기</button></div>`
      : `<div class="qna-ai-item-actions">
          <button type="button" class="qna-ai-btn primary" data-action="ai-start" data-qid="${q.id}" data-aid="${entry.id}">실행하기</button>
          <button type="button" class="qna-ai-btn" data-action="ai-done" data-qid="${q.id}" data-aid="${entry.id}">완료</button>
          <button type="button" class="qna-ai-btn danger" data-action="ai-exclude" data-qid="${q.id}" data-aid="${entry.id}">제외</button>
        </div>`;
  return `
    <div class="qna-ai-item">
      <div class="qna-ai-item-head">
        <span class="qna-ai-tier ${tierClass}">${tierLabel}</span>
        <span class="qna-ai-tag">${qnaEscapeHtml(item.tag)}</span>
      </div>
      <div class="qna-ai-item-title">${qnaEscapeHtml(item.title)}</div>
      <div class="qna-ai-item-reason">${qnaEscapeHtml(item.reason)}</div>
      ${statusHtml}
    </div>
  `;
}
function qnaRenderRecoPanel(){
  const body = document.getElementById('qnaRecoBody');
  if(!body) return;
  const q = qnaResolveRecoQuestion();
  if(!q){
    body.innerHTML = `<p class="qna-ai-empty">질문이 등록되면 제안이 표시됩니다.</p>`;
    return;
  }
  qnaRecoQuestionId = q.id;
  const matches = qnaMatchActionsForQuestion(q);
  const main = matches.slice(0, 3);
  const rest = matches.slice(3);
  const shortQ = q.question.length > 46 ? q.question.slice(0, 46) + '…' : q.question;

  const mainHtml = main.map(entry => qnaRenderRecoItem(q, entry)).join('');
  const moreHtml = rest.length ? `
    <details class="qna-ai-more">
      <summary>더보기 (${rest.length})</summary>
      ${rest.map(entry => qnaRenderRecoItem(q, entry)).join('')}
    </details>
  ` : '';

  body.innerHTML = `
    <p class="qna-ai-current">현재 질문: <b>${qnaEscapeHtml(shortQ)}</b></p>
    ${mainHtml}
    ${moreHtml}
  `;
}

function qnaRenderAll(){
  qnaRenderTabs();
  document.getElementById('qnaMain').innerHTML = qnaRenderMain();
  qnaRenderRecoPanel();
}
function qnaUpdateListUI(){
  const area = document.getElementById('qnaListArea');

    </form>
  `;
  overlay.classList.add('open');
  modal.querySelector('#qnaQuestionCancel').onclick = qnaCloseModal;
  modal.querySelector('#qnaQuestionForm').onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const question = f.question.value.trim();
    if(!question){ qnaShowToast('질문을 입력해주세요'); return; }
    const answer = f.answer.value.trim();
    const part = f.part.value;
    const isImportant = f.isImportant.checked;
    const now = new Date().toISOString();

    if(existing){
      existing.part = part;
      existing.question = question;
      existing.answer = answer;
      existing.isImportant = isImportant;
      existing.updatedAt = now;
      qnaActiveTab = part;
      qnaRecoQuestionId = existing.id; // 방금 수정한 질문 기준으로 AI 업무 제안을 갱신한다
      qnaSaveState(); qnaCloseModal(); qnaRenderAll();
      qnaShowToast('질문이 수정되었습니다');
      return;
    }

    // 새 질문 등록: 같은 파트 안에서 확실히 비슷한 기존 질문이 있으면 자동으로 합치지 않고 먼저 물어본다.
    const similar = qnaFindMostSimilar(question, part, null);
    if(similar){
      const ok = confirm(`기존 질문과 유사합니다.\n\n"${similar.question}"\n\n기존 질문에 횟수를 추가할까요?\n(취소하면 새 질문으로 따로 등록합니다)`);
      if(ok){
        similar.frequencyCount = (similar.frequencyCount||1) + 1;
        similar.frequent = similar.frequencyCount >= QNA_FREQUENT_THRESHOLD;
        similar.lastAskedAt = now;
        similar.isImportant = similar.isImportant || isImportant;
        // 이번에 실제로 들어온 표현(원문)을 aliases에 남겨서 나중에 어떤 문구들이 이 질문으로
        // 모였는지 추적할 수 있게 한다. 대표 질문 문구 자체와 같으면 중복으로 남기지 않는다.
        if(!Array.isArray(similar.aliases)) similar.aliases = [];
        if(question !== similar.question && !similar.aliases.includes(question)) similar.aliases.push(question);
        if(answer && !similar.answer) similar.answer = answer; // 기존 답변이 비어있을 때만 이번 답변으로 채움 — 추측 답변 절대 생성하지 않음
        qnaRecoQuestionId = similar.id; // 이번에 합쳐진 질문 기준으로 AI 업무 제안을 갱신한다
        qnaSaveState(); qnaCloseModal();
        qnaSearchQuery=''; document.getElementById('qnaSearchInput').value=''; qnaActiveTab = similar.part; qnaRenderAll();
        qnaShowToast(`기존 질문 빈도가 추가되었습니다 (${similar.frequencyCount}회)`);
        return;
      }
      // 취소하면 아래로 내려가 새 질문으로 등록
    }

    const partMax = qnaState.questions.filter(q=>q.part===part).reduce((m,q)=>Math.max(m,q.order), -1);
    const newId = qnaUid();
    qnaState.questions.push({
      id: newId, part, question, answer, category: '', createdAt: now, updatedAt: now, order: partMax + 1,
      frequencyCount: 1, isImportant, frequent: false, aliases: [], lastAskedAt: now, actionStates: {}
    });
    qnaActiveTab = part;
    qnaRecoQuestionId = newId; // 방금 등록한 질문 기준으로 AI 업무 제안을 갱신한다
    qnaSaveState(); qnaCloseModal();
    qnaSearchQuery=''; document.getElementById('qnaSearchInput').value=''; qnaRenderAll();
    qnaShowToast('질문이 등록되었습니다');
  };
  const firstField = modal.querySelector('select, textarea');
  if(firstField) firstField.focus();
}

/* ---------- 화면 이벤트(delegated) ---------- */
document.getElementById('qnaTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action="tab"]');
  if(!btn) return;
  qnaActiveTab = btn.dataset.part;
  qnaSearchQuery = '';
  document.getElementById('qnaSearchInput').value = '';
  qnaRenderAll();
});
const qnaMainEl = document.getElementById('qnaMain');
qnaMainEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'add-open'){
    qnaOpenQuestionModal(null);
  }
  else if(action === 'toggle-answer'){
    const id = btn.dataset.id;
    if(qnaOpenIds.has(id)){
      qnaOpenIds.delete(id);
    } else {
      qnaOpenIds.add(id);
      qnaRecoQuestionId = id; // 방금 펼쳐본 질문 기준으로 AI 업무 제안을 갱신한다
    }
    qnaUpdateListUI();
  }
  else if(action === 'edit'){
    qnaOpenQuestionModal(btn.dataset.id);
  }
  else if(action === 'delete'){
    const item = qnaState.questions.find(q=>q.id===btn.dataset.id);
    if(!item) return;
    if(confirm('이 질문을 삭제하시겠습니까?')){
      qnaState.questions = qnaState.questions.filter(q=>q.id!==item.id);
      qnaOpenIds.delete(item.id);
      if(qnaRecoQuestionId === item.id) qnaRecoQuestionId = null;
      qnaSaveState(); qnaRenderAll();
    }
  }
});
document.getElementById('qnaSearchInput').addEventListener('input', (e)=>{
  qnaSearchQuery = e.target.value;
  document.getElementById('qnaMain').innerHTML = qnaRenderMain();
  // AI 업무 제안 패널은 검색 중에는 그대로 두고, 지금 보고 있던 질문 기준 제안을 유지한다.
});

// AI 업무 제안 패널의 실행하기/완료/제외/되돌리기 — 질문마다 별도로 상태를 저장한다.
document.getElementById('qnaRecoBody').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(!['ai-start','ai-done','ai-exclude','ai-undo'].includes(action)) return;
  const q = qnaState.questions.find(x => x.id === btn.dataset.qid);
  if(!q) return;
  if(!q.actionStates || typeof q.actionStates !== 'object') q.actionStates = {};
  const aid = btn.dataset.aid;
  if(action === 'ai-start'){
    qnaShowToast('실행을 시작하세요');
    return;
  }
  if(action === 'ai-done') q.actionStates[aid] = 'done';
  else if(action === 'ai-exclude') q.actionStates[aid] = 'excluded';
  else if(action === 'ai-undo') delete q.actionStates[aid];
  qnaSaveState();
  qnaRenderRecoPanel();
});

qnaRenderAll();
</script>
